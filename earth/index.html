<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>지학 기출 서재</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --paper:#F6F5F1; --card:#FFFFFF; --ink:#16181B; --muted:#6E7278; --line:#E3E2DC;
  --blue:#1F3A5F; --teal:#2E7D6F; --red:#B03A2E; --amber:#C8891B; --violet:#5B4B8A;
  --hi:#F2C230;
  --r:10px; --pad:14px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.45;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hide{display:none!important}

/* ---------- shell ---------- */
#lib{max-width:1100px;margin:0 auto;padding:0 var(--pad) 90px}
.top{position:sticky;top:0;z-index:20;background:var(--paper);padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:baseline;gap:10px;padding:16px 0 8px}
.brand h1{font-size:19px;margin:0;letter-spacing:-.02em}
.brand .sub{font-size:12px;color:var(--muted)}
.brand .spacer{flex:1}
.chip{font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.err{color:var(--red)}
.chip.exam{color:var(--red);background:#FBEDEB;border:1px solid #EBCBC6;border-radius:6px;
  padding:1px 6px;font-weight:800}
.tokin{width:100%;box-sizing:border-box;padding:7px 9px;font-size:13px;
  border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tokmsg{margin-top:8px;font-size:11.5px;color:var(--muted);min-height:14px}
.iconbtn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--card)}

/* progress spectrum — 535 cells */
.spectrum{display:grid;grid-template-columns:repeat(auto-fill,minmax(0,1fr));
  grid-auto-rows:10px;gap:1px;margin:6px 0 10px;
  grid-template-columns:repeat(107,1fr)}
.spectrum i{background:#DEDDD6;border-radius:1px;display:block}
.spectrum i.O.r1{background:#9CCCBE} .spectrum i.O.r2{background:#5FA695} .spectrum i.O.r3{background:#2E7D6F}
.spectrum i.X.r1{background:#E4A29A} .spectrum i.X.r2{background:#CD6A5B} .spectrum i.X.r3{background:#8E2A1F}
.spectrum i.Q.r1{background:#EBCF95} .spectrum i.Q.r2{background:#D8A945} .spectrum i.Q.r3{background:#A8710D}
.spectrum i.P.r1,.spectrum i.P.r2,.spectrum i.P.r3{background:var(--ink)}   /* P(패스) = 검정 · 회독 단계 없음 */
.spectrum i.W{background:#F3E39A}   /* 덜약점 = 연노랑(마지막 마크 색을 덮는다) · weakState 참조 */
#dl{font-size:12px;color:var(--blue);background:#F2F6FB;border:1px solid #C6D2E0;
  border-radius:8px;padding:7px 11px;margin:2px 0 8px}
#dl.err{color:var(--red);background:#FDF3F1;border-color:#EBC9C4}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.legend b{font-weight:600;color:var(--ink)}
.dotL{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:-1px;margin-right:4px}

/* filters */
.filters{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#fBig{flex-wrap:wrap;overflow:visible;align-items:center;align-content:flex-start}
#fEtc{flex-wrap:wrap;overflow:visible;align-items:center}
.tag.tw{background:#FDF1E7;border-color:#E8C4A0;color:#A65B12;font-weight:700}
.row .chip{flex:none}
#fBig .chip{flex:none;max-width:none}
.filters{max-height:42vh;overflow-y:auto;overscroll-behavior:contain}
.row::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.6;margin-left:4px;font-size:11px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);font:inherit;font-size:14px}
.count{font-size:12px;color:var(--muted);padding:10px 2px 6px;display:flex;gap:10px;align-items:center}
.count .spacer{flex:1}

/* list */
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.item:active{background:#FAFAF7}
.num{font:600 12px/1.5 var(--mono);color:var(--muted);min-width:30px;text-align:right;padding-top:2px}
.body{flex:1;min-width:0}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.tag{font-size:10.5px;padding:1.5px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.Ec{color:var(--blue);border-color:#C6D2E0;background:#F2F6FB}
.tag.Hw{color:var(--violet);border-color:#D3CCE6;background:#F5F3FB}
.tag.Self{color:var(--muted)}
.tag.lv상{color:var(--red);border-color:#EBC9C4;background:#FDF3F1}
.tag.lv중{color:var(--amber);border-color:#EBDBBF;background:#FCF7EC}
.tag.past{color:var(--teal);border-color:#C3DDD6;background:#F0F7F5}
.tag.code{font-family:var(--mono);font-size:10px;letter-spacing:.02em}
.star{color:var(--hi);font-size:12px}
.sub{font-size:12px;color:var(--muted)}
.tag.gp{background:#F4F0FA;color:#5B4B8A;border-color:#DCD3EC;font-weight:600}
.tag.qt{background:#EEF6EE;color:#2C6B45;border-color:#C8DFD0;font-weight:600}
.tag.qt.dr{background:transparent;color:#A9ACB1;border-style:dashed;font-weight:500}
.cmt{font-size:14px;font-weight:700;color:#16181B;margin-left:2px;cursor:pointer;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmt.empty{font-size:10.5px;font-weight:500;color:#C2C5CA;border:1px dashed var(--line);
  border-radius:5px;padding:1.5px 6px}
.item:hover .cmt.empty{color:#8E9298}
.prev{font-size:13px;color:#3A3D42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mk{display:flex;flex-direction:column;gap:2px;align-items:flex-end;flex:none;margin-top:1px;min-width:24px}
.mk .h{display:flex;gap:2px;align-items:center}
.mk .h b{font:600 9px/1 var(--mono);color:#A9ACB1;width:7px;text-align:right}
.mk .h i{width:15px;height:15px;border-radius:4px;font:600 9.5px/15px -apple-system,sans-serif;
  text-align:center;font-style:normal;color:#fff}
.mk .h i.O{background:var(--teal)} .mk .h i.X{background:var(--red)} .mk .h i.Q{background:var(--amber)} .mk .h i.P{background:var(--ink)}
.mk .add{width:22px;height:22px;border-radius:6px;border:1px dashed var(--line);color:#B9BCC1;
  font-size:13px;line-height:20px;text-align:center}
.mk .tm{font:500 9.5px/1 var(--mono);color:#A9ACB1}
.grouphd{font-size:12px;font-weight:700;color:var(--muted);padding:16px 2px 7px;letter-spacing:.02em}
.ghbtn{margin-left:8px;padding:1px 9px;font-size:10.5px;border:1px solid rgba(128,128,128,.45);border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;vertical-align:1px}
.ghbtn:hover{color:var(--teal);border-color:var(--teal)}
#navTg{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:58;width:24px;height:66px;border:1px solid var(--line);border-left:none;border-radius:0 10px 10px 0;background:var(--card);color:var(--muted);font-size:13px;cursor:pointer;box-shadow:1px 0 6px rgba(0,0,0,.08)}
#navTg:hover{color:var(--teal)}
#navdr{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:59;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.14)}
.ndhead{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 8px 12px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.ndlist{flex:1;overflow-y:auto;padding:4px 0;overscroll-behavior:contain}
.ndrow{display:flex;gap:6px;align-items:baseline;padding:5px 10px 5px 10px;font-size:11.5px;cursor:pointer;line-height:1.4;border-left:3px solid transparent}
.ndrow:hover{background:rgba(128,128,128,.1)}
.ndrow.cur{background:rgba(46,125,111,.12);border-left-color:var(--teal)}
.ndno{min-width:24px;text-align:right;color:var(--muted);font-weight:700}
.ndt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.ndm{font-weight:800;font-size:11px}
.ndmO{color:var(--teal)}.ndmQ{color:var(--amber)}.ndmX{color:var(--red)}.ndmP{color:var(--ink)}
.ndtail{display:flex;gap:5px;align-items:center;flex:none}
.ndw{width:7px;height:7px;border-radius:50%;background:#F3E39A;border:1px solid #D9C45A;display:inline-block}
.ndc{font-size:11px;padding:0 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);line-height:16px;cursor:pointer;font-weight:500}
.ndc.on{border-color:var(--blue);background:#EEF4FF}
#ndPop{position:fixed;z-index:61;width:clamp(150px,calc(100vw - 250px),280px);background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:8px 10px;font-size:12.5px;line-height:1.5}
#ndPop b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
#ndPop .txt{word-break:break-word;white-space:pre-wrap;font-weight:600}
#ndPop .fix{display:inline-block;margin-top:6px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;font-size:11.5px;color:var(--blue);background:var(--card)}
.frmpanel{max-height:82vh;overflow-y:auto}
.frmh{font-size:12.5px;margin:14px 0 6px;color:var(--muted)}
.frmrow{position:relative;border:1px solid rgba(128,128,128,.28);border-radius:9px;padding:9px 11px;margin:0 0 7px}
.frmrow.frokay{border-color:var(--teal)}
.frmrow.frmiss{border-color:var(--red)}
.frf{font-size:13.5px;line-height:1.55}
.frc{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.frdot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%}
.frdot.frO{background:var(--teal)}
.frdot.frX{background:var(--red)}
.mcsvg{border:1px solid rgba(128,128,128,.28);border-radius:9px;padding:8px;background:#fff;margin:0 0 8px}
.mcsvg svg{max-width:100%;height:auto}
.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

/* ---------- viewer ---------- */
#view{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column}
.vtop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;
  border-bottom:1px solid var(--line);background:var(--paper);flex:none}
.vtop .title{flex:1;min-width:0}
.vtop .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .t2{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tm{font:600 14px/1 var(--mono);padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);min-width:56px;text-align:center}
#tm.off{color:#B9BCC1;border-style:dashed}
.histrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.histrow .rn{font:600 12px/1 var(--mono);color:var(--muted);width:38px}
.histrow .sel{display:flex;gap:5px;flex:1}
.histrow .sel button{flex:1;padding:6px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--card)}
.histrow .sel button.on{color:#fff;border-color:transparent}
.histrow .sel button.on[data-m=O]{background:var(--teal)}
.histrow .sel button.on[data-m=X]{background:var(--red)}
.histrow .sel button.on[data-m=Q]{background:var(--amber)}
.histrow .sel button.on[data-m=P]{background:var(--ink)}
.histrow .rm{color:#B9BCC1;font-size:16px;padding:0 4px}
.histrow .sec{font:500 11px/1 var(--mono);color:var(--muted);width:44px;text-align:right}
.stage{flex:1;overflow:auto;background:#8E8E88;display:flex;justify-content:center;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.stage.lock{overflow:hidden}
.wrap{position:relative;margin:10px auto;box-shadow:0 2px 14px rgba(0,0,0,.25);background:#fff;height:max-content}
.wrap canvas{display:block;position:absolute;top:0;left:0}
#inkc{touch-action:none}
#inkc.pen{touch-action:auto}
#pdfc{position:relative!important}
#mask{position:absolute;background:#EDECE6;border:1px solid #C4C2B9;border-radius:3px;
  display:grid;place-items:center;font-size:11px;color:#8A8880;cursor:move;z-index:5;
  touch-action:none;user-select:none}
#mask.drag{background:#E2E6EC;border-color:var(--blue);opacity:.9}
#mask .grip{position:absolute;right:-1px;bottom:-1px;width:22px;height:22px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 48%,#9A988F 48%,#9A988F 60%,transparent 60%,transparent 70%,#9A988F 70%,#9A988F 82%,transparent 82%)}
#mask .lbl{pointer-events:none;font-size:10.5px}
#omrPad{position:absolute;display:none;gap:6px;z-index:6;touch-action:manipulation}
#omrPad.show{display:flex}
#omrPad button{width:44px;height:44px;border-radius:9px;border:1px solid #C4C2B9;
  background:rgba(255,255,255,.96);color:var(--ink);font-size:17px;
  box-shadow:0 1px 5px rgba(0,0,0,.18);display:grid;place-items:center}
#omrPad button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
#omrPad .ogrip{width:26px;height:44px;border-radius:9px;border:1px solid #C4C2B9;
  background:rgba(255,255,255,.96);color:#8A8880;font-size:14px;cursor:move;
  box-shadow:0 1px 5px rgba(0,0,0,.18);display:grid;place-items:center;touch-action:none;user-select:none}
#omrPad.drag .ogrip{background:#E2E6EC;border-color:var(--blue)}
.brk{flex-basis:100%;height:0;margin:0}
.tag.vm{padding:1.5px 5px;letter-spacing:1px}
.tag.vm b{font-weight:700}
.vmO{color:var(--teal)} .vmX{color:var(--red)} .vmQ{color:var(--amber)} .vmP{color:var(--ink)}
.chip.sm{font-size:11.5px;padding:3px 9px;color:var(--muted);border-style:dashed}
.chip.sm.on{color:var(--paper);border-style:solid}
#omrPad.cover{background:#EDECE6;border:1px solid #C4C2B9;border-radius:11px;padding:4px}
#omrPad button.hit{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
#omrPad button.miss{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.vbot{flex:none;background:var(--paper);border-top:1px solid var(--line);
  padding:7px 8px calc(env(safe-area-inset-bottom) + 7px)}
.tools{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tl{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;flex:none;font-size:13px}
.tl.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
#mP{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}   /* P = 검정 바탕 흰 글자 */
#mP.on{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.sw{width:20px;height:20px;border-radius:50%}
.tl.hl .sw{border-radius:3px;height:11px}
.sep{width:1px;height:22px;background:var(--line);flex:none;margin:0 3px}
.tl.wide{width:auto;padding:0 10px;font-size:12px;gap:5px}
select.tl{width:auto;padding:0 6px;font-size:12px;-webkit-appearance:none;text-align:center}

/* sheets */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(20,20,20,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:86vh;overflow:auto}
.panel h2{font-size:16px;margin:0 0 4px}
.panel p{font-size:13px;color:var(--muted);margin:0 0 14px}
.panel .fld{margin-bottom:14px}
.panel label{font-size:12px;font-weight:600;display:block;margin-bottom:5px}
.btn{display:block;width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);font-size:14px;margin-bottom:7px;text-align:center}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:7px 14px;font-size:13px;margin:0}
.filelist{font-size:12.5px;color:var(--muted);font-family:var(--mono);line-height:1.8}
.filelist b{color:var(--teal)} .filelist s{color:var(--red);text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);
  background:rgba(22,24,27,.93);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:99}
.thsheet .panel{max-height:92vh;border-radius:16px 16px 0 0}
.thtabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}
.thtabs::-webkit-scrollbar{display:none}
.thtabs button{white-space:nowrap;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  font-size:12.5px;color:var(--muted);background:var(--card)}
.thtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.thsec h3{font-size:13px;color:var(--blue);margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.thl{font-size:13.5px;line-height:1.7;padding:1px 0;word-break:break-word}
.thl.i1{padding-left:14px} .thl.i2{padding-left:28px} .thl.i3{padding-left:42px} .thl.i4{padding-left:56px}
.thl.star{background:#FDF8E8;border-left:2px solid var(--hi);padding-left:8px;margin-left:-2px;border-radius:0 4px 4px 0}
.thl.star.i1{padding-left:22px} .thl.star.i2{padding-left:36px} .thl.star.i3{padding-left:50px}
.tag.vlt{background:#EEF2FF;color:#4338CA}
 .tag.sol{background:#FFF7ED;color:#C2410C;border-color:#F0D6BC}
 .solpic{width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin:8px 0;background:#fff}
 .twbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;margin-top:10px}
 .twbox canvas{display:block;width:100%}
 .twnote{font-size:13px;font-weight:600;background:var(--paper);border-radius:8px;padding:8px 10px;margin:-6px 0 4px;word-break:break-word}
 /* 코멘트 시트 안 검색 결과 */
 .ntres{margin-top:8px;max-height:40vh;overflow:auto}
 .ntres .rh{font-size:11.5px;color:var(--muted);margin:4px 0}
 .ri{display:flex;gap:6px;align-items:center;width:100%;text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:4px;font-size:12.5px;background:var(--card)}
 .ri.me{border-color:var(--blue)}
 .ri b{color:var(--blue);min-width:30px}
 .ri .rs{color:var(--muted);white-space:nowrap;max-width:34%;overflow:hidden;text-overflow:ellipsis}
 .ri .rx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .ri mark{background:#FDE68A;color:inherit;padding:0 1px}

/* ═══════ 지학 층 (2026-09-04) ═══════ */
:root{--sea:#1F5F8B;--sea-soft:#E3EEF6;--sand:#B9853A;--sand-soft:#FBF3E6;--lav:#D9D2EE}
/* 물리 전용 도구는 숨긴다 — 문항 카드에는 PDF·필기·가리개·OMR 이 없다 */
.stage,#navdr,#tLayer,#tLayerAdd,#tLayerEye,#tTheory,#tConcept,#tSol,#tAns,#tLock,#tRot,#tZoom,#tTwin,#tGpt,#tType,#tCard,#tErase,#tUndo,#tW,
.tools [data-pen],.tools [data-hl],#btnFormula,#btnConcept,#mask,#omrPad{display:none!important}
.tools .sep:first-of-type,.tools .sep:nth-of-type(2){display:none}
/* 목록 배지 · 색 */
.item.eg .num{color:var(--teal)} .item.ec .num{color:var(--muted)}
.tag.tg{background:#E6F2EE;color:#1B7F4B;border-color:#BFE0D2} .tag.tc{background:#F0F0EE;color:#6E7278}
.tag.unit{background:var(--sea-soft);color:var(--sea);border-color:#BFD3E6;cursor:pointer}
.tag.page{background:var(--sand-soft);color:#7A5520;border-color:#E9D5B5;cursor:pointer}
.tag.match{background:#FFF7D6;color:#7A5520;border-color:#E9D5B5;cursor:pointer} .tag.match.sm{padding:1px 5px}
.tag.sub{cursor:pointer}
select.rsel{padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:inherit;font-size:11px;font-weight:700;color:var(--muted)}
.num{min-width:58px;font-size:11px}
/* 뷰어 = 카드 + 교재 패널 */
#ebody{flex:1;display:flex;min-height:0;background:var(--paper)}
#cardwrap{flex:1;overflow:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch}
#card{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px 12px}
.cmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
.cmeta .sp,.sp{flex:1}
.cmeta .cmark b{font-weight:800}
#card .q{font-size:15.5px;line-height:1.6;margin:6px 0 12px;white-space:pre-wrap}
#card .fig{border:1px solid var(--line);border-radius:8px;padding:6px;margin:6px 0 12px;background:#fff;text-align:center;min-height:40px}
#card .fig img{max-width:100%;height:auto;display:block;margin:0 auto}
#card .fig .ld{font-size:12px;color:var(--muted)}
.bogi{border-top:1px solid var(--line);margin-top:4px}
.bogi .row{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.bogi .k{font-weight:700;width:20px;flex:none;margin-top:2px}
.bogi .t{flex:1;font-size:14px;line-height:1.55}
.ox{display:flex;gap:4px;flex:none}
.ox button{width:32px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:700;color:#98A2AD}
.ox button.O.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ox button.Q.on{background:var(--amber);color:#fff;border-color:var(--amber)}
.ox button.X.on{background:var(--red);color:#fff;border-color:var(--red)}
.bogi .row.wrong .t{color:var(--red);font-weight:600} .bogi .row.right .t{color:var(--teal)}
.choices{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 6px}
.choices button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:left;font-size:13.5px}
.choices button.pick{border-color:var(--sea);background:var(--sea-soft);color:var(--sea);font-weight:700}
.choices button.ans{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
#card details{margin-top:10px;font-size:13.5px} #card summary{cursor:pointer;color:var(--sea);font-weight:600}
#card .sol{padding:10px 12px;background:#F7F9FB;border-radius:8px;margin-top:6px;line-height:1.6}
#card .soltx{margin-top:6px} #card .jump{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
#card .cnote{margin-top:8px;font-size:11.5px;color:var(--muted)}
.cnav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.cnav button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px}
/* 교재 패널 */
#bookpane{width:400px;flex:none;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
#bookpane .btabs{display:flex;border-bottom:1px solid var(--line);align-items:center}
#bookpane .btabs b{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
#bookpane .btabs b.on{color:var(--ink);border-bottom:2px solid var(--sea)}
#bookpane .btabs button{margin-left:auto;padding:6px 10px;color:var(--muted);display:none}
.pgbar{display:flex;align-items:center;gap:6px;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pgbar input{width:52px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:3px;font:inherit}
.pgbar small{color:var(--muted)} .pgbar button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 8px;font-size:12px}
#bpview{flex:1;overflow:auto;padding:6px;background:#EDECE6;position:relative}
#bpc{display:block;margin:0 auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2);max-width:100%}
#bpMsg{font-size:12px;color:var(--muted);padding:6px;text-align:center}
#bpList{max-height:34%;overflow:auto;padding:8px 10px;font-size:12.5px;border-top:1px solid var(--line)}
#bpList h5{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
#bpList div{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);cursor:pointer;align-items:center}
#bpList .me{color:var(--sea);font-weight:700}
@media (max-width:899px){
  #bookpane{position:fixed;left:0;right:0;bottom:0;height:72vh;width:auto;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;
    box-shadow:0 -4px 18px rgba(0,0,0,.18);z-index:64;transform:translateY(105%);transition:transform .22s}
  #bookpane.open{transform:none} #bookpane .btabs button{display:block}
}
/* 목차 트리 서랍 */
#tree{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:62;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.14)}

#tree .trhead button{padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px;background:var(--card)}
#trlist{flex:1;overflow-y:auto;padding:4px 0;font-size:12px;overscroll-behavior:contain}
#trlist>div{display:flex;gap:6px;align-items:center;padding:3px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trlist>div:hover{background:rgba(128,128,128,.1)}
.trch{font-weight:700;margin-top:6px} .trsec{padding-left:18px!important;font-weight:600;color:#33404D} .trit{padding-left:32px!important;color:#4A5661}
.trit.unm{color:var(--muted);font-style:italic}
.trit.hit{background:var(--sea-soft);color:var(--sea);font-weight:700}
#trlist .n{margin-left:auto;font-size:10.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#DDD;flex:none}
.dot.g{background:var(--teal)}.dot.y{background:var(--amber)}.dot.r{background:var(--red)}.dot.k{background:var(--ink)}
#trq{max-height:38%;overflow-y:auto;border-top:1px solid var(--line);font-size:11.5px}
.trqh{padding:6px 12px;font-size:11px;font-weight:700;color:var(--muted)}
.trqr{display:flex;gap:6px;align-items:baseline;padding:4px 10px;cursor:pointer;border-left:3px solid transparent}
.trqr.cur{background:rgba(46,125,111,.12);border-left-color:var(--teal)}
/* 서브노트 한 판 */
#sub{position:fixed;inset:0;z-index:80;background:#DFE3E7;display:block;overflow:hidden}
#sub .shead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;background:#fff;border-bottom:1px solid var(--line);height:auto}
#sub .shead b{font-size:14px}
#schips{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1}
#schips span{border:1px solid var(--line);background:#FAFAFA;border-radius:12px;padding:2px 9px;font-size:11.5px;cursor:pointer;white-space:nowrap;user-select:none}
#schips span.ch{font-weight:700;background:var(--sea-soft);border-color:var(--sea);color:var(--sea)} #schips span.no{opacity:.4}
#sinfo{font-size:11px;color:var(--muted);white-space:nowrap}
#svp{position:absolute;top:46px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;touch-action:none}
#svp.panning{cursor:grabbing} #svp.pen{cursor:crosshair}
#sworld{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stiles{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.spg{position:absolute;width:1191px;height:842px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.spg .sink{position:absolute;left:0;top:0;pointer-events:none}
.scol{position:absolute;top:0;height:842px;border-right:1px dashed rgba(31,95,139,.25);cursor:pointer}

.szoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;z-index:2}
.szoom .btns{display:flex;gap:4px} .szoom button{width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:15px}
.szoom button.w{width:auto;padding:0 10px;font-size:12px} .szoom .pct{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.smini{position:absolute;left:14px;bottom:14px;width:200px;height:100px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;overflow:hidden;z-index:2}
.smini i{position:absolute;background:#E9EBEE;border:1px solid #C7CED6} .smini .view{position:absolute;border:1.5px solid var(--sea);background:rgba(31,95,139,.08)}
.stools{position:absolute;right:14px;top:56px;display:flex;gap:4px;z-index:2}
.stools span{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 9px;font-size:12px;cursor:pointer;user-select:none}
.stools span.on{background:var(--sea);border-color:var(--sea);color:#fff}
</style>

   DB 이름이 물리(phys535)와 달라 저장소가 섞이지 않는다. 데이터·그림·교재 조각·기록은 전부 비공개 studyplandata 의 earth/ 아래. */

<script>
/* =======================================================================
   물리 535 서재 — 단일 HTML 학습 앱
   데이터: [no,page,file,fpage,big,sub,localNo,star,type,code,year,src,level,ans,body]
   ======================================================================= */
const F={NO:0,PG:1,FILE:2,FPG:3,BIG:4,SUB:5,LNO:6,STAR:7,TYPE:8,CODE:9,YEAR:10,SRC:11,LV:12,ANS:13,BODY:14,VLT:15};
const FILES=['111','222','333','444','555','666'];
const PAGES={'111':99,'222':107,'333':97,'444':107,'555':90,'666':49};
const MERGED_OFF={'111':0,'222':99,'333':206,'444':303,'555':410,'666':500};
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------------- IndexedDB ---------------- */
let db;
function open(){return new Promise((ok,no)=>{
  const r=indexedDB.open(EARTH.DB,1);
  r.onupgradeneeded=e=>{const d=e.target.result;
    d.createObjectStore('pdf');d.createObjectStore('ink');d.createObjectStore('kv');};
  r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>no(r.error);});}
function tx(s,m){return db.transaction(s,m).objectStore(s)}
function get(s,k){return new Promise(ok=>{const r=tx(s,'readonly').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}
function put(s,k,v){return new Promise(ok=>{const r=tx(s,'readwrite').put(v,k);r.onsuccess=()=>ok(1);r.onerror=()=>ok(0)})}
function del(s,k){return new Promise(ok=>{const r=tx(s,'readwrite').delete(k);r.onsuccess=()=>ok(1);r.onerror=()=>ok(0)})}
function keys(s){return new Promise(ok=>{const r=tx(s,'readonly').getAllKeys();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])})}
function all(s){return new Promise(ok=>{const r=tx(s,'readonly').getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])})}

/* ---------------- 상태 ---------------- */
let ST={};            // no -> {h:[{m:'O'|'X'|'Q', t:ts, s:초}]}
let SET={rot:{},zoom:1,mask:true,maskH:1,pencil:false,timer:true,autoNext:false,omrMask:true};
let MPOS={};          // no -> {u,v,w,h}  가리개 수동 위치
let OPOS={};          // no -> {u,v}  OMR 패드 수동 위치 · 'def' 는 다음 문항 기본값
const TYPES=['공식','계산','함정','개념'];
const TD={};
let QT={};
const typeOf=no=>QT[no]||TD[no]||[];
const typeFixed=no=>!!QT[no];
const saveQT=()=>put('kv','qtype',QT);
let CMT={};           // no -> '한줄 코멘트'  (kv/note · 백업에 함께 실린다)
/* ⚠ 이름은 CMT 다. NOTE 는 아래에서 옵시디언 목차 경로가 이미 쓰고 있다 */
const noteOf=no=>CMT[no]||'';
const saveNote=()=>put('kv','note',CMT);

const RENUM_V=0;   /* 지학: 번호 재배열 없음 */
const OLD2NEW={};
async function renumber(){
  if((SET.renum||0)>=RENUM_V) return 0;
  const ns={};
  for(const k in ST){const n=OLD2NEW[k]; if(n) ns[n]=ST[k];}
  ST=ns;
  const np={};
  for(const k in MPOS){const n=OLD2NEW[k]; if(n) np[n]=MPOS[k];}
  MPOS=np;
  const op={};
  for(const k in OPOS){ if(k==='def'){op.def=OPOS.def;continue} const n=OLD2NEW[k]; if(n) op[n]=OPOS[k]; }
  OPOS=op;
  const ks=await keys('ink'), vs=await all('ink'), buf=[];
  for(let i=0;i<ks.length;i++){const n=OLD2NEW[String(ks[i])]; if(n) buf.push([String(n),vs[i]]);}
  for(const k of ks) await del('ink',k);
  for(const [k,v] of buf) await put('ink',k,v);
  SET.renum=RENUM_V;
  await saveST(); await put('kv','maskpos',MPOS); await put('kv','omrpos',OPOS); await put('kv','set',SET);
  return buf.length+Object.keys(ST).length;
}
/* 예전 형식({m,r}) → 회독 기록 배열로 옮김 */
function migrate(){
  let ch=0;
  for(const k in ST){const v=ST[k];
    if(v&&!v.h){const n=Math.max(1,v.r||1),h=[];
      for(let i=0;i<n;i++)h.push({m:i===n-1?v.m:'O',t:v.t||Date.now()});
      ST[k]={h};ch=1}}
  return ch;
}
const hist=no=>((ST[no]||{}).h)||[];
const lastM=no=>{const h=hist(no);return h.length?h[h.length-1].m:''};
/* ★ 약점 · 덜약점 — 이력에서 그릴 때 계산한다(저장 안 함 · 새 키 없음). 조판기 1차객 5상태 규칙.
   h 를 앞에서부터 걸으며  X·Q → 약점 / 약점에서 O → 덜약점 / 덜약점에서 O → 졸업(없음) / P 는 건너뜀.
   진리표(W-1):  []→''  [O]→''  [X]→weak  [Q]→weak  [X,O]→less  [X,O,O]→''  [X,O,X]→weak
                 [X,P]→weak  [X,O,P]→less  [X,O,P,O]→''  [P]→''  [O,Q,O]→less */
const weakState=no=>{let s='';
  for(const x of hist(no)){const m=x.m;
    if(m==='X'||m==='Q')s='weak';
    else if(m==='O'){if(s==='weak')s='less';else if(s==='less')s=''}
    /* P 와 그 밖의 값은 상태를 밀지 않는다 */}
  return s};
/* 넷째 마크 P = 패스 · 풀 수 있지만 계산이 긴 문제. 틀린 것·again·약점 어디에도 안 센다(2026-09-04). */
const MLABEL={O:'맞음',Q:'헷갈림',X:'틀림',P:'패스'};
const mGlyph=m=>m==='Q'?'\u25B3':m;
const reps=no=>hist(no).length;
const lastSec=no=>{const h=hist(no);for(let i=h.length-1;i>=0;i--)if(h[i].s)return h[i].s;return 0};
const secFmt=x=>Math.floor(x/60)+"'"+String(x%60).padStart(2,'0')+'"';
const saveST=()=>put('kv','status',ST);
let HAVE={};          // fileId -> true  (등록된 PDF)
let MERGED=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const toast=(m,ms=1600)=>{const d=document.createElement('div');d.className='toast';d.textContent=m;
  document.body.appendChild(d);setTimeout(()=>d.remove(),ms)};

/* ---------------- 필터 ---------------- */
const BIGS=[...new Set(DATA.map(r=>r[F.BIG]))];
const BIGNO={'역학':'1','유체역학':'2','열역학':'3','파동·광학':'4','전자기학':'5','현대물리학':'6'};
const bigLabel=b=>(BIGNO[b]?BIGNO[b]+'. ':'')+b;
let FL={bigs:[],subs:[],lv:'',type:'',past:'',star:false,mark:'',q:'',cp:[],year:''};
const PYEARS=[...new Set(DATA.filter(r=>r[F.SRC]==='변리사').map(r=>r[F.YEAR]))].sort();

function pass(r){
  if(FL.bigs.length&&!FL.bigs.includes(r[F.BIG]))return 0;
  if(FL.subs.length&&!FL.subs.includes(r[F.SUB]))return 0;
  if(FL.lv&&r[F.LV]!==FL.lv)return 0;
  if(FL.type&&r[F.TYPE]!==FL.type)return 0;
  if(FL.past==='y'&&r[F.SRC]!=='변리사')return 0;
  if(FL.past==='p'&&(!r[F.SRC]||r[F.SRC]==='변리사'))return 0;
  if(FL.past==='n'&&r[F.SRC])return 0;
  if(FL.year&&!(r[F.SRC]==='변리사'&&String(r[F.YEAR])===FL.year))return 0;
  if(FL.cp.length&&!(CL[r[F.CODE]]||[]).some(k=>FL.cp.includes(k)))return 0;
  if(FL.star&&!r[F.STAR])return 0;
  const m=lastM(r[F.NO]);
  if(FL.mark==='new'&&m)return 0;
  if(FL.mark==='again'&&hist(r[F.NO]).filter(x=>x.m==='X').length<2)return 0;
  if(FL.mark==='weak'&&weakState(r[F.NO])!=='weak')return 0;
  if(FL.mark==='less'&&weakState(r[F.NO])!=='less')return 0;
  if(FL.mark==='note'&&!noteOf(r[F.NO]))return 0;
  if(FL.mark&&!['new','again','weak','less','note'].includes(FL.mark)&&m!==FL.mark)return 0;   /* O·Q·X·P = 마지막 마크 */
  if(FL.q){const s=FL.q.toLowerCase();
    if(!(r[F.CODE].toLowerCase().includes(s)||r[F.SUB].includes(FL.q)||r[F.BODY].includes(FL.q)||noteOf(r[F.NO]).includes(FL.q)||typeOf(r[F.NO]).some(t=>t===FL.q)||gptOf(r[F.NO]).includes(FL.q)||String(r[F.NO])===FL.q||String(r[F.VLT])===FL.q))return 0;}
  return 1;
}
const filtered=()=>DATA.filter(pass);

/* ---------------- 서재 렌더 ---------------- */
function chip(label,on,fn,sub){
  const b=document.createElement('button');b.className='chip'+(on?' on':'');
  b.innerHTML=label+(sub!=null?` <small>${sub}</small>`:'');b.onclick=fn;return b;}

function drawFilters(){

      FL.subs=FL.subs.filter(x=>live.includes(x));   /* 닫은 대단원의 소단원 선택은 푸다 */
      draw()},DATA.filter(r=>r[F.BIG]===b).length));
    if(FL.bigs.includes(b)){             /* 고른 대단원 바로 아래 줄에 소단원 — 여러 개를 동시에 텸 수 있다 */
      const brk=()=>{const d=document.createElement('div');d.className='brk';return d};
      [...new Set(DATA.filter(r=>r[F.BIG]===b).map(r=>r[F.SUB]))].forEach(sv=>{
        const x=chip(sv,FL.subs.includes(sv),()=>{FL.subs=tog(FL.subs,sv);draw()},
          DATA.filter(r=>r[F.SUB]===sv).length);
        x.classList.add('sm');a.appendChild(x)});
      a.appendChild(brk());
    }});
  const e=$('#fEtc');e.innerHTML='';
  [['상','lv'],['중','lv'],['하','lv']].forEach(([v,k])=>e.appendChild(chip(v,FL[k]===v,()=>{FL[k]=FL[k]===v?'':v;draw()})));
  e.appendChild(chip('변리사 기출',FL.past==='y',()=>{FL.past=FL.past==='y'?'':'y';draw()},
    DATA.filter(r=>r[F.SRC]==='변리사').length));
  e.appendChild(chip('기본',FL.past==='n',()=>{FL.past=FL.past==='n'?'':'n';draw()},
    DATA.filter(r=>!r[F.SRC]).length));
  if(FL.past==='y'){
    PYEARS.forEach(y=>e.appendChild(chip(String(y).slice(2)+'년',FL.year===String(y),

    if(FL.year)e.appendChild(chip('📊 '+FL.year+'년 채점표',false,()=>yearSheet(FL.year)));
  } else if(FL.year){FL.year=''}
  e.appendChild(chip('★중요',FL.star,()=>{FL.star=!FL.star;draw()}));
  e.appendChild(chip('안 푼 것',FL.mark==='new',()=>{FL.mark=FL.mark==='new'?'':'new';draw()}));
  e.appendChild(chip('틀린 것',FL.mark==='X',()=>{FL.mark=FL.mark==='X'?'':'X';draw()}));
  e.appendChild(chip('헷갈림',FL.mark==='Q',()=>{FL.mark=FL.mark==='Q'?'':'Q';draw()}));
  e.appendChild(chip('두 번 이상 틀림',FL.mark==='again',()=>{FL.mark=FL.mark==='again'?'':'again';draw()}));
  /* 약점 · 덜약점 · P · 메모 있음 — 전체 DATA 기준 개수(2026-09-04) */
  const nWk=DATA.filter(r=>weakState(r[F.NO])==='weak').length, nLs=DATA.filter(r=>weakState(r[F.NO])==='less').length,
        nP=DATA.filter(r=>lastM(r[F.NO])==='P').length, nNt=DATA.filter(r=>noteOf(r[F.NO])).length;
  const mchip=(lab,k,n)=>e.appendChild(chip(lab,FL.mark===k,()=>{FL.mark=FL.mark===k?'':k;draw()},n));
  mchip('⚠ 약점','weak',nWk);mchip('🌤 덜약점','less',nLs);mchip('P','P',nP);mchip('메모 있음','note',nNt);
  FL.cp.forEach(k=>e.appendChild(chip('◆ '+(CB[k]?CB[k].t:k),true,
    ()=>{FL.cp=FL.cp.filter(x=>x!==k);draw()},(CQ[k]||[]).length)));
  if(FL.cp.length>1)e.appendChild(chip('개념 전체 해제',false,()=>{FL.cp=[];draw()}));
  kx(e);
}

/* 히트맵은 아래 목차 선택(대단원·소단원)만 따라간다 — 다른 필터는 무시한다 */

/* 볼트 풀이 노트 파일명 끝의 과거 기록(O X Δ). 예 "PA1508하-PV그래프 XO" → XO */
function vaultMark(no,vlt){
  const s=(SOL[vlt]||{}).f||'';
  const m=s.match(/(?<![A-Za-z])[OXP\u0394]+(?=[^A-Za-z\uAC00-\uD7A3]*$)/);
  return m?m[0]:'';
}
/* 볼트 파일명의 제목. "PA0706중-정지마찰계수,경사 O" → 정지마찰계수,경사 · 없으면 빈값 */
function vaultTitle(vlt){
  let s=(SOL[vlt]||{}).f||'';
  s=s.replace(/^PA\d{4}\s*[\uC0C1\uC911\uD558]?\s*-?\s*/,'');
  s=s.replace(/\s*(?<![A-Za-z])[OXP\u0394]+(\([^)]*\))?\s*$/,'');
  return s.trim();
}
let titleOf=r=>vaultTitle(r[F.VLT])||r[F.SUB];   /* 지학 층이 갈아 끼운다 */
let TW={};            // no -> [쌍둥이 문항번호] · kv/twin · 양방향으로 저장한다
const twinsOf=no=>(TW[no]||[]).filter(x=>x!==no&&rec(x));

async function twinLink(a,b,on){

}
/* 쌍둥이 미리보기 — 그 문제로 옮기지 않고 팝업으로 보여 준다 */
/* 쌍둥이 · 코멘트 검색 결과가 같이 쓴다 — 그림 + 코멘트 전문 + 마지막 마크. onGo = 「이 문제로 가기」 직전에 부른다(코멘트 시트 닫기) */
async function twinPeek(no,onGo){

    <div class="twbox"><canvas id="twc"></canvas></div>
    <button class="btn" id="twGo" style="margin-top:12px">이 문제로 가기</button>
    <button class="btn pri" id="twX" style="margin-top:8px">닫기</button></div>`;
  b.querySelector('#twGo').onclick=()=>{b.remove();if(onGo)onGo();openView(no)};

/* ---------------- PDF 등록 ---------------- */
async function loadHave(){const k=await keys('pdf');HAVE={};k.forEach(x=>HAVE[x]=1);MERGED=!!HAVE['ALL'];}

/* 저장소에 함께 올려 둔 PDF를 받아 온다 — 기기마다 다시 넣지 않아도 되게
   ⚠ 교재 PDF 는 **비공개** `zzikkaplan/studyplandata` 에 있다. 공개 genie 에는 못 올린다.
     그래서 Pages 의 상대경로가 아니라 Contents API + 토큰으로 받는다.
   ⚠ Accept 는 반드시 `vnd.github.raw` — `vnd.github+json` 은 1MB 를 넘으면 `content` 가
     안 온다(민법 2026-08-31 실측 1,116바이트). 여섯 개가 다 6MB 이상이다. */
const PDF_DIR=EARTH.PDF_DIR;
const PDF_META=PDF_DIR+'시험지메타.json';
async function tryRemote(url,key){
  try{
    const r=await fetch(ghUrl(PDF_DIR+url+'.pdf'),
      {headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github.raw'},cache:'no-store'});
    if(!r.ok)return 0;
    const buf=await r.arrayBuffer();
    const head=String.fromCharCode.apply(null,new Uint8Array(buf.slice(0,5)));
    if(head.indexOf('%PDF')<0)return 0;          // 404 페이지가 온 경우
    await put('pdf',key,buf);return 1;
  }catch(e){return 0}
}
/* 딱지 — 파일별 md5·크기·시각. **바뀐 것만** 받는다(정리OMR pageHash 와 같은 수법).
   ⚠ 이게 없으면 「받기」를 누를 때마다 61MB 를 통째로 다시 받는다. */
async function remoteMeta(){
  try{const t=await ghRaw(PDF_META);return t?JSON.parse(t):null}catch(e){return null}
}
async function ensureFiles(force){
  if(MERGED&&!force)return;
  const bar=$('#dl');
  /* ⚠ 토큰이 없으면 받을 길이 아예 없다 — 공개 genie 에는 PDF 가 없다.
     여섯 번 헛걸음하고 401 을 받지 말고 여기서 멈춘다. */
  if(!recToken()){
    if(force){bar.classList.remove('hide');bar.classList.add('err');
      bar.textContent='🔑 토큰이 없습니다 — 설정에서 넣으세요';
      setTimeout(()=>bar.classList.add('hide'),3000)}
    return;
  }
  const meta=await remoteMeta();
  const seen=(await get('kv','pdfhash'))||{};
  const mf=(meta&&meta.files)||null;
  const changed=f=>!!(mf&&mf[f]&&seen[f]!==mf[f].md5);
  /* 딱지가 있으면 「바뀐 것 + 없는 것」만. 딱지를 못 읽었을 때만 옛 방식(force=전부) */
  const need=FILES.filter(f=>!HAVE[f]||changed(f)||(force&&!mf));
  if(!need.length){
    if(force){bar.classList.remove('hide','err');
      bar.textContent='받아 둔 시험지가 모두 최신입니다';
      setTimeout(()=>bar.classList.add('hide'),2500)}
    return;
  }
  bar.classList.remove('hide','err');
  let got=0;
  for(let i=0;i<need.length;i++){
    bar.textContent=`시험지 받는 중 — ${i+1}/${need.length}`;
    if(await tryRemote(need[i],need[i])){got++;
      if(mf&&mf[need[i]])seen[need[i]]=mf[need[i]].md5;}
  }
  if(!got&&!HAVE['ALL']&&await tryRemote('all','ALL'))got++;
  if(got)await put('kv','pdfhash',seen);
  await loadHave();draw();renderSettings();
  if(got){bar.textContent=`시험지 ${got}개를 받았습니다`;setTimeout(()=>bar.classList.add('hide'),2500)}
  else if(force){bar.classList.add('err');
    bar.textContent='저장소에서 시험지를 받지 못했습니다 — 토큰 권한과 phys/pdf 폴더를 확인하세요';}
  else bar.classList.add('hide');
}

async function addFiles(fileList){
  for(const f of fileList){

    let id=null;

    if(!id){toast(f.name+' — 어느 파일인지 못 알아봤습니다');continue}
    await put('pdf',id,buf);
    toast((id==='ALL'?'통합본':id)+' 등록 (' + n + '쪽)');
  }
  await loadHave();renderSettings();
}

/* 좌표: 저장은 항상 회전 전 페이지 기준 정규화(u,v) → 회전해도 필기가 어긋나지 않음 */
function toNorm(x,y){const{W,H,rot}=RENDER;
  if(rot===90)return[y/H,1-x/W];
  if(rot===180)return[1-x/W,1-y/H];
  if(rot===270)return[1-y/H,x/W];
  return[x/W,y/H];}
function toPix(u,v){const{W,H,rot}=RENDER;
  if(rot===90)return[(1-v)*W,u*H];
  if(rot===180)return[(1-u)*W,(1-v)*H];
  if(rot===270)return[v*W,(1-u)*H];
  return[u*W,v*H];}

function paintInk(){
  const c=$('#inkc'),g=c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  Object.keys(INK).map(Number).sort((a,b)=>a-b).forEach(L=>{
    if(HIDEOLD&&L!==LAYER)return;
    const old=L<LAYER;
    (INK[L]||[]).forEach(s=>{
      g.save();
      g.globalAlpha=s.hl?0.32:(old?0.30:1);
      g.strokeStyle=s.c;g.lineWidth=(s.hl?9:s.w)*RENDER.scale/2;
      g.lineCap=s.hl?'butt':'round';g.lineJoin='round';
      g.beginPath();
      for(let i=0;i<s.p.length;i+=2){const[x,y]=toPix(s.p[i],s.p[i+1]);i?g.lineTo(x,y):g.moveTo(x,y)}
      g.stroke();g.restore();
    });
  });
}

/* 그리는 중에는 새로 생긴 구간만 덧그린다 — 매번 전체를 다시 그리면 끊긴다 */
function drawSeg(s,from){
  const g=$('#inkc').getContext('2d');
  g.save();
  g.globalAlpha=1;g.strokeStyle=s.c;g.lineWidth=s.w*RENDER.scale/2;
  g.lineCap='round';g.lineJoin='round';
  g.beginPath();
  for(let i=Math.max(0,from-2);i<s.p.length;i+=2){
    const[x,y]=toPix(s.p[i],s.p[i+1]);
    i===Math.max(0,from-2)?g.moveTo(x,y):g.lineTo(x,y);
  }
  g.stroke();g.restore();
}

/* ---------------- 필기 입력 ---------------- */
let drawing=null;
const inkc=()=>$('#inkc');
function local(e){const b=inkc().getBoundingClientRect();
  return[(e.clientX-b.left)/b.width*RENDER.W,(e.clientY-b.top)/b.height*RENDER.H]}

$('#inkc').addEventListener('pointerdown',e=>{
  if(SET.pencil&&e.pointerType!=='pen')return;
  if(e.pointerType==='touch'&&!SET.pencil&&e.isPrimary===false)return;
  {const lc=locate(rec(VNO)); if(lc.id!=='IMG'&&!HAVE[lc.id])return;}   /* 이미지 문항(IMG)도 필기 가능 */
  inkc().setPointerCapture(e.pointerId);
  const[x,y]=local(e);
  if(TOOL.mode==='erase'){eraseAt(x,y);drawing={erase:1};return}
  const s={c:TOOL.color,w:TOOL.w,hl:TOOL.mode==='hl'?1:0,p:[]};
  const n=toNorm(x,y);s.p.push(n[0],n[1]);
  (INK[LAYER]=INK[LAYER]||[]).push(s);drawing=s;
  e.preventDefault();
},{passive:false});

$('#inkc').addEventListener('pointermove',e=>{
  if(!drawing)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  if(drawing.erase){evs.forEach(ev=>{const[x,y]=local(ev);eraseAt(x,y)});return}
  const from=drawing.p.length;
  evs.forEach(ev=>{const[x,y]=local(ev);const n=toNorm(x,y);drawing.p.push(n[0],n[1])});
  if(drawing.hl)paintInk();else drawSeg(drawing,from);
  e.preventDefault();
},{passive:false});

function stylusGuard(e){
  const t=e.touches&&e.touches[0];
  if(!t)return;
  if(!SET.pencil){e.preventDefault();return}      // 손가락으로 필기하는 모드
  if(t.touchType==='stylus')e.preventDefault();   // 펜슬 모드: 펜슬만 막고 손가락은 스크롤
}

function eraseAt(x,y){
  const R=14*RENDER.scale/2, arr=INK[LAYER]||[];
  for(let i=arr.length-1;i>=0;i--){
    const s=arr[i];
    for(let k=0;k<s.p.length;k+=2){const[px,py]=toPix(s.p[k],s.p[k+1]);
      if(Math.hypot(px-x,py-y)<R){arr.splice(i,1);break}}
  }
  paintInk();
}

/* ---------------- 답 가리개 ----------------
   위치는 회전 전 페이지 기준 정규화 좌표로 다룬다.
   기본값은 PDF 글자층에서 '답'을 찾아 자동으로 맞추고, 끌어서 옮기면 그 문제에 저장된다. */
let MASK=null;

function cssDpr(){return RENDER.W/Math.max(1,$('#wrap').clientWidth)}
function normToCss(u,v){const d=cssDpr(),[x,y]=toPix(u,v);return[x/d,y/d]}
function cssToNorm(x,y){const d=cssDpr();return toNorm(x*d,y*d)}

async function detectAnswer(page){
  try{
    const vp=page.getViewport({scale:1,rotation:0});
    const tc=await page.getTextContent();
    let best=null;
    for(const it of tc.items){
      if(!it.str||it.str.indexOf('답')<0)continue;
      const tr=pdfjsLib.Util.transform(vp.transform,it.transform);
      const h=Math.abs(tr[3])||it.height||10;
      const x=tr[4],y=tr[5]-h;
      if(y/vp.height>0.5)continue;
      if(!best||y<best.y)best={x,y,h};
    }
    if(!best)return null;
    const u=Math.max(0,best.x/vp.width-0.012), v=Math.max(0,best.y/vp.height-0.010);
    return {u,v,w:1.002-u,h:(best.h/vp.height)*2.6};
  }catch(e){return null}
}

async function setupMask(page){
  MASK = MPOS[VNO] || (page?await detectAnswer(page):null) || {u:0.27,v:0.10,w:0.71,h:0.030};
  updateMask();
}
function updateMask(){
  const m=$('#mask');
  layoutOmr();
  if(SET.omrMask||!SET.mask||!MASK||!VNO||!HAVE[locate(rec(VNO)).id]){m.classList.add('hide');return}
  m.classList.remove('hide');
  layoutMask();
}
function layoutMask(){
  const m=$('#mask'),f=MPOS[VNO]?1:SET.maskH;
  const [ax,ay]=normToCss(MASK.u,MASK.v);
  const [bx,by]=normToCss(MASK.u+MASK.w,MASK.v+MASK.h*f);
  m.style.left=Math.round(Math.min(ax,bx))+'px';
  m.style.top=Math.round(Math.min(ay,by))+'px';
  m.style.width=Math.round(Math.abs(bx-ax))+'px';
  m.style.height=Math.round(Math.max(20,Math.abs(by-ay)))+'px';
  layoutOmr();
}

/* OMR 패드 — 가리개 사각형을 기준점으로만 쓴다. 안에 넣지 않는다.
   배율을 따로 계산하지 않고 layoutMask 와 같은 normToCss 를 쓰므로 좌표가 밀리지 않는다. */
function layoutOmr(){
  const p=$('#omrPad'); if(!p)return;
  const show = !!VNO && !!MASK && canGrade(VNO) && !$('#view').classList.contains('hide');
  p.classList.toggle('show',show);
  if(!show)return;
  const w=$('#wrap'), pw=p.offsetWidth||280, ph=p.offsetHeight||44;
  const cover=!!SET.omrMask && !!SET.mask;      // OMR 이 가리개를 겸하는 모드
  p.classList.toggle('cover',cover);
  const own=OPOS[VNO]||OPOS.def;
  let L,T;
  if(own){ const q=normToCss(own.u,own.v); L=q[0]; T=q[1]; }
  else{
    const f=MPOS[VNO]?1:SET.maskH;
    const a=normToCss(MASK.u,MASK.v), b=normToCss(MASK.u+MASK.w,MASK.v+MASK.h*f);
    const ax=a[0],ay=a[1],bx=b[0],by=b[1];
    L=Math.min(ax,bx);
    if(cover){ T=Math.min(ay,by)-4; }            // 답이 인쇄된 자리를 직접 덮는다
    else{
      T=Math.max(ay,by)+8;
      if(T+ph>w.clientHeight-4)T=Math.min(ay,by)-ph-8;
    }
  }
  T=Math.max(4,Math.min(T,Math.max(4,w.clientHeight-ph-4)));
  L=Math.max(4,Math.min(L,Math.max(4,w.clientWidth-pw-4)));
  p.style.left=Math.round(L)+'px';p.style.top=Math.round(T)+'px';
}

/* OMR 패드를 ≡ 손잡이로 끌어 옮긴다.
   저장은 회전 전 페이지 기준 정규화 좌표라 확대·회전해도 같은 자리에 붙는다.
   그 문항과 다음 문항 기본값(def)을 같이 적는다 — 475문항을 하나씩 옮기지 않게 하려는 것 */
(function omrDrag(){
  const p=$('#omrPad'), g=p.querySelector('.ogrip'); let st=null;
  g.addEventListener('pointerdown',e=>{
    try{g.setPointerCapture(e.pointerId)}catch(_){}
    st={x:e.clientX,y:e.clientY,l:p.offsetLeft,t:p.offsetTop,moved:false};
    e.preventDefault();e.stopPropagation();
  });
  g.addEventListener('pointermove',e=>{
    if(!st)return;
    const dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(!st.moved&&Math.hypot(dx,dy)<4)return;
    st.moved=true;p.classList.add('drag');
    p.style.left=(st.l+dx)+'px';p.style.top=(st.t+dy)+'px';
    e.preventDefault();
  });
  const end=async()=>{
    if(!st)return;
    const moved=st.moved; st=null; p.classList.remove('drag');
    if(!moved||!VNO)return;
    const q=cssToNorm(p.offsetLeft,p.offsetTop);
    const pos={u:q[0],v:q[1]};
    OPOS[VNO]=pos; OPOS.def=pos;
    await put('kv','omrpos',OPOS);
    toast('OMR 자리를 저장했습니다 — 다음 문항에도 같은 자리에 그대로 적용됩니다');
  };
  g.addEventListener('pointerup',end); g.addEventListener('pointercancel',end);
})();

/* 탭하면 열림 · 끌면 이동 · 오른쪽 아래 모서리로 크기 조절 */
(function maskDrag(){
  const m=$('#mask');let st=null;
  m.addEventListener('pointerdown',e=>{
    try{m.setPointerCapture(e.pointerId)}catch(_){}
    st={x:e.clientX,y:e.clientY,l:m.offsetLeft,t:m.offsetTop,
        w:m.offsetWidth,h:m.offsetHeight,
        resize:e.target.classList.contains('grip'),moved:false};
    e.preventDefault();e.stopPropagation();
  });
  m.addEventListener('pointermove',e=>{
    if(!st)return;
    const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.moved&&Math.hypot(dx,dy)<5)return;
    st.moved=true;m.classList.add('drag');
    if(st.resize){m.style.width=Math.max(30,st.w+dx)+'px';m.style.height=Math.max(16,st.h+dy)+'px'}
    else{m.style.left=(st.l+dx)+'px';m.style.top=(st.t+dy)+'px'}
    {const p=$('#omrPad');
     if(p.classList.contains('show')){p.style.left=m.offsetLeft+'px';p.style.top=(m.offsetTop+m.offsetHeight+8)+'px'}}
    e.preventDefault();
  });
  const end=async()=>{
    if(!st)return;
    const wasMove=st.moved;st=null;m.classList.remove('drag');
    if(!wasMove){m.classList.add('hide');return}     // 그냥 탭 → 답 보이기
    const l=m.offsetLeft,t=m.offsetTop,w=m.offsetWidth,h=m.offsetHeight;
    const a=cssToNorm(l,t), b=cssToNorm(l+w,t+h);
    MASK={u:Math.min(a[0],b[0]),v:Math.min(a[1],b[1]),
          w:Math.abs(b[0]-a[0]),h:Math.abs(b[1]-a[1])};
    MPOS[VNO]=MASK;await put('kv','maskpos',MPOS);
    layoutOmr();
    toast('이 문제의 가리개 위치를 저장했습니다');
  };
  m.addEventListener('pointerup',end);m.addEventListener('pointercancel',end);
})();

/* ---------------- 유형 칩 ----------------
   TD 는 풀이 노트에서 낱말로 뽑은 초안, QT 는 사람이 확정한 값.
   확정 전에는 점선으로 흐리게 보인다 */
function typeSheet(no){
  const r=rec(no), cur=new Set(typeOf(no));
  const b=document.createElement('div');b.className='sheet';
  b.innerHTML=`<div class="panel"><h2>${no}번 유형</h2>
    <p>${r[F.SUB]} · ${r[F.CODE]}${typeFixed(no)?'':' · <b>초안</b> — 풀이 노트에서 뽑은 추정값'}</p>
    <div class="fld" id="qtBox" style="display:flex;gap:7px;flex-wrap:wrap"></div>
    <p style="font-size:11.5px;margin:0 0 12px">공식 = 공식만 알면 1분 30초 · 계산 = 길거나 실수 위험 ·
       함정 = 조건 하나 놓치면 틀림 · 개념 = 개념이 부족해서 틀림. 여러 개 고를 수 있습니다.</p>
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn sm" id="qtDel">지우기</button>
      <button class="btn sm" id="qtNo">닫기</button>
      <button class="btn sm pri" id="qtSave">저장</button>
    </div></div>`;
  document.body.appendChild(b);
  const box=b.querySelector('#qtBox');
  const redraw=()=>{box.innerHTML='';TYPES.forEach(t=>{
    const x=document.createElement('button');x.className='chip'+(cur.has(t)?' on':'');
    x.textContent=t;x.onclick=()=>{cur.has(t)?cur.delete(t):cur.add(t);redraw()};box.appendChild(x)})};
  redraw();
  const close=()=>b.remove();
  const commit=async()=>{
    const v=TYPES.filter(t=>cur.has(t));
    QT[no]=v;
    await saveQT(); close();
    if($('#view').classList.contains('hide'))draw(); else syncTypeBtn();
    toast(v.length?'유형 저장 — '+v.join(' · '):'유형을 비웠습니다');
  };
  b.querySelector('#qtSave').onclick=commit;
  b.querySelector('#qtDel').onclick=()=>{cur.clear();commit()};
  b.querySelector('#qtNo').onclick=close;
  b.onclick=e=>{if(e.target===b)close()};
}
function syncTypeBtn(){
  const btn=$('#tType'); if(!btn||!VNO)return;
  const v=typeOf(VNO);
  btn.textContent=v.length?v.join('·'):'유형';
  btn.style.color=v.length?(typeFixed(VNO)?'var(--teal)':'#A9ACB1'):'';
}

];
let FR={};                                     /* 백지인출 결과 · kv/frm · 키 = 섹션제목|공식 */
const saveFR=()=>put('kv','frm',FR);
const frKey=(s,row)=>s.t+'|'+row[0];
const frmFor=sub=>FRM.filter(s=>s.u.includes(sub));
const cardsFor=(code,sub)=>MCARDS.filter(c=>(code&&(c.q||[]).includes(code))||(sub&&(c.u||[]).includes(sub)));
function frmSheet(sub){
  const secs=frmFor(sub);
  if(!secs.length){toast('이 소단원 공식시트는 아직 없습니다 — 지금은 역학만 있습니다');return}
  const b=document.createElement('div');b.className='sheet';
  b.innerHTML='<div class="panel frmpanel"><h2>공식 — '+esc(sub)+'</h2>'+
    '<div style="display:flex;gap:6px;margin:0 0 10px"><button class="btn sm pri" id="fmA">시트</button>'+
    '<button class="btn sm" id="fmB">백지 인출</button></div>'+
    '<p style="font-size:11.5px;margin:0 0 10px" id="fmHint"></p><div id="fmBody"></div>'+
    '<button class="btn pri" id="fmX" style="margin-top:12px">닫기</button></div>';
  document.body.appendChild(b);
  const body=b.querySelector('#fmBody'),hint=b.querySelector('#fmHint');
  let blank=false;
  const rowHtml=(s,row,idx)=>{
    const g=FR[frKey(s,row)]||'';
    const dot=g?'<span class="frdot '+(g==='O'?'frO':'frX')+'"></span>':'';
    if(!blank) return '<div class="frmrow">'+dot+'<div class="frf">'+row[0]+'</div>'+
      '<div class="frc">조건 — '+row[1]+' &nbsp;·&nbsp; <b>함정</b> — '+row[2]+'</div></div>';
    return '<div class="frmrow frhide" data-k="'+esc(frKey(s,row))+'">'+dot+
      '<button class="btn sm" data-rv="1">공개 '+(idx+1)+'</button>'+
      '<div class="frbody hide"><div class="frf">'+row[0]+'</div>'+
      '<div class="frc">조건 — '+row[1]+' &nbsp;·&nbsp; <b>함정</b> — '+row[2]+'</div>'+
      '<div style="margin-top:6px"><button class="btn sm" data-g="O" style="color:var(--teal)">썼다 O</button> '+
      '<button class="btn sm" data-g="X" style="color:var(--red)">못 썼다 X</button></div></div></div>';
  };
  const render=()=>{
    hint.textContent=blank?'먼저 백지에 이 단원 공식을 전부 쓴 뒤, 한 줄씩 공개해서 O/X 로 자가채점하세요. 결과는 저장되어 백업에 실립니다.'
                          :'보기 전용. 인출 연습은 「백지 인출」 모드로.';
    body.innerHTML=secs.map(s=>'<h3 class="frmh">'+esc(s.t)+(blank?' — 공식 '+s.r.length+'개':'')+'</h3>'+
      s.r.map((row,i)=>rowHtml(s,row,i)).join('')).join('');
    if(!blank)kx(body);
  };
  render();
  b.querySelector('#fmA').onclick=()=>{blank=false;b.querySelector('#fmA').classList.add('pri');b.querySelector('#fmB').classList.remove('pri');render()};
  b.querySelector('#fmB').onclick=()=>{blank=true;b.querySelector('#fmB').classList.add('pri');b.querySelector('#fmA').classList.remove('pri');render()};
  body.onclick=async e=>{
    const rv=e.target.closest('[data-rv]');
    if(rv){const w=rv.parentElement.querySelector('.frbody');w.classList.remove('hide');rv.remove();kx(w);return}
    const g=e.target.closest('[data-g]');
    if(g){const rowEl=g.closest('.frmrow');FR[rowEl.dataset.k]=g.dataset.g;await saveFR();
      rowEl.classList.add(g.dataset.g==='O'?'frokay':'frmiss');
      g.parentElement.innerHTML='<span style="font-size:11.5px;color:var(--muted)">기록됨 — '+(g.dataset.g==='O'?'O':'X (주말 인출에서 다시)')+'</span>';}
  };
  b.querySelector('#fmX').onclick=()=>b.remove();
  b.onclick=e=>{if(e.target===b)b.remove()};
}
function cardSheet(code,sub,label){
  const cards=cardsFor(code,sub);
  const b=document.createElement('div');b.className='sheet';
  const inner=cards.length
    ? cards.map(c=>'<h3 class="frmh">'+esc(c.t)+'</h3><div class="mcsvg">'+c.svg+'</div>').join('')
    : '<p style="font-size:12.5px;line-height:1.7">연결된 암기카드가 아직 없습니다.<br>'+
      '카드는 볼트에서 md 로 만들고(원본), 확정되면 앱의 <b>MCARDS</b> 에 등록합니다 — 작업 로그 P6.<br>'+
      '문항에는 PA코드로, 단원에는 소단원명으로 물립니다.</p>';
  b.innerHTML='<div class="panel frmpanel"><h2>암기카드 — '+esc(label)+'</h2>'+inner+
    '<button class="btn pri" id="mcX" style="margin-top:12px">닫기</button></div>';
  document.body.appendChild(b);
  b.querySelector('#mcX').onclick=()=>b.remove();
  b.onclick=e=>{if(e.target===b)b.remove()};
}

/* ---------------- 한줄 코멘트 ----------------
   저장은 kv/note 한 곳. 목록의 칩과 뷰어의 「코멘트」 버튼이 같은 시트를 연다. */
function noteSheet(no){
  const r=rec(no);
  const b=document.createElement('div');b.className='sheet';
  b.innerHTML=`<div class="panel"><h2>${no}번 한줄 코멘트</h2>
    <p>${r[F.SUB]} · ${r[F.CODE]}</p>
    <div class="fld"><input id="ntIn" type="text" maxlength="60"
      placeholder="예) 근의공식 때문 · 평균속력개념"
      style="width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;
             font-size:15px;font-weight:600;box-sizing:border-box"></div>
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn sm" id="ntDel">지우기</button>
      <button class="btn sm" id="ntNo">닫기</button>
      <button class="btn sm pri" id="ntSave">저장</button>
    </div>
    <div class="fld" style="margin:14px 0 0"><input id="ntQ" type="text" class="search" placeholder="🔍 코멘트 검색 — 낱말 여러 개는 AND" autocomplete="off"></div>
    <div id="ntRes" class="ntres"></div></div>`;
  document.body.appendChild(b);
  const inp=b.querySelector('#ntIn');
  inp.value=noteOf(no);
  setTimeout(()=>{inp.focus();inp.select()},60);
  const close=()=>b.remove();
  const commit=async()=>{
    const v=inp.value.trim();
    if(v)CMT[no]=v; else delete CMT[no];
    await saveNote();
    close();
    if($('#view').classList.contains('hide'))draw(); else {syncNoteBtn();navSync()}   /* 서랍의 🗒 칩을 넣고 뺀다 */
    toast(v?'코멘트를 저장했습니다':'코멘트를 지웠습니다');
  };

  /* 코멘트 검색(2026-09-04) — CMT 전건(지금 문제 포함) · 낱말 AND · 소문자 · 150ms 디바운스 · 최대 50 + 더 보기.
     결과 클릭 = 그 문제 팝업(twinPeek · 이동 아님 · 팝업 안 「이 문제로 가기」만 이동).
     시트가 닫히면 검색어도 같이 사라진다(저장 안 함). 상단 검색(pass) 은 건드리지 않는다. */
  const qIn=b.querySelector('#ntQ'), res=b.querySelector('#ntRes');
  let qt=null, shown=50;
  const words=q=>q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=ws=>ws.length?Object.keys(CMT).map(Number).filter(k=>rec(k)&&CMT[k]&&ws.every(w=>CMT[k].toLowerCase().includes(w))).sort((a,z)=>a-z):[];
  const excerpt=(t,ws)=>{let s=esc(t);
    ws.forEach(w=>{const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');s=s.replace(re,x=>'\u0001'+x+'\u0002')});
    return s.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')};
  const paint=()=>{const q=qIn.value.trim(), ws=words(q), L=hits(ws);
    if(!q){res.innerHTML='';return}
    res.innerHTML=`<div class="rh">코멘트에 「${esc(q)}」 · ${L.length}건</div>`+
      L.slice(0,shown).map(k=>{const r=rec(k),m=lastM(k);

      (L.length>shown?`<button class="btn sm" id="ntMore" style="margin-top:6px">더 보기 (${L.length-shown})</button>`:'');
    res.querySelectorAll('.ri').forEach(x=>x.onclick=()=>twinPeek(+x.dataset.no,close));
    const mo=res.querySelector('#ntMore'); if(mo)mo.onclick=()=>{shown+=50;paint()};};
  qIn.oninput=()=>{clearTimeout(qt);shown=50;qt=setTimeout(paint,150)};
  qIn.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(qt);paint()}};
  b.onclick=e=>{if(e.target===b)close()};
}

function conceptStat(k){
  const qs=CQ[k]||[]; let o=0,x=0,q=0,p=0,n=0;
  qs.forEach(no=>{const m=lastM(no); if(m==='O')o++;else if(m==='X')x++;else if(m==='Q')q++;else if(m==='P')p++;else n++});
  return {t:qs.length,o,x,q,p,n};
}

function conceptPick(r){
  const no=r[F.NO];
  const cur=new Set(conceptKeys(r));
  const fixed=new Set(CL[r[F.CODE]]||[]);
  const groups={};
  Object.keys(CB).forEach(k=>{const v=CB[k]; if(!v.x||!v.x.trim())return;
    (groups[v.n]=groups[v.n]||[]).push(k)});
  const names=Object.keys(groups).sort();
  const b=document.createElement('div');b.className='sheet thsheet';
  const build=()=>{
    b.innerHTML=`<div class="panel"><h2>${no}번에 개념 잇기</h2>
      <p>${esc(r[F.SUB])} · ${r[F.CODE]} · 고른 것 ${cur.size}개</p>
      ${names.map(n=>`<div class="grouphd">${esc(n)}</div>`+
        groups[n].map(k=>`<button class="cxi${cur.has(k)?' on':''}" data-k="${k}">
          <span class="cxt">${esc(CB[k].t)}</span>
          ${fixed.has(k)?'<span class="tag">교재</span>':''}</button>`).join('')).join('')}

      const k=el.dataset.k;
      if(fixed.has(k)){toast('교재가 이어둔 개념이라 뺄 수 없습니다');return}
      cur.has(k)?cur.delete(k):cur.add(k); build()});
    b.querySelector('#cpNo').onclick=()=>b.remove();

    };
  };
  build();
  b.onclick=e=>{if(e.target===b)b.remove()};
  document.body.appendChild(b);
}

function ndTail(no){const m=lastM(no), w=weakState(no), c=noteOf(no);

    (m?'<b class="ndm ndm'+m+'">'+mGlyph(m)+'</b>':'')+

    d.innerHTML='<span class="ndno">'+no+'</span><span class="ndt">'+esc(r[F.CODE])+esc(r[F.LV])+'-'+esc(titleOf(r))+'</span><span class="ndtail">'+ndTail(no)+'</span>';

/* ---------------- OMR 마킹 · 자동 채점 ----------------
   심판값은 DATA 의 ANS 다. 교재 OCR 산물이라 틀렸을 수 있으므로
   AFIX(kv/ansfix) 로 덮어쓸 수 있게 해둔다. DATA 는 손대지 않는다(D10). */
let AFIX=null;                      // no -> '②'  (사용자가 고친 정답)
const OMR_MULTI={125:['③','⑤']};   // 2014 변리사 복수정답
const OMR_SKIP={175:'교재 문제오류로 표시된 문항입니다 — 채점하지 않습니다'};
const CIRC5='①②③④⑤';
async function loadAfix(){ if(!AFIX) AFIX=(await get('kv','ansfix'))||{}; return AFIX }
function rawAns(no){ const r=rec(no); return r?String(r[F.ANS]||''):'' }
function ansOf(no){                 // 채점에 쓸 정답 배열 (없으면 [])
  if(OMR_SKIP[no])return [];
  const fx=(AFIX||{})[no];
  if(fx&&CIRC5.includes(fx))return [fx];
  if(OMR_MULTI[no])return OMR_MULTI[no];
  const a=rawAns(no).trim();
  return (a.length===1&&CIRC5.includes(a))?[a]:[];
}
const canGrade=no=>ansOf(no).length>0;
const pickOf=no=>{const h=hist(no);for(let i=h.length-1;i>=0;i--)if(h[i].a)return h[i].a;return ''};

async function syncOmr(){
  await loadAfix();
  const pad=$('#omrPad'); if(!pad||!VNO)return;
  const p=pickOf(VNO), ok=ansOf(VNO);
  pad.querySelectorAll('[data-omr]').forEach(b=>{
    const sel=b.dataset.omr===p;
    b.classList.toggle('on',sel);
    b.classList.toggle('hit',sel&&ok.includes(b.dataset.omr));
    b.classList.toggle('miss',sel&&!ok.includes(b.dataset.omr));
  });
  layoutOmr();
}
async function omrPick(ch){
  if(!VNO)return;
  await loadAfix();
  if(OMR_SKIP[VNO]){toast(OMR_SKIP[VNO],2600);return}
  const ok=ansOf(VNO);
  if(!ok.length){toast('이 문항은 채점할 정답이 없습니다 — 답 보기를 쓰세요',2400);return}
  const hit=ok.includes(ch);
  const h=hist(VNO).slice();
  h.push({m:hit?'O':'X',t:Date.now(),s:TM.sec||0,a:ch});
  ST[VNO]={h};await saveST();
  tmStop();syncMarkBtns();
  omrResult(VNO,ch,hit,ok);
  if(hit&&SET.autoNext)setTimeout(()=>go(1),900);
}
function omrResult(no,ch,hit,ok){
  const b=document.createElement('div');b.className='sheet';
  const ansTxt=ok.join(' 또는 ');
  b.innerHTML=`<div class="panel"><h2 style="color:${hit?'var(--teal)':'var(--red)'}">${hit?'정답입니다':'오답입니다'}</h2>
    <p>${no}번 · 고른 답 ${ch}</p>
    <div class="ansbox"><b>정답</b> ${ansTxt}${OMR_MULTI[no]?' <span class="tag">복수정답</span>':''}</div>
    <p style="margin:12px 0 0;font-size:11.5px">${hit?'회독 기록에 O 로 남겼습니다. 헷갈렸다면 △ 를 누르세요.':'회독 기록에 X 로 남겼습니다.'}</p>
    <button class="btn" id="omrFix" style="margin-top:12px">이 정답이 틀렸어요</button>
    <button class="btn" style="margin-top:8px">닫기</button></div>`;

/* 연도별 채점표 — 변리사 한 회차 10문항을 실전처럼 모아 본다 */
function yearSheet(y){
  const rows=DATA.filter(r=>r[F.SRC]==='변리사'&&String(r[F.YEAR])===String(y))
                 .sort((a,b)=>String(a[F.CODE]).localeCompare(String(b[F.CODE])));
  let hit=0,done=0;
  const body=rows.map(r=>{
    const no=r[F.NO], pick=pickOf(no), ok=ansOf(no), m=lastM(no);
    const graded=!!pick&&ok.length>0;
    if(graded){done++; if(ok.includes(pick))hit++}
    const st=!pick?'<span class="tag">안 품</span>'
      :(ok.includes(pick)?'<b style="color:var(--teal)">O</b>':'<b style="color:var(--red)">X</b>');
    return `<div class="histrow"><span class="rn">${r[F.CODE]}</span>
      <span class="sel" style="gap:8px">고른 답 ${pick||'—'} · 정답 ${ok.join('/')||'—'}</span>
      <span class="sec">${st}</span></div>`;
  }).join('');
  const b=document.createElement('div');b.className='sheet';
  b.innerHTML=`<div class="panel"><h2>${y}년 변리사 채점표</h2>
    <p>${rows.length}문항 · 푼 것 ${done} · <b>${hit} / ${done||0} 맞음</b>${done?` (${Math.round(hit/done*100)}%)`:''}</p>
    <div>${body}</div>
    <p style="margin:12px 0 0;font-size:11.5px">목표는 10문항 중 8개입니다. 안 푼 문항은 집계에서 빠졌습니다.</p>
    <button class="btn pri" style="margin-top:12px">닫기</button></div>`;
  b.onclick=e=>{if(e.target===b||e.target.tagName==='BUTTON')b.remove()};
  document.body.appendChild(b);
}

async function exportData(withPdf){
  toast('만드는 중…');
  const inkKeys=await keys('ink'),inkVals=await all('ink');
  const out={v:2,at:Date.now(),status:ST,set:SET,maskpos:MPOS,omrpos:OPOS,note:CMT,qtype:QT,conc:CX,gpt:GP,twin:TW,ansfix:(AFIX||{}),frm:FR,ink:{}};
  inkKeys.forEach((k,i)=>out.ink[k]=inkVals[i]);
  if(withPdf){
    out.pdf={};
    for(const k of await keys('pdf')){
      const buf=await get('pdf',k);
      let s='',u=new Uint8Array(buf);
      for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
      out.pdf[k]=btoa(s);
    }
  }
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`지학_${withPdf?'전체':'필기'}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('내보냈습니다');
}
async function importData(f){
  if(!f)return;toast('불러오는 중…');
  try{
    const j=JSON.parse(await f.text());
    if(j.status){ST=j.status;await put('kv','status',ST)}
    if(j.set){SET=Object.assign(SET,j.set);await put('kv','set',SET)}
    if(j.maskpos){MPOS=j.maskpos;await put('kv','maskpos',MPOS)}
    if(j.omrpos){OPOS=j.omrpos;await put('kv','omrpos',OPOS)}
    if(j.note){CMT=j.note;await saveNote()}
    if(j.qtype){QT=j.qtype;await saveQT()}
    if(j.ansfix){AFIX=j.ansfix;await put('kv','ansfix',AFIX)}
    if(j.conc){CX=j.conc;await saveCX()}
    if(j.gpt){GP=j.gpt;await saveGP()}
    if(j.twin){TW=j.twin;await saveTW()}
    if(j.frm){FR=j.frm;await put('kv','frm',FR)}
    if(migrate())await saveST();
    if(j.ink)for(const k in j.ink)await put('ink',k,j.ink[k]);
    if(j.pdf)for(const k in j.pdf){
      const bin=atob(j.pdf[k]),u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      await put('pdf',k,u.buffer);
    }
    await loadHave();renderSettings();draw();toast('복원했습니다');
  }catch(e){toast('백업 파일을 읽지 못했습니다')}
}

/* ══════ 학습기록 자동 동기화 (2026-09-01) ══════
   비공개 `zzikkaplan/studyplandata` 의 `phys/기록.json` 한 파일에 열 개 키를 담는다.
   실측 7KB — 쪼개지 않는다. 1MB 를 넘으면 그때 나눈다.

   ⚠ `ink`(필기)와 `set`(설정)은 여기 없다. 필기는 그린 문항이 48개뿐인데도 19.65MB 라
     git 이력이 되돌릴 수 없게 커지고, 설정은 화면 크기·마스크 취향이라 기기마다 달라야 한다.

   ★ 기존 열 개 키의 **값 모양을 한 글자도 바꾸지 않는다.** 시각·묘비는 **옆에 따로** 쌓는다.
     phys_sync_u      "키|문항" → 마지막으로 만진 시각
     phys_sync_gone   "키|문항" → 지운 시각 (묘비)
     phys_sync_shadow 직전 도장 때의 값 사본 (대조용)
     phys_sync_meta   { lastSync, remoteSha }
   이 넷은 **기기별로 산다** — SYNC_KEYS 에 넣지 않는다.
   ⚠ 넷을 IndexedDB 가 아니라 localStorage 에 둔 이유 — 도장은 탭이 숨는 순간에도
     찍혀야 하는데 IndexedDB 쓰기는 그때 끝나지 못한다. localStorage 는 동기적이다. */
const REC_REPO='zzikkaplan/studyplandata', REC_BRANCH='main';
const REC_PATH=EARTH.REC_PATH, REC_SET_PATH='settings.json';
const SYNC_KEYS=['status','note','qtype','conc','gpt','twin','ansfix','frm','maskpos','omrpos','bogi','unit'];   /* 지학: 열한째 bogi · 열두째 unit */
/* 키 → 이 앱의 전역. 열 개 다 「문항번호 → 값」 dict 다(실측 확인).
   ⚠ `ansfix` 만 늦게 읽힌다(loadAfix) — null 이면 건너뛴다. */
let BG={},UN={};   /* 지학: bogi = uid→{ㄱ:'O'|'Q'|'X'} · unit = uid→'n.n.n' */
const SYNC_REF={
  status :{g:()=>ST,   s:v=>{ST=v}},
  note   :{g:()=>CMT,  s:v=>{CMT=v}},
  qtype  :{g:()=>QT,   s:v=>{QT=v}},
  conc   :{g:()=>CX,   s:v=>{CX=v}},
  gpt    :{g:()=>GP,   s:v=>{GP=v}},
  twin   :{g:()=>TW,   s:v=>{TW=v}},
  ansfix :{g:()=>AFIX, s:v=>{AFIX=v}},
  frm    :{g:()=>FR,   s:v=>{FR=v}},
  maskpos:{g:()=>MPOS, s:v=>{MPOS=v}},
  omrpos :{g:()=>OPOS, s:v=>{OPOS=v}},
  bogi   :{g:()=>BG,   s:v=>{BG=v}},
  unit   :{g:()=>UN,   s:v=>{UN=v}}
};
const U_KEY=EARTH.SYNC_PREFIX+'u', GONE_KEY=EARTH.SYNC_PREFIX+'gone',
      SHADOW_KEY=EARTH.SYNC_PREFIX+'shadow', SMETA_KEY=EARTH.SYNC_PREFIX+'meta';
const lsObj=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}};
const lsPut=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ckey=(k,c)=>k+'|'+c;
const csplit=s=>{const i=s.indexOf('|');return[s.slice(0,i),s.slice(i+1)]};

/* 토큰은 tt·민법OX 와 **같은 칸**을 쓴다 — 셋 다 skygenie00.github.io 라 오리진이 같다.
   ⚠ 없을 수 있다. 홈화면 웹앱 통은 백지로 시작한다(2026-08-29 실측) — 설정에 입력 칸이 있다. */
function ttCfg(){try{return JSON.parse(localStorage.getItem('tt.cfg')||'{}')||{}}catch(e){return{}}}
const recToken=()=>String(ttCfg().token||'').trim();
const recWho=()=>ttCfg().person||'알수없음';
function recSaveToken(t){
  const c=ttCfg();c.token=String(t||'').trim();
  if(!c.person)c.person='꼬까';
  if(c.lastSync==null)c.lastSync=0;
  try{localStorage.setItem('tt.cfg',JSON.stringify(c))}catch(e){}
}

/* ---------- 도장 찍기 ----------
   저장하는 자리를 하나도 고치지 않는다. 그림자와 대조해 여기 한 곳에서 찍는다.
   ⚠ 알려진 한계 — 도장은 「바꾼 순간」이 아니라 최대 10초 뒤다.
   ⚠ 회독은 예외 — status[문항].h[].t 가 진짜 시각이다. 새로 만들지 않는다. */
const stTime=v=>{const h=(v||{}).h;return(h&&h.length)?(h[h.length-1].t||0):0};
function stampAll(){
  const now=Date.now();
  const u=lsObj(U_KEY),gone=lsObj(GONE_KEY),shadow=lsObj(SHADOW_KEY);
  let n=0;
  for(const k of SYNC_KEYS){
    const cur=SYNC_REF[k].g();
    if(!cur)continue;                       /* ansfix — 아직 안 읽혔다 */
    const old=shadow[k]||{};
    for(const c in cur){
      if(JSON.stringify(cur[c])!==JSON.stringify(old[c])){
        u[ckey(k,c)]=(k==='status'?stTime(cur[c]):0)||now;
        delete gone[ckey(k,c)];n++;
      }
    }
    for(const c in old){
      if(!(c in cur)){gone[ckey(k,c)]=now;delete u[ckey(k,c)];n++}
    }
    shadow[k]=cur;
  }
  lsPut(U_KEY,u);lsPut(GONE_KEY,gone);lsPut(SHADOW_KEY,shadow);
  return n;
}

/* ---------- 병합 — 칸 단위 최신 승 · 무승부는 원격 ---------- */
async function recMerge(remote){
  const u=lsObj(U_KEY),gone=lsObj(GONE_KEY);
  const rU=remote.u||{},rG=remote.gone||{},rD=remote.data||{};
  const byKey={};
  const add=s=>{const p=csplit(s);if(!byKey[p[0]])byKey[p[0]]=new Set();byKey[p[0]].add(p[1])};
  Object.keys(rU).forEach(add);Object.keys(rG).forEach(add);
  let took=0,kept=0,del=0;const dirty={};
  for(const k of SYNC_KEYS){
    const cur=SYNC_REF[k].g();
    if(!cur)continue;
    const cells=byKey[k]||new Set();
    Object.keys(rD[k]||{}).forEach(c=>cells.add(c));
    for(const c of cells){
      const ck=ckey(k,c);
      const mine=Math.max(u[ck]||0,gone[ck]||0);
      const theirs=Math.max(rU[ck]||0,rG[ck]||0);
      if(theirs===0||theirs<mine){kept++;continue}          /* 내 쪽이 이긴다 */
      if((rG[ck]||0)>=(rU[ck]||0)&&(rG[ck]||0)>0){
        /* 원격이 지웠다 — ★ 지운 것이 되살아나면 안 된다 */
        if(c in cur){delete cur[c];del++;dirty[k]=1}
        gone[ck]=rG[ck];delete u[ck];
      }else if(rD[k]&&Object.prototype.hasOwnProperty.call(rD[k],c)){
        cur[c]=rD[k][c];u[ck]=rU[ck];delete gone[ck];took++;dirty[k]=1;
      }
    }
  }
  lsPut(U_KEY,u);lsPut(GONE_KEY,gone);
  for(const k in dirty)await put('kv',k,SYNC_REF[k].g());
  /* ★ 그림자도 같이 갱신한다 — 안 하면 다음 stampAll 이
     「원격에서 받은 것」을 「내가 바꾼 것」으로 오인해 도장을 새로 찍는다. */
  const shadow=lsObj(SHADOW_KEY);
  SYNC_KEYS.forEach(k=>{const v=SYNC_REF[k].g();if(v)shadow[k]=v});
  lsPut(SHADOW_KEY,shadow);
  return{took,kept,del,dirty:Object.keys(dirty)};
}

function recPayload(){
  /* ★ data 는 SYNC_KEYS 만 돌며 만든다 — `ink` 가 들어갈 길이 없다(P5). */
  const data={};SYNC_KEYS.forEach(k=>{data[k]=SYNC_REF[k].g()||{}});
  return{v:1,savedAt:new Date().toISOString(),by:recWho(),
         data:data,u:lsObj(U_KEY),gone:lsObj(GONE_KEY)};
}
function recPending(){
  const last=(lsObj(SMETA_KEY)).lastSync||0;
  const u=lsObj(U_KEY),g=lsObj(GONE_KEY);
  let n=0;
  for(const x in u)if(u[x]>last)n++;
  for(const x in g)if(g[x]>last)n++;
  return n;
}

/* ---------- GitHub Contents API — tt·민법OX 와 같은 저장소·같은 토큰 ---------- */
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
function ghUrl(path){
  return 'https://api.github.com/repos/'+REC_REPO+'/contents/'+encodeURI(path)+'?ref='+REC_BRANCH+'&t='+Date.now();
}
async function ghRaw(path){
  const r=await fetch(ghUrl(path),{headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github.raw'},cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('GET '+path+' '+r.status);
  return await r.text();
}
async function ghSha(path){
  const r=await fetch(ghUrl(path),{headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('SHA '+path+' '+r.status);
  return (await r.json()).sha;
}
async function ghPutJson(path,text,sha){
  const body={message:recWho()+' · '+path,content:b64enc(text),branch:REC_BRANCH};
  if(sha)body.sha=sha;
  const r=await fetch('https://api.github.com/repos/'+REC_REPO+'/contents/'+encodeURI(path),
    {method:'PUT',headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return 'conflict';
  if(!r.ok)throw new Error('PUT '+path+' '+r.status);
  return (await r.json()).content.sha;
}

/* ---------- 동기화 ---------- */
let recBusy=false, recErr='';
function recAfterMerge(res){
  if(!res||!res.dirty.length)return;
  if(typeof refreshUnits==='function'&&DATA.length)refreshUnits();
  if(res.dirty.indexOf('conc')>=0)buildCQ();
  try{draw();renderSettings()}catch(e){}
}
async function syncRecords(force){
  if(recBusy)return;
  if(!recToken()){recPaint();return}
  if(navigator.onLine===false){recPaint();return}
  recBusy=true;recErr='';recPaint();
  try{
    await loadAfix();                 /* ⚠ AFIX 가 null 이면 빈 ansfix 를 올려 원격을 깎는다 */
    stampAll();
    let sha=await ghSha(REC_PATH);
    if(sha){
      const txt=await ghRaw(REC_PATH);
      if(txt){try{recAfterMerge(await recMerge(JSON.parse(txt)))}catch(e){console.warn('원격 기록 파싱 실패',e)}}
    }
    stampAll();
    let res=await ghPutJson(REC_PATH,JSON.stringify(recPayload()),sha);
    if(res==='conflict'){                                  /* 한 번만 재시도 */
      sha=await ghSha(REC_PATH);
      const txt2=await ghRaw(REC_PATH);
      if(txt2){try{recAfterMerge(await recMerge(JSON.parse(txt2)))}catch(e){}}
      stampAll();
      res=await ghPutJson(REC_PATH,JSON.stringify(recPayload()),sha);
      if(res==='conflict')throw new Error('두 번 다 충돌');
    }
    lsPut(SMETA_KEY,{lastSync:Date.now(),remoteSha:res});
  }catch(e){
    /* ⚠ 조용히 넘어가되 **칩에는 남긴다.**
       8/29 에 조용한 실패 때문에 원인을 세 번 잘못 짚었다. */
    recErr=e.message||'실패';
    console.warn('기록 동기화 건너뜀:',recErr);
  }
  recBusy=false;recPaint();
}

/* ---------- 시험 D-day — 날짜를 앱에 박지 않는다 ----------
   zzikkaTT 의 settings.json 에서 `exams` 와 **논리일 `dayStart` 를 같이** 읽는다.
   ⚠ 안 그러면 새벽에 두 앱의 D- 가 하루 어긋난다. 못 읽으면 칩을 아예 안 그린다. */
let RECSET=null;
async function loadExamSettings(){
  if(!recToken())return null;
  try{const t=await ghRaw(REC_SET_PATH);RECSET=t?JSON.parse(t):null}
  catch(e){RECSET=null}
  recPaint();return RECSET;
}
function recLogicalYmd(){
  const ds=(RECSET&&typeof RECSET.dayStart==='number')?RECSET.dayStart:5;
  const d=new Date();
  if(d.getHours()<ds)d.setDate(d.getDate()-1);
  d.setHours(0,0,0,0);
  return d;
}
function recNextExam(){
  if(!RECSET||!Array.isArray(RECSET.exams))return null;
  const ex=RECSET.exams.filter(e=>e&&!e.del&&e.date).sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
  if(!ex.length)return null;
  const t=recLogicalYmd();
  const p=n=>(n<10?'0':'')+n;
  const ymd=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());
  return ex.find(e=>e.date>=ymd)||ex[ex.length-1];
}
function recExamText(){
  const e=recNextExam();if(!e)return'';
  const t=recLogicalYmd();
  const d=new Date(e.date+'T00:00:00');
  const n=Math.ceil((d-t)/864e5);
  return (e.name||'시험')+' '+(n>=0?'D-'+n:'D+'+(-n));
}

/* ---------- 헤더 칩 ---------- */
function recPaint(){
  const el=$('#recChip');
  if(el){
    let t,bad=false;
    if(recBusy)t='⟳ 동기화 중';
    else if(!recToken()){t='○ 토큰 없음';bad=true}
    else if(navigator.onLine===false){t='○ 오프라인';bad=true}
    else if(recErr){t='○ 동기화 실패';bad=true}
    else{
      const p=recPending();
      if(p)t='● 대기 '+p+'건';
      else{
        const last=(lsObj(SMETA_KEY)).lastSync||0;
        const ago=last?Math.round((Date.now()-last)/60000):null;
        t='● 동기화됨'+(ago!=null?' '+(ago<1?'방금':ago<60?ago+'분 전':Math.round(ago/60)+'시간 전'):'');
      }
    }
    el.textContent=t;
    el.classList.toggle('err',bad);
    el.title=recErr?('기록 동기화 — '+recErr+' · 누르면 다시 맞춘다')
                   :'기록 동기화 — 누르면 지금 맞춘다';
  }
  const ex=$('#examChip');
  if(ex){const t=recExamText();ex.textContent=t;ex.style.display=t?'':'none'}
}

/* ---------- 시동 — 민법OX recBoot() 과 같은 주기 ---------- */
function recBoot(){
  const c=$('#recChip');if(c)c.onclick=()=>syncRecords(true);
  const e=$('#examChip');if(e)e.onclick=()=>loadExamSettings();
  recPaint();
  stampAll();
  syncRecords();
  loadExamSettings();
  setInterval(()=>{if(document.visibilityState==='visible'){stampAll();recPaint()}},10000);
  setInterval(()=>{if(document.visibilityState==='visible')syncRecords()},180000);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible')syncRecords();
    else stampAll();
  });
  window.addEventListener('online',recPaint);
  window.addEventListener('offline',recPaint);
}

/* ---------------- 시작 ---------------- */
(async()=>{
  await open();
  ST=(await get('kv','status'))||{};
  if(migrate())await saveST();
  SET=Object.assign(SET,(await get('kv','set'))||{});
  if(!SET.autoNextReset){SET.autoNext=false;SET.autoNextReset=1;await put('kv','set',SET);}
  MPOS=(await get('kv','maskpos'))||{};
  OPOS=(await get('kv','omrpos'))||{};
  CMT=(await get('kv','note'))||{};
  CX=(await get('kv','conc'))||{};
  buildCQ();
  GP=(await get('kv','gpt'))||{};
  TW=(await get('kv','twin'))||{};
  QT=(await get('kv','qtype'))||{};
  FR=(await get('kv','frm'))||{};
  const moved=await renumber();
  if(moved)setTimeout(()=>toast('문항 번호 재배열 — 기록 '+moved+'건을 옮겼습니다'),900);
  await loadHave();
  await loadAfix();          /* ⚠ 동기화보다 먼저 — AFIX 가 null 이면 빈 ansfix 로 원격을 깎는다 */
  setTool('pen','#16181B',$$('[data-pen]')[0]);
  BG=(await get('kv','bogi'))||{};UN=(await get('kv','unit'))||{};
  await loadEarthData();
  draw();
  try{recBoot()}catch(e){console.warn('기록 동기화 시동 실패',e)}
  await ensureFiles();
})();
