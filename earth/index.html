<script>
/* ===== 학습로그 요약 (2026-08-11 추가) =====================================
   오늘 푸었던 문제 기록(status.h 의 t 값)을 모아 요약 텍스트로 만든다.
   하루의 시작은 새벽 4시. 기존 데이터는 읽기만 한다. ==================== */
(function () {
  var DAY_START_HOUR = 4;
  /* offset: 0 = 오늘, -1 = 어제, -2 = 그저께 … */
  function dayRange(offset) {
    var now = new Date();
    var s = new Date(now); s.setHours(DAY_START_HOUR, 0, 0, 0);
    if (now.getTime() < s.getTime()) s.setDate(s.getDate() - 1);
    s.setDate(s.getDate() + (offset || 0));
    var e = new Date(s); e.setDate(e.getDate() + 1);
    return { start: s.getTime(), end: e.getTime(), label: s };
  }
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }

  /* 문제번호 → 교재 행 (단원명을 알아내기 위해) */
  var ROW = null;
  function rowOf(no) {
    if (!ROW) {
      ROW = {};
      try { DATA.forEach(function (r) { ROW[String(r[F.NO])] = r; }); } catch (e) {}
    }
    return ROW[String(no)] || null;
  }
  function secFmt2(x) {
    x = Math.max(0, Math.round(x || 0));
    return Math.floor(x / 60) + "'" + String(x % 60).padStart(2, '0') + '"';
  }

  function collect(offset) {
    var R = dayRange(offset);
    var st = (typeof ST === 'object' && ST) ? ST : {};
    var items = [];
    Object.keys(st).forEach(function (no) {
      var h = (st[no] && st[no].h) || [];
      h.forEach(function (rec) {
        if (!rec || !rec.t) return;
        if (rec.t < R.start || rec.t >= R.end) return;
        var r = rowOf(no);
        items.push({
          no: no,
          m: rec.m || '?',
          sec: rec.s || 0,
          t: rec.t,
          sub: r ? (r[F.SUB] || '') : '',
          big: r ? (r[F.BIG] || '') : ''
        });
      });
    });
    items.sort(function (a, b) { return a.t - b.t; });
    return { date: ymd(R.label), offset: offset || 0, items: items };
  }

  function buildText(data, memo) {
    var items = data.items;
    if (!items.length) return data.date + ' — 오늘 풀이 기록이 없습니다.';

    /* 소단원별로 묶는다 (오늘 푸어본 순서 유지) */
    var order = [], group = {};
    items.forEach(function (it) {
      var key = it.sub || it.big || '미분류';
      if (!group[key]) { group[key] = []; order.push(key); }
      group[key].push(it);
    });

    var lines = ['[지학 학습로그] ' + data.date];
    var TO = 0, TQ = 0, TX = 0, TP = 0, TSEC = 0;

    order.forEach(function (key) {
      var g = group[key];
      var o = 0, q = 0, x = 0, p = 0, sec = 0;
      g.forEach(function (it) {
        if (it.m === 'O') o++; else if (it.m === 'Q') q++; else if (it.m === 'X') x++; else if (it.m === 'P') p++;
        sec += it.sec;
      });
      TO += o; TQ += q; TX += x; TP += p; TSEC += sec;
      var den = g.length - p;   /* P(패스) 는 정답률 분모에서 뺀다 */
      var rate = den ? Math.round(o * 100 / den) : 0;
      lines.push('- ' + key + ' : ' + g.length + '문항 (정답률 ' + rate + '% · 헷갈림 ' + q + (p ? ' · P ' + p : '') + ')');
      lines.push('  ' + g.map(function (it) {
        return it.no + ' ' + it.m + (it.sec ? ' ' + secFmt2(it.sec) : '');
      }).join(' | '));
    });

    var total = items.length;
    lines.push('합계: ' + total + '문항 · O ' + TO + ' · 헷갈림 ' + TQ + ' · X ' + TX + ' · P ' + TP +
               (TSEC ? ' · ' + Math.round(TSEC / 60) + '분' : ''));

    /* 오래 걸린 문항 — 평균의 1.5배 이상이면서 3분 넘는 것 */
    var timed = items.filter(function (it) { return it.sec > 0; });
    if (timed.length >= 3) {
      var avg = timed.reduce(function (s, it) { return s + it.sec; }, 0) / timed.length;
      var slow = timed.filter(function (it) { return it.sec >= Math.max(180, avg * 1.5); })
                      .sort(function (a, b) { return b.sec - a.sec; });
      if (slow.length) {
        lines.push('오래 걸림(평균 ' + secFmt2(avg) + '): ' +
                   slow.map(function (it) { return it.no + ' ' + secFmt2(it.sec); }).join(', '));
      }
    }

    if (memo && memo.trim()) lines.push('메모: ' + memo.trim());
    return lines.join(String.fromCharCode(10));
  }

  function openPanel() {
    var offset = 0;
    var data = collect(offset);
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(17,24,39,.7);display:flex;align-items:center;justify-content:center;padding:16px';
    wrap.innerHTML =
      '<div style="background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,.25)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
          '<div style="font-weight:800;font-size:16px">📝 학습로그</div>' +
          '<div style="display:flex;align-items:center;gap:6px">' +
            '<button id="plg-prev" style="background:#f3f4f6;border:0;border-radius:8px;width:30px;height:30px;font-weight:800;cursor:pointer">◀</button>' +
            '<span id="plg-date" style="font-size:13px;font-weight:700;min-width:104px;text-align:center"></span>' +
            '<button id="plg-next" style="background:#f3f4f6;border:0;border-radius:8px;width:30px;height:30px;font-weight:800;cursor:pointer">▶</button>' +
          '</div>' +
        '</div>' +
        '<textarea id="plg-text" style="width:100%;height:220px;font-size:12.5px;line-height:1.6;border:1px solid #e5e7eb;border-radius:10px;padding:10px;font-family:inherit"></textarea>' +
        '<input id="plg-memo" placeholder="한줄 메모 (깨달은 것·헷갈린 지점)" style="width:100%;margin-top:8px;border:1px solid #e5e7eb;border-radius:10px;padding:9px;font-size:13px">' +
        '<div style="display:flex;gap:8px;margin-top:12px">' +
          '<button id="plg-copy" style="flex:1;background:#111827;color:#fff;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer">복사하기</button>' +
          '<button id="plg-close" style="flex:0 0 90px;background:#f3f4f6;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer">닫기</button>' +
        '</div>' +
        '<div id="plg-msg" style="font-size:12px;color:#6b7280;margin-top:8px">화살표로 지난 날짜도 볼 수 있어요. 복사해서 노션 · 클로드에 붙여넣으세요.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var ta = wrap.querySelector('#plg-text'), memo = wrap.querySelector('#plg-memo');
    var dateEl = wrap.querySelector('#plg-date'), nextBtn = wrap.querySelector('#plg-next');
    var render = function () {
      ta.value = buildText(data, memo.value);
      dateEl.textContent = data.date + (offset === 0 ? ' (오늘)' : offset === -1 ? ' (어제)' : '');
      nextBtn.disabled = (offset >= 0);
      nextBtn.style.opacity = (offset >= 0) ? '.35' : '1';
    };
    var move = function (d) {
      if (offset + d > 0) return;
      offset += d;
      data = collect(offset);
      render();
    };
    render();
    memo.addEventListener('input', render);
    wrap.querySelector('#plg-prev').onclick = function () { move(-1); };
    nextBtn.onclick = function () { move(1); };
    wrap.querySelector('#plg-close').onclick = function () { wrap.remove(); };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) wrap.remove(); });
    wrap.querySelector('#plg-copy').onclick = function () {
      ta.select();
      var done = function () { wrap.querySelector('#plg-msg').textContent = '복사됐습니다.'; };
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done).catch(function () { document.execCommand('copy'); done(); });
      else { document.execCommand('copy'); done(); }
    };
  }

  const btn = document.createElement('button');

  btn.style.cssText = 'position:fixed;right:14px;bottom:70px;z-index:99998;background:#111827;color:#fff;border:0;border-radius:999px;padding:11px 16px;font-weight:700;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer';
  btn.onclick = openPanel;
  if (document.body) document.body.appendChild(btn);
  else window.addEventListener('DOMContentLoaded', function () { document.body.appendChild(btn); });
})();

<script>
/* ═══════════════════════════ 지학 층 (2026-09-04 · _task_earth_app_pan1.md) ═══════════════════════════
   물리 앱 골격(IndexedDB · 마크 ST · 코멘트 · 필터 칩 · 동기화) 위에 지학 것을 얹는다.
   물리 함수는 여기서 같은 이름으로 다시 정의해 갈아 끼운다(뒤 스크립트가 이긴다). 물리 데이터 배열은 빌드가 비웠다.
   문항 본문은 HTML 에 없다 — 비공개 저장소 earth/문항.json 을 토큰으로 받아 IndexedDB kv 에 캐시한다(D11). */

Object.assign(F,{UNIT:16,BPAGE:17,CH:18,BOGI:19,SOL:20,SOLPG:21,ROUND:22,CAND:23,NOTE:24,ORIG:25});
const TOC={ch:{},sec:{},unit:{},list:[]};      // 목차 — ch['3']={name,secs[]} · sec['3.4']={name,ch,units[]} · unit['3.4.5']={name,p,sec,ch}
let PIECES={};                                   // earth/pdf/index.json
const isC=r=>r[F.SRC]==='확인';
const uidOf=no=>rec(no)[F.CODE];
const unitOf=no=>{const r=rec(no);const u=UN[r[F.CODE]];return (u===undefined||u===null)?(r[F.UNIT]||''):u};
const unitName=c=>TOC.unit[c]?TOC.unit[c].name:(TOC.sec[c]?TOC.sec[c].name:(TOC.ch[c]?TOC.ch[c].name:''));
const unitLabel=c=>c?(c+' '+unitName(c)).trim():'미분류';
const unitPage=c=>TOC.unit[c]?TOC.unit[c].p:(TOC.sec[c]?TOC.sec[c].p:'');
const secOf=c=>c.split('.').slice(0,2).join('.');

const MG={O:'O',Q:'△',X:'X',P:'P'};

/* ───────────── 데이터 적재 ───────────── */
async function loadEarthData(){
  let j=await get('kv','earthdata');
  const tok=recToken();
  if(tok){
    try{
      const sha=await ghSha(EARTH.DATA_PATH);
      if(sha&&(!j||j.sha!==sha)){
        $('#dl').classList.remove('hide','err');$('#dl').textContent='문항 데이터 받는 중…';
        const items=JSON.parse(await ghRaw(EARTH.DATA_PATH));
        const toc=JSON.parse(await ghRaw(EARTH.TOC_PATH));
        const pieces=JSON.parse((await ghRaw(EARTH.PDF_DIR+'index.json'))||'{}');
        j={sha,items,toc,pieces,at:Date.now()};await put('kv','earthdata',j);
        $('#dl').classList.add('hide');
      }
    }catch(e){console.warn('earth data',e);$('#dl').classList.add('hide')}
  }
  if(!j){
    $('#list').innerHTML='<div class="empty"><b>문항 데이터가 아직 없습니다</b>설정에서 🔑 토큰을 넣으면 비공개 저장소에서 받아 옵니다.</div>';
    return false;
  }
  buildData(j.items,j.toc,j.pieces||{});
  return true;
}
function buildToc(toc){
  TOC.ch={};TOC.sec={};TOC.unit={};TOC.list=toc;
  toc.forEach(c=>{TOC.ch[c.장]={name:c.이름,secs:c.절.map(s=>s.절),p:(c.절[0]&&c.절[0].항목[0]||{}).쪽||''};
    c.절.forEach(s=>{TOC.sec[s.절]={name:s.이름,ch:c.장,units:s.항목.map(u=>u.코드),p:(s.항목[0]||{}).쪽||''};
      s.항목.forEach(u=>{TOC.unit[u.코드]={name:u.이름,p:u.쪽,sec:s.절,ch:c.장}})})});
}
function buildData(items,toc,pieces){
  buildToc(toc);PIECES=pieces;
  DATA.length=0;
  items.forEach((it,i)=>{
    const G=it.유형==='기출';
    const row=[i+1,+it.문제쪽||0,it.그림?'IMG':'TXT',0,'','',+it.문번||it.문번,0,'',it.uid,G?(+it.연도||''):'',G?'변리사':'확인','',String(it.정답||''),
      it.문항||'','',(it.단원==='미분류'?'':it.단원)||(G?'':it.uid[1]),+it.교재쪽||0,it.선택지||[],it.보기||[],it.해설||'',+it.해설쪽||0,+it.회차||'',it.단원후보||'',it.비고||'',it.원형회차||''];
    DATA.push(row);
  });
  refreshUnits();
  BIGS.length=0;['1','2','3','4','5'].forEach(c=>BIGS.push(c+'. '+(TOC.ch[c]||{}).name));
  FL.past='y';FL.unit='';FL.round='';SET.nav=false;
}
/* 단원(사용자 매칭 우선)에서 장·절 라벨을 다시 매긴다 — 필터·그룹 머리가 이걸 본다 */
function refreshUnits(){
  DATA.forEach(r=>{
    const u=UN[r[F.CODE]]!==undefined?UN[r[F.CODE]]:r[F.UNIT];
    const ch=u?chOf(u):(isC(r)?r[F.CODE][1]:'');
    r[F.BIG]=ch?ch+'. '+((TOC.ch[ch]||{}).name||''):'미분류';
    const sec=u&&u.split('.').length>=2?secOf(u):'';
    r[F.SUB]=sec?sec+' '+((TOC.sec[sec]||{}).name||''):(isC(r)?'(미매칭)':'(미분류)');
  });
}
titleOf=r=>(isC(r)?r[F.CODE][1]+'장 확인문제 '+r[F.LNO]+'번':r[F.ROUND]+'회 '+r[F.LNO]+'번');

/* ───────────── 필터 ───────────── */
function pass(r){
  if(FL.past==='p'?!isC(r):isC(r))return 0;                       /* 기본 = 기출만 · 확인문제는 토글 */
  if(FL.bigs.length&&!FL.bigs.includes(r[F.BIG]))return 0;
  if(FL.subs.length&&!FL.subs.includes(r[F.SUB]))return 0;
  if(FL.unit){const u=unitOf(r[F.NO]);if(!(u===FL.unit||u.startsWith(FL.unit+'.')))return 0}
  if(FL.round&&String(r[F.ROUND])!==FL.round)return 0;
  const no=r[F.NO], m=lastM(no);
  if(FL.mark==='new'&&m)return 0;
  if(FL.mark==='again'&&hist(no).filter(x=>x.m==='X').length<2)return 0;
  if(FL.mark==='weak'&&weakState(no)!=='weak')return 0;
  if(FL.mark==='less'&&weakState(no)!=='less')return 0;
  if(FL.mark==='note'&&!noteOf(no))return 0;
  if(FL.mark&&!['new','again','weak','less','note'].includes(FL.mark)&&m!==FL.mark)return 0;
  if(FL.q){const s=FL.q.toLowerCase();
    const hay=[r[F.CODE],r[F.BODY],(r[F.CH]||[]).join(' '),(r[F.BOGI]||[]).map(b=>b.내용).join(' '),noteOf(no),unitOf(no)].join(' ').toLowerCase();
    if(!hay.includes(s))return 0}
  return 1;
}
function drawFilters(){
  const a=$('#fBig');a.innerHTML='';
  const T=DATA.filter(r=>FL.past==='p'?isC(r):!isC(r));
  a.appendChild(chip('전체',!FL.bigs.length&&!FL.subs.length&&!FL.unit,()=>{FL.bigs=[];FL.subs=[];FL.unit='';draw()},T.length));
  const tog=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):arr.concat([v]);
  BIGS.forEach(b=>{
    a.appendChild(chip(b,FL.bigs.includes(b),()=>{FL.bigs=tog(FL.bigs,b);
      const live=T.filter(r=>FL.bigs.includes(r[F.BIG])).map(r=>r[F.SUB]);FL.subs=FL.subs.filter(x=>live.includes(x));draw()},T.filter(r=>r[F.BIG]===b).length));
    if(FL.bigs.includes(b)){
      [...new Set(T.filter(r=>r[F.BIG]===b).map(r=>r[F.SUB]))].sort().forEach(sv=>{
        const x=chip(sv,FL.subs.includes(sv),()=>{FL.subs=tog(FL.subs,sv);draw()},T.filter(r=>r[F.SUB]===sv).length);x.classList.add('sm');a.appendChild(x)});
      const d=document.createElement('div');d.className='brk';a.appendChild(d);
    }});
  if(FL.unit)a.appendChild(chip('단원 '+unitLabel(FL.unit)+' ✕',true,()=>{FL.unit='';draw()},T.filter(r=>pass(r)).length));
  const e=$('#fEtc');e.innerHTML='';
  e.appendChild(chip('기출',FL.past!=='p',()=>{FL.past='y';FL.round='';draw()},DATA.filter(r=>!isC(r)).length));
  e.appendChild(chip('확인문제',FL.past==='p',()=>{FL.past='p';FL.round='';draw()},DATA.filter(isC).length));
  if(FL.past!=='p'){
    const rounds=[...new Set(DATA.filter(r=>!isC(r)).map(r=>r[F.ROUND]))].sort((p,q)=>p-q);
    const sel=document.createElement('select');sel.className='chip rsel';
    sel.innerHTML='<option value="">회차 전체</option>'+rounds.map(x=>`<option value="${x}"${FL.round===String(x)?' selected':''}>${x}회 (${x+1963})</option>`).join('');
    sel.onchange=()=>{FL.round=sel.value;draw()};e.appendChild(sel);
  }
  e.appendChild(chip('안 푼 것',FL.mark==='new',()=>{FL.mark=FL.mark==='new'?'':'new';draw()}));
  e.appendChild(chip('틀린 것',FL.mark==='X',()=>{FL.mark=FL.mark==='X'?'':'X';draw()}));
  e.appendChild(chip('헷갈림',FL.mark==='Q',()=>{FL.mark=FL.mark==='Q'?'':'Q';draw()}));
  e.appendChild(chip('두 번 이상 틀림',FL.mark==='again',()=>{FL.mark=FL.mark==='again'?'':'again';draw()}));
  const nWk=T.filter(r=>weakState(r[F.NO])==='weak').length,nLs=T.filter(r=>weakState(r[F.NO])==='less').length,
        nP=T.filter(r=>lastM(r[F.NO])==='P').length,nNt=T.filter(r=>noteOf(r[F.NO])).length;
  const mchip=(lab,k,n)=>e.appendChild(chip(lab,FL.mark===k,()=>{FL.mark=FL.mark===k?'':k;draw()},n));
  mchip('⚠ 약점','weak',nWk);mchip('🌤 덜약점','less',nLs);mchip('P','P',nP);mchip('메모 있음','note',nNt);
  kx(e);
}
/* 히트맵 — 기출/확인 토글을 따른다(섞지 않는다) · 장 필터만 따라간다 */
function drawSpectrum(){
  const s=$('#spec'), L=DATA.filter(r=>(FL.past==='p'?isC(r):!isC(r))&&(!FL.bigs.length||FL.bigs.includes(r[F.BIG])));
  s.innerHTML='';let c={O:0,X:0,Q:0,P:0,z:0,weak:0,less:0};
  L.forEach(r=>{const no=r[F.NO],m=lastM(no),n=Math.min(3,reps(no)),w=weakState(no);

    if(!m)c.z++;else if(c[m]!=null)c[m]++;if(w)c[w]++});
  $('#c0').textContent=c.z;$('#cO').textContent=c.O;$('#cQ').textContent=c.Q;$('#cX').textContent=c.X;
  $('#cP').textContent=c.P;$('#cWk').textContent=c.weak;$('#cW').textContent=c.less;

function row(r){
  const d=document.createElement('div');d.className='item'+(isC(r)?' ec':' eg');
  const no=r[F.NO],rep=reps(no),u=unitOf(no);
  d.innerHTML=`<div class="num">${esc(r[F.CODE])}</div>

  d.onclick=e=>{const c=e.target.closest('.cmt'),p=e.target.closest('[data-page]'),un=e.target.closest('[data-unit]');

/* ───────────── 뷰어 = 문항 카드 ───────────── */
renderPage=async()=>{};setupMask=async()=>{};paintInk=()=>{};layoutOmr=()=>{};syncOmr=async()=>{};
let IMGURL={};

const bogiOf=uid=>BG[uid]||{};

  $('#vT2').textContent=`${r[F.BIG]} › ${unitLabel(u)} · 교재 ${r[F.BPAGE]||'?'}쪽`+(r[F.ORIG]?` · 변시 ${r[F.ORIG]}회 원형`:'');

function renderCard(r){
  const no=r[F.NO],uid=r[F.CODE],u=unitOf(no),bg=bogiOf(uid),pick=lastPick(no),ox=hasOX(r);
  const ch=(r[F.CH]||[]);

      ${isC(r)||!u?`<span class="tag match" id="cMatch">매칭</span>`:`<span class="tag match sm" id="cMatch" title="단원 고치기">✎</span>`}

    </div>

    ${r[F.FILE]==='IMG'?`<div class="fig" id="cFig"><span class="ld">그림 받는 중…</span></div>`:''}
    ${(r[F.BOGI]||[]).length?`<div class="bogi">${r[F.BOGI].map(b=>`<div class="row" data-k="${b.키}" data-ans="${b.정오}">
        <span class="k">${b.키}.</span><span class="t">${esc(b.내용||bogiLineText(r,b.키))}</span>

      </div>`).join('')}</div>`:''}
    ${ch.some(x=>x)?`<div class="choices">${ch.map((t,i)=>`<button data-c="${i+1}" class="${pick===String(i+1)?'pick':''}">${'①②③④⑤'[i]} ${esc(t)}</button>`).join('')}</div>`:''}
    <details id="cDet"><summary>정답 · 해설${r[F.SOLPG]?` (부록 ${r[F.SOLPG]}쪽)`:''}</summary>
      <div class="sol"><b>정답 ${r[F.ANS]?'①②③④⑤'[+r[F.ANS]-1]||r[F.ANS]:'—'}</b>${sol?'<div class="soltx">'+sol+'</div>':''}
        <div class="jump">${r[F.BPAGE]?`<span class="tag page" data-page="${r[F.BPAGE]}">교재 ${r[F.BPAGE]}쪽 ${esc(unitName(u))}</span>`:''}
        ${r[F.SOLPG]?`<span class="tag page" data-page="${r[F.SOLPG]}">부록 ${r[F.SOLPG]}쪽</span>`:''}</div>

function ssetZoom(s,cx,cy){const vp=$('#svp');cx=cx??vp.clientWidth/2;cy=cy??vp.clientHeight/2;s=Math.max(SUB.MIN,Math.min(SUB.MAX,s));

function szoomTo(rect,anim){
  const vp=$('#svp'),pad=24;const s=Math.min(SUB.MAX,Math.min((vp.clientWidth-pad*2)/rect.w,(vp.clientHeight-pad*2)/rect.h));
  const T={S:s,X:(vp.clientWidth-rect.w*s)/2-rect.x*s,Y:(vp.clientHeight-rect.h*s)/2-rect.y*s};

  (function step(t){const k=Math.min(1,(t-t0)/280),e=1-Math.pow(1-k,3);SUB.S=s0+(T.S-s0)*e;SUB.X=x0+(T.X-x0)*e;SUB.Y=y0+(T.Y-y0)*e;sapply();if(k<1)requestAnimationFrame(step)})(t0);

}
function smini(){const m=$('#smini');if(!m)return;const W=m.clientWidth,H=m.clientHeight;const sc=Math.min(W/(SB.r+60),H/(SB.b+60));const ox=(W-SB.r*sc)/2,oy=(H-SB.b*sc)/2;
  let h='';for(let i=0;i<6;i++){const p=spos(i);h+=`<i style="left:${p.x*sc+ox}px;top:${p.y*sc+oy}px;width:${SPW*sc}px;height:${SPH*sc}px"></i>`}
  const vp=$('#svp');h+=`<div class="view" style="left:${(-SUB.X/SUB.S)*sc+ox}px;top:${(-SUB.Y/SUB.S)*sc+oy}px;width:${vp.clientWidth/SUB.S*sc}px;height:${vp.clientHeight/SUB.S*sc}px"></div>`;m.innerHTML=h}
/* 보이는 영역만 현재 배율로 타일 렌더 — 쪽 전체 캔버스 금지(아이패드 사파리 한도) */
let SRENDER=0;
async function srender(){
  if(!SUB.ready)return;const my=++SRENDER;
  const vp=$('#svp'),W=vp.clientWidth,H=vp.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  const S=SUB.S,X=SUB.X,Y=SUB.Y;const tiles=$('#stiles');
  const frag=[];
  for(let i=0;i<6;i++){
    const p=spos(i);const sx=X+p.x*S,sy=Y+p.y*S,sw=SPW*S,sh=SPH*S;
    const vx0=Math.max(0,sx),vy0=Math.max(0,sy),vx1=Math.min(W,sx+sw),vy1=Math.min(H,sy+sh);
    if(vx1<=vx0||vy1<=vy0)continue;
    const px0=(vx0-sx)/S,py0=(vy0-sy)/S,px1=(vx1-sx)/S,py1=(vy1-sy)/S;   /* 쪽 좌표(pt) */
    frag.push({i,px0,py0,px1,py1,vx0,vy0});
  }
  const out=[];
  for(const t of frag){
    let doc;try{doc=await noteDoc(t.i+1)}catch(e){continue}
    if(my!==SRENDER)return;
    const pg=await doc.getPage(1);
    const cw=Math.min(4096,Math.round((t.px1-t.px0)*S*dpr)),chh=Math.min(4096,Math.round((t.py1-t.py0)*S*dpr));
    if(cw<2||chh<2)continue;
    const cv=document.createElement('canvas');cv.width=cw;cv.height=chh;
    cv.style.cssText=`position:absolute;left:${t.vx0}px;top:${t.vy0}px;width:${(t.px1-t.px0)*S}px;height:${(t.py1-t.py0)*S}px`;
    const base=pg.getViewport({scale:1});const k=S*dpr*(SPW/base.width);
    const vpv=pg.getViewport({scale:k,offsetX:-t.px0*S*dpr,offsetY:-t.py0*S*dpr});
    try{await pg.render({canvasContext:cv.getContext('2d'),viewport:vpv}).promise}catch(e){continue}
    if(my!==SRENDER)return;
    out.push(cv);
  }
  if(my!==SRENDER)return;
  tiles.innerHTML='';out.forEach(c=>tiles.appendChild(c));tiles.style.transform='';SUB.tile={S,X,Y};
}
async function subBuild(){
  const w=$('#sworld');w.innerHTML='';
  for(let i=0;i<6;i++){const p=spos(i);
    const d=document.createElement('div');d.className='spg';d.style.left=p.x+'px';d.style.top=p.y+'px';d.dataset.i=i;
    d.innerHTML=`<svg class="sink" viewBox="0 0 ${SPW} ${SPH}" width="${SPW}" height="${SPH}"></svg>`;w.appendChild(d)}
  SUB.cols={};
  for(let i=0;i<6;i++){
    try{const doc=await noteDoc(i+1);const pg=await doc.getPage(1);const base=pg.getViewport({scale:1});const tc=await pg.getTextContent();
      const heads=[];tc.items.forEach(it=>{const m=String(it.str).match(/^(\d\.\d)\s/);if(m||/^\d\.\d$/.test(it.str.trim())){heads.push({sec:(m?m[1]:it.str.trim()),x:it.transform[4]*(SPW/base.width),y:it.transform[5]})}});
      heads.sort((a,b)=>a.x-b.x);
      const uniq=[];heads.forEach(h=>{if(!uniq.find(u=>u.sec===h.sec))uniq.push(h)});
      uniq.forEach((h,j)=>{const x0=Math.max(0,h.x-8),x1=j+1<uniq.length?uniq[j+1].x-8:SPW;SUB.cols[h.sec]={page:i,x0,x1};
        const d=document.createElement('div');d.className='scol';d.dataset.sec=h.sec;d.style.cssText=`left:${x0}px;width:${x1-x0}px`;d.title=h.sec;d.onclick=e=>{if(!SUB.pen){e.stopPropagation();szoomSec(h.sec,true)}};
        w.querySelector('.spg[data-i="'+i+'"]').appendChild(d)});
    }catch(e){console.warn('subnote',i+1,e)}
  }
  const chips=$('#schips');chips.innerHTML='';
  TOC.list.forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c.장+'장';s.onclick=()=>{const p=spos(Object.values(SUB.cols).find(x=>x&&TOC.sec[c.절[0].절]&&true)?(c.절[0]&&SUB.cols[c.절[0].절]?SUB.cols[c.절[0].절].page:0):0);szoomTo({x:p.x,y:p.y,w:SPW,h:SPH},true)};chips.appendChild(s);
    c.절.forEach(sc=>{const x=document.createElement('span');x.textContent=sc.절;x.className=SUB.cols[sc.절]?'':'no';x.onclick=()=>szoomSec(sc.절,true);chips.appendChild(x)})});
  for(let i=1;i<=6;i++)await inkLoad(i);
  SUB.ready=true;$('#sinfo').textContent='열 머리 '+Object.keys(SUB.cols).length+'개 · A3×6'+(SUB.repo?'':' · 임시 저장소');
}
async function subOpen(sec,anim){
  const el=$('#sub');el.classList.remove('hide');
  if(!SUB.ready){$('#sinfo').textContent='서브노트 받는 중…';await subBuild()}
  if(sec&&SUB.cols[sec])szoomSec(sec,false);else sfit();
}
$('#sX').onclick=()=>{$('#sub').classList.add('hide');SRENDER++};
$('#sFit').onclick=sfit;$('#s100').onclick=()=>ssetZoom(1);$('#sIn').onclick=()=>ssetZoom(SUB.S*1.25);$('#sOut').onclick=()=>ssetZoom(SUB.S/1.25);
(function(){
  const vp=$('#svp');let ptrs=new Map(),drag=null,pinch=null,stroke=null;
  vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();ssetZoom(SUB.S*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  const toPage=(cx,cy)=>{const r=vp.getBoundingClientRect();const wx=(cx-r.left-SUB.X)/SUB.S,wy=(cy-r.top-SUB.Y)/SUB.S;
    for(let i=0;i<6;i++){const p=spos(i);if(wx>=p.x&&wx<=p.x+SPW&&wy>=p.y&&wy<=p.y+SPH)return {i,x:wx-p.x,y:wy-p.y}}return null};
  vp.addEventListener('pointerdown',e=>{if(e.target.closest('.szoom,.smini,.stools,#schips'))return;vp.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:SUB.S,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,X:SUB.X,Y:SUB.Y};drag=null;stroke=null;return}
    if(SUB.pen&&(e.pointerType==='pen'||!SET.pencil)){const p=toPage(e.clientX,e.clientY);if(!p)return;
      if(SUB.tool==='erase'){inkErase(p);return}
      stroke={i:p.i,c:SUB.tool==='hl'?'#F2C230':SUB.color,w:SUB.tool==='hl'?12:SUB.w,hl:SUB.tool==='hl',p:[p.x,p.y]};inkDraw(stroke,true);return}
    drag={ox:e.clientX,oy:e.clientY,X:SUB.X,Y:SUB.Y};vp.classList.add('panning')});
  vp.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=vp.getBoundingClientRect();const cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;const ns=Math.max(SUB.MIN,Math.min(SUB.MAX,pinch.s*d/pinch.d));
      SUB.X=cx-(pinch.cx-r.left-pinch.X)*(ns/pinch.s);SUB.Y=cy-(pinch.cy-r.top-pinch.Y)*(ns/pinch.s);SUB.S=ns;sapply();return}
    if(stroke){const p=toPage(e.clientX,e.clientY);if(p&&p.i===stroke.i){stroke.p.push(p.x,p.y);inkDraw(stroke,false)}return}
    if(!drag)return;SUB.X=drag.X+(e.clientX-drag.ox);SUB.Y=drag.Y+(e.clientY-drag.oy);sapply()});
  const up=async e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(stroke&&ptrs.size===0){if(stroke.p.length>=4)await inkCommit(stroke);else inkDraw(null,true);stroke=null}if(ptrs.size===0){drag=null;vp.classList.remove('panning')}};
  vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
  window.addEventListener('resize',()=>{if(!$('#sub').classList.contains('hide'))sapply()});
})();
/* 잉크 — 쪽 좌표(pt) 정규화 · SVG 벡터라 배율마다 선명 · 기기별(IndexedDB ink · SYNC 밖) */
let SINK={};
const inkKey=i=>'note:'+i;
async function inkLoad(i){SINK[i]=(await get('ink',inkKey(i)))||{s:[]};inkPaint(i)}
function pathD(p){let d='M'+(p[0]*SPW).toFixed(1)+' '+(p[1]*SPH).toFixed(1);for(let k=2;k<p.length;k+=2)d+=' L'+(p[k]*SPW).toFixed(1)+' '+(p[k+1]*SPH).toFixed(1);return d}
function inkPaint(i){const svg=$('#sworld .spg[data-i="'+(i-1)+'"] .sink');if(!svg)return;
  svg.innerHTML=(SINK[i].s||[]).map((s,j)=>`<path data-j="${j}" d="${pathD(s.p)}" stroke="${s.c}" stroke-width="${s.w}" fill="none" stroke-linecap="round" stroke-linejoin="round"${s.hl?' opacity=".45"':''}/>`).join('')+'<path id="slive" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'}
function inkDraw(st,reset){const i=st?st.i:null;const live=st?$('#sworld .spg[data-i="'+i+'"] #slive'):null;
  if(reset&&!st){$$('#slive').forEach(x=>x.setAttribute('d',''));return}
  if(!live)return;live.setAttribute('stroke',st.c);live.setAttribute('stroke-width',st.w);if(st.hl)live.setAttribute('opacity','.45');
  let d='M'+st.p[0].toFixed(1)+' '+st.p[1].toFixed(1);for(let k=2;k<st.p.length;k+=2)d+=' L'+st.p[k].toFixed(1)+' '+st.p[k+1].toFixed(1);live.setAttribute('d',d)}
async function inkCommit(st){const i=st.i+1;const p=[];for(let k=0;k<st.p.length;k+=2)p.push(+(st.p[k]/SPW).toFixed(4),+(st.p[k+1]/SPH).toFixed(4));
  SINK[i].s.push({c:st.c,w:st.w,hl:st.hl,p});await put('ink',inkKey(i),SINK[i]);inkPaint(i)}
async function inkErase(pt){const i=pt.i+1;const S=SINK[i].s;let best=-1,bd=9;
  S.forEach((s,j)=>{for(let k=0;k<s.p.length;k+=2){const d=Math.hypot(s.p[k]*SPW-pt.x,s.p[k+1]*SPH-pt.y);if(d<bd){bd=d;best=j}}});
  if(best>=0){S.splice(best,1);await put('ink',inkKey(i),SINK[i]);inkPaint(i)}}
async function inkUndo(){for(let i=6;i>=1;i--){}const vis=[];for(let i=1;i<=6;i++)if(SINK[i]&&SINK[i].s.length)vis.push(i);if(!vis.length)return;const i=vis[vis.length-1];SINK[i].s.pop();await put('ink',inkKey(i),SINK[i]);inkPaint(i)}
$$('#stools span[data-tool]').forEach(b=>b.onclick=()=>{const t=b.dataset.tool;SUB.pen=t!=='view';SUB.tool=t==='view'?'pen':t;$$('#stools span[data-tool]').forEach(x=>x.classList.toggle('on',x===b));$('#svp').classList.toggle('pen',SUB.pen)});
$('#sUndo').onclick=inkUndo;
/* 올리기 — 쪽별로 갈라 저장소 PUT · 100MB 넘는 쪽은 거부 */
$('#sUp').onclick=()=>$('#sFile').click();
$('#sFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  if(!recToken()){toast('🔑 토큰이 없습니다');return}
  try{
    const buf=await f.arrayBuffer();const src=await PDFLib.PDFDocument.load(buf);const n=src.getPageCount();
    if(n!==6&&!confirm(n+'쪽입니다(기대 6). 그래도 올릴까요?'))return;
    for(let i=0;i<Math.min(n,6);i++){
      const d=await PDFLib.PDFDocument.create();const [pg]=await d.copyPages(src,[i]);d.addPage(pg);const bytes=await d.save();
      if(bytes.length>100*1048576){toast((i+1)+'쪽이 100MB 를 넘습니다 — 굿노트에서 줄여서 다시');return}
      const np=await notePath(i+1);$('#sinfo').textContent=`올리는 중 ${i+1}/${Math.min(n,6)}…`;
      await ghPutBin(np.repo,np.path,bytes);await del('pdf','note:'+(i+1));
      if(SUB.pages[i])SUB.pages[i].doc=null;
    }
    SUB.ready=false;toast('서브노트를 올렸습니다');await subOpen('',false);
  }catch(err){toast('올리기 실패 — '+(err.message||err))}
  e.target.value='';
};
async function ghPutBin(repo,path,bytes){
  const url='https://api.github.com/repos/'+repo+'/contents/'+encodeURI(path);
  let sha=null;try{const r=await fetch(url+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github+json'},cache:'no-store'});if(r.ok)sha=(await r.json()).sha}catch(e){}
  let bin='';const u8=new Uint8Array(bytes);for(let i=0;i<u8.length;i+=8192)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
  const body={message:recWho()+' · '+path,content:btoa(bin),branch:'main'};if(sha)body.sha=sha;
  const r=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('PUT '+path+' '+r.status);
}
