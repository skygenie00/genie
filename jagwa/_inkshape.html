<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>잉크 형식 세기 · 자과앱</title>
<style>body{margin:0;padding:14px;font:13px/1.6 -apple-system,"Apple SD Gothic Neo",sans-serif;background:#F6F5F1}
pre{background:#fff;border:1px solid #E3E2DC;border-radius:10px;padding:12px;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace}
b.no{color:#B03A2E} b.ok{color:#2E7D6F}</style></head><body>
<h3>잉크 기록 형식 — 옛 형식이 몇 개인가</h3>
<pre id="o">읽는 중…</pre>
<script>
function opens(name){return new Promise(function(ok){var r=indexedDB.open(name);
  r.onsuccess=function(e){ok(e.target.result)};r.onerror=function(){ok(null)};r.onblocked=function(){ok(null)}})}
function pairs(db){return new Promise(function(ok){
  try{var s=db.transaction('ink','readonly').objectStore('ink'),a=s.getAllKeys(),b=s.getAll(),K=null,V=null;
    a.onsuccess=function(){K=a.result||[];if(V)ok({k:K,v:V})};
    b.onsuccess=function(){V=b.result||[];if(K)ok({k:K,v:V})};
    a.onerror=b.onerror=function(){ok(null)}}catch(e){ok(null)}})}
function shape(v){
  if(v===null||v===undefined)return '빈값';
  if(Array.isArray(v))return '배열(옛)';
  if(typeof v!=='object')return typeof v;
  if(Array.isArray(v.s))return '새(s 배열 '+v.s.length+'획)';
  var ks=Object.keys(v);
  if(ks.length&&ks.every(function(k){return /^\d+$/.test(k)}))return '옛 층 꼴({'+ks.join(',')+'})';
  return '모르는 꼴({'+ks.slice(0,4).join(',')+'})';
}
(async function(){
  var L=[];
  for(const nm of ['earth1','bio1','phys535']){
    var db=await opens(nm);
    if(!db){L.push(nm+' : 열지 못함');continue}
    if(!db.objectStoreNames.contains('ink')){L.push(nm+' : ink 스토어 없음');continue}
    var p=await pairs(db);
    if(!p){L.push(nm+' : 읽기 실패');continue}
    var tally={},bad=[],n=p.k.length;
    for(var i=0;i<n;i++){
      var pre=String(p.k[i]).indexOf('bink:')===0?'교재 bink':(String(p.k[i]).indexOf('note:')===0?'서브노트 note':'문항');
      var sh=shape(p.v[i]);var t=pre+' → '+sh;
      tally[t]=(tally[t]||0)+1;
      var isNew=sh.indexOf('새(')===0;
      var wantNew=(pre!=='문항');
      if((wantNew&&!isNew)||(!wantNew&&isNew))bad.push(String(p.k[i])+' = '+sh);
    }
    L.push('■ '+nm+' — ink 기록 '+n+'개');
    Object.keys(tally).sort().forEach(function(t){L.push('   '+tally[t]+' × '+t)});
    if(bad.length)L.push('   <b class="no">★ 어긋난 기록 '+bad.length+'개</b> — 이게 필기를 죽인다\n     '+bad.slice(0,12).join('\n     '));
    else L.push('   <b class="ok">형식 어긋남 0</b>');
    L.push('');
  }
  document.getElementById('o').innerHTML=L.join('\n');
})();
</script></body></html>
