<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA2502 모션 — 포물선 vx·vy</title>
<style>
:root{--bg:#ffffff;--card:#f4f3ef;--tx:#1f1f1e;--mu:#6b6a65;--ln:#c9c7bf;--vx:#0F6E56;--vy:#D85A30;--tr:#534AB7}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#2a2a28;--tx:#ecebe6;--mu:#a8a69f;--ln:#55544f;--vx:#5DCAA5;--vy:#F0997B;--tr:#AFA9EC}}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.w{padding:10px 12px;max-width:760px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
button{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);cursor:pointer}
input[type=range]{flex:1}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.m{background:var(--card);border-radius:8px;padding:6px 10px}.m b{display:block;font-size:19px;font-weight:500}.m span{font-size:12px;color:var(--mu)}
#msg{font-size:14px;color:var(--mu);min-height:22px;margin-top:8px}
canvas{width:100%;height:300px;display:block}
</style></head><body><div class="w">
<div class="row"><button id="play">▶ 재생</button><input type="range" id="ts" min="0" max="4" step="0.01" value="0"><b id="tout" style="min-width:66px">t = 0.00s</b></div>
<canvas id="cv"></canvas>
<div class="g">
<div class="m"><span>vx (수평)</span><b id="mvx" style="color:var(--vx)">10</b></div>
<div class="m"><span>vy (연직)</span><b id="mvy" style="color:var(--vy)">20</b></div>
<div class="m"><span>속력 √(vx²+vy²)</span><b id="msp">22.4</b></div>
<div class="m"><span>위치 (x, y)</span><b id="mpos">0, 0</b></div>
</div>
<div id="msg"></div>
<div class="row" style="flex-wrap:wrap"><button data-t="1">A (t=1)</button><button data-t="2">최고점 (t=2)</button><button data-t="3">B (t=3)</button><button data-t="0">처음부터</button></div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ts=document.getElementById('ts'),tout=document.getElementById('tout'),play=document.getElementById('play');
const mvy=document.getElementById('mvy'),msp=document.getElementById('msp'),mpos=document.getElementById('mpos'),msg=document.getElementById('msg');
const VX=10,VY=20,G=10;let t=0,run=false,last=0;
const cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
function arrow(x1,y1,x2,y2,c,w){const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();if(L<4)return;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-.4),y2-9*Math.sin(a-.4));ctx.lineTo(x2-9*Math.cos(a+.4),y2-9*Math.sin(a+.4));ctx.closePath();ctx.fill()}
function draw(){
const W=cv.clientWidth,H=cv.clientHeight,pl=40,pr=20,pt=24,pb=30,sx=(W-pl-pr)/40,sy=(H-pt-pb)/22,X=x=>pl+x*sx,Y=y=>H-pb-y*sy;
const tx=cs('--tx'),mu=cs('--mu'),ln=cs('--ln'),cvx=cs('--vx'),cvy=cs('--vy'),ctr=cs('--tr');
ctx.clearRect(0,0,W,H);ctx.font='12px sans-serif';
ctx.strokeStyle=ln;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(40),Y(0));ctx.moveTo(X(0),Y(0));ctx.lineTo(X(0),Y(22));ctx.stroke();
ctx.fillStyle=mu;for(let i=0;i<=40;i+=10)ctx.fillText(i+'m',X(i)-8,Y(0)+16);for(let j=5;j<=20;j+=5)ctx.fillText(j,X(0)-24,Y(j)+4);
ctx.setLineDash([4,4]);ctx.beginPath();for(let s=0;s<=4.001;s+=.05){const x=VX*s,y=VY*s-5*s*s;s?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke();
ctx.beginPath();ctx.moveTo(X(10),Y(15));ctx.lineTo(X(30),Y(15));ctx.moveTo(X(20),Y(0));ctx.lineTo(X(20),Y(20));ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle=mu;ctx.fillText('AB = 20m (2초)',X(20)-40,Y(15)-6);ctx.fillText('대칭축 t=2s',X(20)+4,Y(3));
ctx.strokeStyle=ctr;ctx.lineWidth=2.5;ctx.beginPath();for(let s=0;s<=t+1e-4;s+=.02){const x=VX*s,y=VY*s-5*s*s;s?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke();
[[1,'A'],[2,'최고점'],[3,'B']].forEach(([s,l])=>{const x=VX*s,y=VY*s-5*s*s;ctx.fillStyle=t>=s-.005?ctr:ln;ctx.beginPath();ctx.arc(X(x),Y(y),4,0,7);ctx.fill();ctx.fillStyle=tx;ctx.fillText(l+' (t='+s+')',X(x)+(s==2?-26:-18),Y(y)-(s==2?10:12))});
const x=VX*t,y=VY*t-5*t*t,vy=VY-G*t,k=2.2,px=X(x),py=Y(y);
arrow(px,py,px+VX*k,py,cvx,2.5);arrow(px,py,px,py-vy*k,cvy,2.5);arrow(px,py,px+VX*k,py-vy*k,tx,1.5);
ctx.fillStyle=tx;ctx.beginPath();ctx.arc(px,py,6,0,7);ctx.fill();
mvy.textContent=vy.toFixed(1);msp.textContent=Math.hypot(VX,vy).toFixed(1);mpos.textContent=x.toFixed(1)+', '+Math.max(0,y).toFixed(1);tout.textContent='t = '+t.toFixed(2)+'s';
let m='';
if(Math.abs(t)<.03)m='발사: v₀ = √(10² + 20²) = 10√5 ≈ 22.4 m/s — 보기 ①(10)은 수평 성분만 본 값';
else if(Math.abs(t-1)<.03)m='A: vy = 20 − 10×1 = 10 → 속력 10√2 (보기 ② 함정) · 높이 15m';
else if(Math.abs(t-2)<.03)m='최고점: vy = 0 이어도 vx = 10 은 남는다 → 속력 0 이 아니라 10';
else if(Math.abs(t-3)<.03)m='B: A 와 같은 높이 15m · vy = −10 · 속력은 A 와 같고 방향만 반대';
else if(t>3.97)m='착지: 체공 4초 · 수평 도달거리 10 × 4 = 40m';
msg.textContent=m}
function setIcon(){play.textContent=run?'❚❚ 멈춤':'▶ 재생'}
function loop(n){if(!run)return;const dt=last?(n-last)/1000:0;last=n;t=Math.min(4,t+dt*.8);ts.value=t;draw();if(t>=4){run=false;setIcon();return}requestAnimationFrame(loop)}
play.onclick=()=>{if(t>=4)t=0;run=!run;last=0;setIcon();if(run)requestAnimationFrame(loop)};
ts.oninput=()=>{run=false;setIcon();t=+ts.value;draw()};
document.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{run=false;setIcon();t=+b.dataset.t;ts.value=t;draw()});
addEventListener('resize',()=>{size();draw()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
size();draw();
</script></body></html>
