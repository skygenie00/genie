<script>
(function(){
  var card=document.getElementById('card');
  var hide=document.getElementById('hideBtn');
  var show=document.getElementById('showBtn');
  var answers=Array.prototype.slice.call(card.querySelectorAll('.ans'));
  function fit(){
    answers.forEach(function(g){
      var ph=g.querySelector('.ph'); if(!ph) return;
      var box=null;
      g.querySelectorAll('text').forEach(function(t){
        try{var b=t.getBBox(); if(!box){box={x:b.x,y:b.y,x2:b.x+b.width,y2:b.y+b.height};}
          else{box.x=Math.min(box.x,b.x);box.y=Math.min(box.y,b.y);box.x2=Math.max(box.x2,b.x+b.width);box.y2=Math.max(box.y2,b.y+b.height);}}catch(e){}
      });
      if(box&&box.x2>box.x){ph.setAttribute('x',box.x-4);ph.setAttribute('y',box.y-2);ph.setAttribute('width',box.x2-box.x+8);ph.setAttribute('height',box.y2-box.y+4);}
    });
  }
  function setBlank(on){
    card.classList.toggle('blank',on);
    hide.setAttribute('aria-pressed',on?'true':'false');
    answers.forEach(function(a){a.classList.remove('shown');});
  }
  hide.addEventListener('click',function(){setBlank(!card.classList.contains('blank'));});
  show.addEventListener('click',function(){setBlank(false);});
  answers.forEach(function(a){a.addEventListener('click',function(){if(card.classList.contains('blank'))a.classList.toggle('shown');});});
  fit();
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
})();
</script>
</body>
</html>
