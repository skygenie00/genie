<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조판기 v0</title>
<style>
/* ══ 목업 v2~v5 공통 팔레트 그대로 ══ */
:root{
  --ink:#1a1a1a; --sub:#6b675f; --line:#e3e0d8; --paper:#fdfcf9; --panel:#f6f4ef;
  --rule:#D93B3B;   /* 원칙·강행 */
  --exc:#2F6FD0;    /* 예외·단서 */
  --lbl:#c96a10;    /* 조문 라벨 */
  --hl-y:#ffe9a0; --hl-p:#ffd0e0;
  --ok:#1d7a3e; --warn:#b06000; --post:#fff3b0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#efede7;color:var(--ink);overflow:hidden;
  font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:13.5px;line-height:1.62}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{display:flex;flex-direction:column;height:100vh;background:#fff}

/* ── 상단 ── */
.topbar{display:flex;align-items:center;gap:8px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;flex-wrap:wrap}
.logo{font-weight:800;font-size:14px;white-space:nowrap}
.search{flex:1;min-width:150px;display:flex;gap:7px;align-items:center;cursor:text;
  background:#fff;border:1px solid #d9d6ce;border-radius:9px;padding:5px 11px;color:#999}
.tab{border-radius:7px;padding:3px 10px;background:#e9e6df;color:#555;font-size:12.5px}
.tab.on{background:var(--exc);color:#fff}
.pill{border-radius:8px;padding:2px 10px;font-size:12px;background:#e9e6df;color:#555}
.pill.on{background:#1a1a1a;color:#fff}
.pill.wait{color:#aaa;background:#f2f0ea}
.badge{font-size:11px;border-radius:6px;padding:1px 7px;background:#efece5;color:#777}

/* ── 본문 3단 ── */
.body2{display:flex;flex:1;min-height:0}
.rail{width:40px;flex-shrink:0;background:#eceae3;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;font-size:11px}
.rail .rb{writing-mode:vertical-rl;padding:9px 4px;border-radius:7px;color:#777;white-space:nowrap}
.rail .rb b{font-size:10px}
.rail .rb.on{background:var(--exc);color:#fff}
.rail .rb[disabled]{opacity:.45;cursor:not-allowed}
.handle{width:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--line);background:#f3f1ec;color:#a5a19a;cursor:pointer;font-size:12px}
.tree{width:212px;flex-shrink:0;border-right:1px solid var(--line);overflow:auto;
  background:var(--panel);padding:8px 0;font-size:12.5px}
.tree.hid{display:none}
.tree .h{padding:3px 13px;color:#9a958b;font-size:11px}
.tree .r{padding:5px 13px;display:flex;justify-content:space-between;gap:6px;align-items:center;cursor:pointer}
.tree .r:hover{background:#efece4}
.tree .r span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .r em{font-style:normal;color:#a5a19a;font-size:11px;display:inline-flex;gap:5px;align-items:center;flex-shrink:0}
.tree .r.on{background:#e8effb;border-left:3px solid var(--exc);padding-left:10px}
.tree .r.on span.nm{color:var(--exc);font-weight:700}
.tree .r.on em{color:var(--exc)}
.legend{padding:5px 13px;border-top:1px dashed #ddd;margin-top:6px;font-size:10.5px;color:#9a958b;line-height:1.7}
.bars{display:inline-flex;gap:2px}
.bars i{width:9px;height:5px;border-radius:2px;display:inline-block}
.bx{background:#d6d3cb}
.main{flex:1;padding:15px 18px 90px;position:relative;min-width:0;overflow:auto}

/* ── 조문 머리 (리담 구조) ── */
.jt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.jt b{font-size:16.5px}
.jt b .sub{font-weight:400;color:#777}
.jotitle{font-size:25px;font-weight:800;margin:6px 0 2px;line-height:1.3}
.jotitle .no{color:var(--exc)}
.sihaeng{color:#9a958b;font-size:12px;margin-bottom:9px}
.conn{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.conn .k{color:#9a958b;font-size:11.5px;margin-right:3px}
/* 조문 안의 모드 바 — 빈칸은 갈래가 아니라 이 조문의 모드다 */
.modebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:11px;padding:7px 10px;background:var(--panel)}
.modebar .mode{border-radius:999px;padding:3px 13px}
.modebar .mode.on{background:var(--exc);border-color:var(--exc);color:#fff}
.modebar .mode .n{margin-left:5px;font-size:11px;opacity:.75}
.box{border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-top:10px;background:var(--paper)}
.boxh{font-size:11px;color:#9a958b;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fold{border-style:dashed;background:#fafaf8;color:#77736b;cursor:pointer}
.fold .oi{float:right;color:var(--exc);text-decoration:underline;font-size:11.5px}
/* ── 원문 = 법전 조판 (§2) ──
   ⚠ 글자 크기를 사용자가 바꿀 수 없다. 필기(§4)가 이 고정에 기대고 있다. */
.origbody{color:#3a3a3a;margin-top:8px;border-top:1px dashed #ddd;padding-top:10px;
  overflow-x:auto}
.bjpage{font-family:"Batang","BatangChe","AppleMyungjo","Nanum Myeongjo","Noto Serif KR",serif;
  font-size:15px;line-height:1.78;text-align:justify;
  word-break:break-all;overflow-wrap:anywhere;hyphens:none;margin:0 auto}
.bjpage .bj{margin:0}
.bjpage .bj-head{font-weight:800;margin-bottom:.1em}
.bjpage .bj-jang{text-align:center;font-weight:800;margin:.4em 0}
.bjpage .bj-hang{margin-top:.15em}
.bjpage .bj-ho{padding-left:1.7em;text-indent:-1.7em}
.bjpage .bj-mok{padding-left:3.3em;text-indent:-1.7em}
.bjpage .bj-note{color:#77736b}
.bjnote{font-size:11px;color:#a5a19a;margin-top:8px}
.ln{margin:3px 0;white-space:pre-wrap;word-break:break-word}
.ln.ho{padding-left:1.5em}
.ln.mok{padding-left:3em}
.ln.hang{margin-top:7px}
.ln.ref{color:#9a958b;font-size:12px;margin-top:9px}
.ln.tail{color:#8a867d;font-size:12.5px}
.ln.fd{color:#77736b;font-size:12.5px;padding-left:1em;border-left:2px solid #e6e3db;margin-left:2px}
.anchor{color:#c9c5bc;font-size:10px;margin-left:5px}
mark.y{background:var(--hl-y)} mark.p{background:var(--hl-p)}
.joLink{color:var(--exc);font-weight:600;background:#eaf1fb;border-radius:4px;
  padding:0 4px;text-decoration:underline dotted;white-space:nowrap;cursor:pointer}
.joLink.dead{color:#8a867d;background:#f2f0ea;cursor:default}
.lbl{color:var(--lbl);background:#fdf1e3;border-radius:4px;padding:0 4px;
  font-size:11.5px;font-weight:600;white-space:nowrap;cursor:pointer;margin-left:2px}
.lbl.off{color:#c9c5bc;background:#f2f0ea;font-weight:400;padding:0 5px}
sup.fn{color:var(--rule);font-size:10px;cursor:pointer;text-decoration:underline dotted}
.embed{display:inline-block;background:#f2f0ea;border:1px dashed #d9d6ce;border-radius:5px;
  padding:0 6px;color:#8a867d;font-size:11.5px}
.chip{display:inline-block;border-radius:14px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0}
.c-prec{background:#eaf1fb;color:var(--exc)}
.c-quiz{background:#e9f7ee;color:var(--ok)}
.c-theme{background:#f3ecfd;color:#7a3ed0}
.c-card{background:#fff2e0;color:var(--warn)}
.c-warn{background:#fde9e9;color:var(--rule)}
.c-src{background:#efece5;color:#777}

/* ── 빈 상태 ── */
.empty{color:#9a958b;text-align:center;padding:52px 20px;font-size:12.8px}
.empty .big{font-size:30px;opacity:.4;display:block;margin-bottom:8px}

/* ── 판례 ── */
.plist{width:262px;flex-shrink:0;border-right:1px solid var(--line);overflow:auto}
.plist.hid{display:none}
.prow{padding:9px 12px;border-bottom:1px solid #eeece6;font-size:12.5px;cursor:pointer}
.prow:hover{background:#faf8f3}
.prow.on{background:#e8effb}
.prow .pn{font-weight:700}
.prow .iss{color:#444;margin:1px 0 3px}
.tool{border:1px solid #d9d6ce;border-radius:8px;padding:3px 11px;background:#fff;font-size:12.5px;color:#555}
.tool.on{border-color:var(--exc);background:var(--exc);color:#fff}
.tool.last{color:#999}
.tool[disabled]{color:#c2beb6;background:#f4f2ec;border-color:#e5e2da;cursor:not-allowed}
pre.raw{white-space:pre-wrap;font:12.8px/1.7 inherit;margin:0;color:#333}
.ctrlbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 12px;
  border-bottom:1px solid #eeece6;background:var(--panel)}
select.sel{font:inherit;font-size:12px;padding:2px 7px;border:1px solid #d9d6ce;border-radius:7px;background:#fff;color:#555}
select.sel[disabled]{color:#b5b1a8;background:#f4f2ec}

/* ── 2차 보드 ── */
.gwrap{overflow:auto;padding:12px 0}
.grid{display:grid;gap:6px}
.gh{font-size:11.5px;font-weight:700;color:#666;background:var(--panel);border-radius:7px;
  padding:4px 8px;text-align:center;position:sticky;top:0;z-index:2}
.gr{font-size:11.5px;font-weight:700;color:#666;background:var(--panel);border-radius:7px;
  padding:4px 8px;display:flex;align-items:center;justify-content:center;position:sticky;left:0;z-index:1}
.cell{border:1px solid var(--line);border-radius:9px;background:#fff;padding:6px 8px;
  font-size:11.5px;line-height:1.5;color:#333;cursor:pointer}
.cell:hover{border-color:var(--exc)}
.cell + .cell{margin-top:5px}
.cell b{font-size:11.5px}
.cell .t{color:#9a958b;font-size:10.5px}
.cell.hot{border-color:#e5a53a;background:#fffaf0}
.cellnone{border:1px dashed #e8e5dd;border-radius:9px;background:#faf9f6}
.unpl{margin-top:16px;border:1px solid #e5a53a;background:#fffaf0;border-radius:10px;padding:10px 13px}
.unpl h4{margin:0 0 6px;font-size:12px;color:#9a6b12}
.unpl div.u{font-size:11.5px;color:#7a6134;padding:1px 0;cursor:pointer}

/* ── 지문 ── */
.jimun{border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-top:10px;background:var(--paper)}
.jhd{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.src{font-size:11px;border-radius:6px;padding:1px 8px;font-weight:700}
.src.기출{background:#eaf1fb;color:var(--exc)}
.src.기출변형{background:#fdf1e3;color:var(--lbl)}
.src.제7판{background:#e9f7ee;color:var(--ok)}
.qt{font-size:13.5px;margin:6px 0}
.ansb{display:inline-block;border:1px solid #d9d6ce;border-radius:7px;padding:1px 12px;background:#fff;font-weight:700}
.ansb.O{color:var(--exc)} .ansb.X{color:var(--rule)}
.sol{color:#555;font-size:12.3px;margin-top:7px;background:#faf8f3;border:1px solid #eeece6;
  padding:8px 10px;border-radius:8px;white-space:pre-wrap}
.qmun{font-weight:700;font-size:13.5px;margin:2px 0 8px}
.sunji{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed #eeece6}
.sunji .sn{color:#9a958b;font-size:11.5px;flex:0 0 16px;text-align:right}
.sunji .st{flex:1;min-width:0}
.ansb.none{color:#c2beb6;font-weight:400}
.tree .r.ch{background:#eceae3;font-weight:700;color:#6b675f;cursor:default}
.tree .r.ch:hover{background:#eceae3}

/* ── 빈칸 ── */
.mode{border:1px solid #d9d6ce;border-radius:8px;padding:3px 10px;background:#fff;font-size:12.5px;color:#555}
.mode.on{border-color:var(--exc);color:var(--exc);background:#eaf1fb;font-weight:700}
.mode.dis{color:#bbb;background:#f4f2ec;border-color:#e5e2da;cursor:not-allowed}
.ctrl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#f2f6fd;
  border:1px solid #d5e2f6;border-radius:9px;padding:6px 11px;margin-top:10px;font-size:12px;color:#456}
.cbtn{background:#fff;border:1px solid #c9d7ef;border-radius:7px;padding:2px 9px;color:#345}

/* ── 팝업 ── */

/* ── 검색 ── */
#sk{position:fixed;inset:0;display:none;z-index:70;background:rgba(40,36,28,.32)}
#skbox{width:min(620px,92vw);margin:11vh auto 0;background:#fff;border-radius:13px;
  border:1px solid var(--line);box-shadow:0 20px 50px rgba(30,25,15,.3);overflow:hidden}
#skin{width:100%;border:0;padding:14px 17px;font-size:15px;outline:none;border-bottom:1px solid var(--line);
  font-family:inherit;background:#fff;color:var(--ink)}
#skscope{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);font-size:11.5px;color:#888}
.scope{border:1.5px solid #d9d6ce;border-radius:8px;padding:2px 10px;background:#fff;color:#888;font-size:12.5px}
.scope.on{border-color:var(--exc);background:#eaf1fb;color:var(--exc);font-weight:700}
.scope.dis{color:#c2beb6;background:#f4f2ec;border-color:#e5e2da;cursor:not-allowed}
#skres{max-height:48vh;overflow:auto;padding:8px 12px}
.grp{font-size:11px;color:#9a958b;margin:8px 0 4px;letter-spacing:.5px}
.res{padding:7px 11px;border:1px solid #eeece6;border-radius:9px;margin-bottom:5px;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;cursor:pointer}
.res:hover,.res.on{background:#e8effb;border-color:#cfdff5}
.res b{white-space:nowrap;color:var(--exc)}
.res .x{color:#555;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.res .lawtag{margin-left:auto;font-size:10.5px;color:#999}

/* ── 카드 본문 ── */
.ctitle{font-weight:700;font-size:11.5px;margin-bottom:3px;line-height:1.35}
.cbody{font-size:10.5px;line-height:1.45;color:#444;overflow:hidden}
.cbody .cln{white-space:pre-wrap;word-break:break-word}
.cdim{color:#b5b1a8;font-size:10px}
  margin-top:10px;height:calc(100vh - 200px)}
.cstage{position:relative}
.cgroup{position:absolute;border:2px solid #cfcabd;border-radius:12px;background:#00000008}
.cgroup .glabel{position:absolute;top:-11px;left:10px;font-size:11px;font-weight:700;
  background:#cfcabd;color:#fff;border-radius:6px;padding:1px 9px;white-space:nowrap}
.ccard{position:absolute;border:1px solid var(--line);border-radius:8px;background:#fff;
  overflow:hidden;cursor:pointer}
.ccard:hover{border-color:var(--exc);box-shadow:0 2px 8px rgba(47,111,208,.18)}
.cinner{transform-origin:0 0;padding:6px 8px;overflow:hidden}
.cmemo{position:absolute;border:1px solid #e3cf6a;border-radius:8px;background:var(--post);
  overflow:hidden;font-size:11px;color:#6b5f17}
.memoslot{margin-top:10px;border:1px dashed #e3cf6a;background:#fffbe8;border-radius:8px;padding:8px 10px}
.memoslot .mh{font-size:11.5px;font-weight:700;color:#7a6a17;margin-bottom:3px}
.gr{white-space:pre-line;line-height:1.35}

/* ── OX 카드 (민법OX 방식) ── */
.qwrap{border:1px solid var(--line);border-radius:11px;background:#fff;margin-top:10px;padding:10px 13px}
.qhd{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.qb{font-size:10.5px;border-radius:6px;padding:1px 8px;font-weight:600}
.qb.v{background:#f3ecfd;color:#7a3ed0}
.qb.t{background:#eaf1fb;color:var(--exc)}
.qb.n{background:#efece5;color:#777}
.qb.id{background:#f4f2ec;color:#a5a19a;font-weight:400}
.qb.warn{background:#fde9e9;color:var(--rule)}
.qtag{font-size:10.5px;color:#b5b1a8;border:1px solid #eeece6;border-radius:999px;padding:1px 7px;cursor:not-allowed}
.pantog{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#f2f6fd;
  border:1px solid #d5e2f6;border-radius:9px;padding:5px 10px;margin-bottom:8px}
.pantog .pl{font-size:11px;color:#456;font-weight:700}
.qmun{font-weight:700;font-size:13.5px;margin:2px 0 9px}
.oxrow{border-top:1px dashed #eeece6;padding:9px 0}
.oxq{font-size:13.3px;line-height:1.6}
.oxq b{color:var(--exc)}
.oxpick{display:flex;gap:9px;margin-top:8px}
.oxbtn{flex:1;border:1px solid #d9d6ce;border-radius:9px;background:#fff;padding:6px 0;
  display:flex;gap:7px;align-items:center;justify-content:center;font-size:14px}
.oxbtn:hover{border-color:var(--exc)}
.oxbtn .dot{color:#b5b1a8}
.oxbtn .lv{font-weight:800}
.oxbtn .lv.O{color:var(--exc)} .oxbtn .lv.X{color:var(--rule)}
.oxbtn.sel{border-color:#1a1a1a}
.oxbtn.right{border-color:#3fae64;background:#f0faf3}
.oxbtn.wrong{border-color:var(--rule);background:#fdf0f0}
.oxres{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:7px}
.solpv{margin-top:7px;font-size:11.5px;color:var(--exc);text-decoration:underline}
.qft{display:flex;gap:9px;align-items:center;justify-content:flex-end;
  border-top:1px dashed #eeece6;margin-top:9px;padding-top:7px}
.memolink{font-size:11.5px;color:#8a867d;cursor:not-allowed}

.gh.yh{display:flex;flex-direction:column;gap:3px;align-items:stretch;padding:3px 4px}
.ysort{font-size:11px;font-weight:700;color:#666;padding:2px 0;border-radius:5px;white-space:nowrap}
.ysort:hover{background:#e8e5dd;color:var(--exc)}
.ysel{font-size:10.5px;padding:1px 3px;width:100%}
.gr{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 본문 전체 보기(팝업) — 제목 접기 · 단어 메모 ── */
.rbody{margin-top:8px}
.rln{white-space:pre-wrap;word-break:break-word;margin:2px 0;line-height:1.6}
.rh{font-weight:800;margin-top:9px;display:flex;gap:5px;align-items:baseline}
.rh1{font-size:15.5px} .rh2{font-size:14.5px} .rh3{font-size:13.5px}
.rh4,.rh5,.rh6{font-size:13px;color:#555}
.rtog{color:#b5b1a8;font-size:10px;flex:0 0 auto}
.rtog:hover{color:var(--exc)}
.pw{cursor:text;border-radius:3px}
.pw:hover{background:#fff6cf}
.pword{border-bottom:2px dotted #d9be4a}
.pmark{display:inline-block;width:8px;height:8px;border-radius:2px;background:#f0d84a;
  border:1px solid #d9be4a;vertical-align:5px;margin-left:2px}
.memoin{width:100%;min-height:74px;font:inherit;font-size:12.5px;padding:7px 9px;
  border:1px solid #d9d6ce;border-radius:8px;resize:vertical;background:#fffdf3}
.memobtn{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.cbody .ch1,.cbody .ch2{font-weight:800}
.cbody .ch3,.cbody .ch4{font-weight:700;color:#333}

.rbody.card{max-height:none}
.rbody.card .rln{font-size:11px;line-height:1.5;margin:1px 0}
.rbody.card .rh1{font-size:12.5px} .rbody.card .rh2{font-size:12px}
.rbody.card .rh3,.rbody.card .rh4{font-size:11.5px}
.rbody.card .rtog{font-size:9px}
.rtx{cursor:text}
.cell{max-height:420px;overflow:auto}

/* ── 콜아웃(문제·원본) — 접힌 상자 → 팝업 ── */
.callout{display:flex;align-items:center;gap:7px;cursor:pointer;
  border:1px solid #e3cf6a;background:#fffaeb;border-radius:9px;
  padding:6px 11px;margin:6px 0}
.callout:hover{border-color:var(--lbl);background:#fff4d9}
.callout .ci{font-size:12px}
.callout .ct{font-weight:800;color:var(--lbl);font-size:12.5px}
.callout .cn{font-size:10.5px;color:#b09050}
.callout .cx{margin-left:auto;color:var(--lbl)}
.callout.co-note{border-color:#d9d6ce;background:#faf9f6}
.callout.co-note .ct{color:#77736b}
.callout.co-note .cx{color:#a5a19a}
.rbody.card .callout{padding:4px 8px;margin:4px 0}
.rbody.card .callout .ct{font-size:11.5px}

.pop.k-q{border-color:#e3cf6a}

/* ── 팝업(여러 개 · 끌어 옮기기) ── */
.pop{position:fixed;width:440px;max-height:60vh;overflow:auto;
  background:#fff;border:1.5px solid var(--exc);border-radius:11px;
  box-shadow:0 8px 26px rgba(20,40,90,.20);font-size:12.5px}
.pop .ph{display:flex;align-items:center;gap:7px;background:#eaf1fb;color:var(--exc);
  font-size:11px;font-weight:700;padding:5px 10px;position:sticky;top:0;cursor:move;
  user-select:none}
.pop .ph .pdrag{opacity:.65}
.pop .ph .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .ph button{margin-left:auto;color:inherit;font-size:12px;cursor:pointer}
.pop .pb{padding:9px 12px}
.pop.k-fn{border-color:#d9be4a}
.pop.k-fn .ph{background:var(--post);color:#7a6a17}
.pop.k-cell{border-color:#2f9e57}
.pop.k-cell .ph{background:#e9f7ee;color:var(--ok)}
/* 제목 단계 들여쓰기가 눈에 들어오게 세로선 */
.rbody .rh{border-left:2px solid #eeece6;margin-left:0}
.rbody .rh1{border-left-color:var(--exc)}
.rbody .rh2{border-left-color:#c9d7ef}
.rbody .rh3,.rbody .rh4{border-left-color:#eeece6}

/* ══ 마크업 스티커 (§3) — 편집 모드를 켜야만 잡힌다 ══ */
.stkon .stk{outline:1px dashed rgba(47,111,208,.55);outline-offset:1px;
  border-radius:3px;cursor:pointer}
.stkon .stk:hover{outline-color:var(--exc);background:#eaf1fb}
.stkon .box .ln{cursor:text}
.stkbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#f2f6fd;
  border:1px solid #d5e2f6;border-radius:9px;padding:5px 10px;margin-top:8px;font-size:11.5px;color:#456}
.swatch{width:19px;height:19px;border-radius:5px;border:1px solid #c9c5bc;display:inline-block;cursor:pointer}
.swatch.on{outline:2px solid var(--exc);outline-offset:1px}
.stkgrid{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.orphan{background:#fde9e9;color:var(--rule)}

/* ══ 필기 (§4) ══ */
.inkhost{position:relative}
.inklay{position:absolute;left:0;top:0;z-index:5;pointer-events:none;touch-action:pan-y}
/* ⚠ #app 이 아니라 body 에 건다 — 팝업(2차 셀)은 body 밑이라 #app 밑이 아니다 */
body.inkon .inklay{pointer-events:auto}
body.inkon .main,body.inkon .pop{user-select:none}
.inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:65;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;
  border:1.5px solid var(--exc);border-radius:13px;padding:7px 12px;
  box-shadow:0 8px 26px rgba(20,40,90,.20);font-size:12px;color:#456;max-width:94vw}
.inkbar .sep{width:1px;height:18px;background:#e3e0d8}
.inkw{width:22px;height:22px;border-radius:50%;border:1px solid #d9d6ce;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.inkw.on{border-color:var(--exc);background:#eaf1fb}
.inkw i{display:block;border-radius:50%;background:#1a1a1a}
.inkhint{font-size:10.5px;color:#9a958b}

/* ══ 알림 (toast) ══ */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:90;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#1a1a1a;color:#fff;border-radius:9px;padding:7px 15px;font-size:12.5px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:88vw}
.toast.bad{background:#8a1f1f}

/* ══ 기록 내보내기 (§10) ══ */
.rectab{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0}
.rectab td,.rectab th{border-bottom:1px solid #eeece6;padding:3px 6px;text-align:left}
.rectab td.n{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <span class="logo">⚖ 조판기</span>
    <span id="laws" style="display:flex;gap:4px"></span>
    <div class="search" id="ksearch">🔍 <span>조문 · 판례 · 지문 · 메모 (Ctrl K)</span></div>
    <span class="badge" id="lblToggle" style="cursor:pointer">🏷 라벨: 펴짐 ▾</span>
    <span class="badge" id="inkToggle" style="cursor:pointer">✍ 필기</span>
    <span class="badge" id="recBtn" style="cursor:pointer">⤓ 기록</span>
  </header>
  <div class="body2">
    <nav class="rail" id="rail"></nav>
    <div id="slot" style="display:flex;flex:1;min-width:0"></div>
  </div>
</div>

<div id="sk"><div id="skbox">
  <input id="skin" placeholder="조문번호 · 제목 · 본문">
  <div id="skscope"><span>범위(다중):</span>
    <span class="scope on" data-s="jo">📖 조문 ✓</span>
    <span class="scope dis" data-s="prec">⚖ 판례</span>
    <span class="scope dis" data-s="jimun">📝 지문</span>
    <span class="scope dis" data-s="memo">🗒 메모</span>
    <span class="badge" style="margin-left:auto" id="skLaw"></span>
  </div>
  <div id="skres"></div>
</div></div>
<div id="toasts"></div>

<script>
"use strict";
const DATA='data/';
const LAWS=['특허법','상표법','디자인보호법','민사소송법'];
const SHORT={'특허법':'특허','상표법':'상표','디자인보호법':'디보','민사소송법':'민소'};
// 갈래 이동은 **세로 레일 하나만** 한다. 상단 갈래 탭은 없앴다 —
// 리담 실물이 그렇고(lidamuistructure.md §25) 레일과 3개가 겹쳤다. 8/23 사용자 결정.
const RAILS=[['jo','조문'],['prec','판례'],['jimun','1차객'],['cha2','2차']];
// 정본 시행일 — 사양서 §2-1 정본 MST 표
const SIHAENG={'특허법':'2025-11-11','상표법':'2025-11-11',
               '디자인보호법':'2025-11-11','민사소송법':'2025-03-01'};
// 조문 안의 모드 바(리담식). 빈칸은 갈래가 아니라 **이 조문의 모드**다.
const JOMODES=[['본문','본문'],['내용','✎ 내용 빈칸'],['주체','✎ 주체 빈칸'],
               ['기간','✎ 기간 빈칸'],['소제목','소제목만']];

const S={law:'특허법',tab:'jo',jo:null,prec:null,precTab:'요약',
         // 기본 갈래 = 기출 고정(§6-2 ④). 민소도 예외를 두지 않는다.
         // ⚠ 탭 바가 사라지던 것은 기본값이 아니라 붙이는 순서 탓이다 — 그쪽을 고쳤다.
         boardKind:'기출',boardView:'board',treeHid:false,listHid:false,
         precSort:'asc',labels:true,joMode:'본문',
         jimunTab:'ox',mok:null,year:null,
         series:'',yearFilter:'',yearSort:'asc',zoom:0.55,
         // §3 마크업 스티커 편집 모드 · §4 필기 모드 — 둘 다 기본은 꺼짐(T5)
         stick:false,ink:false,inkColor:'#D93B3B',inkW:2,inkErase:false};
const C={};
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;
                   if(x!=null)n.textContent=x;return n;};

async function get(name){
  if(C[name])return C[name];
  const r=await fetch(DATA+name);
  if(!r.ok)throw new Error(name+' '+r.status);
  return C[name]=await r.json();
}

/* ══════════ 골격 ══════════ */
function drawTop(){
  const lw=$('#laws');lw.innerHTML='';
  LAWS.forEach(L=>{const b=el('button','pill'+(S.law===L?' on':''),SHORT[L]);
    b.onclick=()=>{S.law=L;S.jo=null;S.prec=null;
      if(S.tab==='jimun'&&L==='민사소송법')S.tab='jo';render();};lw.appendChild(b);});
  const lt=$('#lblToggle');
  // ⚠ 라벨 전체 토글도 글자 수를 바꾼다 — 필기가 있으면 잠근다(§4-2)
  const lock=S.tab==='jo'&&(S.ink||inkHas('jo|'+S.law+':'+S.jo));
  lt.textContent='🏷 라벨: '+(S.labels?'펴짐 ▾':'접힘 ▸')+(lock?' 🔒':'');
  lt.style.display=S.tab==='jo'?'':'none';
  lt.style.opacity=lock?'.5':'';
  lt.title=lock?'필기가 있어 잠갔다 — 접으면 글자 수가 바뀌어 필기가 어긋난다':'';
  lt.onclick=lock?(()=>toast('필기 때문에 라벨 토글을 잠갔다'))
                 :(()=>{S.labels=!S.labels;render();});

  const it=$('#inkToggle');
  it.textContent=S.ink?'✍ 필기 ON':'✍ 필기';
  it.style.cssText='cursor:pointer'+(S.ink?';background:var(--exc);color:#fff':'');
  it.title='애플펜슬로 쓴다 · 손가락은 스크롤 · 기기 사이에는 안 넘어간다(§4-5)';
  it.onclick=()=>{
    if(!S.ink&&S.stick){S.stick=false;toast('마크업 편집을 끄고 필기를 켰다 — 둘은 같이 못 켠다');}
    S.ink=!S.ink;render();};

  const rb=$('#recBtn');
  rb.textContent='⤓ 기록 '+recTotal();
  rb.title='내보내기·들여오기 — 사파리가 저장분을 지울 수 있다(§10-2)';
  rb.onclick=ev=>popRec(ev);
  $('#skLaw').textContent='법: '+SHORT[S.law];
}
function drawRail(){
  const r=$('#rail');r.innerHTML='';
  RAILS.forEach(([k,label])=>{
    // 민소는 1차 지문 갈래가 없다 — 레일에서 숨긴다(사양서 §4-0)
    if(k==='jimun'&&S.law==='민사소송법')return;
    const b=el('button','rb'+(S.tab===k?' on':''));
    b.appendChild(document.createTextNode(label+' '));
    const n=el('b','','');n.dataset.n=k;b.appendChild(n);
    b.onclick=()=>{S.tab=k;render();};
    r.appendChild(b);
  });
  railCounts();
}
async function railCounts(){
  const set=(k,v)=>{const n=$(`[data-n="${k}"]`);if(n)n.textContent=v;};
  try{set('jo',(await get(`jo_${S.law}_목록.json`)).조.length);}catch(e){set('jo','–');}
  try{const p=await get('prec_과목.json');const m=p[SHORT[S.law]];set('prec',m?m.수:0);}catch(e){set('prec','–');}
  if(S.law==='민사소송법')set('jimun','—');
  else{try{const j=await get('jimun_'+SHORT[S.law]+'.json');set('jimun',j.문항);}
       catch(e){set('jimun','—');}}
  try{const b=await get('2cha_보드.json');let n=0;
      Object.keys(b).forEach(k=>{if(k.endsWith('|'+SHORT[S.law]))n+=b[k].총||0;});
      set('cha2',n.toLocaleString());}catch(e){set('cha2','–');}
}
function emptyBox(icon,msg,sub){
  const d=el('div','empty');
  d.appendChild(el('span','big',icon));
  d.appendChild(document.createTextNode(msg));
  if(sub){const s=el('div','',sub);s.style.cssText='margin-top:6px;font-size:11.5px';d.appendChild(s);}
  return d;
}
function handle(which){
  const h=el('div','handle',(which==='tree'?S.treeHid:S.listHid)?'›':'‹');
  h.title='접기/펴기';
  h.onclick=()=>{if(which==='tree')S.treeHid=!S.treeHid;else S.listHid=!S.listHid;render();};
  return h;
}

/* ══════════ 줄 렌더 — 평문 좌표계 위에 요소를 겹친다 ══════════ */
let JOTITLE={};        // 조키 → 제목 (주황 라벨용)
function renderLine(row,opt){
  opt=opt||{};
  const t=row.t||'', n=t.length;
  const opens=[],closes=[];
  const push=(a,i,v)=>{(a[i]=a[i]||[]).push(v);};
  // opt.m = 내 스티커 층을 덮어 계산한 마크업(§3-3). 없으면 JSON 것 그대로.
  (opt.m||row.m||[]).forEach(m=>{push(opens,Math.max(0,m.a),{mk:m});push(closes,Math.min(n,m.b),{mk:m});});
  (row.e||[]).forEach(e=>{if(e.k==='L'){push(opens,e.a,{ln:e});push(closes,e.b,{ln:e});}});
  const frag=document.createDocumentFragment();
  const stack=[frag];
  const top=()=>stack[stack.length-1];
  for(let i=0;i<=n;i++){
    (closes[i]||[]).forEach(c=>{
      if(stack.length>1)stack.pop();
      // 링크가 닫히는 자리에 주황 대괄호 라벨을 붙인다(§4-1 · 목업 v2·v3)
      if(c.ln&&c.ln.j&&opt.label!==false){
        const title=JOTITLE[c.ln.j];
        if(title){
          const g=el('span','lbl'+(S.labels?'':' off'),S.labels?('['+title+']'):'[…]');
          // ⚠ 라벨을 접으면 **글자 수가 바뀐다** — 필기가 있으면 잠근다(§4-2)
          if(opt.lockLabel){
            g.title='필기가 있어 잠갔다 — 접으면 글자 수가 바뀌어 필기가 어긋난다';
            g.onclick=ev=>{ev.stopPropagation();
              toast('필기 때문에 라벨 접기를 잠갔다 — 필기를 지우면 풀린다');};
          }else{
            g.title='클릭해서 접기/펴기';
            g.onclick=ev=>{ev.stopPropagation();
              const off=g.classList.toggle('off');
              g.textContent=off?'[…]':'['+title+']';};
          }
          top().appendChild(g);
        }
      }
    });
    (row.e||[]).forEach(e=>{
      if(e.k==='F'&&e.a===i){
        const s=el('sup','fn','['+e.id+']');
        s.onclick=ev=>{ev.stopPropagation();popFoot(e.id,ev,opt.rec,(opt.depth||0)+1);};
        top().appendChild(s);
      }
      if(e.k==='E'&&e.a===i){
        // 임베드는 해소하지 않는다 — 「⤷ 참조」 표시로 둔다(§3-B)
        const s=el('span','embed','⤷ '+e.to);
        s.title='임베드 미해소 — 컴파일러 지시서 2의 몫';
        top().appendChild(s);
      }
    });
    (opens[i]||[]).forEach(o=>{
      let node;
      if(o.ln){
        node=el('span','joLink'+(o.ln.j?'':' dead'));
        // ★ 팝업 깊이는 2단에서 멈춘다 — 2단 안의 링크는 그 조문 뷰로 이동한다(§5-4)
        if(o.ln.j)node.onclick=ev=>{ev.stopPropagation();
          const d=opt.depth||0, law=opt.law||S.law;
          if(d>=2)goJo(law,o.ln.j); else popJo(law,o.ln.j,ev,d+1);};
        // 조문노트가 아닌 볼트 노트는 지금처럼 dead 로 둔다(§5-2) — 팝업을 붙이지 않는다
        else node.title='조문노트가 아닌 볼트 노트 — v0 범위 밖';
      }else{
        const m=o.mk;
        const col=/^(#|rgb|hsl)/i.test(String(m.v||''))?m.v:null;
        if(m.t==='font'){node=el('span');node.style.color=m.v;}
        else if(m.t==='span'){
          const mm=/background\s*:\s*([^;"']+)/.exec(m.v||'');
          // 형광펜은 목업의 mark 로 — 지정색이 있으면 그 색을 쓴다
          node=el('mark','y');
          if(mm)node.style.background=mm[1];else if(col)node.style.background=col;
        }
        else if(m.t==='u'){node=el('u');if(col)node.style.textDecorationColor=col;}
        else if(m.t==='bold')node=el('strong');
        else if(m.t==='mark'){node=el('mark','y');if(col)node.style.background=col;}
        else if(m.t==='strike'){node=el('s');if(col)node.style.color=col;}
        else if(m.t==='tag'){node=el('span','badge');}
        else node=el('span');
        // ── 스티커 (§3) — bold 는 제외. 편집 모드를 켜야만 잡힌다(T5)
        if(m.t!=='bold'&&m._k&&opt.stick){
          node.classList.add('stk');
          node.onclick=ev=>{ev.stopPropagation();stkEdit(opt.base,row,m,ev);};
        }
      }
      top().appendChild(node);stack.push(node);
    });
    if(i<n)top().appendChild(document.createTextNode(t[i]));
  }
  return frag;
}
function joClass(k){
  const h=k[0];
  if(h==='항')return 'ln hang';
  if(h==='호')return 'ln ho';
  if(k.includes('목'))return 'ln mok';
  if(h==='R')return 'ln ref';
  if(h==='각주')return 'ln fd';
  if(h==='꼬리'||h==='두문자')return 'ln tail';
  return 'ln';
}

/* ══════════ 조문 뷰 ══════════ */
async function viewJo(){
  const slot=$('#slot');slot.innerHTML='';
  const L=await get(`jo_${S.law}_목록.json`);
  JOTITLE={};L.조.forEach(j=>{JOTITLE[j.k]=j.t;});

  const tree=el('div','tree'+(S.treeHid?' hid':''));
  tree.appendChild(el('div','h',SHORT[S.law]+' · 체계도 ↔ 조문'));
  if(!S.jo&&L.조.length)S.jo=L.조[0].k;
  L.조.forEach(j=>{
    const r=el('div','r'+(S.jo===j.k?' on':''));
    const nm=el('span','nm',j.k+' '+(j.t||''));
    r.appendChild(nm);
    const em=el('em');
    if(j.M)em.appendChild(el('span','','✏'+j.M));
    if(j.L)em.appendChild(el('span','','🔗'+j.L));
    if(!j.M&&!j.L){const b=el('span','bars');
      for(let i=0;i<3;i++)b.appendChild(el('i','bx'));em.appendChild(b);}
    r.appendChild(em);
    r.onclick=()=>{S.jo=j.k;render();};
    tree.appendChild(r);
  });
  const lg=el('div','legend');
  lg.innerHTML='막대 3개 = <b>회독 · 빈칸 통과 · 지문 정답률</b> — v0 미착수<br>'+
               '✏N 내 형광·마크업 수 · 🔗N 인용 링크 수';
  tree.appendChild(lg);
  slot.appendChild(tree);
  slot.appendChild(handle('tree'));

  const main=el('div','main');
  const B=await get(`jo_${S.law}_본문.json`);
  const j=B.조[S.jo];
  if(!j){main.appendChild(emptyBox('📖','조문을 찾지 못했다',S.jo||''));slot.appendChild(main);return;}

  // ── 머리 (리담 구조: 법 배지 → 큰 제목 → 시행일 → 이 조문 연결 → 모드 바)
  const idx=await get('jo_링크역인덱스.json').catch(()=>({}));
  const back=idx[S.law+':'+S.jo]||[];

  main.appendChild(el('span','chip c-prec',S.law));
  const h1=el('div','jotitle');
  h1.appendChild(el('span','no',S.jo));

/* ══════════ 팝업 ══════════ */
/* ══ 팝업 — 여러 개 · 끌어 옮기기 (목업 v3 「팝업은 여러 개, ≡ 로 끌고」)
   ⚠ 지시서 §3-E 는 「팝업 다중/드래그/고정」을 v0 제외로 뒀다.
      8/23 사용자 요구로 켰다. 고정(📌)은 아직 없다 — 다중·드래그만. */
let POPZ = 60, POPS = [];
function dragify(p, hd){
  let sx = 0, sy = 0, ox = 0, oy = 0, on = false;
  hd.addEventListener('mousedown', ev => {
    if (ev.target.closest('button')) return;
    on = true; sx = ev.clientX; sy = ev.clientY;
    ox = parseFloat(p.style.left) || 0; oy = parseFloat(p.style.top) || 0;
    p.style.zIndex = ++POPZ;
    ev.preventDefault();
  });
  addEventListener('mousemove', ev => {
    if (!on) return;
    p.style.left = Math.max(0, Math.min(innerWidth - 60, ox + ev.clientX - sx)) + 'px';
    p.style.top = Math.max(0, Math.min(innerHeight - 34, oy + ev.clientY - sy)) + 'px';
  });
  addEventListener('mouseup', () => { on = false; });
}
function popShell(kind, title){
  const p = el('div', 'pop' + (kind ? ' k-' + kind : ''));
  p.style.zIndex = ++POPZ;
  const hd = el('div', 'ph');
  hd.appendChild(el('span', 'pdrag', '≡'));
  hd.appendChild(el('span', 'pt', title));
  const x = el('button', '', '✕');
  x.onclick = ev => { ev.stopPropagation(); closeOne(p); };
  hd.appendChild(x);
  p.appendChild(hd);
  const body = el('div', 'pb');
  p.appendChild(body);
  document.body.appendChild(p);
  POPS.push(p);
  dragify(p, hd);
  p.addEventListener('mousedown', () => { p.style.zIndex = ++POPZ; });
  return body;
}
function closeOne(p){
  p.remove();
  POPS = POPS.filter(q => q !== p);
}
function closePop(){                    // 맨 위 하나만 닫는다
  if (POPS.length) closeOne(POPS[POPS.length - 1]);
}
function closeAllPops(){
  POPS.slice().forEach(closeOne);
}
function showPop(ev){
  const p = POPS[POPS.length - 1];
  if (!p) return;
  const w = p.offsetWidth || 440, h = p.offsetHeight || 260;
  // 여러 개를 띄우면 조금씩 어긋나게 쌓는다
  const k = (POPS.length - 1) % 6;
  let x = ev ? ev.clientX + 14 : innerWidth - w - 40;
  let y = ev ? ev.clientY + 14 : 110;
  x = Math.max(8, Math.min(x + k * 22, innerWidth - w - 8));
  y = Math.max(8, Math.min(y + k * 20, innerHeight - Math.min(h, 260) - 8));
  p.style.left = x + 'px';
  p.style.top = y + 'px';
}

/* ══════════ 알림 ══════════
   ⚠ `toast` 는 `popJo`·`popFoot` 과 똑같이 **정의가 없었다**(`memoSave` 가 부르기만 했다).
      §10 의 「쓰기가 실패하면 조용히 넘기지 마라」가 실제로는 안 돌고 있었다. */
function toast(msg, bad){
  const box = $('#toasts'); if (!box) return;
  const d = el('div', 'toast' + (bad ? ' bad' : ''), msg);
  box.appendChild(d);
  setTimeout(() => d.remove(), bad ? 4200 : 2400);
}

/* ══════════ 기록층 (§10) ══════════
   주소가 하나이므로 기록도 하나다(§0-3). 이름공간을 갈래별로 가른다.
   ⚠ 사파리는 한동안 안 들른 사이트의 localStorage 를 지운다 — 내보내기가 필수다. */
const REC_PRE = 'jopangi.';
const MK_KEY  = REC_PRE + 'markup';     // 마크업 스티커 삭제·편집·신규
const INK_KEY = REC_PRE + 'ink';        // 필기
const TS_PRE  = REC_PRE + 'ts.';        // 낡은 층(메모)용 갱신시각 짝
function nowIso(){ return new Date().toISOString(); }
function lsWrite(key, obj, what){
  try{ localStorage.setItem(key, JSON.stringify(obj)); return true; }
  catch(e){ toast('⚠ ' + (what || '기록') + ' 저장 실패 — 저장공간이 찼을 수 있다. 기록을 내보내라', 1);
            console.error(e); return false; }
}
function lsRead(key){
  try{ return JSON.parse(localStorage.getItem(key) || '{}'); }catch(e){ return {}; }
}
// 낡은 층(메모)은 값이 문자열이라 항목마다 시각을 못 넣는다 — 짝 맞춤표에 적는다
function tsTouch(storeKey, itemKey){
  const m = lsRead(TS_PRE + storeKey); m[itemKey] = nowIso();
  try{ localStorage.setItem(TS_PRE + storeKey, JSON.stringify(m)); }catch(e){}
}
function recStat(){
  const out = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k.indexOf(REC_PRE) !== 0) continue;
    if (k.indexOf(TS_PRE) === 0) continue;          // 짝 맞춤표는 세지 않는다
    let v = null; try{ v = JSON.parse(localStorage.getItem(k)); }catch(e){}
    let n = 0, note = '';
    if (v && typeof v === 'object'){
      const ks = Object.keys(v); n = ks.length;
      if (k === INK_KEY) note = ks.reduce((a, x) => a + ((v[x].s || []).length), 0) + '획';
    }
    out.push({ k: k, n: n, note: note });
  }
  out.sort((a, b) => a.k < b.k ? -1 : 1);
  return out;
}
function recTotal(){ return recStat().reduce((a, x) => a + x.n, 0); }
function recDump(){
  const 층 = {};
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k.indexOf(REC_PRE) !== 0) continue;
    try{ 층[k] = JSON.parse(localStorage.getItem(k)); }
    catch(e){ 층[k] = localStorage.getItem(k); }
  }
  // GAS 는 다음 지시서다. 다만 「바뀐 것만」 주고받을 수 있게 시각을 같이 담는다(§10-2)
  return { app: 'jopangi', v: 1, 생성: nowIso(), 건수: recTotal(), 층: 층 };
}
function recExport(){
  const j = JSON.stringify(recDump(), null, 1);
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([j], { type: 'application/json' }));
  a.download = 'jopangi_기록_' + nowIso().slice(0, 19).replace(/[:T]/g, '') + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('기록 ' + recTotal() + '건을 내려받았다');
}
function recImport(file, after){
  const fr = new FileReader();
  fr.onload = () => {
    let d = null;
    try{ d = JSON.parse(fr.result); }catch(e){ toast('⚠ JSON 을 읽지 못했다', 1); return; }
    if (!d || d.app !== 'jopangi' || !d.층){ toast('⚠ 조판기 기록 파일이 아니다', 1); return; }
    let m = 0; Object.keys(d.층).forEach(k => {
      const v = d.층[k];
      if (k.indexOf(TS_PRE) !== 0 && v && typeof v === 'object') m += Object.keys(v).length; });
    // ★ 덮어쓰기 전에 개수를 보여주고 확인을 받는다(§10-2)
    if (!confirm('기록 들여오기\n\n지금 ' + recTotal() + '건  →  파일 ' + m + '건\n\n'
                 + '같은 이름의 층은 파일 것으로 덮어쓴다. 계속할까?')) return;
    let ok = 0;
    Object.keys(d.층).forEach(k => {
      if (k.indexOf(REC_PRE) !== 0) return;
      if (lsWrite(k, d.층[k], k)) ok++;
    });
    MKS = null; INK = null;
    toast('층 ' + ok + '개를 들여왔다 — 지금 ' + recTotal() + '건');
    if (after) after();
  };
  fr.readAsText(file);
}
function popRec(ev){
  const body = popShell('cell', '⤓ 기록 — 내보내기 · 들여오기');
  body.appendChild(el('div', 'cdim',
    '⚠ 사파리는 한동안 안 들른 사이트의 저장분을 지운다. 아이패드에서 필기했다면 자주 내보내라.'));
  const tb = el('table', 'rectab');
  const hr = el('tr'); ['층', '항목', ''].forEach(t => hr.appendChild(el('th', '', t)));
  tb.appendChild(hr);
  const st = recStat();
  if (!st.length){ const r = el('tr'); const c = el('td', '', '아직 기록이 없다');
                   c.colSpan = 3; r.appendChild(c); tb.appendChild(r); }
  st.forEach(x => {
    const r = el('tr');
    r.appendChild(el('td', '', x.k.slice(REC_PRE.length)));
    r.appendChild(el('td', 'n', String(x.n)));
    r.appendChild(el('td', '', x.note));
    tb.appendChild(r);
  });
  body.appendChild(tb);
  body.appendChild(el('div', 'badge', '모두 ' + recTotal() + '건'));
  const row = el('div', 'memobtn');
  const ex = el('button', 'tool on', '⤓ 기록 내보내기');
  ex.onclick = recExport;
  const inp = el('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.style.display = 'none';
  inp.onchange = () => { if (inp.files && inp.files[0]) recImport(inp.files[0], render); };
  const im = el('button', 'tool', '⤒ 기록 들여오기');
  im.onclick = () => inp.click();
  row.appendChild(ex); row.appendChild(im); row.appendChild(inp);
  body.appendChild(row);
  body.appendChild(el('div', 'cdim',
    'GAS(기기 사이 동기화)는 다음 지시서다 — 지금은 이 브라우저에만 남는다.'));
  showPop(ev);
}

/* ══════════ 마크업 스티커 (§3) ══════════
   화면 = (JSON 레이어) − (내 삭제) + (내 편집) + (내가 새로 칠한 것). **내 층이 이긴다.**
   ⚠ 좌표만으로 잡지 않는다. 「조키 + 구조키 + a + b + 유형 + 값 + 평문 발췌」가 키다.
      좌표가 밀렸어도 **같은 구조키 줄 안에서** 같은 글자·같은 유형이면 같은 스티커로 본다.
   ⚠ 구조키 밖으로 나가서 찾지 않는다 — 8/23 에 끝이 같은 줄 셋이 3중 매칭돼 통째로 버려졌다.
   ⚠ 못 찾은 기록은 조용히 버리지 않는다 — 「고아」로 세어 화면 구석에 보인다(T4). */
const SEP = '\u001f';
const STK_TYPES = [['mark', '형광'], ['u', '밑줄'], ['font', '글자색'],
                   ['span', '배경'], ['strike', '취소선'], ['tag', '두문자 태그']];
const STK_COLORS = ['#ff0000', '#2F6FD0', '#7a3ed0', '#1d7a3e', '#b06000', '#1a1a1a'];
const STK_BACKS  = ['#ffe9a0', '#ffd0e0', '#b1ffff', '#d3f8b6', '#e6d9ff', '#ffd9b3'];
let MKS = null;
function mkAll(){ if (!MKS) MKS = lsRead(MK_KEY); return MKS; }
function mkPut(key, rec){
  mkAll();
  if (rec === null) delete MKS[key];
  else MKS[key] = Object.assign({}, rec, { ts: nowIso() });
  return lsWrite(MK_KEY, MKS, '마크업 스티커');
}
function mkEx(t, a, b){ return String(t || '').slice(Math.max(0, a), Math.max(0, b)); }
function rowKey(row){ return (Array.isArray(row.k) ? row.k : [row.k]).join('/'); }
function mkKeyOf(base, row, m){
  return [base, rowKey(row), m.a, m.b, m.t, m.v || '', mkEx(row.t, m.a, m.b)].join(SEP);
}
function mkLooseOf(base, row, m){

// 렌더된 줄 안에서 평문 좌표를 되찾는다.

      if (c && (c.contains('lbl') || c.contains('embed') || c.contains('anchor')

  const grab = ev => {
    if (!S.stick) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    const sn = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
    const line = sn && sn.closest ? sn.closest('.ln') : null;
    if (!line || !line.contains(r.endContainer)) return;   // 한 줄 안에서만(§3-3 ③)
    const ri = +line.dataset.ri;

    const cross = (mkApply(base, rows).eff[ri] || []).some(m =>
      (a < m.b && b > m.a) && !(a >= m.a && b <= m.b) && !(m.a >= a && m.b <= b));
    if (cross){ toast('이미 있는 마크업과 걸쳐서 겹친다 — 구간을 다시 골라라', 1); return; }
    stkNew(base, row, a, b, ev);

}

/* ══════════ 필기 (§4) ══════════

    lw = w; lh = h;

  };
  const rub = p => {
    const r = cv.getBoundingClientRect();
    const R = 11 / r.width, RY = 11 / r.height;
    const cur = inkOf(key);
    const keep = cur.filter(s => !s.p.some(q =>
      Math.abs(q[0] - p[0]) < R + s.w / r.width && Math.abs(q[1] - p[1]) < RY + s.w / r.height));

      (INKUNDO[key] = INKUNDO[key] || []).push(cur.slice());

/* ══════════ 원문 = 법전 조판 (§2) ══════════

   ★ 한 행 길이는 **사진의 실제 한 행을 재서** 정한다. em 으로 어림하면 글꼴마다 달라진다. */
const BJ_SAMPLE = '원서에 첨부된 요약서에 관한 직권보';   // 사진 33쪽에서 그대로 옮긴 한 행
const BJ_FS = 15;                                          // px · ★ 사용자가 못 바꾼다(§2-3)
const BJ_FF = '"Batang","BatangChe","AppleMyungjo","Nanum Myeongjo","Noto Serif KR",serif';
function bjHeadFmt(t){
  const m = /^(제\d+조(?:의\d+)?)\s*[(（]\s*(.+?)\s*[)）]\s*(.*)$/.exec(t);
  return m ? (m[1] + '【' + m[2] + '】' + (m[3] ? ' ' + m[3] : '')) : t;
}
function bjBlocks(lines){
  const out = []; let head = null;
  (lines || []).forEach(raw => {
    const t = String(raw == null ? '' : raw).trim();
    if (!t) return;                       // 원본의 줄바꿈은 문단 경계로만 쓴다(§2-4)
    if (/^제\d+[장절관]/.test(t) && t.length < 42){ out.push({ k: 'jang', t: t }); return; }
    if (/^제\d+조(의\d+)?\s*[(（]/.test(t) || /^제\d+조(의\d+)?\s*$/.test(t)){
      head = { k: 'head', t: bjHeadFmt(t) }; out.push(head); return;
    }
    if (/^[①-⑳]/.test(t)){
      const no = t.charAt(0), rest = t.slice(1).trim();
      // ★ 제1항 ①은 줄을 바꾸지 않고 제목 뒤에 이어 붙는다. ②부터 새 줄.
      if (no === '①' && head && !head.used){ head.used = 1; head.t += '  ① ' + rest; return; }
      out.push({ k: 'hang', t: no + ' ' + rest }); return;
    }
    if (/^\d+\.(\s|$)/.test(t)){ out.push({ k: 'ho', t: t }); return; }
    if (/^[가-하]\.(\s|$)/.test(t)){ out.push({ k: 'mok', t: t }); return; }

  });
  // ⑦ 삭제 조 — 제목과 삭제 표시밖에 없으면 한 줄로 뭉친다
  if (out.length === 2 && out[0].k === 'head' && /^삭제/.test(out[1].t))

function bjColWidth(){
  const s = el('span', '', BJ_SAMPLE);
  s.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;'
                  + 'font-family:' + BJ_FF + ';font-size:' + BJ_FS + 'px';
  document.body.appendChild(s);
  const w = s.getBoundingClientRect().width;
  s.remove();
  return w > 60 ? Math.ceil(w) + 2 : Math.round(BJ_FS * 17.8);

function bjFit(page){
  const host = page.parentNode; if (!host) return;
  const col = bjColWidth(), gap = Math.round(BJ_FS * 1.7);
  const avail = (host.clientWidth || col) - 2;
  let n = Math.max(1, Math.floor((avail + gap) / (col + gap)));
  n = Math.min(n, 3);
  // 단이 늘어나 한 단에 두세 줄만 남는 꼴은 막는다 — 그래도 한 행 길이는 그대로다
  const chars = page.textContent.length;
  n = Math.max(1, Math.min(n, Math.ceil(chars / (16 * 8))));
  page.style.columnCount = n;
  page.style.columnGap = gap + 'px';
  page.style.width = (n * col + (n - 1) * gap) + 'px';
}
function renderBeonjeon(host, orig){
  const page = el('div', 'bjpage');

/* ══════════ 조문·각주 팝업 (§5) ══════════
   ⚠ `popJo`·`popFoot` 은 부르기만 하고 **정의가 아예 없었다**(`:482`·`:468`).
      누르면 ReferenceError 가 나고 아무 일도 안 일어났다. 껍데기는 popShell 을 다시 쓴다.
   ★ 깊이는 2단에서 멈춘다 — 2단 안의 링크는 새 팝업을 안 띄우고 **그 조문 뷰로 이동**한다. */
function goJo(law, k){
  if (LAWS.indexOf(law) >= 0) S.law = law;
  S.tab = 'jo'; S.jo = k; closeAllPops(); render();
}
async function popJo(law, k, ev, depth){
  depth = depth || 1;
  const body = popShell('', '📖 ' + k + ' — 불러오는 중');
  showPop(ev);
  const pop = body.parentNode;
  try{
    const L = await get('jo_' + law + '_목록.json');
    const B = await get('jo_' + law + '_본문.json');
    const ti = (L.조.find(x => x.k === k) || {}).t || '';
    const pt = pop.querySelector('.pt');
    if (pt) pt.textContent = '📖 ' + (SHORT[law] || law) + ' ' + k + (ti ? ' ' + ti : '');
    body.innerHTML = '';
    const go = el('button', 'tool on', '뷰로 이동 ↗');   // 머리에 「뷰로 이동」(사양서 §4-2)
    go.onclick = () => goJo(law, k);
    body.appendChild(go);
    if (depth >= 2)
      body.appendChild(el('span', 'badge', '2단 — 여기 링크는 팝업 대신 뷰로 이동한다'));
    const j = B.조[k];
    if (!j){ body.appendChild(el('div', 'cdim', '본문을 찾지 못했다 — ' + k)); return; }
    const ap = mkApply(law + ':' + k, j.행);
    j.행.forEach((row, ri) => {
      if (row.k[0] === 'H') return;
      const d = el('div', joClass(row.k));
      if (row.fd) d.appendChild(el('span', 'fdmark', '[^' + row.fd + '] '));
      d.appendChild(renderLine(row, { label: false, depth: depth, rec: j, law: law,
                                      m: ap.eff[ri] }));
      body.appendChild(d);
    });
  }catch(e){
    body.innerHTML = '';
    body.appendChild(el('div', 'cdim', '읽지 못했다 — ' + (e && e.message || e)));
    console.error(e);
  }
}
function popFoot(id, ev, rec, depth){
  const body = popShell('fn', '🗒 각주 [' + id + ']');
  const rows = (rec && rec.행) || [];
  const hit = rows.filter(r => String(r.fd) === String(id) && r.k[0] === '각주');
  if (!hit.length)
    body.appendChild(el('div', 'cdim', '각주 정의를 못 찾았다 — 이 조에 [^' + id + '] 정의 줄이 없다'));
  else hit.forEach(r => {
    const d = el('div', 'ln fd');
    d.appendChild(renderLine(r, { label: false, depth: depth || 1, rec: rec }));
    body.appendChild(d);
  });
  showPop(ev);
}

/* ══════════ 2차 뷰 — 보드 · 목록 · 캔버스 ══════════ */
let BODY=null,BODYKEY='';
async function bodyOf(kind,subj){
  const k=kind+'_'+subj;
  if(BODYKEY===k)return BODY;
  try{BODY=await get('2cha_본문_'+k+'.json');BODYKEY=k;}catch(e){BODY={};BODYKEY=k;}
  return BODY;
}
// 카드 본문 미리보기 — 옵시디언 캔버스가 카드에 본문을 렌더하는 것과 같은 자리
/* ══ 본문 렌더 — 카드·팝업이 **같은 함수**를 쓴다. 옵시디언과 같게:
      제목은 크기·굵기로 · 제목을 누르면 접힘 · 단어를 누르면 메모.
   ⚠ 단어마다 span 을 만들면 보드 하나에 수만 개가 생긴다.
      그래서 평문으로 그리고 **클릭 위치로 단어를 찾는다**(caretRangeFromPoint).
      메모가 붙은 단어만 span 으로 감싼다. */
const MEMO_NS='jopangi.memo.';
function memoLoad(file){
  try{return JSON.parse(localStorage.getItem(MEMO_NS+file)||'{}');}catch(e){return {};}
}
function memoSave(file,m,mk){
  // ⚠ 쓰기가 실패하면 조용히 넘기지 않는다(§10-2). `toast` 는 v3-B 에서 비로소 생겼다.
  if(lsWrite(MEMO_NS+file,m,'메모')&&mk)tsTouch(MEMO_NS+file,mk);
}
function splitWords(t){return (t||'').split(/(\s+)/);}
// 클릭 지점의 단어 번호 — 렌더와 같은 splitWords 색인을 쓴다
function wordIndexAt(lineEl,ev,text){
  let off=0;
  const r=document.caretRangeFromPoint?document.caretRangeFromPoint(ev.clientX,ev.clientY):null;
  if(r&&lineEl.contains(r.startContainer)){
    const w=document.createTreeWalker(lineEl,NodeFilter.SHOW_TEXT);
    let n,acc=0;
    while((n=w.nextNode())){
      if(n===r.startContainer){off=acc+r.startOffset;break;}
      acc+=n.nodeValue.length;
    }
  }
  const parts=splitWords(text);
  let pos=0;
  for(let i=0;i<parts.length;i++){
    const end=pos+parts[i].length;
    if(off<end)return parts[i].trim()?i:null;
    pos=end;
  }
  for(let i=parts.length-1;i>=0;i--)if(parts[i].trim())return i;
  return null;
}
function lineContent(r,ri,file,memo){
  // 메모 붙은 단어만 span — 나머지는 텍스트 노드 하나
  const frag=document.createDocumentFragment();
  const parts=splitWords(r.t||'');
  let buf='';
  const flush=()=>{if(buf){frag.appendChild(document.createTextNode(buf));buf='';}};
  parts.forEach((w,wi)=>{
    const mk=ri+'_'+wi;
    if(w.trim()&&memo[mk]){
      flush();
      const sp=el('span','pword',w);
      sp.title=memo[mk];
      sp.appendChild(el('span','pmark'));
      frag.appendChild(sp);
    }else buf+=w;
  });
  flush();
  return frag;
}
function renderBody(rec,file,opt){
  opt=opt||{};
  const wrap=el('div','rbody'+(opt.card?' card':''));
  if(!rec||!rec.행||!rec.행.length){wrap.appendChild(el('div','cdim','본문 없음'));return wrap;}
  const memo=memoLoad(file);
  const rows=[];
  let curLv=0;
  rec.행.forEach((r,ri)=>{
    // 콜아웃(문제·원본)은 **접힌 상자 하나**로 두고, 누르면 팝업으로 뜬다(8/23 사용자)
    if(r.co){
      const box=el('div','callout co-'+r.co);
      box.appendChild(el('span','ci',r.co==='question'?'⑦':'📄'));
      box.appendChild(el('span','ct',r.t));
      box.appendChild(el('span','cn',r.rows.length+'줄'));
      box.appendChild(el('span','cx','›'));
      box.title='눌러서 전문 보기';
      box.onclick=ev=>{ev.stopPropagation();popCallout(r,file,ev);};
      wrap.appendChild(box);rows.push(box);
      return;
    }
    const lv=r.h||0;
    if(lv)curLv=lv;
    const d=el('div','rln'+(lv?' rh rh'+Math.min(lv,4):''));
    // 제목 단계마다 들여쓴다 — Ⅰ. / 1. / (1) 이 세로로 겹치지 않게(8/23 사용자)
    d.style.paddingLeft=(lv?(lv-1)*15:curLv*15+((r.i||0)*9))+'px';
    if(lv){
      const tg=el('button','rtog','▾');
      tg.title='접기/펴기';
      tg.onclick=ev=>{
        ev.stopPropagation();
        const open=tg.textContent==='▾';
        tg.textContent=open?'▸':'▾';
        for(let k=ri+1;k<rows.length;k++){
          const nl=rec.행[k].h||0;
          if(nl&&nl<=lv)break;
          rows[k].style.display=open?'none':'';
        }
      };
      d.appendChild(tg);
    }
    const holder=el('span','rtx');
    if((r.e&&r.e.length)||(r.m&&r.m.length))holder.appendChild(renderLine(r,{label:false}));
    else holder.appendChild(lineContent(r,ri,file,memo));
    d.appendChild(holder);
    // 단어 클릭 = 메모
    d.onclick=ev=>{
      if(ev.target.closest('.rtog,a,.joLink'))return;
      const wi=wordIndexAt(holder,ev,r.t||'');
      if(wi==null)return;
      ev.stopPropagation();
      memoEdit(file,ri+'_'+wi,splitWords(r.t)[wi],ev);
    };
    wrap.appendChild(d);rows.push(d);
  });
  return wrap;
}
function popCallout(co,file,ev){
  const body=popShell(co.co==='question'?'':'fn',
    (co.co==='question'?'⑦ ':'📄 ')+co.t);
  body.appendChild(el('div','cdim','제목을 눌러 접고 편다 · 단어를 눌러 메모를 붙인다'));
  body.appendChild(renderBody({행:co.rows},file+'::'+co.t));
  showPop(ev);
}
function memoEdit(file,mk,word,ev){
  const memo=memoLoad(file);
  const body=popShell('fn','🗒 메모 — 「'+String(word||'').slice(0,18)+'」');
  const ta=el('textarea','memoin');
  ta.value=memo[mk]||'';ta.placeholder='이 단어에 붙일 메모';
  body.appendChild(ta);
  const row=el('div','memobtn');
  const ok=el('button','tool on','저장');
  ok.onclick=()=>{const v=ta.value.trim();
    if(v)memo[mk]=v;else delete memo[mk];
    memoSave(file,memo,mk);closePop();render();};
  const del=el('button','tool','삭제');
  del.onclick=()=>{delete memo[mk];memoSave(file,memo,mk);closePop();render();};
  row.appendChild(ok);row.appendChild(del);
  row.appendChild(el('span','cdim','브라우저에만 저장'));
  body.appendChild(row);
  showPop(ev);
  setTimeout(()=>ta.focus(),30);
}

async function view2cha(){
  const slot=$('#slot');slot.innerHTML='';

    b.onclick=()=>{S.boardKind=k;S.series='';S.yearFilter='';render();};bar.appendChild(b);});

    const b=el('button','tool'+(S.boardView===v?' on':''),t);
    b.onclick=()=>{S.boardView=v;render();};bar.appendChild(b);});

  // ★ 탭 바를 **조기반환보다 먼저** 붙인다(§6-2).

  const cells=d.격자||{},keys=Object.keys(cells);
  const un=d.미배치||[];
  const bodies=await bodyOf(S.boardKind==='기출'&&subj!=='민소'?'사례':S.boardKind,subj);

  // ── 강사·시리즈 선택기는 **GS 에서만**(8/23 사용자). 별도 줄 없이 상단에 붙인다.
  const all=[];keys.forEach(k=>cells[k].forEach(x=>all.push(Object.assign({셀:k},x))));
  const series=[...new Set(all.map(x=>x.시리즈).filter(Boolean))].sort();
  if(S.boardKind==='GS'&&series.length){
    const s1=el('select','sel');
    const o0=el('option','','강사 전체 ('+series.length+')');o0.value='';s1.appendChild(o0);
    series.forEach(v=>{const o=el('option','',v);o.value=v;if(S.series===v)o.selected=true;s1.appendChild(o);});
    s1.onchange=()=>{S.series=s1.value;render();};
    bar.insertBefore(s1,sp);
  }else if(S.series){S.series='';}
  const years=[...new Set(all.map(x=>x.연도).filter(Boolean))].sort((a,b)=>a-b);
  // bar 는 위에서 이미 붙였다 — 강사 선택기는 살아 있는 bar 에 끼워 넣는다(§6-2)

  const pass=x=>(!S.series||x.시리즈===S.series)&&(!S.yearFilter||String(x.연도)===String(S.yearFilter));
  const shown=all.filter(pass);

  if(S.boardView==='list'){
    main.appendChild(el('div','badge',
      `${d.총}개 · 배치 ${d.배치수||0} · 미배치 ${un.length}` +
      ((S.series||S.yearFilter)?`  ·  필터 적용 ${shown.length}개`:'')));
    const rows=shown.slice().sort((a,b)=>cmpCell(a,b));
    rows.forEach(x=>{const r=el('div','prow');
      r.appendChild(el('div','pn',cellLabel(x)));
      r.appendChild(el('div','iss',x.파일));
      r.onclick=e=>popCell(x,e,bodies);main.appendChild(r);});
    un.forEach(x=>{const r=el('div','prow');
      r.appendChild(el('div','pn','미배치'));
      r.appendChild(el('div','iss',x.파일));
      r.onclick=e=>popCell(x,e,bodies);main.appendChild(r);});
    slot.appendChild(main);return;
  }

  // ── 보드(격자)
  let rows=[...new Set(shown.map(x=>x.셀.split('|')[0]))];
  rows.sort((a,c)=>{
    const na=parseFloat(String(a).replace('-','.')),nc=parseFloat(String(c).replace('-','.'));
    const v=(isNaN(na)||isNaN(nc))?String(a).localeCompare(String(c)):na-nc;
    return S.yearSort==='desc'?-v:v;});
  const cols=[...new Set(shown.map(x=>+x.셀.split('|')[1]))].sort((a,c)=>a-c);
  if(!rows.length||!cols.length){
    main.appendChild(emptyBox('🖋','필터에 걸리는 문항이 없다','강사·연도 필터를 풀어라'));
    slot.appendChild(main);return;}
  const wrap=el('div','gwrap');
  const g=el('div','grid');
  g.style.gridTemplateColumns=`64px repeat(${cols.length},minmax(210px,1fr))`;
  g.style.minWidth=(64+cols.length*218)+'px';
  // 정렬·연도 필터는 별도 줄이 아니라 **연도·회차 머리칸 안**에 둔다(8/23 사용자)
  const yh=el('div','gh yh');
  const sb=el('button','ysort',(S.boardKind==='GS'?'연도-회':'연도·회차')+
             (S.yearSort==='asc'?' ↑':' ↓'));
  sb.title='눌러서 빠른순 ↔ 늦은순';
  sb.onclick=()=>{S.yearSort=S.yearSort==='asc'?'desc':'asc';render();};
  yh.appendChild(sb);
  if(years.length){
    const s2=el('select','sel ysel');
    const o0=el('option','','전체 '+years.length);o0.value='';s2.appendChild(o0);
    years.forEach(v=>{const o=el('option','',String(v).slice(2)+'-'+(v-1963));o.value=v;
      if(String(S.yearFilter)===String(v))o.selected=true;s2.appendChild(o);});
    s2.onchange=()=>{S.yearFilter=s2.value;render();};
    yh.appendChild(s2);
  }
  g.appendChild(yh);
  cols.forEach(c=>g.appendChild(el('div','gh','문제 '+c)));
  const byCell={};shown.forEach(x=>{(byCell[x.셀]=byCell[x.셀]||[]).push(x);});
  rows.forEach(r=>{
    const yr=(shown.find(x=>x.셀.split('|')[0]===r)||{}).연도;
    // 「08-45」 꼴로 짧게(8/23 사용자). GS 는 이미 「24-1」 이라 그대로.
    g.appendChild(el('div','gr',yr?(String(yr).slice(2)+'-'+r):String(r)));
    cols.forEach(c=>{
      const list=byCell[r+'|'+c];
      if(!list){g.appendChild(el('div','cellnone'));return;}
      const holder=el('div');
      list.forEach(x=>{
        const hot=/⚠|누락/.test(x.논점||'');
        const cd=el('div','cell'+(hot?' hot':''));
        if(x.시리즈)cd.appendChild(el('div','t',x.시리즈));
        const ti=el('div','ctitle',x.논점||x.파일);
        ti.title='눌러서 크게 보기';
        ti.onclick=e=>{e.stopPropagation();popCell(x,e,bodies);};
        cd.appendChild(ti);
        cd.appendChild(renderBody(bodies[x.파일],x.파일,{card:1}));
        holder.appendChild(cd);});
      g.appendChild(holder);
    });
  });
  wrap.appendChild(g);main.appendChild(wrap);

  if(un.length){
    const u=el('div','unpl');
    u.appendChild(el('h4','',`미배치 ${un.length}건 — 파일명이 규약에서 벗어났다`));
    un.forEach(x=>{const r=el('div','u',x.파일);r.onclick=e=>popCell(x,e,bodies);u.appendChild(r);});
    main.appendChild(u);
  }
  main.appendChild(el('div','badge',
    `폴더 ${d.총}개 = 배치 ${d.배치수} + 미배치 ${un.length}  ·  ${d.폴더||''}`));
  slot.appendChild(main);
}
function cellLabel(x){
  const [r,c]=x.셀.split('|');
  return (x.연도?x.연도+'년 ':'')+r+(x.연도?'회':'')+' · 문제 '+c;
}
function cmpCell(a,b){
  const [ra,ca]=a.셀.split('|'),[rb,cb]=b.셀.split('|');
  const na=parseFloat(String(ra).replace('-','.')),nb=parseFloat(String(rb).replace('-','.'));
  let v=(isNaN(na)||isNaN(nb))?String(ra).localeCompare(String(rb)):na-nb;
  if(S.yearSort==='desc')v=-v;
  return v|| (+ca)-(+cb);
}
function popCell(x,ev,bodies){
  const body=popShell('cell','🖋 '+(x.파일||'').slice(0,44));
  if(x.시리즈)body.appendChild(el('span','badge',x.시리즈));
  if(x.셀)body.appendChild(el('span','badge',cellLabel(x)));
  const rec=(bodies||{})[x.파일];
  if(rec&&rec.fm&&Object.keys(rec.fm).length){
    const ch=el('div','chips');
    Object.entries(rec.fm).forEach(([k,v])=>{if(v)ch.appendChild(el('span','chip c-src',k+': '+String(v).slice(0,24)));});
    body.appendChild(ch);
  }
  const blk=el('div');
  blk.appendChild(renderBody(rec,x.파일));
  body.appendChild(blk);
  inkHost(blk,'cell|'+x.파일);              // 캔버스 한 장 = 셀 하나(§4-3)
  showPop(ev);
}

/* ══════════ 1차객 뷰 — 목차 트리 + [OX문제 | 기출문제] ══════════ */
function qCard(q,mokTitle){
  const card=el('div','qwrap');
  // ── 머리 배지 줄 (민법OX 앱과 같은 구성)
  const h=el('div','qhd');
  h.appendChild(el('span','qb v','변리사 '+String(q.연도).slice(2)));
  const typ=(q.유형||'').split('|')[0]||'단답형';
  h.appendChild(el('span','qb t',typ+(q.조&&q.조.length?(' · 제'+q.조[0].replace(/^[특상디]-/,'')+'조'):'')));
  h.appendChild(el('span','qb n',q.연도+':'+(q.회차||'')+':'+q.문번));
  h.appendChild(el('span','qb id','ID '+q.id));
  h.appendChild(el('span','src '+q.출처,q.출처));
  if(mokTitle)h.appendChild(el('span','chip c-theme',mokTitle));
  const sp=el('span');sp.style.flex='1';h.appendChild(sp);
  // 학습 태그 — 기록은 kv 라 v0 제외(§3-E). 자리만 보인다.
  [['📍',''],['🔵','헷갈림'],['⚠','페이크'],['💡','개념'],['🩷','암기'],['⭐','중요']].forEach(([i,t])=>{
    const g=el('span','qtag',i+(t?' '+t:''));g.title='학습 태그 — 기록은 v0 제외';h.appendChild(g);});
  card.appendChild(h);

  // ── 판 토글 — **기출변형에서만**(8/23 사용자 정정). 나머지는 아예 안 보인다.
  if(q.출처==='기출변형'){
    const pt=el('div','pantog');
    pt.appendChild(el('span','pl','판'));
    [['리담','리담판'],['제7판','제7판판']].forEach(([v,label])=>{
      const on=(q._판||'리담')===v;
      const b=el('button','tool'+(on?' on':''),label);
      if(v==='제7판'&&!q.두판){b.disabled=true;b.title='이 문항은 제7판 대응 선지가 없다';}
      b.onclick=()=>{if(v==='제7판'&&!q.두판)return;q._판=v;render();};
      pt.appendChild(b);});
    pt.appendChild(el('span','badge',q.두판?('제7판 대응 선지 '+q.n7+'개'):'제7판 대응 없음 — 토글 비활성'));
    card.appendChild(pt);
  }
  if(q.발문)card.appendChild(el('div','qmun',q.발문));
  const pan=(q.출처==='기출변형'&&(q._판||'리담')==='제7판');
  (q.지문||[]).forEach(z=>{
    const alt=pan&&z.p7?z.p7:null;
    const bon=alt?alt.t:z.t, ox2=alt?alt.ox:z.ox, sol2=alt?alt.sol:z.sol;
    const row=el('div','oxrow');
    const q1=el('div','oxq');
    q1.appendChild(el('b','',q.문번+'번 - ('+z.n+') '));
    q1.appendChild(document.createTextNode(bon));
    if(pan&&!z.p7)q1.appendChild(el('span','badge','제7판 대응 없음 — 리담판 표시'));
    if(alt&&alt.미확정)q1.appendChild(el('span','qb warn','제7판 정오 미확정'));
    row.appendChild(q1);
    // ── O / X 선택 (민법OX 방식). 기록은 저장하지 않는다 — v0 읽기 전용.
    const pick=el('div','oxpick');
    ['O','X'].forEach(v=>{
      const b=el('button','oxbtn'+(z._sel===v?' sel':'')+(z._sel?((v===ox2)?' right':(z._sel===v?' wrong':'')):''),'');
      b.appendChild(el('span','dot',z._sel===v?'◉':'○'));
      b.appendChild(el('span','lv '+v,v));
      b.onclick=()=>{z._sel=(z._sel===v?null:v);render();};
      pick.appendChild(b);});
    row.appendChild(pick);
    if(z._sel){
      const res=el('div','oxres');
      res.appendChild(el('span','ansb '+(ox2||''),'정답 '+(ox2||'미확정')));
      res.appendChild(el('span','badge',z._sel===ox2?'맞음':'틀림'));
      (z.jo||[]).forEach(c=>res.appendChild(el('span','chip c-prec','⚖ '+c.replace(/^[특상디]-/,''))));
      if(z.pan)res.appendChild(el('span','chip c-quiz','판례 '+z.pan.slice(0,28)));
      row.appendChild(res);
      if(sol2)row.appendChild(el('div','sol',sol2));
      else row.appendChild(el('div','cdim','해설 없음 — 리담 근거원문이 비어 있다'));
    }else if(sol2){
      const pv=el('button','solpv','해설 미리보기');
      pv.onclick=()=>{const d=pv.nextSibling;
        d.style.display=d.style.display==='none'?'':'none';};
      row.appendChild(pv);
      const d=el('div','sol',sol2);d.style.display='none';row.appendChild(d);
    }
    card.appendChild(row);
  });
  const ft=el('div','qft');
  const memo=el('span','memolink','✏ 메모 및 유사문제 연결');
  memo.title='v0 제외 — 자리만(§3-E)';
  ft.appendChild(memo);
  ft.appendChild(el('span','cdim','풀이 기록은 저장하지 않는다 — v0 읽기 전용'));
  card.appendChild(ft);
  inkHost(card,'q|'+q.id);                 // 캔버스 한 장 = 문항 카드 하나(§4-3)
  return card;
}

    row.appendChild(pv);
    const d=el('div','sol',z.sol);d.style.display='none';row.appendChild(d);
  }
  card.appendChild(row);

  ft.appendChild(m);ft.appendChild(el('span','cdim','풀이 기록 저장 없음'));
  card.appendChild(ft);
  inkHost(card,'q7|'+z.id);                // 캔버스 한 장 = 지문 카드 하나(§4-3)
  return card;
}

      const lg=el('div','legend');
      lg.innerHTML='📝N = 리담 문항 · 7판N = 제7판 지문<br>'+
        '<span style="color:#7a3ed0">보라색</span> = 볼트에 없고 제7판 차례에만 있는 마디<br>'+
        '마디에 커서를 올리면 짝지어진 제7판 차례가 보인다';
      tree.appendChild(lg);
    }
  }else{
    tree.appendChild(el('div','h',subj+' · 연도'));
    const byY=collect(JM.문제,q=>q.연도);
    Object.keys(byY).sort().reverse().forEach(y=>{
      const r=el('div','r'+(S.year===y?' on':''));
      r.appendChild(el('span','nm',y+'년'+(byY[y][0].회차?'  '+byY[y][0].회차+'회':'')));
      r.appendChild(el('em','',byY[y].length+''));
      r.onclick=()=>{S.year=y;render();};
      tree.appendChild(r);
    });
  }
  slot.appendChild(tree);
  slot.appendChild(handle('tree'));

  const main=el('div','main');
  main.appendChild(el('span','chip c-prec',S.law));
  const h1=el('div','jotitle');h1.appendChild(el('span','no','1차객'));
  main.appendChild(h1);
  main.appendChild(el('div','sihaeng',
    `문항 ${JM.문항} · 선지 ${JM.선지}  ·  리담 실측 추출(_lidam_문항/선지.csv)`));

  const tabs=el('div','modebar');
  [['ox','OX문제'],['gichul','기출문제']].forEach(([k,t])=>{
    const b=el('button','mode'+(S.jimunTab===k?' on':''),t);
    b.onclick=()=>{S.jimunTab=k;render();};tabs.appendChild(b);});
  tabs.appendChild(el('span','badge',
    S.jimunTab==='ox'?'목차 마디대로 묶어 본다':'연도별로 본다'));
  main.appendChild(tabs);

  if(S.jimunTab==='ox'){
    if(S.mok==='__표본'){
      await sampleCards(main);
    }else if(S.mok&&S.mok.startsWith('__mg')&&MG){
      const i=+S.mok.slice(4), M=MG.마디, n=M[i];
      let jos=[...n.지문], lids=[...n.리담];
      for(let j=i+1;j<M.length;j++){
        if(M[j].깊이<=n.깊이)break;
        jos=jos.concat(M[j].지문); lids=lids.concat(M[j].리담);
      }
      jos=[...new Set(jos)]; lids=[...new Set(lids)];
      const P7map={};if(P7)P7.지문.forEach(z=>P7map[z.id]=z);
      const lidam=lids.map(id=>byId[id]).filter(Boolean);
      const p7l=jos.map(id=>P7map[id]).filter(Boolean);
      const bd=el('div','badge',
        `${n.no?n.no+' ':''}${n.제목} — 리담 문항 ${lidam.length} · 제7판 지문 ${p7l.length}`+
        (n.p7&&n.p7.length?`  ·  제7판 차례: ${n.p7.join(' / ')}`:'')+
        (n.쪽?`  ·  인쇄 p.${n.쪽}`:''));
      main.appendChild(bd);
      if(!lidam.length&&!p7l.length)
        main.appendChild(emptyBox('📝','이 마디에 묶인 문항이 없다'));
      if(lidam.length){
        main.appendChild(el('div','grp','📝 리담 기출 문항 '+lidam.length));
        lidam.forEach(q=>main.appendChild(qCard(q)));
      }
      if(p7l.length){
        main.appendChild(el('div','grp','📕 제7판 「nn 변리」 지문 '+p7l.length));
        p7l.forEach(z=>main.appendChild(p7Card(z)));
      }
    }else if(!S.mok){
      main.appendChild(emptyBox('📝','왼쪽 목차에서 마디를 고르면 그 마디 문항이 묶여 나온다',
        '숫자가 붙은 마디에 문항이 있다'));
    }else{
      let list;
      if(S.mok==='__미분류'){
        const placed=new Set();
        (MG?MG.마디:[]).forEach(n=>n.리담.forEach(x=>placed.add(x)));
        list=JM.문제.filter(q=>!placed.has(q.id));
        main.appendChild(el('div','badge','미분류 '+list.length+'문항 — 근거조문이 없거나 마디 제목에 조문이 안 적혀 못 붙은 것'));
      }else{
        const node=MK.마디.find(n=>n.파일===S.mok);
        list=((IDX||{})[S.mok]||[]).map(id=>byId[id]).filter(Boolean);
        const b=el('div','badge',(node?node.제목:'')+' — '+list.length+'문항'+
          (node&&node.조.length?('  ·  조문 '+node.조.map(c=>c.replace('특-','제')+'조').join(' · ')):''));
        main.appendChild(b);
      }
      if(!list.length)main.appendChild(emptyBox('📝','이 마디에 묶인 문항이 없다',
        '마디 제목에 조문번호가 없으면 묶이지 않는다'));
      else list.forEach(q=>main.appendChild(qCard(q)));
    }
  }else{
    const byY=collect(JM.문제,q=>q.연도);
    const ys=Object.keys(byY).sort().reverse();
    const y=S.year&&byY[S.year]?S.year:ys[0];
    S.year=y;
    main.appendChild(el('div','badge',
      y+'년 '+(byY[y][0].회차?byY[y][0].회차+'회 ':'')+'· '+byY[y].length+'문항'));
    byY[y].sort((a,b)=>(+a.문번)-(+b.문번)).forEach(q=>main.appendChild(qCard(q)));
  }
  slot.appendChild(main);
}
function collect(arr,fn){
  const o={};arr.forEach(x=>{const k=fn(x);(o[k]=o[k]||[]).push(x);});return o;
}
// 판 토글 표본 5건 — 검산 K 대상. 실데이터(_지문대조.csv 일치·정오같음)
async function sampleCards(main){
  let J;try{J=await get('jimun_sample.json');}catch(e){
    main.appendChild(emptyBox('📝','표본 없음'));return;}
  main.appendChild(el('div','badge',J.라벨));
  J.지문.forEach(z=>{
    const st=z._판||'리담';
    const card=el('div','jimun');
    const h=el('div','jhd');
    h.appendChild(el('span','badge','표본'));
    h.appendChild(el('span','src '+z.출처배지,z.출처배지));
    h.appendChild(el('span','badge',`${z.연도}년 · ${z.문항}번 · 선지 ${z.선지}`));
    const sp=el('span');sp.style.flex='1';h.appendChild(sp);
    [['리담','리담판'],['제7판','제7판판']].forEach(([v,label])=>{
      const b=el('button','tool'+((z.두판?st===v:v==='리담')?' on':''),label);
      if(!z.두판&&v==='제7판'){b.disabled=true;b.title='이 지문은 리담판만 있다';}
      b.onclick=()=>{if(!z.두판)return;z._판=v;render();};
      h.appendChild(b);});
    card.appendChild(h);
    const src=(st==='제7판'&&z.제7판)?z.제7판:z.리담;
    card.appendChild(el('div','qt',src.본문));
    card.appendChild(el('span','ansb '+(src.정오||''),'정오 '+(src.정오||'—')));
    if(src.쪽)card.appendChild(el('span','badge',' 제7판 '+src.쪽+'쪽'));
    if(src.해설)card.appendChild(el('div','sol',src.해설));
    if(!z.두판)card.appendChild(el('div','badge','제7판 대응 지문 없음 — 토글 비활성'));
    main.appendChild(card);
  });
}

/* ══════════ 검색 ══════════ */
let skRows=[],skSel=0;
function openSk(){$('#sk').style.display='block';$('#skin').value='';$('#skin').focus();
  $('#skres').innerHTML='';skRows=[];skSel=0;}
function closeSk(){$('#sk').style.display='none';}
$('#ksearch').onclick=openSk;
$('#skin').oninput=async e=>{
  const q=e.target.value.trim();const box=$('#skres');box.innerHTML='';skRows=[];skSel=0;
  if(!q)return;
  const L=await get(`jo_${S.law}_목록.json`);
  const B=await get(`jo_${S.law}_본문.json`);
  const out=[];
  for(const j of L.조){
    if(out.length>=60)break;
    if(j.k.includes(q)||(j.t||'').includes(q)){out.push({k:j.k,t:j.t,x:''});continue;}
    const body=B.조[j.k];if(!body)continue;
    for(const row of body.행){
      const i=(row.t||'').indexOf(q);
      if(i>=0){out.push({k:j.k,t:j.t,x:row.t.slice(Math.max(0,i-22),i+q.length+34)});break;}
    }
  }
  skRows=out;
  box.appendChild(el('div','grp','📖 조문 — '+out.length+'건'));
  out.forEach((r,i)=>{
    const d=el('div','res'+(i===0?' on':''));
    d.appendChild(el('b','',r.k));
    if(r.t)d.appendChild(el('span','x',r.t));
    if(r.x){const x=el('span','x');
      const p=r.x.split(q);x.appendChild(document.createTextNode(p[0]));
      x.appendChild(el('mark','y',q));
      x.appendChild(document.createTextNode(p.slice(1).join(q)));d.appendChild(x);}
    d.appendChild(el('span','lawtag',SHORT[S.law]));
    d.onclick=()=>{S.tab='jo';S.jo=r.k;closeSk();render();};
    box.appendChild(d);
  });
  const tip=el('div','grp','↵ 이동 · Esc 닫기 · 판례·지문·메모는 범위에서 꺼져 있다');
  box.appendChild(tip);
};
$('#skin').onkeydown=e=>{
  if(e.key==='Escape')return closeSk();
  const rs=$('#skres').querySelectorAll('.res');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(!rs.length)return;
    rs[skSel].classList.remove('on');
    skSel=(skSel+(e.key==='ArrowDown'?1:rs.length-1))%rs.length;
    rs[skSel].classList.add('on');rs[skSel].scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'&&rs.length){S.tab='jo';S.jo=skRows[skSel].k;closeSk();render();}
};
addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea')return;   // 입력칸 포커스 시 단축키 차단
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSk();}
  if(e.key==='Escape'){closePop();closeSk();}
});
$('#sk').onclick=e=>{if(e.target.id==='sk')closeSk();};

/* ══════════ 딥링크 ══════════ */
function readHash(){
  let h=location.hash;
  try{h=decodeURIComponent(h);}catch(e){}
  const m=/^#jo=([^:]+):(제[^&#]+)/.exec(h);
  if(m&&LAWS.includes(m[1])){S.law=m[1];S.tab='jo';S.jo=m[2].split('#')[0];return true;}
  return false;
}
addEventListener('hashchange',()=>{if(readHash())render();});

/* ══════════ 렌더 ══════════ */
let busy=false;
async function render(){
  if(busy)return;busy=true;
  inkReset();                       // 앞 화면의 ResizeObserver 를 끊는다
  // ⚠ body 에 건다 — 팝업(2차 셀 · 조문 팝업)이 #app 밖에 뜬다
  document.body.classList.toggle('inkon',!!S.ink);
  document.body.classList.toggle('stkon',!!S.stick);
  drawTop();drawRail();inkBar();
  try{
    if(S.tab==='prec')await viewPrec();
    else if(S.tab==='cha2')await view2cha();
    else if(S.tab==='jimun')await viewJimun();
    else await viewJo();
  }catch(err){
    const slot=$('#slot');slot.innerHTML='';
    const m=el('div','main');m.appendChild(emptyBox('⚠','데이터를 읽지 못했다',String(err&&err.message||err)));
    slot.appendChild(m);console.error(err);
  }
  busy=false;
}
// 폭이 바뀌면 법전 조판의 단 수를 다시 잡는다. ⚠ 한 행 글자 수는 그대로다 — 단만 준다.
let rsz=null;
addEventListener('resize',()=>{
  clearTimeout(rsz);
  rsz=setTimeout(()=>{
    document.querySelectorAll('.bjpage').forEach(bjFit);
  },140);
});
readHash();
render();
</script>
