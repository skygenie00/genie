/* ── 지문 한 줄의 O/X 줄 — 리담·제7판 카드가 같이 쓴다 ── */
const OXNAME = ['안 품', '맞음', '헷갈림', '틀림', '덜약점'];
/* ══════════ _task_jo_gaek_mb §C-11 회독 이력 줄 ══════════
   민법 `recStripHTML` 꼴. 조판기는 회독을 **마디 단위**로 마감하면서 그 회독의 지문 열쇠 목록
   (`allK`·`rightK`·`wrongK`·`confuseK`)을 같이 남긴다(rndClose 8259~8263) — 그것으로 지문별 줄을 짓는다.
   ⚠ △ 는 **표시**다(단추를 만들지 않는다 · 헷갈림은 머리 🌀 태그가 맡는다 · 지시서 §C-11). */
var MBRIDX = null, MBRSIG = '';
function mbRecIdx(){
  const A = (typeof rndAll === 'function' ? rndAll() : {}) || {};
  let sig = '';
  Object.keys(A).sort().forEach(s => { sig += s + ':' + ((A[s] || []).length) + '|'; });
  if (MBRIDX && MBRSIG === sig) return MBRIDX;
  const idx = {};
  Object.keys(A).forEach(s => (A[s] || []).forEach(r => {
    (r.allK || []).forEach(k => { (idx[k] = idx[k] || []).push(r); });
  }));
  Object.keys(idx).forEach(k => idx[k].sort((a, b) =>
    String(a.ts || a.date || '').localeCompare(String(b.ts || b.date || ''))));
  MBRIDX = idx; MBRSIG = sig; return idx;
}
function mbRecStrip(key){
  const box = el('div', 'mbrec');
  const hist = mbRecIdx()[key] || [];
  const rec = oxOf(key) || {};
  const cur = { date: '', n: hist.length + 1, cur: true,
                ok: rec.p ? !!rec.ok : null, cf: oxTagOn(key, 'confuse') };
  if (!hist.length && !rec.p){
    box.appendChild(el('span', 'dim', '풀이 기록 없음'));
    return box;
  }
  const cells = hist.map(r => ({
    date: r.date || '', n: r.n,
    ok: (r.rightK || []).indexOf(key) >= 0 ? true
      : ((r.wrongK || []).indexOf(key) >= 0 ? false : null),
    cf: (r.confuseK || []).indexOf(key) >= 0
  })).concat([cur]);
  const top = el('div', 'r'), bot = el('div', 'r');
  cells.forEach(c => {
    const s = el('span', 'c ' + (c.ok === true ? 'ok' : c.ok === false ? 'ng' : 'non'),
                 c.ok === true ? 'O' : c.ok === false ? 'X' : '·');
    s.title = (c.date || '오늘') + ' · ' + c.n + '회독째' + (c.cur ? ' · 이번' : '');
    top.appendChild(s);
    bot.appendChild(el('span', 'cf' + (c.cf ? ' on' : ''), c.cf ? '△' : '–'));
  });
  const last = cells.filter(c => c.ok !== null && c.date).map(c => c.date).pop();
  if (last) top.appendChild(el('span', 'last', '마지막 ' + last.slice(5).replace('-', '/')));
  box.appendChild(top); box.appendChild(bot);
  return box;
}

/* ══════════ §C-14 아랫줄 · §C-15 해설 + 하단 액션 바 ══════════
   옛 oxPickRow(8142)를 **같은 이름·같은 자리**로 갈음한다. 기록을 읽고 쓰는 길은 하나도 안 바꿨다 —
   oxOf · oxAns · oxFixed · oxPut · oxState · oxFix · oxClear · solEl · logicView · lnkLines 그대로.
   바뀐 것은 꼴이다: 큰 O/X 상자를 걷고 「정답·해설 ▸ · O · X · 결과 … ✏️ 연결」 한 줄로,
   해설은 그 단추 하나가 [결과 줄 · 해설 · 제7판 해설 · 액션 바]를 연다(채점 뒤엔 저절로 펴짐). */
/* ══════════ _task_jo_gaek_mb §C-10 머리 유형 칩 · 짧은 조문 꼴 ══════════
   「유형 · 조문 앞 둘 · 외 N」 한 칩. **누름은 두 조각** — 유형 글자 = typePop · 조문 글자 = popJo.
   보이는 글자만 「혼합」이고 저장값(`조문+판례`)은 그대로다(지시서 §C-10).
   ⚠ 짧게 줄이는 함수는 **하나**다(joShort) · 1차객에서만 쓴다. */
const JOSH_LAW = { '특': '특허', '상': '상표', '디': '디보', '민': '민소' };
function joShort(c){
  const s = String(c || '').trim();
  /* ⓐ 코드 꼴 `특-128-2-1` (법-조-항-호-목) */
  if (s.indexOf('-') > 0 && !/^제/.test(s)){
    const g = s.split('-');
    if (g.length < 2) return s;
    const cur = (LAW_SHORT || {})[SHORT[S.law]] || '';
    const pre = (g[0] && g[0] !== cur) ? ((JOSH_LAW[g[0]] || g[0]) + ' ') : '';
    let out = g[1];                                   /* 128 · 5의2 */
    if (g[2]) out += (JOHANG[+g[2]] || ('(' + g[2] + ')'));
    else if (g[3]) return pre + out + '-' + g[3];     /* 항 없이 호만 → 128-1 */
    if (g[3]) out += g[3];
    if (g[4]) out += g[4];
    return pre + out;
  }
  /* ⓑ 사람이 읽는 꼴 `제128조② 1호 가목` */
  const m = /^제\s*(\d+)조(?:의\s*(\d+))?\s*([①-⑮])?\s*(?:(\d+)\s*호)?\s*(?:([가-힣])\s*목)?/.exec(s);
  if (!m) return s;
  let out = m[1] + (m[2] ? '의' + m[2] : '');
  if (m[3]) out += m[3];
  else if (m[4]) return out + '-' + m[4];
  if (m[4]) out += m[4];
  if (m[5]) out += m[5];
  return out;
}
/* 유형 칩 — 민법 typeChipHTML 꼴(11px · p2/8 · rad6 · 초안이면 점선) */
function mbTypeChip(key, draft, jos, host){
  const fix = tyOf(key), eff = tyEff(key, draft);
  const raw = eff ? TY_NAME[eff] : '';                       /* 저장값 이름 */
  const lbl = raw === '조문+판례' ? '혼합' : raw;            /* 보이는 글자만 갈음 */
  const list = (jos || []).filter(Boolean);
  const shown = list.slice(0, 2);
  const tail = list.length > shown.length ? (' 외 ' + (list.length - shown.length)) : '';
  const chip = el('span', 'mbtype ' + (eff || 'none') + (fix ? ' fix' : ' draft'));
  const tb = el('button', 'seg ty', lbl || '유형?');
  tb.title = (fix ? '직접 확정한 값' : '초안 — 눌러 확정') + ' · 저장값 ' + (raw || '없음');
  tb.onclick = ev => { ev.stopPropagation(); typePop(key, ev); };
  chip.appendChild(tb);
  shown.forEach(c => {
    chip.appendChild(el('i', 'dot', '·'));
    const jb = el('button', 'seg jo', joShort(c));
    jb.title = (typeof joLabel === 'function' && String(c).indexOf('-') > 0) ? joLabel(c) : String(c);
    jb.onclick = ev => { ev.stopPropagation();
      const k = (String(c).indexOf('-') > 0 && typeof joCode === 'function') ? joCode(c)
              : String(c).replace(/\s.*$/, '');
      if (k) popJo(S.law, k, ev, 1); else toast('조문 번호를 못 읽었다'); };
    chip.appendChild(jb);
  });
  if (tail){
    const mb = el('span', 'seg more', tail);
    mb.title = list.slice(2).map(x => (String(x).indexOf('-') > 0 ? joLabel(x) : x)).join(' · ');
    chip.appendChild(mb);
  }
  host.appendChild(chip);
  return chip;
}

/* ══════════ §C-16 「ID …」 → 교재 자리 목록(민법 mbbListHTML 꼴) ══════════
   이번 판은 **정리OMR 자리만** 채운다. 교재 PDF 줄·「후보 N」은 나중 판이라
   **죽은 줄을 그리지 않는다**(지시서 §C-16). 누름은 앞 판 핀이 하던 길 그대로(pinPop·omrJump). */
function mbbPop(key, ev){
  const _pk = 'cell|📚 교재 자리 — ' + linkDisp(key);
  if (popToggle(_pk)) return;
  const body = popShell('cell', '📚 교재 자리 — ' + linkDisp(key), _pk);
  showPop(ev);
  const wrap = el('div', 'mbblist');
  if (S.law !== '특허법'){
    wrap.appendChild(el('div', 'mbbnone', '정리OMR 은 특허만 있다'));
    body.appendChild(wrap); return;
  }
  const info = (typeof pinInfo === 'function') ? pinInfo(key) : null;
  const pin = info && info.pin;
  const row = el('div', 'mbbrow');
  const hd = el('div', 'hd');
  hd.appendChild(el('span', 'k', '정리OMR'));
  hd.appendChild(el('span', 'p', pin ? (pin.page + '쪽') : '아직 안 찍음'));
  if (pin) hd.appendChild(el('span', 'm', 'PDF ' + pin.page));
  hd.appendChild(el('span', 'm', pin ? (pin.user ? '찍어 둔 자리' : '자동 자리') : '누르면 찍기'));
  row.appendChild(hd);
  row.appendChild(el('div', 'sn', pin
    ? '그 자리를 미리 본다 — 누르면 정리 레일의 그 줄로 간다.'
    : '이 지문이 정리OMR 어디에 있는지 아직 안 찍었다. 누르면 찍기 화면으로 간다.'));
  row.onclick = ev2 => { closeAllPops();
    if (pin && typeof pinPop === 'function') pinPop(key, ev2);
    else if (typeof omrJump === 'function') omrJump(key); };
  wrap.appendChild(row);
  /* ★ add1 §B-5 — 태그줄에 있던 📍 가 여기로 왔다(민법 태그는 다섯뿐이다).
     `omrPins`·`omrJump` 값은 안 건드린다 — 가는 길만 옮겼다. */
  {const pg = el('div', 'mbbrow');
   const ph = el('div', 'hd');
   ph.appendChild(el('span', 'k', '📍 위치 찍기'));
   ph.appendChild(el('span', 'm', pin ? '다시 찍기' : '아직 안 찍음'));
   pg.appendChild(ph);
   pg.appendChild(el('div', 'sn', '정리OMR 에서 이 지문이 있는 줄을 찍는다.'));
   pg.onclick = ev2 => { ev2.stopPropagation(); closeAllPops();
     if (typeof omrJump === 'function') omrJump(key); };
   wrap.appendChild(pg);}
  wrap.appendChild(el('div', 'mbbnone',
    '교재 PDF 자리·후보는 다음 판에서 들어온다 — 지금은 줄을 그리지 않는다.'));
  body.appendChild(wrap);
}
/* ══════════ _task_jo_gaek_mb §D-17 알약 — 민법 꼴 · 문제풀이 화면 안 sticky ══════════
   옛 「쪽 1/1 · 마킹 0/13」 뜬 알약(#oxpill)과 떠 있는 두 단추(#oxfab)를 이것으로 갈음한다.
   ⚠ **회독·마감 규칙은 안 건드린다**(지시서 §F). 민법의 「마지막 쪽 채점 = 자동 저장+잠금」은
     조판기의 마감 규칙을 바꾸는 일이라 옮기지 않았다 — 마지막 쪽에서는 채점 뒤 알약에
     「◈ 저장·보기」(옛 `rndClose` 그대로)가 뜬다. 보고에 적는다.
   ⚠ _add1 — 막대는 `pointer-events:none`, 알약·단추만 `auto`(민법 실물의 누름 가로채기를 안 옮긴다). */
function mbPillBars(main, ctx, pgCells, allCells, nPg, marked, unDone, scope2, keysAll, mokLabel, noRnd){
  /* ★ add1 §A-2 — `noRnd` = 큐(회독이 없는 자리). 회독 알약을 짓지 않는다. */
  const graded = !noRnd && keysAll.some(k => ((oxOf(k) || {}).p));
  /* ── ◀ 이전 (왼쪽 흰 알약) ── */
  if (nPg > 1 && S.oxPage > 0){
    const bl = el('div', 'mbbar l');
    const pb = el('button', 'mbprev', '◀ 이전');
    pb.onclick = () => { S.oxPage--; S.oxPageJump = true; render(); };
    bl.appendChild(pb);
    main.appendChild(bl);
  }
  /* ── 채점 뒤 알약 — 「📊 채점 · 다음」 ── */
  if (graded){
    const bg = el('div', 'mbbar r');
    const box = el('div', 'mbpill');
    const b1 = el('button', 'mbpb', '📊 채점');
    b1.title = '채점 결과 · 회독별 비교';
    b1.onclick = ev => rsltPop(scope2, keysAll, mokLabel, ev);
    box.appendChild(b1);
    if (nPg > 1 && S.oxPage < nPg - 1){
      const b2 = el('button', 'mbpb sub', '다음');
      b2.onclick = () => { S.oxPage++; S.oxPageJump = true; render(); };
      box.appendChild(b2);
    } else {
      /* 마지막 쪽 — 옛 「◈ 단원 최종 결과 저장 및 보기」 자리(마감 규칙 무변) */
      const b3 = el('button', 'mbpb sub', '◈ 저장·보기');
      b3.title = '이 판을 마감하고 결과를 본다 — 옛 「단원 최종 결과 저장 및 보기」와 같다';
      b3.onclick = () => rndClose(scope2, keysAll, mokLabel);
      box.appendChild(b3);
    }
    bg.appendChild(box);
    main.appendChild(bg);
  }
  /* ── 아래 알약 — 「마킹 N/총 · 채점 ✓ · 다음 ▶」 ── */
  const br = el('div', 'mbbar r');
  const box2 = el('div', 'mbpill');
  const mk = el('span', 'mk');
  mk.appendChild(document.createTextNode('마킹 '));
  mk.appendChild(el('b', '', String(marked.length)));
  mk.appendChild(document.createTextNode('/' + unDone.length));
  box2.appendChild(mk);
  const gb = el('button', 'mbpb', '채점 ✓');
  if (!unDone.length) { gb.disabled = true; gb.title = '이 쪽은 다 채점됐다'; }
  else gb.onclick = () => oxGrade(pgCells, ctx);
  box2.appendChild(gb);
  if (nPg > 1 && S.oxPage < nPg - 1){
    const nb = el('button', 'mbpb sub', '다음 ▶');
    nb.onclick = () => { S.oxPage++; S.oxPageJump = true; render(); };
    box2.appendChild(nb);
  }
  br.appendChild(box2);
  main.appendChild(br);
}
/* ══════════════════ _task_jo_gaek_mb §C-13 근거 (gg · ggref) ══════════════════
   민법OX 의 근거 층을 **조판기 방식으로 새로 썼다** — 민법은 HTML 문자열, 조판기는 el() 이라
   코드를 베끼지 않고 꼴·치수·동작을 옮긴다(지시서 §0 「코드 복사 말고 꼴을 옮긴다」).

   저장 — 새 키 **둘만**(§F). `jopangi.gg` · `jopangi.ggref` · 둘 다 `SYNC_KEYS` 에 든다.
     GG[uid]    = [{k, i, t, ok, ts, cs:[{k,t,ts}], parts?, bang?, src?}]
     GGREF[me]  = [target…]   (me 가 target 의 근거를 끌어다 쓴다 · 임자 = ggOwners(target))
   열쇠(uid) = **그 지문의 `ox` 기록 열쇠**(oxKeyLid·oxKeyP7) — 법을 가르는 방식도 `ox` 와 똑같다.
   검색·연결·쓰임 수는 **1차객 · 보고 있는 법 안에서만**(OXPOOL 이 그 법의 지문만 담는다).
   한도 — 본문 4000 · 댓글 2000. 넘으면 자르지 않고 저장도 안 하되 칸 아래에 몇 자인지 보인다.        */
const GG_KEY = REC_PRE + 'gg', GR_KEY = REC_PRE + 'ggref';
const GG_TMAX = 4000, GG_CMAX = 2000;
let GGREC = null, GRREC = null;
function ggAll(){ if (!GGREC) GGREC = lsRead(GG_KEY); return GGREC; }
function ggOf(uid){ const a = ggAll()[uid]; return Array.isArray(a) ? a : []; }
function ggPutList(uid, list){
  const A = ggAll();
  if (list && list.length) A[uid] = list; else delete A[uid];
  GGREC = A; lsWrite(GG_KEY, A, '근거');
}
function grAll(){ if (!GRREC) GRREC = lsRead(GR_KEY); return GRREC; }
function ggRefOf(uid){ const a = grAll()[uid]; return Array.isArray(a) ? a : []; }
function ggRefPut(uid, list){
  const A = grAll();
  if (list && list.length) A[uid] = list; else delete A[uid];
  GRREC = A; lsWrite(GR_KEY, A, '근거 연결');
}
function ggOwners(t){ const A = grAll(), out = []; for (const k in A){ if ((A[k] || []).indexOf(t) >= 0) out.push(k); } return out; }
function ggRefAdd(me, t){ if (me === t) return; const a = ggRefOf(me).slice();
  if (a.indexOf(t) < 0) a.push(t); ggRefPut(me, a); }
function ggRefDel(me, t){ ggRefPut(me, ggRefOf(me).filter(x => x !== t)); }

const ggNewKey = p => p + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
const ggItem = (uid, k) => ggOf(uid).find(g => g && g.k === k) || null;
const ggCsOf = (g, ck) => (((g && Array.isArray(g.cs)) ? g.cs : []).find(x => x && x.k === ck) || null);
const ggMD = ts => { const d = new Date(ts || 0); return (d.getMonth() + 1) + '/' + d.getDate(); };
const ggOkWord = ok => ok === 'O' ? '맞음' : ok === 'X' ? '틀림' : ok === 'Q' ? '헷갈림' : '안 품';
const ggOkCls = ok => ok === 'O' ? 'ok-o' : ok === 'X' ? 'ok-x' : ok === 'Q' ? 'ok-q' : 'ok-n';
const ggFlat = g => (Array.isArray(g.parts) && g.parts.length)
  ? g.parts.map(p => ((p.l ? p.l + ' ' : '') + p.t)).join('\n') : String(g.t || '');
/* 지금 정오 — 근거를 적을 때의 내 답(민법은 그때 채점 상태를 같이 남긴다) */
function ggMarkNow(uid){ const r = oxOf(uid) || {}; return r.p || r.m || null; }
/* 번호 다시 매김 — 지운 뒤 1..n 으로 (§C-13) */
function ggRenum(list){ (list || []).forEach((g, n) => { g.i = n + 1; }); return list; }
/* 병렬 라벨 다음 것 — 1→2 · ㄱ→ㄴ · ①→② · 가→나 · a→b (못 알아보면 빈칸) */
const GG_HAN = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ', GG_GAN = '가나다라마바사아자차카타파하',
      GG_CIRC = '①②③④⑤⑥⑦⑧⑨⑩';
function ggNextLabel(l){
  const s = String(l || '').trim(); if (!s) return '';
  let m = s.match(/^(\D*)(\d+)(\D*)$/);
  if (m) return m[1] + (+m[2] + 1) + m[3];
  const one = (tab, x) => { const i = tab.indexOf(x); return (i >= 0 && i + 1 < tab.length) ? tab[i + 1] : ''; };
  if (s.length === 1){
    const n = one(GG_HAN, s) || one(GG_GAN, s) || one(GG_CIRC, s); if (n) return n;
    if (/^[a-y]$/.test(s)) return String.fromCharCode(s.charCodeAt(0) + 1);
    if (/^[A-Y]$/.test(s)) return String.fromCharCode(s.charCodeAt(0) + 1);
  }
  m = s.match(/^(.)(\.|\))$/);
  if (m){ const n = one(GG_HAN, m[1]) || one(GG_GAN, m[1])
            || (/^[a-y]$/.test(m[1]) ? String.fromCharCode(m[1].charCodeAt(0) + 1) : '');
    if (n) return n + m[2]; }
  return '';
}
/* 적을 때 「라벨 글」 꼴이면 병렬 조각으로 쪼갠다(민법 §병렬 라벨) */
function ggParse(t){
  const lines = String(t || '').split('\n').map(x => x.trim()).filter(Boolean);
  if (lines.length < 2) return null;
  const parts = [];
  for (const ln of lines){
    const m = ln.match(/^([0-9]{1,2}[.)]|[ㄱ-ㅎ][.)]?|[가-힣][.)]|[①-⑩]|[A-Za-z][.)])\s+(.+)$/);
    if (!m) return null;
    parts.push({ l: m[1], t: m[2] });
  }
  return parts;
}

function ggEatLogic(dry){
  const A = lgAll(); let n = 0;
  const keys = Object.keys(A);
  keys.forEach(k => {
    const t = String((A[k] || {}).t || '').trim(); if (!t) return;
    const L = ggOf(k).slice();
    if (L.some(g => g && g.src === 'logic' && ggFlat(g) === t)) return;   /* 멱등 */
    if (dry){ n++; return; }
    const g = { k: ggNewKey('lg'), i: L.length + 1, t: t, ok: ggMarkNow(k),
                ts: Date.parse((A[k] || {}).ts || '') || Date.now(), cs: [], src: 'logic' };
    const parts = ggParse(t); if (parts) g.parts = parts;
    L.push(g); ggRenum(L); ggPutList(k, L);
    n++;
  });
  if (!dry && n){
    const B = lgAll();
    keys.forEach(k => { delete B[k]; });
    LGREC = B; lsWrite(LG_KEY, B, '📐 논리 → 근거 흡수');
    try{ const gone = sObj(SG_KEY), now = Date.now();      /* 묘비 — 다른 기기에서 안 되살아나게 */
      keys.forEach(k => { gone[ckey(LG_KEY, k)] = now; }); sPut(SG_KEY, gone); }catch(e){}
  }
  return n;
}

  /* ── 하단 액션 바 — ⚖ 원문(joWonBtn 그대로) · 지문 끝에 있던 조문·판례 칩 · ✎ 정정 · 지우개 ── */
  const act = el('div', 'mbact');

  fx.onclick = ev => { ev.stopPropagation(); oxFix(key, raw); };

/* ── 거르기 · 빠른 실행 큐 ──
   ★ 큐는 **마디 경계를 넘는다**(사용자 확정 8/26) — 특허 안에서 약점만 모아 풀다. */
/* ★ v3-H §1 — 거르기 = 유형만(틀림·헷갈림·안 품·논리 거르기는 폐기 — 큐·검색의 몫).
   ★ v3-J §0-0 — 배지(점선 초안 포함)와 거르기가 다른 값을 보던 버그: 판정 = tyEff(손확정 || 초안).
   조문형 = eff jo|mix · 판례형 = eff pan|mix(조문+판례는 양쪽 다 · §5-e) · 조문+판례 = eff mix ·
   미확정 = 손확정 없음(초안이 있어도 — 점선인 것 전부).
   옛 값(wrong 등)이 S.oxFilter 에 남아 있어도 어느 분기에도 안 걸려 전체로 동작한다. */
function oxKeep(key, draft){
  const eff = tyEff(key, draft);
  if (S.oxFilter === 'jo')  return eff === 'jo' || eff === 'mix';
  if (S.oxFilter === 'pan') return eff === 'pan' || eff === 'mix';
  if (S.oxFilter === 'mix') return eff === 'mix';
  if (S.oxFilter === 'untype')  return !tyOf(key);
  return true;
}
function oxQueueHas(key, kind){
  const st = oxState(key);
  if (kind === 'weak') return st === 3 || st === 2;
  if (kind === 'semi') return st === 4;
  return false;
}
function oxBar(counts){
  const b = el('div', 'modebar');
  b.appendChild(el('span', 'pl', '⚡ 빠른 실행'));
  [['weak', '🔥 약점'], ['semi', '🌤 덜약점']].forEach(([k, t]) => {
    const x = el('button', 'tool' + (S.oxQueue === k ? ' on' : ''), t + ' ' + (counts[k] || 0));
    x.onclick = () => { S.oxQueue = (S.oxQueue === k ? '' : k); render(); };
    b.appendChild(x);
  });
  b.appendChild(el('span', 'pl', '거르기'));
  /* ★ v3-H §1 — 유형만: 전체 · 조문형 · 판례형 · 조문+판례 · 미확정(점선 테두리·회색 글자) */
  [['all', '전체'], ['jo', '조문형'], ['pan', '판례형'], ['mix', '조문+판례'],
   ['untype', '미확정']].forEach(([k, t]) => {
    const x = el('button', 'tool' + (k === 'untype' ? ' unty' : '') + (S.oxFilter === k ? ' on' : ''), t);
    x.onclick = () => { S.oxFilter = k; render(); };
    b.appendChild(x);
  });
  return b;
}

/* ── 회독 ── 마감하면 O/X 선택만 비우고 헷갈림·덜약점은 남긴다 — 다음 회독의 출발선이다 */
function rndList(scope){ const a = rndAll()[scope]; return Array.isArray(a) ? a : []; }
function rndClose(scope, keys, label){
  const done = keys.filter(k => (oxOf(k) || {}).p).length;
  if (!done){ toast('이 판에서 풀이한 지문이 없다'); return; }
  const cnt = [0, 0, 0, 0, 0];
  /* ★ v3-C §1 — 지문별 결과 키 목록을 회독 항목에 남긴다(칩·대조의 바닥).
     맞은 키까지 담으면 커진다 — right 는 수만 남긴다. */
  const wrongK = [], confuseK = [], semiK = [], rightK = [], allK = [];
  let fakeN = 0;   // ★ v3-D §2 — 배지의 ⚠ 수. 옛 항목엔 없어 ⚠– 로 보인다
  keys.forEach(k => { const st = oxState(k); cnt[st]++; allK.push(k);
    if (st === 3) wrongK.push(k);
    else if (st === 2) confuseK.push(k);
    else if (st === 4) semiK.push(k);
    const r0 = oxOf(k) || {};
    if (r0.p && r0.ok) rightK.push(k);
    if (oxTagOn(k, 'fake')) fakeN++; });
  const n = rndList(scope).length + 1;
  /* ★ v3-E §0-3 — confirm 폐기: 묻지 않고 마감한다. 잘못 눌렀으면 회독별 비교에서 그 회독 삭제 */
  const A = rndAll();
  const L = rndList(scope);
  L.push({ n: n, date: nowIso().slice(0, 10), total: keys.length, done: done,
           right: cnt[1], wrong: cnt[3], confuse: cnt[2], semi: cnt[4],
           fake: fakeN, ts: nowIso(),      // ts — §5 학습로그가 날짜로 가른다
           wrongK: wrongK, confuseK: confuseK, semiK: semiK,
           rightK: rightK, allK: allK });   // ★ v3-D §3 — 칩·대조용 전체 키(순번은 안 담는다)
  A[scope] = L;
  RNDREC = A; lsWrite(RND_KEY, A, '회독');
  const O = oxAll();
  keys.forEach(k => { if (O[k]){ delete O[k].p; delete O[k].ok; O[k].ts = nowIso(); } });
  OXREC = O; lsWrite(OX_KEY, O, '1차객 풀이');
  /* ★ v3-E §0-4 — 자동 창 폐기(v3-C §5 폐기). 마감하고 1쪽으로 조용히 간다.
     창은 회독 배지 · 「📊 채점표」 · 채점 결과 창의 「저장 및 보기」에서만 연다. */
  S.oxPage = null;
  render();
  toast(n + '회독 마감 — 맞음 ' + cnt[1] + ' / 풀이 ' + done);
}
/* ══ v3-C §2~§4 — 📊 회독 비교·채점표 팝업 (민법OX 이식 · 2026-08-26 밤) ══
   rndClose 가 남긴 wrongK/confuseK/semiK 로 회독마다 지문 칩을 그린다.
   옛 항목(목록 없음)은 수만 보인다 — 칩을 지어내지 않는다(§1). */
function oxKeyDisp(k){
  if (k.indexOf('L:') === 0){ const i = k.indexOf('#'); return i >= 0 ? k.slice(i) : k; }
  if (k.indexOf('P7:') === 0) return k.slice(3);
  return k.length === 8 ? k.slice(5) : k;   // sid 8자 → 뒤 3자(문번2+지문1 · 규약 v3)
}
function rndGo(scope, k){
  const info = (OXPOOL || {})[k];
  if (!info) return;
  /* ⚠ 병합 지문(8자 sid)은 마디에 따라 리담 카드(qb-<문항id>)로도,
     제7판 카드(qb-<키>)로도 그려진다 — 지금 마디에 있는 쪽을 잡는다(실측: 주체능력 전부 후자) */
  const doms = info.dom === ('qb-' + k) ? [info.dom] : [info.dom, 'qb-' + k];
  const fin = () => {
    const d = doms.find(x => document.getElementById(x));
    if (!d){ toast('그 지문 카드가 지금 화면에 없다 — 거르기·큐를 풀면 보인다'); return; }
    const box = document.getElementById(d);
    box.scrollIntoView({ block: 'center' });
    box.classList.add('hmhit');
    setTimeout(() => box.classList.remove('hmhit'), 1500);
  };
  const hop = () => {
    const d = doms.find(x => (OXDOMPG || {})[x] != null);
    const pg = d != null ? OXDOMPG[d] : null;
    if (pg != null && pg !== S.oxPage){
      S.oxPage = pg; S.oxPageJump = true;
      render().then(() => setTimeout(fin, 60));
    } else fin();
  };
  const sel = (scope || '').split('|')[2] || '';
  if (sel && S.mok !== sel){
    S.mok = sel; S.oxPage = null; S.oxQueue = '';
    render().then(() => setTimeout(hop, 60));
  } else hop();
}
/* ══ v3-D §0 — 순번은 마디 안 카드 순서로 **그릴 때만** 센다. 어디에도 저장하지 않는다.
   기록은 전부 키(sid)에 붙으므로 CSV 정리로 순서가 바뀌어도 무해하다(R2). */
function mokCards(i){
  if (!VJ) return [];
  const M = VJ.M, n = M[i]; if (!n) return [];
  let jos = [...n.지문], lids = [...n.리담];
  for (let j = i + 1; j < M.length; j++){
    if (M[j].깊이 <= n.깊이) break;
    jos = jos.concat(M[j].지문); lids = lids.concat(M[j].리담);
  }
  jos = [...new Set(jos)]; lids = [...new Set(lids)];
  const _seen = new Set();
  lids.forEach(id => { const q = VJ.byId[id]; if (q)(q.지문 || []).forEach(z => { if (z.uid) _seen.add(z.uid); }); });
  const out = [];
  lids.map(id => VJ.byId[id]).filter(Boolean)
    .forEach(q => out.push({ kind: 'L', q: q, dom: 'qb-' + q.id }));
  jos.map(id => VJ.P7map[id]).filter(z => z && !(z.병합 && _seen.has(z.uid)))
    .forEach(z => out.push({ kind: 'P', z: z, dom: 'qb-' + oxKeyP7(z) }));
  return out;
}
function unCards(){
  if (!VJ) return [];
  const placed = new Set();
  VJ.M.forEach(n => n.리담.forEach(x => placed.add(x)));
  const out = [];
  (VJ.qs || []).filter(q => !placed.has(q.id))
    .forEach(q => out.push({ kind: 'L', q: q, dom: 'qb-' + q.id }));
  return out;
}
function scopeCards(scope){
  const sel = (scope || '').split('|')[2] || '';
  const m = /^__mg(\d+)$/.exec(sel);
  if (m) return mokCards(+m[1]);
  if (sel === '__미분류') return unCards();
  return [];
}
// 카드 목록 → 지문(=문제) 목록. s = 카드 순번(1~) · zn = 지문 번호(제7판 단독은 없음)
function mokCells(cards){
  const cells = [];
  cards.forEach((c, ci) => {
    const s = ci + 1;
    if (c.kind === 'L')(c.q.지문 || []).forEach(z => cells.push({
      k: oxKeyLid(c.q, z), ans: z.ox || '', dom: c.dom, s: s, zn: z.n, label: s + '(' + z.n + ')' }));
    else cells.push({ k: oxKeyP7(c.z), ans: (c.z.ox || ((c.z.리담 || {}).ox || '')) || '',
      dom: c.dom, s: s, zn: null, label: String(s) });
  });
  return cells;
}
function mokPath(i){
  if (!VJ) return '';
  const M = VJ.M, parts = [];
  let d = (M[i] || {}).깊이 || 0;
  for (let j = i; j >= 0; j--){
    const n = M[j]; if (!n) continue;
    if (j === i || n.깊이 < d){
      parts.unshift((n.no ? n.no + (n.깊이 === 1 ? '. ' : ' ') : '') + n.제목);
      d = n.깊이;
      if (d <= 1) break;
    }
  }
  return parts.join(' > ');
}
function mokPathOf(scope){
  const sel = (scope || '').split('|')[2] || '';
  const m = /^__mg(\d+)$/.exec(sel);
  if (m) return mokPath(+m[1]);
  if (sel === '__미분류') return '미분류 (리담)';
  return sel;
}
/* 순번 칩 — 초록 맞음 · 빨강 틀림 · 회색 안 품. 누르면 창을 닫고 그 카드로(§3·§4) */
function seqChipEl(scope, seq, k, cls){
  const c = seq[k];
  const b = el('button', 'rchip ' + cls, c ? c.label : oxKeyDisp(k));
  b.title = k;
  b.onclick = () => { const p = b.closest('.pop'); if (p) closeOne(p); rndGo(scope, k); };
  return b;
}
function rndDelOne(scope, r){
  /* ★ v3-F §6-1 — 민법OX 그대로: 문구 + 뒤 회독 번호 당김 */
  if (!confirm(r.n + '회독 기록(' + (r.right != null ? r.right : '–') + '/' +
      (r.total != null ? r.total : '–') + ')을 삭제할까요?' + String.fromCharCode(10) +
      '이후 회독 번호가 하나씩 당겨집니다.')) return;
  const A = rndAll();
  const arr = A[scope] || [];
  const i = arr.indexOf(r);
  if (i < 0){ toast('그 회독을 찾지 못했다'); return; }
  arr.splice(i, 1);
  arr.forEach((x, j) => { x.n = j + 1; });
  if (!arr.length) delete A[scope];
  RNDREC = A; lsWrite(RND_KEY, A, '회독');
  closePop(); render();
}
/* 회독 칸들 — N회독 맞/전체 · 오답 · 날짜 · [삭제] + 전체 순번 칩(§3). rlDesc = 최신부터 */
function rndBlocks(body, scope, seq, rlDesc){
  rlDesc.forEach(r => {
    const bk = el('div', 'rndblk');
    const hd = el('div', 'rndhd');
    hd.appendChild(el('span', '', r.n + '회독  ' + (r.right != null ? r.right : '–') + '/' +
      (r.total != null ? r.total : '–') + '  ·  오답 ' + r.wrong + '  ·  ' + r.date));
    const sp = el('span'); sp.style.flex = '1'; hd.appendChild(sp);
    const del = el('button', 'tool', '삭제');
    del.title = '이 회독 하나만 지운다';
    del.onclick = () => rndDelOne(scope, r);
    hd.appendChild(del);
    bk.appendChild(hd);
    if (Array.isArray(r.allK)){
      const rt = {}; (r.rightK || []).forEach(k => rt[k] = 1);
      const wr = {}; (r.wrongK || []).forEach(k => wr[k] = 1);
      const line = el('div');
      r.allK.forEach(k => line.appendChild(seqChipEl(scope, seq, k, rt[k] ? 'ok' : (wr[k] ? 'bad' : 'off'))));
      bk.appendChild(line);
    } else if (Array.isArray(r.wrongK)){
      const line = el('div');

      bk.appendChild(line);
    } else bk.appendChild(el('div', 'cdim', '지문별 기록 없음(옛 회독)'));

  });
}
function rndDelAll(scope){
  const A = rndAll();
  if (!Array.isArray(A[scope]) || !A[scope].length){ toast('삭제할 회독 기록이 없다'); return; }
  if (!confirm('이 마디의 회독 이력 ' + A[scope].length + '개를 모두 지운다.' + String.fromCharCode(10) + '지문별 풀이·태그·메모는 그대로 남는다.')) return;

/* ★ v3-D §3 — 회독별 비교 창. 마감된 회독을 한 칸씩 나열하고 대조는 두 줄만. */
function rndPop(scope, keys, label, ev){
  const _pk38=('cell')+'|'+('📑 회독별 비교'); if(popToggle(_pk38))return; const body=popShell('cell', '📑 회독별 비교', _pk38);   /* ★ 상표 손질 6 — 키 종류|제목 */
  const path = mokPathOf(scope);
  if (path) body.appendChild(el('div', 'cdim', path));
  const seq = {}; mokCells(scopeCards(scope)).forEach(c => seq[c.k] = c);
  const rlAll = rndList(scope);
  const rl = rlAll.slice().reverse();
  /* ⚠ 조판기만의 상태 — 다 풀었지만 아직 마감 안 한 판(지시서 §3 제안 · 사용자 미확정).
     채점된 것이 있으면 맨 위에 「이번 (N회독) · 채점중」 칸을 §4 와 같은 칩으로 보인다. */
  const graded = keys.filter(k => ((oxOf(k) || {}).p));
  if (graded.length){
    const right = graded.filter(k => ((oxOf(k) || {}).ok));
    const bk = el('div', 'rndblk');
    bk.appendChild(el('div', 'rndhd', '이번 (' + (rlAll.length + 1) + '회독) · 채점중 — ' +
      right.length + '/' + graded.length));
    const line = el('div');
    graded.forEach(k => line.appendChild(seqChipEl(scope, seq, k, ((oxOf(k) || {}).ok) ? 'ok' : 'bad')));
    bk.appendChild(line);
    body.appendChild(bk);
  }
  if (!rl.length) body.appendChild(el('div', 'cdim', '아직 마감한 회독이 없다'));
  else rndBlocks(body, scope, seq, rl);
  // 대조 두 줄 — 계속 틀림(직전에도 이번에도) · 극복함(직전 틀림 → 이번 맞음)
  const prev = rl[0];
  if (prev && Array.isArray(prev.wrongK)){
    const bk = el('div', 'rndblk');
    bk.appendChild(el('div', 'rndhd', '직전 ' + prev.n + '회독과 대조'));
    const keep = prev.wrongK.filter(k => oxState(k) === 3);
    const over = prev.wrongK.filter(k => { const r = oxOf(k) || {}; return r.p && r.ok; });
    [['계속 틀림', keep, 'bad'], ['극복함', over, 'ok']].forEach(([t, ks, cls]) => {
      const line = el('div');
      line.appendChild(el('span', 'badge', t + ' ' + ks.length));
      if (!ks.length) line.appendChild(el('span', 'cdim', ' 없음'));
      else ks.forEach(k => line.appendChild(seqChipEl(scope, seq, k, cls)));
      bk.appendChild(line);
    });
    body.appendChild(bk);
  }
  const row = el('div', 'memobtn');
  const del = el('button', 'tool', '🗑 이 단원 기록 전체 삭제');
  del.title = '회독 이력만 지운다 — 지문별 풀이·태그·메모는 그대로다';
  del.onclick = () => rndDelAll(scope);
  const cls2 = el('button', 'tool', '닫기');
  cls2.onclick = () => closeOne(body.parentNode);
  row.appendChild(del); row.appendChild(cls2);
  body.appendChild(row);

  } else if (gr.length){

  rb.onclick = () => giReset(y, list);

  main.appendChild(bar);
  if (S.omr) main.appendChild(giOmrPad(y, list));
  let show = list;
  if (S.giWrong && yrec.sub)
    show = list.filter(q => { const r = giOf(giKey(q)) || {}; return r.g && !r.ok; });

  else show.forEach(q => main.appendChild(giCard(q, !!yrec.sub)));
}

/* ★ 제7판 지문 본문 청소 — 표시층만 (8/26)
   원장 `t` 에 교재 조판 잔재가 같이 들어와 있다. 실측 1,625행 중
   `[NN 변리]` 1,624 · 인쇄 정답표기 `답 I O I X I` 226 · 쪽머리글 46 · 줄바꿈 1,514.
   태그는 머리 배지와 같은 값이라 두 번 보였다.
   ⚠ 원장 csv 는 건드리지 않는다 — 재추출은 지문 ID 게이트로 번진다. 안 보이게만 한다. */
function p7Text(t){
  let x = String(t || '');
  x = x.replace(/\[\s*\d{2}(?:[\s\u00b7,]+\d{2})*\s*변리\s*\]/g, '');
  x = x.replace(/(^|\n)[ \t]*답[ \t]*[I|][^\n]*/g, '');
  x = x.replace(/(^|\n)[ \t]*제\d+편[ \t]+[^\n]*$/g, '');
  return x.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ').trim();
}

/* ★ 근거 조문 — 제7판 지문에는 근거 「열」이 없고 **해설 본문**에 박혀 있다 (8/26 실측).
   해설 있는 1,301개 중 691개에 표기가 있다 — 法 1,121회 · 施規 41회.
   꼴 두 가지 — 「法2조3호 가목」 · 「法197①」 · 「施規106의4」.
   ⚠ 施規(시행규칙)는 앱에도 API에도 데이터가 없다 — 배지만 달고 링크는 걸지 않는다. */
/* ★ 8/26 — `제N조` 꼴까지 넓혔다(사용자 확정). 전엔 `法 11` 한자 약물만 잡아
   `특허법 제11조` 로 적힌 해설 356건이 통째로 칩을 못 받고 있었다.
   실측 681건 중 — 딴 법 이름이 앞에 붙은 66건 제외 · 특허법 조문 목록 밖 25건 제외 → 590 채택. */
const JO_OTHER=/(민사소송법|민법|상표법|디자인보호법|실용신안법|저작권법|형법|행정소송법|행정심판법|시행령|시행규칙|조약|협약)\s*$/;
function p7Jo(sol, extra){
  const out=[], seen={}, s=String(sol||'');
  const add=(k,law)=>{if(k&&!seen[k]){seen[k]=1;out.push({k:k,law:law});}};
  s.replace(/法\s*(\d+)(?:조)?(?:의\s*(\d+))?/g,(m,a,b)=>{
    add('제'+a+'조'+(b?'의'+b:''),true);return m;});
  const RX=/제\s?(\d+)조(?:의\s?(\d+))?/g; let m2;
  while((m2=RX.exec(s))){
    if(JO_OTHER.test(s.slice(Math.max(0,m2.index-14),m2.index)))continue;
    const k='제'+m2[1]+'조'+(m2[2]?'의'+m2[2]:'');
    if(JOKEY&&!JOKEY[k])continue;      // 목록에 없는 번호는 딴 법이거나 삭제조다
    add(k,true);
  }
  s.replace(/施規\s*(\d+)(?:의\s*(\d+))?/g,(m,a,b)=>{
    add('施規 '+a+(b?'의'+b:''),false);return m;});
  // 리담 짝에서 물려받은 근거조문 — 해설 파싱보다 이쪽이 정본이다
  (extra||[]).forEach(c=>{const k=joKeyOf(c);if(!JOKEY||JOKEY[k])add(k,true);});
  return out.slice(0,5);
}
/* ★ 조문은 뷰로 옮겨 가지 않고 **팝업**으로 띄운다(사용자 확정 8/26).
   `popJo` 는 볼트 본문을 그대로 렌더하고 머리에 「뷰로 이동」을 달아 준다. */
/* ══════ 법전 조판 (사진 실측 2026-08-26) ══════
   재료 = 볼트 원문 줄들. 계층은 이미 들여쓰기로 들어와 있다 — 항 0 · 호 2 · 목 4.
   한 줄 17전각 · 한 단 45줄 · 줄간격 1.3 · 호는 내어쓰기 2전각 · 개정 표기 0.82배.
   ⚠ 글자는 하나도 고치지 않는다. 【 】 로 보이는 것은 표시층 치환일 뿐이다. */
const JOCOLS = 17;     // 한 줄 글자 수 — 사진과 어긋나면 이 숫자 하나만 고친다
const JOROWS = 45;     // 한 단 줄 수
let JOEM = 0;
function joEm(){
  if (JOEM) return JOEM;
  const p = el('span', '', '가');
  p.style.cssText = 'position:absolute;visibility:hidden;line-height:1;'
    + "font-family:'Batang','BatangChe','Nanum Myeongjo',serif";
  document.body.appendChild(p);
  JOEM = p.getBoundingClientRect().width || 0;
  p.remove();
  return JOEM;
}
const JOREV = /(<(?:개정|신설|전문개정|본조신설)[^>]*>|\[[^\]]*(?:개정|신설)[^\]]*\]|\([^()]*(?:개정|신설)\))/g;
function joPiece(host, t){
  // 개정·신설 표기만 작게. 나머지 글자는 그대로 둔다.
  let i = 0, m;
  const re = new RegExp(JOREV.source, 'g');
  while ((m = re.exec(t))){
    if (m.index > i) host.appendChild(document.createTextNode(t.slice(i, m.index)));
    host.appendChild(el('span', 'bjrev', m[0]));
    i = m.index + m[0].length;
  }
  if (i < t.length) host.appendChild(document.createTextNode(t.slice(i)));
}
function beopjeon(host, lines){
  const L = (lines || []).map(String);
  const wrap = el('div', 'bjwrap');
  let n = 0;
  L.forEach((raw, ix) => {
    const lead = raw.length - raw.replace(/^\s+/, '').length;
    const t = raw.trim();
    if (!t) return;
    const d = el('div', 'bjline' + (lead >= 4 ? ' bjmok' : lead >= 2 ? ' bjho' : ''));
    if (ix === 0){
      // 조 제목 줄 — 다음 줄(항)을 이어 붙이고 제목만 굵게 한다
      const mt = t.match(/^(\S+조(?:의\d+)?)\s*\(([^)]*)\)\s*$/);
      if (mt){
        const b = el('b', 'bjti', mt[1] + '【' + mt[2] + '】');
        d.appendChild(b);
      } else {
        d.appendChild(el('b', 'bjti', t));
      }
      const nx = (L[1] || '').trim();
      if (nx && !/^\s{2}/.test(L[1] || '')){ joPiece(d, nx); L[1] = ''; }
    } else {
      joPiece(d, t);
    }
    wrap.appendChild(d);
    n += Math.max(1, Math.ceil(t.length / JOCOLS));
  });
  const em = joEm();
  if (em){
    const one = JOCOLS * em;
    if (n > JOROWS){
      wrap.style.width = (one * 2 + 1.4 * em) + 'px';
      wrap.style.height = (JOROWS * 1.3 * em) + 'px';
      wrap.style.columnCount = 2;
      wrap.style.columnFill = 'auto';
    } else {
      wrap.style.width = one + 'px';
    }
  }
  host.appendChild(wrap);
}

/* ★ gaek_mb §25 — 법제처 주소 꼴. 2026-09-21 Code 가 직접 열어 확인했다.

function omrTiles(stage, inner, META){
  const pg = S.omrPage;
  const eff = OMRV.s * (window.devicePixelRatio || 1);
  const dpi = eff <= 4.2 ? 300 : eff <= 8.4 ? 600 : 900;
  const tm = ((META.tiles || {})[String(pg)] || {})[String(dpi)];
  if (!tm) return;
  const sc = 72 / dpi, tpt = 1024 * sc;
  const vx0 = (-OMRV.x) / OMRV.s, vy0 = (-OMRV.y) / OMRV.s;
  const vx1 = vx0 + stage.clientWidth / OMRV.s, vy1 = vy0 + stage.clientHeight / OMRV.s;
  const c0 = Math.max(0, Math.floor(vx0 / tpt)), c1 = Math.min(tm.cols - 1, Math.floor(vx1 / tpt));
  const r0 = Math.max(0, Math.floor(vy0 / tpt)), r1 = Math.min(tm.rows - 1, Math.floor(vy1 / tpt));
  const want = {};
  for (let ty = r0; ty <= r1; ty++)
    for (let tx = c0; tx <= c1; tx++) want[dpi + '/' + tx + '_' + ty] = [tx, ty];
  [...inner.querySelectorAll('img.omrtile')].forEach(im => {
    if (!want[im.dataset.k]) im.remove(); else delete want[im.dataset.k];
  });
  Object.keys(want).forEach(k => {
    const tx = want[k][0], ty = want[k][1];
    const im = el('img', 'omrtile');
    im.dataset.k = k;
    im.src = DATA + 'omr/특허/t/' + pg + '/' + dpi + '/' + tx + '_' + ty + '.webp';
    im.style.left = (tx * tpt) + 'px'; im.style.top = (ty * tpt) + 'px';
    im.style.width = tpt + 'px';
    inner.insertBefore(im, inner.firstChild);
  });
}

  bar.appendChild(el('span', 'cdim', '휠=세로 · Ctrl+휠/핀치=확대 · 끌어 이동 · 핀 클릭=그 지문 카드'));
  main.appendChild(bar);
  const stage = el('div', 'omrstage');
  const inner = el('div', 'omrin');
  inner.style.width = PW + 'px'; inner.style.height = PH + 'px';
  stage.appendChild(inner); main.appendChild(stage);
  slot.appendChild(main);
  omrPins(inner, META, MAP);
  inkHost(inner, 'omr|특허|p' + pg);          // 필기 — 타일 좌표계에 붙는다(확대와 같이 움직임)
  if (OMRV.page !== pg || !OMRV.s){
    const fit = Math.min(stage.clientWidth / PW, stage.clientHeight / PH) || 1;
    OMRV = { s: fit, x: (stage.clientWidth - PW * fit) / 2, y: 4, page: pg };
  }
  if (OMRTGT){
    const s2 = OMRTGT.s || 5;
    OMRV = { s: s2, x: stage.clientWidth / 2 - OMRTGT.x * s2,
             y: stage.clientHeight / 2 - OMRTGT.y * s2, page: pg };
    OMRTGT = null;
  }
  const apply = () => {
    inner.style.transform = 'translate(' + OMRV.x + 'px,' + OMRV.y + 'px) scale(' + OMRV.s + ')';
    const eff = OMRV.s * (window.devicePixelRatio || 1);
    zi.textContent = Math.round(OMRV.s * 100) + '% · ' +
      (eff <= 4.2 ? 300 : eff <= 8.4 ? 600 : 900) + 'dpi';
    clearTimeout(apply._t);
    apply._t = setTimeout(() => omrTiles(stage, inner, META), 90);
  };
  const pts = {};
  let drag = null, pinch = null, moved = false;
  stage.addEventListener('pointerdown', ev => {
    if (S.ink && ev.pointerType === 'pen') return;   // 필기 중 펜은 캔버스 몫
    pts[ev.pointerId] = [ev.clientX, ev.clientY];
    const ids = Object.keys(pts);
    if (ids.length === 2){
      const a = pts[ids[0]], b = pts[ids[1]];
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; drag = null;
    } else {
      drag = { x: ev.clientX, y: ev.clientY, ox: OMRV.x, oy: OMRV.y };
    }
    moved = false;
    try{ stage.setPointerCapture(ev.pointerId); }catch(e){}
  });
  stage.addEventListener('pointermove', ev => {
    if (!(ev.pointerId in pts)) return;
    pts[ev.pointerId] = [ev.clientX, ev.clientY];
    const ids = Object.keys(pts);
    if (pinch && ids.length === 2){
      const a = pts[ids[0]], b = pts[ids[1]];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch.d > 0){
        const r = stage.getBoundingClientRect();
        const cx = (a[0] + b[0]) / 2 - r.left, cy = (a[1] + b[1]) / 2 - r.top;
        const ns = Math.min(14, Math.max(0.2, OMRV.s * d / pinch.d));
        const q = ns / OMRV.s;
        OMRV.x = cx - q * (cx - OMRV.x); OMRV.y = cy - q * (cy - OMRV.y); OMRV.s = ns;
        apply();
      }
      pinch.d = d; moved = true;
      return;
    }
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
    if (!moved) return;
    OMRV.x = drag.ox + dx; OMRV.y = drag.oy + dy;
    apply();
  });
  const up = ev => {
    delete pts[ev.pointerId];
    if (Object.keys(pts).length < 2) pinch = null;
    if (!Object.keys(pts).length) drag = null;
    setTimeout(() => { moved = false; }, 60);
  };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', ev => {
    ev.preventDefault();
    if (ev.ctrlKey){
      const r = stage.getBoundingClientRect();
      const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
      const ns = Math.min(14, Math.max(0.2, OMRV.s * (ev.deltaY < 0 ? 1.18 : 1 / 1.18)));
      const q = ns / OMRV.s;
      OMRV.x = cx - q * (cx - OMRV.x); OMRV.y = cy - q * (cy - OMRV.y); OMRV.s = ns;
    } else {
      OMRV.y -= ev.deltaY;
    }
    apply();
  }, { passive: false });
  stage.addEventListener('click', ev => {
    if (moved || !S.omrPick) return;
    if (ev.target.closest('.omrpin')) return;
    const ir = inner.getBoundingClientRect();
    const px = (ev.clientX - ir.left) / OMRV.s, py = (ev.clientY - ir.top) / OMRV.s;
    const key = S.omrPick.key;
    omPut('u' + Date.now().toString(36),
      { doc: '특허', page: pg, x: Math.round((px - 10) * 10) / 10,
        y: Math.round((py - 4) * 10) / 10, w: 130, h: 8,
        kind: '지문', ref: key, hash: META.hash });
    S.omrPick = null;
    toast('📍 위치를 찍었다 — ' + oxKeyDisp(key) + ' (↺ 핀 취소로 되돌린다)');
    render();
  });
  apply();
  setTimeout(apply, 0);
}

/* §B-7 단원 줄 — qlRow(8927) 와 **같은 값**을 민법 꼴로 그린다 */
function mbUnitRow(M, i, sel, label, keys, subj, flat, jn){
  const scope = 'mok|' + subj + '|' + sel;
  const rl = rndList(scope), rn = rl.length, total = keys.length;
  const done = keys.filter(k => (oxOf(k) || {}).p).length;
  const cards = keys.reduce((a, k) => a + mcCount(k), 0);
  keys.forEach(k => { MBK2M[k] = { sel: sel, label: label }; });
  const row = el('div', 'mbur' + (flat ? ' flat' : ''));
  const L = el('div', 'l');
  if (!flat) L.appendChild(el('span', 'ar', '›'));
  /* ★ add1 §D-3 — 제7판 차례에만 있는 마디는 옅은 노랑(옛 `qlRow` 판정·색 그대로) */
  L.appendChild(el('span', 'nm' + ((M && M[i] && M[i].출처 === '제7판') ? ' p7only' : ''), label));
  L.appendChild(el('span', 'tot', '총 ' + total + '문제'));
  /* ★ add2 §A-1 — 민법 차례는 「이름 · 총 N문제 · 🃏 N · 📋」다(민법 2391 주석 —
     묶음의 첫 행이면 🃏 **바로 오른쪽에** 📋). 2구간이 📋 을 앞에 두었던 것을 바로잡는다. */
  const nb = el('button', 'mbchip card', '🃏' + cards);   /* 민법은 0 도 숫자를 적고 흐리게 둔다 */
  nb.title = '이 단원의 암기카드';
  nb.style.opacity = cards ? '1' : '.55';
  nb.onclick = ev => { ev.stopPropagation(); mcChapOpen(label, keys, ev); };
  L.appendChild(nb);
  /* ★ add2 §B — 📋 은 **묶음마다 하나**다(민법 `jnKeyOf` 2244 — 소단원 앞 「N.N」).
     묶음 머리 줄에만 붙고, 누르면 묶음 전체가 한 창에 뜬다. */
  if (jn) L.appendChild(mbJnChip(jn));

    R.appendChild(el('span', 'mbchip run', '▶ ' + (rn + 1) + '회독 진행중 ' + done + '/' + total));
  }
  if (rn){

    bg.appendChild(document.createTextNode(r0.n + '회독 🌀' + r0.confuse + ' ⚠' +
      (r0.fake != null ? r0.fake : '–') + ' '));
    bg.appendChild(el('b', '', 'X' + r0.wrong));
    bg.appendChild(document.createTextNode(' /' + (r0.total != null ? r0.total : r0.done)));
    bg.title = '누르면 회독별 비교';
    bg.onclick = ev => { ev.stopPropagation(); rndPop(scope, keys, label, ev); };
    R.appendChild(bg);
  }
  if (total){
    let go;
    if (done > 0 && done < total){
      go = el('button', 'mbgo', '이어서');
      go.title = '이어서 풀기';
      go.onclick = ev => { ev.stopPropagation(); S.mok = sel; S.oxPage = null; render(); };

      go.title = (rn + 1) + '회독 시작';
      go.onclick = ev => { ev.stopPropagation(); S.mok = sel; S.oxPage = null; render(); };
    }
    R.appendChild(go);

    R.appendChild(el('span', 'mbchip run', '문항 없음'));
  }
  row.appendChild(R);
  row.onclick = () => { if (!total) return; S.mok = sel; S.oxPage = null; render(); };
  return row;

/* §B-7 과목 카드 › 장 › 단원 — 마디 깊이 1 = 과목 카드 · 2 = 장(자식이 있을 때) · 나머지 = 단원 */
function mbDash(main, MG, JM, byId, P7, subj){
  const dash = el('div', 'mbdash');
  if (!MG){ dash.appendChild(el('div', 'mbempty', '목차 없음 — 특허만 있다')); main.appendChild(dash); return; }
  const M = MG.마디, P7map = {};
  if (P7) P7.지문.forEach(z => P7map[z.id] = z);
  const kidOf = i => (i + 1 < M.length) && (M[i + 1].깊이 > M[i].깊이);
  const keyOf = i => mgKeys(M, i, byId, P7map);
  const labOf = i => ((M[i].no ? M[i].no + (M[i].깊이 === 1 ? '. ' : ' ') : '') + M[i].제목);
  /* ★ add2 §B-1 — 묶음 = 「N.N」 머리 마디와 그 아래 전부(민법 `jnKeyOf` 규칙).
     「N.N」 머리가 없으면 그 줄 하나가 한 묶음이다. 소제목 줄은 **지문이 있는 단원**만 센다.
     ⚠ 조판기 목차에는 민법 `JN_SUFFIX_RE`(`(7판신설)`·`(미수록)`·`(변형)`) 꼴 꼬리표 줄이
        없다(2026-09-21 전수 확인 — 보고 §다르게). 그래서 첫 줄 고르기 규칙은 안 옮겼다. */
  const GRP = {};
  {
    let cur = null;
    M.forEach((n, i) => {
      if (n.깊이 === 1){ cur = null; return; }
      const head = /^\d+\.\d+/.test(String(n.no || ''));
      if (head || !cur || n.깊이 <= cur.d){
        cur = { label: labOf(i), subs: [], d: n.깊이 };
        GRP[i] = cur;
      }
      const kk = keyOf(i);
      if (kk.length) cur.subs.push({ i: i, label: labOf(i), keys: kk });
    });
  }
  let card = null, chap = null, cardTot = 0, cardHd = null;
  const flush = () => { if (card){ if (cardHd) cardHd.textContent = '총 ' + cardTot + '문제';
    dash.appendChild(card); } card = null; chap = null; cardTot = 0; cardHd = null; };
  const rowInto = (i, flat) => {
    const keys = keyOf(i);
    cardTot += keys.length;
    const jn = (GRP[i] && GRP[i].subs.length) ? GRP[i] : null;
    const r = mbUnitRow(M, i, '__mg' + i, labOf(i), keys, subj, flat, jn);
    (chap || card).appendChild(r);
  };
  M.forEach((n, i) => {
    const d = n.깊이;
    if (d === 1){
      flush();
      card = el('div', 'mbsj');
      const hd = el('div', 'hd');
      const h2 = el('h2', '');
      h2.appendChild(el('b', '', n.no ? String(n.no) : ''));
      h2.appendChild(document.createTextNode(' ' + n.제목));
      cardHd = el('span', 'tot', '');
      h2.appendChild(cardHd);
      hd.appendChild(h2);
      card.appendChild(hd);
      return;
    }
    if (!card){ card = el('div', 'mbsj'); }
    if (d === 2 && kidOf(i)){
      chap = el('div', 'mbch');
      const hh = el('div', 'hh');
      hh.appendChild(el('span', 'nm' + (n.출처 === '제7판' ? ' p7only' : ''), labOf(i)));
      const tt = el('span', 'tot', '');
      hh.appendChild(tt);
      /* ★ add2 §B-1 — 「2.2」 처럼 머리 줄이 서 있으면 📋 은 **그 머리 줄**에 붙는다 */
      if (GRP[i] && GRP[i].subs.length) hh.appendChild(mbJnChip(GRP[i]));
      chap.appendChild(hh);
      card.appendChild(chap);
      /* 장 머리에도 제 지문이 있을 수 있다 — 있으면 줄로 같이 그린다 */
      const own = keyOf(i);
      let sub = 0;
      for (let j = i + 1; j < M.length && M[j].깊이 > d; j++) sub += keyOf(j).length;
      tt.textContent = '총 ' + (own.length + sub) + '문제';
      if (own.length){ cardTot += own.length;
        chap.appendChild(mbUnitRow(M, i, '__mg' + i, labOf(i), own, subj, false, null)); }
      return;
    }
    if (d === 2){ chap = el('div', 'mbch'); card.appendChild(chap); rowInto(i, true); chap = null; return; }
    if (!chap){ chap = el('div', 'mbch'); card.appendChild(chap); }
    rowInto(i, false);
  });
  flush();
  /* 미분류 — 옛 qlColumn 의 마지막 줄 그대로 */
  const placed = new Set();
  M.forEach(n => n.리담.forEach(x => placed.add(x)));
  const unk = [];
  JM.문제.filter(q => !placed.has(q.id))
        .forEach(q => (q.지문 || []).forEach(z => unk.push(oxKeyLid(q, z))));
  if (unk.length){
    const c2 = el('div', 'mbsj');
    const hd = el('div', 'hd');
    const h2 = el('h2', ''); h2.appendChild(document.createTextNode('미분류 (리담)'));
    const tt = el('span', 'tot', '총 ' + unk.length + '문제'); h2.appendChild(tt);
    hd.appendChild(h2); c2.appendChild(hd);
    const ch = el('div', 'mbch'); c2.appendChild(ch);
    ch.appendChild(mbUnitRow(M, 'un', '__미분류', '미분류 (리담)', unk, subj, true,
      { label: '미분류 (리담)', subs: [{ i: 'un', label: '미분류 (리담)', keys: unk }] }));
    dash.appendChild(c2);

  {const gi = mbGiCard(JM); if (gi) dash.appendChild(gi);}
  main.appendChild(dash);
}

/* ★ add2 §C-1 — 첫 화면 **맨 마지막** 과목 카드 「변리사 기출」(민법 2328~2346).
   줄 = 「YYYY년 제N회」 = 그 회차 전체가 한 단원 · 최신 연도부터.
   ⚠ 기출에는 **회독이 없다**(제출 이력뿐 · add2 §E 보고) — 회독 칩 자리에 제출 결과를 둔다. */
function mbGiGo(y){
  S.jimunTab = 'gichul'; S.year = String(y);
  S.omr = false; S.giWrong = false; S.omrCur = 0; S.mok = ''; S.oxQueue = '';
  render();
}
function mbGiRounds(JM){
  const by = {};
  (JM.문제 || []).forEach(q => {
    const k = String(q.연도) + '|' + String(q.회차 || '');
    (by[k] = by[k] || { y: String(q.연도), r: String(q.회차 || ''), n: 0 }).n++;
  });
  return Object.keys(by).sort().reverse().map(k => by[k]);
}
function mbGiCard(JM){
  const gs = mbGiRounds(JM);
  if (!gs.length) return null;
  const c = el('div', 'mbsj');
  const hd = el('div', 'hd');
  const h2 = el('h2', '');
  h2.appendChild(document.createTextNode('변리사 기출'));
  h2.appendChild(el('span', 'tot', '총 ' + gs.reduce((a, g) => a + g.n, 0) + '문제'));
  hd.appendChild(h2); c.appendChild(hd);
  const ch = el('div', 'mbch'); c.appendChild(ch);
  gs.forEach(g => {
    const row = el('div', 'mbur flat');
    const L = el('div', 'l');
    L.appendChild(el('span', 'nm', g.y + '년' + (g.r ? ' 제' + g.r + '회' : '')));
    L.appendChild(el('span', 'tot', '총 ' + g.n + '문제'));
    row.appendChild(L);
    const R = el('div', 'r');
    const yr = (typeof giYearOf === 'function') ? (giYearOf(g.y) || {}) : {};
    if (yr.sub) R.appendChild(el('span', 'mbchip rnd', '제출 ' + yr.right + '/' + yr.n));
    const go = el('button', 'mbgo', yr.sub ? '다시' : '풀기');
    go.title = yr.sub ? '이 회차를 다시 본다' : '이 회차를 푼다';
    go.onclick = ev => { ev.stopPropagation(); mbGiGo(g.y); };
    R.appendChild(go);
    row.appendChild(R);
    row.onclick = () => mbGiGo(g.y);
    ch.appendChild(row);
  });
  return c;
}

     `hmSetSubject` 9521)과 「접기 ▲」. 5상태 셈은 안 건드린다 — 칸 고르기만 한다. */
  const hm = el('div', 'mbhm');

                     : allCells;
    const hb = heatBox(pick);
    const hh = hb.querySelector('.hmhd');

        sc.appendChild(b);
      };
      mk('', '전체', null);

      legend.forEach(x => hh.appendChild(x));

    hm.appendChild(hb);
  }
  box.appendChild(hm);
  mbQuickRow(box, counts);
  mbDash(box, MG, JM, byId, P7, subj);
  main.appendChild(box);
}

/* ══════════ _task_jo_gaek_mb §A-2 — 목차 서랍 ══════════
   민법OX `#tree` 의 꼴·치수·동작을 그대로 옮긴다(머리 단추 · 줄 꼴 · 「지금」 · 막대 · 회독 칩 ·
   너비 끌기 · 접힘 · 장 접힘 기억). 첫 화면·문제풀이 화면 **둘 다**에 뜬다.
   기억 = `jopangi_ui`(기기별 · 동기화 밖) — `jt_w`·`jt_fold`·`jt_ch`.
   ⚠ 값은 `qlRow`·`mbUnitRow` 와 **같은 길**로 센다(mgKeys·rndList·oxOf) — 새 셈을 안 만든다. */
var JTDATA = null;      /* {M, byId, P7map, subj} — viewJimun 이 채운다 */

function jtSet(d){ JTDATA = d; }

function jtEl(){
  let t = document.getElementById('jtree');
  if (t) return t;
  const host = document.querySelector('.body2'), slot = document.getElementById('slot');
  if (!host || !slot) return null;
  t = el('div', ''); t.id = 'jtree';
  t.appendChild(el('div', 'jthead'));
  const ls = el('div', ''); ls.id = 'jtlist'; t.appendChild(ls);
  t.appendChild(el('div', 'jtfoot'));
  const g = el('div', '', '‹'); g.id = 'jtgrip';
  jtGripWire(g);
  t.appendChild(g);
  host.insertBefore(t, slot);
  return t;
}

/* 손잡이 — 조판기 handle(1284) 과 같은 장치. 탭 = 접기 · 끌기 = 너비 160~420 */
function jtGripWire(g){
  g.title = '누르면 접기 · 끌면 너비';
  let x0 = 0, w0 = 0, cur = 0;
  g.addEventListener('pointerdown', ev => {
    if (ev.button !== 0 && ev.pointerType === 'mouse') return;
    x0 = ev.clientX; w0 = cur = (S.jtW || 272); g._drag = false;
    try{ g.setPointerCapture(ev.pointerId); }catch(e){}
  });
  g.addEventListener('pointermove', ev => {
    if (!g.hasPointerCapture || !g.hasPointerCapture(ev.pointerId)) return;
    if (S.jtFold) return;
    const dx = ev.clientX - x0;
    if (!g._drag && Math.abs(dx) < 4) return;
    g._drag = true;
    cur = Math.max(160, Math.min(Math.min(420, innerWidth - 120), Math.round(w0 + dx)));
    document.documentElement.style.setProperty('--jtrw', cur + 'px');
  });
  const end = ev => {
    try{ g.releasePointerCapture(ev.pointerId); }catch(e){}
    if (!g._drag) return;
    S.jtW = cur; uiSave();
    setTimeout(() => { g._drag = false; }, 300);
  };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
  g.addEventListener('click', () => {
    if (g._drag){ g._drag = false; return; }
    S.jtFold = !S.jtFold; uiSave(); jtPaint();
  });
}

function jtStat(keys){
  const total = keys.length;
  const done = keys.filter(k => (oxOf(k) || {}).p).length;
  let bad = 0;
  keys.forEach(k => { const st = oxState(k); if (st === 3) bad++; });
  return { total: total, done: done, bad: bad };
}

/* 화면마다 다시 그린다 — render() 끝에서 부른다 */
function jtPaint(){
  /* ★ add2 §C-4 — 기출 탭에도 서랍이 뜬다(민법 서랍에 「변리사 기출」이 있다) */
  const on = (S.tab === 'jimun') && !!JTDATA;
  const t = document.getElementById('jtree') || (on ? jtEl() : null);
  if (!t) return;
  t.style.display = on ? '' : 'none';
  if (!on) return;
  document.documentElement.style.setProperty('--jtrw', (S.jtW || 272) + 'px');
  t.classList.toggle('fold', !!S.jtFold);
  const g = document.getElementById('jtgrip'); if (g) g.textContent = S.jtFold ? '›' : '‹';
  if (S.jtFold) return;

  const { M, byId, P7map, subj } = JTDATA;
  const hd = t.querySelector('.jthead'); hd.innerHTML = '';
  /* ★ add1 §D-1 — 「모두 접기」 대신 **층 돌림 단추**(지학 `lvStep` 규칙 그대로).
     누를 때마다 대목차 → 중목차 → 소단원 → 문제(다 폄) → 다시 대목차.
     단추 글자 = 지금 층 이름(지학 `lvLab(lvNow())`). 섞여 있으면 다음 누름이 맨 위 층. */
  const fold = el('button', '', JT_LAB[jtLvNow()] || '층');
  fold.title = '누를 때마다 한 층씩 — 지금은 「' + (JT_LAB[jtLvNow()] || '') + '」까지 펴져 있다';
  fold.onclick = () => jtLvStep();
  hd.appendChild(fold);
  /* ★ add1 §D-2 — 「지금」 **단추**는 걷는다(민법 서랍에 없다).
     줄에 붙는 「지금」 표식(`.jtit .now`)은 그대로 둔다. */

  const box = document.getElementById('jtlist'); box.innerHTML = '';
  const kidOf = i => (i + 1 < M.length) && (M[i + 1].깊이 > M[i].깊이);
  const labOf = i => ((M[i].no ? M[i].no + (M[i].깊이 === 1 ? '. ' : ' ') : '') + M[i].제목);
  const anc = [];
  M.forEach((n, i) => {
    while (anc.length && M[anc[anc.length - 1]].깊이 >= n.깊이) anc.pop();
    const hid = anc.some(a => S.jtCh && S.jtCh[a]);
    const kid = kidOf(i);
    anc.push(i);
    if (hid) return;
    const sel = '__mg' + i;
    const keys = mgKeys(M, i, byId, P7map);
    let sub = 0;
    for (let j = i + 1; j < M.length && M[j].깊이 > n.깊이; j++) sub += mgKeys(M, j, byId, P7map).length;
    if (kid){
      const r = el('div', 'jtch' + (n.깊이 >= 2 ? ' d2' : '') + (S.mok === sel ? ' cur' : ''));
      /* ★ add1 §D-3 — 볼트 목차에 없고 **제7판(홍기석) 차례에만** 있는 마디는 옅은 노랑.
         옛 `qlRow` 의 판정(`n.출처==='제7판'`)·색(`#d4b04a`) 그대로다 — 9구간이 그 열을
         걷으면서 같이 사라졌던 것을 서랍·첫 화면에 되살린다. */
      r.appendChild(el('span', n.출처 === '제7판' ? 'p7only' : '',
        (S.jtCh && S.jtCh[i] ? '▸ ' : '▾ ') + labOf(i)));
      r.appendChild(el('span', 'n', String(keys.length + sub)));
      r.onclick = () => { S.jtCh = S.jtCh || {};
        if (S.jtCh[i]) delete S.jtCh[i]; else S.jtCh[i] = 1; uiSave(); jtPaint(); };
      box.appendChild(r);
      if (!keys.length) return;
    }
    if (!keys.length && kid) return;
    const st = jtStat(keys);
    const it = el('div', 'jtit' + (S.mok === sel ? ' cur' : '') + (st.total ? '' : ' off'));
    it.style.paddingLeft = (20 + Math.max(0, n.깊이 - 2) * 8) + 'px';
    const l1 = el('div', 'l1');
    l1.appendChild(el('span', 'tx' + (n.출처 === '제7판' ? ' p7only' : ''), labOf(i)));
    l1.appendChild(el('span', 'n', String(st.total)));
    if (S.mok === sel) l1.appendChild(el('span', 'now', '지금'));
    it.appendChild(l1);
    if (st.total){
      const bar = el('div', 'jdbar');
      const iOk = el('i', ''); iOk.style.width = Math.round((st.done - st.bad) / st.total * 100) + '%';
      iOk.style.background = '#2E7D6F';
      const iBad = el('i', ''); iBad.style.width = Math.round(st.bad / st.total * 100) + '%';
      iBad.style.background = 'var(--rule)';
      bar.appendChild(iOk); bar.appendChild(iBad);
      it.appendChild(bar);
      const rl = rndList('mok|' + subj + '|' + sel);
      if (rl.length){
        const cs = el('div', 'jtchips');
        rl.forEach(r0 => {
          const tot = (r0.total != null ? r0.total : r0.done) || 1;
          const c = el('span', 'jtchip done' + (r0.wrong ? ' bad' : ''));
          const b = el('b', ''); b.style.width = Math.round((tot - r0.wrong) / tot * 100) + '%';
          c.appendChild(b);
          c.appendChild(el('span', '', String(r0.n)));
          c.title = r0.n + '회독 🌀' + r0.confuse + ' ⚠' + (r0.fake != null ? r0.fake : '–') +
                    ' X' + r0.wrong + ' /' + tot + ' — 누르면 회독별 비교';
          c.onclick = ev => { ev.stopPropagation(); rndPop('mok|' + subj + '|' + sel, keys, labOf(i), ev); };
          cs.appendChild(c);
        });
        it.appendChild(cs);
      }
      it.onclick = () => { S.mok = sel; S.oxPage = null; render(); };
    }
    box.appendChild(it);
  });
  /* 미분류 */
  const placed = new Set();
  M.forEach(n => n.리담.forEach(x => placed.add(x)));
  const unk = [];
  (JTDATA.qs || []).filter(q => !placed.has(q.id))
    .forEach(q => (q.지문 || []).forEach(z => unk.push(oxKeyLid(q, z))));
  if (unk.length){
    const it = el('div', 'jtit' + (S.mok === '__미분류' ? ' cur' : ''));
    const l1 = el('div', 'l1');
    l1.appendChild(el('span', 'tx', '미분류 (리담)'));
    l1.appendChild(el('span', 'n', String(unk.length)));
    if (S.mok === '__미분류') l1.appendChild(el('span', 'now', '지금'));
    it.appendChild(l1);
    it.onclick = () => { S.mok = '__미분류'; S.oxPage = null; render(); };
    box.appendChild(it);

function jtLvApply(lv){
  /* 지학 `lvApply` 와 같은 셈 — 그 층부터 아래로 다 접는다.
     `all` 은 차례의 맨 끝이라 어떤 층도 그보다 뒤에 오지 않는다 = 다 편다. */
  const K = jtLvKeys(), O = jtLvOrder(), s = {}, upto = O.indexOf(lv);
  O.slice(0, O.length - 1).forEach((d, x) => {
    (K[d] || []).forEach(i => { if (x >= upto) s[i] = 1; });
  });
  S.jtCh = s; uiSave();
}
function jtLvStep(){
  const O = jtLvOrder();
  jtLvApply(O[(O.indexOf(jtLvNow()) + 1) % O.length]);
  jtPaint();
}

  /* ★ add2 §C-2 — 「OX문제 / 기출문제」 두 칸 단추는 어디에도 안 그린다.

  /* ── 빠른 실행 큐 · 거르기 · 회독 · 히트맵 (2026-08-26) ──

  if (S.jimunTab === 'ox'){

    OXPOOL = {}; OXDOMPG = {};

  if(S.jimunTab==='ox'){

        if(M[j].깊이<=n.깊이)break;
        jos=jos.concat(M[j].지문); lids=lids.concat(M[j].리담);
      }
      jos=[...new Set(jos)]; lids=[...new Set(lids)];
      const P7map={};if(P7)P7.지문.forEach(z=>P7map[z.id]=z);
      const lidam=lids.map(id=>byId[id]).filter(Boolean);
      /* ★ 8/26 흡수 — 리담과 **같은 지문**인 제7판 행은 카드로 또 그리지 않는다.
         민법OX 와 같은 꼴이다: 한 행(=한 지문)에 기출 좌표를 실어 두고
         오지선다는 좌표로 묶어 그린다 — 선지를 다섯 벌 쌓아 두지 않는다.
         ⚠ 단 **그 리담 문항이 이 마디에 같이 걸려 있을 때만** 숨긴다.
            마디 배치는 리담·제7판이 따로라, 리담 쪽이 이 마디에 없으면
            숨기는 순간 그 지문이 화면에서 통째로 사라진다(실측 19건). */
      const _seen=new Set();
      lids.forEach(id=>{const q=byId[id];if(q)(q.지문||[]).forEach(z=>{if(z.uid)_seen.add(z.uid);});});

      /* ★ add1 §A-2 — 단원 설명 줄은 걷는다. 글자는 머리 단원 이름의 `title` 로 간다. */
      const BDTIP = bd.textContent;
      /* ★ v3-E §0 (8/27 사용자 확인) — 바닥 고정 바 폐기. 「📝 OMR」·「쪽·마킹」은 히트맵 줄로,
         「✅ 이 페이지 채점」은 마지막 카드 아래 한 번(다 채점되면 사라진다).
         「🏆 N+1회독 시작」은 화면에 안 둔다 — 가운데 열 하나로 충분하다. */
      const CARDS = mokCards(i);
      const PGN = 20, nPg = CARDS.length > PGN ? Math.ceil(CARDS.length / PGN) : 1;

      CARDS.forEach((c, ci) => { c.s = ci + 1; c.pg = nPg > 1 ? ((ci / PGN) | 0) : 0; OXDOMPG[c.dom] = c.pg; });
      const allCells = mokCells(CARDS);
      allCells.forEach(x => { x.pg = CARDS[x.s - 1].pg; });

      if (S.oxPage == null){

        S.oxPage = f ? f.pg : 0;
      }
      if (!(S.oxPage >= 0) || S.oxPage >= nPg) S.oxPage = 0;
      const scope2 = 'mok|' + subj + '|' + S.mok;
      const mokLabel = (n.no ? n.no + ' ' : '') + n.제목;
      const keysAll = allCells.map(x => x.k);
      const ctx = { scope: scope2, keys: keysAll, label: mokLabel };
      const pageCards = nPg > 1 ? CARDS.filter(c => c.pg === S.oxPage) : CARDS;
      const pgCells = allCells.filter(x => x.pg === S.oxPage);
      const unDone = pgCells.filter(x => oxAns(x.k, x.ans) && !((oxOf(x.k) || {}).p));
      const marked = unDone.filter(x => ((oxOf(x.k) || {}).m));

    sel = null; mounted = new Set(); built.forEach(pg => pg.remove());

    bar.querySelectorAll('#cvInkbar .t').forEach(b => { b.classList.toggle('on', b.dataset.t === INK.tool); b.onclick = () => { INK.tool = b.dataset.t; bar.querySelectorAll('#cvInkbar .t').forEach(x => x.classList.toggle('on', x === b)); }; });

    bindStage(); bindDocOnce(); paintBadges();
    if (VIEWED && vz > 0){ clampPan(); apply(); } else if (u.vz > 0){ vz = u.vz; vx = u.vx; vy = u.vy; clampPan(); apply(); } else fit();
    VIEWED = true;
    if (hq){ qI.value = hq; runQ(hq); }
  }
  /* 하네스·검산용 창구 — 앱 동작에는 안 쓰인다 */
  viewCanvas._cv = () => ({ D, META, MATCH, LOG, REPLAY, links, UNDO, INK, get vz(){ return vz; }, get vx(){ return vx; }, get vy(){ return vy; }, mounted, built, sel,
    set(v){ if (v.vz != null) vz = v.vz; if (v.vy != null) vy = v.vy; if (v.vx != null) vx = v.vx; clampPan(); apply(); }, apply, fit, minZ, gotoPage, jump, select, startEdit, commitEdit, undo, runQ, goHit, occOf, blockOp, openPop, toGeunge, drawConn, key, BK, applyOp, CVB, cvbMeta, cvbWords, cvbDoc, cvbPrint });

/* ══════════ 렌더 ══════════ */
let busy=false;
async function render(){
  if(busy)return;busy=true;
  /* ★ 스크롤 보존 (8/26) — slot 을 통째로 다시 그리므로 안 잡아 두면 누를 때마다 맨 위로 튄다.
     태그·O/X 가 「눌러도 아무 일 없다」로 보이던 원인이 이것이다. */
  const SCR={};
  ['main','tree','plist','qlwrap'].forEach(c=>{   // ★ 8/26 `qlist` 는 없는 클래스였다
    const n=document.querySelector('#slot .'+c);if(n)SCR[c]=n.scrollTop;});
  const scrBack=()=>Object.keys(SCR).forEach(c=>{
    if(c==='main'&&S.oxPageJump)return;   // ★ v3-C §6-2 — 쪽을 넘겼다: 맨 위에서 시작
    const n=document.querySelector('#slot .'+c);if(n)n.scrollTop=SCR[c];});
  inkReset();                       // 앞 화면의 ResizeObserver 를 끊는다
  {const f=document.getElementById('oxfab');if(f)f.remove();
   const p=document.getElementById('oxpill');if(p)p.remove();}  // ★ v3-D §5 · v3-F 알약 — 뷰마다 다시 단다
  // ⚠ body 에 건다 — 팝업(2차 셀 · 조문 팝업)이 #app 밖에 뜬다
  document.body.classList.toggle('inkon',!!S.ink);
  document.body.classList.toggle('stkon',!!S.stick);
  document.documentElement.style.setProperty('--trw',(S.treeW||212)+'px');   /* ★ v3-J §0-2 */
  document.documentElement.style.setProperty('--lsw',(S.listW||262)+'px');   /* ★ 판 4 §2-5 */
  drawTop();drawRail();inkBar();
  try{
    if(S.tab==='prec')await viewPrec();
    else if(S.tab==='cha2')await view2cha();
    else if(S.tab==='jimun')await viewJimun();
    else if(S.tab==='omr')await viewOmr();   // ★ v3-E §1-3
    else await viewJo();
  }catch(err){
    const slot=$('#slot');slot.innerHTML='';
    const m=el('div','main');m.appendChild(emptyBox('⚠','데이터를 읽지 못했다',String(err&&err.message||err)));
    slot.appendChild(m);console.error(err);
  }
  scrBack();setTimeout(scrBack,0);
  precScrollKick();   /* ★ 손질 9 — S.precScroll 깃발이 있으면 scrBack 뒤에 2단 그 줄을 가운데로 */
  setTimeout(()=>{S.oxPageJump=false;},0);   // 다음 render 부터는 다시 보존
  /* ★ v3-F §0 — 떠 있는 지문 팝업을 본 화면과 같은 상태로 다시 그린다(같은 sid 기록 공유) */
  CARDPOPS=CARDPOPS.filter(p=>p.body&&p.body.isConnected);
  CARDPOPS.forEach(p=>{try{p.paint();}catch(e){}});
  jtPaint();   /* ★ gaek_mb §A-2 — 서랍은 첫 화면·문제풀이 화면 둘 다에 뜬다 */
  busy=false;
}
/* ★ hrail(9/22) §A-5 — 폭·배지 글자·탭 수가 바뀌면 머리 첫 줄을 다시 잰다(알림 안에서 안 옮기고 다음 틀에) */
addEventListener('resize',hdrFit);

// 폭이 바뀌면 법전 조판의 단 수를 다시 잡는다. ⚠ 한 행 글자 수는 그대로다 — 단만 준다.

/* ★ 2차 기출 폴더 판(9/4 · _task_jo_2cha_gichul_folder.md §4-2) — 기록 키 1회 이사(멱등 · 옛 키는 둔다 · jopangi.migr 표시)
   표 = ⚙ 2cha_이름표.json(옛 stem → 새 stem) · 포스트잇 card|사례|<옛>␟… → card|기출|<새>␟… · 필기 cell|<옛> → cell|<새> · 마크업 card|사례|<옛>… 도 같은 규칙
   채점은 ⚙ JSON(card|기출|<새>) 이라 이사할 것이 없다 · 동기화 기록(기록.json)은 이 로컬 키가 다음 동기화에 실린다 */
const MIGR_KEY = REC_PRE + 'migr';
async function c2Migrate(){
  let done = {}; try{ done = lsRead(MIGR_KEY) || {}; }catch(e){}
  if (done.gichul2) return done.gichul2;
  let T = null; try{ T = await get('2cha_이름표.json'); }catch(e){ return null; }
  const mp = (T && T['옛→새']) || {}; const olds = Object.keys(mp); if (!olds.length) return null;
  const moved = {};
  const mv = (store, label, mk) => { let A; try{ A = lsRead(store) || {}; }catch(e){ return 0; } let n = 0;
    Object.keys(A).forEach(k => { for (const o of olds){ const pr = mk(o, mp[o]); if (!pr) continue; const [p1, p2] = pr;
      if (k === p1 || k.indexOf(p1 + SEP) === 0 || (p1.slice(-1) === SEP && k.indexOf(p1) === 0)){ const nk = p2 + k.slice(p1.length); if (A[nk] === undefined){ A[nk] = (A[k] && typeof A[k] === 'object' && !Array.isArray(A[k])) ? Object.assign({}, A[k], { mig: 'gichul2' }) : A[k]; n++; } break; } } });
    if (n) lsWrite(store, A, label); moved[store] = n; return n; };
  mv(PIT_KEY, '🗒 포스트잇', (o, nw) => ['card|사례|' + o + SEP, 'card|기출|' + nw + SEP]);
  mv(MK_KEY, '마크업 스티커', (o, nw) => ['card|사례|' + o + SEP, 'card|기출|' + nw + SEP]);
  mv(INK_KEY, '필기', (o, nw) => ['cell|' + o, 'cell|' + nw]);
  const total = Object.values(moved).reduce((a, b) => a + b, 0);
  done.gichul2 = { at: nowIso(), n: total, moved: moved, rows: olds.length };
  try{ lsWrite(MIGR_KEY, done, '기록 키 이사'); }catch(e){}
  if (total) toast('2차 기출 폴더 이사 — 기록 ' + total + '건의 키를 새 카드로 옮겼다(옛 키는 남긴다)');
  return done.gichul2;
}
setTimeout(() => { c2Migrate().catch(e => console.warn('[migr]', e)); }, 1200);
