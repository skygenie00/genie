<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조판기 v0</title>
<style>
/* ══ 목업 v2~v5 공통 팔레트 그대로 ══ */
:root{
  --ink:#1a1a1a; --sub:#6b675f; --line:#e3e0d8; --paper:#fdfcf9; --panel:#f6f4ef;
  --rule:#D93B3B;   /* 원칙·강행 */
  --exc:#2F6FD0;    /* 예외·단서 */
  --lbl:#c96a10;    /* 조문 라벨 */
  --hl-y:#ffe9a0; --hl-p:#ffd0e0;
  --ok:#1d7a3e; --warn:#b06000; --post:#fff3b0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#efede7;color:var(--ink);overflow:hidden;
  font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:13.5px;line-height:1.62}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{display:flex;flex-direction:column;height:100vh;background:#fff}

/* ── 상단 ── */
.topbar{display:flex;align-items:center;gap:8px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;flex-wrap:wrap}
.logo{font-weight:800;font-size:14px;white-space:nowrap}
.search{flex:1;min-width:150px;display:flex;gap:7px;align-items:center;cursor:text;
  background:#fff;border:1px solid #d9d6ce;border-radius:9px;padding:5px 11px;color:#999}
.tab{border-radius:7px;padding:3px 10px;background:#e9e6df;color:#555;font-size:12.5px}
.tab.on{background:var(--exc);color:#fff}
.pill{border-radius:8px;padding:2px 10px;font-size:12px;background:#e9e6df;color:#555}
.pill.on{background:#1a1a1a;color:#fff}
.pill.wait{color:#aaa;background:#f2f0ea}
.badge{font-size:11px;border-radius:6px;padding:1px 7px;background:#efece5;color:#777}

/* ── 본문 3단 ── */
.body2{display:flex;flex:1;min-height:0}
.rail{width:40px;flex-shrink:0;background:#eceae3;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;font-size:11px}
.rail .rb{writing-mode:vertical-rl;padding:9px 4px;border-radius:7px;color:#777;white-space:nowrap}
.rail .rb b{font-size:10px}
.rail .rb.on{background:var(--exc);color:#fff}
.rail .rb[disabled]{opacity:.45;cursor:not-allowed}
.handle{width:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--line);background:#f3f1ec;color:#a5a19a;cursor:pointer;font-size:12px}
.tree{width:var(--trw,212px);flex-shrink:0;border-right:1px solid var(--line);overflow:auto;
  background:var(--panel);padding:8px 0;font-size:12.5px}
.tree.hid{display:none}
.tree .h{padding:3px 13px;color:#9a958b;font-size:11px}
.tree .r{padding:5px 13px;display:flex;justify-content:space-between;gap:6px;align-items:center;cursor:pointer}
.tree .r:hover{background:#efece4}
.tree .r span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .r em{font-style:normal;color:#a5a19a;font-size:11px;display:inline-flex;gap:5px;align-items:center;flex-shrink:0}
.tree .r.on{background:#e8effb;border-left:3px solid var(--exc);padding-left:10px}
.tree .r.on span.nm{color:var(--exc);font-weight:700}
.tree .r.on em{color:var(--exc)}
.legend{padding:5px 13px;border-top:1px dashed #ddd;margin-top:6px;font-size:10.5px;color:#9a958b;line-height:1.7}
.bars{display:inline-flex;gap:2px}
.bars i{width:9px;height:5px;border-radius:2px;display:inline-block}
.bx{background:#d6d3cb}
.main{flex:1;padding:15px 18px 90px;position:relative;min-width:0;overflow:auto}

/* ── 조문 머리 (리담 구조) ── */
.jt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.jt b{font-size:16.5px}
.jt b .sub{font-weight:400;color:#777}
.jotitle{font-size:25px;font-weight:800;margin:6px 0 2px;line-height:1.3}
.jotitle .no{color:var(--exc)}
.sihaeng{color:#9a958b;font-size:12px;margin-bottom:9px}
.conn{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.conn .k{color:#9a958b;font-size:11.5px;margin-right:3px}
/* 조문 안의 모드 바 — 빈칸은 갈래가 아니라 이 조문의 모드다 */
.modebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:11px;padding:7px 10px;background:var(--panel)}
.modebar .mode{border-radius:999px;padding:3px 13px}
.modebar .mode.on{background:var(--exc);border-color:var(--exc);color:#fff}
.modebar .mode .n{margin-left:5px;font-size:11px;opacity:.75}
.box{border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-top:10px;background:var(--paper)}
.boxh{font-size:11px;color:#9a958b;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fold{border-style:dashed;background:#fafaf8;color:#77736b;cursor:pointer}
.fold .oi{float:right;color:var(--exc);text-decoration:underline;font-size:11.5px}
/* ── 원문 = 법전 조판 (§2) ──
   ⚠ 글자 크기를 사용자가 바꿀 수 없다. 필기(§4)가 이 고정에 기대고 있다. */
.origbody{color:#3a3a3a;margin-top:8px;border-top:1px dashed #ddd;padding-top:10px;
  overflow-x:auto}
.bjpage{font-family:"Batang","BatangChe","AppleMyungjo","Nanum Myeongjo","Noto Serif KR",serif;
  font-size:15px;line-height:1.78;text-align:justify;
  word-break:break-all;overflow-wrap:anywhere;hyphens:none;margin:0 auto}
.bjpage .bj{margin:0}
.bjpage .bj-head{font-weight:800;margin-bottom:.1em}
.bjpage .bj-jang{text-align:center;font-weight:800;margin:.4em 0}
.bjpage .bj-hang{margin-top:.15em}
.bjpage .bj-ho{padding-left:1.7em;text-indent:-1.7em}
.bjpage .bj-mok{padding-left:3.3em;text-indent:-1.7em}
.bjpage .bj-note{color:#77736b}
.bjnote{font-size:11px;color:#a5a19a;margin-top:8px}
.ln{margin:3px 0;white-space:pre-wrap;word-break:break-word}
.ln.ho{padding-left:1.5em}
.ln.mok{padding-left:3em}
.ln.hang{margin-top:7px}
.ln.ref{color:#9a958b;font-size:12px;margin-top:9px}
.ln.tail{color:#8a867d;font-size:12.5px}
.ln.fd{color:#77736b;font-size:12.5px;padding-left:1em;border-left:2px solid #e6e3db;margin-left:2px}
.anchor{color:#c9c5bc;font-size:10px;margin-left:5px}
mark.y{background:var(--hl-y)} mark.p{background:var(--hl-p)}
.joLink{color:var(--exc);font-weight:600;background:#eaf1fb;border-radius:4px;
  padding:0 4px;text-decoration:underline dotted;white-space:nowrap;cursor:pointer}
.joLink.dead{color:#8a867d;background:#f2f0ea;cursor:default}
.lbl{color:var(--lbl);background:#fdf1e3;border-radius:4px;padding:0 4px;
  font-size:11.5px;font-weight:600;white-space:nowrap;cursor:pointer;margin-left:2px}
.lbl.off{color:#c9c5bc;background:#f2f0ea;font-weight:400;padding:0 5px}
sup.fn{color:var(--rule);font-size:10px;cursor:pointer;text-decoration:underline dotted}
.embed{display:inline-block;background:#f2f0ea;border:1px dashed #d9d6ce;border-radius:5px;
  padding:0 6px;color:#8a867d;font-size:11.5px}
.chip{display:inline-block;border-radius:14px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0}
.c-prec{background:#eaf1fb;color:var(--exc)}
.c-quiz{background:#e9f7ee;color:var(--ok)}
.c-theme{background:#f3ecfd;color:#7a3ed0}
.c-card{background:#fff2e0;color:var(--warn)}
.c-warn{background:#fde9e9;color:var(--rule)}
.c-src{background:#efece5;color:#777}
/* ★ 판 3 (2026-09-02) — 전합 배지 · ★ 내 중요도 · 1단 거르기 트리 · 2단 검색 적중 · 3단 인용 자리 */
.badge.jh{border:1px solid var(--rule);color:var(--rule);background:#fff4f4;font-weight:700}
.badge.imp{color:#b8860b;background:#fff8e1}
.stars{display:inline-flex;gap:1px;font-size:16px;cursor:pointer;user-select:none;line-height:1}
.stars span{color:#d9d6ce} .stars span.on{color:#e0a800}
.tree .r.ftog{background:#f3f1ea;font-weight:700;color:#4a463f}
.tree .r.fitem{padding-left:20px;font-size:11.5px}
.tree .r.fitem.on{background:#e8effb;border-left:3px solid var(--exc);padding-left:17px}
.tree .r.fitem.zero{color:#c2beb6}
.tree .r.fitem.fhead{font-weight:700;color:#6b675f;background:#faf8f3}
.tree .r.fitem.fsub{padding-left:30px}
.tree .r.fitem.fsub.on{padding-left:27px}
.tree input.fq{margin:4px 13px;width:calc(100% - 26px);box-sizing:border-box;font:inherit;font-size:11.5px;padding:2px 6px;border:1px solid #d9d6ce;border-radius:6px}
input.pq{font:inherit;font-size:12px;padding:2px 7px;border:1px solid #d9d6ce;border-radius:7px;flex:1;min-width:90px}
.prow .ctx{font-size:11px;color:#6b665d;margin-top:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ctx:hover{color:var(--exc)}
.prow .ctx b{color:var(--rule)}
mark.cj{background:#fff3a3;outline:2px solid #e0a800}
/* ★ recsync (2026-09-02) — 동기화 칩 · ✎ 수정 큐 */
#syncChip.ok{background:#e9f7ee;color:var(--ok)} #syncChip.busy{background:#eaf1fb;color:var(--exc)}
#syncChip.off{background:#f2f0ea;color:#9a958b} #syncChip.bad{background:#fde9e9;color:var(--rule)}
#eqBtn.has{background:#fff2e0;color:var(--warn)}
.eqflag{position:absolute;right:12px;width:9px;height:11px;background:#ffb347;border:1px solid #d98a1c;border-radius:50%;cursor:pointer}
.pitmenu .mi{display:block;padding:2px 0} .pitmenu .mi+.mi{border-top:1px dashed #e6e3db}
.eqrow{padding:6px 9px;border:1px solid #eeece6;border-radius:8px;margin-bottom:5px;font-size:12px;cursor:pointer}
.eqrow:hover{background:#faf8f3} .eqrow .eqk{color:#9a958b;font-size:10.5px} .eqrow .eqn{margin-top:2px;white-space:pre-wrap}
.eqrow.st보류{opacity:.7} .eqrow.st반영됨{opacity:.5;text-decoration:line-through}
.eqform textarea{width:100%;box-sizing:border-box;min-height:70px;font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid #d9d6ce;border-radius:7px}
.eqform .q{font-size:11.5px;color:#6b665d;background:#faf8f3;border-radius:6px;padding:4px 7px;margin:4px 0;white-space:pre-wrap}
/* ★ 판 4 add1 — 줄 직접 고치기 · 겹층 · 큐 diff */
.eqedit{margin:2px 0} .eqta{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;line-height:1.5;padding:4px 6px;border:1px solid #d98a1c;border-radius:6px;min-height:44px}
.eqov{white-space:pre-wrap} .badge.eqpend{background:#fff2e0;color:var(--warn);font-size:10px;margin-left:6px;vertical-align:middle}
.ln.eqlocked{background:#fffaf0} .eqflag.stale{background:#f2ecd8;border-style:dashed} .eqflag.done{opacity:.35}
.eqrow .bf{color:var(--rule);text-decoration:line-through;white-space:pre-wrap;font-size:11.5px} .eqrow .af{color:var(--ok);white-space:pre-wrap;font-size:12px}
/* ★ 판 3 add1 — 리담 화면 그대로: 노란 별칭 칩 · 설명줄(안 자름) · 기출 칩 */
.chip.c-alias{background:#fde68a;color:#5b4300;font-weight:700}
.chip.c-gi{background:#eaf1fb;color:var(--exc);font-size:11px;padding:1px 8px}
.badge.ty{background:#f3ecfd;color:#7a3ed0}
.prow .iss.full{white-space:pre-wrap;word-break:break-word;margin:2px 0 3px}
.pdesc{margin-top:6px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.pdesc .row{margin-top:3px}

/* ── 빈 상태 ── */
.empty{color:#9a958b;text-align:center;padding:52px 20px;font-size:12.8px}
.empty .big{font-size:30px;opacity:.4;display:block;margin-bottom:8px}

/* ── 판례 ── */
.plist{width:var(--lsw,262px);flex-shrink:0;border-right:1px solid var(--line);overflow:auto}
/* ★ 판 4 (2026-09-02) — md 렌더(글자 수 불변) · 목차노트 팝업 · 연도 묶음 · 요약본 목차 팝업 */
/* ★ 판 4 add2 — 옵시디언 읽기 화면처럼: `#`·`**` 표식은 숨기되 글자 수·textContent 는 그대로(폭 0 · 글자 0) · ^id 는 흐린 작은 글씨 */
.mdhash,.mdmark{display:inline-block;width:0;font-size:0;overflow:hidden;opacity:0}
.blockid{opacity:.4;font-size:10px;margin-left:4px}
.ln.mdh1{font-size:17px;font-weight:800;margin:12px 0 4px} .ln.mdh2{font-size:15px;font-weight:700;margin:9px 0 3px} .ln.mdh3{font-size:13.5px;font-weight:700;margin:7px 0 2px}
.htog{color:#b5b1a8;font-size:11px;cursor:pointer;margin-right:5px;user-select:none;display:inline-block;width:12px} .htog:hover{color:var(--exc)}
.mdhid{display:none !important}
.embx{display:block;border-left:3px solid #cfcbc2;background:#faf8f3;border-radius:0 8px 8px 0;padding:6px 30px 6px 10px;margin:4px 0;position:relative;font-size:12.5px;white-space:normal}
.embx .emtools{position:absolute;right:6px;top:3px;display:flex;gap:5px} .embx .emtools span{cursor:pointer;color:#9a958b;font-size:11px} .embx .emtools span:hover{color:var(--exc)}
.embx .emhead{display:none;color:#9a958b;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .embx.fold .emhead{display:block} .embx.fold .embody{display:none}
.embx .ln{margin:1px 0}
.embed.dead{opacity:.5;cursor:default;border-style:dashed;color:#9a958b}
.vimg{display:block;margin:4px 0}.vimg .vimg-ph{display:inline-block;font-size:11px;color:#9a958b;background:#f6f5f1;border:1px dashed #d9d6ce;border-radius:5px;padding:2px 6px}
.vimg .vimg-img{max-width:100%;height:auto;border-radius:6px;border:1px solid #e6e3dc;cursor:zoom-in;background:#fafaf8}
.vimg-full{display:block;max-width:none}
a.mdlink{color:#1a5fb4;text-decoration:underline dotted;cursor:pointer}a.mdlink:visited{color:#1a5fb4}
.lkrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap} .lkrow .why{color:#6b675f;font-size:11.5px} .lkrow .tool{padding:1px 6px;font-size:11px}
.lkform input{width:100%;box-sizing:border-box;margin:3px 0} .lkform .res{cursor:pointer}   /* ★ 판 4 add4 §2·§4 */
.pop .prsz{position:sticky;bottom:0;display:block;width:16px;height:16px;margin:-16px 0 0 auto;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,#b5b1a8 55%);border-radius:0 0 9px 0;touch-action:none;z-index:2}
.pop.sized{max-height:none}
.ln.blkhl{background:#fff3a3;outline:2px solid #e0a800;border-radius:4px}
.ntrow .ln.blkhl{outline:none;border-radius:0;box-shadow:inset 3px 0 0 #e0a800}   /* ★ 판 4 add3 — 노트 팝업 강조 = 문단 전체(여러 줄이 한 덩이로) */
.ntrow{display:flex;gap:6px;align-items:flex-start} .ntrow .ln{flex:1;min-width:0} .ntbl{flex-shrink:0;display:flex;gap:3px;flex-wrap:wrap;max-width:46%;justify-content:flex-end}
.ntbl .chip{font-size:10.5px;padding:0 7px;margin:0;cursor:pointer}
.plink{color:var(--exc);text-decoration:underline dotted;cursor:pointer}
.embed.live{cursor:pointer;border-style:solid;color:var(--exc)}
.prow.ygh{background:#f3f1ea;font-weight:700;color:#4a463f;padding:5px 12px;cursor:pointer;display:flex;justify-content:space-between}
.prow.ygh em{font-style:normal;color:#9a958b;font-size:11px}
.prow .chip.c-src,.prow .chip.c-quiz.sumc{cursor:pointer}
.sumtoc .th{padding:3px 6px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:center} .sumtoc .th:hover{background:#faf8f3}
.sumtoc .th.l2{padding-left:20px} .sumtoc .th.l3{padding-left:36px;font-size:12px;color:#6b665d}
.sumtoc .tx{flex:1} .sumtoc .tg{color:#9a958b;width:14px;text-align:center}
.sumtoc .sec{padding:2px 6px 6px 26px;border-left:2px solid #eeece6;margin:2px 0 6px 8px}
.plist.hid{display:none}
.prow{padding:9px 12px;border-bottom:1px solid #eeece6;font-size:12.5px;cursor:pointer}
.prow:hover{background:#faf8f3}
.prow.on{background:#e8effb}
.prow .pn{font-weight:700}
.prow .iss{color:#444;margin:1px 0 3px}
.tool{border:1px solid #d9d6ce;border-radius:8px;padding:3px 11px;background:#fff;font-size:12.5px;color:#555}
.tool.on{border-color:var(--exc);background:var(--exc);color:#fff}
.tool.last{color:#999}
.tool[disabled]{color:#c2beb6;background:#f4f2ec;border-color:#e5e2da;cursor:not-allowed}
pre.raw{white-space:pre-wrap;font:12.8px/1.7 inherit;margin:0;color:#333}
.ctrlbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 12px;
  border-bottom:1px solid #eeece6;background:var(--panel)}
select.sel{font:inherit;font-size:12px;padding:2px 7px;border:1px solid #d9d6ce;border-radius:7px;background:#fff;color:#555}
select.sel[disabled]{color:#b5b1a8;background:#f4f2ec}

/* ── 2차 보드 ── */
.gwrap{overflow:auto;padding:12px 0}
.grid{display:grid;gap:6px}
.gh{font-size:11.5px;font-weight:700;color:#666;background:var(--panel);border-radius:7px;
  padding:4px 8px;text-align:center;position:sticky;top:0;z-index:2}
.gr{font-size:11.5px;font-weight:700;color:#666;background:var(--panel);border-radius:7px;
  padding:4px 8px;display:flex;align-items:center;justify-content:center;position:sticky;left:0;z-index:1}
.cell{border:1px solid var(--line);border-radius:9px;background:#fff;padding:6px 8px;
  font-size:11.5px;line-height:1.5;color:#333;cursor:pointer}
.cell:hover{border-color:var(--exc)}
.cell + .cell{margin-top:5px}
.cell b{font-size:11.5px}
.cell .t{color:#9a958b;font-size:10.5px}

/* ── 기출뷰 · OMR (과제 7 · 2026-08-26) ── */
.c-jo{background:#eaf1fb;color:var(--exc)}
.solx{margin:6px 0 2px}
.solx summary{font-size:11.5px;color:#7a6134;cursor:pointer}
.solb{font-size:12px;color:#6b665d;line-height:1.6;white-space:pre-wrap;margin-top:4px;
      border-left:2px solid #e3e0d8;padding-left:9px}

.gich.sel{border-color:#1a1a1a}

   `.qlnm` 이 228px 고정이라 그 오른쪽 선이 곧 경계다. 위아래로 꽉 채운다. */

<script>
"use strict";
const DATA='data/';
const LAWS=['특허법','상표법','디자인보호법','민사소송법'];
const SHORT={'특허법':'특허','상표법':'상표','디자인보호법':'디보','민사소송법':'민소'};
/* ★ 상표 판 3 (2026-09-03 · _task_sang_prec_app.md) — 판례 갤리 데이터 파일명은 S.law 로 짠다(특허 갤리 코드 그대로 · 상표 = 같은 꼴 JSON) */
const PLAW=()=>SHORT[S.law]||'특허';
const PF=n=>'prec_'+PLAW()+'_'+n+'.json', NF=()=>'note_'+PLAW()+'.json', JMF=()=>'jimun_'+PLAW()+'.json', CHF=k=>'2cha_본문_'+(k||'사례')+'_'+PLAW()+'.json';
const PREC_RAWDIR={특허:'특허판례원본',상표:'상표판례원본',디보:'디자인판례원본',민소:'민소판례원본'};
// 갈래 이동은 **세로 레일 하나만** 한다. 상단 갈래 탭은 없앴다 —
// 리담 실물이 그렇고(lidamuistructure.md §25) 레일과 3개가 겹쳤다. 8/23 사용자 결정.
const RAILS=[['jo','조문'],['prec','판례'],['jimun','1차객'],['cha2','2차'],
             ['omr','정리']];   // ★ v3-E §1-3 — 📖 정리(특허만)
// 정본 시행일 — 사양서 §2-1 정본 MST 표
const SIHAENG={'특허법':'2025-11-11','상표법':'2025-11-11',
               '디자인보호법':'2025-11-11','민사소송법':'2025-03-01'};

const C={};
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;

async function get(name){
  if(C[name])return C[name];
  const r=await fetch(DATA+name);
  if(!r.ok)throw new Error(name+' '+r.status);
  return C[name]=await r.json();
}

async function railCounts(){
  const set=(k,v)=>{const n=$(`[data-n="${k}"]`);if(n)n.textContent=v;};
  try{set('jo',(await get(`jo_${S.law}_목록.json`)).조.length);}catch(e){set('jo','–');}
  try{const p=await get('prec_과목.json');const m=p[SHORT[S.law]];set('prec',m?m.수:0);}catch(e){set('prec','–');}
  if(S.law==='민사소송법')set('jimun','—');
  else{try{
    // ★ 「문제」 = 정답을 넣을 수 있는 지문 하나(사용자 확정 8/26). 문항 묶음이 아니다.
    //    특허는 제7판 OX 지문 + 리담 전용 지문 — 짝이 붙은 리담 지문은 제7판 쪽에서 세므로 뺀다.
    const sh=SHORT[S.law], j=await get('jimun_'+sh+'.json');
    let n=0;
    (j.문제||[]).forEach(q=>(q.지문||[]).forEach(z=>{if(!(sh==='특허'&&z.병합))n++;}));
    if(sh==='특허'){try{const P=await get('jimun_7pan.json');
      n+=(P.지문||[]).filter(z=>z.ox==='O'||z.ox==='X').length;}catch(e){}}
    set('jimun',n.toLocaleString());
  }catch(e){set('jimun','—');}}
  try{const b=await get('2cha_보드.json');let n=0;
      Object.keys(b).forEach(k=>{if(k.endsWith('|'+SHORT[S.law]))n+=b[k].총||0;});
      set('cha2',n.toLocaleString());}catch(e){set('cha2','–');}
  if(S.law==='특허법'){
    try{set('omr',(await get('omr/특허/omr_meta.json')).pages.length+'쪽');}
    catch(e){set('omr','—');}
  }
}

/* ★ 두 칸은 한 컨테이너 안에 있으므로 「열을 숨긴다」가 아니라 「칸을 숨긴다」로 접는다.
   둘 다 접으면 컨테이너째 사라진다(8/26 사용자 요구 — 각각 닫히게). */
function qlHandle(which,label){
  const off=(which==='tree')?S.treeHid:S.listHid;
  const h=el('div','handle'+(off?'':' drg'),off?'›':'‹');
  h.title=label+' 칸 '+(off?'펴기':'접기')+(off?'':' · 끌면 너비');
  /* 끌었으면 뒤따르는 click 을 삼킨다 — 접기는 「안 끌고 뗀」 때만 */
  h.onclick=()=>{if(h._drag){h._drag=false;return;}
    if(which==='tree')S.treeHid=!S.treeHid;else S.listHid=!S.listHid;render();};
  if(off)return h;                                   // 접힌 칸은 끌 것이 없다
  /* ★ 끌어서 너비(8/26). 목차 손잡이 = 이름칸(--nmw) · 회독 손잡이 = 회독칸(--rdw).
     .qlbox 인라인 변수만 갈아 끼우므로 끄는 동안 render() 는 안 부른다. */
  const isNm=(which==='tree'), MIN=isNm?120:100, MAX=isNm?600:900;
  let x0=0,w0=0,cur=0;
  h.addEventListener('pointerdown',ev=>{
    if(ev.button!==0&&ev.pointerType==='mouse')return;
    x0=ev.clientX;w0=cur=isNm?S.qlNmW:S.qlRdW;h._drag=false;
    try{h.setPointerCapture(ev.pointerId);}catch(e){}
  });
  h.addEventListener('pointermove',ev=>{
    if(!h.hasPointerCapture||!h.hasPointerCapture(ev.pointerId))return;
    const dx=ev.clientX-x0;
    if(!h._drag&&Math.abs(dx)<4)return;
    h._drag=true;
    cur=Math.max(MIN,Math.min(MAX,Math.round(w0+dx)));
    const box=h.parentNode;if(!box)return;
    box.style.setProperty(isNm?'--nmw':'--rdw',cur+'px');
  });
  const end=ev=>{
    try{h.releasePointerCapture(ev.pointerId);}catch(e){}
    if(!h._drag)return;
    if(isNm)S.qlNmW=cur;else S.qlRdW=cur;
    uiSave();
    /* click 이 안 오는 경로(터치 취소 등)를 위해 잠깐 뒤 플래그를 내린다 */
    setTimeout(()=>{h._drag=false;},300);
  };
  h.addEventListener('pointerup',end);
  h.addEventListener('pointercancel',end);
  return h;
}
function handle(which){
  const off=(which==='tree'?S.treeHid:S.listHid);
  const h=el('div','handle',off?'›':'‹');
  h.title='접기/펴기'+(off?'':' · 끌면 너비');
  /* ★ v3-J §0-2 — 1차객 손잡이(qlHandle)와 같은 장치: 끌면 트리 너비 160~520px ·
     4px 미만이면 클릭=접기 · jopangi_ui.trw(법 무관 하나) · 접힌 상태에선 끌기 없음
     ★ 판 4 §2-5 — 2단(plist)도 같은 장치 · 200~600px · jopangi_ui.lsw */
  h.onclick=()=>{if(h._drag){h._drag=false;return;}
    if(which==='tree')S.treeHid=!S.treeHid;else S.listHid=!S.listHid;render();};
  if(off)return h;
  const isTree=which==='tree';
  const MIN=isTree?160:200,MAX=isTree?520:600,VAR=isTree?'--trw':'--lsw';
  let x0=0,w0=0,cur=0;
  h.addEventListener('pointerdown',ev=>{
    if(ev.button!==0&&ev.pointerType==='mouse')return;
    x0=ev.clientX;w0=cur=isTree?(S.treeW||212):(S.listW||262);h._drag=false;
    try{h.setPointerCapture(ev.pointerId);}catch(e){}
  });
  h.addEventListener('pointermove',ev=>{
    if(!h.hasPointerCapture||!h.hasPointerCapture(ev.pointerId))return;
    const dx=ev.clientX-x0;
    if(!h._drag&&Math.abs(dx)<4)return;
    h._drag=true;
    cur=Math.max(MIN,Math.min(MAX,Math.round(w0+dx)));
    document.documentElement.style.setProperty(VAR,cur+'px');
  });
  const end=ev=>{
    try{h.releasePointerCapture(ev.pointerId);}catch(e){}
    if(!h._drag)return;
    if(isTree)S.treeW=cur;else S.listW=cur;uiSave();
    setTimeout(()=>{h._drag=false;},300);
  };
  h.addEventListener('pointerup',end);
  h.addEventListener('pointercancel',end);
  return h;
}

/* ══════════ 줄 렌더 — 평문 좌표계 위에 요소를 겹친다 ══════════ */
let JOTITLE={};        // 조키 → 제목 (주황 라벨용)
let JOSEEN=null;       // ★ v3-J §0-2 — 이 조로 장 자동 펼침을 이미 했는가(조 바뀔 때 한 번만)
let THSCROLL=false;    // ★ v3-J §0-1 — 렌더 뒤 본문 아래 테마 줄로 스크롤할까
function renderLine(row,opt){
  opt=opt||{};
  const t=row.t||'', n=t.length;
  const opens=[],closes=[];
  const push=(a,i,v)=>{(a[i]=a[i]||[]).push(v);};
  // opt.m = 내 스티커 층을 덮어 계산한 마크업(§3-3). 없으면 JSON 것 그대로.
  (opt.m||row.m||[]).forEach(m=>{push(opens,Math.max(0,m.a),{mk:m});push(closes,Math.min(n,m.b),{mk:m});
    if(m.t==='tag'&&m.v){const rec=(mkAll()[m._k]||{});push(opens,Math.min(n,Math.max(0,m.a)+stkAt(rec,m)),{anc:m});}});   /* ★ 칩 자유이동 — 태그 칩 = 구간 안 at 자리의 폭 0 앵커(본문 흐름 밖) */
  (row.e||[]).forEach(e=>{if(e.k==='L'){push(opens,e.a,{ln:e});push(closes,e.b,{ln:e});}
    if(e.k==='P'){push(opens,e.a,{pl:e});push(closes,e.b,{pl:e});}});   /* ★ 판 4 — <사건번호> 인라인 링크 */
  /* ★ 판 4 §2-1 — md 꾸밈을 같은 좌표계 위에 얹는다(글자를 지우지 않는다 · 흐린 span 으로 감싼다) */
  if(opt.md!==false){
    const mh=/^(\s*#{1,6})(\s)/.exec(t);   /* ★ 판 4 add4 §1 — 4~6단은 본문 굵게만 */
    if(mh){push(opens,0,{md:'mdhash'});push(closes,mh[1].length,{md:'mdhash'});
      if(mh[1].trim().length>=4){push(opens,mh[0].length,{md:'mdbold'});push(closes,n,{md:'mdbold'});}}
    /* ★ 판 4 add4 §1 — <font color="…">…</font> 은 ** 와 같은 식(태그 구간 mdmark · 안 글자 그 색) · ![[…]] 원문 구간도 mdmark(칩·상자는 그대로) */
    {const rf=/<font\b[^>]*?color\s*=\s*["']?([^"'\s>]+)["']?[^>]*>|<\/font\s*>/gi;let fm,fopen=null;
     while((fm=rf.exec(t))){push(opens,fm.index,{md:'mdmark'});push(closes,fm.index+fm[0].length,{md:'mdmark'});
       if(fm[1]!=null)fopen={at:fm.index+fm[0].length,color:fm[1]};
       else if(fopen){if(fm.index>fopen.at){push(opens,fopen.at,{md:'mdcolor',color:fopen.color});push(closes,fm.index,{md:'mdcolor'});}fopen=null;}}
     (row.e||[]).forEach(e=>{if(e.k==='E'&&e.b>e.a){push(opens,e.a,{md:'mdmark'});push(closes,e.b,{md:'mdmark'});}
       if(e.k==='U'&&e.b>e.a){push(opens,e.a,{md:'mdmark'});push(closes,e.la,{md:'mdmark'});push(opens,e.la,{md:'mdlink',href:e.to});push(closes,e.lb,{md:'mdlink'});push(opens,e.lb,{md:'mdmark'});push(closes,e.b,{md:'mdmark'});}});}   /* ★ 상표 판 5 add1 §1b — 요약본 외부 그림·링크 */
    const mb=/\s*\^[0-9a-f]{6}\s*$/.exec(t);
    if(mb){push(opens,mb.index,{md:'blockid'});push(closes,n,{md:'blockid'});}
    let pos=t.indexOf('**');
    while(pos>=0){const q=t.indexOf('**',pos+2);if(q<0)break;
      push(opens,pos,{md:'mdmark'});push(closes,pos+2,{md:'mdmark'});
      push(opens,pos+2,{md:'mdbold'});push(closes,q,{md:'mdbold'});
      push(opens,q,{md:'mdmark'});push(closes,q+2,{md:'mdmark'});pos=t.indexOf('**',q+2);}
  }
  const frag=document.createDocumentFragment();const ancN={};   /* ★ 칩 자유이동 — 같은 앵커 칩 수 */
  const stack=[frag];
  const top=()=>stack[stack.length-1];
  for(let i=0;i<=n;i++){
    (closes[i]||[]).forEach(c=>{
      if(stack.length>1)stack.pop();
      /* ★ v3-J §2-C — tag 가 닫히는 자리 뒤에 칩 「🏷 이름」. v = 사전 id 면 이름·색이
         사전을 따라간다(색을 바꾸면 전부 변경) · 옛 색 문자열 = 「이름 없는 태그」 ·
         빈 값(볼트 #태그 줄 자체)은 칩 없음. */
      if(false){   /* ★ 칩 자유이동 — 옛 인라인(뒤) 삽입 끔 — 앵커(o.anc)로 */

      else if(o.md){node=o.md==='mdbold'?el('strong'):el('span',o.md);if(o.md==='mdcolor'&&o.color)node.style.color=o.color;}   /* ★ 판 4 §2-1 · add4 색 */

        if(o.ln.j)node.onclick=ev=>{ev.stopPropagation();

/* ══ ★ v3-L — 빈칸 모드 엔진 ══
   재료 = blank_<법>.json(v3-K·K2 · 해례판/유시훈판 완성문 + 빈칸 좌표·정답·kind 초안).
   kind 확정 = kv jopangi.blanktag(키 = 법:조키:행:a · 값 kind|'none' · JSON 무수정).
   회독 = kv jopangi.blank(키 = 법:조키 · {n,r,pct,ts,modes}).
   ⚠ w 필드는 안 쓴다 — v3-K 의 w 는 「인용하는 조 수」다(8/27 보고). 중요도 = joPanelIdx
   (지문→조 색인)에서 그 조의 연결 지문 수 · 그 법 상위 1/3(§6-b · 0건 조는 중요 아님). */
// ⚠ 리터럴이다 — REC_PRE(기록층 절)는 이 블록보다 아래에 선언돼 여기서 쓰면 TDZ 로 죽는다.
//   값은 REC_PRE+'blank'/'blanktag' 규약 그대로(내보내기·기록 팝업이 접두로 줍는다).
const BLK_KEY = 'jopangi.blank';
const BLT_KEY = 'jopangi.blanktag';
let BLKREC = null, BLTREC = null, BLKD = {}, BKIMP = null, BKIMPLAW = null;
const BK_COLOR = { 내용: '#2563eb', 주체: '#7c3aed', 기간: '#059669' };   /* ★ v3-O §3 — 기간 = 초록(emerald-600 · 채점 O #16a34a 와 톤 분리) */
function blkAll(){ if (!BLKREC) BLKREC = lsRead(BLK_KEY); return BLKREC; }
function blkPut(k, rec){ const A = blkAll(); A[k] = rec; BLKREC = A; lsWrite(BLK_KEY, A, '✎ 빈칸 회독'); }
function bltAll(){ if (!BLTREC) BLTREC = lsRead(BLT_KEY); return BLTREC; }
function bltPut(k, v){ const A = bltAll();
  if (v) A[k] = { v: v, ts: nowIso() }; else delete A[k];
  BLTREC = A; lsWrite(BLT_KEY, A, '✎ 빈칸 태그'); }
async function blankData(law){
  const s = SHORT[law] || law;
  if (s in BLKD) return BLKD[s];
  try{ BLKD[s] = await get('blank_' + s + '.json'); }catch(e){ BLKD[s] = null; }
  return BLKD[s];
}
function bkKindOf(law, jo, ri, b){
  const t = bltAll()[law + ':' + jo + ':' + ri + ':' + b.a];
  return t ? t.v : b.kind;                        // 'none' = 빈칸 아님(확정)
}
function bkTagged(law, jo, ri, b){
  return !!bltAll()[law + ':' + jo + ':' + ri + ':' + b.a];
}
function bkNorm(s){ return String(s || '').replace(/[\s·ㆍ()（）.。]/g, ''); }
async function bkImportant(){
  if (BKIMP && BKIMPLAW === S.law) return BKIMP;
  BKIMPLAW = S.law; BKIMP = new Set();
  try{
    const JP = await joPanelIdx();
    const ns = Object.keys(JP)
      .map(k => [k, ((JP[k].L || []).length) + ((JP[k].P || []).length)])
      .filter(x => x[1] > 0).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
    ns.slice(0, Math.ceil(ns.length / 3)).forEach(x => BKIMP.add(x[0]));
  }catch(e){}
  return BKIMP;
}
function bkTagPop(law, jo, ri, b, ev){
  const _pk1=('fn')+'|'+('이 빈칸의 갈래 — 「' + String(b.ans || '').slice(0, 14) + '」'); if(popToggle(_pk1))return; const body=popShell('fn', '이 빈칸의 갈래 — 「' + String(b.ans || '').slice(0, 14) + '」', _pk1);   /* ★ 상표 손질 6 — 키 종류|제목 */

  showPop(ev);
}
async function bkBody(blk, bkJo, bkOn, base){
  const imp = await bkImportant();
  const isImp = imp.has(S.jo);
  const key = S.law + ':' + S.jo;
  const box = el('div', 'box');
  const bh = el('div', 'boxh');
  bh.appendChild(el('span', '', '✎ 빈칸 본문 = 해례판' + (bkJo.별 ? ' ' + '★'.repeat(bkJo.별) : '')));
  const rt = el('span', '');
  if (bkJo.어순다름) rt.appendChild(el('span', 'qb warn', '원문과 다름 · 해례판'));
  if (S.joBlankStar && !isImp) rt.appendChild(el('span', 'badge', '★ 중요 아님 — 밑줄만'));
  bh.appendChild(rt);
  box.appendChild(bh);
  const inputs = [];
  const kindCnt = {};
  const judge = inp => {
    const ok = bkNorm(inp.value) === bkNorm(inp.dataset.ans);
    inp.classList.remove('ok', 'bad', 'reveal');
    if (!inp.value){ upd(); return false; }
    inp.classList.add(ok ? 'ok' : 'bad');
    if (ok) inp.readOnly = true;
    upd();
    return ok;
  };
  // 컨트롤 줄(리담 그대로) — 수치 · 정답 보기 · 틀린 곳만 · 다시 · 채점
  const bar = el('div', 'bkbar');
  const cnt = el('span', '');
  bar.appendChild(el('span', 'cdim', '정답을 맞히면 초록 · Enter/Tab 다음'));
  bar.appendChild(cnt);
  const upd = () => {
    let a = 0, bd = 0;
    inputs.forEach(x => { if (x.classList.contains('ok')) a++;
                          else if (x.classList.contains('bad')) bd++; });
    const parts = bkOn.filter(k2 => kindCnt[k2]).map(k2 => k2 + ' ' + kindCnt[k2]);
    cnt.textContent = (parts.join(' + ') || '빈칸 0') + ' = ' + inputs.length +
      ' 중 맞음 ' + a + ' · 틀림 ' + bd + ' · 남음 ' + (inputs.length - a - bd);
  };
  let shown = false;
  const eye = el('button', 'tool', '👁 정답 모두 보기');
  eye.onclick = () => {
    shown = !shown;
    eye.textContent = shown ? '👁 정답 숨기기' : '👁 정답 모두 보기';
    inputs.forEach(x => {
      if (x.classList.contains('ok')) return;
      if (shown){ x.dataset.user = x.value; x.value = x.dataset.ans;
                  x.classList.add('reveal'); x.readOnly = true; }
      else { x.value = x.dataset.user || ''; x.classList.remove('reveal'); x.readOnly = false; }
    });
  };
  bar.appendChild(eye);
  const rw = el('button', 'tool', '⚠ 틀린 곳만 다시');
  rw.onclick = () => inputs.forEach(x => {
    if (x.classList.contains('bad')){ x.value = ''; x.classList.remove('bad'); } upd(); });
  bar.appendChild(rw);
  const rs = el('button', 'tool', '↻ 다시 풀기');
  rs.onclick = () => { inputs.forEach(x => { x.value = ''; x.readOnly = false;
    x.classList.remove('ok', 'bad', 'reveal'); delete x.dataset.user; });
    shown = false; eye.textContent = '👁 정답 모두 보기'; upd(); };
  bar.appendChild(rs);
  const sv = el('button', 'tool on', '✅ 이 조 채점 · 회독 저장');
  sv.onclick = () => {
    if (!inputs.length){ toast('뚫린 빈칸이 없다'); return; }
    let okN = 0;
    const pk = {};
    inputs.forEach(x => {
      const kk2 = x.dataset.kind || '내용';
      const hit = bkNorm(x.value) === bkNorm(x.dataset.ans);
      (pk[kk2] = pk[kk2] || [0, 0])[1]++;
      if (hit){ pk[kk2][0]++; okN++; }
    });
    const pko = {};
    Object.keys(pk).forEach(kk2 => { pko[kk2] = Math.round(100 * pk[kk2][0] / pk[kk2][1]); });
    const pct = Math.round(100 * okN / inputs.length);
    const r = pct >= 90 ? 'O' : pct >= 60 ? '△' : 'X';
    const n = ((blkAll()[key] || {}).n || 0) + 1;
    const prev = (blkAll()[key] || {}).pk || {};
    blkPut(key, { n: n, r: r, pct: pct, ts: nowIso(), modes: bkOn.slice(),
                  pk: Object.assign({}, prev, pko) });   /* ★ v3-M M12 — kind 별 마지막 결과 */
    const hb = document.getElementById('bkbadge');
    if (hb){ hb.textContent = '✎ 회독 ' + n + ' · ' + r; hb.style.display = ''; }
    toast('빈칸 회독 ' + n + ' 저장 — ' + r + ' (' + pct + '%)');
    // 저장 뒤 입력은 그대로 둔다(§3) — 다시 풀기는 ↻
  };
  bar.appendChild(sv);
  box.appendChild(bar);
  // 본문 — 해례판 줄 그대로(원문·정리부 이식 없음 · 사양서) · 켜진 kind 만 <input>
  bkJo.행.forEach((r, ri) => {
    const d = el('div', 'ln bkln');
    const t = String(r.t || '');
    const bs = (r.b || []).slice().sort((x, y) => x.a - y.a);
    let pos = 0;
    bs.forEach(b => {
      if (b.a > pos) d.appendChild(document.createTextNode(t.slice(pos, b.a)));
      pos = Math.max(pos, b.b);
      const kk = bkKindOf(S.law, S.jo, ri, b);
      if (kk === 'none'){ d.appendChild(document.createTextNode(String(b.ans || ''))); return; }
      const col = BK_COLOR[kk] || BK_COLOR.내용;
      const live = bkOn.indexOf(kk) >= 0 && (!S.joBlankStar || isImp);
      if (live){
        const inp = el('input', 'bkin');
        const ln = String(b.ans || '').length;
        inp.dataset.ans = b.ans;
        inp.dataset.kind = kk;   /* ★ v3-M M12 — kind 별 채점(pk) 재료 */
        inp.style.width = Math.max(3, ln) + 'em';
        inp.style.borderBottomColor = col;
        /* ★ v3-M M11 — 「N자」 힌트 폐지(빈 밑줄만 · 폭이 곧 힌트 · §6-e) */
        inp.addEventListener('keydown', ev => {
          if (ev.key === 'Enter' || ev.key === 'Tab'){
            ev.preventDefault();
            judge(inp);
            const i2 = inputs.indexOf(inp) + (ev.shiftKey ? -1 : 1);
            const nx = inputs[i2];
            if (nx) nx.focus();
          }
        });
        inp.addEventListener('blur', () => { if (inp.value && !inp.readOnly) judge(inp); });
        inp.addEventListener('input', () => {
          if (inp.classList.contains('bad')) inp.classList.remove('bad');
        });
        d.appendChild(inp);
        inputs.push(inp);
        kindCnt[kk] = (kindCnt[kk] || 0) + 1;
      }else{
        const u = el('span', 'bku', String(b.ans || ''));   // 꺼진 kind·중요 아님 = 색 밑줄만
        u.style.borderBottomColor = col;
        d.appendChild(u);
      }
      if (!bkTagged(S.law, S.jo, ri, b)){                   // 미확정 「?」 — 확정하면 사라진다
        const q = el('sup', 'bkq', '?');
        q.title = '자동 태깅 초안(' + kk + ') — 누르면 확정';
        q.onclick = ev => { ev.stopPropagation(); bkTagPop(S.law, S.jo, ri, b, ev); };
        d.appendChild(q);
      }
    });
    if (pos < t.length) d.appendChild(document.createTextNode(t.slice(pos)));
    box.appendChild(d);
  });
  upd();
  blk.appendChild(box);
}

/* ══════════ 팝업 ══════════ */
/* ══ 팝업 — 여러 개 · 끌어 옮기기 (목업 v3 「팝업은 여러 개, ≡ 로 끌고」)
   ⚠ 지시서 §3-E 는 「팝업 다중/드래그/고정」을 v0 제외로 뒀다.
      8/23 사용자 요구로 켰다. 고정(📌)은 아직 없다 — 다중·드래그만. */
let POPZ = 60, POPS = [];
function dragify(p, hd){
  let sx = 0, sy = 0, ox = 0, oy = 0, on = false;
  hd.addEventListener('mousedown', ev => {
    if (ev.target.closest('button')) return;
    on = true; sx = ev.clientX; sy = ev.clientY;
    ox = parseFloat(p.style.left) || 0; oy = parseFloat(p.style.top) || 0;
    p.style.zIndex = ++POPZ;
    ev.preventDefault();
  });
  addEventListener('mousemove', ev => {
    if (!on) return;
    p.style.left = Math.max(0, Math.min(innerWidth - 60, ox + ev.clientX - sx)) + 'px';
    p.style.top = Math.max(0, Math.min(innerHeight - 34, oy + ev.clientY - sy)) + 'px';
  });
  addEventListener('mouseup', () => { on = false; });
}
/* ★ 상표 손질 5 — 같은 키 팝업은 다시 열면 닫는다(토글) · 다른 키는 겹침 · 위치·크기 규칙 무접촉 */
function popToggle(key){ if (!key) return false; const q = POPS.find(x => x._pk === key); if (q){ closeOne(q); return true; } return false; }
function popShell(kind, title, key){
  const p = el('div', 'pop' + (kind ? ' k-' + kind : '')); p._pk = key || null;
  p.style.zIndex = ++POPZ;
  const hd = el('div', 'ph');
  hd.appendChild(el('span', 'pdrag', '≡'));
  hd.appendChild(el('span', 'pt', title));
  const x = el('button', '', '✕');
  x.onclick = ev => { ev.stopPropagation(); closeOne(p); };
  hd.appendChild(x);
  p.appendChild(hd);
  const body = el('div', 'pb');
  p.appendChild(body);
  document.body.appendChild(p);
  POPS.push(p);
  dragify(p, hd);
  p.addEventListener('mousedown', () => { p.style.zIndex = ++POPZ; });
  return body;
}
function closeOne(p){
  p.remove();
  POPS = POPS.filter(q => q !== p);
}
function closePop(){                    // 맨 위 하나만 닫는다
  if (POPS.length) closeOne(POPS[POPS.length - 1]);
}
function closeAllPops(){
  POPS.slice().forEach(closeOne);
}
function showPop(ev){
  const p = POPS[POPS.length - 1];
  if (!p) return;
  const w = p.offsetWidth || 440, h = p.offsetHeight || 260;
  // 여러 개를 띄우면 조금씩 어긋나게 쌓는다
  const k = (POPS.length - 1) % 6;
  let x = ev ? ev.clientX + 14 : innerWidth - w - 40;
  let y = ev ? ev.clientY + 14 : 110;
  x = Math.max(8, Math.min(x + k * 22, innerWidth - w - 8));
  y = Math.max(8, Math.min(y + k * 20, innerHeight - Math.min(h, 260) - 8));
  p.style.left = x + 'px';
  p.style.top = y + 'px';
}

/* ══════════ 알림 ══════════
   ⚠ `toast` 는 `popJo`·`popFoot` 과 똑같이 **정의가 없었다**(`memoSave` 가 부르기만 했다).
      §10 의 「쓰기가 실패하면 조용히 넘기지 마라」가 실제로는 안 돌고 있었다. */
function toast(msg, bad){
  const box = $('#toasts'); if (!box) return;
  const d = el('div', 'toast' + (bad ? ' bad' : ''), msg);
  box.appendChild(d);
  setTimeout(() => d.remove(), bad ? 4200 : 2400);
}

/* ══════════ 기록층 (§10) ══════════
   주소가 하나이므로 기록도 하나다(§0-3). 이름공간을 갈래별로 가른다.
   ⚠ 사파리는 한동안 안 들른 사이트의 localStorage 를 지운다 — 내보내기가 필수다. */
const REC_PRE = 'jopangi.';
const MK_KEY  = REC_PRE + 'markup';     // 마크업 스티커 삭제·편집·신규
const INK_KEY = REC_PRE + 'ink';        // 필기
const TS_PRE  = REC_PRE + 'ts.';        // 낡은 층(메모)용 갱신시각 짝
/* ★ 8/26 — 층 이름을 사람 말로. 팝업에 「ox · 2」 만 떠서 필기인지 풀이인지 알 수 없었다. */
const REC_NAMES = { ox:'1차객 풀이 (O/X · 헷갈림 · 태그)', rounds:'1차객 회독', ansfix:'정답 정정',
  mcard:'암기카드', gi:'기출 풀이 (오지선다)', 'gi.year':'기출 제출 이력',
  markup:'마크업 스티커 (형광펜·밑줄)', ink:'필기 (애플펜슬)',
  logic:'📐 논리', link:'🔗 지문 연결', type:'🏷 유형 확정', omr:'📖 정리 핀',
  sticker:'🏷 스티커 사전 (두문자·줄임말)',
  blank:'✎ 빈칸 회독 (O/△/X)', blanktag:'✎ 빈칸 태그 (kind 확정)',
  themefix:'⇄ 3법 대응 확정', precimp:'★ 판례 내 중요도', editq:'✎ 수정 큐 (볼트 고칠 자리)', preclink:'🔗 내가 이은 판례·2차' };   /* ★ 판 3 §9-2 · recsync §E · 판 4 add4 */
function recLabel(k){
  const t = k.slice(REC_PRE.length);
  if (REC_NAMES[t]) return REC_NAMES[t];
  if (t.indexOf('memo.') === 0) return '메모(옛 · 포스트잇으로 이사됨) · ' + t.slice(5);
  return t;
}
/* 층을 지우거나 들여온 뒤엔 메모리 캐시를 비워야 화면이 새 값을 본다 */
function recDropCache(){
  MKS = null; INK = null;
  if (typeof STKD !== 'undefined') STKD = null;   /* ★ v3-J §2-A */
  if (typeof BLKREC !== 'undefined') BLKREC = null;   /* ★ v3-L */
  if (typeof BLTREC !== 'undefined') BLTREC = null;
  if (typeof THFREC !== 'undefined') THFREC = null;   /* ★ v3-M */
  if (typeof LGREC !== 'undefined') LGREC = null;
  if (typeof LKREC !== 'undefined') LKREC = null;
  if (typeof TYREC !== 'undefined') TYREC = null;
  if (typeof OMREC !== 'undefined') OMREC = null;
  if (typeof OXREC  !== 'undefined') OXREC = null;
  if (typeof RNDREC !== 'undefined') RNDREC = null;
  if (typeof FIXREC !== 'undefined') FIXREC = null;
  if (typeof MCREC  !== 'undefined') MCREC = null;
  if (typeof GIREC  !== 'undefined') GIREC = null;
  if (typeof GIYREC !== 'undefined') GIYREC = null;
  if (typeof EQREC !== 'undefined') EQREC = null;   /* ★ recsync §E — 병합·강제 받기 뒤 큐 캐시 */
  if (typeof PLREC !== 'undefined') PLREC = null;   /* ★ 판 4 add4 — 내가 이은 판례·2차 */
}
function recDelete(k){
  try{ localStorage.removeItem(k); }catch(e){}
  try{ localStorage.removeItem(TS_PRE + k.slice(REC_PRE.length)); }catch(e){}   // 짝 맞춤표도
  recDropCache();
}
function nowIso(){ return new Date().toISOString(); }

/* ══════════ 1차객 풀이 기록 (§7 · §10 · 민법OX 이식 2026-08-26) ══════════
   단위 = 지문 하나에 O/X 하나. 키는 **JSON 이 실어 온 ID** 다 — 앱이 지어내지 않는다(D10).
     제7판 지문 → 8자 지문 ID(sid)  ·  리담 지문 → L:문항id#선지번호
   ★ 5상태 — 0 안품 · 1 맞음 · 2 헷갈림 · 3 틀림 · 4 덜약점(연노랑).
     사양서 §9-1 의 4상태에 덜약점을 하나 더했다(사용자 확정 8/26 · 민법OX 와 같은 규칙).
     헷갈림이 빠져나가는 길 = 약점에서 맞히면 덜약점 → 덜약점에서 또 맞히면 헷갈림 해제·졸업.
     틀리면 어느 자리에서든 약점으로 되돌아간다. */
const OX_KEY  = REC_PRE + 'ox';
const RND_KEY = REC_PRE + 'rounds';
const FIX_KEY = REC_PRE + 'ansfix';
let OXREC = null, RNDREC = null, FIXREC = null;
let OXPOOL = null, OXDOMPG = null;   // ★ v3-C — 키→{dom,ans} 표 · dom→쪽 표(§3·§6)
let VJ = null, OXOMR = null;         // ★ v3-D — 순번·경로 스냅샷(§0) · OMR 패드 상태(§1)
function oxAll(){ if (!OXREC) OXREC = lsRead(OX_KEY); return OXREC; }
function rndAll(){ if (!RNDREC) RNDREC = lsRead(RND_KEY); return RNDREC; }
function fixAll(){ if (!FIXREC) FIXREC = lsRead(FIX_KEY); return FIXREC; }
function oxKeyP7(z){ return z.uid || ('P7:' + z.id); }
/* ★ v정정 ③ (8/27) — 키 하나로 = uid. JSON 이 `sid` 대신 `uid` 를 싣는다.
   리담·제7판이 같은 지문이면 같은 uid 라 기록이 한 자리에 모인다.
   ⚠ 앱이 uid 를 지어내지 않는다 — 없으면 예전 키 그대로다(민법OX D10 함정). */
function oxKeyLid(q, z){ return z.uid || ('L:' + q.id + '#' + z.n); }
function oxOf(k){ return oxAll()[k] || null; }
function oxAns(k, raw){ const f = fixAll()[k]; return (f === 'O' || f === 'X') ? f : (raw || ''); }
function oxFixed(k){ const f = fixAll()[k]; return (f === 'O' || f === 'X') ? f : ''; }
function oxState(k){
  const r = oxOf(k);
  if (!r) return 0;
  if (r.p && !r.ok) return 3;
  if (r.sg === 'semi') return 4;
  if (r.c) return 2;
  if (r.ok) return 1;
  return 0;
}
function oxPut(k, patch){
  const A = oxAll(), cur = A[k] || {};
  A[k] = Object.assign({}, cur, patch, { ts: nowIso() });
  OXREC = A; lsWrite(OX_KEY, A, '1차객 풀이');
}
/* ★ v3-C §6-3 (8/26 밤) — 즉시 채점(oxPick) 폐기. 마킹(m)을 모아 한꺼번에 채점한다.
   cells = [{k, ans, dom}] — 그 페이지(또는 큐)의 지문들.
   큐 규칙(약점→덜약점→졸업 · sg 갱신)은 oxPick 에 있던 그대로 여기로 옮겨 왔다. */
function oxGrade(cells, ctx){
  const A = oxAll();
  const todo = cells.filter(c => oxAns(c.k, c.ans) && !((A[c.k] || {}).p));
  if (!todo.length){ toast('채점할 지문이 없다'); return; }
  const miss = todo.filter(c => !((A[c.k] || {}).m));
  if (miss.length){
    // 미응답이 있으면 채점하지 않는다 — 첫 미응답 카드로 데려간다(민법OX 이식)
    const box = document.getElementById(miss[0].dom);
    if (box){
      box.scrollIntoView({ block: 'center' });
      box.classList.add('oxmiss');
      setTimeout(() => box.classList.remove('oxmiss'), 1500);
    }
    toast('안 푼 지문 ' + miss.length + '개 — 붉은 칸을 먼저', 1);
    return;
  }
  let a = 0, b = 0, firstWrong = null;
  todo.forEach(c => {
    const cur = A[c.k] || {};
    const ok = (cur.m === oxAns(c.k, c.ans));
    const rec = Object.assign({}, cur, { p: cur.m, ok: ok, ts: nowIso() });
    delete rec.m;
    if (S.oxQueue === 'weak'){ rec.sg = (ok && cur.c) ? 'semi' : ''; }
    else if (S.oxQueue === 'semi'){ if (ok){ rec.c = false; rec.sg = ''; } else rec.sg = ''; }
    A[c.k] = rec;
    if (ok) a++; else { b++; if (!firstWrong) firstWrong = c.dom; }
  });
  OXREC = A; lsWrite(OX_KEY, A, '1차객 풀이');   // ⚠ 한 번에 고치고 한 번만 쓴다(§6-3 ③)
  render().then(() => setTimeout(() => {
    if (!firstWrong) return;
    const box = document.getElementById(firstWrong);
    if (box) box.scrollIntoView({ block: 'center' });
  }, 60));
  if (OXOMR) oxOmrPaint();                                  // 패드가 떠 있으면 결과로 갱신
  if (ctx) rsltPop(ctx.scope, ctx.keys, ctx.label, null);   // ★ v3-D §4 — 창이 결과다(toast 대체)
  else toast('채점 — 맞음 ' + a + ' · 틀림 ' + b);          // 큐 등 판 밖 채점
}

  const _pk37=('cell')+'|'+('📍 좌표기억 — ' + linkDisp(key)); if(popToggle(_pk37))return; const body=popShell('cell', '📍 좌표기억 — ' + linkDisp(key), _pk37);   /* ★ 상표 손질 6 — 키 종류|제목 */

  /* ★ 8/27 사용자 — 정리 탭으로 안 가도 팝업 안에서 확대한다.
     PC = Ctrl+휠(커서 기준) · 휠 = 세로 · 끌기 = 이동 · 터치 = 핀치/끌기 · 더블클릭 = 원래 크기.
     확대에 맞춰 타일 단(300/600/900dpi)을 갈아끼우고 보이는 타일만 fetch 한다(정리 뷰어와 같은 수). */
  let page = info.pin.page;
  const box = el('div', 'omini');
  const inner = el('div', 'ominiin');
  box.appendChild(inner);
  body.appendChild(box);
  body.appendChild(el('div', 'cdim',
    'Ctrl+휠 · 핀치 = 확대 (커서·손가락 기준) · 휠 = 세로 · 끌어 이동 · 두 번 누르면 원래 크기'));
  const nav = el('div', 'memobtn');
  const BOXW = 400;
  const V = { s: 0, x: 0, y: 0 };
  const fitOf = () => BOXW / OMRMETA2.pages[page - 1].w;
  const clampV = () => {
    const pg = OMRMETA2.pages[page - 1];
    const fit = fitOf();
    if (V.s <= fit + 0.0001){ V.s = fit; V.x = 0; V.y = 0; return; }
    V.x = Math.min(0, Math.max(V.x, box.clientWidth - pg.w * V.s));
    V.y = Math.min(0, Math.max(V.y, box.clientHeight - pg.h * V.s));
  };
  const tilesPaint = () => {
    const eff = V.s * (window.devicePixelRatio || 1);
    const dpi = eff <= 4.2 ? 300 : eff <= 8.4 ? 600 : 900;
    const tm = ((OMRMETA2.tiles || {})[String(page)] || {})[String(dpi)];
    if (!tm) return;
    const sc = 72 / dpi, tpt = 1024 * sc;
    const vx0 = (-V.x) / V.s, vy0 = (-V.y) / V.s;
    const vx1 = vx0 + box.clientWidth / V.s, vy1 = vy0 + box.clientHeight / V.s;
    const c0 = Math.max(0, Math.floor(vx0 / tpt)), c1 = Math.min(tm.cols - 1, Math.floor(vx1 / tpt));
    const r0 = Math.max(0, Math.floor(vy0 / tpt)), r1 = Math.min(tm.rows - 1, Math.floor(vy1 / tpt));
    const want = {};
    for (let ty = r0; ty <= r1; ty++)
      for (let tx = c0; tx <= c1; tx++) want[dpi + '/' + tx + '_' + ty] = [tx, ty];
    [...inner.querySelectorAll('img')].forEach(im => {
      if (!want[im.dataset.k]) im.remove(); else delete want[im.dataset.k];
    });
    Object.keys(want).forEach(k => {
      const tx = want[k][0], ty = want[k][1];
      const im = el('img');
      im.dataset.k = k;
      im.src = DATA + 'omr/특허/t/' + page + '/' + dpi + '/' + tx + '_' + ty + '.webp';
      im.style.left = (tx * tpt) + 'px'; im.style.top = (ty * tpt) + 'px';
      im.style.width = tpt + 'px';
      inner.insertBefore(im, inner.firstChild);
    });
  };
  const apply = () => {
    inner.style.transform = 'translate(' + V.x + 'px,' + V.y + 'px) scale(' + V.s + ')';
    clearTimeout(apply._t);
    apply._t = setTimeout(tilesPaint, 90);
  };
  const paint = () => {
    inner.innerHTML = '';
    const pg = OMRMETA2.pages[page - 1];
    inner.style.width = pg.w + 'px'; inner.style.height = pg.h + 'px';
    const fit = fitOf();
    box.style.width = BOXW + 'px';
    box.style.height = Math.round(pg.h * fit) + 'px';
    V.s = fit; V.x = 0; V.y = 0;
    if (page === info.pin.page){
      const hl = el('div', 'hl');
      hl.style.left = (info.pin.x - 2) + 'px';
      hl.style.top = (info.pin.y - 2) + 'px';
      hl.style.width = Math.max(6, info.pin.w) + 'px';
      hl.style.height = Math.max(5, info.pin.h) + 'px';
      inner.appendChild(hl);
    }
    apply();
    nav.querySelectorAll('.pgn').forEach(x => x.classList.toggle('on', +x.dataset.p === page));
  };
  box.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = box.getBoundingClientRect();
    if (ev.ctrlKey){
      const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
      const ns = Math.min(14, Math.max(fitOf(), V.s * (ev.deltaY < 0 ? 1.18 : 1 / 1.18)));
      const q = ns / V.s;
      V.x = cx - q * (cx - V.x); V.y = cy - q * (cy - V.y); V.s = ns;
    } else {
      V.y -= ev.deltaY;
    }
    clampV(); apply();
  }, { passive: false });
  const pts = {};
  let drag = null, pinch = null;
  box.addEventListener('pointerdown', ev => {
    pts[ev.pointerId] = [ev.clientX, ev.clientY];
    const ids = Object.keys(pts);
    if (ids.length === 2){
      const a = pts[ids[0]], b2 = pts[ids[1]];
      pinch = { d: Math.hypot(a[0] - b2[0], a[1] - b2[1]) }; drag = null;
    } else drag = { x: ev.clientX, y: ev.clientY, ox: V.x, oy: V.y };
    try{ box.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  });
  box.addEventListener('pointermove', ev => {
    if (!(ev.pointerId in pts)) return;
    pts[ev.pointerId] = [ev.clientX, ev.clientY];
    const ids = Object.keys(pts);
    const r = box.getBoundingClientRect();
    if (pinch && ids.length === 2){
      const a = pts[ids[0]], b2 = pts[ids[1]];
      const d = Math.hypot(a[0] - b2[0], a[1] - b2[1]);
      if (pinch.d > 0){
        const cx = (a[0] + b2[0]) / 2 - r.left, cy = (a[1] + b2[1]) / 2 - r.top;
        const ns = Math.min(14, Math.max(fitOf(), V.s * d / pinch.d));
        const q = ns / V.s;
        V.x = cx - q * (cx - V.x); V.y = cy - q * (cy - V.y); V.s = ns;
        clampV(); apply();
      }
      pinch.d = d;
      return;
    }
    if (!drag) return;
    V.x = drag.ox + (ev.clientX - drag.x);
    V.y = drag.oy + (ev.clientY - drag.y);
    clampV(); apply();
  });
  const pup = ev => {
    delete pts[ev.pointerId];
    if (Object.keys(pts).length < 2) pinch = null;
    if (!Object.keys(pts).length) drag = null;
  };
  box.addEventListener('pointerup', pup);
  box.addEventListener('pointercancel', pup);
  box.addEventListener('dblclick', () => paint());   // 원래 크기

  const pv = el('button', 'tool', '◀');
  pv.onclick = () => { if (page > 1){ page--; paint(); } };
  nav.appendChild(pv);
  OMRMETA2.pages.forEach(p2 => {
    const b = el('button', 'tool pgn' + (p2.n === page ? ' on' : ''), 'p' + p2.n);
    b.dataset.p = p2.n;
    b.onclick = () => { page = p2.n; paint(); };
    nav.appendChild(b);
  });
  const nx = el('button', 'tool', '▶');
  nx.onclick = () => { if (page < OMRMETA2.pages.length){ page++; paint(); } };
  nav.appendChild(nx);
  const find = el('button', 'tool', '찾기');
  find.title = '핀이 있는 쪽으로 돌아가 강조를 보인다';
  find.onclick = () => { page = info.pin.page; paint(); };
  nav.appendChild(find);
  const chk = el('button', 'tool', '위치 점검');
  chk.onclick = () => toast(info.st === 'stale'
    ? '판이 바뀌었다 — 「위치 다시 지정」을 권한다'
    : '판과 일치한다 (hash ' + (OMRMETA2.hash || '').slice(0, 8) + ')');
  nav.appendChild(chk);
  body.appendChild(nav);
  const ft = el('div', 'memobtn');
  const zb = el('button', 'tool on', '확대해서 보기');
  zb.onclick = () => { closeOne(body.parentNode); omrJump(key); };
  ft.appendChild(zb);
  const rb = el('button', 'tool', '위치 다시 지정');
  rb.onclick = () => { closeOne(body.parentNode);
    S.omrPick = { key: key }; S.tab = 'omr'; toast('그 행을 한 번 눌러라'); render(); };
  ft.appendChild(rb);
  const db = el('button', 'tool', '삭제');
  db.title = info.user ? '손으로 찍은 핀을 지운다' : '자동 대조 핀은 지울 수 없다 — 다시 지정으로 덮는다';
  db.onclick = () => {
    if (!info.user){ toast('자동 대조 핀은 지울 수 없다 — 「위치 다시 지정」으로 덮는다'); return; }

    omPut(info.pin.id, null); closeOne(body.parentNode); render();
  };
  ft.appendChild(db);
  body.appendChild(ft);
  paint();
  showPop(ev);
}

/* ── 회독 ── 마감하면 O/X 선택만 비우고 헷갈림·덜약점은 남긴다 — 다음 회독의 출발선이다 */
function rndList(scope){ const a = rndAll()[scope]; return Array.isArray(a) ? a : []; }

  const wrongK = [], confuseK = [], semiK = [], rightK = [], allK = [];

           right: cnt[1], wrong: cnt[3], confuse: cnt[2], semi: cnt[4],
           fake: fakeN, ts: nowIso(),      // ts — §5 학습로그가 날짜로 가른다
           wrongK: wrongK, confuseK: confuseK, semiK: semiK,

  A[scope] = L;

  OXREC = O; lsWrite(OX_KEY, O, '1차객 풀이');

     창은 회독 배지 · 「📊 채점표」 · 채점 결과 창의 「저장 및 보기」에서만 연다. */
  S.oxPage = null;

}
/* ══ v3-C §2~§4 — 📊 회독 비교·채점표 팝업 (민법OX 이식 · 2026-08-26 밤) ══
   rndClose 가 남긴 wrongK/confuseK/semiK 로 회독마다 지문 칩을 그린다.
   옛 항목(목록 없음)은 수만 보인다 — 칩을 지어내지 않는다(§1). */
function oxKeyDisp(k){

  if (k.indexOf('P7:') === 0) return k.slice(3);

}
function rndGo(scope, k){

/* ══ v3-D §0 — 순번은 마디 안 카드 순서로 **그릴 때만** 센다. 어디에도 저장하지 않는다.
   기록은 전부 키(sid)에 붙으므로 CSV 정리로 순서가 바뀌어도 무해하다(R2). */
function mokCards(i){
  if (!VJ) return [];
  const M = VJ.M, n = M[i]; if (!n) return [];
  let jos = [...n.지문], lids = [...n.리담];
  for (let j = i + 1; j < M.length; j++){
    if (M[j].깊이 <= n.깊이) break;
    jos = jos.concat(M[j].지문); lids = lids.concat(M[j].리담);
  }
  jos = [...new Set(jos)]; lids = [...new Set(lids)];
  const _seen = new Set();
  lids.forEach(id => { const q = VJ.byId[id]; if (q)(q.지문 || []).forEach(z => { if (z.uid) _seen.add(z.uid); }); });
  const out = [];
  lids.map(id => VJ.byId[id]).filter(Boolean)
    .forEach(q => out.push({ kind: 'L', q: q, dom: 'qb-' + q.id }));
  jos.map(id => VJ.P7map[id]).filter(z => z && !(z.병합 && _seen.has(z.uid)))
    .forEach(z => out.push({ kind: 'P', z: z, dom: 'qb-' + oxKeyP7(z) }));
  return out;
}
function unCards(){
  if (!VJ) return [];
  const placed = new Set();
  VJ.M.forEach(n => n.리담.forEach(x => placed.add(x)));
  const out = [];
  (VJ.qs || []).filter(q => !placed.has(q.id))
    .forEach(q => out.push({ kind: 'L', q: q, dom: 'qb-' + q.id }));
  return out;
}
function scopeCards(scope){
  const sel = (scope || '').split('|')[2] || '';
  const m = /^__mg(\d+)$/.exec(sel);
  if (m) return mokCards(+m[1]);
  if (sel === '__미분류') return unCards();
  return [];
}
// 카드 목록 → 지문(=문제) 목록. s = 카드 순번(1~) · zn = 지문 번호(제7판 단독은 없음)
function mokCells(cards){
  const cells = [];
  cards.forEach((c, ci) => {
    const s = ci + 1;
    if (c.kind === 'L')(c.q.지문 || []).forEach(z => cells.push({
      k: oxKeyLid(c.q, z), ans: z.ox || '', dom: c.dom, s: s, zn: z.n, label: s + '(' + z.n + ')' }));
    else cells.push({ k: oxKeyP7(c.z), ans: (c.z.ox || ((c.z.리담 || {}).ox || '')) || '',
      dom: c.dom, s: s, zn: null, label: String(s) });
  });
  return cells;
}
function mokPath(i){
  if (!VJ) return '';
  const M = VJ.M, parts = [];
  let d = (M[i] || {}).깊이 || 0;
  for (let j = i; j >= 0; j--){
    const n = M[j]; if (!n) continue;
    if (j === i || n.깊이 < d){
      parts.unshift((n.no ? n.no + (n.깊이 === 1 ? '. ' : ' ') : '') + n.제목);
      d = n.깊이;
      if (d <= 1) break;
    }
  }
  return parts.join(' > ');
}
function mokPathOf(scope){
  const sel = (scope || '').split('|')[2] || '';
  const m = /^__mg(\d+)$/.exec(sel);
  if (m) return mokPath(+m[1]);
  if (sel === '__미분류') return '미분류 (리담)';
  return sel;
}
/* 순번 칩 — 초록 맞음 · 빨강 틀림 · 회색 안 품. 누르면 창을 닫고 그 카드로(§3·§4) */

/* ★ v3-D §3 — 회독별 비교 창. 마감된 회독을 한 칸씩 나열하고 대조는 두 줄만. */
function rndPop(scope, keys, label, ev){
  const _pk38=('cell')+'|'+('📑 회독별 비교'); if(popToggle(_pk38))return; const body=popShell('cell', '📑 회독별 비교', _pk38);   /* ★ 상표 손질 6 — 키 종류|제목 */

function omrDrag(wrap, box, hd){

    box.style.left = Math.max(0, Math.min(innerWidth - 60, x)) + 'px'; box.style.top = Math.max(0, Math.min(innerHeight - 34, y)) + 'px'; };
  const fix = () => { if (box.style.position !== 'fixed'){ const r = box.getBoundingClientRect(); place(r.left, r.top); } };
  const save = () => { S.omrPos = { x: Math.round(parseFloat(box.style.left) || 0), y: Math.round(parseFloat(box.style.top) || 0) }; uiSave(); };
  if (S.omrPos && typeof S.omrPos === 'object') place(S.omrPos.x || 0, S.omrPos.y || 0);
  hd.addEventListener('mousedown', ev => { if (ev.target.closest('button')) return; fix(); wrap._drag = true; });   /* dragify 보다 먼저 — 가운데 정렬을 좌표로 바꾼다 */

  hd.addEventListener('touchmove', ev => { if (!t0) return; const t = ev.touches[0]; place(t0.l + t.clientX - t0.x, t0.t + t.clientY - t0.y); ev.preventDefault(); }, { passive: false });

  // ★ 시험문번으로 정렬한다. 순번(`문번`)은 뒷순위 동률 처리에만 쓴다
  const list = byY[y].slice().sort((a, b) => ((+giNo(a)) - (+giNo(b))) || ((+a.문번) - (+b.문번)));
  GIOMR = list;
  if (!(S.omrCur >= 0)) S.omrCur = 0;
  if (S.omrCur > list.length - 1) S.omrCur = 0;
  const gr = list.filter(giGradable), yrec = giYearOf(y) || {}, q0 = list[0] || {};
  main.appendChild(el('div', 'badge',
    y + '년 ' + (q0.회차 ? q0.회차 + '회 ' : '') + '· ' + list.length + '문항' +
    (q0.형 ? ' · ' + q0.형 + '형' : '') + (gr.length ? ' · 채점 가능 ' + gr.length : '')));
  if (!gr.length)
    main.appendChild(emptyBox('⚠', y + '년은 최종정답이 아직 없다 — 채점하지 않는다',
      '문제는 그대로 보고 풀 수 있다. 조용히 오답으로 처리하지 않는다'));
  else if (gr.length < list.length)
    main.appendChild(el('div', 'badge', '⚠ 시험문번·정답이 확정된 것은 ' + gr.length +
      '문항 — 나머지 ' + (list.length - gr.length) + '문항은 채점에서 뺀다'));
  const bar = el('div', 'modebar');
  bar.appendChild(el('span', 'pl', '📝 기출'));
  const ob = el('button', 'tool' + (S.omr ? ' on' : ''), 'OMR');
  ob.onclick = () => { S.omr = !S.omr; render(); };
  bar.appendChild(ob);
  if (yrec.sub){
    bar.appendChild(el('span', 'badge',
      '채점됨 ' + yrec.right + '/' + yrec.n + ' · ' + String(yrec.sub).slice(0, 10)));
    const wb = el('button', 'tool' + (S.giWrong ? ' on' : ''), '오답만 다시');
    wb.onclick = () => { S.giWrong = !S.giWrong; render(); };
    bar.appendChild(wb);
  } else if (gr.length){
    const sb = el('button', 'tool', '제출 · 일괄 채점');
    sb.onclick = () => { if (giGrade(y, list)){ S.omr = false; render(); } };
    bar.appendChild(sb);
  }
  const rb = el('button', 'tool', '다시 풀기');
  rb.onclick = () => giReset(y, list);
  bar.appendChild(rb);
  main.appendChild(bar);
  if (S.omr) main.appendChild(giOmrPad(y, list));
  let show = list;
  if (S.giWrong && yrec.sub)
    show = list.filter(q => { const r = giOf(giKey(q)) || {}; return r.g && !r.ok; });
  if (!show.length) main.appendChild(emptyBox('🎯', '오답이 없다', '「오답만 다시」를 끄면 전체가 나온다'));
  else show.forEach(q => main.appendChild(giCard(q, !!yrec.sub)));
}

/* ★ 제7판 지문 본문 청소 — 표시층만 (8/26)
   원장 `t` 에 교재 조판 잔재가 같이 들어와 있다. 실측 1,625행 중
   `[NN 변리]` 1,624 · 인쇄 정답표기 `답 I O I X I` 226 · 쪽머리글 46 · 줄바꿈 1,514.
   태그는 머리 배지와 같은 값이라 두 번 보였다.
   ⚠ 원장 csv 는 건드리지 않는다 — 재추출은 지문 ID 게이트로 번진다. 안 보이게만 한다. */
function p7Text(t){
  let x = String(t || '');
  x = x.replace(/\[\s*\d{2}(?:[\s\u00b7,]+\d{2})*\s*변리\s*\]/g, '');
  x = x.replace(/(^|\n)[ \t]*답[ \t]*[I|][^\n]*/g, '');
  x = x.replace(/(^|\n)[ \t]*제\d+편[ \t]+[^\n]*$/g, '');
  return x.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ').trim();
}

/* ★ 근거 조문 — 제7판 지문에는 근거 「열」이 없고 **해설 본문**에 박혀 있다 (8/26 실측).
   해설 있는 1,301개 중 691개에 표기가 있다 — 法 1,121회 · 施規 41회.
   꼴 두 가지 — 「法2조3호 가목」 · 「法197①」 · 「施規106의4」.
   ⚠ 施規(시행규칙)는 앱에도 API에도 데이터가 없다 — 배지만 달고 링크는 걸지 않는다. */
/* ★ 8/26 — `제N조` 꼴까지 넓혔다(사용자 확정). 전엔 `法 11` 한자 약물만 잡아
   `특허법 제11조` 로 적힌 해설 356건이 통째로 칩을 못 받고 있었다.
   실측 681건 중 — 딴 법 이름이 앞에 붙은 66건 제외 · 특허법 조문 목록 밖 25건 제외 → 590 채택. */
const JO_OTHER=/(민사소송법|민법|상표법|디자인보호법|실용신안법|저작권법|형법|행정소송법|행정심판법|시행령|시행규칙|조약|협약)\s*$/;
function p7Jo(sol, extra){
  const out=[], seen={}, s=String(sol||'');
  const add=(k,law)=>{if(k&&!seen[k]){seen[k]=1;out.push({k:k,law:law});}};
  s.replace(/法\s*(\d+)(?:조)?(?:의\s*(\d+))?/g,(m,a,b)=>{
    add('제'+a+'조'+(b?'의'+b:''),true);return m;});
  const RX=/제\s?(\d+)조(?:의\s?(\d+))?/g; let m2;
  while((m2=RX.exec(s))){
    if(JO_OTHER.test(s.slice(Math.max(0,m2.index-14),m2.index)))continue;
    const k='제'+m2[1]+'조'+(m2[2]?'의'+m2[2]:'');
    if(JOKEY&&!JOKEY[k])continue;      // 목록에 없는 번호는 딴 법이거나 삭제조다
    add(k,true);
  }
  s.replace(/施規\s*(\d+)(?:의\s*(\d+))?/g,(m,a,b)=>{
    add('施規 '+a+(b?'의'+b:''),false);return m;});
  // 리담 짝에서 물려받은 근거조문 — 해설 파싱보다 이쪽이 정본이다
  (extra||[]).forEach(c=>{const k=joKeyOf(c);if(!JOKEY||JOKEY[k])add(k,true);});
  return out.slice(0,5);
}
/* ★ 조문은 뷰로 옮겨 가지 않고 **팝업**으로 띄운다(사용자 확정 8/26).
   `popJo` 는 볼트 본문을 그대로 렌더하고 머리에 「뷰로 이동」을 달아 준다. */
/* ══════ 법전 조판 (사진 실측 2026-08-26) ══════
   재료 = 볼트 원문 줄들. 계층은 이미 들여쓰기로 들어와 있다 — 항 0 · 호 2 · 목 4.
   한 줄 17전각 · 한 단 45줄 · 줄간격 1.3 · 호는 내어쓰기 2전각 · 개정 표기 0.82배.
   ⚠ 글자는 하나도 고치지 않는다. 【 】 로 보이는 것은 표시층 치환일 뿐이다. */
const JOCOLS = 17;     // 한 줄 글자 수 — 사진과 어긋나면 이 숫자 하나만 고친다
const JOROWS = 45;     // 한 단 줄 수
let JOEM = 0;
function joEm(){
  if (JOEM) return JOEM;
  const p = el('span', '', '가');
  p.style.cssText = 'position:absolute;visibility:hidden;line-height:1;'
    + "font-family:'Batang','BatangChe','Nanum Myeongjo',serif";
  document.body.appendChild(p);
  JOEM = p.getBoundingClientRect().width || 0;
  p.remove();
  return JOEM;
}
const JOREV = /(<(?:개정|신설|전문개정|본조신설)[^>]*>|\[[^\]]*(?:개정|신설)[^\]]*\]|\([^()]*(?:개정|신설)\))/g;
function joPiece(host, t){
  // 개정·신설 표기만 작게. 나머지 글자는 그대로 둔다.
  let i = 0, m;

function beopjeon(host, lines){

  let n = 0;
  L.forEach((raw, ix) => {
    const lead = raw.length - raw.replace(/^\s+/, '').length;
    const t = raw.trim();
    if (!t) return;
    const d = el('div', 'bjline' + (lead >= 4 ? ' bjmok' : lead >= 2 ? ' bjho' : ''));
    if (ix === 0){
      // 조 제목 줄 — 다음 줄(항)을 이어 붙이고 제목만 굵게 한다
      const mt = t.match(/^(\S+조(?:의\d+)?)\s*\(([^)]*)\)\s*$/);
      if (mt){
        const b = el('b', 'bjti', mt[1] + '【' + mt[2] + '】');
        d.appendChild(b);
      } else {
        d.appendChild(el('b', 'bjti', t));
      }
      const nx = (L[1] || '').trim();
      if (nx && !/^\s{2}/.test(L[1] || '')){ joPiece(d, nx); L[1] = ''; }
    } else {
      joPiece(d, t);
    }
    wrap.appendChild(d);
    n += Math.max(1, Math.ceil(t.length / JOCOLS));
  });
  const em = joEm();
  if (em){
    const one = JOCOLS * em;
    if (n > JOROWS){
      wrap.style.width = (one * 2 + 1.4 * em) + 'px';
      wrap.style.height = (JOROWS * 1.3 * em) + 'px';
      wrap.style.columnCount = 2;
      wrap.style.columnFill = 'auto';

      wrap.style.width = one + 'px';
    }
  }
  host.appendChild(wrap);
}

const OM_KEY = REC_PRE + 'omr';

let OMRV = { s: 0, x: 0, y: 0, page: 0 };
function omAll(){ if (!OMREC) OMREC = lsRead(OM_KEY); return OMREC; }
function omPut(id, rec){

function omrTiles(stage, inner, META){
  const pg = S.omrPage;
  const eff = OMRV.s * (window.devicePixelRatio || 1);
  const dpi = eff <= 4.2 ? 300 : eff <= 8.4 ? 600 : 900;
  const tm = ((META.tiles || {})[String(pg)] || {})[String(dpi)];
  if (!tm) return;
  const sc = 72 / dpi, tpt = 1024 * sc;
  const vx0 = (-OMRV.x) / OMRV.s, vy0 = (-OMRV.y) / OMRV.s;
  const vx1 = vx0 + stage.clientWidth / OMRV.s, vy1 = vy0 + stage.clientHeight / OMRV.s;
  const c0 = Math.max(0, Math.floor(vx0 / tpt)), c1 = Math.min(tm.cols - 1, Math.floor(vx1 / tpt));
  const r0 = Math.max(0, Math.floor(vy0 / tpt)), r1 = Math.min(tm.rows - 1, Math.floor(vy1 / tpt));
  const want = {};
  for (let ty = r0; ty <= r1; ty++)
    for (let tx = c0; tx <= c1; tx++) want[dpi + '/' + tx + '_' + ty] = [tx, ty];
  [...inner.querySelectorAll('img.omrtile')].forEach(im => {
    if (!want[im.dataset.k]) im.remove(); else delete want[im.dataset.k];
  });
  Object.keys(want).forEach(k => {
    const tx = want[k][0], ty = want[k][1];
    const im = el('img', 'omrtile');
    im.dataset.k = k;
    im.src = DATA + 'omr/특허/t/' + pg + '/' + dpi + '/' + tx + '_' + ty + '.webp';
    im.style.left = (tx * tpt) + 'px'; im.style.top = (ty * tpt) + 'px';
    im.style.width = tpt + 'px';
    inner.insertBefore(im, inner.firstChild);
  });
}
function omrPins(inner, META, MAP){
  const pg = S.omrPage, eff = {};
  Object.keys(MAP).forEach(sid => { const m = MAP[sid];
    if (m.page === pg) eff[sid] = { x: m.x, y: m.y, w: m.w, h: m.h, ref: sid, user: false }; });
  const U = omAll();   // ★ 기록층이 map 을 덮는다
  Object.keys(U).forEach(id => { const u = U[id];
    if (u.doc === '특허' && u.page === pg && u.ref)
      eff[u.ref] = { x: u.x, y: u.y, w: u.w, h: u.h, ref: u.ref, user: true }; });
  Object.keys(eff).forEach(ref => {
    const p = eff[ref];

    d.style.left = p.x + 'px'; d.style.top = p.y + 'px';

    d.onclick = ev => { ev.stopPropagation(); omrPinGo(ref); };
    inner.appendChild(d);
  });
}

        const cx = (a[0] + b[0]) / 2 - r.left, cy = (a[1] + b[1]) / 2 - r.top;
        const ns = Math.min(14, Math.max(0.2, OMRV.s * d / pinch.d));

        OMRV.x = cx - q * (cx - OMRV.x); OMRV.y = cy - q * (cy - OMRV.y); OMRV.s = ns;

      pinch.d = d; moved = true;
      return;
    }
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
    if (!moved) return;

    apply();
  });

    delete pts[ev.pointerId];
    if (Object.keys(pts).length < 2) pinch = null;
    if (!Object.keys(pts).length) drag = null;
    setTimeout(() => { moved = false; }, 60);
  };

  stage.addEventListener('pointercancel', up);

    ev.preventDefault();
    if (ev.ctrlKey){
      const r = stage.getBoundingClientRect();
      const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
      const ns = Math.min(14, Math.max(0.2, OMRV.s * (ev.deltaY < 0 ? 1.18 : 1 / 1.18)));

    } else {
      OMRV.y -= ev.deltaY;
    }
    apply();
  }, { passive: false });

  });

      hit.forEach(p=>skRow(box,'prec',(p.사건번호||p.파일)+(p.전합?' [전합]':''),(p.사건명||p.별칭||'').slice(0,50),p.원본?'원본':'요약본',
        ev=>{closeSk();
          const _pk49=('')+'|'+('⚖ '+(p.사건번호||p.파일)); if(popToggle(_pk49))return; const b=popShell('', '⚖ '+(p.사건번호||p.파일), _pk49);   /* ★ 상표 손질 6 — 키 종류|제목 */
          if(p.사건명||p.별칭)b.appendChild(el('div','',(p.사건명||p.별칭)));
          if(p.선고)b.appendChild(el('span','badge','선고 '+p.선고));
          (Array.isArray(p.조문)?p.조문:[]).slice(0,6).forEach(x=>
            b.appendChild(el('span','chip c-prec','⚖'+x)));
          const go=el('button','tool on','판례 갈래로 이동 ↗');
          go.onclick=()=>{S.tab='prec';S.prec=p.id;S.precTab=p.요약본?'요약':'원문';closeAllPops();render();};
          b.appendChild(go);
          showPop(ev);}));
    }catch(err){box.appendChild(el('div','grp','⚖ 판례 — 읽지 못했다'));}
  }
  if(SKON.jimun){
    try{
      const out=[];
      const lawsJ=lawsOn.filter(l=>l!=='민사소송법');   /* 민소는 1차 지문이 없다 — 지금 규칙 유지 */
      const capJm=Math.max(10,Math.floor(30/Math.max(1,lawsJ.length)));
      for(const law of lawsJ){
        const subj=SHORT[law];
        const JM=await get('jimun_'+subj+'.json');
        let nL=0;
        for(const qq of JM.문제){
          if(out.length>=30||nL>=capJm)break;
          for(const z of (qq.지문||[])){
            if(String(z.t||'').includes(q)){
              out.push({h:qq.연도+'년 '+(qq.시험문번||qq.문번)+'번 ('+z.n+')',x:skCut(z.t,q),
                        t:z.t,ox:z.ox,sol:z.sol,tag:subj,
                        go:{kind:'L',id:qq.id,dom:'qb-'+qq.id}});nL++;break;}
          }
        }
      }
      let P7=null;
      if(SKLAW['특허법']){try{P7=await get('jimun_7pan.json');}catch(e2){}}
      if(P7)for(const z of P7.지문){
        if(out.length>=60)break;
        if(String(z.t||'').includes(q))
          out.push({h:'제7판 '+z.태그+' p.'+(z.쪽||'—'),x:skCut(z.t,q),
                    t:z.t,ox:z.ox,sol:z.sol,tag:'제7판',
                    go:{kind:'P',id:z.id,dom:'qb-'+(z.uid||('P7:'+z.id))}});
      }
      box.appendChild(el('div','grp','📝 지문 — '+out.length+'건'));
      out.forEach(r=>skRow(box,'jimun',r.h,r.x,r.tag,
        ev=>{closeSk();
          const rows=[['',(r.tag==='제7판'?p7Text(r.t):r.t)]];
          if(r.ox)rows.push(['badge','정오 '+r.ox]);
          if(r.sol)rows.push(['sol',(r.tag==='제7판'?p7Text(r.sol):r.sol)]);
          popJimun(r.h,rows,ev,r.go);}));
    }catch(err){box.appendChild(el('div','grp','📝 지문 — 읽지 못했다'));}
  }
  if(SKON.memo){
    /* ★ v3-H §2 — 🗒 메모 = 포스트잇 층(§4 · jopangi.postit). b 패치 전엔 0건이 정상. */
    const A=lsRead(REC_PRE+'postit');
    const out=[];
    for(const k2 of Object.keys(A)){
      if(out.length>=30)break;
      const v=A[k2]||{};
      if(String(v.t||'').indexOf(q)<0)continue;
      const p=k2.split(SEP);
      out.push({key:k2,tk:p[0]||'',word:p[3]||'',t:String(v.t||'')});
    }
    box.appendChild(el('div','grp','🗒 메모 — '+out.length+'건'));
    out.forEach(r=>skRow(box,'memo',(r.word?'「'+r.word+'」 ':'')+skTarget(r.tk),skCut(r.t,q),'메모',
      ev=>{closeSk();skMemoGo(r.tk,ev,r);}));
  }
  if(SKON.logic){
    /* ★ v3-H §2 — 📐 논리(jopangi.logic) 본문 검색 · 결과 = 그 지문 팝업 */
    const A=lgAll();
    const out=[];
    for(const k2 of Object.keys(A)){
      if(out.length>=30)break;
      const t2=(A[k2]||{}).t||'';
      if(t2.indexOf(q)<0)continue;
      out.push({k:k2,x:skCut(t2,q)});
    }
    box.appendChild(el('div','grp','📐 논리 — '+out.length+'건'));
    out.forEach(r=>skRow(box,'logic',linkDisp(r.k),r.x,'논리',
      ev=>{closeSk();popCard(r.k,ev);}));
  }
  if(SKON.omr&&SKLAW['특허법']){   /* 정리는 특허만 — 지금 규칙 유지 */
    try{
      const W=await get('omr/특허/omr_words.json');
      const out=[];
      W.pages.forEach((ws,pi)=>{
        if(out.length>=30)return;
        for(const w of ws){
          if(out.length>=30)break;
          if(String(w[4]).indexOf(q)>=0)out.push({p:pi+1,x:w[0],y:w[1],t:w[4]});
        }
      });
      box.appendChild(el('div','grp','📖 정리 — '+out.length+'건'));
      out.forEach(r=>skRow(box,'omr','p.'+r.p,String(r.t).slice(0,44),'정리',
        ev=>{closeSk();omrGoto(r.p,r.x,r.y);}));
    }catch(err){box.appendChild(el('div','grp','📖 정리 — 산출물이 없다'));}
  }
  if(SKON.stk){
    /* ★ v3-J §2-E — 🏷 두문자·줄임말: 이름·뜻이 맞는 사전 항목 + 그 스티커가 붙은 자리 전부 */
    await stkdSeed(S.law);
    const A=stkdAll();
    const out=[];
    for(const id of Object.keys(A)){
      if(out.length>=30)break;
      const d=A[id];
      if((d.name||'').indexOf(q)<0&&(d.mean||'').indexOf(q)<0)continue;
      out.push({id:id,d:d,uses:stkdUses(id)});
    }
    const nAll=out.reduce((a2,r)=>a2+1+r.uses.length,0);
    box.appendChild(el('div','grp','🏷 두문자·줄임말 — '+nAll+'건'));
    out.forEach(r=>{
      skRow(box,'stk',r.d.name||'(이름 없음)',(r.d.mean||'')+' · 붙인 '+r.uses.length,
        r.d.kind||'두문자',ev=>{closeSk();stkdPalPop(ev,r.d.name);});
      r.uses.forEach(u=>skRow(box,'stk',stkdUseDisp(u),u.ex?('「'+u.ex.slice(0,24)+'」'):'',
        '붙인 자리',ev=>{closeSk();stkdUseGo(u,ev);}));
    });
  }
  const rs=box.querySelectorAll('.res');
  if(rs.length)rs[0].classList.add('on');
  box.appendChild(el('div','grp','↵ 열기 · Esc 닫기 · 범위를 눌러 켜고 끈다'));
};
$('#skin').onkeydown=e=>{
  if(e.key==='Escape')return closeSk();
  const rs=$('#skres').querySelectorAll('.res');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(!rs.length)return;
    rs[skSel].classList.remove('on');
    skSel=(skSel+(e.key==='ArrowDown'?1:rs.length-1))%rs.length;
    rs[skSel].classList.add('on');rs[skSel].scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'&&rs.length&&skRows[skSel])skRows[skSel].open(null);
};
addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea')return;   // 입력칸 포커스 시 단축키 차단
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSk();}
  if(e.key==='Escape'){closePop();closeSk();}
});
$('#sk').onclick=e=>{if(e.target.id==='sk')closeSk();};

/* ══════════ 딥링크 ══════════ */
function readHash(){
  let h=location.hash;
  try{h=decodeURIComponent(h);}catch(e){}
  const m=/^#jo=([^:]+):(제[^&#]+)/.exec(h);
  if(m&&LAWS.includes(m[1])){S.law=m[1];S.tab='jo';S.jo=m[2].split('#')[0];return true;}
  return false;
}
addEventListener('hashchange',()=>{if(readHash())render();});

/* ══════════ 렌더 ══════════ */
let busy=false;
async function render(){
  if(busy)return;busy=true;
  /* ★ 스크롤 보존 (8/26) — slot 을 통째로 다시 그리므로 안 잡아 두면 누를 때마다 맨 위로 튄다.
     태그·O/X 가 「눌러도 아무 일 없다」로 보이던 원인이 이것이다. */
  const SCR={};
  ['main','tree','plist','qlwrap'].forEach(c=>{   // ★ 8/26 `qlist` 는 없는 클래스였다
    const n=document.querySelector('#slot .'+c);if(n)SCR[c]=n.scrollTop;});
  const scrBack=()=>Object.keys(SCR).forEach(c=>{
    if(c==='main'&&S.oxPageJump)return;   // ★ v3-C §6-2 — 쪽을 넘겼다: 맨 위에서 시작
    const n=document.querySelector('#slot .'+c);if(n)n.scrollTop=SCR[c];});
  inkReset();                       // 앞 화면의 ResizeObserver 를 끊는다
  {const f=document.getElementById('oxfab');if(f)f.remove();
   const p=document.getElementById('oxpill');if(p)p.remove();}  // ★ v3-D §5 · v3-F 알약 — 뷰마다 다시 단다
  // ⚠ body 에 건다 — 팝업(2차 셀 · 조문 팝업)이 #app 밖에 뜬다
  document.body.classList.toggle('inkon',!!S.ink);
  document.body.classList.toggle('stkon',!!S.stick);
  document.documentElement.style.setProperty('--trw',(S.treeW||212)+'px');   /* ★ v3-J §0-2 */
  document.documentElement.style.setProperty('--lsw',(S.listW||262)+'px');   /* ★ 판 4 §2-5 */
  drawTop();drawRail();inkBar();
  try{
    if(S.tab==='prec')await viewPrec();
    else if(S.tab==='cha2')await view2cha();
    else if(S.tab==='jimun')await viewJimun();
    else if(S.tab==='omr')await viewOmr();   // ★ v3-E §1-3
    else await viewJo();
  }catch(err){
    const slot=$('#slot');slot.innerHTML='';
    const m=el('div','main');m.appendChild(emptyBox('⚠','데이터를 읽지 못했다',String(err&&err.message||err)));
    slot.appendChild(m);console.error(err);
  }
  scrBack();setTimeout(scrBack,0);
  setTimeout(()=>{S.oxPageJump=false;},0);   // 다음 render 부터는 다시 보존
  /* ★ v3-F §0 — 떠 있는 지문 팝업을 본 화면과 같은 상태로 다시 그린다(같은 sid 기록 공유) */
  CARDPOPS=CARDPOPS.filter(p=>p.body&&p.body.isConnected);
  CARDPOPS.forEach(p=>{try{p.paint();}catch(e){}});
  busy=false;
}
// 폭이 바뀌면 법전 조판의 단 수를 다시 잡는다. ⚠ 한 행 글자 수는 그대로다 — 단만 준다.
let rsz=null;
addEventListener('resize',()=>{
  clearTimeout(rsz);
  rsz=setTimeout(()=>{
    document.querySelectorAll('.bjpage').forEach(bjFit);
  },140);
});
readHash();
render();
try{ recBoot(); }catch(e){ console.warn('recsync boot', e); }   /* ★ recsync — 시작 1회 · 10초 도장 · 3분 동기화 */
</script>
</body>
