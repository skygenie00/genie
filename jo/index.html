/* ══ 목업 v2~v5 공통 팔레트 그대로 ══ */

}
*{box-sizing:border-box}
html,body{margin:0;height:100%}

#app{display:flex;flex-direction:column;height:100vh;background:#fff}

/* ── 본문 3단 ── */

   칸·수·켜짐은 drawRail·railCounts 그대로 · 구분선 = #hrail 왼쪽 테두리(1px #cfcabd · 높이 26 · 좌우 10). */

/* 둘째 줄 = 🔍 검색줄 전폭(머리와 같은 바탕) · 첫 줄이 넘치면 배지 묶음이 이 줄 오른쪽으로 내려온다(hdrFit) */

  background:var(--panel);padding:8px 0;font-size:12.5px}

/* ★ 판 3 (2026-09-02) — 전합 배지 · ★ 내 중요도 · 1단 거르기 트리 · 2단 검색 적중 · 3단 인용 자리 */
.badge.jh{border:1px solid var(--rule);color:var(--rule);background:#fff4f4;font-weight:700}

.badge.qa{background:#f2f2f2;color:#8a8a8a}.badge.qa.un{background:#fff8e1;color:#b8860b;font-weight:700}/* ★ QA 판 add1 — 검수 배지(초안·미검수) */

.tree .gy-b:hover{background:#e8effb;border-color:var(--exc);color:var(--exc)}

.badge.qa.clk{cursor:pointer}.badge.qa.wait{background:#e8effb;color:var(--exc);font-weight:700}/* ★ prec3 §C — 볼트 검수 대기 */
.tree input.fq{margin:4px 13px;width:calc(100% - 26px);box-sizing:border-box;font:inherit;font-size:11.5px;padding:2px 6px;border:1px solid #d9d6ce;border-radius:6px}
input.pq{font:inherit;font-size:12px;padding:2px 7px;border:1px solid #d9d6ce;border-radius:7px;flex:1;min-width:90px}

#syncChip.ok{background:#e9f7ee;color:var(--ok)} #syncChip.busy{background:#eaf1fb;color:var(--exc)}
#syncChip.off{background:#f2f0ea;color:#9a958b} #syncChip.bad{background:#fde9e9;color:var(--rule)}
#eqBtn.has{background:#fff2e0;color:var(--warn)}

.eqedit{margin:2px 0} .eqta{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;line-height:1.5;padding:4px 6px;border:1px solid #d98a1c;border-radius:6px;min-height:44px}

.pitmenu{position:fixed;z-index:99999;background:#fff;border:1px solid #d9b23c;border-radius:8px;padding:5px 11px;box-shadow:0 4px 14px rgba(0,0,0,.15);font-size:12.5px;cursor:pointer}
.thwrap{margin:8px 0;border:1px solid #e2dfd6;border-radius:10px;padding:10px;background:#fbfaf6}
.thhd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.thcols{display:flex;gap:8px;overflow-x:auto;align-items:flex-start;margin-top:8px}
.thcol{min-width:190px;max-width:240px;flex:0 0 auto;border:1px solid #e5e2da;border-radius:8px;background:#fff;padding:8px}
.thcol.add{border-style:dashed;background:#fdfdfb;color:#999}
.thcol .bj2{font-size:12px;color:#555;margin-top:5px;line-height:1.45;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;overflow:hidden}
/* ★ v3-I — 조문 목차 장·★ 개정 · 연결 칩 */
.jtbar{display:flex;gap:5px;flex-wrap:wrap;padding:7px 9px;border-bottom:1px solid var(--line)}
.jtbar .tool{font-size:11px;padding:2px 7px}
.tree .r.jhead{background:#f3f1ea;font-weight:700;color:#4a463f}
.tree .r.jsub{color:#8a857c;font-size:11.5px;padding-left:18px;background:#faf8f3}
.jrange{font-size:10px;color:#9a958b;white-space:nowrap;font-style:normal;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.jstarc{color:#c9a400;font-size:10.5px;white-space:nowrap;font-style:normal}
.tool.jstar{color:#8a6d00}
.tool.jstar.on{background:#c9a400;border-color:#c9a400;color:#fff}
.jstarb{background:#fdf6d8;color:#8a6d00;border:1px solid #e5d48a}
.chip.wait{opacity:.45}
/* ★ v3-J — 🏷 두문자·줄임말 스티커(§2-C 칩 14px/9px · 바탕 45% · 테두리 55%) · 팔레트 ·
   §0-1 테마 카드 「더 ▾」 · §0-2 장 머리 이름 우선 */
.stkchip{display:inline-flex;align-items:center;height:14px;line-height:1;font-size:9px;font-weight:700;
  border-radius:7px;border:1px solid;padding:0 5px;margin:0 2px;vertical-align:middle;cursor:pointer;
  background:#16a34a73;border-color:#16a34a8C;color:#0c5929;white-space:nowrap}
.stkchip.big{height:20px;font-size:11.5px;border-radius:10px;padding:0 9px}
.stkrow{display:flex;gap:7px;align-items:center;padding:5px 3px;border-bottom:1px solid #f0ede6;font-size:12.5px}
.stkrow .cdim{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:40px}
.stkdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.stkuses{display:flex;gap:4px;flex-wrap:wrap;padding:2px 3px 7px 20px}
.stkuses .tool{font-size:10.5px;padding:1px 7px}
.stklist{max-height:46vh;overflow:auto;min-width:340px}
.swatch.on{outline:2px solid var(--exc);outline-offset:1px}
.thcol .bj2.open{display:block;-webkit-line-clamp:unset;max-height:none}
.thcol .bj2more{margin-top:4px;font-size:10.5px;padding:1px 8px}
.tree .r.jhead em{flex-shrink:1;min-width:0;overflow:hidden}
/* ★ v3-L — 빈칸 모드(그림 조문_빈칸모드_목업 · 내용 파랑 · 주체 보라 · 기간 초록 = v3-O §3) */
.bkln{white-space:pre-wrap;line-height:2.05}
.bkin{border:0;border-bottom:2px solid #999;background:#fffdf5;font:inherit;text-align:center;
  padding:0 2px;margin:0 2px;border-radius:4px 4px 0 0;vertical-align:baseline}
.bkin:focus{outline:none;background:#fff7d6}
.bkin.ok{color:#15803d;border-color:#15803d !important;background:#f0fdf4;font-weight:700}
.bkin.bad{color:#b91c1c;border-color:#b91c1c !important;text-decoration:line-through;background:#fef2f2}
.bkin.reveal{color:#6b21a8;background:#faf5ff}
.bku{border-bottom:2px solid;padding:0 1px}
.bkq{cursor:pointer;color:#9ca3af;border:1px dashed #c9c5bb;border-radius:50%;font-size:9px;
  padding:0 3px;margin-left:1px;vertical-align:super;background:#fff}
.bkbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 10px;
  background:#f7f5ef;border-bottom:1px solid var(--line);font-size:12px}
.bkbar .tool{font-size:11.5px}
/* ★ v3-M — ⇄ 3법 대응 · 팔레트 목업 · 트리 「내 주 기」 · 본문 칩 상자 */
.c3red{background:#fee2e2;color:#b91c1c;border-radius:3px;padding:0 1px}
.c3dim{color:#9ca3af}
.thcol.cand{border-style:dashed;border-color:#c9a227}
.c3src{font-size:9px;border:1px solid #d9d6ce;border-radius:5px;padding:0 4px;color:#8a857c;margin-left:3px}
.stkw2{border:1px dashed #c9c5bb;border-radius:4px;padding:0 1px;background:none}
.stksec{font-size:10.5px;color:#9a958b;letter-spacing:.4px;margin:9px 0 3px;border-bottom:1px solid #eeece6}
.stkrow .nmc{font-weight:700}
.stkrow .use1{margin-left:auto;font-size:10.5px;color:#8a857c;white-space:nowrap}
.stknew{border-top:1px solid var(--line);margin-top:8px;padding-top:7px;display:flex;gap:5px;
  align-items:center;flex-wrap:wrap}
.stknew input[type=text]{border:1px solid #d9d6ce;border-radius:6px;padding:3px 7px;font:inherit;font-size:12px}
.bkm3{display:inline-flex;gap:1px;width:42px;justify-content:flex-end;flex-shrink:0}
.bkm3.dots{width:30px;align-items:center}
.bkmk{width:14px;height:14px;font-size:9px;line-height:13px;text-align:center;border:1px solid transparent;
  border-radius:3px;font-style:normal;cursor:pointer;display:inline-block}
.bkmk.dot{width:8px;height:8px;border-radius:50%;border:0}
/* ★ v3-N — 읽기 모드 🏷 거품 · 칩 표시 오프셋(§4 점선 연결선) */
.stkbub{position:fixed;z-index:80;font-size:14px;line-height:1;padding:4px 6px;
  border:1px solid #d9d6ce;border-radius:8px;background:#fffdf6;
  box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
.stkoffw{position:relative;display:inline-block}
.stkanc{position:relative;display:inline-block;width:0;height:0;overflow:visible;vertical-align:baseline}
.stkanc>.stkchip,.stkanc>.stkoffw{position:absolute;left:0;bottom:.9em;transform:translateX(-50%);margin:0;z-index:3;white-space:nowrap}   /* ★ 칩 자유이동 */
.stkoffl{position:absolute;left:50%;top:50%;height:0;border-top:1px dotted #b8b3a8;
  opacity:.55;transform-origin:0 0;pointer-events:none}

/* ── 카드 본문 ── */
.ctitle{font-weight:700;font-size:11.5px;margin-bottom:3px;line-height:1.35}
.cbody{font-size:10.5px;line-height:1.45;color:#444;overflow:hidden}
.cbody .cln{white-space:pre-wrap;word-break:break-word}
.cdim{color:#b5b1a8;font-size:10px}
  margin-top:10px;height:calc(100vh - 200px)}
.cstage{position:relative}
.cgroup{position:absolute;border:2px solid #cfcabd;border-radius:12px;background:#00000008}
.cgroup .glabel{position:absolute;top:-11px;left:10px;font-size:11px;font-weight:700;
  background:#cfcabd;color:#fff;border-radius:6px;padding:1px 9px;white-space:nowrap}
.ccard{position:absolute;border:1px solid var(--line);border-radius:8px;background:#fff;
  overflow:hidden;cursor:pointer}
.ccard:hover{border-color:var(--exc);box-shadow:0 2px 8px rgba(47,111,208,.18)}
.cinner{transform-origin:0 0;padding:6px 8px;overflow:hidden}
.cmemo{position:absolute;border:1px solid #e3cf6a;border-radius:8px;background:var(--post);
  overflow:hidden;font-size:11px;color:#6b5f17}
.memoslot{margin-top:10px;border:1px dashed #e3cf6a;background:#fffbe8;border-radius:8px;padding:8px 10px}
.memoslot .mh{font-size:11.5px;font-weight:700;color:#7a6a17;margin-bottom:3px}
.gr{white-space:pre-line;line-height:1.35}

/* ── OX 카드 (민법OX 방식) ── */
.qwrap{border:1px solid var(--line);border-radius:11px;background:#fff;margin-top:10px;padding:10px 13px}
.qhd{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.qb{font-size:10.5px;border-radius:6px;padding:1px 8px;font-weight:600}
.qb.v{background:#f3ecfd;color:#7a3ed0}
.qb.t{background:#eaf1fb;color:var(--exc)}
.qb.n{background:#efece5;color:#777}
.qb.id{background:#f4f2ec;color:#a5a19a;font-weight:400}
.qb.warn{background:#fde9e9;color:var(--rule)}
.qtag{font-size:10.5px;color:#b5b1a8;border:1px solid #eeece6;border-radius:999px;padding:1px 7px;cursor:pointer;background:#fff}
.qtag:hover{border-color:#c9c4b8;background:#faf8f3}
.qtag.on{color:#1e1913;border-color:var(--exc);background:#eaf1fb;font-weight:700}
/* ★ 너비는 변수다(8/26) — 손잡이를 끌면 .qlbox 인라인 스타일이 덮는다. 기본값 = 옛 고정폭. */
.qlbox{--nmw:228px;--rdw:168px}
.qlwrap{width:calc(var(--nmw) + var(--rdw));flex-shrink:0;border-right:1px solid var(--line);overflow:auto;font-size:12px}
.qlwrap.hid{display:none}
.qlwrap.nonm .qlnm{display:none}
.qlwrap.nord .qlrd{display:none}
.qlwrap.nonm{width:var(--rdw)}
.qlwrap.nord{width:calc(var(--nmw) + 10px)}
.bjwrap{column-gap:1.4em;column-rule:.5px solid #b4b2a9;text-align:justify;
  text-align-last:left;word-break:break-all;line-height:1.3;
  font-family:'Batang','BatangChe','Nanum Myeongjo',serif}
.bjline{margin:0}
.bjho{padding-left:2em;text-indent:-2em}
.bjmok{padding-left:4em;text-indent:-2em}
.bjrev{font-size:.82em}
.bjti{font-weight:700}
/* ★ 접기 손잡이는 열 바깥이 아니라 이름칸/회독칸 경계에 선다(8/26 사용자 요구).
   `.qlnm` 이 228px 고정이라 그 오른쪽 선이 곧 경계다. 위아래로 꽉 채운다. */
.qlbox{position:relative;display:flex;flex-shrink:0}
.qlh{position:absolute;top:0;bottom:0;width:13px;z-index:6}
.qlh.a{left:var(--nmw)}
.qlh.b{left:calc(var(--nmw) + 13px)}
/* 끌 수 있는 손잡이 — touch-action:none 이라야 아이패드 손가락 끌기가 스크롤로 새지 않는다 */
.qlbox .handle.drg{cursor:col-resize;touch-action:none}
.qlbox .handle.drg:hover{background:#e8e4da}
.qlbox.nonm .qlh.a{left:0}
.qlbox.nonm .qlh.b{left:13px}
.qlr{display:flex;align-items:stretch;border-bottom:1px solid #f0eee8}
.qlr.ch{background:#eceae3;border-bottom-color:#e2dfd6}
.qlr.on{background:#e8effb}
.qlnm{width:var(--nmw);flex-shrink:0;padding:7px 9px;border-right:1px solid var(--line);
  display:flex;align-items:center;gap:5px;min-width:0}
.qlnmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlr.ch .qlnmt{font-weight:700;color:#4a463f}
.qlar{width:12px;flex-shrink:0;color:#8a857c;text-align:center}
.qlar.k{cursor:pointer}
.qltot{color:#8a857c;font-size:11px;flex-shrink:0;margin-left:auto}
.qlnote{font-size:10px;border-radius:999px;padding:1px 5px;border:1px solid #e6e0f5;
  background:#f8f5fe;color:#9a93ad;cursor:pointer;flex-shrink:0}
.qlnote.on{border-color:#7a3ed0;color:#7a3ed0;font-weight:700}
.qlrd{flex:1;padding:6px 9px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.qlb{font-size:10.5px;border-radius:999px;padding:1px 7px;border:1px solid #dcd8ce;color:#6b675f}
.qlrun{font-size:10.5px;border-radius:999px;padding:1px 7px;background:#fdf3d8;border:1px solid #e8d38a;color:#8a6d12}
.qlgo{font-size:10.5px;border-radius:6px;padding:2px 9px;border:1px solid var(--exc);
  background:var(--exc);color:#fff;cursor:pointer;flex-shrink:0;margin-left:auto}
.qlgo.cont{background:#f0a020;border-color:#f0a020}
.qlgo.gray{background:#fff;border-color:#c9c4b8;color:#6b675f}
.jochip{font-size:10.5px;border-radius:999px;padding:1px 8px;background:#f3ecfd;color:#7a3ed0;
  border:1px solid #e3d9f7;cursor:pointer}
.jowon{font-size:11px;border-radius:6px;padding:2px 9px;border:1px solid #e3d9f7;background:#fff;
  color:#7a3ed0;cursor:pointer;margin:6px 6px 0 0}
.jowon.dead{color:#a5a19a;border-color:#eeece6;cursor:default}
.pantog{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#f2f6fd;
  border:1px solid #d5e2f6;border-radius:9px;padding:5px 10px;margin-bottom:8px}
.pantog .pl{font-size:11px;color:#456;font-weight:700}
.qmun{font-weight:700;font-size:13.5px;margin:2px 0 9px}
.oxrow{border-top:1px dashed #eeece6;padding:9px 0}
.oxq{font-size:13.3px;line-height:1.6}
.oxq b{color:var(--exc)}
.oxpick{display:flex;gap:9px;margin-top:8px}
.oxbtn{flex:1;border:1px solid #d9d6ce;border-radius:9px;background:#fff;padding:6px 0;
  display:flex;gap:7px;align-items:center;justify-content:center;font-size:14px}
.oxbtn:hover{border-color:var(--exc)}
.oxbtn .dot{color:#b5b1a8}
.oxbtn .lv{font-weight:800}
.oxbtn .lv.O{color:var(--exc)} .oxbtn .lv.X{color:var(--rule)}
.oxbtn.sel{border-color:#1a1a1a}
.oxbtn.right{border-color:#3fae64;background:#f0faf3}
.oxbtn.wrong{border-color:var(--rule);background:#fdf0f0}
.oxres{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:7px}
.solpv{margin-top:7px;font-size:11.5px;color:var(--exc);text-decoration:underline}
.qft{display:flex;gap:9px;align-items:center;justify-content:flex-end;
  border-top:1px dashed #eeece6;margin-top:9px;padding-top:7px}
.memolink{font-size:11.5px;color:#8a867d;cursor:not-allowed}

.gh.yh{display:flex;flex-direction:column;gap:3px;align-items:stretch;padding:3px 4px}
.ysort{font-size:11px;font-weight:700;color:#666;padding:2px 0;border-radius:5px;white-space:nowrap}
.ysort:hover{background:#e8e5dd;color:var(--exc)}
.ysel{font-size:10.5px;padding:1px 3px;width:100%}
.gr{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 본문 전체 보기(팝업) — 제목 접기 · 단어 메모 ── */
.rbody{margin-top:8px}
.rln{white-space:pre-wrap;word-break:break-word;margin:2px 0;line-height:1.6}
.rh{font-weight:800;margin-top:9px;display:flex;gap:5px;align-items:baseline}
.rh1{font-size:15.5px} .rh2{font-size:14.5px} .rh3{font-size:13.5px}
.rh4,.rh5,.rh6{font-size:13px;color:#555}
/* ★ 판 4 add5 — rtog 는 없앴다(옵시디언식 헤딩 접기 htog 로 통일) */
.pw{cursor:text;border-radius:3px}
.pw:hover{background:#fff6cf}
.pword{border-bottom:2px dotted #d9be4a}
.pmark{display:inline-block;width:8px;height:8px;border-radius:2px;background:#f0d84a;
  border:1px solid #d9be4a;vertical-align:5px;margin-left:2px}
.memoin{width:100%;min-height:74px;font:inherit;font-size:12.5px;padding:7px 9px;
  border:1px solid #d9d6ce;border-radius:8px;resize:vertical;background:#fffdf3}
.memobtn{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.cbody .ch1,.cbody .ch2{font-weight:800}
.cbody .ch3,.cbody .ch4{font-weight:700;color:#333}

.rbody.card{max-height:none}
.rbody.card .rln{font-size:11px;line-height:1.5;margin:1px 0}
.rbody.card .rh1{font-size:12.5px} .rbody.card .rh2{font-size:12px}
.rbody.card .rh3,.rbody.card .rh4{font-size:11.5px}
.rbody .ln{position:relative}
.rbody .ln,.ntrow > .ln.mdh1,.ntrow > .ln.mdh2,.ntrow > .ln.mdh3{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}   /* ★ 판 4 add5 §2 — iOS 길게 누르기가 글자 선택으로 새지 않게(메뉴가 뜬다) */
.rbody.card .ln.mdh1{font-size:12.5px;margin:6px 0 2px} .rbody.card .ln.mdh2{font-size:12px;margin:5px 0 2px} .rbody.card .ln.mdh3{font-size:11.5px;margin:4px 0 1px}
.rbody.card .embx{font-size:11px;padding:4px 26px 4px 8px}
.rtx{cursor:text}
.cell{max-height:420px;overflow:auto}

/* ── 콜아웃(문제·원본) — 접힌 상자 → 팝업 ── */
.callout{display:flex;align-items:center;gap:7px;cursor:pointer;
  border:1px solid #e3cf6a;background:#fffaeb;border-radius:9px;
  padding:6px 11px;margin:6px 0}
.callout:hover{border-color:var(--lbl);background:#fff4d9}
.callout .ci{font-size:12px}
.callout .ct{font-weight:800;color:var(--lbl);font-size:12.5px}
.callout .cn{font-size:10.5px;color:#b09050}
.callout .cx{margin-left:auto;color:var(--lbl)}
.callout.co-note{border-color:#d9d6ce;background:#faf9f6}
.callout.co-note .ct{color:#77736b}
.callout.co-note .cx{color:#a5a19a}
.rbody.card .callout{padding:4px 8px;margin:4px 0}
.rbody.card .callout .ct{font-size:11.5px}

.pop.k-q{border-color:#e3cf6a}

/* ── 팝업(여러 개 · 끌어 옮기기) ── */
.pop{position:fixed;width:440px;max-height:60vh;overflow:auto;
  background:#fff;border:1.5px solid var(--exc);border-radius:11px;
  box-shadow:0 8px 26px rgba(20,40,90,.20);font-size:12.5px}
.pop .ph{display:flex;align-items:center;gap:7px;background:#eaf1fb;color:var(--exc);
  font-size:11px;font-weight:700;padding:5px 10px;position:sticky;top:0;cursor:move;
  user-select:none}
.pop .ph .pdrag{opacity:.65}
.pop .ph .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .ph button{margin-left:auto;color:inherit;font-size:12px;cursor:pointer}
.pop .pb{padding:9px 12px}
.pop.k-fn{border-color:#d9be4a}
.pop.k-fn .ph{background:var(--post);color:#7a6a17}
.pop.k-cell{border-color:#2f9e57}
.pop.k-cell .ph{background:#e9f7ee;color:var(--ok)}
/* 제목 단계 들여쓰기가 눈에 들어오게 세로선 */
.rbody .rh{border-left:2px solid #eeece6;margin-left:0}
.rbody .rh1{border-left-color:var(--exc)}
.rbody .rh2{border-left-color:#c9d7ef}
.rbody .rh3,.rbody .rh4{border-left-color:#eeece6}

/* ══ 마크업 스티커 (§3) — 편집 모드를 켜야만 잡힌다 ══ */
.stkon .stk{outline:1px dashed rgba(47,111,208,.55);outline-offset:1px;
  border-radius:3px;cursor:pointer}
.stkon .stk:hover{outline-color:var(--exc);background:#eaf1fb}
.stkon .box .ln{cursor:text}
.stkbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#f2f6fd;
  border:1px solid #d5e2f6;border-radius:9px;padding:5px 10px;margin-top:8px;font-size:11.5px;color:#456}
.swatch{width:19px;height:19px;border-radius:5px;border:1px solid #c9c5bc;display:inline-block;cursor:pointer}
.swatch.on{outline:2px solid var(--exc);outline-offset:1px}
.stkgrid{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.orphan{background:#fde9e9;color:var(--rule)}

/* ══ 1차객 풀이 · 히트맵 (§7·§9 · 5상태) ══ */
.hmdot{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:-1px;margin-right:3px}
.hmdot.s0{background:#D3D1C7}.hmdot.s1{background:#1D9E75}.hmdot.s2{background:#EF9F27}
.hmdot.s3{background:#E24B4A}.hmdot.s4{background:#F5E06A}
.hmwrap{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:#fff}
/* ★ v3-F4 (8/27) — 머리 줄 = 민법OX 「진행 히트맵」 실측 그대로 */
.hmhd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:#666}
.hmhd .pl{font-size:11px;font-weight:800;color:#4b5563}
.hmlg{white-space:nowrap;font-size:10px;font-weight:700;color:#6b7280}
.hmlg+.hmlg{margin-left:2px}
.hmscs{display:flex;flex-wrap:wrap;gap:4px}
.hmsc{font-size:10px;line-height:1.4;padding:2px 6px;border-radius:4px;border:1px solid #d1d5db;
  background:#fff;color:#6b7280;font-weight:700;white-space:nowrap}
.hmsc:hover{border-color:#6b7280}
.hmsc.on{background:#1f2937;color:#fff;border-color:#1f2937}
.hmsc b{font-weight:800;color:#1f2937}
.hmsc.on b{color:#fff}
.hmsp{flex:1}
.hmfold{border:0;background:none;padding:0;font-size:10px;font-weight:700;color:#9ca3af;flex-shrink:0}
.hmfold:hover{color:#4b5563}
.hmcv{width:100%;display:block;cursor:pointer}
.qwrap.hmhit{outline:2px solid var(--exc);outline-offset:2px}
/* ══ 같은 판례·조문 · 암기카드 (2026-08-26) ══ */
.lnkrow{display:flex;align-items:center;gap:6px;padding:5px 2px;border-bottom:1px solid var(--line);
  cursor:pointer;font-size:12px}
.lnkrow:hover{background:#f4f7fd}
.lnkt{color:#444;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcbox{border:1px solid var(--line);border-radius:8px;padding:7px;margin:7px 0;background:#fafafa}
.mchd{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.mcnm{flex:1;min-width:0;font-size:11.5px;font-weight:700;color:#374151;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mczoom{position:relative;overflow:hidden;background:#fff;border-radius:6px;touch-action:none;cursor:grab}
.mczin{transform-origin:0 0;will-change:transform}
.mcdrop{border:2px dashed #93c5fd;border-radius:9px;background:#f8fafc;padding:11px;
  text-align:center;margin:7px 0}
.mcdrop.on{background:#eff6ff}
.mcdt{font-size:12px;font-weight:800;color:#1d4ed8;margin-bottom:3px}
/* ══ 필기 (§4) ══ */
.inkhost{position:relative}
.inklay{position:absolute;left:0;top:0;z-index:5;pointer-events:none;touch-action:pan-y}
/* ★ 펜이 닿아 있는 동안만 스크롤을 꺼둔다 — 손가락은 그대로 밀린다 */
.inklay.penning{touch-action:none}
body.inkon .inkhost{-webkit-user-select:none;-webkit-touch-callout:none}
/* ⚠ #app 이 아니라 body 에 건다 — 팝업(2차 셀)은 body 밑이라 #app 밑이 아니다 */
body.inkon .inklay{pointer-events:auto}
body.inkon .main,body.inkon .pop{user-select:none}
.inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:65;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;
  border:1.5px solid var(--exc);border-radius:13px;padding:7px 12px;
  box-shadow:0 8px 26px rgba(20,40,90,.20);font-size:12px;color:#456;max-width:94vw}
.inkbar .sep{width:1px;height:18px;background:#e3e0d8}
.inkw{width:22px;height:22px;border-radius:50%;border:1px solid #d9d6ce;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.inkw.on{border-color:var(--exc);background:#eaf1fb}
.inkw i{display:block;border-radius:50%;background:#1a1a1a}
.inkhint{font-size:10.5px;color:#9a958b}

/* ══ 알림 (toast) ══ */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:90;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#1a1a1a;color:#fff;border-radius:9px;padding:7px 15px;font-size:12.5px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:88vw}
.toast.bad{background:#8a1f1f}

/* ══ 기록 내보내기 (§10) ══ */
.rectab{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0}
.rectab td,.rectab th{border-bottom:1px solid #eeece6;padding:3px 6px;text-align:left}
.rectab td.n{text-align:right;font-variant-numeric:tabular-nums}
/* ══ v3-C — 회독 채점표 · 페이지 바 (2026-08-26 밤) ══ */
.rchip{display:inline-block;border:1px solid #d9d6ce;border-radius:7px;background:#fff;
  padding:1px 8px;font-size:11.5px;color:#345;cursor:pointer;margin:0 3px 3px 0}
.rchip:not(.dead):hover{border-color:var(--exc);color:var(--exc)}
.rchip.dead{color:#c2beb6;background:#f4f2ec;border-color:#e5e2da;cursor:default}
.rndblk{border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin:7px 0;background:var(--paper)}
.rndhd{font-weight:700;font-size:12px;margin-bottom:4px}
.pgbar{position:sticky;bottom:0;z-index:5;background:var(--panel);
  box-shadow:0 -4px 12px rgba(0,0,0,.07);margin-top:12px}
.pgbig{font-weight:700;border-radius:9px;padding:6px 16px;border:1px solid var(--exc);
  background:var(--exc);color:#fff}
.pgbig:hover{opacity:.92}
.oxmiss{outline:2px solid var(--rule);outline-offset:2px}
/* ══ v3-E §1-3 — 정리OMR 뷰어 ══ */
.omrbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 12px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.omrstage{flex:1;position:relative;overflow:hidden;background:#dedbd2;
  touch-action:none;cursor:grab;min-height:0}
.omrstage:active{cursor:grabbing}
.omrin{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;
  box-shadow:0 3px 18px rgba(0,0,0,.22)}
.omrin img.omrtile{position:absolute;pointer-events:none;user-select:none;display:block}
.omrpin{position:absolute;border:1px solid rgba(47,111,208,.8);
  background:rgba(47,111,208,.08);border-radius:2px;cursor:pointer;z-index:3}
.omrpin:hover{border-color:#1a1a1a;border-width:1.5px}
.omrpin.user{border-color:rgba(122,62,208,.9);background:rgba(122,62,208,.10)}
.omrpin.s1{background:rgba(29,158,117,.16)}
.omrpin.s2{background:rgba(239,159,39,.18)}
.omrpin.s3{background:rgba(226,75,74,.18)}
.omrpin.s4{background:rgba(245,224,106,.22)}
/* ══ v3-F — 배지줄 정리 · 팝업 카드 · 알약 · 📍 좌표기억 ══ */
.qsub{font-size:10.5px;color:#8a867d;margin:2px 0 4px;padding-left:4px}
.qexp{cursor:pointer}
.pintag{border:1px solid #b8860b !important;color:#b8860b}   /* ★ v3-F3 ② — want 는 이 클래스를 안 쓴다 */
.pintag.has{border-style:solid !important;background:#fdf1e3}
.pintag.stale{border-style:solid !important;border-color:var(--rule) !important;color:var(--rule);background:#fdf0f0}
.oxpill{position:fixed;right:18px;bottom:112px;z-index:56;display:flex;gap:6px;align-items:center;
  background:#fff;border:1px solid var(--exc);border-radius:999px;padding:4px 12px;
  font-size:11.5px;color:#345;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.lnkline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:#6b675f;margin-top:4px}
.lnkline .go{border:1px solid #d9d6ce;border-radius:7px;padding:0 7px;background:#fff;font-size:11px;color:#345}
.lnkline .go:hover{border-color:var(--exc);color:var(--exc)}
.omini{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:8px;
  touch-action:none;cursor:grab}
.omini:active{cursor:grabbing}
.ominiin{position:absolute;left:0;top:0;transform-origin:0 0}
.omini img{position:absolute;display:block;pointer-events:none;user-select:none}
.omini .hl{position:absolute;border:2px solid #f0a020;background:rgba(240,160,32,.15);border-radius:3px}
/* ══ v3-F §8 — 조문 탭 오른쪽 「정오문제」 패널 ══ */
.jopane{flex-shrink:0;border-left:1px solid var(--line);overflow:auto;
  background:var(--paper);padding:0 10px 60px}
.jopane .qwrap{margin-top:8px}
.jopane .ctrlbar{position:sticky;top:0;z-index:2;margin:0 -10px;background:var(--panel)}
/* ══ v3-D — 순번 · OMR · 채점 결과 (2026-08-27) ══ */
.oxseq{font-size:14px;margin-right:2px}
.rchip.ok{border-color:#3fae64;color:#1d7a3e;background:#f0faf3}
.rchip.bad{border-color:#E24B4A;color:#b02a2a;background:#fdf0f0}
.rchip.off{color:#8a867d;background:#f4f2ec;border-color:#e5e2da}
.rndhd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rsltscore{display:flex;gap:10px;align-items:baseline;margin:2px 0 8px}
.rsltscore b{font-size:24px}
.omrno.wide{width:auto;min-width:74px;white-space:nowrap;text-align:left}
/* ★ 채점결과분석 세 구간(2026-09-16 · jopangi/_task_cha2_report.md §C-4) — 색·크기 = 시안 mockup_cha2_report_v1.html 변수 그대로(다크는 9/18 사용자 요청으로 없앰 — 기기 다크 설정과 무관하게 늘 라이트 · 앱 본체와 같게)
   이름은 c2r- 로 시작한다 — 앱 전역 .chip · .col · .hd · .st 가 이미 있어서(두 앱 같은 글자) */
.c2r{--c2r-bg:#fafaf7;--c2r-fg:#1d1d1b;--c2r-dim:#6b6b66;--c2r-line:#d9d7cf;--c2r-card:#fff;--c2r-head:#f1efe8;--c2r-o:#2e7d5b;--c2r-ob:#e3f3ea;--c2r-d:#b07a00;--c2r-db:#fff3cc;--c2r-x:#c62828;--c2r-xb:#fde2e0;--c2r-must:#1f5fd6;--c2r-mustb:#e4ecfb;
 container-type:inline-size;background:var(--c2r-bg);color:var(--c2r-fg);font:13px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",Pretendard,system-ui,sans-serif;text-align:left;padding:8px;border-radius:10px}
.c2r *{box-sizing:border-box}
.c2r .c2r-sub{color:var(--c2r-dim);font-size:12px;margin:0 0 10px}
.c2r .c2r-sub b{color:var(--c2r-fg)}
.c2r .c2r-sec{background:var(--c2r-card);border:1px solid var(--c2r-line);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.c2r .c2r-sec>h2{font-size:12px;letter-spacing:.06em;color:var(--c2r-dim);margin:0 0 10px;font-weight:600}
.c2r .c2r-sec>h2 span{color:var(--c2r-fg);font-size:15px;letter-spacing:0;margin-right:8px;font-weight:700}
.c2r table{border-collapse:collapse;width:100%}
.c2r th,.c2r td{border-bottom:1px solid var(--c2r-line);padding:5px 8px;text-align:left;vertical-align:top}
.c2r th{background:var(--c2r-head);font-weight:600;font-size:12px;white-space:nowrap}
.c2r td.c2r-n,.c2r th.c2r-n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.c2r td.c2r-cur,.c2r th.c2r-cur{background:var(--c2r-mustb)}
.c2r .c2r-chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap;margin:0;border:0}
.c2r .c2r-o{background:var(--c2r-ob);color:var(--c2r-o)}
.c2r .c2r-d{background:var(--c2r-db);color:var(--c2r-d)}
.c2r .c2r-x{background:var(--c2r-xb);color:var(--c2r-x)}
.c2r .c2r-rev{background:var(--c2r-xb);color:var(--c2r-x);border:1px solid var(--c2r-x)}
.c2r .c2r-wrap{overflow-x:auto}
.c2r .c2r-tot{font-size:16px;font-weight:800}
.c2r .c2r-rg{color:var(--c2r-dim);font-size:11px;font-weight:400}
.c2r .c2r-sl{font-size:11px;color:var(--c2r-dim);font-weight:400;white-space:nowrap;line-height:1.5;text-align:left}
.c2r .c2r-sl i{font-style:normal;color:var(--c2r-x);font-weight:700}
.c2r .c2r-tags{margin-top:8px;font-size:12px;color:var(--c2r-dim)}
.c2r .c2r-q{margin:14px 0 6px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.c2r .c2r-q small{color:var(--c2r-dim);font-weight:400}
.c2r .c2r-cols{display:grid;grid-template-columns:1.1fr repeat(var(--c2rn,2),1fr);gap:10px}
.c2r .c2r-col{border:1px solid var(--c2r-line);border-radius:8px;overflow:hidden;background:var(--c2r-card);min-width:0}
.c2r .c2r-hd{background:var(--c2r-head);padding:6px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--c2r-line);display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-left:0;margin:0;color:var(--c2r-fg)}
.c2r .c2r-hd small{color:var(--c2r-dim);font-weight:400}
.c2r ol.c2r-ol{margin:0;padding:8px 10px 8px 22px;font-size:13px;line-height:1.6;list-style:none}
.c2r ol.c2r-ol>li{margin:2px 0 8px;font-weight:700;display:list-item}
.c2r ol.c2r-ol>li em{font-style:normal;color:var(--c2r-dim);font-weight:400;font-size:12px;margin-left:4px}
.c2r ol.c2r-ol ol{list-style:none;padding-left:0;margin:2px 0 0;font-weight:400}
.c2r ol.c2r-ol ol li{padding:1px 0;display:list-item;border:0}
.c2r li.c2r-out{color:var(--c2r-dim)}
.c2r li.c2r-none{color:var(--c2r-dim);font-size:12px}
.c2r li.c2r-miss{color:var(--c2r-x);margin-top:4px;border-top:1px dashed var(--c2r-line);padding-top:4px}
.c2r ol small{color:var(--c2r-dim);font-size:11px}
.c2r .c2r-pt{color:var(--c2r-dim);font-size:11px;margin-left:4px}
.c2r .c2r-tg{margin-left:auto;display:inline-flex;gap:2px}
.c2r .c2r-tg b{font-weight:600;font-size:11px;padding:0 7px;border:1px solid var(--c2r-line);border-radius:9px;cursor:pointer;color:var(--c2r-dim)}
.c2r .c2r-tg b.on{background:var(--c2r-mustb);color:var(--c2r-must);border-color:var(--c2r-must)}
.c2r table.c2r-cmp td:first-child{width:120px;color:var(--c2r-dim);font-weight:600;white-space:nowrap}
.c2r table.c2r-cmp td{font-size:13px}
.c2r table.c2r-cmp td .c2r-chip{margin-right:4px}
.c2r .c2r-common{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--c2r-xb);font-size:13px}
.c2r .c2r-common b{color:var(--c2r-x)}
.c2r .c2r-common small{color:var(--c2r-dim)}
.c2r code{font-size:12px;background:var(--c2r-head);padding:0 4px;border-radius:3px}
.c2r details.c2r-prose{margin-top:10px}
.c2r details.c2r-prose>summary{cursor:pointer;color:var(--c2r-dim);font-size:12px}
.c2r div.c2r-none{color:var(--c2r-dim);font-size:12px;padding:6px 10px}
@media (max-width:640px){.c2r .c2r-cols{grid-template-columns:1fr}}
@container (max-width:640px){.c2r .c2r-cols{grid-template-columns:1fr}}
/* 9/18 채점결과분석 시안 옮김 (_task_cha2_screen §B-12) — 새 클래스만 더한다 */
.c2r{--c2r-add:#7a6c9a;--c2r-addb:#eee9f6;--c2r-xs:#d9534f}
.c2r .c2r-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--c2r-must);background:var(--c2r-mustb);border-radius:4px;padding:0 3px;margin-right:2px;line-height:1.5;vertical-align:1px}
.c2r .c2r-tag-y{color:var(--c2r-d);background:var(--c2r-db)}
.c2r .c2r-tag-h{color:var(--c2r-add);background:none;padding:0}
.c2r .c2r-tag-m{color:var(--c2r-xs);background:none;padding:0}
.c2r .c2r-tag-w{color:var(--c2r-dim);background:none;padding:0 1px}
.c2r .c2r-ek{font-size:11px;color:var(--c2r-dim);font-weight:400;margin-right:2px}
.c2r .c2r-pj{font-size:11px;font-weight:700;color:var(--c2r-dim);margin-left:2px;white-space:nowrap}
.c2r .c2r-pj i{font-style:normal}
.c2r .c2r-pj i.c2r-jo{color:var(--c2r-o)}
.c2r .c2r-pj i.c2r-jd{color:var(--c2r-d)}
.c2r .c2r-pj i.c2r-jx{color:var(--c2r-x)}
.c2r .c2r-src{display:inline-block;font-size:10px;font-weight:600;color:var(--c2r-add);background:var(--c2r-addb);border-radius:8px;padding:0 6px;line-height:1.6;margin-left:4px}
.c2r .c2r-src:empty{display:none}
.c2r .c2r-hd .c2r-sc{margin-left:auto;font-weight:700;color:var(--c2r-fg)}
.c2r .c2r-sl u{text-decoration:none;color:var(--c2r-xs)}
.c2r li.c2r-sent{color:var(--c2r-dim)}
/* 9/18 add2 — 🔗 = 목차 줄 끝 인라인 칩 · 펼친 목록은 그 줄 안(li.c2r-lk 줄은 없앰) */
.c2r .c2r-lkb{display:inline-block;margin-left:6px;font-size:11px;color:var(--c2r-dim);cursor:pointer;font-weight:400}
.c2r .c2r-lkb:hover{text-decoration:underline}
.c2r ul.c2r-lkl{margin:2px 0 4px 16px;padding:0;list-style:none;font-size:12px}
.c2r .c2r-lkbtn{font-size:11px;font-weight:600;color:var(--c2r-dim);border:1px solid var(--c2r-line);border-radius:9px;padding:0 8px;cursor:pointer;margin-left:8px}
.c2r .c2r-stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.c2r .c2r-cols.c2r-pair{grid-template-columns:1fr 1fr}
@media (max-width:640px){.c2r .c2r-cols.c2r-pair{grid-template-columns:1fr}}
@container (max-width:640px){.c2r .c2r-cols.c2r-pair{grid-template-columns:1fr}}
.c2r .c2r-bl{color:var(--c2r-must);text-decoration:none;background:var(--c2r-mustb);border-radius:6px;padding:0 6px;margin-right:2px;white-space:nowrap;display:inline-block;line-height:1.7}
.c2r .c2r-bl small{color:var(--c2r-dim);margin-left:3px}
/* E-7 — 아이패드(768) 폭에서도 1열. 기존 640 규칙(윗 블록)은 그대로 두고 새 규칙만 더한다 · render_a.py 는 900 */
@media (max-width:900px){.c2r .c2r-cols,.c2r .c2r-cols.c2r-pair{grid-template-columns:1fr}}
@container (max-width:900px){.c2r .c2r-cols,.c2r .c2r-cols.c2r-pair{grid-template-columns:1fr}}
/* ① 점수 표 이름 칸 — render_a.py `.st .who b{display:block}` · 새 규칙만 더한다 */
.c2r table.c2r-st td:first-child{white-space:nowrap}

/* ══════════ _task_jo_gaek_mb §A-2 — 목차 서랍(민법OX `#tree` 꼴) ══════════
   px 는 민법 실물 계산 스타일 실측(2026-09-21 · jo/_px_mb2.py) · 색만 조판기 색.
   ⚠ 자리는 **세로 탭(.rail) 의 오른쪽 형제**다 — 민법은 `position:fixed;left:0` 이지만
     ★ hrail(9/22) — 세로 탭을 걷어 서랍은 이제 .body2 맨 왼쪽(x 0)이다(형제 자리 그대로).
     조판기 껍데기는 `.body2` 가 flex 라, fixed 로 두면 세로 탭을 덮거나 그 너비를 박아야 한다.
     형제로 두면 덮지 않고 px 는 그대로다(다르게 한 것 · 보고에 적는다).
   ⚠ `--trw` 는 조판기가 이미 쓴다(옛 트리) — 서랍은 `--jtrw` 를 쓴다. */
#jtree{width:var(--jtrw,272px);flex-shrink:0;position:relative;background:var(--paper);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  box-shadow:2px 0 12px rgba(0,0,0,.10)}
#jtree.fold{width:13px}
#jtree.fold .jthead,#jtree.fold #jtlist,#jtree.fold .jtfoot{display:none}
#jtree .jthead,#jtree #jtlist,#jtree .jtfoot{margin-right:13px}
#jtree .jthead{display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  padding:8px 8px 7px 10px;border-bottom:1px solid var(--line)}
#jtree .jthead button{padding:2px 7px;border:1px solid var(--line);border-radius:6px;font-size:11px;
  font-weight:700;color:var(--sub);background:var(--paper);white-space:nowrap;cursor:pointer}
#jtree .jthead button.on{background:#2b2a27;border-color:#2b2a27;color:#fff}
#jtree .jthead button.jtnow{margin-left:auto;color:var(--exc);border-color:#c3d6f0;background:#eef4fc}
#jtlist{flex:1;overflow-y:auto;padding:4px 0;font-size:12px;overscroll-behavior:contain}
#jtgrip{position:absolute;right:0;top:0;bottom:0;width:13px;border-left:1px solid var(--line);
  background:var(--panel);display:grid;place-items:center;color:#a5a19a;font-size:13px;
  cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none}
#jtgrip:hover{color:var(--exc);background:#eef4fc}
.jtch{display:flex;gap:5px;align-items:center;padding:4px 10px;cursor:pointer;
  font-weight:800;color:var(--ink);background:var(--panel);margin-top:5px;
  white-space:nowrap;overflow:hidden}
.jtch .n{margin-left:auto;font-size:10px;color:#9a958b;font-weight:700;flex:none}
.jtch.cur{color:var(--exc)}
.jtch.d2{background:transparent;font-size:11.5px;padding-left:16px;margin-top:2px}
.jtit{padding:3px 10px 3px 20px;cursor:pointer;border-left:3px solid transparent}
.jtit:hover{background:rgba(0,0,0,.04)}
.jtit.cur{border-left-color:var(--exc);background:#eef4fc}
.jtit.off{opacity:.38;cursor:default}
.jtit.off:hover{background:none}
.jtit .l1{display:flex;gap:5px;align-items:baseline}
.jtit .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.jtit .n{font-size:10px;color:var(--sub);font-weight:700;flex:none}
.jtit .now{font-size:9px;font-weight:800;color:#fff;background:var(--exc);border-radius:3px;
  padding:0 3px;flex:none}
/* ⚠ `.jtbar` 는 조판기가 이미 쓴다(조문 목차 장 줄 · 396줄) — 그 이름을 쓰면 그 줄이 4px 로 눌린다.
   그래서 서랍 막대만 `.jdbar` 로 간다(2026-09-21 실측 · memory: 한 파일 앱엔 이름 충돌부터). */
.jdbar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:#eee;margin:2px 0 0 0}

.jtchip{position:relative;font-size:9px;font-weight:800;line-height:1;padding:2px 4px;

.jtchip.done{border-color:var(--exc);color:var(--exc)}

/* ══════════ _task_jo_gaek_mb §C-9·11·14·15 — 지문 카드를 민법OX 꼴로 ══════════
   px 는 민법 실물 계산 스타일 실측(2026-09-21 · jo/_px_mb2.py) · 색만 조판기 색. */
.qwrap.mbq{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);

/* 회독 이력 줄 (§C-11) — 민법 recStripHTML 그대로. △ 는 **표시**다(단추가 아니다) */
.mbrec{margin:4px 0;padding:4px 8px;border-radius:8px;border:1px dashed #e0d2ef;

/* 지문 줄 (§C-9) */
.mbq .oxq{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mbqlab{font-size:13px;font-weight:800;color:var(--exc);white-space:nowrap;padding-top:1px;flex:none}
.mbqtx{font-size:13px;font-weight:500;color:var(--ink);line-height:21.125px;flex:1;min-width:0}
/* 아랫줄 하나 (§C-14) — 큰 O/X 상자는 안 만든다 */
.mbbot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.mbpeek{font-size:11px;font-weight:700;line-height:16.5px;padding:2px 8px;border-radius:4px;
  border:1px solid #c9d2ee;background:#eef1fb;color:#3f3aa0;white-space:nowrap;cursor:pointer}

  width:26px;height:22px;border-radius:6px;border:1px solid #cfcabf;background:var(--paper);

/* 아랫줄이 ✏️ 연결을 맡는다 — 옛 카드 발(「✏ 메모 및 유사문제 연결」 줄)은 숨긴다 */

   민법 실물 값 실측(2026-09-21) · 색만 조판기 색. 화면 고정(fixed)이 아니라

   ⚠ _add1 — 민법 실물의 아래 막대 셋은 가로 한 줄을 다 차지해 서로 덮고, 뒤 상자의 빈 부분이
     누름을 가로챈다(사용자 9/21 「맨 밑으로 내려야만 이전이 눌린다」). **그 결함은 안 옮긴다** —

<script>
"use strict";
const DATA='data/';
const LAWS=['특허법','상표법','디자인보호법','민사소송법'];
const SHORT={'특허법':'특허','상표법':'상표','디자인보호법':'디보','민사소송법':'민소'};
/* ★ 상표 판 3 (2026-09-03 · _task_sang_prec_app.md) — 판례 갤리 데이터 파일명은 S.law 로 짠다(특허 갤리 코드 그대로 · 상표 = 같은 꼴 JSON) */
const PLAW=()=>SHORT[S.law]||'특허';
const PFL=(law,n)=>'prec_'+(SHORT[law]||PLAW())+'_'+n+'.json';   /* ★ 손질 8 — §2 법을 주는 PF */
const PF=n=>'prec_'+PLAW()+'_'+n+'.json', NF=()=>'note_'+PLAW()+'.json', JMF=()=>'jimun_'+PLAW()+'.json', CHF=k=>'2cha_본문_'+(k||'사례')+'_'+PLAW()+'.json';
const PREC_RAWDIR={특허:'특허판례원본',상표:'상표판례원본',디보:'디자인판례원본',민소:'민소판례원본'};
// 갈래 이동은 **세로 레일 하나만** 한다. 상단 갈래 탭은 없앴다 —
// 리담 실물이 그렇고(lidamuistructure.md §25) 레일과 3개가 겹쳤다. 8/23 사용자 결정.
// ★ 8/23 → 9/22 가로 탭으로 — 사용자 9/22 19:18 확정(_task_jo_hrail_list §0). 세로 레일은 걷고 같은 칸·수를
//   머리 첫 줄 「민소」 칩 오른쪽 #hrail 에 그린다(drawRail·railCounts 그대로 · 그리는 자리만 바뀜).
const RAILS=[['jo','조문'],['prec','판례'],['jimun','1차객'],['cha2','2차'],
             ['omr','정리']];   // ★ v3-E §1-3 — 📖 정리(특허만)
// 정본 시행일 — 사양서 §2-1 정본 MST 표
const SIHAENG={'특허법':'2025-11-11','상표법':'2025-11-11',
               '디자인보호법':'2025-11-11','민사소송법':'2025-03-01'};
// 조문 안의 모드 바(리담식). 빈칸은 갈래가 아니라 **이 조문의 모드**다.
const JOMODES=[['본문','본문'],['내용','✎ 내용 빈칸'],['주체','✎ 주체 빈칸'],
               ['기간','✎ 기간 빈칸'],['소제목','소제목만']];

const S={law:'특허법',tab:'jo',jo:null,prec:null,precTab:'요약',
         // 기본 갈래 = 기출 고정(§6-2 ④). 민소도 예외를 두지 않는다.
         // ⚠ 탭 바가 사라지던 것은 기본값이 아니라 붙이는 순서 탓이다 — 그쪽을 고쳤다.
         boardKind:'기출',treeHid:false,listHid:false,
         precSort:'asc',precQ:'',precFilter:{},precJump:null,labels:true,joMode:'본문',   /* ★ 판 3 §3-4 */
         listW:262,precYG:{},precJumpRow:null,   /* ★ 판 4 — 2단 폭 · 연도 묶음 접힘 · 요약 줄 점프 */
         mdFold:{},embFold:{},popCfg:{},   /* ★ 판 4 add2 — 헤딩 접힘(jopangi_ui.md_fold) · 임베드 접힘(embed_fold) · 팝업 크기(pop_<종류>) */
         jimunTab:'ox',mok:null,year:null,oxFilter:'all',oxQueue:'',mgFold:{},
         // ★ v3-C §6-2 — 마디 화면 쪽 번호. null = 마디에 막 들어왔다(첫 미채점 쪽으로)
         oxPage:null,oxPageJump:false,
         omrPage:1,omrPick:null,   // ★ v3-E §1-3 — 정리OMR 쪽 · 위치 찍기 모드
         // ★ v3-F §8 — 조문 탭 정오문제 패널(조를 바꿔도 열린 채 따라간다)
         joPanel:false,joPanelF:'all',joPanelN:3,joPanelP:0,joPanelW:340,
         // ★ v3-F3 ④ — 히트맵 범위(마디 바꿔도 유지) · 접기(jopangi_ui 에도 기억)
         heatScope:'self',heatFold:false,
         series:'',yearFilter:'',yearSort:'desc',zoom:0.55,   /* ★ hrail(9/22) §C-3 — 2차 기출·GS 목록 기본 = 회차 내림(옛 격자 기본 'asc') */
         // §3 마크업 스티커 편집 모드 · §4 필기 모드 — 둘 다 기본은 꺼짐(T5)
         stick:false,ink:false,inkColor:'#D93B3B',inkW:2,inkErase:false,
         // ★ 1차객 열 너비(8/26) — 손잡이를 끌어 바꾼다. 기기마다 다르므로 기록층 밖에 둔다.
         qlNmW:228,qlRdW:168,
         treeW:212,   // ★ v3-J §0-2 — 조문·판례 트리 너비(법 무관 하나 · jopangi_ui.trw)
         // ★ v3-L §1 — 빈칸 모드 다중선택 · ★ 중요 빈칸만(jopangi_ui 에 기억 · 조 바꿔도 유지)
         joBlank:{내용:false,주체:false,기간:false},joBlankStar:false};
const UI_KEY='jopangi_ui';   // ⚠ `jopangi.` 접두가 아니다 — 기록 내보내기·건수에서 빠진다
try{const u=JSON.parse(localStorage.getItem(UI_KEY)||'{}');
    if(u.nmw>0)S.qlNmW=u.nmw;if(u.rdw>0)S.qlRdW=u.rdw;
    if(u.jpw>0)S.joPanelW=u.jpw;if(u.hfold)S.heatFold=true;
    if(u.trw>0)S.treeW=u.trw;   /* ★ v3-J §0-2 */
    if(u.jbk)S.joBlank=Object.assign({내용:false,주체:false,기간:false},u.jbk);
    if(u.jbs)S.joBlankStar=true;
    if(u.prec_filter&&typeof u.prec_filter==='object')S.precFilter=u.prec_filter;   /* ★ 판 3 §3-4 */
    if(u.prec_sort)S.precSort=u.prec_sort;
    if(u.lsw>0)S.listW=u.lsw;if(u.prec_ygroups&&typeof u.prec_ygroups==='object')S.precYG=u.prec_ygroups;   /* ★ 판 4 */
    if(u.md_fold&&typeof u.md_fold==='object')S.mdFold=u.md_fold;if(u.embed_fold&&typeof u.embed_fold==='object')S.embFold=u.embed_fold;
    ['note','list','prec','toc','link','canvas','claude','jn'].forEach(k=>{if(u['pop_'+k]&&typeof u['pop_'+k]==='object')S.popCfg[k]=u['pop_'+k];});   /* ★ 판 4 add2 */   /* ★ linkwin §2 — link(창 넷) */
    if(u.omr&&typeof u.omr==='object')S.omrPos=u.omr;   /* ★ 기출뷰 손질 3 — OMR 자리 */
    if(u.cha2_filter&&typeof u.cha2_filter==='object')S.cha2Filter=u.cha2_filter;if(u.cha2_sort)S.cha2Sort=u.cha2_sort;   /* ★ 2차 탭 판 1 — §4-2 필터·정렬 = 표시층(jopangi_ui) */}catch(e){}   /* ★ v3-L §1 */
/* ★ gaek_mb §A-2 — 목차 서랍 기억. `jopangi_ui` 안(기기별 · 동기화 밖 · 민법도 기기별이다) */
try{const u2=JSON.parse(localStorage.getItem(UI_KEY)||'{}');
    if(u2.jt_w>0)S.jtW=u2.jt_w; if(u2.jt_fold)S.jtFold=true;
    if(u2.jt_ch&&typeof u2.jt_ch==='object')S.jtCh=u2.jt_ch;}catch(e){}
S.jtCh=S.jtCh||{};
try{const u3=JSON.parse(localStorage.getItem(UI_KEY)||'{}');
    if(u3.mk_off)S.mkOff=true;
    if(u3.hm_top)S.hmTop=String(u3.hm_top);}catch(e){}   /* ★ gaek_mb §C-12 · add1 §C */
try{const u4=JSON.parse(localStorage.getItem(UI_KEY)||'{}');
    if(u4.c2ord==='round'||u4.c2ord==='unit')S.c2ord=u4.c2ord;}catch(e){}   /* ★ hrail(9/22) §C-1 — 2차 보드 차례(회차별│단원별) */
function uiSave(){try{localStorage.setItem(UI_KEY,JSON.stringify(
  {nmw:S.qlNmW,rdw:S.qlRdW,jpw:S.joPanelW,hfold:S.heatFold?1:0,trw:S.treeW,
   jbk:S.joBlank,jbs:S.joBlankStar?1:0,
   prec_filter:S.precFilter||{},prec_sort:S.precSort,
   lsw:S.listW,prec_ygroups:S.precYG||{},
   md_fold:S.mdFold||{},embed_fold:S.embFold||{},pop_note:S.popCfg.note||null,pop_list:S.popCfg.list||null,pop_prec:S.popCfg.prec||null,pop_toc:S.popCfg.toc||null,pop_link:S.popCfg.link||null,pop_canvas:S.popCfg.canvas||null,pop_claude:S.popCfg.claude||null,pop_jn:S.popCfg.jn||null,omr:S.omrPos||null,cha2_filter:S.cha2Filter||{},cha2_sort:S.cha2Sort||'',jt_w:S.jtW||0,jt_fold:S.jtFold?1:0,jt_ch:S.jtCh||{},mk_off:S.mkOff?1:0,hm_top:S.hmTop||'',c2ord:S.c2ord||'round'}));}catch(e){}}   /* ★ 판 3 §3-4 · 판 4 · add2 */
const C={};
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;
                   if(x!=null)n.textContent=x;return n;};

async function get(name){
  if(C[name])return C[name];
  const r=await fetch(DATA+name);
  if(!r.ok)throw new Error(name+' '+r.status);
  return C[name]=await r.json();
}

/* ══════════ 골격 ══════════ */
function drawTop(){
  const lw=$('#laws');lw.innerHTML='';
  LAWS.forEach(L=>{const b=el('button','pill'+(S.law===L?' on':''),SHORT[L]);
    b.onclick=()=>{S.law=L;S.jo=null;S.prec=null;pfClearY();   /* ★ prec3 §A-5 — 법을 바꾸면 고른 회차를 비운다 */
      if(S.tab==='jimun'&&L==='민사소송법')S.tab='jo';render();};lw.appendChild(b);});
  const lt=$('#lblToggle');
  // ⚠ 라벨 전체 토글도 글자 수를 바꾼다 — 필기가 있으면 잠근다(§4-2)
  const lock=S.tab==='jo'&&(S.ink||inkHas('jo|'+S.law+':'+S.jo));
  lt.textContent='🏷 라벨: '+(S.labels?'펴짐 ▾':'접힘 ▸')+(lock?' 🔒':'');
  lt.style.display=S.tab==='jo'?'':'none';
  lt.style.opacity=lock?'.5':'';
  lt.title=lock?'필기가 있어 잠갔다 — 접으면 글자 수가 바뀌어 필기가 어긋난다':'';
  lt.onclick=lock?(()=>toast('필기 때문에 라벨 토글을 잠갔다'))
                 :(()=>{S.labels=!S.labels;render();});

  const it=$('#inkToggle');
  it.textContent=S.ink?'✍ 필기 ON':'✍ 필기';
  it.style.cssText='cursor:pointer'+(S.ink?';background:var(--exc);color:#fff':'');
  it.title='애플펜슬로 쓴다 · 손가락은 스크롤 · 기기 사이에는 안 넘어간다(§4-5)';
  it.onclick=()=>{
    if(!S.ink&&S.stick){S.stick=false;toast('마크업 편집을 끄고 필기를 켰다 — 둘은 같이 못 켠다');}
    S.ink=!S.ink;render();};

  const rb=$('#recBtn');
  rb.textContent='⤓ 기록 '+recTotal();
  rb.title='내보내기·들여오기 — 사파리가 저장분을 지울 수 있다(§10-2)';
  rb.onclick=ev=>popRec(ev);
  /* ★ v3-H §2 — 갈래 법이 바뀌면 그 법을 검색에도 켠다(다른 켜진 것은 안 끈다) */
  SKLAW[S.law]=true;
  skLawPaint();
}
function drawRail(){
  const r=$('#hrail');r.innerHTML='';   /* ★ hrail(9/22) §A-1 — 그리는 자리만 #rail → #hrail(칸·수·켜짐 규칙 그대로) */
  RAILS.forEach(([k,label])=>{
    // 민소는 1차 지문 갈래가 없다 — 레일에서 숨긴다(사양서 §4-0)
    if(k==='jimun'&&S.law==='민사소송법')return;
    if(k==='omr'&&S.law!=='특허법'&&S.law!=='민사소송법')return;   // ★ v3-E — 정리OMR 은 특허만 · ★ 정리캔버스 — 민소 = 캔버스
    const b=el('button','rb'+(S.tab===k?' on':''));
    b.appendChild(document.createTextNode(label+' '));
    const n=el('b','','');n.dataset.n=k;b.appendChild(n);
    b.onclick=()=>{S.tab=k;render();};
    r.appendChild(b);
  });
  railCounts().then(hdrFit);   /* ★ hrail(9/22) §A-5 — 수가 다 찬 뒤에 첫 줄을 잰다(수 없는 좁은 탭으로 재면 배지가 첫 줄에 남아 줄이 갈린다 · 하네스 실측) */
}
/* ★ hrail(9/22) §A-5 — 머리 첫 줄(로고·법 칩·갈래 탭·배지 여섯)이 한 줄에 안 들면 배지 묶음을
   둘째 줄 검색줄 오른쪽으로 내린다(검색줄 flex:1 · 배지 flex:none). 먼저 첫 줄에 넣어 보고 줄이 갈렸으면 내린다.
   언제 — drawRail 이 railCounts 로 수를 다 채운 뒤(⚠ 그 전에 재면 좁은 탭 기준이라 배지가 첫 줄에 남는다 ·
   수가 차면 #hrail 크기가 직전 보고값과 같아 ResizeObserver 도 안 울린다) · 창 resize · 배지 글자가 바뀔 때(ResizeObserver). */
function hdrFit(){
  const top=document.querySelector('header.topbar'),hb=$('#hbadges'),row=$('#hsrow'),lg=$('header.topbar .logo');
  if(!top||!hb||!row||!lg)return;
  if(hb.parentNode!==top)top.appendChild(hb);
  const a=lg.getBoundingClientRect(),b=hb.getBoundingClientRect();
  if(Math.abs((b.top+b.bottom)/2-(a.top+a.bottom)/2)>6)row.appendChild(hb);
}
async function railCounts(){
  const set=(k,v)=>{const n=$(`[data-n="${k}"]`);if(n)n.textContent=v;};
  try{set('jo',(await get(`jo_${S.law}_목록.json`)).조.length);}catch(e){set('jo','–');}
  try{const p=await get('prec_과목.json');const m=p[SHORT[S.law]];set('prec',m?m.수:0);}catch(e){set('prec','–');}
  if(S.law==='민사소송법')set('jimun','—');
  else{try{
    // ★ 「문제」 = 정답을 넣을 수 있는 지문 하나(사용자 확정 8/26). 문항 묶음이 아니다.

function qlHandle(which,label){
  const off=(which==='tree')?S.treeHid:S.listHid;
  const h=el('div','handle'+(off?'':' drg'),off?'›':'‹');
  h.title=label+' 칸 '+(off?'펴기':'접기')+(off?'':' · 끌면 너비');
  /* 끌었으면 뒤따르는 click 을 삼킨다 — 접기는 「안 끌고 뗀」 때만 */
  h.onclick=()=>{if(h._drag){h._drag=false;return;}
    if(which==='tree')S.treeHid=!S.treeHid;else S.listHid=!S.listHid;render();};
  if(off)return h;                                   // 접힌 칸은 끌 것이 없다
  /* ★ 끌어서 너비(8/26). 목차 손잡이 = 이름칸(--nmw) · 회독 손잡이 = 회독칸(--rdw).
     .qlbox 인라인 변수만 갈아 끼우므로 끄는 동안 render() 는 안 부른다. */
  const isNm=(which==='tree'), MIN=isNm?120:100, MAX=isNm?600:900;
  let x0=0,w0=0,cur=0;
  h.addEventListener('pointerdown',ev=>{
    if(ev.button!==0&&ev.pointerType==='mouse')return;
    x0=ev.clientX;w0=cur=isNm?S.qlNmW:S.qlRdW;h._drag=false;
    try{h.setPointerCapture(ev.pointerId);}catch(e){}
  });
  h.addEventListener('pointermove',ev=>{
    if(!h.hasPointerCapture||!h.hasPointerCapture(ev.pointerId))return;
    const dx=ev.clientX-x0;
    if(!h._drag&&Math.abs(dx)<4)return;
    h._drag=true;
    cur=Math.max(MIN,Math.min(MAX,Math.round(w0+dx)));
    const box=h.parentNode;if(!box)return;
    box.style.setProperty(isNm?'--nmw':'--rdw',cur+'px');
  });
  const end=ev=>{
    try{h.releasePointerCapture(ev.pointerId);}catch(e){}
    if(!h._drag)return;
    if(isNm)S.qlNmW=cur;else S.qlRdW=cur;
    uiSave();
    /* click 이 안 오는 경로(터치 취소 등)를 위해 잠깐 뒤 플래그를 내린다 */
    setTimeout(()=>{h._drag=false;},300);
  };
  h.addEventListener('pointerup',end);
  h.addEventListener('pointercancel',end);
  return h;
}

/* ══ ★ v3-L — 빈칸 모드 엔진 ══

   회독 = kv jopangi.blank(키 = 법:조키 · {n,r,pct,ts,modes}).
   ⚠ w 필드는 안 쓴다 — v3-K 의 w 는 「인용하는 조 수」다(8/27 보고). 중요도 = joPanelIdx
   (지문→조 색인)에서 그 조의 연결 지문 수 · 그 법 상위 1/3(§6-b · 0건 조는 중요 아님). */
// ⚠ 리터럴이다 — REC_PRE(기록층 절)는 이 블록보다 아래에 선언돼 여기서 쓰면 TDZ 로 죽는다.
//   값은 REC_PRE+'blank'/'blanktag' 규약 그대로(내보내기·기록 팝업이 접두로 줍는다).
const BLK_KEY = 'jopangi.blank';
const BLT_KEY = 'jopangi.blanktag';
let BLKREC = null, BLTREC = null, BLKD = {}, BKIMP = null, BKIMPLAW = null;
const BK_COLOR = { 내용: '#2563eb', 주체: '#7c3aed', 기간: '#059669' };   /* ★ v3-O §3 — 기간 = 초록(emerald-600 · 채점 O #16a34a 와 톤 분리) */
function blkAll(){ if (!BLKREC) BLKREC = lsRead(BLK_KEY); return BLKREC; }
function blkPut(k, rec){ const A = blkAll(); A[k] = rec; BLKREC = A; lsWrite(BLK_KEY, A, '✎ 빈칸 회독'); }
function bltAll(){ if (!BLTREC) BLTREC = lsRead(BLT_KEY); return BLTREC; }
function bltPut(k, v){ const A = bltAll();
  if (v) A[k] = { v: v, ts: nowIso() }; else delete A[k];
  BLTREC = A; lsWrite(BLT_KEY, A, '✎ 빈칸 태그'); }
async function blankData(law){
  const s = SHORT[law] || law;
  if (s in BLKD) return BLKD[s];

  return BLKD[s];
}
function bkKindOf(law, jo, ri, b){
  const t = bltAll()[law + ':' + jo + ':' + ri + ':' + b.a];

}
function bkTagged(law, jo, ri, b){
  return !!bltAll()[law + ':' + jo + ':' + ri + ':' + b.a];
}
function bkNorm(s){ return String(s || '').replace(/[\s·ㆍ()（）.。]/g, ''); }
async function bkImportant(){
  if (BKIMP && BKIMPLAW === S.law) return BKIMP;

      .filter(x => x[1] > 0).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
    ns.slice(0, Math.ceil(ns.length / 3)).forEach(x => BKIMP.add(x[0]));
  }catch(e){}
  return BKIMP;
}

async function bkBody(blk, bkJo, bkOn, base){

  eye.onclick = () => {
    shown = !shown;
    eye.textContent = shown ? '👁 정답 숨기기' : '👁 정답 모두 보기';
    inputs.forEach(x => {
      if (x.classList.contains('ok')) return;
      if (shown){ x.dataset.user = x.value; x.value = x.dataset.ans;
                  x.classList.add('reveal'); x.readOnly = true; }
      else { x.value = x.dataset.user || ''; x.classList.remove('reveal'); x.readOnly = false; }
    });
  };
  bar.appendChild(eye);
  const rw = el('button', 'tool', '⚠ 틀린 곳만 다시');

    if (x.classList.contains('bad')){ x.value = ''; x.classList.remove('bad'); } upd(); });
  bar.appendChild(rw);
  const rs = el('button', 'tool', '↻ 다시 풀기');
  rs.onclick = () => { inputs.forEach(x => { x.value = ''; x.readOnly = false;
    x.classList.remove('ok', 'bad', 'reveal'); delete x.dataset.user; });
    shown = false; eye.textContent = '👁 정답 모두 보기'; upd(); };
  bar.appendChild(rs);
  const sv = el('button', 'tool on', '✅ 이 조 채점 · 회독 저장');
  sv.onclick = () => {

    let okN = 0;
    const pk = {};
    inputs.forEach(x => {
      const kk2 = x.dataset.kind || '내용';
      const hit = bkNorm(x.value) === bkNorm(x.dataset.ans);
      (pk[kk2] = pk[kk2] || [0, 0])[1]++;
      if (hit){ pk[kk2][0]++; okN++; }
    });
    const pko = {};
    Object.keys(pk).forEach(kk2 => { pko[kk2] = Math.round(100 * pk[kk2][0] / pk[kk2][1]); });
    const pct = Math.round(100 * okN / inputs.length);

    const hb = document.getElementById('bkbadge');

  bkJo.행.forEach((r, ri) => {

    bs.forEach(b => {

      if (kk === 'none'){ d.appendChild(document.createTextNode(String(b.ans || ''))); return; }
      const col = BK_COLOR[kk] || BK_COLOR.내용;

      if (live){
        const inp = el('input', 'bkin');
        const ln = String(b.ans || '').length;

        inp.addEventListener('keydown', ev => {
          if (ev.key === 'Enter' || ev.key === 'Tab'){
            ev.preventDefault();
            judge(inp);
            const i2 = inputs.indexOf(inp) + (ev.shiftKey ? -1 : 1);
            const nx = inputs[i2];
            if (nx) nx.focus();

        inp.addEventListener('blur', () => { if (inp.value && !inp.readOnly) judge(inp); });
        inp.addEventListener('input', () => {
          if (inp.classList.contains('bad')) inp.classList.remove('bad');
        });

      }else{

        d.appendChild(q);

    });
    if (pos < t.length) d.appendChild(document.createTextNode(t.slice(pos)));

  });
  upd();

}

/* ══════════ 팝업 ══════════ */
/* ══ 팝업 — 여러 개 · 끌어 옮기기 (목업 v3 「팝업은 여러 개, ≡ 로 끌고」)
   ⚠ 지시서 §3-E 는 「팝업 다중/드래그/고정」을 v0 제외로 뒀다.
      8/23 사용자 요구로 켰다. 고정(📌)은 아직 없다 — 다중·드래그만. */
let POPZ = 60, POPS = [];
function dragify(p, hd){
  let sx = 0, sy = 0, ox = 0, oy = 0, on = false;
  hd.addEventListener('mousedown', ev => {
    if (ev.target.closest('button')) return;
    on = true; sx = ev.clientX; sy = ev.clientY;
    ox = parseFloat(p.style.left) || 0; oy = parseFloat(p.style.top) || 0;
    p.style.zIndex = ++POPZ;
    ev.preventDefault();
  });
  addEventListener('mousemove', ev => {
    if (!on) return;
    p.style.left = Math.max(0, Math.min(innerWidth - 60, ox + ev.clientX - sx)) + 'px';
    p.style.top = Math.max(0, Math.min(innerHeight - 34, oy + ev.clientY - sy)) + 'px';
  });
  addEventListener('mouseup', () => { on = false; });
}
/* ★ 상표 손질 5 — 같은 키 팝업은 다시 열면 닫는다(토글) · 다른 키는 겹침 · 위치·크기 규칙 무접촉 */
function popToggle(key){ if (!key) return false; const q = POPS.find(x => x._pk === key); if (q){ closeOne(q); return true; } return false; }
function popShell(kind, title, key){
  const p = el('div', 'pop' + (kind ? ' k-' + kind : '')); p._pk = key || null;
  p.style.zIndex = ++POPZ;
  const hd = el('div', 'ph');
  hd.appendChild(el('span', 'pdrag', '≡'));
  hd.appendChild(el('span', 'pt', title));
  const x = el('button', '', '✕');
  x.onclick = ev => { ev.stopPropagation(); closeOne(p); };
  hd.appendChild(x);
  p.appendChild(hd);
  const body = el('div', 'pb');
  p.appendChild(body);
  document.body.appendChild(p);
  POPS.push(p);
  dragify(p, hd);
  p.addEventListener('mousedown', () => { p.style.zIndex = ++POPZ; });
  /* ★ gaek_mb §24 — 팝업 **전부**에 크기 손잡이(사용자 「반드시」·「조문 팝업 말고도 다」).
     종류 = kind||'pop' · 새 손잡이 코드는 짜지 않고 popSizable 을 기본으로 붙인다.
     다음 틱에 붙이는 까닭 — 부른 쪽이 popShell 바로 뒤에 제 종류로(`'note'`·`'gi'` …)
     popSizable 을 부르면 그쪽이 먼저 `p._sz` 를 차지해 **그 종류가 이긴다**. */
  setTimeout(() => { if (p.isConnected && !p._sz) popSizable(body, kind || 'pop'); }, 0);
  return body;
}
function closeOne(p){
  p.remove();
  POPS = POPS.filter(q => q !== p);
}
function closePop(){                    // 맨 위 하나만 닫는다
  if (POPS.length) closeOne(POPS[POPS.length - 1]);
}
function closeAllPops(){
  POPS.slice().forEach(closeOne);
}
function showPop(ev){
  const p = POPS[POPS.length - 1];
  if (!p) return;
  const w = p.offsetWidth || 440, h = p.offsetHeight || 260;
  // 여러 개를 띄우면 조금씩 어긋나게 쌓는다
  const k = (POPS.length - 1) % 6;
  let x = ev ? ev.clientX + 14 : innerWidth - w - 40;
  let y = ev ? ev.clientY + 14 : 110;
  x = Math.max(8, Math.min(x + k * 22, innerWidth - w - 8));
  y = Math.max(8, Math.min(y + k * 20, innerHeight - Math.min(h, 260) - 8));
  p.style.left = x + 'px';
  p.style.top = y + 'px';
}

/* ══════════ 알림 ══════════
   ⚠ `toast` 는 `popJo`·`popFoot` 과 똑같이 **정의가 없었다**(`memoSave` 가 부르기만 했다).
      §10 의 「쓰기가 실패하면 조용히 넘기지 마라」가 실제로는 안 돌고 있었다. */
function toast(msg, bad){
  const box = $('#toasts'); if (!box) return;
  const d = el('div', 'toast' + (bad ? ' bad' : ''), msg);
  box.appendChild(d);
  setTimeout(() => d.remove(), bad ? 4200 : 2400);
}

const TS_PRE  = REC_PRE + 'ts.';        // 낡은 층(메모)용 갱신시각 짝
/* ★ 8/26 — 층 이름을 사람 말로. 팝업에 「ox · 2」 만 떠서 필기인지 풀이인지 알 수 없었다. */
const REC_NAMES = { ox:'1차객 풀이 (O/X · 헷갈림 · 태그)', rounds:'1차객 회독', ansfix:'정답 정정',

  logic:'📐 논리 (근거로 흡수됨 · 죽은 키)', link:'🔗 지문 연결', type:'🏷 유형 확정', omr:'📖 정리 핀',
  gg:'🔗 근거', ggref:'🔗 근거 연결',
  sticker:'🏷 스티커 사전 (두문자·줄임말)',
  blank:'✎ 빈칸 회독 (O/△/X)', blanktag:'✎ 빈칸 태그 (kind 확정)',
  themefix:'⇄ 3법 대응 확정', precimp:'★ 판례 내 중요도', editq:'✎ 수정 큐 (볼트 고칠 자리)', preclink:'🔗 내가 이은 판례·2차', precqa:'✅ 판례 검수 (앱 층)', precqafile:'✅ 볼트 검수 대기 (⚙ 가 읽는다)',
  canvas:'📝 정리캔버스 편집 (민소)', canvasink:'✍ 정리캔버스 필기', canvaslink:'🔗 정리캔버스 링크', canvasmemo:'🗒 정리캔버스 메모', canvaspin:'★ 정리캔버스 핀', clfix:'Claude 답 정정 (반영 전)' };   /* ★ prec3 §C-3 */   /* ★ 판 3 §9-2 · recsync §E · 판 4 add4 */

/* 층을 지우거나 들여온 뒤엔 메모리 캐시를 비워야 화면이 새 값을 본다 */
function recDropCache(){
  MKS = null; INK = null;
  if (typeof STKD !== 'undefined') STKD = null;   /* ★ v3-J §2-A */
  if (typeof BLKREC !== 'undefined') BLKREC = null;   /* ★ v3-L */

  if (typeof PQREC !== 'undefined') PQREC = null;   /* ★ QA 판 add1 — 앱 검수 */

function recDelete(k){
  try{ localStorage.removeItem(k); }catch(e){}
  try{ localStorage.removeItem(TS_PRE + k.slice(REC_PRE.length)); }catch(e){}   // 짝 맞춤표도
  recDropCache();

function nowIso(){ return new Date().toISOString(); }
function lsWrite(key, obj, what){
  try{ localStorage.setItem(key, JSON.stringify(obj));
       if (key.indexOf(REC_PRE) === 0 && typeof recTouch === 'function') recTouch();   /* ★ recsync A-5 — 기록 쓰기 직후 */
       return true; }
  catch(e){ toast('⚠ ' + (what || '기록') + ' 저장 실패 — 저장공간이 찼을 수 있다. 기록을 내보내라', 1);
            console.error(e); return false; }
}
function lsRead(key){
  try{ return JSON.parse(localStorage.getItem(key) || '{}'); }catch(e){ return {}; }
}
// 낡은 층(메모)은 값이 문자열이라 항목마다 시각을 못 넣는다 — 짝 맞춤표에 적는다
function tsTouch(storeKey, itemKey){
  const m = lsRead(TS_PRE + storeKey); m[itemKey] = nowIso();
  try{ localStorage.setItem(TS_PRE + storeKey, JSON.stringify(m)); }catch(e){}
}
function recStat(){
  const out = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k.indexOf(REC_PRE) !== 0) continue;
    if (k.indexOf(TS_PRE) === 0) continue;          // 짝 맞춤표는 세지 않는다
    let v = null; try{ v = JSON.parse(localStorage.getItem(k)); }catch(e){}
    let n = 0, note = '';
    if (v && typeof v === 'object'){
      const ks = Object.keys(v); n = ks.length;
      if (k === INK_KEY) note = ks.reduce((a, x) => a + ((v[x].s || []).length), 0) + '획';
    }
    out.push({ k: k, n: n, note: note });
  }
  out.sort((a, b) => a.k < b.k ? -1 : 1);
  return out;
}
function recTotal(){ return recStat().reduce((a, x) => a + x.n, 0); }
function recDump(){
  const 층 = {};
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k.indexOf(REC_PRE) !== 0) continue;
    try{ 층[k] = JSON.parse(localStorage.getItem(k)); }
    catch(e){ 층[k] = localStorage.getItem(k); }
  }
  // GAS 는 다음 지시서다. 다만 「바뀐 것만」 주고받을 수 있게 시각을 같이 담는다(§10-2)
  return { app: 'jopangi', v: 1, 생성: nowIso(), 건수: recTotal(), 층: 층 };

  const rx=/!\[\[([^\]\|#]+?\.(?:png|jpe?g|gif|webp|svg))(?:[|#][^\]]*)?\]\]/gi; let i=0,m,any=false;
  while((m=rx.exec(t))){ any=true; pre.appendChild(document.createTextNode(t.slice(i,m.index))); pre.appendChild(vimgEl(m[1].trim())); i=m.index+m[0].length; }
  if(!any){ pre.textContent=t; return; } pre.appendChild(document.createTextNode(t.slice(i))); }
async function ghSha(path){
  const r = await fetch(ghUrl(path), { headers: { Authorization: 'Bearer ' + syncToken(), Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('SHA ' + path + ' ' + r.status);
  return (await r.json()).sha;
}
async function ghPutJson(path, text, sha){
  const body = { message: syncWho() + ' · ' + path, content: b64enc(text), branch: SYNC_BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch('https://api.github.com/repos/' + SYNC_REPO + '/contents/' + encodeURI(path),
    { method: 'PUT', headers: { Authorization: 'Bearer ' + syncToken(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return 'conflict';
  if (!r.ok) throw new Error('PUT ' + path + ' ' + r.status);
  return (await r.json()).content.sha;
}
/* ---------- A-5 동기화 ----------
   ★ 2026-09-15 (_task_ox_sync_and_limit §E·§F·§G) — 「덮어쓰기」에서 「합치기」로(민법OX 와 같다).
     ① 올릴 때 도장·묘비를 원격과 합집합으로(recPayload(remote))
     ② 올릴 것이 있을 때만 올린다 — 도장으로도(recPending) · 데이터로도(받거나 지움 · 내게 있는데 원격에 없는 칸 ·
        내가 이겼는데 원격 값이 다른 칸) · 손으로 누른 것(force)은 늘 올린다(옛 판은 3분마다 무조건 PUT 했다)
     ③ lastSync 는 맞추기가 끝날 때마다(받기만 했어도) · 올린 시각은 lastPush — 둘 다 SM_KEY 안의 칸이다(새 키 아님)
     ④ 실패는 칩에(recLastErr — 옛 판 그대로) · 값으로 가른 동률 수는 칩에(recTie — 메모리에만) */
let recBusy = false, recLastErr = '', recTie = 0;
async function syncRecords(force){
  if (recBusy) return;
  if (!syncToken()){ recPaint(); return; }
  if (navigator.onLine === false){ recPaint(); return; }
  clLoad();   /* ★ _task_jo_claude_answers §A-2 — Claude 답도 이때 받는다(받는 중이면 건너뛴다 · 기다리지 않는다) */
  recBusy = true; recLastErr = ''; recPaint();
  try{
    stampAll();
    let sha = await ghSha(SYNC_PATH);
    let remote = null, m = null;
    if (sha){ const txt = await ghRaw(SYNC_PATH); if (txt){ try { remote = JSON.parse(txt); } catch (e) { console.warn('원격 기록 파싱 실패', e); } } }
    if (remote){ m = recMerge(remote); recTie += m.tie || 0; }
    const syncAt = Date.now();          /* 이 시각까지의 도장은 맞춘 것으로 친다(올리는 동안 찍힌 도장은 다음 판에 센다) */
    stampAll();
    const lacks = !!remote && SYNC_KEYS.some(k => {
      const cur = cellsOf(k), rv = (remote.data || {})[k];
      const rd = Array.isArray(rv) ? rv.reduce((o, it) => { if (it && it.k) o[it.k] = 1; return o; }, {}) : (rv || {});
      for (const c in cur) if (!Object.prototype.hasOwnProperty.call(rd, c)) return true;
      return false;
    });
    const shouldPush = !sha || recPending() > 0 || !!(m && (m.took || m.del || m.ahead)) || lacks;
    let pushed = null;
    if (force || shouldPush){
      let res = await ghPutJson(SYNC_PATH, JSON.stringify(recPayload(remote)), sha);
      if (res === 'conflict'){            /* 한 번만 재시도 */
        sha = await ghSha(SYNC_PATH);
        const txt2 = await ghRaw(SYNC_PATH);
        let remote2 = null;
        if (txt2){ try { remote2 = JSON.parse(txt2); } catch (e) {} }
        if (remote2){ const m2 = recMerge(remote2); recTie += m2.tie || 0; }
        stampAll();
        res = await ghPutJson(SYNC_PATH, JSON.stringify(recPayload(remote2)), sha);
        if (res === 'conflict') throw new Error('두 번 다 충돌');
      }
      pushed = res;
    }
    const meta = sObj(SM_KEY);
    meta.lastSync = syncAt;
    if (pushed){ meta.lastPush = Date.now(); meta.remoteSha = pushed; }
    sPut(SM_KEY, meta);
  }catch(e){ recLastErr = e.message || String(e); console.warn('기록 동기화 건너뜀:', recLastErr); }   /* ⚠ 오류창 금지 */
  recBusy = false; recPaint();
}

/* ══════════ _task_jo_claude_answers (2026-09-22) — 「Claude 답」 칸 (민법OX `7b9e214` 판을 옮겼다) ══════════
   studyplandata `jopangi/claude.json` = 노션 「📐 특상디QA」 의 배달본 — **앱은 읽기만 한다**(쓰는 길 0 · 공개 genie 에는 안 올린다).
   받는 길은 기록 동기화와 같다(ghRaw — SYNC_REPO·SYNC_BRANCH·raw·tt.cfg 토큰). 앱 시작(recBoot) 한 번 + syncRecords 가 돌 때 한 번 더.
   ⚠ 메모리에만 둔다(CL_DATA) — localStorage·IndexedDB 에 넣지 않는다.
   404 = 아직 답이 없다(정상 · 빈 것) · 그 밖의 실패(토큰 없음·네트워크) = 단추를 안 그리고 toast 한 번(받은 적이 있으면 그 답을 그대로 둔다).
   답 번호 = 특허 T001 · 상표 S001 · 디보 D001(법마다 따로) · 답이 붙는 열쇠 uid = 그 지문의 ox 기록 열쇠(oxKeyLid·oxKeyP7 — 근거 gg 와 같은 열쇠).
   내가 고친 것은 `jopangi.clfix`(SYNC_KEYS 끝)에 따로 쌓는다 — { T001: { md, ts, done:false } } · claude.json 은 안 건드린다.
   ⚠ 셈(근거 N개 · C n)은 1차객 · 보고 있는 법 안(OXPOOL)만 — 상표 JSON 에 T… 열쇠가 섞여 있어 접두 글자로 법을 가르지 않는다. */
const CL_PATH = 'jopangi/claude.json';
const CLFIX_KEY = REC_PRE + 'clfix', CL_FIX_MAX = 20000;
const CL_RX = /\b[TSD]\d{7}(?:P7)?\b/g;   /* 지문 열쇠 — T|S|D + 7자리 · 제7판 일부는 T + 7자리 + P7(jimun_*.json 6,369개 실측) · 답 번호 T001 은 3자리라 안 걸린다 */
let CL_DATA = null, CL_STATE = 'wait', CL_BUSY = false, CL_WARNED = false, CL_SIG = '';   /* CL_STATE: wait(받는 중) · ok(받음 · 404 면 빈 것) · fail(못 받음) */
let CL_BY_UID = {}, CL_MENT = {};            /* §A-4 파생 색인 — 받을 때 한 번 계산(직접 답 · 다른 답 md 에서 언급) · 저장 키 없음 */
async function clLoad(){
  if (CL_BUSY) return;                        /* 앱 시작 때 recBoot 와 첫 syncRecords 가 같이 부른다 — 한 번만 받는다 */
  if (!syncToken()){ clFail('토큰 없음'); return; }
  CL_BUSY = true;
  try{
    const txt = await ghRaw(CL_PATH);         /* 404 → null */
    const j = txt == null ? { v: 1, answers: {} } : JSON.parse(txt);
    if (!j || typeof j.answers !== 'object' || !j.answers) throw new Error('answers 가 없다');

function clFail(why){
  console.warn('Claude 답 받기 실패:', why);

  if (!CL_WARNED){ CL_WARNED = true; toast('Claude 답을 못 받았다'); }   /* 조용한 실패 금지 · 한 번만 */
}
function clSet(j){
  const A = j.answers, by = {}, ment = {};
  Object.keys(A).sort().forEach(m => {       /* 번호 순 */
    const a = A[m] || {}, u = String(a.uid || '');
    if (u) (by[u] = by[u] || []).push(m);
    const seen = {};
    (String(a.md || '').match(CL_RX) || []).forEach(x => {
      if (x === u || seen[x]) return;
      seen[x] = 1; (ment[x] = ment[x] || []).push(m);
    });
  });
  const sig = JSON.stringify(A), changed = CL_STATE !== 'ok' || sig !== CL_SIG;
  CL_DATA = j; CL_BY_UID = by; CL_MENT = ment; CL_STATE = 'ok'; CL_SIG = sig;
  if (changed){ clPaintAll(); try{ ggFieldRepaint(); }catch(e){} }   /* 🔗 근거 셈·단원 목록이 떠 있으면 C 숫자를 맞춘다 */
}
function clAns(m){ return (CL_DATA && CL_DATA.answers && CL_DATA.answers[m]) || null; }
function clFixAll(){ const o = lsRead(CLFIX_KEY); return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {}; }
function clFixOf(m){ const f = clFixAll()[m]; return (f && !f.done && typeof f.md === 'string') ? f : null; }   /* done:true 면 원문을 보인다 */
function clMdOf(m){ const f = clFixOf(m); return f ? f.md : String((clAns(m) || {}).md || ''); }
function clTs(ts){ const t = new Date(+ts || 0), p = n => String(n).padStart(2, '0'); return p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes()); }

/* §B 카드 아랫줄 단추 — 글자만(테두리·바탕 없음) · 직접 답 N = 주황 「Claude N」 · 언급만 = 회색 「Claude」 + 주황 「↩」(N≥2 면 ↩N) · 둘 다 없음 = 회색.

/* 본문·머리의 지문 열쇠 단추 → 새 지문 팝업(§E) */
function clWire(root){

/* §A-3 본문 문법 — 먼저 다 이스케이프한 뒤 이것만 태그로: ### 소제목 · - 목록 · | 표 |(둘째 줄 |---| = 머리 구분) · **굵게** · 빈 줄 = 문단 · 지문 열쇠 = 글자 단추 */
function clEsc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function clMdHTML(md){
  const inl = t => clEsc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(CL_RX, u => '<button type="button" class="uid" data-sid="' + u + '">' + u + '</button>');
  const L = String(md || '').replace(/\r\n?/g, '\n').split('\n'), row = t => /^\|.*\|$/.test(t);
  let out = '', para = [], i = 0;
  const flush = () => { if (para.length){ out += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  while (i < L.length){
    const t = L[i].trim();
    if (!t){ flush(); i++; continue; }
    if (/^###\s+/.test(t)){ flush(); out += '<h4>' + inl(t.replace(/^###\s+/, '')) + '</h4>'; i++; continue; }
    if (/^- /.test(t)){
      flush(); let li = '';
      while (i < L.length && /^- /.test(L[i].trim())){ li += '<li>' + inl(L[i].trim().slice(2)) + '</li>'; i++; }
      out += '<ul>' + li + '</ul>'; continue;
    }
    if (row(t)){
      flush(); const rows = [];
      while (i < L.length && row(L[i].trim())){ rows.push(L[i].trim()); i++; }
      const head = rows.length > 1 && /^\|[\s:|-]+\|$/.test(rows[1]) && rows[1].indexOf('-') >= 0;
      out += '<div class="cltbl"><table>' + rows.map((r, k) => (head && k === 1) ? '' : '<tr>' + r.slice(1, -1).split('|')
        .map(c => { const g = (head && k === 0) ? 'th' : 'td'; return '<' + g + '>' + inl(c.trim()) + '</' + g + '>'; }).join('') + '</tr>').join('') + '</table></div>';
      continue;
    }
    para.push(inl(t)); i++;
  }
  flush();
  return out;
}
/* §F ✎ 정정 — md 원문(정정본이 있으면 정정본)을 글칸으로 고친다(글자를 바로 고치면 표·목록이 깨진다).
   본문 자리만 글칸이 되고 핵심 줄은 그대로 아래에 남는다 · 맨 아래 「저장 (정정으로)」·「취소」(민법 clFixEdit·clFixSave 그대로) */
function clFixEdit(box){

/* ══ 연결판례 — ★ v3-M M13: 세 원천 합집합(원천 표시) ══
   ⚙ 맵만 쓰면 요약본 112건(리스트 「조문」 열)이 통째로 빠졌다(2013후37 실측 · 요약 본문에
   「특허법 제29조」 평문 0회). 수집본도 「제29조」·「같은 법 제29조」 꼴이 빠졌다.
   합집합 = ⓐ ⚙ 맵 ⓑ 리스트 조문 열(요약본 · 타법 이름 든 항목 제외) ⓒ 수집본 전문
   (「제N조」 · 앞 12자 안에 타법 이름 있으면 제외). map = {조키:{사건번호:{a,b,c}}} */
let JOPREC=null,JOPRECLAW=null,JO2CHA=null,JO2CHALAW=null;
const JP_OTHER=/(실용신안법|상표법|디자인보호법|민사소송법|민법|행정소송법|발명진흥법|저작권법|형법|헌법)/;
async function joPrecIdx(){
  if(JOPREC&&JOPRECLAW===S.law)return JOPREC;
  JOPRECLAW=S.law;JOPREC={map:{},src:''};
  if(S.law!=='특허법'&&S.law!=='상표법'&&S.law!=='민사소송법')return JOPREC;   // 판례 갤리 = 특허·상표(판 3 상표 9/3) · 민소(2026-09-20 _task_jo_prec_minso)
  const map={};
  const add=(k2,id,tag)=>{if(!id)return;
    const e2=(map[k2]=map[k2]||{});(e2[id]=e2[id]||{})[tag]=1;};
  try{
    const idx=await get('jo_링크역인덱스.json');
    const IK=S.law==='특허법'?'판례':'판례_'+PLAW(); Object.keys(idx[IK]||{}).forEach(k2=>(idx[IK][k2]||[]).forEach(id=>add(k2,id,'a')));   /* ★ 상표 판 3 */
  }catch(e){}
  try{
    const P=await get(PF('리스트'));
    (P.판례||[]).forEach(p=>{(Array.isArray(p.조문)?p.조문:[]).forEach(c=>{
      const s=String(c);
      if(JP_OTHER.test(s))return;               // 「실용신안법4조·33조」 — 항목째 그 법 것
      const rx=/(\d+)조(의(\d+))?/g;let m;
      while((m=rx.exec(s)))add('제'+m[1]+'조'+(m[3]?('의'+m[3]):''),p.id||p.사건번호,'b');
    });});
  }catch(e){}
  try{
    const F=await get(PF('전문'));
    Object.keys(F).forEach(id=>{
      const txt=Object.values(F[id]||{}).filter(x=>typeof x==='string').join('\n');
      const rx=/제(\d+)조(의(\d+))?/g;let m;const seen={};
      while((m=rx.exec(txt))){
        const ctx=txt.slice(Math.max(0,m.index-12),m.index);
        if(JP_OTHER.test(ctx))continue;         // 앞 12자 안 타법 이름 = 그 법의 조
        const k2='제'+m[1]+'조'+(m[3]?('의'+m[3]):'');

        add(k2,id,'c');
      }
    });
  }catch(e){}

}

  s.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;'
                  + 'font-family:' + BJ_FF + ';font-size:' + BJ_FS + 'px';
  document.body.appendChild(s);
  const w = s.getBoundingClientRect().width;
  s.remove();
  return w > 60 ? Math.ceil(w) + 2 : Math.round(BJ_FS * 17.8);
}
function bjFit(page){
  const host = page.parentNode; if (!host) return;
  const col = bjColWidth(), gap = Math.round(BJ_FS * 1.7);
  const avail = (host.clientWidth || col) - 2;
  let n = Math.max(1, Math.floor((avail + gap) / (col + gap)));
  n = Math.min(n, 3);
  // 단이 늘어나 한 단에 두세 줄만 남는 꼴은 막는다 — 그래도 한 행 길이는 그대로다
  const chars = page.textContent.length;
  n = Math.max(1, Math.min(n, Math.ceil(chars / (16 * 8))));
  page.style.columnCount = n;
  page.style.columnGap = gap + 'px';
  page.style.width = (n * col + (n - 1) * gap) + 'px';
}
function renderBeonjeon(host, orig){
  const page = el('div', 'bjpage');
  bjBlocks(orig).forEach(b => page.appendChild(el('div', 'bj bj-' + b.k, b.t)));
  host.appendChild(page);
  bjFit(page);
  setTimeout(() => bjFit(page), 0);
}

function joHangOf(txt, to){
  /* ★ v3-H §3 — 링크 표시 글자·to 에서 항·호를 뽑는다. 항이 없으면 null. */

/* ══ v3-F §0·§4·§6-1 — 지문 팝업 · 판례 요약 팝업 · ✏ 입구 · 📍 좌표기억 ══ */
let CARDPOPS = [];                       // 팝업 카드 — render 뒤 다시 그려 본 화면과 맞춘다
let OMRMETA2 = null, OMRMAP2 = null;     // 정리OMR meta·map (📍 상태 판정용 · viewJimun 이 싣는다)
function sidFind(sid){
  if (!VJ) return null;
  const m1 = /^L:(.+)#(\d+)$/.exec(sid);
  if (m1 && VJ.byId[m1[1]]){
    const q = VJ.byId[m1[1]];
    const z = (q.지문 || []).find(x => String(x.n) === m1[2]);
    if (z) return { kind: 'L', q: q, z: z };
  }
  const m2 = /^P7:(.+)$/.exec(sid);
  if (m2 && VJ.P7map[m2[1]]) return { kind: 'P', z: VJ.P7map[m2[1]] };
  for (const q of (VJ.qs || [])){
    const z = (q.지문 || []).find(x => x.uid === sid);
    if (z) return { kind: 'L', q: q, z: z };
  }
  for (const id in VJ.P7map){
    if (oxKeyP7(VJ.P7map[id]) === sid) return { kind: 'P', z: VJ.P7map[id] };
  }
  return null;
}

  const _pk37=('cell')+'|'+('📍 좌표기억 — ' + linkDisp(key)); if(popToggle(_pk37))return; const body=popShell('cell', '📍 좌표기억 — ' + linkDisp(key), _pk37);   /* ★ 상표 손질 6 — 키 종류|제목 */

  /* ★ 8/27 사용자 — 정리 탭으로 안 가도 팝업 안에서 확대한다.
     PC = Ctrl+휠(커서 기준) · 휠 = 세로 · 끌기 = 이동 · 터치 = 핀치/끌기 · 더블클릭 = 원래 크기.
     확대에 맞춰 타일 단(300/600/900dpi)을 갈아끼우고 보이는 타일만 fetch 한다(정리 뷰어와 같은 수). */
  let page = info.pin.page;
  const box = el('div', 'omini');
  const inner = el('div', 'ominiin');
  box.appendChild(inner);
  body.appendChild(box);
  body.appendChild(el('div', 'cdim',
    'Ctrl+휠 · 핀치 = 확대 (커서·손가락 기준) · 휠 = 세로 · 끌어 이동 · 두 번 누르면 원래 크기'));
  const nav = el('div', 'memobtn');
  const BOXW = 400;
  const V = { s: 0, x: 0, y: 0 };
  const fitOf = () => BOXW / OMRMETA2.pages[page - 1].w;
  const clampV = () => {
    const pg = OMRMETA2.pages[page - 1];
    const fit = fitOf();
    if (V.s <= fit + 0.0001){ V.s = fit; V.x = 0; V.y = 0; return; }
    V.x = Math.min(0, Math.max(V.x, box.clientWidth - pg.w * V.s));
    V.y = Math.min(0, Math.max(V.y, box.clientHeight - pg.h * V.s));
  };
  const tilesPaint = () => {
    const eff = V.s * (window.devicePixelRatio || 1);
    const dpi = eff <= 4.2 ? 300 : eff <= 8.4 ? 600 : 900;
    const tm = ((OMRMETA2.tiles || {})[String(page)] || {})[String(dpi)];
    if (!tm) return;
    const sc = 72 / dpi, tpt = 1024 * sc;
    const vx0 = (-V.x) / V.s, vy0 = (-V.y) / V.s;
    const vx1 = vx0 + box.clientWidth / V.s, vy1 = vy0 + box.clientHeight / V.s;
    const c0 = Math.max(0, Math.floor(vx0 / tpt)), c1 = Math.min(tm.cols - 1, Math.floor(vx1 / tpt));
    const r0 = Math.max(0, Math.floor(vy0 / tpt)), r1 = Math.min(tm.rows - 1, Math.floor(vy1 / tpt));
    const want = {};
    for (let ty = r0; ty <= r1; ty++)
      for (let tx = c0; tx <= c1; tx++) want[dpi + '/' + tx + '_' + ty] = [tx, ty];
    [...inner.querySelectorAll('img')].forEach(im => {
      if (!want[im.dataset.k]) im.remove(); else delete want[im.dataset.k];
    });
    Object.keys(want).forEach(k => {
      const tx = want[k][0], ty = want[k][1];
      const im = el('img');
      im.dataset.k = k;
      im.src = DATA + 'omr/특허/t/' + page + '/' + dpi + '/' + tx + '_' + ty + '.webp';
      im.style.left = (tx * tpt) + 'px'; im.style.top = (ty * tpt) + 'px';
      im.style.width = tpt + 'px';
      inner.insertBefore(im, inner.firstChild);
    });
  };
  const apply = () => {
    inner.style.transform = 'translate(' + V.x + 'px,' + V.y + 'px) scale(' + V.s + ')';
    clearTimeout(apply._t);
    apply._t = setTimeout(tilesPaint, 90);
  };
  const paint = () => {
    inner.innerHTML = '';
    const pg = OMRMETA2.pages[page - 1];
    inner.style.width = pg.w + 'px'; inner.style.height = pg.h + 'px';
    const fit = fitOf();
    box.style.width = BOXW + 'px';
    box.style.height = Math.round(pg.h * fit) + 'px';
    V.s = fit; V.x = 0; V.y = 0;
    if (page === info.pin.page){
      const hl = el('div', 'hl');
      hl.style.left = (info.pin.x - 2) + 'px';
      hl.style.top = (info.pin.y - 2) + 'px';
      hl.style.width = Math.max(6, info.pin.w) + 'px';
      hl.style.height = Math.max(5, info.pin.h) + 'px';
      inner.appendChild(hl);
    }
    apply();
    nav.querySelectorAll('.pgn').forEach(x => x.classList.toggle('on', +x.dataset.p === page));
  };
  box.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = box.getBoundingClientRect();
    if (ev.ctrlKey){
      const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
      const ns = Math.min(14, Math.max(fitOf(), V.s * (ev.deltaY < 0 ? 1.18 : 1 / 1.18)));
      const q = ns / V.s;
      V.x = cx - q * (cx - V.x); V.y = cy - q * (cy - V.y); V.s = ns;
    } else {
      V.y -= ev.deltaY;
    }
    clampV(); apply();
  }, { passive: false });
  const pts = {};
  let drag = null, pinch = null;
  box.addEventListener('pointerdown', ev => {
    pts[ev.pointerId] = [ev.clientX, ev.clientY];
    const ids = Object.keys(pts);
    if (ids.length === 2){
      const a = pts[ids[0]], b2 = pts[ids[1]];
      pinch = { d: Math.hypot(a[0] - b2[0], a[1] - b2[1]) }; drag = null;
    } else drag = { x: ev.clientX, y: ev.clientY, ox: V.x, oy: V.y };
    try{ box.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  });
  box.addEventListener('pointermove', ev => {
    if (!(ev.pointerId in pts)) return;
    pts[ev.pointerId] = [ev.clientX, ev.clientY];
    const ids = Object.keys(pts);
    const r = box.getBoundingClientRect();
    if (pinch && ids.length === 2){
      const a = pts[ids[0]], b2 = pts[ids[1]];
      const d = Math.hypot(a[0] - b2[0], a[1] - b2[1]);
      if (pinch.d > 0){
        const cx = (a[0] + b2[0]) / 2 - r.left, cy = (a[1] + b2[1]) / 2 - r.top;
        const ns = Math.min(14, Math.max(fitOf(), V.s * d / pinch.d));
        const q = ns / V.s;
        V.x = cx - q * (cx - V.x); V.y = cy - q * (cy - V.y); V.s = ns;
        clampV(); apply();
      }
      pinch.d = d;
      return;
    }
    if (!drag) return;
    V.x = drag.ox + (ev.clientX - drag.x);
    V.y = drag.oy + (ev.clientY - drag.y);
    clampV(); apply();
  });
  const pup = ev => {
    delete pts[ev.pointerId];
    if (Object.keys(pts).length < 2) pinch = null;
    if (!Object.keys(pts).length) drag = null;
  };
  box.addEventListener('pointerup', pup);
  box.addEventListener('pointercancel', pup);
  box.addEventListener('dblclick', () => paint());   // 원래 크기

  const pv = el('button', 'tool', '◀');
  pv.onclick = () => { if (page > 1){ page--; paint(); } };
  nav.appendChild(pv);
  OMRMETA2.pages.forEach(p2 => {
    const b = el('button', 'tool pgn' + (p2.n === page ? ' on' : ''), 'p' + p2.n);
    b.dataset.p = p2.n;
    b.onclick = () => { page = p2.n; paint(); };
    nav.appendChild(b);
  });
  const nx = el('button', 'tool', '▶');
  nx.onclick = () => { if (page < OMRMETA2.pages.length){ page++; paint(); } };
  nav.appendChild(nx);
  const find = el('button', 'tool', '찾기');
  find.title = '핀이 있는 쪽으로 돌아가 강조를 보인다';
  find.onclick = () => { page = info.pin.page; paint(); };
  nav.appendChild(find);
  const chk = el('button', 'tool', '위치 점검');
  chk.onclick = () => toast(info.st === 'stale'
    ? '판이 바뀌었다 — 「위치 다시 지정」을 권한다'
    : '판과 일치한다 (hash ' + (OMRMETA2.hash || '').slice(0, 8) + ')');
  nav.appendChild(chk);
  body.appendChild(nav);
  const ft = el('div', 'memobtn');
  const zb = el('button', 'tool on', '확대해서 보기');
  zb.onclick = () => { closeOne(body.parentNode); omrJump(key); };
  ft.appendChild(zb);
  const rb = el('button', 'tool', '위치 다시 지정');
  rb.onclick = () => { closeOne(body.parentNode);
    S.omrPick = { key: key }; S.tab = 'omr'; toast('그 행을 한 번 눌러라'); render(); };
  ft.appendChild(rb);
  const db = el('button', 'tool', '삭제');
  db.title = info.user ? '손으로 찍은 핀을 지운다' : '자동 대조 핀은 지울 수 없다 — 다시 지정으로 덮는다';
  db.onclick = () => {
    if (!info.user){ toast('자동 대조 핀은 지울 수 없다 — 「위치 다시 지정」으로 덮는다'); return; }
    if (!confirm('손으로 찍은 핀을 지울까?')) return;
    omPut(info.pin.id, null); closeOne(body.parentNode); render();
  };
  ft.appendChild(db);
  body.appendChild(ft);
  paint();
  showPop(ev);
}

/* ══ v3-F §8 — 조코드(제29조) → 걸린 지문 색인. 항·호 하위 키(특-29-3-2)도 조로 접는다.

let JOPANE = null, JOPANELAW = '';
async function joPanelIdx(){

  JOPANE = {}; JOPANELAW = S.law;
  try{
    const subj = SHORT[S.law];
    const JM = await get('jimun_' + subj + '.json');

      const k = joCode(c); if (!k) return;
      const e2 = JOPANE[k] = JOPANE[k] || { L: [], P: [] };
      LNKIDX.jo[c].forEach(x => {
        if (!e2.L.some(y => y.q === x.q && y.z === x.z)) e2.L.push(x);

    if (subj === '특허'){
      const P7 = await get('jimun_7pan.json');
