    body.appendChild(el('div', 'qb warn', '위치 점검 — 판이 바뀌었다(다시 지정 권장)'));
  /* ★ 8/27 사용자 — 정리 탭으로 안 가도 팝업 안에서 확대한다.
     PC = Ctrl+휠(커서 기준) · 휠 = 세로 · 끌기 = 이동 · 터치 = 핀치/끌기 · 더블클릭 = 원래 크기.
     확대에 맞춰 타일 단(300/600/900dpi)을 갈아끼우고 보이는 타일만 fetch 한다(정리 뷰어와 같은 수). */
  let page = info.pin.page;
  const box = el('div', 'omini');
  const inner = el('div', 'ominiin');
  box.appendChild(inner);
  body.appendChild(box);
  body.appendChild(el('div', 'cdim',
    'Ctrl+휠 · 핀치 = 확대 (커서·손가락 기준) · 휠 = 세로 · 끌어 이동 · 두 번 누르면 원래 크기'));
  const nav = el('div', 'memobtn');
  const BOXW = 400;
  const V = { s: 0, x: 0, y: 0 };
  const fitOf = () => BOXW / OMRMETA2.pages[page - 1].w;
  const clampV = () => {
    const pg = OMRMETA2.pages[page - 1];
    const fit = fitOf();
    if (V.s <= fit + 0.0001){ V.s = fit; V.x = 0; V.y = 0; return; }
    V.x = Math.min(0, Math.max(V.x, box.clientWidth - pg.w * V.s));
    V.y = Math.min(0, Math.max(V.y, box.clientHeight - pg.h * V.s));
  };
  const tilesPaint = () => {
    const eff = V.s * (window.devicePixelRatio || 1);
    const dpi = eff <= 4.2 ? 300 : eff <= 8.4 ? 600 : 900;
    const tm = ((OMRMETA2.tiles || {})[String(page)] || {})[String(dpi)];
    if (!tm) return;
    const sc = 72 / dpi, tpt = 1024 * sc;
    const vx0 = (-V.x) / V.s, vy0 = (-V.y) / V.s;
    const vx1 = vx0 + box.clientWidth / V.s, vy1 = vy0 + box.clientHeight / V.s;
    const c0 = Math.max(0, Math.floor(vx0 / tpt)), c1 = Math.min(tm.cols - 1, Math.floor(vx1 / tpt));
    const r0 = Math.max(0, Math.floor(vy0 / tpt)), r1 = Math.min(tm.rows - 1, Math.floor(vy1 / tpt));
    const want = {};
    for (let ty = r0; ty <= r1; ty++)
      for (let tx = c0; tx <= c1; tx++) want[dpi + '/' + tx + '_' + ty] = [tx, ty];
    [...inner.querySelectorAll('img')].forEach(im => {
      if (!want[im.dataset.k]) im.remove(); else delete want[im.dataset.k];
    });
    Object.keys(want).forEach(k => {
      const tx = want[k][0], ty = want[k][1];
      const im = el('img');
      im.dataset.k = k;
      im.src = DATA + 'omr/특허/t/' + page + '/' + dpi + '/' + tx + '_' + ty + '.webp';
      im.style.left = (tx * tpt) + 'px'; im.style.top = (ty * tpt) + 'px';
      im.style.width = tpt + 'px';
      inner.insertBefore(im, inner.firstChild);
    });
  };
  const apply = () => {
    inner.style.transform = 'translate(' + V.x + 'px,' + V.y + 'px) scale(' + V.s + ')';
    clearTimeout(apply._t);
    apply._t = setTimeout(tilesPaint, 90);
  };
  const paint = () => {
    inner.innerHTML = '';
    const pg = OMRMETA2.pages[page - 1];
    inner.style.width = pg.w + 'px'; inner.style.height = pg.h + 'px';
    const fit = fitOf();
    box.style.width = BOXW + 'px';
    box.style.height = Math.round(pg.h * fit) + 'px';
    V.s = fit; V.x = 0; V.y = 0;
    if (page === info.pin.page){
      const hl = el('div', 'hl');
      hl.style.left = (info.pin.x - 2) + 'px';
      hl.style.top = (info.pin.y - 2) + 'px';
      hl.style.width = Math.max(6, info.pin.w) + 'px';
      hl.style.height = Math.max(5, info.pin.h) + 'px';
      inner.appendChild(hl);
    }
    apply();
    nav.querySelectorAll('.pgn').forEach(x => x.classList.toggle('on', +x.dataset.p === page));
  };
  box.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = box.getBoundingClientRect();
    if (ev.ctrlKey){
      const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
      const ns = Math.min(14, Math.max(fitOf(), V.s * (ev.deltaY < 0 ? 1.18 : 1 / 1.18)));

      V.x = cx - q * (cx - V.x); V.y = cy - q * (cy - V.y); V.s = ns;
    } else {
      V.y -= ev.deltaY;
    }
    clampV(); apply();
  }, { passive: false });
  const pts = {};
  let drag = null, pinch = null;
  box.addEventListener('pointerdown', ev => {
    pts[ev.pointerId] = [ev.clientX, ev.clientY];
    const ids = Object.keys(pts);
    if (ids.length === 2){
      const a = pts[ids[0]], b2 = pts[ids[1]];
      pinch = { d: Math.hypot(a[0] - b2[0], a[1] - b2[1]) }; drag = null;
    } else drag = { x: ev.clientX, y: ev.clientY, ox: V.x, oy: V.y };
    try{ box.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  });
  box.addEventListener('pointermove', ev => {
    if (!(ev.pointerId in pts)) return;
    pts[ev.pointerId] = [ev.clientX, ev.clientY];
    const ids = Object.keys(pts);
    const r = box.getBoundingClientRect();
    if (pinch && ids.length === 2){
      const a = pts[ids[0]], b2 = pts[ids[1]];
      const d = Math.hypot(a[0] - b2[0], a[1] - b2[1]);
      if (pinch.d > 0){
        const cx = (a[0] + b2[0]) / 2 - r.left, cy = (a[1] + b2[1]) / 2 - r.top;
        const ns = Math.min(14, Math.max(fitOf(), V.s * d / pinch.d));
        const q = ns / V.s;
        V.x = cx - q * (cx - V.x); V.y = cy - q * (cy - V.y); V.s = ns;
        clampV(); apply();
      }
      pinch.d = d;
      return;
    }
    if (!drag) return;
    V.x = drag.ox + (ev.clientX - drag.x);
    V.y = drag.oy + (ev.clientY - drag.y);
    clampV(); apply();
  });
  const pup = ev => {
    delete pts[ev.pointerId];
    if (Object.keys(pts).length < 2) pinch = null;
    if (!Object.keys(pts).length) drag = null;
  };
  box.addEventListener('pointerup', pup);
  box.addEventListener('pointercancel', pup);
  box.addEventListener('dblclick', () => paint());   // 원래 크기

  const pv = el('button', 'tool', '◀');
  pv.onclick = () => { if (page > 1){ page--; paint(); } };
  nav.appendChild(pv);
  OMRMETA2.pages.forEach(p2 => {
    const b = el('button', 'tool pgn' + (p2.n === page ? ' on' : ''), 'p' + p2.n);
    b.dataset.p = p2.n;
    b.onclick = () => { page = p2.n; paint(); };
    nav.appendChild(b);
  });
  const nx = el('button', 'tool', '▶');
  nx.onclick = () => { if (page < OMRMETA2.pages.length){ page++; paint(); } };
  nav.appendChild(nx);
  const find = el('button', 'tool', '찾기');
  find.title = '핀이 있는 쪽으로 돌아가 강조를 보인다';
  find.onclick = () => { page = info.pin.page; paint(); };
  nav.appendChild(find);
  const chk = el('button', 'tool', '위치 점검');
  chk.onclick = () => toast(info.st === 'stale'
    ? '판이 바뀌었다 — 「위치 다시 지정」을 권한다'
    : '판과 일치한다 (hash ' + (OMRMETA2.hash || '').slice(0, 8) + ')');
  nav.appendChild(chk);
  body.appendChild(nav);
  const ft = el('div', 'memobtn');
  const zb = el('button', 'tool on', '확대해서 보기');
  zb.onclick = () => { closeOne(body.parentNode); omrJump(key); };
  ft.appendChild(zb);
  const rb = el('button', 'tool', '위치 다시 지정');
  rb.onclick = () => { closeOne(body.parentNode);
    S.omrPick = { key: key }; S.tab = 'omr'; toast('그 행을 한 번 눌러라'); render(); };

/* ══ v3-F §8 — 지문 카드 한 장 공용 빌더(popCard·정오문제 패널이 같이 쓴다) ══ */
function sidCardEl(hit, sid, seq){

/* ══ v3-F §8 — 조코드(제29조) → 걸린 지문 색인. 항·호 하위 키(특-29-3-2)도 조로 접는다.
   리담 = LNKIDX.jo · 제7판 = 해설 파싱(p7Jo · 병합은 리담 쪽에서 이미 걸렸다). 법 바뀌면 다시. ══ */
let JOPANE = null, JOPANELAW = '';
async function joPanelIdx(){
  if (JOPANE && JOPANELAW === S.law) return JOPANE;
  JOPANE = {}; JOPANELAW = S.law;
  try{
    const subj = SHORT[S.law];
    const JM = await get('jimun_' + subj + '.json');
    lnkBuild(JM);
    Object.keys(LNKIDX.jo).forEach(c => {
      const k = joCode(c); if (!k) return;
      const e2 = JOPANE[k] = JOPANE[k] || { L: [], P: [] };
      LNKIDX.jo[c].forEach(x => {
        if (!e2.L.some(y => y.q === x.q && y.z === x.z)) e2.L.push(x);
      });
    });
    if (subj === '특허'){
      const P7 = await get('jimun_7pan.json');
      if (!JOKEY){
        const JL = await get('jo_특허법_목록.json');
        JOKEY = {}; JL.조.forEach(x => { JOKEY[x.k] = x.t || ''; });
      }
      p7Link(JM, P7);
      P7.지문.forEach(z => {
        if (z.병합) return;
        const lk = (P7LID || {})[z.id];
        p7Jo(z.sol, lk ? (lk.z.jo || []) : []).forEach(x => {
          if (!x.law) return;
          (JOPANE[x.k] = JOPANE[x.k] || { L: [], P: [] }).P.push(z);
        });
      });
    }
  }catch(e){}
  return JOPANE;
}
async function joPanelMount(slot){
  if (!S.joPanel) return;
  const JP = await joPanelIdx();
  const ent = (JP || {})[S.jo] || { L: [], P: [] };
  // 손잡이 — 누르면 접기 · 끌면 너비(qlHandle 과 같은 결 · jopangi_ui 에 기억)
  const h = el('div', 'handle drg', '›');
  h.title = '정오문제 패널 — 누르면 접기 · 끌면 너비';
  let x0 = 0, w0 = 0, curW = 0;
  h.addEventListener('pointerdown', ev => {
    if (ev.button !== 0 && ev.pointerType === 'mouse') return;
    x0 = ev.clientX; w0 = curW = S.joPanelW; h._drag = false;
    try{ h.setPointerCapture(ev.pointerId); }catch(e){}
  });
  h.addEventListener('pointermove', ev => {
    if (!h.hasPointerCapture || !h.hasPointerCapture(ev.pointerId)) return;
    const dx = ev.clientX - x0;
    if (!h._drag && Math.abs(dx) < 4) return;
    h._drag = true;
    curW = Math.max(240, Math.min(700, Math.round(w0 - dx)));
    if (h.nextSibling) h.nextSibling.style.width = curW + 'px';
  });
  const end = ev => {
    try{ h.releasePointerCapture(ev.pointerId); }catch(e){}
    if (!h._drag) return;
    S.joPanelW = curW; uiSave();
    setTimeout(() => { h._drag = false; }, 300);
  };
  h.addEventListener('pointerup', end);
  h.addEventListener('pointercancel', end);
  h.onclick = () => { if (h._drag){ h._drag = false; return; } S.joPanel = false; render(); };
  slot.appendChild(h);
  const pane = el('div', 'jopane');
  pane.style.width = S.joPanelW + 'px';
  const items = [];
  ent.L.forEach(x => items.push({ kind: 'L', q: x.q, z: x.z, sid: oxKeyLid(x.q, x.z) }));
  ent.P.forEach(z => items.push({ kind: 'P', z: z, sid: oxKeyP7(z) }));
  const nL = ent.L.length, nP = ent.P.length;
  const shown = items.filter(it =>
    S.joPanelF === 'all' || (S.joPanelF === 'L' ? it.kind === 'L' : it.kind === 'P'));
  /* ★ v3-F3 ③ — 한 쪽 = 지문 5개 고정(사용자 8/27 · 「한 번에 N개」 선택 폐기) */
  const per = 5;
  const nPg = Math.max(1, Math.ceil(shown.length / per));
  if (S.joPanelP >= nPg) S.joPanelP = 0;
  const cur = shown.slice(S.joPanelP * per, (S.joPanelP + 1) * per);
  const cb = el('div', 'ctrlbar');
  cb.appendChild(el('span', 'pl', '☑ 정오문제 ' + shown.length + '건'));
  [['all', '전체 ' + items.length], ['L', '기출 ' + nL], ['P', '제7판 ' + nP]].forEach(p2 => {
    const b = el('button', 'tool' + (S.joPanelF === p2[0] ? ' on' : ''), p2[1]);
    b.onclick = () => { S.joPanelF = p2[0]; S.joPanelP = 0; render(); };
    cb.appendChild(b);
  });
  pane.appendChild(cb);
  /* ★ v3-F3 ③ — 쪽 단추 「1 2 3 4 5 …」(지금 쪽 강조) · p/P 표기는 뺀다 */
  const cb2 = el('div', 'ctrlbar');
  cb2.appendChild(el('span', 'pl', '쪽'));
  for (let p2 = 0; p2 < nPg; p2++){
    const b = el('button', 'tool' + (S.joPanelP === p2 ? ' on' : ''), String(p2 + 1));
    b.onclick = ((pp) => () => { S.joPanelP = pp; render(); })(p2);
    cb2.appendChild(b);
  }
  pane.appendChild(cb2);
  if (!shown.length) pane.appendChild(emptyBox('☑', '이 조에 걸린 지문이 없다'));
  cur.forEach((it, ix) => {
    const c = sidCardEl(it, it.sid, S.joPanelP * per + ix + 1);
    c.id = 'jp-' + it.sid;                 // ✅ 채점의 붉은 칸·스크롤이 이 id 를 쓴다
    pane.appendChild(c);
  });
  if (shown.length){
    const ftr = el('div', 'memobtn');
    const pv = el('button', 'tool', '← 이전');
    pv.disabled = S.joPanelP <= 0;
    pv.onclick = () => { S.joPanelP--; render(); };
    ftr.appendChild(pv);
    const nx = el('button', 'tool', '다음 →');
    nx.disabled = S.joPanelP >= nPg - 1;
    nx.onclick = () => { S.joPanelP++; render(); };
    ftr.appendChild(nx);
    const gb = el('button', 'tool on', '✅ 채점');
    gb.title = '보이는 묶음을 채점한다 — 마킹→채점 규칙 그대로 · 결과 창 없이 toast';
    gb.onclick = () => oxGrade(cur.map(it => ({ k: it.sid,
      ans: (it.kind === 'P' ? (it.z.ox || ((it.z.리담 || {}).ox || '')) : it.z.ox) || '',
      dom: 'jp-' + it.sid })));
    ftr.appendChild(gb);
    pane.appendChild(ftr);
  }
  slot.appendChild(pane);
}

/* ── 지문 한 줄의 O/X 줄 — 리담·제7판 카드가 같이 쓴다 ── */
const OXNAME = ['안 품', '맞음', '헷갈림', '틀림', '덜약점'];
function oxPickRow(row, key, raw, sol, extra){
  const rec = oxOf(key) || {}, ans = oxAns(key, raw), fixed = oxFixed(key);
  lnkLines(row, key);   // ★ v3-F §6-1 — 관련/나를 연결한 문제(있을 때만 · 지문 글 밑 두 줄)
  const pick = el('div', 'oxpick');

     같은 걸 또 누르면 해제. 채점된 지문(p 있음)은 지금처럼 정오 색을 보이고 단추는 잠근다. */
  ['O', 'X'].forEach(v => {

    pick.appendChild(b);

  /* ★ 8/26 — 「안 품」은 상태 라벨이라 풀기 전에는 감춘다(버튼이 아니다).
     🌀 헷갈림 버튼은 없앴다 — 위 태그줄의 🌀 와 같은 값(r.c)을 쓰던 중복 입구였다. */

  fx.onclick = () => oxFix(key, raw);

  if (!ans) bar.appendChild(el('span', 'qb warn', '정오 없음 — 채점 불가'));
  row.appendChild(bar);
  if (rec.p){
    const res = el('div', 'oxres');
    res.appendChild(el('span', 'ansb ' + (ans || ''), '정답 ' + (ans || '미확정') + (fixed ? ' (정정)' : '')));
    res.appendChild(el('span', 'badge', rec.ok ? '맞음' : '틀림'));
    row.appendChild(res);
    logicView(row, key);                        // ★ v3-F §6-1 — 논리는 있을 때만 「보기」
    const sd = sol ? el('div', 'sol', sol) : el('div', 'cdim', '해설 없음');
    if (extra && sol) sd.appendChild(extra);    // ★ v3-F §3 — 「⚖ 원문」은 해설 안으로
    row.appendChild(sd);
  } else if (sol){
    logicView(row, key);
    const pv = el('button', 'solpv', '해설 미리보기');
    pv.onclick = () => { const d = pv.nextSibling; d.style.display = d.style.display === 'none' ? '' : 'none'; };
    row.appendChild(pv);
    const d = el('div', 'sol', sol); d.style.display = 'none';
    if (extra) d.appendChild(extra);
    row.appendChild(d);
  } else logicView(row, key);
  // ★ v3-F §6-1 — 상시 「📐 논리」 접힘 칸(logicBox)은 폐지 · 입구는 ✏ 메모 및 유사문제 연결

/* ── 거르기 · 빠른 실행 큐 ──
   ★ 큐는 **마디 경계를 넘는다**(사용자 확정 8/26) — 특허 안에서 약점만 모아 풀다. */
function oxKeep(key){

/* ── 회독 ── 마감하면 O/X 선택만 비우고 헷갈림·덜약점은 남긴다 — 다음 회독의 출발선이다 */
function rndList(scope){ const a = rndAll()[scope]; return Array.isArray(a) ? a : []; }
function rndClose(scope, keys, label){
  const done = keys.filter(k => (oxOf(k) || {}).p).length;
  if (!done){ toast('이 판에서 풀이한 지문이 없다'); return; }
  const cnt = [0, 0, 0, 0, 0];
  /* ★ v3-C §1 — 지문별 결과 키 목록을 회독 항목에 남긴다(칩·대조의 바닥).
     맞은 키까지 담으면 커진다 — right 는 수만 남긴다. */
  const wrongK = [], confuseK = [], semiK = [], rightK = [], allK = [];
  let fakeN = 0;   // ★ v3-D §2 — 배지의 ⚠ 수. 옛 항목엔 없어 ⚠– 로 보인다
  keys.forEach(k => { const st = oxState(k); cnt[st]++; allK.push(k);
    if (st === 3) wrongK.push(k);
    else if (st === 2) confuseK.push(k);
    else if (st === 4) semiK.push(k);
    const r0 = oxOf(k) || {};
    if (r0.p && r0.ok) rightK.push(k);
    if (oxTagOn(k, 'fake')) fakeN++; });
  const n = rndList(scope).length + 1;
  /* ★ v3-E §0-3 — confirm 폐기: 묻지 않고 마감한다. 잘못 눌렀으면 회독별 비교에서 그 회독 삭제 */
  const A = rndAll();
  const L = rndList(scope);
  L.push({ n: n, date: nowIso().slice(0, 10), total: keys.length, done: done,
           right: cnt[1], wrong: cnt[3], confuse: cnt[2], semi: cnt[4],
           fake: fakeN, ts: nowIso(),      // ts — §5 학습로그가 날짜로 가른다
           wrongK: wrongK, confuseK: confuseK, semiK: semiK,
           rightK: rightK, allK: allK });   // ★ v3-D §3 — 칩·대조용 전체 키(순번은 안 담는다)
  A[scope] = L;
  RNDREC = A; lsWrite(RND_KEY, A, '회독');
  const O = oxAll();
  keys.forEach(k => { if (O[k]){ delete O[k].p; delete O[k].ok; O[k].ts = nowIso(); } });
  OXREC = O; lsWrite(OX_KEY, O, '1차객 풀이');
  /* ★ v3-E §0-4 — 자동 창 폐기(v3-C §5 폐기). 마감하고 1쪽으로 조용히 간다.
     창은 회독 배지 · 「📊 채점표」 · 채점 결과 창의 「저장 및 보기」에서만 연다. */
  S.oxPage = null;
  render();
  toast(n + '회독 마감 — 맞음 ' + cnt[1] + ' / 풀이 ' + done);
}
/* ══ v3-C §2~§4 — 📊 회독 비교·채점표 팝업 (민법OX 이식 · 2026-08-26 밤) ══
   rndClose 가 남긴 wrongK/confuseK/semiK 로 회독마다 지문 칩을 그린다.
   옛 항목(목록 없음)은 수만 보인다 — 칩을 지어내지 않는다(§1). */
function oxKeyDisp(k){
  if (k.indexOf('L:') === 0){ const i = k.indexOf('#'); return i >= 0 ? k.slice(i) : k; }
  if (k.indexOf('P7:') === 0) return k.slice(3);
  return k.length === 8 ? k.slice(5) : k;   // sid 8자 → 뒤 3자(문번2+지문1 · 규약 v3)
}
function rndGo(scope, k){
  const info = (OXPOOL || {})[k];
  if (!info) return;
  /* ⚠ 병합 지문(8자 sid)은 마디에 따라 리담 카드(qb-<문항id>)로도,
     제7판 카드(qb-<키>)로도 그려진다 — 지금 마디에 있는 쪽을 잡는다(실측: 주체능력 전부 후자) */
  const doms = info.dom === ('qb-' + k) ? [info.dom] : [info.dom, 'qb-' + k];
  const fin = () => {
    const d = doms.find(x => document.getElementById(x));
    if (!d){ toast('그 지문 카드가 지금 화면에 없다 — 거르기·큐를 풀면 보인다'); return; }
    const box = document.getElementById(d);
    box.scrollIntoView({ block: 'center' });
    box.classList.add('hmhit');
    setTimeout(() => box.classList.remove('hmhit'), 1500);
  };
  const hop = () => {
    const d = doms.find(x => (OXDOMPG || {})[x] != null);
    const pg = d != null ? OXDOMPG[d] : null;
    if (pg != null && pg !== S.oxPage){
      S.oxPage = pg; S.oxPageJump = true;
      render().then(() => setTimeout(fin, 60));
    } else fin();
  };
  const sel = (scope || '').split('|')[2] || '';
  if (sel && S.mok !== sel){
    S.mok = sel; S.oxPage = null; S.oxQueue = '';
    render().then(() => setTimeout(hop, 60));
  } else hop();
}
/* ══ v3-D §0 — 순번은 마디 안 카드 순서로 **그릴 때만** 센다. 어디에도 저장하지 않는다.
   기록은 전부 키(sid)에 붙으므로 CSV 정리로 순서가 바뀌어도 무해하다(R2). */
function mokCards(i){
  if (!VJ) return [];
  const M = VJ.M, n = M[i]; if (!n) return [];
  let jos = [...n.지문], lids = [...n.리담];
  for (let j = i + 1; j < M.length; j++){
    if (M[j].깊이 <= n.깊이) break;
    jos = jos.concat(M[j].지문); lids = lids.concat(M[j].리담);
  }
  jos = [...new Set(jos)]; lids = [...new Set(lids)];
  const _seen = new Set();
  lids.forEach(id => { const q = VJ.byId[id]; if (q)(q.지문 || []).forEach(z => { if (z.sid) _seen.add(z.sid); }); });
  const out = [];
  lids.map(id => VJ.byId[id]).filter(Boolean)
    .forEach(q => out.push({ kind: 'L', q: q, dom: 'qb-' + q.id }));
  jos.map(id => VJ.P7map[id]).filter(z => z && !(z.병합 && _seen.has(z.sid)))
    .forEach(z => out.push({ kind: 'P', z: z, dom: 'qb-' + oxKeyP7(z) }));
  return out;
}
function unCards(){
  if (!VJ) return [];
  const placed = new Set();
  VJ.M.forEach(n => n.리담.forEach(x => placed.add(x)));
  const out = [];
  (VJ.qs || []).filter(q => !placed.has(q.id))
    .forEach(q => out.push({ kind: 'L', q: q, dom: 'qb-' + q.id }));
  return out;
}
function scopeCards(scope){
  const sel = (scope || '').split('|')[2] || '';
  const m = /^__mg(\d+)$/.exec(sel);
  if (m) return mokCards(+m[1]);
  if (sel === '__미분류') return unCards();
  return [];
}
// 카드 목록 → 지문(=문제) 목록. s = 카드 순번(1~) · zn = 지문 번호(제7판 단독은 없음)
function mokCells(cards){
  const cells = [];
  cards.forEach((c, ci) => {
    const s = ci + 1;
    if (c.kind === 'L')(c.q.지문 || []).forEach(z => cells.push({
      k: oxKeyLid(c.q, z), ans: z.ox || '', dom: c.dom, s: s, zn: z.n, label: s + '(' + z.n + ')' }));
    else cells.push({ k: oxKeyP7(c.z), ans: (c.z.ox || ((c.z.리담 || {}).ox || '')) || '',
      dom: c.dom, s: s, zn: null, label: String(s) });
  });
  return cells;
}
function mokPath(i){
  if (!VJ) return '';
  const M = VJ.M, parts = [];
  let d = (M[i] || {}).깊이 || 0;
  for (let j = i; j >= 0; j--){
    const n = M[j]; if (!n) continue;
    if (j === i || n.깊이 < d){
      parts.unshift((n.no ? n.no + (n.깊이 === 1 ? '. ' : ' ') : '') + n.제목);
      d = n.깊이;
      if (d <= 1) break;
    }
  }
  return parts.join(' > ');
}
function mokPathOf(scope){
  const sel = (scope || '').split('|')[2] || '';
  const m = /^__mg(\d+)$/.exec(sel);
  if (m) return mokPath(+m[1]);
  if (sel === '__미분류') return '미분류 (리담)';
  return sel;
}
/* 순번 칩 — 초록 맞음 · 빨강 틀림 · 회색 안 품. 누르면 창을 닫고 그 카드로(§3·§4) */

/* ★ v3-D §3 — 회독별 비교 창. 마감된 회독을 한 칸씩 나열하고 대조는 두 줄만. */
function rndPop(scope, keys, label, ev){

/* ══ v3-C §7 — ⭐ 정답표가 지목한 선지에 중요 태그를 1회 자동으로 켠다 ══

const AUTO_KEY = 'jopangi_auto';
function autoImportant(JM, subj){
  if (subj !== '특허') return;          // 목차·제7판 짝이 있는 특허 원장에만 돈다

/* ══ v3-D §1 — 📝 OMR 마킹 패드. 떠있는 창 · 줄 = 문제(지문) 하나 · 카드의 마킹과 같은 값(m). ══ */
function oxOmrGoto(c){
  const box = document.getElementById(c.dom);
  if (!box){ toast('그 카드가 지금 화면에 없다'); return; }
  box.scrollIntoView({ block: 'center' });
  box.classList.add('hmhit');
  setTimeout(() => box.classList.remove('hmhit'), 1500);
}
function oxOmrMark(v){
  const o = OXOMR; if (!o) return;
  const c = o.cells[o.cur]; if (!c) return;
  const rec = oxOf(c.k) || {};
  if (rec.p) return;                       // 채점된 줄은 다시 못 찍는다
  oxPut(c.k, { m: rec.m === v ? '' : v });
  if (o.cur < o.cells.length - 1) o.cur++; // 찍으면 다음 줄로
  render(); oxOmrPaint();
}
function oxOmrPaint(){
  const o = OXOMR;
  if (!o || !o.body || !o.body.isConnected){ OXOMR = null; return; }
  const b = o.body; b.innerHTML = '';
  b.appendChild(el('div', 'cdim', '키보드 O / X = 현재 줄 마킹 후 다음 줄 · ↑↓ 이동 · Esc 닫기 · 번호를 누르면 그 카드로'));
  const g = el('div', 'omrgrid');
  o.cells.forEach((c, i) => {
    const rec = oxOf(c.k) || {}, done = !!rec.p, ans = oxAns(c.k, c.ans);
    const row = el('div', 'omrrow' + (i === o.cur ? ' cur' : ''));
    const nm = el('span', 'omrno wide' + ((!done && ans && !rec.m) ? ' blank' : ''),
      c.zn != null ? (c.s + '번 - (' + c.zn + ')') : (c.s + '번'));
    nm.onclick = () => { o.cur = i; oxOmrPaint(); oxOmrGoto(c); };
    row.appendChild(nm);
    ['O', 'X'].forEach(v => {
      const on = done ? rec.p === v : rec.m === v;
      const btn = el('button', 'omrb' + (on ? ' on' : '') + (done && v === ans ? ' ans' : ''), v);
      if (done) btn.disabled = true;
      else btn.onclick = () => { o.cur = i; oxOmrMark(v); };
      row.appendChild(btn);
    });
    if (!ans) row.appendChild(el('span', 'badge', '정오 없음'));
    else if (done) row.appendChild(el('span', 'qb ' + (rec.ok ? 't' : 'warn'), rec.ok ? '○' : '✕'));
    g.appendChild(row);
  });
  b.appendChild(g);
  const gr = o.cells.filter(c => oxAns(c.k, c.ans) && !((oxOf(c.k) || {}).p));
  const mk = gr.filter(c => ((oxOf(c.k) || {}).m));
  const ft = el('div', 'memobtn');
  ft.appendChild(el('span', 'badge', '마킹 ' + mk.length + '/' + gr.length));
  if (gr.length){
    const gb = el('button', 'tool on', '✅ 이 페이지 채점');
    gb.onclick = () => oxGrade(o.cells, o.ctx);
    ft.appendChild(gb);
  }
  b.appendChild(ft);
}
function oxOmrOpen(cells, title, ctx, ev){
  OXOMR = { cells: cells, cur: 0, ctx: ctx || null };
  const body = popShell('q', '📝 ' + title);
  OXOMR.body = body;
  oxOmrPaint();

}
/* 키보드 — 기출뷰 giOmrPad 규칙 그대로: 입력칸 포커스·수정키는 흘려보낸다.
   ev.code 로 잡아 한글 IME(ㅐ/ㅌ)에도 O/X 가 든다. Esc 는 공용 닫기가 이미 맡는다. */
document.addEventListener('keydown', ev => {
  const o = OXOMR;
  if (!o || !o.body || !o.body.isConnected){ if (o) OXOMR = null; return; }
  const t = document.activeElement, tn = t ? (t.tagName || '').toLowerCase() : '';
  if (tn === 'input' || tn === 'textarea' || (t && t.isContentEditable)) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.isComposing) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight'){
    o.cur = Math.min(o.cells.length - 1, o.cur + 1); oxOmrPaint(); ev.preventDefault(); return; }
  if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft'){
    o.cur = Math.max(0, o.cur - 1); oxOmrPaint(); ev.preventDefault(); return; }
  if (ev.code === 'KeyO' || ev.code === 'KeyX'){
    oxOmrMark(ev.code === 'KeyO' ? 'O' : 'X'); ev.preventDefault(); }
});

/* ═════ 히트맵 (§9) ═════
   한 칸 = 기록 단위(지문) · 8px · 5상태. ★ 캔버스는 자기 clientWidth 로 그린다(§9-2).
   ⚠ 그린 폭과 놓인 폭이 다르면 오른쪽으로 갈수록 한 칸씩 밀린다 — 민법OX 가 8/18 에 밟은 함정이다. */
const HM_C = ['#D3D1C7', '#1D9E75', '#EF9F27', '#E24B4A', '#F5E06A'];
let HMCELL = [];
function heatBox(cells){
  HMCELL = cells;
  const wrap = el('div', 'hmwrap');
  const hd = el('div', 'hmhd');
  hd.appendChild(el('span', 'pl', '🗺 히트맵'));
  const cnt = [0, 0, 0, 0, 0];
  cells.forEach(c => cnt[oxState(c.k)]++);
  OXNAME.forEach((n, i) => {
    const s = el('span', 'hmlg');
    s.appendChild(el('span', 'hmdot s' + i));
    s.appendChild(document.createTextNode(' ' + n + ' ' + cnt[i]));
    hd.appendChild(s);
  });
  wrap.appendChild(hd);
  const cv = el('canvas', 'hmcv');
  cv.title = '칸을 누르면 그 지문으로 간다';
  wrap.appendChild(cv);
  const draw = () => {
    const w = cv.clientWidth;
    if (!w) return;
    const px = 8, gap = 2, step = px + gap;
    const cols = Math.max(1, Math.floor((w + gap) / step));
    const h = Math.max(px, Math.ceil(cells.length / cols) * step - gap);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const x = cv.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, w, h);
    cells.forEach((c, i) => {
      x.fillStyle = HM_C[oxState(c.k)];
      x.fillRect((i % cols) * step, ((i / cols) | 0) * step, px, px);
    });
    cv._cols = cols; cv._step = step; cv._w = w;
  };
  cv.addEventListener('click', e => {
    const r = cv.getBoundingClientRect();
    const sc = (cv._w && r.width) ? (r.width / cv._w) : 1;
    const c = Math.floor(((e.clientX - r.left) / sc) / cv._step);
    const rw = Math.floor(((e.clientY - r.top) / sc) / cv._step);
    if (c < 0 || c >= cv._cols) return;
    const i = rw * cv._cols + c;
    if (i < 0 || i >= HMCELL.length) return;
    /* ★ v3-C §6-2 — 히트맵은 마디 전체다. 칸이 다른 쪽이면 쪽을 넘긴 뒤 스크롤한다 */
    const cell = HMCELL[i];
    const go = () => {
      const box = document.getElementById(cell.dom);

/* ══════ 🃏 암기카드 (P6 설계 · 민법OX 방식 2026-08-26) ══════
   결과물은 SVG — 볼트 암기카드결과물 의 md 안 <svg> 를 끌어다 넣는다.
   ⚠ 조판기에는 래스터 이미지를 담을 IndexedDB 층이 없다 — SVG 만 받는다.
   자리 — ① 지문 카드의 🃏  ② 마디의 🃏 암기노트. 카드가 없으면 넣는 자리가 자동으로 열린다. */

    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, '')
    .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')

    const h = (out.match(/<svg[^>]*\sheight\s*=\s*"([\d.]+)/i) || [])[1];
    if (w && h) out = out.replace(/<svg/i, '<svg viewBox="0 0 ' + w + ' ' + h + '"');

    '<svg' + a.replace(/\s(width|height)\s*=\s*"[^"]*"/gi, '') + ' style="width:100%;height:auto;display:block">');

  const t = (String(svg).match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1];

function mcBox(c, k, edit){
  const wrap = el('div', 'mcbox');

  const st = { s: 1, x: 0, y: 0 };
  const apply = () => { inner.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.s + ')'; };

    }
    if (e.touches.length === 2){
      e.preventDefault();
      const a = e.touches[0], b = e.touches[1];

      tp.d = d;
    }

  zoom.addEventListener('touchend', () => { tp = null; }, { passive: true });
  zoom.addEventListener('dblclick', () => { st.s = 1; st.x = 0; st.y = 0; apply(); });
  wrap.appendChild(zoom);
  return wrap;
}

/* ══════════ 가운데 마디 열 (민법OX 이식 · 2026-08-26) ══════════
   한 행 = 마디 하나. 총문제 · 🃏 암기노트 · 회독 진행중 · 회독수를 그 자리에서 보인다.
   ★ 회독 scope 는 기존과 같은 `mok|<과목>|__mg<i>` 다 — 이미 쌓인 회독 기록이 그대로 붙는다. */
function mgRoll(M,i){
  /* ★ 8/26 사용자 확정 — **자기 마디에 직접 붙은 것만** 센다.
     전엔 하위 마디를 전부 합쳐서 「대목차 39 = 소목차 39」 처럼 같은 수가 두 번 나왔고
     같은 지문이 부모 화면과 자식 화면에 겹쳐 보였다.
     차례는 ID 순으로 고정한다 — 제7판 ID 는 교재 차례대로 매겨져 있다. */
  const n=M[i];
  return [Array.from(new Set(n.지문)).sort(),Array.from(new Set(n.리담))];
}
function mgKeys(M,i,byId,P7map){
  const r=mgRoll(M,i),keys=[];
  r[1].forEach(id=>{const q=byId[id];if(q)(q.지문||[]).forEach(z=>keys.push(oxKeyLid(q,z)));});
  r[0].forEach(id=>{const z=P7map[id];if(z)keys.push(oxKeyP7(z));});
  return keys;
}
/* ★ 한 행 = 마디 하나. 왼쪽 이름칸(누를 수 없다)과 오른쪽 회독칸이 같은 줄에 놓인다.
   두 칸을 한 컨테이너 안에 넣었으므로 스크롤·접기가 저절로 같이 움직인다 —
   따로 스크롤을 맞추는 코드가 없다(맞추려 들면 반드시 어긋난다). */
function qlRow(M,i,sel,label,keys,subj,kid,folded){
  const n = (i==='un') ? null : M[i];
  const scope='mok|'+subj+'|'+sel;
  const rl=rndList(scope), rn=rl.length, total=keys.length;
  const done=keys.filter(k=>(oxOf(k)||{}).p).length;
  const cards=keys.reduce((a,k)=>a+mcCount(k),0);
  const row=el('div','qlr'+(n&&n.깊이===1?' ch':'')+(S.mok===sel?' on':''));
  const nm=el('div','qlnm');
  nm.style.paddingLeft=(9+((n?n.깊이:1)-1)*12)+'px';
  const ar=el('span','qlar'+(kid?' k':''), kid?(folded?'▸':'▾'):'');
  if(kid)ar.onclick=ev=>{ev.stopPropagation();S.mgFold[i]=!folded;render();};
  nm.appendChild(ar);
  const t=el('span','qlnmt',label);
  if(n&&n.출처==='제7판')t.style.color='#d4b04a';
  nm.appendChild(t);
  /* ★ 대목차(장)는 이름만 있는 머리줄이다(사용자 확정 8/26) — 판례탭과 같은 결.
     지문은 가장 깊은 마디에만 앉으므로 장은 언제나 0이 된다. 그 0을 보여 주는 대신
     수·🃏·회독칸을 통째로 비운다. 판정은 지문 수가 아니라 마디의 `장` 값으로 한다. */
  /* ★ 8/26 화면 확인 — `장` 만으로는 모자랐다. 지문이 가장 깊은 마디에만 앉으므로
     중간 마디도 전부 0 이 된다. **자기 지문이 0이면 머리줄**로 본다. */
  const isJang = !!(n && n.장) || !total;
  if(!isJang){
    nm.appendChild(el('span','qltot','총 '+total+'문제'));
    const note=el('button','qlnote'+(cards?' on':''),'🃏'+(cards?' '+cards:''));
    note.title='암기노트';
    note.onclick=ev=>{ev.stopPropagation();mcChapOpen(label,keys,ev);};
    nm.appendChild(note);
  }
  row.appendChild(nm);
  const rd=el('div','qlrd');
  if(isJang){ row.appendChild(rd); return row; }
  if(rn){
    const r=rl[rn-1];
    /* ★ v3-D §2 — 마감 회독 배지 = N회독 🔵헷 ⚠페 🔴틀 /전체. 옛 항목은 ⚠–. 누르면 회독별 비교 */
    const bg=el('button','qlb',
      r.n+'회독 🔵'+r.confuse+' ⚠'+(r.fake!=null?r.fake:'–')+' 🔴'+r.wrong+' /'+(r.total!=null?r.total:r.done));
    bg.title='누르면 회독별 비교';
    bg.onclick=ev=>{ev.stopPropagation();rndPop(scope,keys,label,ev);};
    rd.appendChild(bg);
  }
  if(total){
    /* ★ 회독 「마감」 버튼은 두지 않는다(사용자 확정 8/26) —
       진행중이면 「이어서 풀기」 하나뿐이고, 다 풀었을 때만 다음 회독 시작이 마감을 겸한다. */
    if(done>0&&done<total){
      rd.appendChild(el('span','qlrun','▶ '+(rn+1)+'회독 진행중 '+done+'/'+total));
      const go=el('button','qlgo cont','이어서 풀기');
      go.onclick=()=>{S.mok=sel;S.oxPage=null;render();};
      rd.appendChild(go);
    }else if(done>=total){
      /* ★ v3-D §2 — 다 푼 판도 마감 회독과 같은 배지 꼴(지금 상태로 센다). 누르면 회독별 비교 */
      const cc={c:0,b:0,f:0};
      keys.forEach(k=>{const st=oxState(k);
        if(st===2)cc.c++;else if(st===3)cc.b++;
        if(oxTagOn(k,'fake'))cc.f++;});
      const bg=el('button','qlb',(rn+1)+'회독 🔵'+cc.c+' ⚠'+cc.f+' 🔴'+cc.b+' /'+total);
      bg.title='다 푼 판 — 누르면 회독별 비교';
      bg.onclick=ev=>{ev.stopPropagation();rndPop(scope,keys,label,ev);};
      rd.appendChild(bg);
      const go=el('button','qlgo',(rn+2)+'회독 시작');
      go.title='이 판을 마감하고 다음 회독을 연다';
      go.onclick=()=>{S.mok=sel;S.oxPage=null;rndClose(scope,keys,label);};
      rd.appendChild(go);
    }else{
      const go=el('button','qlgo gray',(rn+1)+'회독 시작');
      go.onclick=()=>{S.mok=sel;S.oxPage=null;render();};
      rd.appendChild(go);
    }
  }else{
    rd.appendChild(el('span','qlb','문항 없음'));
  }
  row.appendChild(rd);
  return row;
}
function qlColumn(MG,JM,byId,P7,subj){
  const list=el('div','qlwrap'+(S.treeHid&&S.listHid?' hid':'')+
    (S.treeHid?' nonm':'')+(S.listHid?' nord':''));
  if(!MG){list.appendChild(el('div','h','목차 없음 — 특허만 있다'));return list;}
  const M=MG.마디,P7map={};
  if(P7)P7.지문.forEach(z=>P7map[z.id]=z);
  const anc=[];
  M.forEach((n,i)=>{
    while(anc.length&&M[anc[anc.length-1]].깊이>=n.깊이)anc.pop();
    const hid=anc.some(a=>S.mgFold[a]);
    const kid=(i+1<M.length)&&(M[i+1].깊이>n.깊이);
    anc.push(i);
    if(hid)return;
    const keys=mgKeys(M,i,byId,P7map);
    const label=(n.no?n.no+(n.깊이===1?'. ':' '):'')+n.제목;
    const r=qlRow(M,i,'__mg'+i,label,keys,subj,kid,!!S.mgFold[i]);
    const tip=[];
    if(n.p7&&n.p7.length)tip.push('제7판: '+n.p7.join(' / '));
    if(n.쪽)tip.push('인쇄 p.'+n.쪽);
    if(n.고정)tip.push('※ 손으로 고정한 대응');
    if(tip.length)r.title=tip.join(String.fromCharCode(10));
    list.appendChild(r);
  });
  const placed=new Set();
  M.forEach(n=>n.리담.forEach(x=>placed.add(x)));
  const unk=[];
  JM.문제.filter(q=>!placed.has(q.id))
        .forEach(q=>(q.지문||[]).forEach(z=>unk.push(oxKeyLid(q,z))));
  list.appendChild(qlRow(M,'un','__미분류','미분류 (리담)',unk,subj,false,false));
  return list;
}

/* ══════════ 과제 7 — 연도별 기출뷰 + OMR (2026-08-26 · 지시서 v3-B §8) ══════════
   ⚠ 정렬·기록 키는 **A형 시험문번**이다. 리담 `문번`(순번)은 96.3%가 시험문번과 다르다 —
      순번으로 붙이면 매칭률 100%로 조용히 남의 정답으로 채점된다(8/26 로그).
   ⚠ 정답표가 없는 해(2026 등)는 **채점하지 않는다는 것을 화면에 밝힌다**(§8-2). */
const GI_KEY  = REC_PRE + 'gi';        // 문항 풀이 — 키 = 연도:시험문번
const GIY_KEY = REC_PRE + 'gi.year';   // 연도별 제출 이력
let GIREC = null, GIYREC = null, GIOMR = null;
function giAll(){ if (!GIREC) GIREC = lsRead(GI_KEY); return GIREC; }
function giYAll(){ if (!GIYREC) GIYREC = lsRead(GIY_KEY); return GIYREC; }
function giNo(q){ return q.시험문번 || q.문번; }
function giKey(q){ return (q.연도 || '') + ':' + (q.시험문번 ? q.시험문번 : ('r' + q.문번)); }
function giAns(q){ return String(q.정답 || '').split(',').map(s => s.trim()).filter(Boolean); }
function giGradable(q){ return giAns(q).length > 0; }
function giOf(k){ return giAll()[k] || null; }
function giPut(k, patch){
  const A = giAll(), cur = A[k] || {};
  A[k] = Object.assign({}, cur, patch, { ts: nowIso() });
  GIREC = A; lsWrite(GI_KEY, A, '기출뷰 풀이');
}
function giPick(q, n){
  const k = giKey(q), cur = giOf(k) || {};
  giPut(k, { p: (String(cur.p || '') === String(n) ? '' : String(n)) });
}
function giYearOf(y){ return giYAll()[y] || null; }
function giYearPut(y, v){
  const A = giYAll();
  if (v === null) delete A[y]; else A[y] = Object.assign({}, A[y] || {}, v, { ts: nowIso() });
  GIYREC = A; lsWrite(GIY_KEY, A, '기출뷰 회차');
}
/* 끝까지 풀고 **일괄 채점**한다(§8-1) — 중간에 답을 보여주지 않는다 */
function giGrade(y, list){
  const gr = list.filter(giGradable);
  if (!gr.length){ toast('이 해는 최종정답이 없어 채점할 수 없다', 1); return false; }
  const blank = gr.filter(q => !(giOf(giKey(q)) || {}).p).length;
  if (blank && !confirm('안 찍은 문항이 ' + blank + '개 있다. 그대로 제출한다.')) return false;
  let right = 0;
  gr.forEach(q => {
    const k = giKey(q), p = (giOf(k) || {}).p || '';
    const ok = !!p && giAns(q).indexOf(String(p)) >= 0;
    if (ok) right++;
    giPut(k, { ok: ok, g: 1 });
  });
  giYearPut(y, { sub: nowIso(), n: gr.length, right: right });
  toast(y + '년 ' + right + '/' + gr.length + ' 맞음');
  return true;
}
function giReset(y, list){
  if (!confirm(y + '년 풀이를 지우고 다시 푼다. 찍은 답과 채점 결과가 사라진다.')) return;
  const A = giAll();
  list.forEach(q => { delete A[giKey(q)]; });
  GIREC = A; lsWrite(GI_KEY, A, '기출뷰 풀이');
  giYearPut(y, null);
  S.omr = false; S.giWrong = false; render();
}
/* ★ 키보드 — 숫자 1~5. ⚠ 입력칸에 포커스가 있으면 그대로 흘려보낸다(§8-2 ·
      검색창에 숫자를 못 치게 되는 사고를 막는다). */
document.addEventListener('keydown', ev => {
  if (!S.omr) return;
  const t = document.activeElement, tn = t ? (t.tagName || '').toLowerCase() : '';
  if (tn === 'input' || tn === 'textarea' || (t && t.isContentEditable)) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const L = GIOMR;
  if (ev.key === 'Escape'){ S.omr = false; render(); ev.preventDefault(); return; }
  if (!L || !L.length) return;
  if (!(S.omrCur >= 0)) S.omrCur = 0;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight'){
    S.omrCur = Math.min(L.length - 1, S.omrCur + 1); render(); ev.preventDefault(); return; }
  if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft'){
    S.omrCur = Math.max(0, S.omrCur - 1); render(); ev.preventDefault(); return; }
  if (/^[1-5]$/.test(ev.key)){
    const q = L[S.omrCur]; if (!q) return;
    giPut(giKey(q), { p: ev.key });
    S.omrCur = Math.min(L.length - 1, S.omrCur + 1);
    render(); ev.preventDefault();
  }
});
const OMARK = ['①', '②', '③', '④', '⑤'];
/* ── OMR 모달 패드 — 미응답은 붉게 드러난다(§8-2) ── */
function giOmrPad(y, list){
  const wrap = el('div', 'omrwrap');
  wrap.onclick = ev => { if (ev.target === wrap){ S.omr = false; render(); } };
  const box = el('div', 'omr');
  const hd = el('div', 'omrhd');
  hd.appendChild(el('b', '', y + '년 OMR'));
  hd.appendChild(el('span', 'badge', '숫자 1~5 · ↑↓ 이동 · Esc 닫기'));
  const cb = el('button', 'tool', '닫기');
  cb.onclick = () => { S.omr = false; render(); };
  hd.appendChild(cb);
  box.appendChild(hd);
  const g = el('div', 'omrgrid');
  list.forEach((q, i) => {
    const rec = giOf(giKey(q)) || {}, ans = giAns(q);
    const row = el('div', 'omrrow' + (i === S.omrCur ? ' cur' : ''));
    const nm = el('span', 'omrno' + (rec.p || !ans.length ? '' : ' blank'), giNo(q) + '');
    nm.onclick = () => { S.omrCur = i; render(); };
    row.appendChild(nm);
    ['1', '2', '3', '4', '5'].forEach(n => {
      const on = String(rec.p || '') === n;
      const b = el('button', 'omrb' + (on ? ' on' : '') +
        (rec.g && ans.indexOf(n) >= 0 ? ' ans' : ''), OMARK[+n - 1]);
      b.onclick = () => { S.omrCur = i; giPick(q, n); render(); };
      row.appendChild(b);
    });
    if (!ans.length) row.appendChild(el('span', 'badge', '정답표 없음'));
    else if (rec.g) row.appendChild(el('span', 'qb ' + (rec.ok ? 't' : 'warn'), rec.ok ? '○' : '✕'));
    g.appendChild(row);
  });
  box.appendChild(g);
  const ft = el('div', 'omrft');
  const gr = list.filter(giGradable);
  const blank = gr.filter(q => !(giOf(giKey(q)) || {}).p).length;
  ft.appendChild(el('span', 'badge', '안 찍은 문항 ' + blank + ' / ' + gr.length));
  const sb = el('button', 'tool on', '제출 · 일괄 채점');
  sb.onclick = () => { if (giGrade(y, list)){ S.omr = false; S.giWrong = false; render(); } };
  ft.appendChild(sb);
  box.appendChild(ft);
  wrap.appendChild(box);
  return wrap;
}
/* ── 오지선다 문항 카드 — 지문 단위가 아니라 **문항 단위**다(§8-1) ── */
function giCard(q, graded){
  const k = giKey(q), rec = giOf(k) || {}, ans = giAns(q);
  const c = el('div', 'jimun'); c.id = 'gi-' + k;
  const h = el('div', 'jhd');
  h.appendChild(el('span', 'qb n', giNo(q) + '번'));
  // ⚠ 8/26 사용자 — A형 칩·리담 순번 칩은 안 붙인다(머리 배지는 시험 자리만 보인다)
  if (q.출처) h.appendChild(el('span', 'src ' + q.출처, q.출처));
  if (q.갈래) h.appendChild(el('span', 'qb t', q.갈래));
  if (!ans.length) h.appendChild(el('span', 'qb warn', '정답표 없음 · 채점 안 함'));
  else if (ans.length > 1) h.appendChild(el('span', 'qb warn', '복수정답'));
  if (graded && ans.length)
    h.appendChild(el('span', 'qb ' + (rec.ok ? 't' : 'warn'), rec.ok ? '맞음' : '틀림'));
  c.appendChild(h);
  c.appendChild(el('div', 'qt', q.발문 || ''));
  // 조합형 — 보기 ㄱ~ㅁ 을 선지 위에 둔다(보기도 지문이다)
  (q.보기 || []).forEach(g => {
    const r = el('div', 'gich');
    r.appendChild(el('button', 'ginum', g.보기기호));
    r.appendChild(el('div', 'gitx', g.보기본문 || ''));
    if (graded && g.정오) r.appendChild(el('span', 'qb ' + (g.정오 === 'O' ? 't' : 'warn'), g.정오));
    c.appendChild(r);
  });
  (q.지문 || []).forEach((z, i) => {
    const n = String(i + 1), sel = String(rec.p || '') === n;
    const row = el('div', 'gich' + (sel ? ' sel' : '') +
      (graded && ans.length ? (ans.indexOf(n) >= 0 ? ' ans' : (sel ? ' bad' : '')) : ''));
    const b = el('button', 'ginum', OMARK[i] || (i + 1));
    b.onclick = () => { giPick(q, n); render(); };
    row.appendChild(b);
    row.appendChild(el('div', 'gitx', z.t || ''));
    c.appendChild(row);
    if (graded && z.sol) c.appendChild(el('div', 'gisol', z.sol));
  });
  if (graded && ans.length)
    c.appendChild(el('div', 'badge', '정답 ' + ans.map(x => OMARK[+x - 1] || x).join('·')));
  return c;
}
/* ── 연도별 기출뷰 본문 ── */
function giView(main, JM){
  const byY = collect(JM.문제, q => q.연도);
  const ys = Object.keys(byY).sort().reverse();
  const y = (S.year && byY[S.year]) ? S.year : ys[0];
  S.year = y;
  // ★ 시험문번으로 정렬한다. 순번(`문번`)은 뒷순위 동률 처리에만 쓴다
  const list = byY[y].slice().sort((a, b) => ((+giNo(a)) - (+giNo(b))) || ((+a.문번) - (+b.문번)));
  GIOMR = list;
  if (!(S.omrCur >= 0)) S.omrCur = 0;
  if (S.omrCur > list.length - 1) S.omrCur = 0;
  const gr = list.filter(giGradable), yrec = giYearOf(y) || {}, q0 = list[0] || {};
  main.appendChild(el('div', 'badge',
    y + '년 ' + (q0.회차 ? q0.회차 + '회 ' : '') + '· ' + list.length + '문항' +
    (q0.형 ? ' · ' + q0.형 + '형' : '') + (gr.length ? ' · 채점 가능 ' + gr.length : '')));
  if (!gr.length)
    main.appendChild(emptyBox('⚠', y + '년은 최종정답이 아직 없다 — 채점하지 않는다',
      '문제는 그대로 보고 풀 수 있다. 조용히 오답으로 처리하지 않는다'));
  else if (gr.length < list.length)
    main.appendChild(el('div', 'badge', '⚠ 시험문번·정답이 확정된 것은 ' + gr.length +
      '문항 — 나머지 ' + (list.length - gr.length) + '문항은 채점에서 뺀다'));
  const bar = el('div', 'modebar');
  bar.appendChild(el('span', 'pl', '📝 기출'));
  const ob = el('button', 'tool' + (S.omr ? ' on' : ''), 'OMR');
  ob.onclick = () => { S.omr = !S.omr; render(); };
  bar.appendChild(ob);
  if (yrec.sub){
    bar.appendChild(el('span', 'badge',
      '채점됨 ' + yrec.right + '/' + yrec.n + ' · ' + String(yrec.sub).slice(0, 10)));
    const wb = el('button', 'tool' + (S.giWrong ? ' on' : ''), '오답만 다시');
    wb.onclick = () => { S.giWrong = !S.giWrong; render(); };
    bar.appendChild(wb);
  } else if (gr.length){
    const sb = el('button', 'tool', '제출 · 일괄 채점');
    sb.onclick = () => { if (giGrade(y, list)){ S.omr = false; render(); } };
    bar.appendChild(sb);
  }
  const rb = el('button', 'tool', '다시 풀기');
  rb.onclick = () => giReset(y, list);
  bar.appendChild(rb);
  main.appendChild(bar);
  if (S.omr) main.appendChild(giOmrPad(y, list));
  let show = list;
  if (S.giWrong && yrec.sub)
    show = list.filter(q => { const r = giOf(giKey(q)) || {}; return r.g && !r.ok; });
  if (!show.length) main.appendChild(emptyBox('🎯', '오답이 없다', '「오답만 다시」를 끄면 전체가 나온다'));
  else show.forEach(q => main.appendChild(giCard(q, !!yrec.sub)));
}

/* ★ 제7판 지문 본문 청소 — 표시층만 (8/26)
   원장 `t` 에 교재 조판 잔재가 같이 들어와 있다. 실측 1,625행 중
   `[NN 변리]` 1,624 · 인쇄 정답표기 `답 I O I X I` 226 · 쪽머리글 46 · 줄바꿈 1,514.
   태그는 머리 배지와 같은 값이라 두 번 보였다.
   ⚠ 원장 csv 는 건드리지 않는다 — 재추출은 지문 ID 게이트로 번진다. 안 보이게만 한다. */
function p7Text(t){
  let x = String(t || '');
  x = x.replace(/\[\s*\d{2}(?:[\s\u00b7,]+\d{2})*\s*변리\s*\]/g, '');
  x = x.replace(/(^|\n)[ \t]*답[ \t]*[I|][^\n]*/g, '');
  x = x.replace(/(^|\n)[ \t]*제\d+편[ \t]+[^\n]*$/g, '');
  return x.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ').trim();
}

/* ★ 근거 조문 — 제7판 지문에는 근거 「열」이 없고 **해설 본문**에 박혀 있다 (8/26 실측).
   해설 있는 1,301개 중 691개에 표기가 있다 — 法 1,121회 · 施規 41회.
   꼴 두 가지 — 「法2조3호 가목」 · 「法197①」 · 「施規106의4」.
   ⚠ 施規(시행규칙)는 앱에도 API에도 데이터가 없다 — 배지만 달고 링크는 걸지 않는다. */
/* ★ 8/26 — `제N조` 꼴까지 넓혔다(사용자 확정). 전엔 `法 11` 한자 약물만 잡아
   `특허법 제11조` 로 적힌 해설 356건이 통째로 칩을 못 받고 있었다.
   실측 681건 중 — 딴 법 이름이 앞에 붙은 66건 제외 · 특허법 조문 목록 밖 25건 제외 → 590 채택. */
const JO_OTHER=/(민사소송법|민법|상표법|디자인보호법|실용신안법|저작권법|형법|행정소송법|행정심판법|시행령|시행규칙|조약|협약)\s*$/;
function p7Jo(sol, extra){
  const out=[], seen={}, s=String(sol||'');
  const add=(k,law)=>{if(k&&!seen[k]){seen[k]=1;out.push({k:k,law:law});}};
  s.replace(/法\s*(\d+)(?:조)?(?:의\s*(\d+))?/g,(m,a,b)=>{
    add('제'+a+'조'+(b?'의'+b:''),true);return m;});
  const RX=/제\s?(\d+)조(?:의\s?(\d+))?/g; let m2;
  while((m2=RX.exec(s))){
    if(JO_OTHER.test(s.slice(Math.max(0,m2.index-14),m2.index)))continue;
    const k='제'+m2[1]+'조'+(m2[2]?'의'+m2[2]:'');
    if(JOKEY&&!JOKEY[k])continue;      // 목록에 없는 번호는 딴 법이거나 삭제조다
    add(k,true);
  }
  s.replace(/施規\s*(\d+)(?:의\s*(\d+))?/g,(m,a,b)=>{
    add('施規 '+a+(b?'의'+b:''),false);return m;});
  // 리담 짝에서 물려받은 근거조문 — 해설 파싱보다 이쪽이 정본이다
  (extra||[]).forEach(c=>{const k=joKeyOf(c);if(!JOKEY||JOKEY[k])add(k,true);});
  return out.slice(0,5);
}
/* ★ 조문은 뷰로 옮겨 가지 않고 **팝업**으로 띄운다(사용자 확정 8/26).
   `popJo` 는 볼트 본문을 그대로 렌더하고 머리에 「뷰로 이동」을 달아 준다. */
/* ══════ 법전 조판 (사진 실측 2026-08-26) ══════
   재료 = 볼트 원문 줄들. 계층은 이미 들여쓰기로 들어와 있다 — 항 0 · 호 2 · 목 4.
   한 줄 17전각 · 한 단 45줄 · 줄간격 1.3 · 호는 내어쓰기 2전각 · 개정 표기 0.82배.
   ⚠ 글자는 하나도 고치지 않는다. 【 】 로 보이는 것은 표시층 치환일 뿐이다. */
const JOCOLS = 17;     // 한 줄 글자 수 — 사진과 어긋나면 이 숫자 하나만 고친다
const JOROWS = 45;     // 한 단 줄 수
let JOEM = 0;
function joEm(){
  if (JOEM) return JOEM;
  const p = el('span', '', '가');
  p.style.cssText = 'position:absolute;visibility:hidden;line-height:1;'
    + "font-family:'Batang','BatangChe','Nanum Myeongjo',serif";
  document.body.appendChild(p);
  JOEM = p.getBoundingClientRect().width || 0;
  p.remove();
  return JOEM;
}
const JOREV = /(<(?:개정|신설|전문개정|본조신설)[^>]*>|\[[^\]]*(?:개정|신설)[^\]]*\]|\([^()]*(?:개정|신설)\))/g;
function joPiece(host, t){
  // 개정·신설 표기만 작게. 나머지 글자는 그대로 둔다.
  let i = 0, m;
  const re = new RegExp(JOREV.source, 'g');
  while ((m = re.exec(t))){
    if (m.index > i) host.appendChild(document.createTextNode(t.slice(i, m.index)));
    host.appendChild(el('span', 'bjrev', m[0]));
    i = m.index + m[0].length;
  }
  if (i < t.length) host.appendChild(document.createTextNode(t.slice(i)));
}
function beopjeon(host, lines){
  const L = (lines || []).map(String);
  const wrap = el('div', 'bjwrap');
  let n = 0;
  L.forEach((raw, ix) => {
    const lead = raw.length - raw.replace(/^\s+/, '').length;
    const t = raw.trim();
    if (!t) return;
    const d = el('div', 'bjline' + (lead >= 4 ? ' bjmok' : lead >= 2 ? ' bjho' : ''));
    if (ix === 0){
      // 조 제목 줄 — 다음 줄(항)을 이어 붙이고 제목만 굵게 한다
      const mt = t.match(/^(\S+조(?:의\d+)?)\s*\(([^)]*)\)\s*$/);
      if (mt){
        const b = el('b', 'bjti', mt[1] + '【' + mt[2] + '】');
        d.appendChild(b);
      } else {
        d.appendChild(el('b', 'bjti', t));
      }
      const nx = (L[1] || '').trim();
      if (nx && !/^\s{2}/.test(L[1] || '')){ joPiece(d, nx); L[1] = ''; }
    } else {
      joPiece(d, t);
    }
    wrap.appendChild(d);
    n += Math.max(1, Math.ceil(t.length / JOCOLS));
  });
  const em = joEm();
  if (em){
    const one = JOCOLS * em;
    if (n > JOROWS){
      wrap.style.width = (one * 2 + 1.4 * em) + 'px';
      wrap.style.height = (JOROWS * 1.3 * em) + 'px';
      wrap.style.columnCount = 2;
      wrap.style.columnFill = 'auto';
    } else {
      wrap.style.width = one + 'px';
    }
  }
  host.appendChild(wrap);
}

// ── 제7판 「nn 변리」 지문 = 지문 단위 OX (문항 묶음이 없다)
function p7Card(z,seq){
  const card=el('div','qwrap');
  card.id = 'qb-' + oxKeyP7(z);

function omrTiles(stage, inner, META){
  const pg = S.omrPage;

  const dpi = eff <= 4.2 ? 300 : eff <= 8.4 ? 600 : 900;

  const r0 = Math.max(0, Math.floor(vy0 / tpt)), r1 = Math.min(tm.rows - 1, Math.floor(vy1 / tpt));

    for (let tx = c0; tx <= c1; tx++) want[dpi + '/' + tx + '_' + ty] = [tx, ty];

    if (!want[im.dataset.k]) im.remove(); else delete want[im.dataset.k];
  });
  Object.keys(want).forEach(k => {
    const tx = want[k][0], ty = want[k][1];
    const im = el('img', 'omrtile');
    im.dataset.k = k;
    im.src = DATA + 'omr/특허/t/' + pg + '/' + dpi + '/' + tx + '_' + ty + '.webp';
    im.style.left = (tx * tpt) + 'px'; im.style.top = (ty * tpt) + 'px';
    im.style.width = tpt + 'px';
    inner.insertBefore(im, inner.firstChild);
  });
}

  if (S.jimunTab === 'ox'){
    const P7all = {}; if (P7) P7.지문.forEach(z => P7all[z.id] = z);
    const pool = [];
    JM.문제.forEach(q => (q.지문 || []).forEach(z =>

       그런 키는 리담 쪽에서 안 세어지므로 여기서 빠뜨리면 풀·채점표·거르기에서 사라진다. */
    const sidL = new Set();

    OXPOOL = {}; OXDOMPG = {};

        /* ★ v3-D §1·R9 — 큐에도 순번(목록 순서)과 OMR. 쪽은 없다 · 큐 채점은 toast 그대로 */

  if(S.jimunTab==='ox'){

    }else if(S.mok&&S.mok.startsWith('__mg')&&MG){
      const i=+S.mok.slice(4), M=MG.마디, n=M[i];
      let jos=[...n.지문], lids=[...n.리담];
      for(let j=i+1;j<M.length;j++){
        if(M[j].깊이<=n.깊이)break;
        jos=jos.concat(M[j].지문); lids=lids.concat(M[j].리담);
      }
      jos=[...new Set(jos)]; lids=[...new Set(lids)];
      const P7map={};if(P7)P7.지문.forEach(z=>P7map[z.id]=z);
      const lidam=lids.map(id=>byId[id]).filter(Boolean);
      /* ★ 8/26 흡수 — 리담과 **같은 지문**인 제7판 행은 카드로 또 그리지 않는다.

         오지선다는 좌표로 묶어 그린다 — 선지를 다섯 벌 쌓아 두지 않는다.

            마디 배치는 리담·제7판이 따로라, 리담 쪽이 이 마디에 없으면

      const _seen=new Set();

      const bd=el('div','badge',
        `${n.no?n.no+' ':''}${n.제목} — 리담 문항 ${lidam.length} · 제7판 단독 지문 ${p7l.length}`+

      main.appendChild(bd);
      /* ★ v3-E §0 (8/27 사용자 확인) — 바닥 고정 바 폐기. 「📝 OMR」·「쪽·마킹」은 히트맵 줄로,
         「✅ 이 페이지 채점」은 마지막 카드 아래 한 번(다 채점되면 사라진다).
         「🏆 N+1회독 시작」은 화면에 안 둔다 — 가운데 열 하나로 충분하다. */
      const CARDS = mokCards(i);

      const allCells = mokCells(CARDS);
      allCells.forEach(x => { x.pg = CARDS[x.s - 1].pg; });
      // 마디에 막 들어왔다(S.oxPage=null) → 채점 안 된 문제가 처음 나오는 쪽(§6-4)
      if (S.oxPage == null){
        const f = allCells.find(x => oxAns(x.k, x.ans) && !((oxOf(x.k) || {}).p));
        S.oxPage = f ? f.pg : 0;

      if (!(S.oxPage >= 0) || S.oxPage >= nPg) S.oxPage = 0;
      const scope2 = 'mok|' + subj + '|' + S.mok;
      const mokLabel = (n.no ? n.no + ' ' : '') + n.제목;
      const keysAll = allCells.map(x => x.k);
      const ctx = { scope: scope2, keys: keysAll, label: mokLabel };
      const pageCards = nPg > 1 ? CARDS.filter(c => c.pg === S.oxPage) : CARDS;
      const pgCells = allCells.filter(x => x.pg === S.oxPage);
      const unDone = pgCells.filter(x => oxAns(x.k, x.ans) && !((oxOf(x.k) || {}).p));
      const marked = unDone.filter(x => ((oxOf(x.k) || {}).m));
      if (allCells.length){
        /* ★ v3-F3 ④ — 범위 단추(전체/대목차/중목차/소단원 · 이름으로 · S.heatScope 유지) ·

        const anc = {};
        {
          let d = (VJ.M[i] || {}).깊이 || 9;

          for (let j = i - 1; j >= 0; j--){

            if (nd.깊이 < d){
              d = nd.깊이;
              if (d === 2 && anc.mid == null) anc.mid = j;
              if (d === 1){ if (anc.top == null) anc.top = j; break; }
            }
          }
        }
        const mokNm = j => ((VJ.M[j].no ? VJ.M[j].no + (VJ.M[j].깊이 === 1 ? '. ' : ' ') : '') + VJ.M[j].제목);
        const cellsTop = (anc.top != null && anc.top !== i) ? mokCells(mokCards(anc.top)) : null;
        const cellsMid = (anc.mid != null && anc.mid !== i) ? mokCells(mokCards(anc.mid)) : null;
        if (!S.heatScope) S.heatScope = 'self';
        const heatCells = S.heatScope === 'all'
            ? Object.keys(OXPOOL || {}).map(k => ({ k: k, dom: ((OXPOOL || {})[k] || {}).dom }))
          : (S.heatScope === 'top' && cellsTop) ? cellsTop
          : (S.heatScope === 'mid' && cellsMid) ? cellsMid
          : allCells;
        const hb = heatBox(heatCells);
        const hh = hb.querySelector('.hmhd');
        if (hh){
          /* ★ v3-F4 (사용자 8/27 그림) — 머리 줄을 민법OX 「진행 히트맵」과 같은 크기·배열로:
             라벨 · 작은 범위 단추(전체는 수 없음) · 채점표·OMR · (빈칸) · 범례 · 「접기 ▲」 맨 오른쪽 */
          const legend = Array.from(hh.querySelectorAll('.hmlg'));
          const sc = el('div', 'hmscs');
          const scopes = [['all', '전체', null]];
          if (cellsTop) scopes.push(['top', mokNm(anc.top), cellsTop.length]);
          if (cellsMid) scopes.push(['mid', mokNm(anc.mid), cellsMid.length]);
          scopes.push(['self', '소단원', allCells.length]);
          scopes.forEach(p2 => {
            const b = el('button', 'hmsc' + (S.heatScope === p2[0] ? ' on' : ''), p2[1]);
            if (p2[2] != null){
              b.appendChild(document.createTextNode(' '));
              b.appendChild(el('b', '', p2[2].toLocaleString()));

            b.onclick = () => { S.heatScope = p2[0]; render(); };
            sc.appendChild(b);
          });
          hh.appendChild(sc);
          const sc2 = el('div', 'hmscs');
          const sbtn = el('button', 'hmsc', '📊 채점표');
          sbtn.title = '채점 결과 · 회독별 비교';
          sbtn.onclick = ev => rsltPop(scope2, keysAll, mokLabel, ev);
          sc2.appendChild(sbtn);
          const ob = el('button', 'hmsc', '📝 OMR');
          ob.onclick = ev => {
            const a0 = allCells.indexOf(pgCells[0]) + 1;
            oxOmrOpen(pgCells, 'OMR 마킹 · 문제 ' + a0 + '-' + (a0 + pgCells.length - 1) +
              ' / 총 ' + allCells.length, ctx, ev);
          };
          sc2.appendChild(ob);
          hh.appendChild(sc2);
          hh.appendChild(el('span', 'hmsp'));
          legend.forEach(s => hh.appendChild(s));
          const fold = el('button', 'hmfold', S.heatFold ? '펴기 ▼' : '접기 ▲');
          fold.title = '히트맵 칸만 접는다 — 머리 줄은 남는다';
          fold.onclick = () => { S.heatFold = !S.heatFold; uiSave(); render(); };
          hh.appendChild(fold);
        }
        const cv2 = hb.querySelector('.hmcv');
        if (cv2 && S.heatFold) cv2.style.display = 'none';
        main.appendChild(hb);
      }
      if (!CARDS.length)
        main.appendChild(emptyBox('📝','이 마디에 묶인 문항이 없다'));
      /* ★ v3-E §2·§4 — 거르기를 카드 표시에 실제로 배선한다(oxKeep 이 그간 안 불리고 있었다).
         쪽 구조·순번은 그대로 — 걸러진 카드만 숨긴다. */
      const cardPass = c => {
        if (S.oxFilter === 'all') return true;
        const cs = allCells.filter(x => x.s === c.s);
        if (!cs.length) return true;
        if (S.oxFilter === 'untype') return !tyOf(cs[0].k);
        return cs.some(x => oxKeep(x.k));
      };
      const shownCards = pageCards.filter(cardPass);
      if (!shownCards.length && pageCards.length)
        main.appendChild(emptyBox('📝','이 쪽에는 거르기에 걸리는 카드가 없다','거르기를 「전체」로 두면 다 보인다'));
      shownCards.forEach(c => main.appendChild(c.kind === 'L' ? qCard(c.q, null, c.s) : p7Card(c.z, c.s)));
      if (CARDS.length && (unDone.length || nPg > 1)){

          gb.onclick = () => oxGrade(pgCells, ctx);
          bar.appendChild(gb);
        }
        if (nPg > 1 && S.oxPage < nPg - 1){
          const nn = allCells.filter(x => x.pg === S.oxPage + 1).length;   // 문제(지문) 단위
          const gb2 = el('button', 'pgbig', '▶ 다음 ' + nn + '문제');
          gb2.onclick = () => { S.oxPage++; S.oxPageJump = true; render(); };
          bar.appendChild(gb2);
        }
        main.appendChild(bar);
      }
      /* ★ v3-F §6-1 — 「쪽·마킹」 알약: 오른쪽에 떠서 스크롤을 따라온다(두 단추 위).
         마킹은 render 를 부르므로 알약도 그때마다 새 수로 그려진다. */
      if (CARDS.length){
        const pill = el('div', 'oxpill'); pill.id = 'oxpill';
        pill.appendChild(el('span', '', '쪽 ' + (S.oxPage + 1) + '/' + nPg +

          const gb = el('button', 'pgbig', '✅ 이 페이지 채점');
          gb.style.padding = '2px 10px';
          gb.onclick = () => oxGrade(pgCells, ctx);
          pill.appendChild(gb);
        }
        document.body.appendChild(pill);
      }
      /* ★ v3-D §5 — 한 번이라도 채점한 판에서만 떠 있는 두 단추(큐에는 없다) */
      if (CARDS.length && keysAll.some(k => ((oxOf(k) || {}).p))){
        const fw = el('div'); fw.id = 'oxfab';
        fw.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:55;'
          + 'display:flex;flex-direction:column;gap:8px;align-items:flex-end';
        const fb1 = el('button', 'tool', '📊 채점표');
        fb1.style.cssText = 'background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18)';
        fb1.onclick = ev => rsltPop(scope2, keysAll, mokLabel, ev);
        const fb2 = el('button', 'tool on', '◈ 단원 최종 결과 저장 및 보기');
        fb2.style.cssText = 'box-shadow:0 4px 14px rgba(0,0,0,.18)';
        fb2.onclick = () => rndClose(scope2, keysAll, mokLabel);
        fw.appendChild(fb1); fw.appendChild(fb2);
        document.body.appendChild(fw);
      }
    }else if(!S.mok){
      main.appendChild(emptyBox('📝','가운데 목록에서 마디를 고르면 그 마디 문항이 묶여 나온다',
        '문제가 있는 마디에만 「총 N문제」가 붙는다'));
    }else{
      let list;
      if(S.mok==='__미분류'){
        const placed=new Set();
        (MG?MG.마디:[]).forEach(n=>n.리담.forEach(x=>placed.add(x)));
        list=JM.문제.filter(q=>!placed.has(q.id));
        main.appendChild(el('div','badge','미분류 '+list.length+'문항 — 근거조문이 없거나 마디 제목에 조문이 안 적혀 못 붙은 것'));
      }else{
        const node=MK.마디.find(n=>n.파일===S.mok);
        list=((IDX||{})[S.mok]||[]).map(id=>byId[id]).filter(Boolean);
        const b=el('div','badge',(node?node.제목:'')+' — '+list.length+'문항'+

        main.appendChild(b);
      }
      if(!list.length)main.appendChild(emptyBox('📝','이 마디에 묶인 문항이 없다',
        '마디 제목에 조문번호가 없으면 묶이지 않는다'));
      else{
        /* ★ v3-D §1·R9 — 미분류에도 순번(목록 순서)·OMR(쪽 없음) · 채점 결과 창(§4) */
        list.forEach((q,ix)=>main.appendChild(qCard(q,null,ix+1)));
        const lc=[];
        list.forEach((q,ix)=>(q.지문||[]).forEach(z=>
          lc.push({k:oxKeyLid(q,z),dom:'qb-'+q.id,s:ix+1,zn:z.n,ans:z.ox||''})));
        const lUn=lc.filter(x=>oxAns(x.k,x.ans)&&!((oxOf(x.k)||{}).p));
        const lMk=lUn.filter(x=>((oxOf(x.k)||{}).m));
        const lCtx={scope:'mok|'+subj+'|'+S.mok,keys:lc.map(x=>x.k),
                    label:(S.mok==='__미분류'?'미분류 (리담)':String(S.mok))};
        if(lUn.length){
          const bar=el('div','modebar');   // ★ v3-E §0-1 — 고정(sticky) 아님
          const ob=el('button','tool','📝 OMR');
          ob.onclick=ev=>oxOmrOpen(lc,'OMR 마킹 · 문제 1-'+lc.length+' / 총 '+lc.length,lCtx,ev);
          bar.appendChild(ob);
          const spL=el('span');spL.style.flex='1';bar.appendChild(spL);
          bar.appendChild(el('span','badge','마킹 '+lMk.length+'/'+lUn.length));
          const spR=el('span');spR.style.flex='1';bar.appendChild(spR);
          const gb=el('button','pgbig','✅ 채점 ('+lMk.length+'/'+lUn.length+')');
          gb.onclick=()=>oxGrade(lc,lCtx);
          bar.appendChild(gb);
          main.appendChild(bar);
        }
      }
    }
  }else{
    giView(main, JM);   // 과제 7 — 연도별 기출뷰 + OMR (§8)
  }
  slot.appendChild(main);
}
function collect(arr,fn){

}

function skCut(t,q){
  const i=String(t||'').indexOf(q);
  if(i<0)return String(t||'').slice(0,60);
  return String(t).slice(Math.max(0,i-22),i+q.length+34);
}
/* ★ 8/26 — 지문 검색 결과에서 **그 지문 자리로 간다**(남은 항목이었다).
   제7판 지문이 어느 마디에 걸렸는지 되짚는 역색인이 없어 미뤄 뒀는데,
   `mokcha_병합.json` 의 마디마다 `지문`(제7판 ID)·`리담`(문항 ID) 목록이 이미 있다 —
   그걸 뒤집으면 한 번에 만들어진다. */
let MOKIDX = null;
async function mokIndex(){
  if (MOKIDX) return MOKIDX;
  MOKIDX = { p7: {}, lid: {} };
  try{
    const MG = await get('mokcha_병합.json');
    (MG.마디 || []).forEach((n, i) => {
      (n.지문 || []).forEach(id => { if (MOKIDX.p7[id] === undefined) MOKIDX.p7[id] = i; });
      (n.리담 || []).forEach(id => { if (MOKIDX.lid[id] === undefined) MOKIDX.lid[id] = i; });
    });
  }catch(e){}
  return MOKIDX;
}
async function gotoJimun(kind, id, dom){
  const ix = await mokIndex();
  const i = (kind === 'P' ? ix.p7 : ix.lid)[id];
  if (i === undefined){ toast('이 지문이 걸린 마디를 찾지 못했다 — 목차에 안 붙은 지문이다'); return; }
  S.tab = 'jimun'; S.jimunTab = 'ox'; S.oxQueue = ''; S.mok = '__mg' + i; S.oxPage = null;
  closeAllPops(); await render();
  /* ★ v3-C §6-2 — 목표 카드가 다른 쪽이면 그 쪽으로 넘긴다 */
  const pg = (OXDOMPG || {})[dom];
  if (pg != null && pg !== S.oxPage){ S.oxPage = pg; S.oxPageJump = true; await render(); }
  setTimeout(() => {
    const box = document.getElementById(dom);
    if (!box){ toast('마디는 열었는데 그 카드가 거르기에 걸려 있다'); return; }
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    box.classList.add('hmhit'); setTimeout(() => box.classList.remove('hmhit'), 2000);
  }, 60);
}
function popJimun(title,body,ev,go){
  const b=popShell('q','📝 '+title);
  if(go){
    const g=el('button','tool on','그 지문으로 가기 ↗');
    g.onclick=()=>gotoJimun(go.kind,go.id,go.dom);
    b.appendChild(g);
  }
  body.forEach(x=>b.appendChild(el('div',x[0],x[1])));
  showPop(ev);
}

          b.appendChild(go);

  if(SKON.jimun){

      const out=[];

                      t:z.t,ox:z.ox,sol:z.sol,tag:'리담',

          out.push({h:'제7판 '+z.태그+' p.'+(z.쪽||'—'),x:skCut(z.t,q),

function readHash(){
  let h=location.hash;
  try{h=decodeURIComponent(h);}catch(e){}
  const m=/^#jo=([^:]+):(제[^&#]+)/.exec(h);
  if(m&&LAWS.includes(m[1])){S.law=m[1];S.tab='jo';S.jo=m[2].split('#')[0];return true;}

}

let busy=false;
async function render(){
  if(busy)return;busy=true;
  /* ★ 스크롤 보존 (8/26) — slot 을 통째로 다시 그리므로 안 잡아 두면 누를 때마다 맨 위로 튄다.
     태그·O/X 가 「눌러도 아무 일 없다」로 보이던 원인이 이것이다. */
  const SCR={};
  ['main','tree','plist','qlwrap'].forEach(c=>{   // ★ 8/26 `qlist` 는 없는 클래스였다
    const n=document.querySelector('#slot .'+c);if(n)SCR[c]=n.scrollTop;});
  const scrBack=()=>Object.keys(SCR).forEach(c=>{
    if(c==='main'&&S.oxPageJump)return;   // ★ v3-C §6-2 — 쪽을 넘겼다: 맨 위에서 시작
    const n=document.querySelector('#slot .'+c);if(n)n.scrollTop=SCR[c];});
  inkReset();                       // 앞 화면의 ResizeObserver 를 끊는다
  {const f=document.getElementById('oxfab');if(f)f.remove();
   const p=document.getElementById('oxpill');if(p)p.remove();}  // ★ v3-D §5 · v3-F 알약 — 뷰마다 다시 단다
  // ⚠ body 에 건다 — 팝업(2차 셀 · 조문 팝업)이 #app 밖에 뜬다
  document.body.classList.toggle('inkon',!!S.ink);
  document.body.classList.toggle('stkon',!!S.stick);
  drawTop();drawRail();inkBar();
  try{
    if(S.tab==='prec')await viewPrec();
    else if(S.tab==='cha2')await view2cha();
    else if(S.tab==='jimun')await viewJimun();
    else if(S.tab==='omr')await viewOmr();   // ★ v3-E §1-3
    else await viewJo();
  }catch(err){
    const slot=$('#slot');slot.innerHTML='';
    const m=el('div','main');m.appendChild(emptyBox('⚠','데이터를 읽지 못했다',String(err&&err.message||err)));
    slot.appendChild(m);console.error(err);
  }
  scrBack();setTimeout(scrBack,0);
  setTimeout(()=>{S.oxPageJump=false;},0);   // 다음 render 부터는 다시 보존
  /* ★ v3-F §0 — 떠 있는 지문 팝업을 본 화면과 같은 상태로 다시 그린다(같은 sid 기록 공유) */
  CARDPOPS=CARDPOPS.filter(p=>p.body&&p.body.isConnected);
  CARDPOPS.forEach(p=>{try{p.paint();}catch(e){}});
  busy=false;
}
// 폭이 바뀌면 법전 조판의 단 수를 다시 잡는다. ⚠ 한 행 글자 수는 그대로다 — 단만 준다.
let rsz=null;
addEventListener('resize',()=>{
  clearTimeout(rsz);
  rsz=setTimeout(()=>{
    document.querySelectorAll('.bjpage').forEach(bjFit);
  },140);
});
readHash();
render();
</script>
