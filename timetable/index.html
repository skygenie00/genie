<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F57C00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>타임테이블</title>
<style>
:root{--ink:#222;--mute:#777;--line:#e2e2e2;--m8:#F57C00;--m8a:color-mix(in srgb,var(--m8) 55%,#fff);--m8b:color-mix(in srgb,var(--m8) 42%,#fff);--sky:#DCEBFA;--pink:#FBDDE2;--now:#e8f0fd;--blue:#2f6fe0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#ebebeb;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);font-size:12.5px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:150px 1fr;min-height:100vh;background:#fff}
/* sidebar */
.side{background:#f7f7f7;border-right:1px solid var(--line);padding:12px 10px;font-size:12.5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .who{font-weight:700;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;cursor:pointer}
.side .grp{font-size:10px;color:#999;margin:10px 0 3px;letter-spacing:.05em}
.side .i{padding:5px 8px;border-radius:5px;color:#444;cursor:pointer}
.side .i.on{background:#222;color:#fff}
.side .i.sub{padding-left:22px;font-size:11.5px;color:#666}
.side .i.sub.on{background:#ddd;color:#111}
.side .st{margin-top:30px;font-size:10px;color:#888;line-height:1.5}
.side .st.dirty{color:#c60}
.main{padding:14px 18px;overflow:hidden;min-width:0}
.ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.ttl b{font-size:18px}.ttl b span{font-weight:400;color:#888;font-size:14px}
.ttl .r{font-size:11px;color:#666;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #bbb;background:#fff;border-radius:4px;padding:4px 9px;font-size:11px}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.d{color:#c33;border-color:#e99}
.views{display:flex;gap:4px;font-size:11.5px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px;overflow-x:auto}
.views span{padding:3px 8px;border-radius:4px;color:#555;cursor:pointer;white-space:nowrap}
.views span.on{background:#eee;color:#111;font-weight:700}
.nav{display:flex;gap:6px;align-items:center}
.nav button{border:1px solid #ccc;background:#fff;border-radius:4px;padding:2px 8px}
/* day sheet */
.dpc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:16px}
.sheet{background:var(--m8);padding:10px;border-radius:6px}
.ribbon{background:#fff;text-align:center;font-weight:700;font-size:16px;padding:5px;margin:0 60px 8px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.paper{background:#fff;border-radius:4px;padding:10px;display:grid;grid-template-columns:5fr 6fr;gap:12px;background-image:linear-gradient(#f0f0f0 1px,transparent 1px),linear-gradient(90deg,#f0f0f0 1px,transparent 1px);background-size:10px 10px}
.paper>div{min-width:0}
.stc{display:flex;flex-direction:column;min-height:0}
.stc .st{flex:1;overflow:auto}
.hd{font-size:10px;color:#666;border-left:3px solid #666;padding-left:4px;margin-bottom:5px;font-weight:700}
.tt{display:grid;grid-template-columns:22px 1fr;row-gap:1px;font-size:9px;color:#555}
.tt .r{height:12px;position:relative;border-bottom:1px dotted var(--m8b);background-image:repeating-linear-gradient(90deg,transparent 0 calc(16.66% - 1px),var(--m8a) calc(16.66% - 1px) 16.66%)}
.tt .r b{position:absolute;top:1px;height:11px;display:block;border-radius:1px;cursor:pointer}
.tt .tth{position:relative;height:9px;font-size:7px;color:#999}
.tt .tth i{position:absolute;top:0;transform:translateX(-50%);font-style:normal}
.tt .r i.now{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--blue)}
.st{font-size:11px}
.st .it{display:flex;gap:6px;padding:4px 0;align-items:center;cursor:pointer;border-bottom:1px solid #f4f4f4}
.st .it:hover{background:color-mix(in srgb,var(--m8) 8%,#fff)}
.st .it.selr{background:var(--now)}
.st .it.done2 .pl{color:#aaa;text-decoration:line-through}
.st .it .btn{padding:1px 7px;font-size:10px;flex:none}
.st .sw{width:9px;height:9px;flex:none}
.st .nm{width:28px;font-weight:700}
.st .pl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{border-top:1px solid #ddd;margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;font-size:10px;color:#555;align-items:flex-end}
.foot .big{font-size:22px;font-weight:800;color:#222}
/* MiMi bar */
.mbar{margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11.5px;background:#fff}
.mbar .row1{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.mbar select,.mbar input{border:1px solid #ddd;border-radius:3px;padding:4px 6px;font-size:11.5px;min-width:0}
.mbar .subj{font-weight:700;width:76px}
.mbar .pl{flex:1 1 90px}.mbar .item{flex:2 1 120px}
.mbar .ss{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbar .ss button{text-align:center;border:1px solid #bbb;padding:9px;font-weight:800;font-size:15px;letter-spacing:.08em;border-radius:4px;background:#fff}
.mbar .ss button.dis{color:#bbb;border-color:#ddd;cursor:default}
.mbar .ss button.go{background:#222;color:#fff;border-color:#222}
.mbar .run{font-size:11px;color:var(--blue);font-weight:700;margin:-2px 0 6px}
.mbar .man{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:#666;flex-wrap:wrap}
.mbar .man input{width:64px}
/* three columns */
.three{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px}
.col{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;min-height:290px}
.col li{font-size:13px}
.col.today{border-color:#222;border-width:2px;background:#fcfcfc}
.col h5{font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
.col h5 small{color:#888;font-weight:400}
.col .sec{font-size:9.5px;color:#999;margin:8px 0 3px;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.col .sec .rgt{margin-left:auto;display:flex;gap:4px}
.col .sec .btn{font-size:9px;padding:1px 6px;letter-spacing:0}
.col ul{list-style:none}
.col li{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid #f0f0f0;align-items:center;line-height:1.25}
.col li.done{color:#aaa;text-decoration:line-through}
.col .cb{width:13px;height:13px;border:1.5px solid #666;border-radius:3px;flex:none;cursor:pointer;font-size:9px;line-height:11px;text-align:center}
.col .cb.on{background:#222;color:#fff;border-color:#222}
.col .m{margin-left:auto;font-size:9.5px;color:#888;white-space:nowrap}
.col .x{color:#bbb;cursor:pointer;padding:0 3px}
.col li.late{background:#fff8e6;margin:0 -4px;padding:5px 4px;border-radius:3px}
.col .iv{border:1px solid #333;border-radius:3px;font-size:10px;padding:3px 6px;text-align:center;margin-top:6px;font-weight:700;cursor:pointer;background:#fff}
.col .add{border:0;border-bottom:1px dashed #ddd;width:100%;padding:4px 0;font-size:11px;background:transparent;outline:0}
.peer{margin-top:8px;font-size:11px;color:#666}
/* week (MiMi 틀) */
.wk2{display:grid;grid-template-columns:26px repeat(7,1fr);font-size:9px}
.wk2 .wh{text-align:center;font-weight:700;padding:3px 0;border-bottom:1px solid var(--m8b);color:#555}
.wk2 .wh.today{color:var(--blue)}
.wk2 .wlab{display:grid;grid-template-rows:repeat(24,1fr);color:#888;text-align:right;padding-right:3px;height:374px}
.wk2 .wcol{position:relative;height:374px;border-left:1px solid var(--m8b);background-image:repeating-linear-gradient(180deg,transparent 0 calc(100%/24 - 1px),var(--m8a) calc(100%/24 - 1px) calc(100%/24))}
.wk2 .wcol b{position:absolute;left:1px;right:1px;display:block;border-radius:1px;cursor:pointer}
.wk2 .wt{text-align:center;font-weight:700;padding:3px 0;border-top:1px solid var(--m8b);color:#333}
.wk2 .wt.z{color:#bbb;font-weight:400}
.wstat{display:flex;gap:12px;align-items:baseline;justify-content:flex-end;margin-top:auto;border-top:1px solid #ddd;padding-top:6px;font-size:10px;color:#555}
.wstat b{font-size:14px}.wstat .big{font-size:22px;font-weight:800;color:#222}
/* month (MiMi 틀) */
.mo2{display:grid;grid-template-columns:repeat(7,1fr) 44px;font-size:9px;border:1px solid var(--m8b);border-radius:4px;overflow:hidden}
.mo2>div{border-left:1px solid var(--m8b);border-top:1px solid var(--m8b);background:#fff;min-height:0}
.mo2 .h{text-align:center;font-weight:700;color:#555;padding:3px 0;background:#fff}
.mo2 .h.sun{color:#c33}
.mo2 .d{min-height:40px;padding:2px 3px;cursor:pointer;position:relative}
.mo2 .d .n{font-size:8px;font-weight:700;color:#666}
.mo2 .d .n.sun{color:#c33}
.mo2 .d .v{text-align:center;font-weight:800;font-size:11px;margin-top:6px}
.mo2 .d .v.off{color:#ccc;font-weight:400}
.mo2 .d.red{background:var(--pink)}.mo2 .d.sky{background:var(--sky)}.mo2 .d.today{outline:2px solid var(--blue);outline-offset:-2px}
.mo2 .d.out{background:#fafafa;cursor:default}
.mo2 .wsum{text-align:center;font-weight:700;color:#333;padding-top:14px;background:#fafafa}
.mosum{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;font-size:10px;color:#555;margin:8px 0 12px;justify-content:flex-end}
.mosum b{font-size:12px}.mosum .big{font-size:22px;font-weight:800;color:#222}
/* to do tracker */
.trkw{overflow-x:auto}
.trk{display:grid;font-size:8px;align-items:center}
.trk .th{text-align:center;color:#888;padding:2px 0}
.trk .th.sun{color:#c33}
.trk .lbl{position:sticky;left:0;background:#fff;font-size:9px;padding:2px 4px;white-space:normal;line-height:1.25;max-height:2.6em;overflow:hidden;word-break:break-all;border-top:1px solid #f0f0f0}
.trk .c2{text-align:center;border-top:1px solid #f0f0f0;padding:3px 0}
.trk .c2.wk{border-left:1px dotted #ddd}
.trk .dot{display:inline-block;width:7px;height:7px;border-radius:50%;cursor:pointer}
.trk .dot.hollow{background:transparent!important;border:1px solid #ccc}
.trk .tm{text-align:right;font-size:9px;font-weight:700;padding:0 4px;border-top:1px solid #f0f0f0;position:sticky;right:0;background:#fff}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;margin:10px 0}
.sum b{font-size:14px}
/* 공통 할일 */
.cmt{border-collapse:collapse;font-size:11.5px;width:100%;margin-top:14px}
.cmt th,.cmt td{border-bottom:1px solid #eee;padding:5px 6px;text-align:left;white-space:nowrap}
.cmt th{font-size:10px;color:#888;font-weight:400}
.cmt td.t2{white-space:normal;width:99%}
.cmt tr.done td{color:#aaa;text-decoration:line-through}
.chip{display:inline-block;border-radius:9px;padding:1px 7px;font-size:10px;border:1px solid #ddd}
.chip.h{background:#FFF3B0;border-color:#e8d98a}.chip.k{background:var(--pink);border-color:#eec3ca}.chip.b{background:#fff}
.dd{font-size:10px;color:#555;font-weight:700}
.dd.late{color:#c33}
.pnav .bdg{background:#c33;color:#fff;border-radius:8px;padding:0 5px;font-size:9px;font-weight:700}
/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.gal .colh{font-size:13px;font-weight:700;padding:4px 0 8px;border-bottom:2px solid #222;margin-bottom:8px;display:flex;justify-content:space-between}
.gal .colh small{font-weight:400;color:#888}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fafafa;cursor:pointer}
.card.empty{background:#f4f4f4;border-style:dashed;cursor:default}
.card .th{height:96px;display:flex;align-items:center;justify-content:center;padding:6px;background:#f6f6f6}
.card.red .th{background:var(--pink)}.card.sky .th{background:var(--sky)}
.card.empty .th{background:transparent;font-size:10px;color:#bbb}
.card .lb{font-size:10.5px;padding:5px 8px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.thumb{width:100%;height:84px;display:grid;grid-template-columns:14px 1fr 30px;gap:3px;position:relative;font-size:7px}
.thumb .rb{writing-mode:vertical-rl;background:var(--m8);color:#fff;text-align:center;font-weight:700;font-size:7px;letter-spacing:.1em}
.thumb .rows{display:grid;grid-template-rows:repeat(24,1fr);gap:1px;background:#fff;padding:2px}
.thumb .rows i{display:block;position:relative;background:#fafafa}
.thumb .rows i b{position:absolute;left:0;top:0;bottom:0;display:block}
.thumb .cols{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#fff;padding:2px;grid-column:2/4}
.thumb .cols i{position:relative;display:block;background:#fafafa}
.thumb .cols i b{position:absolute;left:0;right:0;display:block}
.thumb .side2{background:#fff;padding:2px;line-height:1.3;overflow:hidden;color:#555}
.thumb .tot{position:absolute;right:3px;bottom:1px;font-weight:800;font-size:11px}
/* 데일리 모음 스냅샷 */
.snapbadge{position:absolute;right:4px;top:4px;font-size:8px;background:#fff;border:1px solid #ddd;border-radius:3px;padding:0 4px;color:#888;z-index:3}
/* 시트 통째 축소 썸네일 (feedback4 §9) */
.card .th.full{height:auto;padding:0;display:block;background:transparent}
.mini{position:relative;overflow:hidden;width:100%;min-height:40px}
.mini .miniin{position:absolute;left:0;top:0;transform-origin:0 0}
.mini .minic{position:absolute;inset:0;z-index:2}
.snapbadge.mod{background:#c60;border-color:#c60;color:#fff}
.card .lb b{font-weight:800;font-size:11px}
.mthumb{width:100%;height:84px;display:grid;grid-template-rows:14px 1fr;gap:2px}
.mthumb .rb2{background:var(--m8);color:#fff;text-align:center;font-weight:700;font-size:8px;letter-spacing:.15em;line-height:14px}
.mthumb .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#fff;padding:2px}
.mthumb .mgrid i{display:block;min-height:6px;border:1px solid #f0f0f0}
.galdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid #222;box-sizing:border-box;flex:none}
/* settings */
.set{max-width:560px;font-size:12px}
.set .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.set label{width:90px;color:#666}
.set input,.set select{border:1px solid #ddd;border-radius:3px;padding:5px 7px;flex:1;min-width:120px}
.set .sub{border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0}
.set .sub .row{margin:4px 0}
.set .sub input[type=color]{flex:0 0 36px;padding:0;height:26px}
.set .warn{background:#fff8e6;border:1px solid #f0d090;border-radius:4px;padding:8px;font-size:11px;line-height:1.5}
.set h4{margin:14px 0 4px;font-size:12px}
.log{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#666;background:#f7f7f7;padding:6px;border-radius:4px;white-space:pre-wrap;max-height:160px;overflow:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:8px;padding:16px;width:100%;max-width:380px;font-size:12px}
.modal .box h4{margin-bottom:10px}
.modal .row{display:flex;gap:6px;align-items:center;margin:6px 0}
.modal label{width:44px;color:#666}
.modal input,.modal select{border:1px solid #ddd;border-radius:3px;padding:5px;flex:1;min-width:0}
.modal .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
/* phone */
.pnav{display:none}
.topsel{display:none}
@media (max-width:760px){
 #app{grid-template-columns:1fr}
 .side{display:none}
 .main{padding:10px 10px 70px}
 .dpc{grid-template-columns:1fr}
 .dpc>div:first-child{display:flex;flex-direction:column-reverse}
 .mbar{margin:0 0 8px}
 .three{grid-template-columns:1fr;gap:6px}
 .col{min-height:0}
 .gal{grid-template-columns:1fr}
 .grid3{grid-template-columns:repeat(4,1fr)}
 .cmt .cmby{display:none}
 .ribbon{margin:0 20px 8px}
 .paper{grid-template-columns:1fr}
 .pnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 .pnav div{text-align:center;padding:11px 0 9px;font-size:11px;color:#777}
 .pnav div.on{color:#111;font-weight:700}
 .topsel{display:inline-block;border:1px solid #ccc;border-radius:4px;padding:3px 6px;background:#fff}
 .ttl b{font-size:16px}
}
.moretabs{display:none}
@media (max-width:760px){.moretabs{display:flex}}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;z-index:70;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
/* plan v2 */
.plan-ph{display:none}
.pbnav{display:flex;gap:8px;align-items:center;font-size:11px;margin-bottom:8px;flex-wrap:wrap}
.pbwrap{overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:6px}
.pb{display:grid;gap:1px;background:#eee;font-size:10px;width:max-content;min-width:100%}
.pb .pbl,.pb .pbs,.pbh.pbfix{position:sticky;left:0;z-index:2;border-right:2px solid #fff}
.pb>div{background:#fff;min-height:18px}
.pbh{background:#f7f7f7!important;text-align:center;font-weight:700;padding:4px 2px}
.pbh small{display:block;font-weight:400;color:#888;font-size:8px}
.pbh.cur{background:var(--now)!important;color:var(--blue)}
.pbs{font-weight:700;padding:4px 6px;background:#fafafa!important}
.pbsc{background:#fafafa!important;text-align:center;padding:2px 0}
.pbsc.cur,.pbc.cur{background:#f4f8ff!important}
.pbm{color:#c33;cursor:pointer;font-size:11px}
.pbl{padding:3px 6px;color:#555;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbl small{color:#999;margin-left:3px}
.pbl.sh{min-height:0;padding:0 6px}
.pband{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid;border-radius:4px;margin:1px}
.pband .pbw{padding:3px 2px 2px;text-align:center;border-left:1px dotted rgba(0,0,0,.08);cursor:pointer;background:transparent;min-height:0}
.pband .pbw:first-child{border-left:0}
.pband .pbw.cur{background:rgba(47,111,224,.07)}
.pband .pbw.ext{background:rgba(47,111,224,.13)}
.pband .pbw small{display:block;color:var(--blue);font-size:8px}
.pband .pbw .lt{display:block;color:#c33;font-size:8.5px}
.grip{position:absolute;right:-2px;top:0;bottom:0;width:14px;cursor:ew-resize;touch-action:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18));border-radius:0 4px 4px 0;font-size:8px;color:#222;display:flex;align-items:center;justify-content:center;user-select:none}
.pbsh{background:repeating-linear-gradient(45deg,#f5f5f5 0 4px,#e6e6e6 4px 8px)!important;color:#888;font-size:8.5px;padding:1px 6px;border-radius:3px;margin:0 1px 1px;white-space:nowrap;overflow:hidden}
.pbc{min-height:0}
.pltab{border-collapse:collapse;font-size:11px;width:100%}
.pltab th,.pltab td{border:1px solid #eee;padding:4px 6px;text-align:left;white-space:nowrap}
.pltab th{background:#f7f7f7;font-size:10px;color:#666}
.pltab tr:hover td{background:#fcf8f2}
.phb{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;font-size:11px}
.phb h6{font-size:12px;margin-bottom:2px;display:flex;gap:6px;align-items:center}
.phb .bl{padding:6px 0;border-bottom:1px solid #f2f2f2}

<body>
<div id="app">
 <div class="side" id="side"></div>
 <div class="main" id="main"></div>
</div>
<div class="pnav" id="pnav"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   타임테이블 v1 — 타이머·세션·일간/주간/월간·데일리 모음·오프라인 큐·GitHub 동기화
   데이터 원본: GitHub 비공개 저장소 (사람별 파일). 로컬은 localStorage 큐.
   ============================================================ */
const REPO='zzikkaplan/studyplandata', BRANCH='main';
const DEF_SETTINGS={schemaVersion:1,people:['햄찌','꼬까'],
 subjects:[{n:'민법',c:'#F9A8D4'},{n:'물리',c:'#00B300'},{n:'특허',c:'#0066FF'},{n:'상표',c:'#FF8A65'},{n:'디보',c:'#8D6E63'},{n:'조문',c:'#3a7d8c'},{n:'생물',c:'#FFE600'},{n:'지학',c:'#4DB6AC'},{n:'암기',c:'#D9A6FF'},{n:'기타',c:'#666666'}],
 exams:[{id:'ex1',name:'제64회 변리사 1차',date:'2027-02-20',u:0,del:false}],
 monthColors:['#D32F2F','#F57C00','#FBC02D','#388E3C','#1976D2','#7B1FA2','#D32F2F','#F57C00','#FBC02D','#388E3C','#1976D2','#7B1FA2'], // 1월부터 빨주노초파보 ×2 (8월 = 기존 주황)
 redHours:10,skyHours:6,dayStart:5};
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};
const DAYS=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const ym=s=>s.slice(0,7);
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;           // 분 → HH:MM (24 넘는 시간 허용)
const hmDisp=m=>hm(m>=1440?m-1440:m);                          // 표시용은 24 접기
const dur=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;            // 어디서나 시:분 두 자리 (06:18)
const mSum=list=>list.reduce((a,x)=>a+(x.nt?0:(x.b-x.a)),0);      // nt(합산 제외) 세션 빼고 합
const NT_HATCH=';background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)';
const toast=(t)=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)};

/* ---------- 상태 ---------- */
let cfg=LS.get('tt.cfg',{person:'꼬까',token:'',lastSync:0});
let settings=Object.assign({},DEF_SETTINGS,LS.get('tt.settings',{}));
/* v1→v2: exam 하나 → exams 배열. raw(저장돼 있던 원본)에 exams 가 없고 exam 만 있으면 그것이 정본 */
function migrateSettings(raw){
 raw=raw||{};
 if(!Array.isArray(raw.exams)&&raw.exam&&raw.exam.date)settings.exams=[{id:'ex1',name:raw.exam.name||'시험',date:raw.exam.date,u:0,del:false}];
 if(!Array.isArray(settings.exams)||!settings.exams.length)settings.exams=JSON.parse(JSON.stringify(DEF_SETTINGS.exams));
 delete settings.exam;settings.schemaVersion=2;
}
migrateSettings(LS.get('tt.settings',{}));
function nextExam(){const t=today();const xs=(settings.exams||[]).filter(x=>!x.del&&x.date).sort((a,b)=>a.date<b.date?-1:1);return xs.find(x=>x.date>=t)||xs[xs.length-1]||null}
let ui=LS.get('tt.ui',{view:'day',date:null,galMonth:null});
let run=LS.get('tt.run',null);            // 진행 중 타이머 {s,p,i,cat,plan,nt,d,a,at}
let stSel=LS.get('tt.sel',null);          // Study Time 선택 줄 {type:'item'|'cat',id}
let syncLog=[];let syncing=false;
const subjColor=n=>(settings.subjects.find(x=>x.n===n)||{}).c||'#999';
const other=()=>settings.people.find(p=>p!==cfg.person)||'';
const dayStart=()=>settings.dayStart??5;

/* 논리 날짜: 새벽 dayStart 이전은 전날로 */
function logicalNow(){const d=new Date();const mins=d.getHours()*60+d.getMinutes();let ds=iso(d);let m=mins;if(mins<dayStart()*60){ds=addDays(ds,-1);m=mins+1440;}return{d:ds,m};}
function today(){return logicalNow().d}
function curDate(){return ui.date||today()}
function setDate(d){ui.date=d;LS.set('tt.ui',ui);render()}
function setView(v){if(v==='plan'&&ui.view!=='plan')planScrollPending=true;ui.view=v;LS.set('tt.ui',ui);render()}

/* ---------- 파일 캐시 (localStorage) ----------
   key: tt.f.<path>  → {data, sha, dirty}
   sessions/<사람>/YYYY-MM.json  {v:1,sessions:[{id,d,s,p,i,a,b,k,u,del}]}
   todos/<사람>.json             {v:1,items:[{id,d,t,kind,done,carry,u,del}]}
   settings.json                 DEF_SETTINGS 구조 */
const fkey=p=>'tt.f.'+p;
function loadF(p,def){return LS.get(fkey(p),{data:def,sha:null,dirty:false})}
function saveF(p,f){LS.set(fkey(p),f)}
const sessPath=(who,m)=>`sessions/${who}/${m}.json`;
const todoPath=who=>`todos/${who}.json`;
const planPath=who=>`plan/${who}.json`;
const EMPTY_PLAN=()=>({v:1,weekStart:'2026-08-03',bands:[],milestones:[],units:{},daily:[1,1,1,1,1,1,1],goals:{},baselines:[],yield:[],pu:0});
function planFile(who){const f=loadF(planPath(who),EMPTY_PLAN());const p=f.data||{};['bands','milestones','baselines','yield'].forEach(k=>{if(!Array.isArray(p[k]))p[k]=[]});if(!p.units||typeof p.units!=='object')p.units={};if(!Array.isArray(p.daily)||p.daily.length!==7)p.daily=[1,1,1,1,1,1,1];if(!p.goals)p.goals={};if(!p.weekStart)p.weekStart='2026-08-03';f.data=p;return f}
function myPlan(){return planFile(cfg.person).data}
function planMut(fn,wholesale){const f=planFile(cfg.person);fn(f.data);if(wholesale)f.data.pu=Date.now();f.dirty=true;saveF(planPath(cfg.person),f);scheduleSync();}
function sessFile(who,m){return loadF(sessPath(who,m),{v:1,sessions:[]})}
function todoFile(who){const f=loadF(todoPath(who),{v:2,cats:[],items:[]});const d=f.data;
 if(!Array.isArray(d.cats))d.cats=Array.isArray(d.plans)?d.plans:[];delete d.plans; // feedback1 의 plans → cats 한 번 이사
 if(!Array.isArray(d.items))d.items=[];
 d.items.forEach(x=>{if(x.plan&&!x.cat){x.cat=x.plan;delete x.plan}});
 return f}
const snapPath=(who,m)=>`snaps/${who}/${m}.json`;
const EMPTY_SNAP=()=>({v:1,days:{},weeks:{},months:{}});
function snapFileF(who,m){const f=loadF(snapPath(who,m),EMPTY_SNAP());['days','weeks','months'].forEach(k=>{if(!f.data[k])f.data[k]={}});return f}
function snapOf(who,d){return snapFileF(who,ym(d)).data.days[d]||null}
function sharedFile(){return loadF('todos/공통.json',{v:1,items:[]})}
function sharedItems(){return sharedFile().data.items.filter(x=>!x.del)}
function upsertShared(t){const f=sharedFile();t.u=Date.now();const i=f.data.items.findIndex(x=>x.id===t.id);if(i>=0)f.data.items[i]=t;else f.data.items.push(t);f.dirty=true;saveF('todos/공통.json',f);scheduleSync();}
function toggleShared(id){const t=sharedFile().data.items.find(x=>x.id===id);if(t){t.done=!t.done;t.doneAt=t.done?today():null;upsertShared(t);render()}}
function listDirty(){return Object.keys(localStorage).filter(k=>k.startsWith('tt.f.')).map(k=>k.slice(5)).filter(p=>{const f=LS.get(fkey(p));return f&&f.dirty})}

/* 세션 CRUD (자기 것만) */
function sessionsOf(who,d){const f=sessFile(who,ym(d));return f.data.sessions.filter(s=>s.d===d&&!s.del).sort((a,b)=>a.a-b.a)}
function sessionsMonth(who,m){return sessFile(who,m).data.sessions.filter(s=>!s.del)}
function upsertSession(s){const p=sessPath(cfg.person,ym(s.d));const f=loadF(p,{v:1,sessions:[]});s.u=Date.now();const i=f.data.sessions.findIndex(x=>x.id===s.id);if(i>=0)f.data.sessions[i]=s;else f.data.sessions.push(s);f.dirty=true;saveF(p,f);scheduleSync();}
function deleteSession(s){upsertSession(Object.assign({},s,{del:true}))}
/* 할일 CRUD */
function todosOf(who,d){return todoFile(who).data.items.filter(t=>t.d===d&&!t.del)}
function upsertTodo(t){const p=todoPath(cfg.person);const f=todoFile(cfg.person);t.u=Date.now();const i=f.data.items.findIndex(x=>x.id===t.id);if(i>=0)f.data.items[i]=t;else f.data.items.push(t);f.data.v=2;f.dirty=true;saveF(p,f);scheduleSync();}
/* 계획관리의 「분류」 (todos 파일 cats 배열) — 층 이름: 과목 › 분류 › 계획 */
function catsOf(who){return todoFile(who).data.cats.filter(p=>!p.del)}
function catNameOf(id){const p=catsOf(cfg.person).find(x=>x.id===id);return p?p.name:''}
function upsertCat(p){const path=todoPath(cfg.person);const f=todoFile(cfg.person);p.u=Date.now();const i=f.data.cats.findIndex(x=>x.id===p.id);if(i>=0)f.data.cats[i]=p;else f.data.cats.push(p);f.data.v=2;f.dirty=true;saveF(path,f);scheduleSync();}
function catActive(c,d){return(!c.d1||c.d1<=d)&&(!c.d2||d<=c.d2)}
/* 세션 → 분류 id (직접 cat · 계획 경유 · 옛 세션은 이름 대조) */
function sessCatId(y,tf){
 if(y.cat)return y.cat;
 if(y.plan){const it=tf.data.items.find(x=>x.id===y.plan);if(it&&it.cat)return it.cat;}
 const c=tf.data.cats.find(z=>!z.del&&z.name===y.p&&z.s===y.s);return c?c.id:null;
}
function saveSettings(){settings.schemaVersion=1;LS.set('tt.settings',settings);const f=loadF('settings.json',settings);f.data=settings;f.dirty=true;saveF('settings.json',f);scheduleSync();}

/* ---------- GitHub Contents API ---------- */
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function logS(t){syncLog.unshift(`${new Date().toTimeString().slice(0,8)} ${t}`);syncLog=syncLog.slice(0,40)}
async function ghGet(path){
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}&t=${Date.now()}`,{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},cache:'no-store'});
 if(r.status===404)return null;
 if(!r.ok)throw new Error(`GET ${path} ${r.status}`);
 const j=await r.json();return{sha:j.sha,data:JSON.parse(b64d(j.content))};
}
async function ghPut(path,data,sha){
 const body={message:`${cfg.person} · ${path}`,content:b64e(JSON.stringify(data,null,1)),branch:BRANCH};if(sha)body.sha=sha;
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error(`PUT ${path} ${r.status}`);
 const j=await r.json();return j.content.sha;
}
/* 병합: id 기준, u(수정시각) 큰 쪽이 이김. 삭제는 del 표식으로 남음 */
function mergeList(a,b){const m=new Map();[...a,...b].forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});return[...m.values()]}
function mergeFile(path,local,remote){
 if(path.startsWith('sessions/'))return{v:1,sessions:mergeList(local.sessions||[],remote.sessions||[])};
 if(path==='todos/공통.json')return{v:1,items:mergeList(local.items||[],remote.items||[])};
 if(path.startsWith('snaps/')){ // 날짜·주·달 키 단위로 u(없으면 at) 큰 쪽
  const out={v:1,days:{},weeks:{},months:{}};
  ['days','weeks','months'].forEach(k=>{const A=(local||{})[k]||{},B=(remote||{})[k]||{};new Set([...Object.keys(A),...Object.keys(B)]).forEach(key=>{const a=A[key],b=B[key];out[k][key]=!a?b:(!b?a:(((a.u||a.at||0)>=(b.u||b.at||0))?a:b))})});
  return out;
 }
 if(path.startsWith('todos/'))return{v:2,cats:mergeList(local.cats||local.plans||[],remote.cats||remote.plans||[]),items:mergeList(local.items||[],remote.items||[])};
 if(path.startsWith('plan/')){ // bands·milestones·units[과목]=id/u/del 병합, 나머지는 pu 큰 쪽 통째
  const A=local||{},B=remote||{};const w=(A.pu||0)>=(B.pu||0)?A:B;
  const out={v:1,weekStart:w.weekStart||'2026-08-03',daily:Array.isArray(w.daily)&&w.daily.length===7?w.daily:[1,1,1,1,1,1,1],goals:w.goals||{},baselines:w.baselines||[],yield:w.yield||[],pu:w.pu||0};
  out.bands=mergeList(A.bands||[],B.bands||[]);
  out.milestones=mergeList(A.milestones||[],B.milestones||[]);
  out.units={};new Set([...Object.keys(A.units||{}),...Object.keys(B.units||{})]).forEach(s=>{out.units[s]=mergeList((A.units||{})[s]||[],(B.units||{})[s]||[])});
  return out;
 }
 return local; // settings: 로컬(더러운 쪽)이 이김
}
function sameJSON(a,b){return JSON.stringify(a)===JSON.stringify(b)}
/* 한 파일 동기화. own=true 면 push 까지, 아니면 pull 만 */
async function syncFile(path,own,def){
 const f=loadF(path,def);
 const remote=await ghGet(path);
 if(!own){ if(remote){f.data=remote.data;f.sha=remote.sha;f.dirty=false;saveF(path,f);} return; }
 let merged=f.data,sha=remote?remote.sha:null;
 if(remote){ merged=f.dirty?mergeFile(path,f.data,remote.data):remote.data; }
 const needPush=f.dirty||(!remote&&path==='settings.json');
 if(needPush&&(!remote||!sameJSON(merged,remote.data))){
  try{sha=await ghPut(path,merged,sha);logS(`↑ ${path}`);}
  catch(e){ if(/409|422/.test(e.message)){const r2=await ghGet(path);merged=mergeFile(path,merged,r2.data);sha=await ghPut(path,merged,r2.sha);logS(`↑ ${path} (재시도)`);} else throw e; }
 }
 f.data=merged;f.sha=sha;f.dirty=false;saveF(path,f);
 if(path==='settings.json'){settings=Object.assign({},DEF_SETTINGS,merged);migrateSettings(merged);LS.set('tt.settings',settings);}
}
async function syncAll(silent){
 if(syncing)return; if(!cfg.token){if(!silent)toast('설정에서 토큰을 넣어줘');return;}
 if(!navigator.onLine){if(!silent)toast('오프라인 — 큐에 보관');return;}
 syncing=true;renderSide();
 try{
  const me=cfg.person,peer=other();const months=new Set([ym(today()),ym(curDate()),ym(addDays(today(),-7))]);if(ui.galMonth)months.add(ui.galMonth);
  listDirty().forEach(p=>{const m=p.match(/^sessions\/[^/]+\/(\d{4}-\d{2})/);if(m)months.add(m[1]);});
  await syncFile('settings.json',true,settings);
  await syncFile(planPath(me),true,EMPTY_PLAN());if(peer)await syncFile(planPath(peer),false,EMPTY_PLAN());
  for(const m of months){await syncFile(sessPath(me,m),true,{v:1,sessions:[]});if(peer)await syncFile(sessPath(peer,m),false,{v:1,sessions:[]});

function selInfo(){ // 선택된 Study Time 줄 → {s,catId,itemId,catName,itemT,nt,done}
 if(!stSel)return null;
 const tf=todoFile(cfg.person);
 if(stSel.type==='item'){const it=tf.data.items.find(x=>x.id===stSel.id&&!x.del);if(!it)return null;const c=it.cat?tf.data.cats.find(z=>z.id===it.cat&&!z.del):null;return{itemId:it.id,catId:c?c.id:'',s:c?c.s:'기타',catName:c?c.name:'',itemT:it.t||'',nt:!!(c&&c.noTimer),done:!!it.done};}
 const c=tf.data.cats.find(z=>z.id===stSel.id&&!z.del);if(!c)return null;
 return{itemId:'',catId:c.id,s:c.s,catName:c.name,itemT:'',nt:!!c.noTimer,done:false};
}
function selRow(type,id){stSel=(stSel&&stSel.type===type&&stSel.id===id)?null:{type,id};LS.set('tt.sel',stSel);render();}
function pickTodoItem(id){selRow('item',id)} // 오늘 칸 학습 항목 클릭 = 같은 줄 선택
function startTimer(){
 const si=selInfo();if(!si){toast('Study Time 에서 계획을 골라줘');return;}
 const n=logicalNow();run={s:si.s,p:si.catName,i:si.itemT,cat:si.catId,plan:si.itemId,nt:si.nt,d:n.d,a:n.m,at:Date.now()};LS.set('tt.run',run);render();
}
function stopTimer(){
 if(!run)return;const n=logicalNow();let b=n.m;let d=run.d;
 if(n.d!==run.d){ b=n.m+1440*Math.round((parse(n.d)-parse(run.d))/864e5); } // 날짜 넘어가면 이어붙임
 if(b<=run.a)b=run.a+1;
 const s={id:uid(),d,s:run.s,p:run.p,i:run.i,a:run.a,b,plan:run.plan||'',cat:run.cat||'',nt:!!run.nt}; // ○×△(k) 폐지 — 완료는 「완료」 버튼으로
 upsertSession(s);
 run=null;LS.del('tt.run');toast(`저장 ${dur(s.b-s.a)}`);render();
}
function elapsed(){return run?Math.max(0,Math.floor((Date.now()-run.at)/1000)):0}
/* 매 초: 경과·선택 줄 시간·Total 갱신. 매 분: 진행 중 블록을 다시 그림 */
setInterval(()=>{if(!run)return;
 const em=Math.floor(elapsed()/60);
 [document,pipWin&&!pipWin.closed?pipWin.document:null].forEach(D=>{if(!D)return;
  const e=D.getElementById('runT');if(e)e.textContent=fmtSec(elapsed());
  const rm=D.getElementById('stRunMin');if(rm)rm.textContent=dur((+rm.dataset.base||0)+em);
  const t2=D.getElementById('stTot');if(t2)t2.textContent=dur((+t2.dataset.base||0)+(run.nt?0:em));});
 if(elapsed()>0&&elapsed()%60===0)render();
},1000);
const fmtSec=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;
function manualSave(doc){doc=doc||document;
 const a=doc.getElementById('mA').value,b=doc.getElementById('mB').value;if(!a||!b){toast('시작·끝을 채워줘');return;}

 const tm=t=>{const[h,m]=t.split(':').map(Number);let v=h*60+m;if(v<dayStart()*60)v+=1440;return v};
 let A=tm(a),B=tm(b);if(B<=A)B+=1440;
 if(si){upsertSession({id:uid(),d:curDate(),s:si.s,p:si.catName,i:si.itemT,a:A,b:B,plan:si.itemId,cat:si.catId,nt:si.nt});toast('저장됨');}
 else{upsertSession({id:uid(),d:curDate(),s:'기타',p:'',i:'',a:A,b:B,plan:'',cat:''});toast('선택이 없어 「기타」로 저장');}
 render();
}

function ttRows(sess,{rows=24,thin=false}={}){ // 05~04 24행 — 새벽 3~4시(전날 소속)도 보이게 (8/28 사람 확정)
 const s0=dayStart()*60;let h='';
 const now=logicalNow();const isToday=curDate()===now.d;
 for(let r=0;r<rows;r++){
  const a=s0+r*60,b=a+60;let bars='';
  sess.forEach(x=>{const L=Math.max(x.a,a),R=Math.min(x.b,b);if(R>L)bars+=`<b style="left:${(L-a)/60*100}%;width:${(R-L)/60*100}%;background:${subjColor(x.s)}${x.nt?NT_HATCH:''}" title="${esc(x.s)} ${hmDisp(x.a)}-${hmDisp(x.b)}" onclick="editSession('${x.id}',document)"></b>`});
  if(run&&run.d===curDate()){const L=Math.max(run.a,a),R=Math.min(now.m+(now.d!==run.d?1440:0),b);if(R>L)bars+=`<b style="left:${(L-a)/60*100}%;width:${(R-L)/60*100}%;background:${subjColor(run.s)};opacity:.5"></b>`}
  if(isToday&&now.m>=a&&now.m<b)bars+=`<i class="now" style="left:${(now.m-a)/60*100}%"></i>`;
  h+=`<span>${pad((a/60)%24)}</span><div class="r">${bars}</div>`;
 }return h;
}
/* 그날의 Study Time 줄: ① 그날 계획(학습 항목) ② 걸쳐 있는 분류(계획 없는 날) ③ 어디에도 안 붙는 옛 세션 s·p·i 묶음 */
function dayRows(who,d){
 const tf=todoFile(who);const cats=tf.data.cats.filter(c=>!c.del);
 const items=tf.data.items.filter(x=>!x.del&&x.kind==='study'&&x.d===d);
 const sess=sessionsOf(who,d);
 const catById=new Map(cats.map(c=>[c.id,c]));
 const used=new Set();const rows=[];
 items.forEach(it=>{
  const c=it.cat?catById.get(it.cat):null;
  const ss=sess.filter(x=>{if(used.has(x.id))return false;
   if(x.plan)return x.plan===it.id;
   if(x.cat)return false;
   return!!c&&x.p===c.name&&x.i===(it.t||'')&&x.s===c.s;});
  ss.forEach(x=>used.add(x.id));
  rows.push({type:'item',id:it.id,s:c?c.s:'기타',cat:c||null,label:it.t||'',done:!!it.done,min:mSum(ss),sess:ss});
 });
 cats.filter(c=>(c.d1||c.d2)&&catActive(c,d)).forEach(c=>{
  if(rows.some(r=>r.cat&&r.cat.id===c.id))return;
  const ss=sess.filter(x=>{if(used.has(x.id))return false;if(x.plan)return false;if(x.cat)return x.cat===c.id;return x.p===c.name&&!x.i&&x.s===c.s;});
  ss.forEach(x=>used.add(x.id));
  rows.push({type:'cat',id:c.id,s:c.s,cat:c,label:'',done:false,min:mSum(ss),sess:ss});
 });
 const g={};sess.filter(x=>!used.has(x.id)).forEach(x=>{const k=x.s+'|'+(x.p||'')+'|'+(x.i||'');const o=(g[k]=g[k]||{type:'legacy',id:k,s:x.s,cat:null,label:[x.p,x.i].filter(Boolean).join(' '),done:false,min:0,sess:[]});o.min+=x.nt?0:(x.b-x.a);o.sess.push(x)});
 rows.push(...Object.values(g));
 return rows;
}

function planWeekStart(plan){return(plan&&plan.weekStart)||'2026-08-03'}
function pWeekNo(plan,d){return Math.floor((parse(d)-parse(planWeekStart(plan)))/864e5/7)+1}
function pWeekDate(plan,w,i){return addDays(planWeekStart(plan),(w-1)*7+(i||0))}
function dayIdx(d){return(parse(d).getDay()+6)%7}
function unitMap(plan,s){const m=new Map();((plan.units||{})[s]||[]).forEach(u=>{if(!u.del)m.set(u.id,u)});return m}
function weekQuotas(plan,band){const w=Array.isArray(plan.daily)&&plan.daily.length===7?plan.daily:[1,1,1,1,1,1,1];const W=w.reduce((a,b)=>a+(+b||0),0);const per=+band.per||0;if(!W||!per)return[0,0,0,0,0,0,0];let prev=0,acc=0;const out=[];for(let i=0;i<7;i++){acc+=(+w[i]||0);const c=Math.round(per*acc/W);out.push(c-prev);prev=c}return out}
function bandQuota(plan,band,d){const w=pWeekNo(plan,d);if(w<band.w1||w>band.w2)return 0;return weekQuotas(plan,band)[dayIdx(d)]}
function bandUnits(plan,band){const m=unitMap(plan,band.s);return(band.units||[]).map(id=>m.get(id)).filter(Boolean)}
function bandDone(plan,band){return bandUnits(plan,band).filter(u=>u.done&&u.done[band.id]).length}
function bandCursor(plan,band){const us=bandUnits(plan,band);for(let i=0;i<us.length;i++)if(!(us[i].done&&us[i].done[band.id]))return i;return us.length}
function plannedThrough(plan,band,d){const s=pWeekDate(plan,band.w1);if(d<s)return 0;const e=pWeekDate(plan,band.w2,6);const end=d<e?d:e;const q=weekQuotas(plan,band);let tot=0;for(let x=s;x<=end;x=addDays(x,1))tot+=q[dayIdx(x)];return tot}
function late(plan,band,d){const us=bandUnits(plan,band);if(!us.length)return 0;return Math.max(0,Math.min(plannedThrough(plan,band,d),us.length)-bandDone(plan,band))}
/* d 날짜 몫 = 그 날 quota + 그 전날까지의 밀림. 완료는 순서 무관(건너뛴 것도 done 이면 done) */
function bandListFor(plan,band,d){
 const us=bandUnits(plan,band);if(!us.length)return[];
 const w=pWeekNo(plan,d);if(w<band.w1||w>band.w2)return[];
 const notDone=us.filter(u=>{const x=u.done&&u.done[band.id];return!x||x>=d});
 const doneBefore=us.length-notDone.length;
 const backlog=Math.max(0,Math.min(plannedThrough(plan,band,addDays(d,-1)),us.length)-doneBefore);
 return notDone.slice(0,Math.min(notDone.length,bandQuota(plan,band,d)+backlog));
}
/* 내일 열: 오늘(t) 다 끝났다고 치고 내일(tmr) quota 만 */
function bandListTomorrow(plan,band,t,tmr){
 const us=bandUnits(plan,band);if(!us.length)return[];
 const w=pWeekNo(plan,tmr);if(w<band.w1||w>band.w2)return[];
 const notDone=us.filter(u=>{const x=u.done&&u.done[band.id];return!x||x>=t});
 const wt=pWeekNo(plan,t);const skip=(wt>=band.w1&&wt<=band.w2)?bandListFor(plan,band,t).length:0;
 return notDone.slice(skip,skip+bandQuota(plan,band,tmr));
}
function weekDoneCount(plan,band,w){const a=pWeekDate(plan,w),b=pWeekDate(plan,w,6);return bandUnits(plan,band).filter(u=>{const d=u.done&&u.done[band.id];return d&&d>=a&&d<=b}).length}
function endDate(plan,band){const us=bandUnits(plan,band);if(!us.length)return null;const t=today();const c14=us.filter(u=>{const d=u.done&&u.done[band.id];return d&&d>addDays(t,-14)&&d<=t}).length;const rate=c14>0?c14/14:(+band.per||0)/7;const remain=us.length-bandDone(plan,band);if(remain<=0)return t;if(!rate)return null;return addDays(t,Math.ceil(remain/rate))}
function examWeek(plan){const x=nextExam();return x?pWeekNo(plan,x.date):9999} // 오늘 이후 가장 가까운 시험 기준
function subjOrderAll(plan){const names=settings.subjects.map(x=>x.n);const extra=[...new Set(plan.bands.filter(b=>!b.del).map(b=>b.s))].filter(s=>!names.includes(s));return[...names,...extra]}
function yieldOrder(plan){const base=(plan.yield&&plan.yield.length?plan.yield:settings.subjects.map(x=>x.n));const extra=[...new Set(plan.bands.filter(b=>!b.del).map(b=>b.s))].filter(s=>!base.includes(s));return[...base,...extra]}

/* 날짜별 남은 단원: 실제선 = 완료 누적 · 기준선 = 마지막 baseline 의 w1/w2/per 로 계획대로 갔을 때 */
function remainingSeries(plan,subject,from,to){
 const bands=plan.bands.filter(b=>!b.del&&(b.units||[]).length&&(!subject||b.s===subject));
 const bl=(plan.baselines||[]).slice(-1)[0];
 const blMap=new Map((bl?bl.bands||[]:[]).map(x=>[x.id,x]));
 const days=[],act=[],base=[];
 for(let d=from;d<=to;d=addDays(d,1)){
  let a=0,bse=0;
  bands.forEach(b=>{
   const us=bandUnits(plan,b);
   a+=us.filter(u=>{const x=u.done&&u.done[b.id];return!x||x>d}).length;
   const o=blMap.get(b.id);
   const vb=o?Object.assign({},b,{w1:o.w1,w2:o.w2,per:o.per!=null?o.per:b.per}):b;
   bse+=Math.max(0,us.length-plannedThrough(plan,vb,d));
  });

 }

}

function revGraphHTML(plan,m,first,lastD){
 const bands=plan.bands.filter(b=>!b.del&&(b.units||[]).length);
 if(!bands.length)return'<p style="color:#888;font-size:11px">단원이 있는 띠가 없어 그래프를 못 그림 — 주차계획에서 띠에 단원을 연결해줘.</p>';
 const t0=today();
 const bl=(plan.baselines||[]).slice(-1)[0];
 const from=bl&&bl.at&&bl.at<first?bl.at:first;
 let rem=0,per7=0,rec=0;
 bands.forEach(b=>{const us=bandUnits(plan,b);rem+=us.length-bandDone(plan,b);per7+=(+b.per||0)/7;
  rec+=us.filter(u=>{const d2=u.done&&u.done[b.id];return d2&&d2>addDays(t0,-14)&&d2<=t0}).length;});
 const rate=rec>0?rec/14:per7;
 const projEnd=rate>0?addDays(t0,Math.ceil(rem/Math.max(rate,.01))):lastD;
 const blW=new Map((bl?bl.bands||[]:[]).map(x=>[x.id,x]));
 let baseEnd=first;bands.forEach(b=>{const o=blW.get(b.id);const e=pWeekDate(plan,(o?o.w2:(b.orig?b.orig.w2:b.w2)),6);if(e>baseEnd)baseEnd=e});
 let to=lastD;if(projEnd>to)to=projEnd;if(baseEnd>to)to=baseEnd;
 if(Math.round((parse(to)-parse(from))/864e5)>220)to=addDays(from,220);
 const S=remainingSeries(plan,null,from,to);
 const N=S.days.length;if(N<2)return'';
 const maxV=Math.max(1,...S.act,...S.base);
 const L2=30,R2=10,T2=10,B2=16,W2=520,H2=190;
 const X=i=>L2+(i/(N-1))*(W2-L2-R2);
 const Y=v=>T2+(1-v/maxV)*(H2-T2-B2);
 const iToday=Math.min(N-1,Math.max(0,Math.round((parse(t0)-parse(from))/864e5)));
 const basePts=S.days.map((d2,i)=>`${X(i).toFixed(1)},${Y(S.base[i]).toFixed(1)}`).join(' ');
 const actPts=S.days.slice(0,iToday+1).map((d2,i)=>`${X(i).toFixed(1)},${Y(S.act[i]).toFixed(1)}`).join(' ');
 const iProj=Math.min(N-1,Math.max(iToday,Math.round((parse(projEnd)-parse(from))/864e5)));
 const md=x=>parseInt(x.slice(5,7))+'/'+parseInt(x.slice(8));
 const gap=S.act[iToday]-S.base[iToday];
 const gapDays=gap>0&&rate>0?Math.ceil(gap/rate):0;
 return`<svg viewBox="0 0 520 190" style="width:100%;height:190px;display:block">
 <g font-size="9" fill="#888"><text x="4" y="14">${maxV}</text><text x="10" y="${(Y(0)+3).toFixed(0)}">0</text>
 <text x="${L2}" y="188">${md(from)}</text><text x="${(X(N-1)-24).toFixed(0)}" y="188">${md(to)}</text></g>
 <line x1="${L2}" y1="${T2}" x2="${L2}" y2="${Y(0).toFixed(1)}" stroke="#ddd"/><line x1="${L2}" y1="${Y(0).toFixed(1)}" x2="${W2-R2}" y2="${Y(0).toFixed(1)}" stroke="#ddd"/>
 <polyline points="${basePts}" fill="none" stroke="#bbb" stroke-width="2"/>
 <polyline points="${actPts}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
 ${iProj>iToday?`<line x1="${X(iToday).toFixed(1)}" y1="${Y(S.act[iToday]).toFixed(1)}" x2="${X(iProj).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="4 3"/>`:''}
 <line x1="${X(iToday).toFixed(1)}" y1="${T2}" x2="${X(iToday).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#f0b" stroke-dasharray="2 3"/><text x="${(X(iToday)+3).toFixed(0)}" y="20" font-size="9" fill="#c36">오늘</text>
 </svg>
 <p style="font-size:10.5px;margin-top:4px">${gap>0?`<b class="lateT">밀림 +${gap}단원${gapDays?` ≈ ${gapDays}일`:''}</b> · ${md(projEnd)} 예상`:`<b class="okT">계획대로거나 앞서 있음</b> · ${md(projEnd)} 예상`}</p>`;
}
function revUnitsHTML(plan,m,bandsM){

 }).join('');
 return`<div class="units2">${cards}</div>`;

function reviewHTML(){
 const plan=myPlan();const m=ui.revMonth||ym(today());
 const fd=parse(m+'-01');const nd=new Date(fd.getFullYear(),fd.getMonth()+1,0).getDate();
 const first=m+'-01';const lastD=`${m}-${pad(nd)}`;
 const g=(plan.goals||{})[m]||{};
 const wA=pWeekNo(plan,first),wB=pWeekNo(plan,lastD);
 const bandsM=plan.bands.filter(b=>!b.del&&b.w1<=wB&&b.w2>=wA);
 const dRef=(()=>{const y=addDays(today(),-1);return y<lastD?y:lastD})();
 const stMap=new Map(subjTotals(sessionsMonth(cfg.person,m)).map(x=>[x.s,x.min]));
 const ordN=settings.subjects.map(x=>x.n);const oi=s=>{const i=ordN.indexOf(s);return i<0?999:i};
 const subs=[...new Set(bandsM.map(b=>b.s))].sort((a,b)=>oi(a)-oi(b));
 let tq=0,tdn=0,tmin=0;
 const md=x=>x?parseInt(x.slice(5,7))+'/'+parseInt(x.slice(8)):'';
 const rowsA=subs.map(s=>{
  const bs=bandsM.filter(b=>b.s===s);
  let q=0,dn=0,L=0,perSum=0,oe=null,ce=null;
  bs.forEach(b=>{
   q+=Math.max(0,plannedThrough(plan,b,lastD)-plannedThrough(plan,b,addDays(first,-1)));
   const us=bandUnits(plan,b);
   dn+=us.filter(u=>{const x=u.done&&u.done[b.id];return x&&x>=first&&x<=lastD}).length;
   L+=late(plan,b,dRef);perSum+=(+b.per||0);
   const o=pWeekDate(plan,(b.orig?b.orig.w2:b.w2),6);if(!oe||o>oe)oe=o;
   if(us.length){const e=endDate(plan,b);if(e&&(!ce||e>ce))ce=e;}
  });
  const min2=stMap.get(s)||0;tq+=q;tdn+=dn;tmin+=min2;
  const days=L&&perSum?Math.ceil(L/(perSum/7)):0;
  const endTxt=ce?(ce>oe?`원 ${md(oe)} → <span class="lateT">${md(ce)}</span>`:(md(ce)===md(oe)?`${md(oe)} 그대로`:`원 ${md(oe)} → ${md(ce)}`)):(oe?`~${md(oe)}`:'');
  return`<tr><td><i class="sw" style="background:${subjColor(s)}"></i>${esc(s)}</td><td>${q}</td><td>${dn}</td><td><div class="bar2"><i style="width:${q?Math.min(100,Math.round(dn/q*100)):0}%"></i></div></td><td>${min2?dur(min2):''}</td><td class="${days?'lateT':'okT'}">${days?'+'+days+'일':'0'}</td><td>${endTxt}</td></tr>`;
 }).join('');
 const sumRow=subs.length?`<tr><td style="color:#999">합계</td><td>${tq}</td><td>${tdn}</td><td><div class="bar2"><i style="width:${tq?Math.min(100,Math.round(tdn/tq*100)):0}%"></i></div></td><td>${tmin?dur(tmin):''}</td><td></td><td></td></tr>`:'';
 return`${moreTabs('review')}<div class="ttl"><b>${m.replace('-','년 ')}월 <span>› 계획</span></b><div class="r"><button class="btn" onclick="revShift(-1)">‹</button><button class="btn" onclick="revShift(0)">이번 달</button><button class="btn" onclick="revShift(1)">›</button><button class="btn" onclick="if(confirm('원계획 기준선을 지금 상태로 다시 고정할까? 이전 기준선은 이력에 남아.')){fixBaseline(today());toast('기준선 고정');render()}">원계획 기준선 다시 고정</button></div></div>
 <div class="rvgrid">
 <div><div class="goalbox" onclick="goalEdit('${m}')"><b>${parseInt(m.slice(5))}월 목표</b>${esc(g.text||'')||'<span style="color:#aaa">(클릭해서 적기)</span>'}${g.prio?`<div class="p">📌 ${esc(g.prio)}</div>`:''}</div>
 <div class="rvbox" style="margin-top:10px"><h4>달성 <small>계획 단원 대비 완료</small></h4>
 ${subs.length?`<div style="overflow-x:auto"><table class="rvtab"><thead><tr><th>과목</th><th>계획</th><th>완료</th><th></th><th>시간</th><th>밀림</th><th>예상 종료</th></tr></thead><tbody>${rowsA}${sumRow}</tbody></table></div>`:'<p style="color:#888;font-size:11px">이 달에 걸친 띠가 없어.</p>'}</div></div>
 <div class="rvbox"><h4>원계획 대비 <small>남은 단원 수 · 회색 = 기준선</small></h4>${revGraphHTML(plan,m,first,lastD)}<p style="font-size:10px;color:#666;margin-top:6px">기준선은 매달 1일 자동 고정. 계획을 크게 바꿨을 때만 다시 고정 — 이전 것은 이력에 남는다.</p></div>
 </div>
 ${revUnitsHTML(plan,m,bandsM)}`;
}
