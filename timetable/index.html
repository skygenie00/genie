<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A8D8EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>zzikkaTT</title>
<style>
:root{--ink:#222;--mute:#777;--line:#e2e2e2;--m8:#F57C00;--m8a:color-mix(in srgb,var(--m8) 55%,#fff);--m8b:color-mix(in srgb,var(--m8) 42%,#fff);--sky:#DCEBFA;--pink:#FBDDE2;--now:#e8f0fd;--blue:#2f6fe0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#ebebeb;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);font-size:12.5px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:150px 1fr;min-height:100vh;background:#fff}
/* sidebar */
.side{background:#f7f7f7;border-right:1px solid var(--line);padding:12px 10px;font-size:12.5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .who{font-weight:700;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;cursor:pointer}
.side .grp{font-size:10px;color:#999;margin:10px 0 3px;letter-spacing:.05em}
.side .i{padding:5px 8px;border-radius:5px;color:#444;cursor:pointer}
.side .i.on{background:#222;color:#fff}
.side .i.sub{padding-left:22px;font-size:11.5px;color:#666}
.side .i.sub.on{background:#ddd;color:#111}
.side .st{margin-top:30px;font-size:10px;color:#888;line-height:1.5}
.side .st.dirty{color:#c60}
.main{padding:14px 18px;overflow:hidden;min-width:0}
.ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.ttl b{font-size:18px}.ttl b span{font-weight:400;color:#888;font-size:14px}
.ttl .r{font-size:11px;color:#666;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #bbb;background:#fff;border-radius:4px;padding:4px 9px;font-size:11px}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.d{color:#c33;border-color:#e99}
.views{display:flex;gap:4px;font-size:11.5px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px;overflow-x:auto}
.views span{padding:3px 8px;border-radius:4px;color:#555;cursor:pointer;white-space:nowrap}
.views span.on{background:#eee;color:#111;font-weight:700}
.nav{display:flex;gap:6px;align-items:center}
.nav button{border:1px solid #ccc;background:#fff;border-radius:4px;padding:2px 8px}
/* day sheet */
.dpc{display:grid;grid-template-columns:500px minmax(0,1fr);gap:16px} /* 일간 카드 폭 = 주간·월간과 동일 500 (feedback9 §3-1) */
.sheet{background:var(--m8);padding:10px;border-radius:6px}
.ribbon{background:#fff;text-align:center;font-weight:700;font-size:16px;padding:5px;margin:0 60px 8px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.paper{background:#fff;border-radius:4px;padding:10px;display:grid;grid-template-columns:5fr 6fr;gap:12px;background-image:linear-gradient(#f0f0f0 1px,transparent 1px),linear-gradient(90deg,#f0f0f0 1px,transparent 1px);background-size:10px 10px}
.paper>div{min-width:0}
.stc{display:flex;flex-direction:column;min-height:0}
.stc .st{flex:1;overflow:auto}
.hd{font-size:10px;color:#666;border-left:3px solid #666;padding-left:4px;margin-bottom:5px;font-weight:700}
.tt{display:grid;grid-template-columns:22px 1fr;row-gap:1px;font-size:9px;color:#555}
.tt .r{height:12px;position:relative;border-bottom:1px dotted var(--m8b);background-image:repeating-linear-gradient(90deg,transparent 0 calc(16.66% - 1px),var(--m8a) calc(16.66% - 1px) 16.66%)}
.tt .r b{position:absolute;top:1px;height:11px;display:block;border-radius:1px;cursor:pointer}
.tt .tth{position:relative;height:9px;font-size:7px;color:#999}
.tt .tth i{position:absolute;top:0;transform:translateX(-50%);font-style:normal}
.tt .r i.now{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--blue)}
.st{font-size:11px}
.st .it{display:flex;gap:6px;padding:4px 0;align-items:center;cursor:pointer;border-bottom:1px solid #f4f4f4}
.st .it:hover{background:color-mix(in srgb,var(--m8) 8%,#fff)}
.st .it.selr{background:var(--now)}
.st .it.done2 .pl{color:#aaa;text-decoration:line-through}
.st .it .btn{padding:1px 7px;font-size:10px;flex:none}
.st .sw{width:9px;height:9px;flex:none}
.st .nm{width:28px;font-weight:700}
.st .pl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .pl.ex{white-space:normal;overflow:visible;text-overflow:clip}
.st .it.exr{align-items:flex-start}
.st .stmore{flex:none;font-size:9px;color:#888;cursor:pointer;padding:0 2px}
.st .stmore:hover{color:var(--blue)}
.stc .hd .sttgl{float:right;font-size:9.5px;font-weight:400;color:#888;cursor:pointer}
.stc .hd .sttgl:hover{color:var(--blue)}
.foot{border-top:1px solid #ddd;margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;font-size:10px;color:#555;align-items:flex-end}
.foot .big{font-size:22px;font-weight:800;color:#222}
/* MiMi bar */
.mbar{margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11.5px;background:#fff}
.mbar .row1{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.mbar select,.mbar input{border:1px solid #ddd;border-radius:3px;padding:4px 6px;font-size:11.5px;min-width:0}
.mbar .subj{font-weight:700;width:76px}
.mbar .pl{flex:1 1 90px}.mbar .item{flex:2 1 120px}
.mbar .ss{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbar .ss button{text-align:center;border:1px solid #bbb;padding:9px;font-weight:800;font-size:15px;letter-spacing:.08em;border-radius:22px;background:#fff} /* §2-1(fb19) 알약 */
.mbar .ss button.dis{color:#bbb;border-color:#eee;cursor:default}
.mbar .ss button.go{background:#fff;color:#111;border-color:#111} /* §2-1(fb19) 검정 채움 폐지 — 「지금 누를 것」 = 흰 배경·검은 글자·테두리 */
.mbar .run{font-size:11px;color:var(--blue);font-weight:700;margin:-2px 0 6px}
.mbar .man{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:#666;flex-wrap:wrap}
.mbar .man input{width:120px} /* §3-1(fb18) type=time 이 시·분·오전오후를 못 담아 흐르던 폭 */
.mbar .man.hl{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px} /* §2(fb18) START 차단 시 강조 */
.ribbon.rbtn{cursor:pointer}
.tt .r b .lifetag{position:absolute;left:2px;top:0;bottom:0;display:flex;align-items:center;font-size:8px;line-height:1;color:#555;font-style:normal;white-space:nowrap;overflow:hidden;max-width:calc(100% - 3px);pointer-events:none} /* §5(fb18) */
/* three columns */
.three{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px}
.col{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;min-height:290px}
.col li{font-size:13px}
.col.today{border-color:#222;border-width:2px;background:#fcfcfc}
.col h5{font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
.col h5 small{color:#888;font-weight:400}
.col .sec{font-size:9.5px;color:#999;margin:8px 0 3px;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.col .sec .rgt{margin-left:auto;display:flex;gap:4px}
.col .sec .btn{font-size:9px;padding:1px 6px;letter-spacing:0}
.col ul{list-style:none}
.col li{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid #f0f0f0;align-items:center;line-height:1.25}
.col li.done{color:#aaa;text-decoration:line-through}
.col .cb{width:13px;height:13px;border:1.5px solid #666;border-radius:3px;flex:none;cursor:pointer;font-size:9px;line-height:11px;text-align:center}
.col .cb.on{background:#222;color:#fff;border-color:#222}
.col .m{margin-left:auto;font-size:9.5px;color:#888;white-space:nowrap}
.col .x{color:#bbb;cursor:pointer;padding:0 3px}
.col li.late{background:#fff8e6;margin:0 -4px;padding:5px 4px;border-radius:3px}
.col .iv{border:1px solid #333;border-radius:3px;font-size:10px;padding:3px 6px;text-align:center;margin-top:6px;font-weight:700;cursor:pointer;background:#fff}
.col .add{border:0;border-bottom:1px dashed #ddd;width:100%;padding:4px 0;font-size:11px;background:transparent;outline:0}
.peer{margin-top:8px;font-size:11px;color:#666}
/* week (MiMi 틀) */
.wk2{display:grid;grid-template-columns:26px repeat(7,1fr);font-size:9px}
.wk2 .wh{text-align:center;font-weight:700;padding:3px 0;border-bottom:1px solid var(--m8b);color:#555}
.wk2 .wh.today{color:var(--blue)}
.wk2 .wlab{display:grid;grid-template-rows:repeat(24,1fr);color:#888;text-align:right;padding-right:3px;height:374px}
.wk2 .wcol{position:relative;height:374px;border-left:1px solid var(--m8b);background-image:repeating-linear-gradient(180deg,transparent 0 calc(100%/24 - 1px),var(--m8a) calc(100%/24 - 1px) calc(100%/24))}
.wk2 .wcol b{position:absolute;left:1px;right:1px;display:block;border-radius:1px;cursor:pointer}
.wk2 .wt{text-align:center;font-weight:700;padding:3px 0;border-top:1px solid var(--m8b);color:#333}
.wk2 .wt.z{color:#bbb;font-weight:400}
.wstat{display:flex;gap:12px;align-items:baseline;justify-content:flex-end;margin-top:auto;border-top:1px solid #ddd;padding-top:6px;font-size:10px;color:#555}
.wstat b{font-size:14px}.wstat .big{font-size:22px;font-weight:800;color:#222}
/* month (MiMi 틀) */
.mo2{display:grid;grid-template-columns:repeat(7,1fr) 44px;font-size:9px;border:1px solid var(--m8b);border-radius:4px;overflow:hidden}
.mo2>div{border-left:1px solid var(--m8b);border-top:1px solid var(--m8b);background:#fff;min-height:0}
.mo2 .h{text-align:center;font-weight:700;color:#555;padding:3px 0;background:#fff}
.mo2 .h.sun{color:#c33}
.mo2 .d{min-height:40px;padding:2px 3px;cursor:pointer;position:relative}
.mo2 .d .n{font-size:8px;font-weight:700;color:#666}
.mo2 .d .n.sun{color:#c33}
.mo2 .d .v{text-align:center;font-weight:800;font-size:11px;margin-top:6px}
.mo2 .d .v.off{color:#ccc;font-weight:400}
.mo2 .d.red{background:var(--pink)}.mo2 .d.sky{background:var(--sky)}.mo2 .d.today{outline:2px solid var(--blue);outline-offset:-2px}
.mo2 .d.out{background:#fafafa;cursor:default}
.mo2 .wsum{text-align:center;font-weight:700;color:#333;padding-top:14px;background:#fafafa}
.mosum{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;font-size:10px;color:#555;margin:8px 0 12px;justify-content:flex-end}
.mosum b{font-size:12px}.mosum .big{font-size:22px;font-weight:800;color:#222}
/* to do tracker */
.trkw{overflow-x:auto}
.trk{display:grid;font-size:8px;align-items:center}
.trk .th{text-align:center;color:#888;padding:2px 0}
.trk .th.sun{color:#c33}
.trk .lbl{position:sticky;left:0;background:#fff;font-size:9px;padding:2px 4px;white-space:normal;line-height:1.25;max-height:2.6em;overflow:hidden;word-break:break-all;border-top:1px solid #f0f0f0}
.trk .c2{text-align:center;border-top:1px solid #f0f0f0;padding:3px 0}
.trk .c2.wk{border-left:1px dotted #ddd}
.trk .dot{display:inline-block;width:7px;height:7px;border-radius:50%;cursor:pointer}
.trk .dot.hollow{background:transparent!important;border:1px solid #ccc}
.trk .tm{text-align:right;font-size:9px;font-weight:700;padding:0 4px;border-top:1px solid #f0f0f0;position:sticky;right:0;background:#fff}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;margin:10px 0}
.sum b{font-size:14px}
/* 공통 할일 */
.cmt{border-collapse:collapse;font-size:11.5px;width:100%;margin-top:14px}
.cmt th,.cmt td{border-bottom:1px solid #eee;padding:5px 6px;text-align:left;white-space:nowrap}
.cmt th{font-size:10px;color:#888;font-weight:400}
.cmt td.t2{white-space:normal;width:99%}
.cmt tr.done td{color:#aaa;text-decoration:line-through}
.chip{display:inline-block;border-radius:9px;padding:1px 7px;font-size:10px;border:1px solid #ddd}
.chip.h{background:#FFF3B0;border-color:#e8d98a}.chip.k{background:var(--pink);border-color:#eec3ca}.chip.b{background:#fff}
.dd{font-size:10px;color:#555;font-weight:700}
.dd.late{color:#c33}
.pnav .bdg{background:#c33;color:#fff;border-radius:8px;padding:0 5px;font-size:9px;font-weight:700}
/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.gal .colh{font-size:13px;font-weight:700;padding:4px 0 8px;border-bottom:2px solid #222;margin-bottom:8px;display:flex;justify-content:space-between}
.gal .colh small{font-weight:400;color:#888}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fafafa;cursor:pointer}
.card.empty{background:#f4f4f4;border-style:dashed;cursor:default}
.card .th{height:96px;display:flex;align-items:center;justify-content:center;padding:6px;background:#f6f6f6}
.card.red .th{background:var(--pink)}.card.sky .th{background:var(--sky)}
.card.empty .th{background:transparent;font-size:10px;color:#bbb}
.card .lb{font-size:10.5px;padding:5px 8px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.thumb{width:100%;height:84px;display:grid;grid-template-columns:14px 1fr 30px;gap:3px;position:relative;font-size:7px}
.thumb .rb{writing-mode:vertical-rl;background:var(--m8);color:#fff;text-align:center;font-weight:700;font-size:7px;letter-spacing:.1em}
.thumb .rows{display:grid;grid-template-rows:repeat(24,1fr);gap:1px;background:#fff;padding:2px}
.thumb .rows i{display:block;position:relative;background:#fafafa}
.thumb .rows i b{position:absolute;left:0;top:0;bottom:0;display:block}
.thumb .cols{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#fff;padding:2px;grid-column:2/4}
.thumb .cols i{position:relative;display:block;background:#fafafa}
.thumb .cols i b{position:absolute;left:0;right:0;display:block}
.thumb .side2{background:#fff;padding:2px;line-height:1.3;overflow:hidden;color:#555}
.thumb .tot{position:absolute;right:3px;bottom:1px;font-weight:800;font-size:11px}
/* 데일리 모음 스냅샷 */
.snapbadge{position:absolute;right:4px;top:4px;font-size:8px;background:#fff;border:1px solid #ddd;border-radius:3px;padding:0 4px;color:#888;z-index:3}
/* 시트 통째 축소 썸네일 (feedback4 §9) */
.card .th.full{height:auto;padding:0;display:block;background:transparent}
.mini{position:relative;overflow:hidden;width:100%;min-height:40px}
.mini .miniin{position:absolute;left:0;top:0;transform-origin:0 0}
.mini .minic{position:absolute;inset:0;z-index:2}
.snapbadge.mod{background:#c60;border-color:#c60;color:#fff}
.card .lb b{font-weight:800;font-size:11px}
.mthumb{width:100%;height:84px;display:grid;grid-template-rows:14px 1fr;gap:2px}
.mthumb .rb2{background:var(--m8);color:#fff;text-align:center;font-weight:700;font-size:8px;letter-spacing:.15em;line-height:14px}
.mthumb .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#fff;padding:2px}
.mthumb .mgrid i{display:block;min-height:6px;border:1px solid #f0f0f0}
.galdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid #222;box-sizing:border-box;flex:none}
/* settings */
.set{max-width:560px;font-size:12px}
.set .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.set label{width:90px;color:#666}
.set input,.set select{border:1px solid #ddd;border-radius:3px;padding:5px 7px;flex:1;min-width:120px}
.set .sub{border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0}
.set .sub .row{margin:4px 0}
.set .sub input[type=color]{flex:0 0 36px;padding:0;height:26px}
.set .warn{background:#fff8e6;border:1px solid #f0d090;border-radius:4px;padding:8px;font-size:11px;line-height:1.5}
.set h4{margin:14px 0 4px;font-size:12px}
.log{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#666;background:#f7f7f7;padding:6px;border-radius:4px;white-space:pre-wrap;max-height:160px;overflow:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:8px;padding:16px;width:100%;max-width:380px;font-size:12px}
.modal .box h4{margin-bottom:10px}
.modal .row{display:flex;gap:6px;align-items:center;margin:6px 0}
.modal label{width:44px;color:#666}
.modal input,.modal select{border:1px solid #ddd;border-radius:3px;padding:5px;flex:1;min-width:0}
.modal .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
/* phone */
.pnav{display:none}
.topsel{display:none}
@media (max-width:760px){
 #app{grid-template-columns:1fr}
 .side{display:none}
 .main{padding:10px 10px 70px}
 .dpc{grid-template-columns:1fr}
 .dpc>div:first-child{display:flex;flex-direction:column-reverse}
 .mbar{margin:0 0 8px}
 .three{grid-template-columns:1fr;gap:6px}
 .col{min-height:0}
 .gal{grid-template-columns:1fr}
 .grid3{grid-template-columns:repeat(4,1fr)}
 .cmt .cmby{display:none}
 .ribbon{margin:0 20px 8px}
 .paper{grid-template-columns:1fr}
 .pnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 .pnav div{text-align:center;padding:11px 0 9px;font-size:11px;color:#777}
 .pnav div.on{color:#111;font-weight:700}
 .topsel{display:inline-block;border:1px solid #ccc;border-radius:4px;padding:3px 6px;background:#fff}
 .ttl b{font-size:16px}
}
.moretabs{display:none}
@media (max-width:760px){.moretabs{display:flex}}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;z-index:70;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
/* plan v2 */
.plan-ph{display:none}
.pbnav{display:flex;gap:8px;align-items:center;font-size:11px;margin-bottom:8px;flex-wrap:wrap}
.pbwrap{overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:6px}
.pb{display:grid;gap:1px;background:#eee;font-size:10px;width:max-content;min-width:100%}
.pb .pbl,.pb .pbs,.pbh.pbfix{position:sticky;left:0;z-index:2;border-right:2px solid #fff}
.pb>div{background:#fff;min-height:18px}
.pbh{background:#f7f7f7!important;text-align:center;font-weight:700;padding:4px 2px}
.pbh small{display:block;font-weight:400;color:#888;font-size:8px}
.pbh.cur{background:var(--now)!important;color:var(--blue)}
.pbs{font-weight:700;padding:4px 6px;background:#fafafa!important}
.pbsc{background:#fafafa!important;text-align:center;padding:2px 0}
.pbsc.cur,.pbc.cur{background:#f4f8ff!important}
.pbm{color:#c33;cursor:pointer;font-size:11px}
.pbl{padding:3px 6px;color:#555;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbl small{color:#999;margin-left:3px}
.pbl.sh{min-height:0;padding:0 6px}
.pband{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid;border-radius:4px;margin:1px}
.pband .pbw{padding:3px 2px 2px;text-align:center;border-left:1px dotted rgba(0,0,0,.08);cursor:pointer;background:transparent;min-height:0}
.pband .pbw:first-child{border-left:0}
.pband .pbw.cur{background:rgba(47,111,224,.07)}
.pband .pbw.ext{background:rgba(47,111,224,.13)}

 <div class="side" id="side"></div>
 <div class="main" id="main"></div>

<div class="pnav" id="pnav"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   타임테이블 v1 — 타이머·세션·일간/주간/월간·데일리 모음·오프라인 큐·GitHub 동기화
   데이터 원본: GitHub 비공개 저장소 (사람별 파일). 로컬은 localStorage 큐.
   ============================================================ */
const REPO='zzikkaplan/studyplandata', BRANCH='main';
const DEF_SETTINGS={schemaVersion:1,people:['햄찌','꼬까'],
 subjects:[{n:'민법',c:'#F9A8D4'},{n:'물리',c:'#00B300'},{n:'특허',c:'#0066FF'},{n:'상표',c:'#FF8A65'},{n:'디보',c:'#8D6E63'},{n:'조문',c:'#3a7d8c'},{n:'생물',c:'#FFE600'},{n:'지학',c:'#4DB6AC'},{n:'암기',c:'#D9A6FF'},{n:'기타',c:'#666666'}],
 exams:[{id:'ex1',name:'제64회 변리사 1차',date:'2027-02-20',u:0,del:false}],
 monthColors:['#D32F2F','#F57C00','#FBC02D','#388E3C','#1976D2','#7B1FA2','#D32F2F','#F57C00','#FBC02D','#388E3C','#1976D2','#7B1FA2'], // 1월부터 빨주노초파보 ×2 (8월 = 기존 주황)
 redHours:10,skyHours:6,dayStart:5};
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};
const DAYS=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const ym=s=>s.slice(0,7);
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;           // 분 → HH:MM (24 넘는 시간 허용)
const hmDisp=m=>hm(m>=1440?m-1440:m);                          // 표시용은 24 접기
const dur=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;            // 어디서나 시:분 두 자리 (06:18)
const mSum=list=>list.reduce((a,x)=>a+(x.nt?0:(x.b-x.a)),0);      // nt(합산 제외) 세션 빼고 합 — ★합산 전용. 줄 표시에 쓰지 마라
const mRaw=list=>list.reduce((a,x)=>a+(x.b-x.a),0);               // 실제로 잰 시간 — nt 를 안 본다(줄 표시용 · fb20 §1-1)
const NT_HATCH=';background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)';
const toast=(t)=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)};

/* ---------- 상태 ---------- */
let cfg=LS.get('tt.cfg',{person:'꼬까',token:'',lastSync:0});
let settings=Object.assign({},DEF_SETTINGS,LS.get('tt.settings',{}));
/* v1→v2: exam 하나 → exams 배열. raw(저장돼 있던 원본)에 exams 가 없고 exam 만 있으면 그것이 정본 */
function migrateSettings(raw){
 raw=raw||{};
 if(!Array.isArray(raw.exams)&&raw.exam&&raw.exam.date)settings.exams=[{id:'ex1',name:raw.exam.name||'시험',date:raw.exam.date,u:0,del:false}];
 if(!Array.isArray(settings.exams)||!settings.exams.length)settings.exams=JSON.parse(JSON.stringify(DEF_SETTINGS.exams));
 delete settings.exam;settings.schemaVersion=2;
}
migrateSettings(LS.get('tt.settings',{}));
function nextExam(){const t=today();const xs=(settings.exams||[]).filter(x=>!x.del&&x.date).sort((a,b)=>a.date<b.date?-1:1);return xs.find(x=>x.date>=t)||xs[xs.length-1]||null}
let ui=LS.get('tt.ui',{view:'day',date:null,galMonth:null});
if(ui.view==='week'||ui.view==='month')ui.view='day'; // feedback8 §1: 일간/주간/월간 = 한 페이지
let run=LS.get('tt.run',null);            // 진행 중 타이머 {s,p,i,cat,plan,nt,d,a,at}
let stSel=LS.get('tt.sel',null);          // Study Time 선택 줄 {type:'item'|'cat',id}
let syncLog=[];let syncing=false;
const subjColor=n=>(settings.subjects.find(x=>x.n===n)||{}).c||'#999';
const other=()=>settings.people.find(p=>p!==cfg.person)||'';
const dayStart=()=>settings.dayStart??5;

/* 논리 날짜: 새벽 dayStart 이전은 전날로 */
function logicalNow(){const d=new Date();const mins=d.getHours()*60+d.getMinutes();let ds=iso(d);let m=mins;if(mins<dayStart()*60){ds=addDays(ds,-1);m=mins+1440;}return{d:ds,m};}
function today(){return logicalNow().d}
function curDate(){return ui.date||today()}
function setDate(d){ui.date=d;LS.set('tt.ui',ui);render()}
function setView(v){
 if(v==='week'||v==='month'){const was=ui.view;ui.view='day';LS.set('tt.ui',ui);if(was!=='day')render();ttGo(v);return} // 옛 주간/월간 = 한 페이지의 절 (feedback8 §1)
 if(v==='review'){ui.view='plan';ui.planTab='ach';LS.set('tt.ui',ui);render();return} // 월간계획 해체 (feedback9 §1-4) → 주월계획 달성 탭
 if(v==='plan'&&ui.view!=='plan')planScrollPending=true;ui.view=v;LS.set('tt.ui',ui);render()}

/* ---------- 파일 캐시 (localStorage) ----------
   key: tt.f.<path>  → {data, sha, dirty}
   sessions/<사람>/YYYY-MM.json  {v:1,sessions:[{id,d,s,p,i,a,b,k,u,del}]}
   todos/<사람>.json             {v:1,items:[{id,d,t,kind,done,carry,u,del}]}
   settings.json                 DEF_SETTINGS 구조 */
const fkey=p=>'tt.f.'+p;
function loadF(p,def){return LS.get(fkey(p),{data:def,sha:null,dirty:false})}
function saveF(p,f){LS.set(fkey(p),f)}
const sessPath=(who,m)=>`sessions/${who}/${m}.json`;
const todoPath=who=>`todos/${who}.json`;
const planPath=who=>`plan/${who}.json`;
/* ---- 계획 v2 (feedback7 §1): 프로젝트 스키마 ----
   plan = {v:2, projects:[{id,name,d1,d2,subjects[],cats:{과목:[분류…]},bands[],catGoal{},baselines[],arch,u}], cur, units{}, daily[7], goals{}, pu}
   units(세부계획 DB)·daily·goals 는 plan 층(프로젝트 넘어 재사용 · done 은 band.id 키라 자연 분리).
   주차 저장값 = 화면 라벨: 기간 확정(d2 있음)이면 라벨 = 「시험까지 남은 주」(W1 = 종료일이 든 주 · 큰 수 = 이른 주 = 역산),
   미정이면 W1 부터 오름차순. 내부 계산은 시간순 서수(pWeekNo·bO1·bO2)로 통일한다. */
const CUR_PLAN_V=2;
let planBlocked=false; // 내 plan 파일이 더 새 스키마(v>2)면 쓰기 중단 — 새로고침으로 앱 갱신 필요 (⚠ 버전 게이트)
const EMPTY_PLAN=()=>({v:2,projects:[],cur:'',units:{},daily:[1,1,1,1,1,1,1],goals:{},pu:0});
const MIG_PJ={id:'pj1',name:'64회 1차시험',d1:'2026-08-03',d2:'2027-02-20'}; // §1-7 이사 상수 — 모든 기기가 같은 결과가 되게 고정
function migratePlanData(p){ // v1(평면 bands) → v2(프로젝트) 1회 환산. 멱등: v2 이상이면 그대로 반환.
 if(!p||typeof p!=='object')return EMPTY_PLAN();
 if((p.v||1)>=2)return p;
 const out={v:2,projects:[],cur:'',units:p.units&&typeof p.units==='object'?p.units:{},daily:Array.isArray(p.daily)&&p.daily.length===7?p.daily:[1,1,1,1,1,1,1],goals:p.goals||{},pu:p.pu||0};
 const bands=Array.isArray(p.bands)?p.bands:[],ms=[]; // §3(fb19) 이정표 폐기
 if(!bands.length&&!ms.length)return out; // 빈 plan = 프로젝트 0 (햄찌 등)
 const ws=p.weekStart||'2026-08-03';

 bands.forEach(b=>{b.w1=cv(b.w1);b.w2=cv(b.w2);if(b.orig)b.orig={w1:cv(b.orig.w1),w2:cv(b.orig.w2)};});
 ms.forEach(m=>{m.w=cv(m.w)});

 bl.forEach(x=>{(x.bands||[]).forEach(b=>{b.w1=cv(b.w1);b.w2=cv(b.w2)})});

 out.projects=[{id:MIG_PJ.id,name:MIG_PJ.name,d1:MIG_PJ.d1,d2:MIG_PJ.d2,subjects:subs,cats,bands,catGoal:cg,baselines:bl,arch:false,u:p.pu||0}];

}

/* ---------- GitHub Contents API ---------- */
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function logS(t){syncLog.unshift(`${new Date().toTimeString().slice(0,8)} ${t}`);syncLog=syncLog.slice(0,40)}
async function ghGet(path){
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}&t=${Date.now()}`,{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},cache:'no-store'});
 if(r.status===404)return null;
 if(!r.ok)throw new Error(`GET ${path} ${r.status}`);
 const j=await r.json();return{sha:j.sha,data:JSON.parse(b64d(j.content))};
}
/* 기록 파일은 raw 로 받는다.
   ⚠ vnd.github+json 은 1MB 를 넘으면 content 가 안 온다(민법 2026-08-31 실측 1,116바이트).
     minbeop/기록.json 이 이미 524KB 라 곧 넘는다. */
async function ghGetRaw(path){
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURI(path)}?ref=${BRANCH}&t=${Date.now()}`,
  {headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github.raw'},cache:'no-store'});
 if(r.status===404)return null;
 if(!r.ok)throw new Error(`GET ${path} ${r.status}`);
 return await r.text();
}
async function ghPut(path,data,sha){
 const body={message:`${cfg.person} · ${path}`,content:b64e(JSON.stringify(data,null,1)),branch:BRANCH};if(sha)body.sha=sha;
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error(`PUT ${path} ${r.status}`);
 const j=await r.json();return j.content.sha;
}
/* 병합: id 기준, u(수정시각) 큰 쪽이 이김. 삭제는 del 표식으로 남음 */
function mergeList(a,b){const m=new Map();[...a,...b].forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});return[...m.values()]}
function mergeFile(path,local,remote){
 if(path.startsWith('sessions/'))return{v:1,sessions:mergeList(local.sessions||[],remote.sessions||[])};
 if(path==='todos/공통.json')return{v:1,items:mergeList(local.items||[],remote.items||[])};
 if(path.startsWith('snaps/')){ // 날짜·주·달 키 단위로 u(없으면 at) 큰 쪽
  const out={v:1,days:{},weeks:{},months:{}};
  ['days','weeks','months'].forEach(k=>{const A=(local||{})[k]||{},B=(remote||{})[k]||{};new Set([...Object.keys(A),...Object.keys(B)]).forEach(key=>{const a=A[key],b=B[key];out[k][key]=!a?b:(!b?a:(((a.u||a.at||0)>=(b.u||b.at||0))?a:b))})});
  return out;
 }
 if(path.startsWith('todos/'))return{v:2,cats:mergeList(local.cats||local.plans||[],remote.cats||remote.plans||[]),items:mergeList(local.items||[],remote.items||[])};
 if(path.startsWith('records/'))return{v:1,items:mergeList((local||{}).items||[],(remote||{}).items||[])};
 if(path==='food/food.json'||path==='share/share.json')return{v:1,items:mergeList((local||{}).items||[],(remote||{}).items||[])}; // fb13 §4·§5 공용(사람 구분 없음)
 if(path.startsWith('history/')){const out={v:1,days:{}};const A=(local||{}).days||{},B=(remote||{}).days||{};
  new Set([...Object.keys(A),...Object.keys(B)]).forEach(k=>{const a=A[k],b=B[k];out.days[k]=!a?b:(!b?a:(((a.u||0)>=(b.u||0))?a:b))});return out;}
 if(path.startsWith('plan/')){ // v2: projects 는 id 로 맞추고 안의 bands 는 id·u 병합, 프로젝트 나머지 필드는 u 큰 쪽, plan 층은 pu 큰 쪽
  let A=local||{},B=remote||{};
  if((A.v||1)>CUR_PLAN_V||(B.v||1)>CUR_PLAN_V)return((A.v||0)>=(B.v||0))?A:B; // 더 새 스키마 쪽을 통째 보존 (구버전 앱이 부수지 않게)
  A=migratePlanData(A);B=migratePlanData(B);
  const w=(A.pu||0)>=(B.pu||0)?A:B;
  const out={v:2,cur:w.cur||'',daily:Array.isArray(w.daily)&&w.daily.length===7?w.daily:[1,1,1,1,1,1,1],goals:w.goals||{},lifePlan:Array.isArray(w.lifePlan)?w.lifePlan:[],uArch:(w.uArch&&typeof w.uArch==='object')?w.uArch:{},rbUndo:w.rbUndo||null,pu:w.pu||0}; // uArch·rbUndo = fb12 §5·§9
  out.units={};new Set([...Object.keys(A.units||{}),...Object.keys(B.units||{})]).forEach(s=>{out.units[s]=mergeList((A.units||{})[s]||[],(B.units||{})[s]||[])});
  const ids=[...new Set([...(A.projects||[]).map(x=>x.id),...(B.projects||[]).map(x=>x.id)])];
  out.projects=ids.map(id=>{const a=(A.projects||[]).find(x=>x.id===id),b=(B.projects||[]).find(x=>x.id===id);
   if(!a||!b)return a||b;
   const pj=Object.assign({},(a.u||0)>=(b.u||0)?a:b);
   pj.bands=mergeList(a.bands||[],b.bands||[]);
   const bm=new Map();[...(a.baselines||[]),...(b.baselines||[])].forEach(x=>{if(!x||!x.at)return;const k=(x.v||0)+'|'+x.at;if(!bm.has(k))bm.set(k,x)});
   pj.baselines=[...bm.values()].sort((x,y)=>(x.v||0)-(y.v||0)||(x.at<y.at?-1:1));
   return pj});
  return out;
 }
 return local; // settings: 로컬(더러운 쪽)이 이김
}
function sameJSON(a,b){return JSON.stringify(a)===JSON.stringify(b)}
/* 한 파일 동기화. own=true 면 push 까지, 아니면 pull 만 */
async function syncFile(path,own,def){
 const f=loadF(path,def);
 const remote=await ghGet(path);
 if(!own){ if(remote){f.data=remote.data;f.sha=remote.sha;f.dirty=false;saveF(path,f);} return; }
 let merged=f.data,sha=remote?remote.sha:null;
 if(remote){ merged=f.dirty?mergeFile(path,f.data,remote.data):remote.data; }
 const needPush=f.dirty||(!remote&&path==='settings.json');
 if(needPush&&(!remote||!sameJSON(merged,remote.data))){
  try{sha=await ghPut(path,merged,sha);logS(`↑ ${path}`);}
  catch(e){ if(/409|422/.test(e.message)){const r2=await ghGet(path);merged=mergeFile(path,merged,r2.data);sha=await ghPut(path,merged,r2.sha);logS(`↑ ${path} (재시도)`);} else throw e; }
 }
 f.data=merged;f.sha=sha;f.dirty=false;saveF(path,f);
 if(path==='settings.json'){settings=Object.assign({},DEF_SETTINGS,merged);migrateSettings(merged);LS.set('tt.settings',settings);}
}
async function syncAll(silent){
 if(syncing)return; if(!cfg.token){if(!silent)toast('설정에서 토큰을 넣어줘');return;}
 if(!navigator.onLine){if(!silent)toast('오프라인 — 큐에 보관');return;}
 syncing=true;renderSide();
 try{
  const me=cfg.person,peer=other();const months=new Set([ym(today()),ym(curDate()),ym(addDays(today(),-7))]);if(ui.galMonth)months.add(ui.galMonth);
  listDirty().forEach(p=>{const m=p.match(/^sessions\/[^/]+\/(\d{4}-\d{2})/);if(m)months.add(m[1]);});
  await syncFile('settings.json',true,settings);
  await syncFile(planPath(me),true,EMPTY_PLAN());if(peer)await syncFile(planPath(peer),false,EMPTY_PLAN());
  for(const m of months){await syncFile(sessPath(me,m),true,{v:1,sessions:[]});if(peer)await syncFile(sessPath(peer,m),false,{v:1,sessions:[]});
   await syncFile(snapPath(me,m),true,EMPTY_SNAP());if(peer)await syncFile(snapPath(peer,m),false,EMPTY_SNAP());}
  await syncFile(todoPath(me),true,{v:2,cats:[],items:[]});if(peer)await syncFile(todoPath(peer),false,{v:2,cats:[],items:[]});
  await syncFile('todos/공통.json',true,{v:1,items:[]});
  await syncFile(recPath(me),true,{v:1,items:[]});if(peer)await syncFile(recPath(peer),false,{v:1,items:[]});
  await syncFile(histPath(me),false,{v:1,days:{}});if(peer)await syncFile(histPath(peer),false,{v:1,days:{}}); // 시간층은 앱이 안 씀 — pull 만
  if(ui.view==='arch'||listDirty().includes('food/food.json'))await syncFile('food/food.json',true,{v:1,items:[]}); // fb13 §4 — 보는 중·대기분 있을 때만
  if(ui.view==='share'||listDirty().includes('share/share.json'))await syncFile('share/share.json',true,{v:1,items:[]}); // fb13 §5
  cfg.lastSync=Date.now();LS.set('tt.cfg',cfg);logS('완료');if(!silent)toast('동기화됨');
 }catch(e){logS('✗ '+e.message);if(!silent)toast('동기화 실패: '+e.message);}
 syncing=false;render();

  const i2=String(stSel.id).indexOf('|');const bid=String(stSel.id).slice(0,i2),uid2=String(stSel.id).slice(i2+1);

 const c=tf.data.cats.find(z=>z.id===stSel.id&&!z.del);if(!c)return null;

/* ----- 일간 ----- */
function ttRows(sess,{rows=24,thin=false,lp=null}={}){ // 05~04 24행 · lp = 생활 계획 블록(옅은 빗금 · §7)
 const s0=dayStart()*60;let h='';
 const now=logicalNow();const isToday=curDate()===now.d;
 for(let r=0;r<rows;r++){
  const a=s0+r*60,b=a+60;let bars='';
  (lp||[]).forEach(x=>{const L=Math.max(x.a,a),R=Math.min(x.b,b);if(R>L)bars+=`<b style="left:${(L-a)/60*100}%;width:${(R-L)/60*100}%;background:repeating-linear-gradient(45deg,#eef0f2 0 4px,#e2e4e7 4px 8px);opacity:.9" title="계획 · ${esc(x.label)}"></b>`});
  sess.forEach(x=>{const L=Math.max(x.a,a),R=Math.min(x.b,b);if(R>L)bars+=`<b style="left:${(L-a)/60*100}%;width:${(R-L)/60*100}%;background:${x.life?'#c9ccd1':subjColor(x.s)}${x.nt?NT_HATCH:''}" title="${esc(x.life?('생활'+(x.p?' · '+x.p:'')):x.s)} ${hmDisp(x.a)}-${hmDisp(x.b)}" onclick="editSession('${x.id}',this.ownerDocument)">${(x.life&&x.a>=a&&x.a<b)?lifeTag(x):''}</b>`});
  if(run&&run.d===curDate()){const L=Math.max(run.a,a),R=Math.min(now.m+(now.d!==run.d?1440:0),b);if(R>L)bars+=`<b style="left:${(L-a)/60*100}%;width:${(R-L)/60*100}%;background:${subjColor(run.s)};opacity:.5"></b>`}
  if(isToday&&now.m>=a&&now.m<b)bars+=`<i class="now" style="left:${(now.m-a)/60*100}%"></i>`;
  h+=`<span>${pad((a/60)%24)}</span><div class="r">${bars}</div>`;
 }return h;
}
/* 그날의 Study Time 줄: ① 그날 계획(학습 항목) ② 걸쳐 있는 분류(계획 없는 날) ③ 어디에도 안 붙는 옛 세션 s·p·i 묶음 */
function dayRows(who,d){
 const tf=todoFile(who);const cats=tf.data.cats.filter(c=>!c.del);
 const sess=sessionsOf(who,d);
 const catById=new Map(cats.map(c=>[c.id,c]));
 const used=new Set();const rows=[];
 /* §2(fb16) 주월계획 유래 오늘 몫 = 일간 「오늘」 칸과 같은 원천(dayPlanRows · fb11 §5 캘린더 엔진).
    fb10 §6 에서 세부계획을 복사본 없이 직접 표시로 바꾼 뒤 Study Time 에 안 들어오던 구멍 수리.
    순서 = 오늘 칸과 같게(세부계획 먼저 → 손 활동) · 같은 문구의 옛 복사 할일은 숨김(autoUnitTexts 와 같은 규칙). */
 const plan=who===cfg.person?myPlan():planView(who);
 const unitRows=dayPlanRows(plan,d);
 const autoTx=new Set(unitRows.map(e=>(e.u.id+' '+e.u.n).trim()));
 unitRows.forEach(e=>{
  const ss=sess.filter(x=>{if(used.has(x.id))return false;return x.bd===e.b.id&&x.un===e.u.id});
  ss.forEach(x=>used.add(x.id));
  rows.push({type:'unit',id:e.b.id+'|'+e.u.id,s:e.b.s,cat:null,band:e.b,unit:e.u,label:(e.u.id+' '+e.u.n).trim(),catName:e.b.name,
   done:!!e.done,dim:!!e.dim,late:!!e.late,orig:e.orig||null,min:mRaw(ss),ntMin:mRaw(ss)-mSum(ss),sess:ss});
 });
 const items=tf.data.items.filter(x=>!x.del&&x.kind==='study'&&x.d===d&&!autoTx.has((x.t||'').trim()));
 items.forEach(it=>{
  const c=it.cat?catById.get(it.cat):null;
  const ss=sess.filter(x=>{if(used.has(x.id))return false;
   if(x.plan)return x.plan===it.id;
   if(x.cat)return false;
   return!!c&&x.p===c.name&&x.i===(it.t||'')&&x.s===c.s;});
  ss.forEach(x=>used.add(x.id));
  rows.push({type:'item',id:it.id,s:c?c.s:'기타',cat:c||null,label:it.t||'',done:!!it.done,min:mRaw(ss),ntMin:mRaw(ss)-mSum(ss),sess:ss});
 });
 cats.filter(c=>(c.d1||c.d2)&&catActive(c,d)).forEach(c=>{
  if(rows.some(r=>r.cat&&r.cat.id===c.id))return;
  const ss=sess.filter(x=>{if(used.has(x.id))return false;if(x.plan)return false;if(x.cat)return x.cat===c.id;return x.p===c.name&&!x.i&&x.s===c.s;});
  ss.forEach(x=>used.add(x.id));
  rows.push({type:'cat',id:c.id,s:c.s,cat:c,label:'',done:false,min:mRaw(ss),ntMin:mRaw(ss)-mSum(ss),sess:ss});
 });
 const g={};sess.filter(x=>!used.has(x.id)&&!x.life).forEach(x=>{const k=x.s+'|'+(x.p||'')+'|'+(x.i||'');const o=(g[k]=g[k]||{type:'legacy',id:k,s:x.s,cat:null,label:[x.p,x.i].filter(Boolean).join(' '),done:false,min:0,ntMin:0,sess:[]});o.min+=(x.b-x.a);o.ntMin+=(x.nt?(x.b-x.a):0);o.sess.push(x)}); // 생활 블록은 Study Time 줄에서 제외 (§7)
 rows.push(...Object.values(g));
 return rows;
}
function sheetHTML(who,d,sess,{withRun=true,axis='day'}={}){

 // fb20 §1-4 — 생활과 「합산 제외」를 갈라 적는다. 생활은 이미 nt:1 이라 !x.life 로 겹침을 막는다
 const exL=sess.some(x=>x.life),exN=sess.some(x=>x.nt&&!x.life);
 const exTxt=[exL&&'생활',exN&&'합산 제외'].filter(Boolean).join('·');

 let rows=dayRows(who,d);const mine=who===cfg.person;
 /* §2(fb17) 「활동만 있는 줄」(= 걸친 분류 갈래 · 세부계획 없이 활동 단위로 재는 용도) = 기본 숨김 · 머리 토글로 켠다.
    그날 잰 시간이 있거나 지금 고른 줄은 숨기지 않는다(기록이 사라져 보이면 안 된다). */
 const catRows=rows.filter(r=>r.type==='cat');

 if(!showCat)rows=rows.filter(r=>r.type!=='cat'||(r.sess&&r.sess.length)||(stSel&&stSel.type==='cat'&&stSel.id===r.id));

 const sm=mine?unitSessMap(who):new Map(); // §2(fb16) 이어서/이월 배지 = 오늘 칸과 같은 함수
 const rowHTML=r=>{
  const on=mine&&stSel&&r.type!=='legacy'&&stSel.type===r.type&&stSel.id===r.id;
  const isRun=mine&&run&&run.d===d&&r.type!=='legacy'&&((r.type==='item'&&run.plan===r.id)||(r.type==='cat'&&!run.plan&&run.cat===r.id)||(r.type==='unit'&&run.band===(r.band||{}).id&&run.unit===(r.unit||{}).id));
  const click=r.type==='legacy'?(r.sess[0]?`editSession('${r.sess[0].id}',document)`:''):(mine?`pickRow('${r.type}','${encodeURIComponent(r.id)}')`:''); // §1(fb17) 클릭 = 선택만
  const lbl=r.type==='unit'?[r.catName,r.label].filter(Boolean).join(' '):(r.type==='legacy'?r.label:[r.cat?r.cat.name:'',r.label].filter(Boolean).join(' '));
  const badge=r.type==='unit'?carryBadge(r,sm):'';
  return`<div class="it ${on?'selr':''} ${r.done?'done2':''} ${r.dim?'dim2':''}" onclick="${click}"><i class="sw" style="background:${subjColor(r.s)}"></i><span class="nm">${esc(r.s)}</span><span class="pl${(ui.stMore||{})[r.type+'|'+r.id]?' ex':''}" data-more="${esc(r.type+'|'+r.id)}">${esc(lbl)||'—'}</span>${badge}<span${isRun?` id="stRunMin" data-base="${r.min}"`:''}${r.ntMin?` style="color:#999" title="합산 제외 — 잰 시간은 이 값이고 Total 에는 안 들어간다"`:''}>${dur(r.min+(isRun?runMin:0))}</span>${on&&r.type==='item'?`<button class="btn" onclick="event.stopPropagation();toggleTodo('${r.id}')">${r.done?'완료 취소':'완료'}</button>`:''}${on&&r.type==='unit'?`<button class="btn" onclick="event.stopPropagation();togglePlanDone('${(r.band||{}).id}','${(r.unit||{}).id}','${d}')">${r.done?'완료 취소':'완료'}</button>`:''}</div>`;
 };
 return`<div class="sheet" style="position:relative"><button class="btn pmbtn" onclick="pmPopup(this.ownerDocument)" title="계획관리 팝업 — 화면 이동 없이 편집 (§9)">📋 계획관리</button><div class="ribbon rbtn" onclick="ribbonModal('${axis}',this.ownerDocument)" title="클릭 = 날짜 이동 · 하루 시작 (§1 fb18)">${rlab}</div><div class="paper">
 <div><div class="hd">Time Table</div><div class="tt"><span></span><div class="tth">${[1,2,3,4,5].map(n=>`<i style="left:${(n*100/6).toFixed(2)}%">${n*10}</i>`).join('')}</div>${ttRows(sess,{lp:lifePlanned(who,d)})}</div></div>
 <div class="stc"><div class="hd">Study Time${mine&&catRows.length?`<span class="sttgl" onclick="stCatTgl()" title="세부계획 없이 활동 단위로 재는 줄 — 켜면 목록에 나온다">활동 줄 ${catRows.length} ${showCat?'▾':'▸'}</span>`:''}</div><div class="st">${rows.map(rowHTML).join('')||'<div style="color:#bbb;font-size:11px">기록 없음</div>'}${(()=>{const lm=sess.filter(x=>x.life).reduce((a,x)=>a+(x.b-x.a),0);return`<div class="it liferow" ${mine?`onclick="pickRow('life','')" title="클릭 = 선택 · START 로 시작 — 종류는 블록 클릭으로 나중에 지정 (합산 없음)"`:''}><i class="sw hsw"></i><span class="nm">생활</span><span class="pl" style="color:#aaa">${mine?'밥·산책·… 나중 지정':''}</span><span>${lm?dur(lm):''}</span></div>`})()}</div>
 <div class="foot"><div>Start <b>${sess.length?hmDisp(sess[0].a):(mine&&run&&run.d===d?hmDisp(run.a):'--:--')}</b> &nbsp; Stop <b>${sess.length?hmDisp(Math.max(...sess.map(x=>x.b))):'--:--'}</b></div><div>Total${exTxt?`<i style="font-style:normal;font-size:9px;color:#999"> (${exTxt}${exN?' 뺀 값':' 제외'})</i>`:''} <span class="big"${mine&&run&&run.d===d?` id="stTot" data-base="${tot}"`:''}>${dur(tot+(mine&&run&&run.d===d&&!run.nt?runMin:0))}</span></div></div></div></div></div>`;

function dueBadge(due){const n=Math.ceil((parse(due)-parse(today()))/864e5);return`<span class="dd ${n<0?'late':''}">${n>0?'D-'+n:n===0?'D-day':'D+'+(-n)}</span>`}
function sharedForCol(x,i){
 const me=cfg.person;const list=sharedItems();
 if(i===0)return list.filter(s=>s.doneAt===x);
 if(i===2)return list.filter(s=>!s.done&&s.due===x);
 // fb20 §2-1 — 기한이 미래면 오늘 칸에 두지 않는다(기한 없음·오늘·지난 것은 그대로 남는다)
 if(x===today())return list.filter(s=>!s.done&&(s.who||[]).includes(me)&&(!s.due||s.due<=x)).sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:1);
 return list.filter(s=>!s.done&&s.due===x);
}

 if(b<=A.m)b=A.m+1;
 const origD=s.d;s.d=A.d;s.a=A.m;s.b=b;
 if(ym(s.d)!==ym(origD)){const pOld=sessPath(cfg.person,ym(origD));const fO=loadF(pOld,{v:1,sessions:[]});const iO=fO.data.sessions.findIndex(x=>x.id===s.id);if(iO>=0){fO.data.sessions[iO]=Object.assign({},fO.data.sessions[iO],{del:true,u:Date.now()});fO.dirty=true;saveF(pOld,fO);}}

 if(s.life){lifeModal(s,doc);return} // §7 생활 블록 = 종류 지정 모달
 const rows=dayRows(cfg.person,s.d).filter(r=>r.type!=='legacy');
 const curVal=s.plan?('item:'+s.plan):(s.cat?('cat:'+s.cat):'');
 const opts=[`<option value="">기타 ${esc([s.s,s.p,s.i].filter(Boolean).join(' '))||''}</option>`].concat(rows.map(r=>{const v=r.type+':'+r.id;const lbl=[r.s,r.cat?r.cat.name:'',r.label].filter(Boolean).join(' ');return`<option value="${v}" ${curVal===v?'selected':''}>${esc(lbl)}</option>`})).join('');
 modal(`<h4>세션 편집</h4>
 <div class="row"><label>시작</label><input id="eA2" type="datetime-local" value="${sessDT(s.d,s.a)}"></div>
 <div class="row"><label>끝</label><input id="eB2" type="datetime-local" value="${sessDT(s.d,s.b)}"></div>
 <div class="row"><label>활동</label><select id="eRow">${opts}</select></div>
 <p style="font-size:10px;color:#888">새벽 ${pad(dayStart())}:00 전은 전날로 저장돼.</p>`,
 q=>{
  sessSaveTimes(s,q('eA2').value,q('eB2').value); // §4(fb18) 공용 경로
  const rv=q('eRow').value;const tf=todoFile(cfg.person);
  if(rv){const ty=rv.split(':')[0],rid=rv.slice(rv.indexOf(':')+1);
   if(ty==='item'){const it=tf.data.items.find(x=>x.id===rid);const c=it&&it.cat?tf.data.cats.find(z=>z.id===it.cat):null;s.plan=rid;s.cat=c?c.id:'';s.s=c?c.s:'기타';s.p=c?c.name:'';s.i=it?(it.t||''):'';s.nt=!!(c&&c.noTimer);}
   else{const c=tf.data.cats.find(z=>z.id===rid);s.plan='';s.cat=rid;if(c){s.s=c.s;s.p=c.name;s.i='';s.nt=!!c.noTimer;}}
  }else{s.plan='';s.cat='';}
  upsertSession(s);render()},
 ()=>{if(confirm('이 세션을 지울까?')){deleteSession(s);render()}},doc);
}
function modal(body,onOk,onDel,doc,okLabel){doc=doc||document; // §1-1(fb19) okLabel 만 선택 인자 — 안 주면 종전대로 「저장」
 const m=doc.createElement('div');m.className='modal';m.innerHTML=`<div class="box">${body}<div class="acts">${onDel?'<button class="btn d" id="mDel">삭제</button>':''}<button class="btn" id="mNo">취소</button><button class="btn p" id="mOk">${esc(okLabel||'저장')}</button></div></div>`;
 doc.body.appendChild(m);const close=()=>m.remove();const q=id=>m.querySelector('#'+id);
 const after=()=>{if(typeof pipPaint=='function')pipPaint()}; // §1-2(fb19) 닫은 뒤 PiP 반영(보류 규칙 때문에 render 만으로는 안 따라옴)
 q('mNo').onclick=()=>{close();after()};q('mOk').onclick=()=>{onOk(q);close();after()};if(onDel)q('mDel').onclick=()=>{onDel();close();after()};
 m.addEventListener('click',e=>{if(e.target===m)close()});
}
/* ----- 주간 ----- */
function weekStart(d){const dt=parse(d);const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return iso(dt)}
function weekCardHTML(ws){ // MiMi 주간 카드 — feedback5 그대로 · 폭 500 (한 페이지 주간 절에서 사용)
 const days=[...Array(7)].map((_,i)=>addDays(ws,i));const s0=dayStart()*60;
 const sessD=days.map(x=>sessionsOf(cfg.person,x));const tots=sessD.map(mSum);const wt=tots.reduce((a,b)=>a+b,0);
 const H=24*60;
 const cols=days.map((x,i)=>`<div class="wcol">${sessD[i].map(y=>`<b style="top:${((y.a-s0)/H*100).toFixed(2)}%;height:${((y.b-y.a)/H*100).toFixed(2)}%;background:${y.life?'#c9ccd1':subjColor(y.s)}${y.nt?NT_HATCH:''}" title="${esc(y.life?('생활'+(y.p?' · '+y.p:'')):y.s)} ${hmDisp(y.a)}-${hmDisp(y.b)}" onclick="setDate('${x}');editSession('${y.id}',document)"></b>`).join('')}</div>`).join('');
 const labs=`<div class="wlab">${[...Array(24)].map((_,r)=>`<span>${pad((dayStart()+r)%24)}</span>`).join('')}</div>`;
 const tf=todoFile(cfg.person);const all=sessD.flat();
 const byCat=new Map();const other={};
 all.forEach(y=>{if(y.life)return;const cid=sessCatId(y,tf);const m2=y.nt?0:y.b-y.a;if(cid)byCat.set(cid,(byCat.get(cid)||0)+m2);else other[y.s]=(other[y.s]||0)+m2});
 tf.data.cats.filter(c=>!c.del&&(c.d1||c.d2)&&(!c.d1||c.d1<=days[6])&&(!c.d2||c.d2>=days[0])).forEach(c=>{if(!byCat.has(c.id))byCat.set(c.id,0)});
 const rows=[]; // 줄 순서 = 분류 만든 순(cats 배열 순 · MiMi 와 같게)
 tf.data.cats.forEach(c=>{if(!c.del&&byCat.has(c.id))rows.push({s:c.s,n:c.name,m:byCat.get(c.id)})});
 Object.entries(other).forEach(([s,m2])=>rows.push({s,n:'기타',m:m2}));
 return`<div class="sheet" style="width:500px;max-width:100%;flex:none"><div class="ribbon rbtn" onclick="ribbonModal('week',this.ownerDocument)" title="클릭 = 주 이동 · 하루 시작">${ws.replace(/-/g,'.')} ~ ${days[6].replace(/-/g,'.')}</div><div class="paper">
 <div><div class="hd">Time Table</div><div class="wk2"><div class="wh"></div>${days.map(x=>`<div class="wh ${x===today()?'today':''}">${['SUN','MON','TUE','WED','THU','FRI','SAT'][parse(x).getDay()]}</div>`).join('')}
 ${labs}${cols}
 <div class="wt"></div>${tots.map(t2=>`<div class="wt ${t2?'':'z'}">${dur(t2)}</div>`).join('')}</div></div>
 <div class="stc"><div class="hd">Study Time</div><div class="st">${rows.map(r=>`<div class="it"><i class="sw" style="background:${subjColor(r.s)}"></i><span class="nm">${esc(r.s)}</span><span class="pl">${esc(r.n)}</span><span>${dur(r.m)}</span></div>`).join('')||'<div style="color:#bbb;font-size:11px">기록 없음</div>'}</div>
 <div class="wstat"><span>Avg <b>${dur(Math.round(wt/7))}</b></span><span>Total <span class="big">${dur(wt)}</span></span></div></div>
 </div></div>`;
}
function gotoBand(id){const p=myPlan();const b=p.bands.find(x=>x.id===id&&!x.del);if(!b)return;ui.planTab='week';ui.view='plan';LS.set('tt.ui',ui);planScrollPending=false;planScroll=Math.max(0,(bO1(p,b)-2)*PB_COL);render();}
function subjTotals(list){const g={};list.forEach(x=>{if(x.nt)return;g[x.s]=(g[x.s]||0)+x.b-x.a});return Object.entries(g).map(([s,min])=>({s,min})).sort((a,b)=>b.min-a.min)}
/* ----- 월간 ----- */
function monthCardHTML(m){ // MiMi 월간 점 카드(Study Time 그리드 + To do Tracker) — 점 축약은 여기만 (feedback8 §1-5)
 const first=m+'-01';const fd=parse(first);const nd=new Date(fd.getFullYear(),fd.getMonth()+1,0).getDate();
 const lastD=`${m}-${pad(nd)}`;const t0=today();
 const allS=sessionsMonth(cfg.person,m);
 const byDay={};allS.forEach(x=>(byDay[x.d]=byDay[x.d]||[]).push(x));
 const dayMin=x=>mSum(byDay[x]||[]);
 let cells='';let cur=addDays(first,-((fd.getDay()+6)%7));
 while(cur<=lastD){
  let row='';let wsum=0;
  for(let i=0;i<7;i++){const x=cur;
   if(ym(x)===m){const t2=dayMin(x);wsum+=t2;const dow=parse(x).getDay();
    const cls=t2>=settings.redHours*60?'red':t2>=settings.skyHours*60?'sky':'';
    row+=`<div class="d ${cls} ${x===t0?'today':''}" onclick="ttGoDate('${x}')"><div class="n ${dow===0?'sun':''}">${parseInt(x.slice(8))}</div><div class="v ${t2?'':'off'}">${t2?dur(t2):'OFF'}</div></div>`;
   }else row+=`<div class="d out"></div>`;
   cur=addDays(cur,1);
  }
  cells+=row+`<div class="wsum" style="${wsum?'':'color:#ccc;font-weight:400'}">${dur(wsum)}</div>`;
 }
 const tot=mSum(allS);
 const tf=todoFile(cfg.person);
 const items=tf.data.items.filter(x=>!x.del&&x.kind==='study'&&ym(x.d)===m);
 const itByDay={};items.forEach(x=>(itByDay[x.d]=itByDay[x.d]||[]).push(x));
 let off=0,c0=0,c6=0,c10=0,allClear=0;
 for(let i=1;i<=nd;i++){const x=`${m}-${pad(i)}`;const t2=dayMin(x);
  if(!t2)off++;else if(t2<settings.skyHours*60)c0++;else if(t2<settings.redHours*60)c6++;else c10++;
  const its=itByDay[x];if(its&&its.length&&its.every(z=>z.done))allClear++;
 }
 const sum=`<div class="mosum"><span>ALL Clear <b>${pad(allClear)}일</b></span><span>OFF <b>${pad(off)}일</b> / 00+ <b>${pad(c0)}일</b></span><span>${pad(settings.skyHours)}+ <b>${pad(c6)}일</b> / ${pad(settings.redHours)}+ <b>${pad(c10)}일</b></span><span>Avg <b>${dur(Math.round(tot/nd))}</b></span><span class="big">${dur(tot)}</span></div>`;
 /* To do Tracker */
 const catById=new Map(tf.data.cats.map(c=>[c.id,c]));
 const catDays=new Map();const catMin=new Map();
 allS.forEach(y=>{const cid=sessCatId(y,tf);if(!cid)return;if(!catDays.has(cid))catDays.set(cid,new Set());catDays.get(cid).add(y.d);catMin.set(cid,(catMin.get(cid)||0)+(y.nt?0:y.b-y.a));});
 tf.data.cats.filter(c=>!c.del&&(c.d1||c.d2)&&(!c.d1||c.d1<=lastD)&&(!c.d2||c.d2>=first)).forEach(c=>{if(!catDays.has(c.id))catDays.set(c.id,new Set());if(!catMin.has(c.id))catMin.set(c.id,0)});
 const ordN=settings.subjects.map(x=>x.n);const oi=s=>{const i=ordN.indexOf(s);return i<0?999:i};
 const trkCats=[...catDays.keys()].map(id=>catById.get(id)).filter(Boolean).sort((a,b)=>oi(a.s)-oi(b.s)||((a.d1||'')<(b.d1||'')?-1:1));
 let trk=`<div class="trk" style="grid-template-columns:64px repeat(${nd},minmax(12px,1fr)) 44px"><div class="th" style="text-align:left"></div>`;
 for(let i=1;i<=nd;i++){const x=`${m}-${pad(i)}`;trk+=`<div class="th ${parse(x).getDay()===0?'sun':''}">${i}</div>`}
 trk+=`<div class="th">time</div>`;
 trkCats.forEach(c=>{
  trk+=`<div class="lbl" title="${esc(c.s)}/${esc(c.name)}">${esc(c.s)}/${esc(c.name)}</div>`;
  const ds2=catDays.get(c.id);
  for(let i=1;i<=nd;i++){const x=`${m}-${pad(i)}`;const mon=(parse(x).getDay()+6)%7===0;
   const has=ds2.has(x);const act=(c.d1||c.d2)&&catActive(c,x);
   trk+=`<div class="c2 ${mon?'wk':''}">${has?`<span class="dot" style="background:${subjColor(c.s)}" onclick="ttGoDate('${x}')"></span>`:(act?`<span class="dot hollow" onclick="ttGoDate('${x}')"></span>`:'')}</div>`}
  trk+=`<div class="tm">${dur(catMin.get(c.id)||0)}</div>`;
 });
 trk+='</div>';
 return`<div class="sheet" style="width:500px;max-width:100%;flex:none"><div class="ribbon rbtn" onclick="ribbonModal('month',this.ownerDocument)" title="클릭 = 월 이동 · 하루 시작">${first.replace(/-/g,'.')} ~ ${lastD.replace(/-/g,'.')}</div><div style="background:#fff;border-radius:4px;padding:10px">
 <div class="hd">Study Time</div>
 <div class="mo2"><div class="h">MON</div><div class="h">TUE</div><div class="h">WED</div><div class="h">THU</div><div class="h">FRI</div><div class="h">SAT</div><div class="h sun">SUN</div><div class="h">+</div>${cells}</div>
 ${sum}
 <div class="hd">To do Tracker</div><div class="trkw">${trk||''}</div>
 <p style="font-size:10px;color:#888;margin-top:6px">채운 점 = 그날 잰 분류 · 빈 점 = 계획 기간인데 안 잼 · 점 클릭 = 그날 일간</p>
 </div></div>`;
}
function shiftMonth(d,n){const dt=parse(d);dt.setDate(1);dt.setMonth(dt.getMonth()+n);return iso(dt)}
/* ----- 데일리 모음 = 반영(스냅샷) ----- */
function takeSnap(d){ // 내 것만. 그 시점 복사본 — 원본을 나중에 고쳐도 칸은 그대로
 const who=cfg.person;const m=ym(d);const f=snapFileF(who,m);
 const sess=sessionsOf(who,d);
 const rows=dayRows(who,d); // Study Time 줄 그대로 저장 (it = [과목,라벨,완료,분,분류명,이월배지] — 6번째 = §7-4 fb17)
 const old=f.data.days[d]||{};
 f.data.days[d]={at:Date.now(),u:Date.now(),total:mSum(sess),memo:old.memo||'',
  ss:sess.map(x=>[x.s,x.a,x.b,x.nt?1:0,x.life?1:0]),
  it:rows.map(r=>[r.s,(r.type==='unit'?[r.catName,r.label].filter(Boolean).join(' '):(r.type==='legacy'?r.label:[r.cat?r.cat.name:'',r.label].filter(Boolean).join(' '))),r.done?1:0,r.min,r.cat?r.cat.name:(r.catName||''),carryText(r)||'',r.ntMin||0])};
 f.dirty=true;saveF(snapPath(who,m),f);scheduleSync();
}
/* 스냅샷을 일간 시트 모양 그대로 렌더 (확대 보기용 · 옛 스냅샷은 줄 시간이 없어 빈칸 — 다시 반영으로 채움) */
function snapSheetHTML(d,sn){
 const dt=parse(d);const sess=snapSess(sn,d);
 const rows=(sn.it||[]).map(z=>({s:z[0],label:z[1],done:!!z[2],min:z[3],carry:z[5]||'',ntMin:z[6]||0})); // 옛 스냅샷은 z[5] 가 없어 배지 없이 그려짐(무해)
 return`<div class="sheet"><div class="ribbon">${d.replace(/-/g,'.')} ${['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getDay()]}</div><div class="paper">
 <div><div class="hd">Time Table</div><div class="tt"><span></span><div class="tth">${[1,2,3,4,5].map(n=>`<i style="left:${(n*100/6).toFixed(2)}%">${n*10}</i>`).join('')}</div>${ttSnap(sess)}</div></div>
 <div class="stc"><div class="hd">Study Time</div><div class="st">${rows.map(r=>`<div class="it ${r.done?'done2':''}"><i class="sw" style="background:${subjColor(r.s)}"></i><span class="nm">${esc(r.s)}</span><span class="pl">${esc(r.label)||'—'}</span>${r.carry?`<span class="${carryCls(r.carry)}">${esc(r.carry)}</span>`:''}<span${r.ntMin?` style="color:#999" title="합산 제외 — 잰 시간은 이 값이고 Total 에는 안 들어간다"`:''}>${r.min!=null?dur(r.min):''}</span></div>`).join('')||'<div style="color:#bbb;font-size:11px">기록 없음</div>'}</div>
 <div class="foot"><div>Start <b>${sess.length?hmDisp(Math.min(...sess.map(x=>x.a))):'--:--'}</b> &nbsp; Stop <b>${sess.length?hmDisp(Math.max(...sess.map(x=>x.b))):'--:--'}</b></div><div>Total <span class="big">${dur(sn.total||0)}</span></div></div></div></div></div>`;
}
function snapDirtyChk(who,d,sn){const su=sn.at||0;
 if(sessFile(who,ym(d)).data.sessions.some(x=>x.d===d&&(x.u||0)>su))return true;
 return todoFile(who).data.items.some(x=>x.kind==='study'&&x.d===d&&(x.u||0)>su);
}
function snapMode(){return((settings.snapMode||{})[cfg.person])||'manual'} // ⚠ 기본 수동
function autoSnapCatchup(){ // 자동 모드: 하루가 지나면 전날을 찍고, 밀린 날(최근 30일)은 지금 데이터로
 if(snapMode()!=='auto')return;
 const t0=today();let n=0;
 for(let i=30;i>=1;i--){const d=addDays(t0,-i);if(!snapOf(cfg.person,d)){takeSnap(d);n++;}}
 if(n)toast('밀린 '+n+'일을 데일리 모음에 반영했어');
}
function snapMemoSave(kind,key,val,m){
 const f=snapFileF(cfg.person,m);
 if(kind==='days'){const e=f.data.days[key];if(!e)return;e.memo=val;e.u=Date.now();}
 else{const g=f.data[kind];g[key]=g[key]||{};g[key].memo=val;g[key].u=Date.now();}
 f.dirty=true;saveF(snapPath(cfg.person,m),f);scheduleSync();
}
function ddayAt(d){const xs=(settings.exams||[]).filter(x=>!x.del&&x.date).sort((a,b)=>a.date<b.date?-1:1);const x=xs.find(z=>z.date>=d)||xs[xs.length-1];if(!x)return'';const n=Math.ceil((parse(x.date)-parse(d))/864e5);return n>=0?`D-${n}`:`D+${-n}`}
function snapMonthStats(who,m){const fd=parse(m+'-01');const nd=new Date(fd.getFullYear(),fd.getMonth()+1,0).getDate();const t0=today();let tot=0,miss=0;
 for(let i=1;i<=nd;i++){const x=`${m}-${pad(i)}`;const sn=snapOf(who,x);
  if(sn)tot+=sn.total||0;
  else{const hs=histOf(who,x);if(hs&&!sessionsOf(who,x).length)tot+=hs.min;else if(x<t0)miss++;}} // 시간층 날짜 = 합계에만 · 미반영 아님
 return{tot,miss}}
function ttSnap(ss){const s0=dayStart()*60;let h='';for(let r=0;r<24;r++){const a=s0+r*60,b=a+60;let bars='';ss.forEach(x=>{const L=Math.max(x.a,a),R=Math.min(x.b,b);if(R>L)bars+=`<b style="left:${(L-a)/60*100}%;width:${(R-L)/60*100}%;background:${x.life?'#c9ccd1':subjColor(x.s)}${x.nt?NT_HATCH:''}"></b>`});h+=`<span>${pad((a/60)%24)}</span><div class="r">${bars}</div>`}return h}
function snapSess(sn,d){return(sn.ss||[]).map(z=>({s:z[0],a:z[1],b:z[2],nt:z[3],life:z[4]||(z[0]==='생활'?1:0),d}))} // life = §10 빗금 (옛 스냅은 이름 폴백)
function footBg(t){return t>=settings.redHours*60?'#FBDDE2':t>=settings.skyHours*60?'#DCEBFA':'#F1F1F1'}
function dayCard(who,x){
 const sn=snapOf(who,x);const dt=parse(x);const mine=who===cfg.person;
 const dlab=`${x.slice(2).replace(/-/g,'/')} (${DAYS[dt.getDay()]})`;
 if(!sn){
  const hs=histOf(who,x);
  if(hs&&!sessionsOf(who,x).length){ // 시간층만 있는 날짜 — 시각 정보가 없으니 썸네일 없이 빈 칸 + Total · est 는 ≈ · 앱 세션 있으면 앱 실측 우선(시간층 무시)
   return`<div class="card hist" title="${esc('노션 이전분 ('+(hs.q==='est'?'시간대 어림':hs.q==='gas'?'GAS 분':'정확')+')'+(hs.raw?' · '+hs.raw:''))}"><div class="th"></div><div class="lb" style="background:${footBg(hs.min)};color:#111"><span>${dlab}</span><span style="color:#666">${ddayAt(x)}</span><b style="margin-left:auto">${hs.q==='est'?'≈':''}${dur(hs.min)}</b></div></div>`;
  }
  const isT=x===today();
  return`<div class="card empty"><div class="th" style="flex-direction:column;gap:6px;position:relative"><span class="snapbadge">미반영</span><span>${isT?(snapMode()==='auto'&&mine?'오늘 · 하루가 지나면 자동 반영':'오늘'):'지난 날'}</span>${mine?`<button class="btn" style="border-color:var(--blue);color:var(--blue)" onclick="takeSnap('${x}');toast('반영했어');render()">${isT&&snapMode()==='auto'?'지금 반영':'데일리 모음에 반영'}</button>`:''}</div><div class="lb"><span>${dlab}</span><span>${ddayAt(x)}</span><b style="margin-left:auto;color:#ccc">--:--</b></div></div>`;
 }
 const dirty=mine&&snapDirtyChk(who,x,sn);

   내부 계산은 「시간순 서수 o」(1 = 프로젝트 첫 주 · 커질수록 뒤)로 통일, 저장·표시는 라벨
   (확정 = 시험까지 남은 주 · pLab 로 서수↔라벨 왕복 — 자기 역함수). */
function pjGrid(pj){if(!pj||!pj.d1)return null;const a=weekStart(pj.d1);
 return{a,o2:pj.d2?Math.floor((parse(weekStart(pj.d2))-parse(a))/864e5/7)+1:null}}
function pWeekNo(plan,d){const g=pjGrid(plan.__pj);if(!g)return-9999;return Math.floor((parse(weekStart(d))-parse(g.a))/864e5/7)+1} // 날짜 → 서수

function pLab(plan,o){const g=pjGrid(plan.__pj);if(!g||!g.o2)return o;return g.o2-o+1}   // 서수 ↔ 라벨 (확정 = 역산)
function pOrdL(plan,L){return pLab(plan,L)}                                              // 라벨 → 서수 (같은 함수)
function bO1(plan,b){return pOrdL(plan,b.w1)}  // 띠 시작·끝의 서수 — 확정 프로젝트는 w1(라벨) ≥ w2 지만 서수는 bO1 ≤ bO2
function bO2(plan,b){return pOrdL(plan,b.w2)}
function wDirL(plan){const g=pjGrid(plan.__pj);return g&&g.o2?-1:1} // 시간순 +1주 = 라벨의 이 증분
function fmtW(plan,o){return'W'+pad(pLab(plan,o))}

function distWeightsOf(d,s){d=d||{};const sd=(d.subjDays||{})[s];
 if(Array.isArray(sd)&&sd.length===7&&sd.some(x=>x))return sd.map(x=>x?1:0);
 if(d.mode==='daily'&&Array.isArray(d.daily)&&d.daily.length===7)return d.daily.map(x=>Math.max(0,+x||0));

function pjDistCfg(plan){const pj=plan.__pj;const d=(pj&&pj.dist)||{};
 return{mode:d.mode==='daily'?'daily':'even',daily:Array.isArray(d.daily)&&d.daily.length===7?d.daily.map(x=>Math.max(0,+x||0)):[1,1,1,1,1,1,1],subjDays:d.subjDays&&typeof d.subjDays==='object'?d.subjDays:{}}}

function weekQuotasW(w,per){const W=w.reduce((a,b)=>a+(+b||0),0);per=+per||0;if(!W||!per)return[0,0,0,0,0,0,0];let prev=0,acc=0;const out=[];for(let i=0;i<7;i++){acc+=(+w[i]||0);const c=Math.round(per*acc/W);out.push(c-prev);prev=c}return out}

function bandQuota(plan,band,d){if(!bandPlaced(band))return 0;const o=pWeekNo(plan,d);if(o<bO1(plan,band)||o>bO2(plan,band))return 0;return weekQuotas(plan,band)[dayIdx(d)]}
function bandUnits(plan,band){const m=unitMap(plan,band.s);return(band.units||[]).map(id=>m.get(id)).filter(Boolean)}
function bandDone(plan,band){return bandUnits(plan,band).filter(u=>u.done&&u.done[band.id]).length}

/* §9(fb12) rb = 재배치 마커 {d:기준일, base:그때 완료 수} — w1 은 안 건드리고 「오늘 이전 몫 = 0」 을 내부 계산으로:
   기준일 이후의 예정 = base + 기준일부터의 quota 누적 (기준일 전 몫은 소멸). 화면 W범위 무변. */
function plannedThrough(plan,band,d){if(!bandPlaced(band))return 0;const s=pWeekDate(plan,bO1(plan,band));if(d<s)return 0;const e=pWeekDate(plan,bO2(plan,band),6);const end=d<e?d:e;const q=weekQuotas(plan,band);
 const rb=band.rb&&band.rb.d?band.rb:null;
 if(rb&&d>=rb.d){let tot=+rb.base||0;for(let x=(rb.d>s?rb.d:s);x<=end;x=addDays(x,1))tot+=q[dayIdx(x)];return tot}
 let tot=0;for(let x=s;x<=end;x=addDays(x,1))tot+=q[dayIdx(x)];
 if(rb)tot=Math.min(tot,+rb.base||0); // 기준일 전 예정은 base 로 캡 — 적용 당일의 밀림(어제 기준)도 0
 return tot}
function late(plan,band,d){const us=bandUnits(plan,band);if(!us.length)return 0;return Math.max(0,Math.min(plannedThrough(plan,band,d),us.length)-bandDone(plan,band))}
/* §5(fb11) 일간 몫 = 세부계획 캘린더 엔진(bandChips·calData)과 같은 배치 — 옛 bandListFor/bandListTomorrow 산식 폐기.
   §6 과거 날짜 = 그날 완료(체크) + 그날 예정(자동/고정 자리)이었는데 아직 미완료 = dim(흐림 · 실제 할 일은 오늘 칸에만). */
function dayPlanRows(plan,d){
 if(!(plan.bands||[]).some(b=>!b.del&&bandPlaced(b)))return[];
 const t=today();
 if(d<t){
  const out=[];
  plan.bands.filter(b=>!b.del&&bandPlaced(b)).forEach(b=>{
   const pins=pjPins(plan,b.id);const naive=bandPlanDates(plan,b);
   bandUnits(plan,b).forEach(u=>{
    const dd=u.done&&u.done[b.id];
    const pd=pins[u.id]||naive.get(u.id);
    if(dd===d)out.push({b,u,done:1,orig:pd||d});
    else if(!dd&&pd===d)out.push({b,u,dim:1,orig:pd||d});
   });
  });

 }
 const cd=calData(plan,d,d);
 return(cd.chips[d]||[]).map(c=>({b:c.b,u:c.u,done:c.done?1:0,late:c.late?1:0,orig:c.orig||null}));

/* §11(fb11) 이어서/이월 판정 재료 — 세부계획에 붙은 세션(un·bd)에서 매번 도출(스키마 추가 없음 ⚠):
   bd|un → {min:연결 세션 합, first:첫 세션 날짜, last}. un 연결은 tt-v18부터라 옛 세션엔 없음 = 전부 「이월」로 보임(정직 표기). */
function unitSessMap(who){
 const pre='tt.f.sessions/'+who+'/';const m=new Map();
 Object.keys(localStorage).filter(k=>k.startsWith(pre)).forEach(k=>{const f=LS.get(k);((f&&f.data&&f.data.sessions)||[]).forEach(s=>{
  if(s.del||!s.bd||!s.un)return;const key=s.bd+'|'+s.un;const o=m.get(key)||{min:0,first:s.d,last:s.d};
  o.min+=Math.max(0,s.b-s.a);if(s.d<o.first)o.first=s.d;if(s.d>o.last)o.last=s.d;m.set(key,o)});});

function weekDoneCount(plan,band,w){const a=pWeekDate(plan,w),b=pWeekDate(plan,w,6);return bandUnits(plan,band).filter(u=>{const d=u.done&&u.done[band.id];return d&&d>=a&&d<=b}).length}
function endDate(plan,band){const us=bandUnits(plan,band);if(!us.length)return null;const t=today();const c14=us.filter(u=>{const d=u.done&&u.done[band.id];return d&&d>addDays(t,-14)&&d<=t}).length;const rate=c14>0?c14/14:(+band.per||0)/7;const remain=us.length-bandDone(plan,band);if(remain<=0)return t;if(!rate)return null;return addDays(t,Math.ceil(remain/rate))}
function examWeek(plan){const g=pjGrid(plan.__pj);return g&&g.o2?g.o2:9999} // 프로젝트 종료(시험) 주의 서수 · 미정이면 없음
function subjOrderAll(plan){const base=settings.subjects.map(x=>x.n);const names=plan.__pj?plan.subjects.slice():base.slice();
 const extra=[...new Set(plan.bands.filter(b=>!b.del).map(b=>b.s))].filter(s=>!names.includes(s));
 const oi=s=>{const i=base.indexOf(s);return i<0?999:i};
 return[...names,...extra].sort((a,b)=>oi(a)-oi(b))} // §1(fb12) 과목 순서 = 설정(공용) 순서 — 보드·달성·부하 등 공통
/* §4(fb19) 옛 「밀림 양보 순서」(plan.yield)는 폐지 — 각 활동이 자기 남은 개수·기간으로만 계산돼 순서가 결과를 안 바꿨다.
   이 함수는 이제 「과목 순회 순서」일 뿐이다(이름은 호출부 호환으로 유지). */
function yieldOrder(plan){const base=plan.__pj?plan.subjects.slice():settings.subjects.map(x=>x.n);const extra=[...new Set(plan.bands.filter(b=>!b.del).map(b=>b.s))].filter(s=>!base.includes(s));return[...base,...extra]}
function extendBand(plan,band){const dl=wDirL(plan);const oldO2=bO2(plan,band);band.w2+=dl;band.u=Date.now();
 plan.bands.forEach(b=>{if(b!==band&&!b.del&&b.s===band.s&&bandPlaced(b)&&bO1(plan,b)>oldO2){b.w1+=dl;b.w2+=dl;b.u=Date.now();syncBaselineFor(plan,b)}});
 syncBaselineFor(plan,band)}
function extendBandById(id,n){let warn=false,nm='',perNote='';planMut(p=>{const b=p.bands.find(x=>x.id===id&&!x.del);if(!b)return;nm=b.name;for(let i=0;i<Math.max(1,n||1);i++)extendBand(p,b);
 const wk=bO2(p,b)-bO1(p,b)+1;if((b.units||[]).length&&wk>0){const np=Math.ceil(b.units.length/wk);if(np!==+(b.per||0)){b.per=np;perNote=' · 주당 '+np+'개로 다시 제안'}} // 재제안 자동 적용
 syncBaselineFor(p,b); // §3-3 완료 0 = 원계획 갱신 · 완료 있음 = 밀림
 warn=p.bands.some(x=>!x.del&&x.s===b.s&&bandPlaced(x)&&bO2(p,x)>examWeek(p))});render();toast(warn?`${nm} 늘림 — ⚠ 시험 주를 넘는 활동이 있어`:`${nm} +${Math.max(1,n||1)}주${perNote}`)}
function fixBaseline(dateStr){planMut(p=>{ // feedback8 §3-1 보강: 날짜 배치 재현에 필요한 units·dist·pins 스냅 포함
 const rem={};p.bands.filter(b=>!b.del).forEach(b=>{const us=bandUnits(p,b);if(us.length)rem[b.s]=(rem[b.s]||0)+us.length-bandDone(p,b)});

  bands:p.bands.filter(b=>!b.del).map(b=>({id:b.id,w1:b.w1,w2:b.w2,per:b.per||0,units:(b.units||[]).slice()})),
  dist:pj&&pj.dist?JSON.parse(JSON.stringify(pj.dist)):null,
  pins:pj&&pj.pins?JSON.parse(JSON.stringify(pj.pins)):{},

/* 날짜별 남은 단원: 실제선 = 완료 누적 · 기준선 = 마지막 baseline 의 w1/w2/per 로 계획대로 갔을 때 */
function remainingSeries(plan,subject,from,to){
 const bands=plan.bands.filter(b=>!b.del&&(b.units||[]).length&&(!subject||b.s===subject));
 const bl=(plan.baselines||[]).slice(-1)[0];
 const blMap=new Map((bl?bl.bands||[]:[]).map(x=>[x.id,x]));

 for(let d=from;d<=to;d=addDays(d,1)){
  let a=0,bse=0;
  bands.forEach(b=>{
   const us=bandUnits(plan,b);
   a+=us.filter(u=>{const x=u.done&&u.done[b.id];return!x||x>d}).length;
   const o=blMap.get(b.id);
   const vb=o?Object.assign({},b,{w1:o.w1,w2:o.w2,per:o.per!=null?o.per:b.per}):b;

}
/* §9(fb12) 재배치: 활동의 시작 주(w1)는 안 건드린다(언제 시작한 계획인지 기록). 재분배 = 남은 개수를
   오늘부터 남은 기간에 — rb 마커(기준일·그때 완료 수)로 「오늘 이전 몫 0」 을 내부 계산. 화면 W범위 무변.
   남은 기간에 안 들어가면(재계산 주당이 원래의 2배 초과 · 기간이 이미 끝남)만 기간 연장(주당 유지 · 뒤 활동 밀림 —
   §10: 뒤로 통째 밀린 완료 0 활동은 orig·원계획 동반 갱신 = 빗금 없음). 원인 활동의 원계획은 무변. */
function rebalanceCore(p,undo){
 const t=today();const oNow=pWeekNo(p,t);const dl=wDirL(p);const rows=[];
 const snap=b=>{if(undo&&!undo.some(x=>x.id===b.id))undo.push({id:b.id,w1:b.w1,w2:b.w2,per:b.per||0,orig:b.orig?{w1:b.orig.w1,w2:b.orig.w2}:null,rb:b.rb?{d:b.rb.d,base:b.rb.base}:null})};
 yieldOrder(p).forEach(s=>{p.bands.filter(b=>!b.del&&b.s===s&&bandPlaced(b)&&(b.units||[]).length&&(+b.per||0)>0).sort((a,b)=>bO1(p,a)-bO1(p,b)).forEach(b=>{
  const L=late(p,b,addDays(t,-1));if(!L)return;
  const done=bandDone(p,b);const remain=bandUnits(p,b).length-done;if(!remain)return;
  const oldO2=bO2(p,b);const R=oldO2-oNow+1;
  const perOld=+b.per||0;const from=`~W${pad(b.w2)} · 주당 ${perOld}`;
  const perNew=R>=1?Math.ceil(remain/R):Infinity;
  if(R>=1&&perNew<=perOld*2){
   snap(b);b.per=perNew;b.rb={d:t,base:done};b.u=Date.now();
   rows.push({s,name:b.name,late:L,from,to:`~W${pad(b.w2)} · 주당 ${perNew} (오늘부터)`,mode:'재분배',over:false});
  }else{
   /* §4(fb19)·§0-4 — ② 끝날짜 연기는 마감 주까지만. 넘겨 늘리지 않는다.
      마감 안에 못 넣으면 ③ 「N회독 불가」로 멈추고 사람에게 묻는다(적용 금지 · 활동을 임의로 빼지 않는다). */
   const cap=examWeek(p); // 기간 미정이면 9999
   const needW=Math.ceil(remain/perOld);let newO2=oNow+needW-1;
   if(newO2>cap){
    const roomW=Math.max(0,cap-oNow+1);const fit=roomW*perOld;

     need:remain,fit,bandId:b.id,over:true});

   }

   snap(b);b.w2=pLab(p,newO2);b.rb={d:t,base:done};b.u=Date.now();
   if(shift>0)p.bands.forEach(x=>{if(x!==b&&!x.del&&x.s===b.s&&bandPlaced(x)&&bO1(p,x)>oldO2&&bO2(p,x)+shift<=cap){snap(x);x.w1+=dl*shift;x.w2+=dl*shift;x.u=Date.now();syncBaselineFor(p,x)}}); // 뒤 활동도 마감을 넘기지 않는다
   rows.push({s,name:b.name,late:L,from,to:`~W${pad(b.w2)} · 주당 ${perOld} (오늘부터)`,mode:'연장',over:false});
  }
 })});

}

},true);render();toast(n?'재배치를 적용했어 — 활동 '+n+'개 (되돌리기 1회 가능)':'밀린 활동이 없어')}

 <p style="font-size:10px;color:#888;margin-top:8px">규칙: <b>시작 주는 안 건드리고</b>, 남은 세부계획을 <b>오늘부터 남은 기간에 재분배</b>(주당 재계산 · 요일 가중치 유지). 안 들어가면 <b>마감 주까지만</b> 연장하고, 그래도 모자라면 위처럼 멈춘다.<br><b>${bad.length?'「저장」은 막혀 있어 — 위에서 먼저 정해줘':'「저장」 = 이대로 적용'}</b>${bad.length?'':'(적용 뒤 「↩ 재배치 되돌리기」 1회 가능)'}. 취소하면 바뀌지 않아.</p>`,

/* §11(fb11) 이어서/이월 배지 — 오늘 칸과 Study Time 이 같은 함수를 쓴다 (§2 fb16: 배지 일치) */
/* §7(fb17) 이월 배지 = 숫자만(일수) · 「이어서」 표시는 뺀다(unitSessMap 계산·데이터는 그대로 · 툴팁에만 남김).
   산식 = 「원래 배정일 → 오늘」 일수 — 주월계획 유래 = 📌 날짜 or 자동 배분 원래 날짜(e.orig) · 손 할일 = carry(하루씩 이월이라 일수와 같음). */
function dayDiff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
/* §4 이월 배지 색 — `+N`(밀림)만 빨강, 「→ 오늘」은 파랑.

     fb16 「오늘 칸과 Study Time 배지 일치」 — 한 곳만 고치지 마라. */
const carryCls=txt=>'carry'+(/^\+/.test(String(txt||''))?' late2':'');
function carryText(e){ // 화면·스냅샷이 같이 쓰는 배지 글자
 if(e.dim)return'→ 오늘';
 if(e.late){const n=e.orig?dayDiff(e.orig,today()):0;return '+'+(n>0?n:0)}
 return'';
}
function carryBadge(e,sm){
 const b=e.b||e.band,u=e.u||e.unit;if(!b||!u)return''; // 오늘 칸 행({b,u})·Study Time 행({band,unit}) 두 모양 다 받음
 const txt=carryText(e);if(!txt)return'';
 const si=sm&&sm.get?sm.get(b.id+'|'+u.id):null;
 const acc=si?' · 지금까지 '+dur(si.min)+'('+si.first.slice(5).replace('-','/')+'부터)':'';
 if(e.dim)return'<span class="'+carryCls(txt)+'" title="이 날 몫인데 아직 안 끝났어 — 오늘 칸으로 넘어가'+acc+'">'+txt+'</span>';
 const n=e.orig?dayDiff(e.orig,today()):0;
 return'<span class="'+carryCls(txt)+'" title="원래 '+(e.orig?e.orig.slice(5).replace('-','/'):'?')+' 몫 — '+n+'일 밀렸다'+acc+'">'+txt+'</span>';
}
function planColHTML(d,idx){
 const plan=myPlan();if(!(plan.bands||[]).some(b=>!b.del))return'';
 const past=d<today();
 const sm=unitSessMap(cfg.person); // §11 이어서/이월
 const rows=dayPlanRows(plan,d).map(e=>{
  const b=e.b,u=e.u;const done=!!e.done;

 });

 if(rows.length>CAP&&!ui.dayAutoAll)return`<ul>${rows.slice(0,CAP).join('')}<li style="color:#888;cursor:pointer" onclick="ui.dayAutoAll=1;LS.set('tt.ui',ui);render()">… +${rows.length-CAP} 더 보기</li></ul>`; // 밀림 폭주 대비 ⚠
 if(rows.length>CAP)return`<ul>${rows.join('')}<li style="color:#888;cursor:pointer" onclick="ui.dayAutoAll=0;LS.set('tt.ui',ui);render()">접기 ▴</li></ul>`;
 return rows.length?`<ul>${rows.join('')}</ul>`:'';
}
function togglePlanDone(bandId,unitId,d){planMut(p=>{const b=p.bands.find(x=>x.id===bandId);if(!b)return;const u=((p.units||{})[b.s]||[]).find(x=>x.id===unitId&&!x.del);if(!u)return;u.done=u.done||{};if(u.done[bandId]===d)delete u.done[bandId];else u.done[bandId]=d;u.u=Date.now();});render();}
function selUnit(bandId,encU){const id=bandId+'|'+decodeURIComponent(encU); // §6 세부계획을 타이머 선택 줄로 직결
 stSel=(stSel&&stSel.type==='unit'&&stSel.id===id)?null:{type:'unit',id};LS.set('tt.sel',stSel);render();}
/* ===== 세부계획 캘린더 엔진 (feedback8 §2) =====
   배치는 저장하지 않고 즉석 계산 — 저장은 세부계획 done 과 프로젝트 pins(고정)뿐. */
function pjPins(plan,bandId){const pj=plan.__pj;if(!pj)return{};return(pj.pins||{})[bandId]||{}}
function prunePins(p){ // 활동 기간 밖·활동에서 빠진 세부계획의 고정 해제 (§2-4) — 해제 수 반환
 const pj=p.__pj;if(!pj||!pj.pins)return 0;let n=0;
 Object.keys(pj.pins).forEach(bid=>{const b=p.bands.find(x=>x.id===bid&&!x.del);const g=pj.pins[bid]||{};
  if(!b||!bandPlaced(b)){n+=Object.keys(g).length;delete pj.pins[bid];return}
  const d1=pWeekDate(p,bO1(p,b)),d2=pWeekDate(p,bO2(p,b),6);
  const t0=today();
  Object.keys(g).forEach(uid2=>{const d=g[uid2];
   if(!(b.units||[]).includes(uid2)){delete g[uid2];n++;return} // 활동에서 빠진 세부계획 = 해제(데이터 정합)
   if(d<t0)return; // §3·§0-3(fb17) 지난 날짜 손 지정은 자동 규칙이 안 지운다(사람이 그 날 한 것)
   if(d<d1||d>d2){delete g[uid2];n++}});
  if(!Object.keys(g).length)delete pj.pins[bid];});
 return n;}
function pinUnit(bandId,unitId,date){planMut(p=>{const pj=p.__pj;if(!pj)return;pj.pins=pj.pins||{};pj.pins[bandId]=pj.pins[bandId]||{};pj.pins[bandId][unitId]=date;},true);render()}
function unpinUnit(bandId,encU){planMut(p=>{const pj=p.__pj;const g=pj&&pj.pins&&pj.pins[bandId];const u2=decodeURIComponent(encU);if(g&&g[u2])delete g[u2];},true);toast('고정 해제 — 자동 배치로 돌아감');render()}
function bandPlanDatesW(plan,band,weights){ // 완료·고정 무시한 순수 계획 날짜: 세부계획 id → 날짜 (스냅샷 활동 객체도 받음)
 const ids=(band.units||[]).slice();const out=new Map();const per=+band.per||0;
 if(!ids.length||!per||!bandPlaced(band))return out;
 const q=weekQuotasW(weights,per);
 const o1=bO1(plan,band);
 let i=0;
 for(let o=o1;i<ids.length&&o<=o1+520;o++){ // 몫이 남으면 기간을 넘어 계속 뒤로 (§2-5)
  for(let dow=0;dow<7&&i<ids.length;dow++){let c=q[dow];while(c-->0&&i<ids.length){out.set(ids[i],pWeekDate(plan,o,dow));i++;}}
 }
 return out;}
function bandPlanDates(plan,band){return bandPlanDatesW(plan,band,distWeights(plan,band.s))}
function bandChips(plan,band){ // 이 활동의 칩(세부계획×날짜): 완료 = 완료한 날 · 고정 = 그 날 · 나머지 = 자동 배정(과거 몫 = 오늘로 밀림·빨강)
 if(!bandPlaced(band))return[]; // 미배치 = 캘린더·일간 계산 제외 (§3-4)
 const us=bandUnits(plan,band);if(!us.length)return[];
 const t=today();const per=+band.per||0;
 const pins=pjPins(plan,band.id);
 const chips=[];const rest=[];let doneCnt=0;
 us.forEach(u=>{const dd=u.done&&u.done[band.id];
  if(dd){chips.push({b:band,u,d:dd,done:1});doneCnt++;return}
  const pd=pins[u.id];
  if(pd){chips.push({b:band,u,d:pd,pin:1,orig:pd});return} // §3(fb17) 손 지정 📌 = 과거 날짜여도 그 날에 그린다(late 아님 · §0-3 손 지정 우선)
  rest.push(u)});
 if(!per||!rest.length)return chips;
 const naive=bandPlanDates(plan,band);
 const q=weekQuotas(plan,band);
 const pinLoad={};chips.forEach(c=>{if(c.pin)pinLoad[c.d]=(pinLoad[c.d]||0)+1});
 const o1=bO1(plan,band);
 const rb=band.rb&&band.rb.d?band.rb:null; // §9(fb12): 재배치 기준일 전 몫은 소멸 · 완료도 base 만큼 흡수
 let ri=0,pastCap=0,blDone=false;
 for(let o=o1;o<=o1+520&&ri<rest.length;o++){
  for(let dow=0;dow<7&&ri<rest.length;dow++){
   const d=pWeekDate(plan,o,dow);
   let c=Math.max(0,q[dow]-(pinLoad[d]||0));
   if(rb&&d<rb.d)continue; // 재배치 전 날짜 = 몫 없음
   if(d<t){pastCap+=c;continue} // 지나간 몫 — 오늘부터 소화
   if(!blDone){blDone=true;let bl=Math.max(0,pastCap-Math.max(0,doneCnt-(rb?(+rb.base||0):0))); // 밀림 = 지나간 몫 − (기준일 이후) 완료
    while(bl-->0&&ri<rest.length){const u2=rest[ri++];chips.push({b:band,u:u2,d:t,late:1,orig:naive.get(u2.id)||null});}}
   while(c-->0&&ri<rest.length){const u=rest[ri++];const nd=naive.get(u.id);chips.push({b:band,u,d,moved:nd&&nd!==d?1:0,orig:nd||d});}
  }
 }
 while(ri<rest.length){const u3=rest[ri++];chips.push({b:band,u:u3,d:today(),late:1,orig:naive.get(u3.id)||null});} // 안전망
 return chips;}
/* ----- 원계획(기준선) 날짜 배치 (feedback8 §3) ----- */
function lastBaseline(plan){const bl=plan.baselines||[];return bl.length?bl[bl.length-1]:null}
function baselineDates(plan){ // 마지막 원계획의 날짜별 예정: {날짜:[{bandId,s,uid,n}]} · 스냅에 units 없으면(구판) 그 활동은 생략
 const bl=lastBaseline(plan);if(!bl)return null;
 const map={};
 (bl.bands||[]).forEach(sb=>{
  if(!(sb.units||[]).length)return;
  const live=plan.bands.find(b=>b.id===sb.id);if(!live)return;
  const um=unitMap(plan,live.s);
  const dm=bandPlanDatesW(plan,{w1:sb.w1,w2:sb.w2,per:sb.per,units:sb.units},distWeightsOf(bl.dist,live.s));
  dm.forEach((d,uid2)=>{const u=um.get(uid2);(map[d]=map[d]||[]).push({bandId:sb.id,s:live.s,uid:uid2,n:u?u.n:''})});
 });
 return map;}
function calData(plan,d1,d2){ // 캘린더 한 판 데이터: 칩·유령칸(원계획 자리)·날짜별 원계획 예정 수
 const chips={},act={};
 const ord=subjOrderAll(plan);const oi=s=>{const i=ord.indexOf(s);return i<0?999:i};
 plan.bands.filter(b=>!b.del).forEach(b=>{bandChips(plan,b).forEach(c=>{act[b.id+'|'+c.u.id]=c.d;if(c.d>=d1&&c.d<=d2)(chips[c.d]=chips[c.d]||[]).push(c)})});
 Object.values(chips).forEach(a=>a.sort((x,y)=>oi(x.b.s)-oi(y.b.s)||(x.b.id<y.b.id?-1:x.b.id>y.b.id?1:0)));
 const bd=baselineDates(plan)||{};
 const ghosts={},planned={};
 Object.keys(bd).forEach(d=>{planned[d]=bd[d].length;
  if(d<d1||d>d2)return;
  bd[d].forEach(g=>{if(act[g.bandId+'|'+g.uid]!==d)(ghosts[d]=ghosts[d]||[]).push(g)});});
 return{chips,ghosts,planned,hasBl:!!lastBaseline(plan)};}
function rebaseAsk(direct){ // §3-2 ⟳ 버튼(direct) · §3-3 큰 변경 뒤 1회 질문

function calToggle(bandId,encU,d){const uid2=decodeURIComponent(encU); // 체크 = 완료 — 팝업 A·보드 칸 ☐ 와 같은 데이터

  <span style="margin-left:auto;display:flex;gap:4px;flex:none"><button class="btn" onclick="calZoom('week')" title="크게 보기 — 칩 전부·체크·끌기 동일">⤢ 확대</button><button class="btn" onclick="rebalancePreview()" title="밀린 것 재배치 — 오늘부터 다시 나눔 (§8 fb19: 수습은 그 주를 보는 화면에)">밀린 것 재배치</button>${myPlan().rbUndo?`<button class="btn" onclick="rebalanceUndo()" title="마지막 재배치 1회 되돌리기">↩ 되돌리기</button>`:''}<button class="btn" onclick="blHistory()">이력</button><button class="btn" onclick="rebaseAsk(true)">⟳ 원계획 다시 세우기</button></span></div>`;}
