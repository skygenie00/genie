/* §3-4 미배치 배치 (트레이 → 칸 드랍 · 시작 주 = 놓은 주 · 기간 1주) */
function placeBandAt(id,o){planMut(p=>{const b=p.bands.find(x=>x.id===id&&!x.del);if(!b)return;
 const L=pLab(p,Math.max(1,o));b.w1=L;b.w2=L;b.u=Date.now();syncBaselineFor(p,b)});
 render();toast('배치했어 — ⋮ 로 기간 조정')}
function planBoardHTML(plan,activeOnly,ro){
 const t=today();const curO=pWeekNo(plan,t);const g=pjGrid(plan.__pj);const yd=addDays(t,-1);
 const oL=1;let oR=g&&g.o2?g.o2:Math.max(curO+8,8); // 확정 = W1(시험 주)까지 전부 · 미정 = 현재+8주 (⚠)
 plan.bands.forEach(b=>{if(!b.del&&bandPlaced(b)&&bO2(plan,b)>oR)oR=bO2(plan,b)});
 const NW=oR-oL+1;
 const fmtRange=o=>{const a=pWeekDate(plan,o),b=pWeekDate(plan,o,6);const am=+a.slice(5,7),ad=+a.slice(8),bm=+b.slice(5,7),bd=+b.slice(8);return am===bm?`${am}/${ad}-${bd}`:`${am}/${ad}-${bm}/${bd}`};
 let h='';
 const unpl=plan.bands.filter(b=>!b.del&&!bandPlaced(b)); // 미배치 트레이 (§3-4 · ⚠ 보드 위 한 줄)
 if(unpl.length||selMode)h+=`<div class="tray">${unpl.length?`<span style="font-size:10.5px;color:#888;flex:none">미배치 ${unpl.length}</span>`:''}${unpl.map(b=>`<span class="trayb" data-band="${b.id}" style="border-color:${subjColor(b.s)}" onclick="if(!window.__bandDragged)editBand('${b.id}')" title="${esc(b.s)} ${esc(b.name)} — 끌어서 보드 칸에 놓으면 배치(1주) · 클릭 = 편집">${selMode?`<i class="bsel" onclick="event.stopPropagation();bandSelTgl('${b.id}')">${selSet.has(b.id)?'☑':'☐'}</i>`:''}${esc(b.s)} ${esc(b.name)}</span>`).join('')}${unpl.length?`<span style="font-size:9.5px;color:#aaa">밀림·부하·일간 계산 제외 · 끌어서 배치</span>`:''}</div>`;
 h+=`<div class="pbwrap" id="pbwrap"><div class="pb pb2" style="grid-template-columns:150px repeat(${NW},${PB_COL}px)">`;
 h+=`<div class="pbh pbfix" style="z-index:4"></div>`;
 const oEnd=(g&&g.o2)?g.o2:0; // §3(fb19) 마감 주 = 프로젝트 종료가 든 주 · 그 뒤는 경고 구간
 for(let o=oL;o<=oR;o++)h+=`<div class="pbh ${o===curO?'cur':''} ${oEnd&&o===oEnd?'due':''} ${oEnd&&o>oEnd?'over':''}" data-ord="${o}">${fmtW(plan,o)} <small>${fmtRange(o)}${o===curO?' · 현재':''}${oEnd&&o===oEnd?' · 🏁 마감':''}${oEnd&&o>oEnd?' · 마감 뒤':''}</small></div>`;
 /* 부하 줄 (§5): 주차별 과목 스택 바 + 시간 라벨 · 평균 1.5배 초과 = ⚠ */
 const loads=weekLoads(plan,oL,oR);
 const loadVals=Object.values(loads).map(x=>x.tot).filter(x=>x>0);
 const loadAvg=loadVals.length?loadVals.reduce((a,b)=>a+b,0)/loadVals.length:0;
 const ordSubs=subjOrderAll(plan);
 h+=`<div class="pbl pbload pbfix" style="z-index:3">부하 <small>시간/주</small></div>`;
 for(let o=oL;o<=oR;o++){const e=loads[o];const warn=e&&loadAvg&&e.tot>loadAvg*1.5;
  h+=`<div class="pbloadc ${o===curO?'cur':''}" data-ord="${o}" title="${e?ordSubs.filter(s=>e.subj[s]).map(s=>`${s} ${(e.subj[s]/60).toFixed(1)}h`).join(' · '):''}">${e?`<div class="lh ${warn?'w':''}">${warn?'⚠ ':''}${Math.round(e.tot/60)}h</div><div class="lbar">${ordSubs.filter(s=>e.subj[s]).map(s=>`<i style="width:${(e.subj[s]/e.tot*100).toFixed(1)}%;background:${subjColor(s)}"></i>`).join('')}</div>`:''}</div>`;}
 const fold=ui.pbFold||{};
 subjOrderAll(plan).forEach(s=>{
  let bandsS=plan.bands.filter(b=>!b.del&&b.s===s&&bandPlaced(b));
  if(activeOnly)bandsS=bandsS.filter(b=>curO>=bO1(plan,b)&&curO<=bO2(plan,b));
  const goals=(plan.catGoal||{})[s]||{};
  const cats=((plan.cats||{})[s]||[]).slice(); // 줄 = 프로젝트.cats[과목] 순서 (§1-5)
  const extraTags=[...new Set(bandsS.map(b=>b.tag||'').filter(tg=>!cats.includes(tg)))]; // 목록 밖 tag = 「기타」 안전망
  const rows=[...cats.map(tg=>({tag:tg,extra:false})),...(extraTags.length?[{tag:null,extra:true}]:[])];
  const isF=!!fold[s];const encS=encodeURIComponent(s);
  h+=`<div class="pbsj" onclick="pbFold('${encS}')"><span class="pbsjin"><span class="tri">${isF?'▶':'▼'}</span><i class="plandot" style="background:${subjColor(s)}"></i>${esc(s)}<span class="n2">활동 ${bandsS.length}</span></span></div>`;
  if(isF)return;
  rows.forEach(row=>{ // 분류 0 이면 줄 없음(4-4) — + 활동 입구 = 분류 행 빈 칸 클릭으로 일원화
   const encT=row.extra?'':encodeURIComponent(row.tag);
   const tb=(row.extra?bandsS.filter(b=>!cats.includes(b.tag||'')):bandsS.filter(b=>(b.tag||'')===row.tag)).sort((a,b)=>bO1(plan,a)-bO1(plan,b)||bO2(plan,a)-bO2(plan,b));
   const layers=[];tb.forEach(b=>{const li=layers.findIndex(Lr=>bO2(plan,Lr[Lr.length-1])<bO1(plan,b));if(li<0)layers.push([b]);else layers[li].push(b);});
   if(!layers.length)layers.push([]);
   layers.forEach((Lb,li)=>{
    const gl=row.extra?'':(goals[row.tag]||'');
    h+=`<div class="pbl pbcatl">${li===0?`<span ${ro?'':`class="pbcat" onclick="event.stopPropagation();catBandMenu('${encS}','${encT}')" title="클릭 = 이 분류의 활동 나열·삭제·분류 지정 (§1·§3 fb12)"`}>${esc(row.extra?'기타':(row.tag||'기타'))}</span>${row.extra||ro?'':`<span class="pbgoal ${gl?'':'empty'}" title="클릭해서 목표치 입력 (「5회독」 = 활동 자동 생성)" onclick="event.stopPropagation();editCatGoal('${encS}','${encT}')">${esc(gl)||'+'}</span>`}`:''}</div>`;
    let o=oL;
    Lb.forEach(b=>{
     const c1=Math.max(bO1(plan,b),oL),c2=Math.min(bO2(plan,b),oR);
     for(;o<c1;o++)h+=`<div class="pbc2 ${o===curO?'cur':''} ${oEnd&&o>oEnd?'over':''}" data-ord="${o}" ${ro||row.extra?'':`onclick="newBandAt('${encS}','${encT}',${o})" title="+ 활동 (${esc(s)} · ${fmtW(plan,o)})"`}></div>`;
     const L=late(plan,b,yd);const hasU=(b.units||[]).length>0;const per=+b.per||0;
     const cause=L>0||bandDone(plan,b)>0; // §10(fb12): 빗금 = 원인 활동(완료 ≥1 or 밀림)의 원계획 초과 꼬리에만
     let cells='';
     for(let x=c1;x<=c2;x++){const ext=cause&&b.orig&&x>pOrdL(plan,b.orig.w2);const wd=weekDoneCount(plan,b,x);
      cells+=`<div class="pbw2 ${x===curO?'cur':''} ${ext?'ext':''} ${oEnd&&x>oEnd?'over':''}" data-ord="${x}">${x===c1?`<b>${selMode?`<i class="bsel" onclick="event.stopPropagation();bandSelTgl('${b.id}')">${selSet.has(b.id)?'☑':'☐'}</i>`:''}${esc(b.name)} <small>W${pad(b.w1)}–W${pad(b.w2)}</small></b>`:''}<span class="dn"><i class="${hasU&&per&&wd>=per?'on':''}"></i>${hasU?`${wd}/${per||'—'}`:(per||'')}${x===curO&&L?`<b class="lt">밀림 ${L}</b>`:''}</span></div>`}
     h+=`<div class="pband2 ${oEnd&&c2>oEnd?'overb':''}" data-bmove="${ro?'':b.id}" style="grid-column:span ${c2-c1+1};--sc:${subjColor(b.s)}" onclick="bandPopup('${b.id}',(event.target.closest('[data-ord]')||{dataset:{}}).dataset.ord)" title="${esc(b.name)} W${pad(b.w1)}–W${pad(b.w2)} · 클릭 = 세부계획${ro?'':' · 끌기 = 시작 주 이동 · ⋮ 탭 = 편집 · ⋮ 끌기 = ±N주'}">${cells}${ro?'':`<span class="grip" data-band="${b.id}" onclick="event.stopPropagation()" title="오른쪽 = +N주 · 왼쪽 = −N주 · 탭 = 활동 편집">⋮</span>`}</div>`;
     o=c2+1;
    });
    for(;o<=oR;o++)h+=`<div class="pbc2 ${o===curO?'cur':''} ${oEnd&&o>oEnd?'over':''}" data-ord="${o}" ${ro||row.extra?'':`onclick="newBandAt('${encS}','${encT}',${o})" title="+ 활동 (${esc(s)} · ${fmtW(plan,o)})"`}></div>`;
   });
  });
 });
 h+='</div></div>';
 return h;
}
/* §1(fb11)+§11·§3(fb12) 분류 라벨 클릭 = 활동 나열·선택/전체 삭제 + 「분류 지정」(기타 → 분류 복구 입구).
   §11 수리: 이름 가로 한 줄(최소 폭) · 목록 내부 스크롤 · 버튼 하단 고정 · 모달이라 화면 안. */
function catBandMenu(sEnc,tEnc){
 const s=decodeURIComponent(sEnc),tag=decodeURIComponent(tEnc);
 const p=boardPlan();
 const bs=p.bands.filter(b=>!b.del&&b.s===s&&(b.tag||'')===tag);
 if(!bs.length){toast('이 분류에 활동이 없어');return}
 const cats=((p.cats||{})[s]||[]).filter(t2=>t2!==tag);
 const m=document.createElement('div');m.className='modal';m.id='cbmM';
 const row=b=>`<label class="cbml"><input type="checkbox" class="cbmCk" value="${b.id}"><i class="plandot" style="background:${subjColor(b.s)}"></i><span class="nm2">${esc(b.name)}</span><small>${bandPlaced(b)?`W${pad(b.w1)}–W${pad(b.w2)}`:'미배치'}${(b.units||[]).length?` · ${bandDone(p,b)}/${b.units.length}`:''}</small></label>`;
 m.innerHTML=`<div class="box" style="max-width:440px;min-width:300px;display:flex;flex-direction:column;max-height:80vh"><h4 style="flex:none">${esc(s)} › ${esc(tag||'기타')} <small style="color:#888;font-weight:400">활동 ${bs.length}</small></h4>
 <div style="flex:1;min-height:0;overflow:auto;border:1px solid #f0f0f0;border-radius:5px;padding:4px 6px">${bs.map(row).join('')}</div>
 ${cats.length?`<div class="row" style="flex:none;margin-top:6px"><label style="width:auto">분류 지정</label><select id="cbmTag" style="flex:1;min-width:0">${cats.map(t2=>`<option>${esc(t2)}</option>`).join('')}</select><button class="btn" onclick="cbmAssign()" title="체크한 활동을 고른 분류로 (기타 낙하 복구 입구 · §3)">지정</button></div>`:''}
 <div class="acts" style="flex:none"><button class="btn" onclick="document.getElementById('cbmM').remove()">닫기</button><button class="btn" onclick="cbmDel(false)">선택 삭제 (<span id="cbmN">0</span>)</button><button class="btn d" onclick="cbmDel(true)">전체 삭제</button></div></div>`;
 m.addEventListener('click',e=>{if(e.target===m)m.remove()});
 m.addEventListener('change',()=>{const el=m.querySelector('#cbmN');if(el)el.textContent=m.querySelectorAll('.cbmCk:checked').length});
 document.body.appendChild(m);
}
function cbmAssign(){
 const m=document.getElementById('cbmM');if(!m)return;
 const ids=[...m.querySelectorAll('.cbmCk:checked')].map(x=>x.value);
 const tag=(m.querySelector('#cbmTag')||{}).value||'';
 if(!ids.length){toast('활동을 체크해줘');return}
 if(!tag)return;
 planMut(p=>{p.bands.forEach(b=>{if(ids.includes(b.id)){b.tag=tag;b.u=Date.now()}})});
 m.remove();toast('분류 지정 — '+tag+' ('+ids.length+'개)');render();
}
function cbmDel(all){
 const m=document.getElementById('cbmM');if(!m)return;
 const ids=[...m.querySelectorAll(all?'.cbmCk':'.cbmCk:checked')].map(x=>x.value);
 if(!ids.length){toast('지울 활동을 체크해줘');return}
 if(!confirm(`활동 ${ids.length}개를 지울까? (소프트 삭제 — 병합 안전)`))return;
 planMut(p=>{p.bands.forEach(b=>{if(ids.includes(b.id)){b.del=true;b.u=Date.now()}})});
 m.remove();toast('삭제했어');render();
}
/* §1·§2(fb12) 포인터 드래그 정렬 — 손잡이 .dragh · 컨테이너 [data-ds] 로 커밋 분기 · [data-dax] = 축(y/x) · 아이패드 겸용 */
let dsSt=null;
document.addEventListener('pointerdown',e=>{
 const h=e.target.closest&&e.target.closest('.dragh');if(!h)return;
 const row=h.closest('[data-di]');if(!row)return;const list=row.closest('[data-ds]');if(!list)return;
 e.preventDefault();e.stopPropagation();
 dsSt={row,list};row.style.opacity=.35;
 try{h.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',e=>{if(!dsSt)return;
 const doc=dsSt.row.ownerDocument;const el=doc.elementFromPoint(e.clientX,e.clientY);
 const over=el&&el.closest&&el.closest('[data-di]');
 if(over&&over!==dsSt.row&&over.closest('[data-ds]')===dsSt.list){
  const r=over.getBoundingClientRect();
  const before=(dsSt.list.dataset.dax==='x')?(e.clientX<r.left+r.width/2):(e.clientY<r.top+r.height/2);
  over.parentElement.insertBefore(dsSt.row,before?over:over.nextSibling);
 }});
document.addEventListener('pointerup',()=>{if(!dsSt)return;const st=dsSt;dsSt=null;st.row.style.opacity='';
 const order=[...st.list.querySelectorAll('[data-di]')].map(x=>x.dataset.di);
 const k=st.list.dataset.ds;
 if(k==='subj')subjReorder(order);
 else if(k==='pjcat')pjCatReorder(st.list.dataset.s,order);
});
document.addEventListener('pointercancel',()=>{if(dsSt){dsSt.row.style.opacity='';dsSt=null}});
function subjPull(){document.querySelectorAll('#subjList input[data-i]').forEach(e=>{const it=settings.subjects[+e.dataset.i];if(it)it[e.dataset.k]=e.value.trim()||e.value})} // 저장 전 입력값 보존
function subjReorder(order){subjPull();settings.subjects=order.map(i=>settings.subjects[+i]).filter(Boolean);saveSettings();toast('과목 순서 저장 — 앱 전체 반영');render()}
function pjCatReorder(encS,order){const s=decodeURIComponent(encS);const old=(pjmSt.cats[s]||[]).slice();pjmSt.cats[s]=order.map(i=>old[+i]).filter(x=>x!=null);pjFill()}
/* §2-2 다중선택 삭제 */
let selMode=false,selSet=new Set();
function bandSelMode(on){selMode=!!on;selSet=new Set();render()}
function bandSelTgl(id){if(selSet.has(id))selSet.delete(id);else selSet.add(id);render()}
function bandSelAll(){const p=boardPlan();selSet=new Set(p.bands.filter(b=>!b.del).map(b=>b.id));render()}
function bandSelDel(){if(!selSet.size){toast('지울 활동을 체크해줘');return}
 if(!confirm(`선택한 활동 ${selSet.size}개를 지울까? (소프트 삭제 — 병합 안전)`))return;
 planMut(p=>{p.bands.forEach(b=>{if(selSet.has(b.id)){b.del=true;b.u=Date.now()}})});
 bandSelMode(false);toast('삭제했어')}
function newBandAt(sEnc,tEnc,o){const p=boardPlan();const L=pLab(p,o);bandModal({id:'',s:decodeURIComponent(sEnc),name:'',tag:decodeURIComponent(tEnc),w1:L,w2:L,per:0,units:[],note:''})}
function pbFold(sEnc){const s=decodeURIComponent(sEnc);ui.pbFold=ui.pbFold||{};ui.pbFold[s]=!ui.pbFold[s];LS.set('tt.ui',ui);planScrollPending=false;render();}
function editCatGoal(sEnc,tEnc){const s=decodeURIComponent(sEnc),tag=decodeURIComponent(tEnc);
 const cur=(((myPlan().catGoal||{})[s])||{})[tag]||'';
 const v=prompt(`${s} › ${tag||'기타'} 목표치 (예: 5회독 · 6회 — 숫자가 있으면 활동 자동 생성을 물어봄)`,cur);
 if(v===null)return;
 planMut(p=>{p.catGoal=p.catGoal||{};p.catGoal[s]=p.catGoal[s]||{};const vv=v.trim();if(vv)p.catGoal[s][tag]=vv;else delete p.catGoal[s][tag];},true);
 /* §4 (a안): 목표치 선행 숫자 N → 「분류명+i+단위」 활동 N개를 미배치로 자동 생성 (중복 이름은 건너뜀 · 단위 못 읽으면 「회독」 ⚠) */
 const mm=/^(\d+)\s*(회독|회)?/.exec(v.trim());
 if(mm&&tag){const N=Math.min(20,+mm[1]);const unit=mm[2]||'회독';
  const p0=myPlan();const have=new Set(p0.bands.filter(b=>!b.del&&b.s===s).map(b=>b.name));
  const names=[];for(let i=1;i<=N;i++){const nm=tag+i+unit;if(!have.has(nm))names.push(nm)}
  if(names.length&&confirm(`「${v.trim()}」 — 활동 ${names.length}개(${names[0]}${names.length>1?' … '+names[names.length-1]:''})를 미배치로 자동 생성할까?`)){
   planMut(p=>{names.forEach(nm=>{p.bands.push({id:uid(),s,tag,name:nm,w1:null,w2:null,per:0,units:[],note:'',u:Date.now(),del:false})})});
   toast('활동 '+names.length+'개 생성 — 미배치 트레이에서 끌어 배치');
  }}
 render();
}
/* 리스트 탭 (feedback10 §2-3): 정렬 · 인라인 수정 · ✕ 삭제 · 맨 아래 새 활동 입력 */
function lsSortSet(k){const cur=ui.lsSort||{};ui.lsSort={k,dir:cur.k===k?-(cur.dir||1):1};LS.set('tt.ui',ui);render()}
function lsInline(ev,id,k){ev.stopPropagation();const td=ev.currentTarget;const p=myPlan();const b=p.bands.find(x=>x.id===id&&!x.del);if(!b)return;
 if(td.querySelector('input,select'))return;
 if(k==='name')td.innerHTML=`<input value="${esc(b.name)}" style="width:120px" onclick="event.stopPropagation()" onkeydown="if(event.key=='Enter')this.blur()" onblur="lsSet('${id}','name',this.value)">`;
 else if(k==='per')td.innerHTML=`<input type="number" value="${b.per||0}" style="width:54px" onclick="event.stopPropagation()" onkeydown="if(event.key=='Enter')this.blur()" onblur="lsSet('${id}','per',this.value)">`;
 else if(k==='tag'){const cs=((p.cats||{})[b.s]||[]).slice();if(b.tag&&!cs.includes(b.tag))cs.push(b.tag);
  td.innerHTML=`<select onchange="lsSet('${id}','tag',this.value)" onclick="event.stopPropagation()"><option value="">기타</option>${cs.map(c2=>`<option ${((b.tag||'')===c2)?'selected':''}>${esc(c2)}</option>`).join('')}</select>`;}
 else if(k==='w')td.innerHTML=`<input value="${bandPlaced(b)?b.w1+'~'+b.w2:''}" placeholder="예 26~24 · 빈칸 = 미배치" style="width:96px" onclick="event.stopPropagation()" onkeydown="if(event.key=='Enter')this.blur()" onblur="lsSet('${id}','w',this.value)">`;
 const inp=td.querySelector('input,select');if(inp){inp.focus();if(inp.select)inp.select()}
}
function lsParseW(p,v){const s2=String(v||'').trim();if(!s2)return{w1:null,w2:null};
 const mm=s2.match(/(\d+)\s*[~\-–]?\s*(\d+)?/);if(!mm)return null;
 let L1=+mm[1],L2=mm[2]?+mm[2]:L1;if(pOrdL(p,L1)>pOrdL(p,L2)){const t2=L1;L1=L2;L2=t2}return{w1:L1,w2:L2}}
function lsSet(id,k,v){planMut(p=>{const b=p.bands.find(x=>x.id===id&&!x.del);if(!b)return;
 if(k==='name'){const n=(v||'').trim();if(n)b.name=n}
 else if(k==='per')b.per=Math.max(0,+v||0);
 else if(k==='tag')b.tag=v;
 else if(k==='w'){const r=lsParseW(p,v);if(r){b.w1=r.w1;b.w2=r.w2}}

/* §6(fb16) 자동 id — 그 과목 마지막 항목의 꼬리 숫자 +1 (「1-06」→「1-07」 · 「07」→「08」 · 못 읽으면 「1-01」부터 · 중복이면 계속 증가) */
function nextUnitId(s){
 const us=((myPlan().units||{})[s]||[]).filter(u=>!u.del);
 const has=new Set(us.map(u=>u.id));
 const last=us.length?us[us.length-1].id:'';
 const m=/^(.*?)(\d+)(\D*)$/.exec(last||'');
 if(!m)return has.has('1-01')?'1-02':'1-01';
 let n=+m[2];const w=m[2].length;
 for(let i=0;i<999;i++){const cand=m[1]+String(++n).padStart(w,'0')+m[3];if(!has.has(cand))return cand}
 return last+'-2';
}

function unitParseLines(v){const out=[];const seen=new Set();
 String(v||'').split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean).forEach(L=>{const sp=L.indexOf(' ');
  const id=sp>0?L.slice(0,sp):L;const nm=sp>0?L.slice(sp+1).trim():'';

function unitDiff(s,v){
 const cur=((myPlan().units||{})[s]||[]).filter(u=>!u.del);
 const now=new Map(cur.map(u=>[u.id,u]));
 const next=unitParseLines(v);const nextIds=new Set(next.map(x=>x.id));
 const add=next.filter(x=>!now.has(x.id));
 const ren=next.filter(x=>now.has(x.id)&&(now.get(x.id).n||'')!==x.n);
 const del=cur.filter(u=>!nextIds.has(u.id));
 const bands=myPlan().bands.filter(b=>!b.del&&b.s===s);
 const risk=del.map(u=>({id:u.id,n:u.n,dn:Object.keys(u.done||{}).length,
  inB:bands.filter(b=>(b.units||[]).includes(u.id)).map(b=>b.name),
  pin:bands.some(b=>pjPins(myPlan(),b.id)[u.id])}));
 const order=next.map(x=>x.id).join(',')!==cur.map(u=>u.id).join(',');
 return{add,ren,del,risk,order,next};}

function parseRecLog(txt){

  for(const p of parts){const m=/^(\S+)\s+([OQX])(?:\s+(\d+)'(\d+)")?/.exec(p);if(!m)return false;
   n++;if(m[2]==='O')o++;else if(m[2]==='Q')q++;else x++;if(m[3])sec+=(+m[3])*60+(+m[4]);}
  if(n!==it.n)return false;
  it.o=o;it.q=q;it.x=x;if(sec)it.min=Math.round(sec/60);return true;

  let m=/^\[(.+?)\s*학습로그\]\s*(\d{4}-\d{2}-\d{2})/.exec(t);

  if(!cur){bad.push(t);continue}
  if(/^합계\s*[:：]/.test(t)){ // 물리 합계 줄의 분 — 상세 줄로 못 채운 항목에 문항수 비례 배분(끝수 보정)
   const mm=/(\d+)\s*분/.exec(t);
   if(mm&&cur.app==='물리535'){const un=cur.items.filter(x=>x.min==null);const S=un.reduce((a,b)=>a+b.n,0);
    const tot=Math.max(0,(+mm[1])-cur.items.reduce((a,b)=>a+(b.min||0),0)); // 상세 줄로 이미 채운 분은 빼고 배분
    if(S&&tot){let acc=0,prev=0;un.forEach(it=>{acc+=it.n;const c=Math.round(tot*acc/S);it.min=c-prev;prev=c;});}}
   continue}
  if(/^(메모|오래 걸림)/.test(t))continue;
  if(cur.app==='물리535'){
   m=/^-\s*(.+?)\s*:\s*(\d+)\s*문항\s*\(\s*정답률\s*(\d+)\s*%\s*·\s*헷갈림\s*(\d+)\s*\)/.exec(t);
   if(m){const n=+m[2],o=Math.round(n*(+m[3])/100),q=+m[4];
    const it={unit:m[1],n,o,q,x:Math.max(0,n-o-q),min:null};cur.items.push(it);

  }else{
   m=/^-\s*(.*?)\s*:\s*(\d+)\s*문항\s*,\s*정답\s*(\d+)\s*·\s*오답\s*(\d+)\s*·\s*헷갈림\s*(\d+)/.exec(t);
   if(m){
    cur.items.push({unit:oxUnitLabel(m[1]),n:+m[2],o:+m[3],x:+m[4],q:+m[5]});continue}
  }

 }

   두 벌로 두면 같은 회독이 서로 다른 행으로 앉는다. 여기 한 곳만 고친다.

/* ===== fb13 §4·§5 — Archive(Food diary)·Share : 공용 데이터(사람 구분 없음) · 이미지 = studyplandata 저장 ===== */
const IMG_CACHE=new Map(); // path → dataURL (세션 메모리 캐시 · ⚠ 비공개 저장소라 토큰 fetch → dataURL)
async function ghImg(path){
 if(IMG_CACHE.has(path))return IMG_CACHE.get(path);
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURI(path)}?ref=${BRANCH}`,{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}});
 if(!r.ok)throw new Error('img '+r.status);
 const j=await r.json();const u='data:image/jpeg;base64,'+(j.content||'').replace(/\n/g,'');
 IMG_CACHE.set(path,u);return u;
}
function fillImgs(scope){[...(scope||document).querySelectorAll('img[data-img]')].forEach(async el=>{const p=el.dataset.img;el.removeAttribute('data-img');try{el.src=await ghImg(p)}catch(e){el.alt='×';el.style.background='#f4f4f4'}})}
async function ghPutRaw(path,b64,msg){ // 바이너리 push (이미지) — 있으면 덮어씀
 let sha=null;
 try{const r0=await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURI(path)}?ref=${BRANCH}`,{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}});if(r0.ok)sha=(await r0.json()).sha}catch(e){}
 const body={message:msg||`${cfg.person} · ${path}`,content:b64,branch:BRANCH};if(sha)body.sha=sha;
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURI(path)}`,{method:'PUT',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error(`PUT ${path} ${r.status}`);
}
function imgCompress(file,long,q){ // §4 클라이언트 압축 파이프라인(canvas 재인코딩) — 업로드·이관과 같은 규격
 return new Promise((ok,no)=>{const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
   im.onload=()=>{try{
    let w=im.naturalWidth,h=im.naturalHeight;const L=Math.max(w,h);
    if(L>long){w=Math.round(w*long/L);h=Math.round(h*long/L)}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    ok(c.toDataURL('image/jpeg',q).split(',')[1]);
   }catch(e){no(e)}};
   im.onerror=()=>no(new Error('이미지 해독 실패'));im.src=fr.result;};
  fr.onerror=()=>no(new Error('파일 읽기 실패'));fr.readAsDataURL(file);});
}

 <img data-img="${esc(x.img)}" style="width:100%;border-radius:6px;min-height:80px;background:#f6f6f6" alt=""></div>`;
 m.addEventListener('click',e=>{if(e.target===m)m.remove()});
 document.body.appendChild(m);fillImgs(m);
 try{document.getElementById('shDl').href=await ghImg(x.img)}catch(e){}
}
function shareCopy(id,btn){
 const x=shareFile().data.items.find(z=>z.id===id);if(!x)return;
 const done=()=>{if(btn)btn.textContent='복사됨';setTimeout(()=>{if(btn)btn.textContent='복사'},1200)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x.text||'').then(done,()=>toast('복사 실패'));
 else{const ta=document.createElement('textarea');ta.value=x.text||'';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('복사 실패')}ta.remove();}
}
function shareDel(id){const x=shareFile().data.items.find(z=>z.id===id&&!z.del);if(!x)return;

 <h4>과목·색 <small style="font-weight:400;color:#888">둘이 공용 (settings.json) · ⠿ 끌어서 순서 변경 = 앱 전체 과목 순서</small></h4><div class="sub" id="subjList" data-ds="subj" data-dax="y">${settings.subjects.map((x,i)=>`<div class="row" data-di="${i}"><span class="dragh" title="끌어서 순서 변경" onclick="event.stopPropagation()">⠿</span><input value="${esc(x.n)}" data-i="${i}" data-k="n"><input type="color" value="${x.c}" data-i="${i}" data-k="c"><button class="btn" onclick="settings.subjects.splice(${i},1);render()">×</button></div>`).join('')}<button class="btn" onclick="settings.subjects.push({n:'새 과목',c:'#999999'});render()">+ 과목</button></div>

function applySettings(){
 document.querySelectorAll('#examList input[data-xi]').forEach(e=>{const x=settings.exams.find(z=>z.id===e.dataset.xi);if(x&&x[e.dataset.xk]!==e.value){x[e.dataset.xk]=e.value;x.u=Date.now()}});
 settings.redHours=+$('rH').value||10;settings.skyHours=+$('sH').value||6; // §1(fb18) 하루 시작 입구 = 리본 팝업(값은 settings.dayStart 그대로)
 settings.monthColors=[...Array(12)].map((_,i)=>($('mc'+i)&&$('mc'+i).value)||DEF_SETTINGS.monthColors[i]);
 if($('snapM'))settings.snapMode=Object.assign({},settings.snapMode,{[cfg.person]:$('snapM').value});
 document.querySelectorAll('#subjList input[data-i]').forEach(e=>{settings.subjects[+e.dataset.i][e.dataset.k]=e.value.trim()||e.value});
 saveSettings();toast('저장');render();
}

let pipWin=null;
/* §1(fb16) PiP = f684591(tt-v18) 원상 복구 — 본창 시트(sheetHTML)+바(mbarHTML) 재사용이 정답.
   fb11~fb13 이 넣은 pipMiniHTML·pipListHTML·pipTap·전용 CSS 는 전부 삭제(원본을 안 보고 쓴 묘사였음). */
/* §7(fb18) PiP 화면 전환 = §0-2 의 명시적 예외 — 창이 좁아 세 절을 동시에 못 그리는 구조 제약.
   그리는 내용은 본창 renderer(sheetHTML·weekCardHTML·monthCardHTML) 그대로 · 예외는 내비 방식 하나뿐 · 본창에는 이 버튼을 안 단다(A안). */
function pipView(v){ui.pipView=v;LS.set('tt.ui',ui);pipPaint()}
function pipPaint(){
 if(!pipWin||pipWin.closed){pipWin=null;return;}
 if(pipWin.document.querySelector('.modal'))return; // 계획관리 팝업 등이 열려 있으면 통째 재그리기 보류 (§9)
 applyMonthColor(pipWin.document);
 const v=ui.pipView||'day';
 const body=v==='week'?weekCardHTML(weekStart(ttWkD()))
  :v==='month'?monthCardHTML(ttMoM())
  :sheetHTML(cfg.person,curDate(),sessionsOf(cfg.person,curDate()));
 pipWin.document.body.innerHTML=`<div class="pipwrap">${body}${mbarHTML()}</div>`;
 const sh=pipWin.document.querySelector('.pipwrap .sheet');
 if(sh){const nav=pipWin.document.createElement('div');nav.className='pipanc';
  nav.innerHTML=[['day','일간'],['week','주간'],['month','월간']].map(([k,n])=>`<span class="${k===v?'on':''}" onclick="pipView('${k}')">${n}</span>`).join('');
  sh.appendChild(nav);}
 fitStMore(); // §7-3(fb17) PiP 도 같은 측정
}
async function pip(){
 if(!('documentPictureInPicture' in window)){toast('이 브라우저는 작은 창을 지원하지 않아 (크롬·엣지 PC 전용)');return;}
 if(pipWin&&!pipWin.closed){pipWin.focus();return;}
 try{const w=await documentPictureInPicture.requestWindow({width:520,height:640});pipWin=w;
  [...document.styleSheets].forEach(s=>{try{const st=w.document.createElement('style');st.textContent=[...s.cssRules].map(r=>r.cssText).join('\n');w.document.head.appendChild(st)}catch(e){}});
  const st=w.document.createElement('style');st.textContent='body{background:#fff;padding:6px;overflow:auto;height:100vh}.pipwrap{min-width:420px;display:flex;flex-direction:column;height:100%}.pipwrap .sheet{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;width:auto!important}.pipwrap .paper{flex:1;min-height:0}.pipwrap .tt .r{height:15px}.pipwrap .paper{grid-template-columns:5fr 6fr!important}.pipwrap .mbar .man{display:none}.pipwrap .st{max-height:none}'
 +'.pipwrap .pipanc{position:absolute;right:8px;top:6px;display:flex;gap:2px;z-index:6}.pipwrap .pipanc span{font-size:10px;padding:1px 6px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#666;cursor:pointer}.pipwrap .pipanc span.on{background:#222;color:#fff;border-color:#222}.pipwrap .ribbon{padding-right:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}';w.document.head.appendChild(st);
  ['startTimer','stopTimer','manualSave','editSession','render','curDate','setDate','addDays','today','toast','selRow','toggleTodo','pickTodoItem','selUnit','togglePlanDone','startLife','lifeModal','lifeSetType','lifeAddType','lifeDelType','lifePlanModal','lifePlanDel','pmPopup','pmFoldTgl','pmDelCat2','pmDelItem2','pmCatModal','pmAddItem','pmSelect','pmDateEdit','pmSetDate','editTodo','catsOf','cfg','pmBandTgl','pmDelBand','pmGoBand','pickRow','stCatTgl','stMoreTgl','pipView','renderAll','ribbonModal','ribbonGo','startBlocked','ttWkPick','ttMoPick','ttWkToday','ttMoToday','settings'].forEach(n=>w[n]=window[n]);
  w.document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const ms=w.document.querySelectorAll('.modal');if(ms.length){ms[ms.length-1].remove();pipPaint()}}); // §1-2(fb19) PiP 에도 ESC
  w.addEventListener('pagehide',()=>{pipWin=null});
  pipPaint();
 }catch(e){toast('작은 창 실패: '+e.message)}
}
setInterval(()=>{if(run&&pipWin&&!pipWin.closed)pipPaint()},60000);

render();

</script>
