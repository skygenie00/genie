<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F57C00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>타임테이블</title>
<style>
:root{--ink:#222;--mute:#777;--line:#e2e2e2;--m8:#F57C00;--m8a:color-mix(in srgb,var(--m8) 55%,#fff);--m8b:color-mix(in srgb,var(--m8) 42%,#fff);--sky:#DCEBFA;--pink:#FBDDE2;--now:#e8f0fd;--blue:#2f6fe0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#ebebeb;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);font-size:12.5px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:150px 1fr;min-height:100vh;background:#fff}
/* sidebar */
.side{background:#f7f7f7;border-right:1px solid var(--line);padding:12px 10px;font-size:12.5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .who{font-weight:700;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;cursor:pointer}
.side .grp{font-size:10px;color:#999;margin:10px 0 3px;letter-spacing:.05em}
.side .i{padding:5px 8px;border-radius:5px;color:#444;cursor:pointer}
.side .i.on{background:#222;color:#fff}
.side .i.sub{padding-left:22px;font-size:11.5px;color:#666}
.side .i.sub.on{background:#ddd;color:#111}
.side .st{margin-top:30px;font-size:10px;color:#888;line-height:1.5}
.side .st.dirty{color:#c60}
.main{padding:14px 18px;overflow:hidden;min-width:0}
.ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.ttl b{font-size:18px}.ttl b span{font-weight:400;color:#888;font-size:14px}
.ttl .r{font-size:11px;color:#666;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #bbb;background:#fff;border-radius:4px;padding:4px 9px;font-size:11px}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.d{color:#c33;border-color:#e99}
.views{display:flex;gap:4px;font-size:11.5px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px;overflow-x:auto}
.views span{padding:3px 8px;border-radius:4px;color:#555;cursor:pointer;white-space:nowrap}
.views span.on{background:#eee;color:#111;font-weight:700}
.nav{display:flex;gap:6px;align-items:center}
.nav button{border:1px solid #ccc;background:#fff;border-radius:4px;padding:2px 8px}
/* day sheet */
.dpc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.sheet{background:var(--m8);padding:10px;border-radius:6px}
.ribbon{background:#fff;text-align:center;font-weight:700;font-size:16px;padding:5px;margin:0 60px 8px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.paper{background:#fff;border-radius:4px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:12px;background-image:linear-gradient(#f0f0f0 1px,transparent 1px),linear-gradient(90deg,#f0f0f0 1px,transparent 1px);background-size:10px 10px}
.hd{font-size:10px;color:#666;border-left:3px solid #666;padding-left:4px;margin-bottom:5px;font-weight:700}
.tt{display:grid;grid-template-columns:22px 1fr;row-gap:1px;font-size:9px;color:#555}
.tt .r{height:13px;position:relative;border-bottom:1px dotted var(--m8b);background-image:repeating-linear-gradient(90deg,transparent 0 calc(16.66% - 1px),var(--m8a) calc(16.66% - 1px) 16.66%)}
.tt .r b{position:absolute;top:1px;height:11px;display:block;border-radius:1px;cursor:pointer}
.tt .tth{position:relative;height:9px;font-size:7px;color:#999}
.tt .tth i{position:absolute;top:0;transform:translateX(-50%);font-style:normal}
.tt .r i.now{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--blue)}
.st{font-size:11px}
.st .it{display:flex;gap:6px;padding:4px 0;align-items:center;cursor:pointer;border-bottom:1px solid #f4f4f4}
.st .it:hover{background:color-mix(in srgb,var(--m8) 8%,#fff)}
.st .sw{width:9px;height:9px;flex:none}
.st .nm{width:28px;font-weight:700}
.st .pl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .mk{color:var(--blue);font-weight:700;width:12px}
.foot{border-top:1px solid #ddd;margin-top:8px;padding-top:6px;display:flex;justify-content:space-between;font-size:10px;color:#555;align-items:flex-end}
.foot .big{font-size:26px;font-weight:800;color:#222}
/* MiMi bar */
.mbar{margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11.5px;background:#fff}
.mbar .row1{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.mbar select,.mbar input{border:1px solid #ddd;border-radius:3px;padding:4px 6px;font-size:11.5px;min-width:0}
.mbar .subj{font-weight:700;width:76px}
.mbar .pl{flex:1 1 90px}.mbar .item{flex:2 1 120px}
.mbar .mk{display:flex;gap:8px;font-size:10px;color:#555}
.mbar .mk span{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mbar .mk i{width:14px;height:14px;border:1.5px solid #333;border-radius:50%;display:block;margin-bottom:2px}
.mbar .mk i.on{border-width:4px;border-color:var(--blue)}
.mbar .ss{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbar .ss button{text-align:center;border:1px solid #bbb;padding:9px;font-weight:800;font-size:15px;letter-spacing:.08em;border-radius:4px;background:#fff}
.mbar .ss button.dis{color:#bbb;border-color:#ddd;cursor:default}
.mbar .ss button.go{background:#222;color:#fff;border-color:#222}
.mbar .run{font-size:11px;color:var(--blue);font-weight:700;margin:-2px 0 6px}
.mbar .man{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:#666;flex-wrap:wrap}
.mbar .man input{width:64px}
/* three columns */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.col{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;min-height:300px}
.col.today{border-color:#222;background:#fcfcfc}
.col h5{font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
.col h5 small{color:#888;font-weight:400}
.col .sec{font-size:9.5px;color:#999;margin:8px 0 3px;letter-spacing:.05em}
.col ul{list-style:none}
.col li{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid #f0f0f0;align-items:center;line-height:1.25}
.col li.done{color:#aaa;text-decoration:line-through}
.col .cb{width:13px;height:13px;border:1.5px solid #666;border-radius:3px;flex:none;cursor:pointer;font-size:9px;line-height:11px;text-align:center}
.col .cb.on{background:#222;color:#fff;border-color:#222}
.col .m{margin-left:auto;font-size:9.5px;color:#888;white-space:nowrap}
.col .x{color:#bbb;cursor:pointer;padding:0 3px}
.col li.late{background:#fff8e6;margin:0 -4px;padding:5px 4px;border-radius:3px}
.col .iv{border:1px solid #333;border-radius:3px;font-size:10px;padding:3px 6px;text-align:center;margin-top:6px;font-weight:700;cursor:pointer;background:#fff}
.col .add{border:0;border-bottom:1px dashed #ddd;width:100%;padding:4px 0;font-size:11px;background:transparent;outline:0}
.peer{margin-top:8px;font-size:11px;color:#666}
/* week */
.wk{display:grid;grid-template-columns:28px repeat(7,1fr);font-size:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wk .h{background:#f7f7f7;text-align:center;padding:5px 2px;border-bottom:1px solid var(--line);border-left:1px solid #eee;font-weight:700}
.wk .h.today{background:var(--now)}
.wk .h small{display:block;font-weight:400;color:#888}
.wk .hr{color:#888;text-align:right;padding-right:3px;height:22px;border-bottom:1px dotted #eee}
.wk .c{position:relative;height:22px;border-left:1px solid #eee;border-bottom:1px dotted #f0f0f0}
.wk .c b{position:absolute;left:2px;right:2px;border-radius:2px;cursor:pointer;overflow:hidden;font-size:8px;color:#fff;padding:0 2px;white-space:nowrap}
.wk .t{text-align:center;font-weight:700;padding:5px 0;border-top:1px solid var(--line);border-left:1px solid #eee;background:#fafafa}
/* month */
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:10px}
.mo .h{text-align:center;color:#888;padding:3px}
.mo .d{border:1px solid var(--line);border-radius:4px;min-height:64px;padding:4px;cursor:pointer;background:#fff}
.mo .d.out{opacity:.35}.mo .d.today{border-color:var(--blue);background:var(--now)}
.mo .d.red{background:var(--pink)}.mo .d.sky{background:var(--sky)}
.mo .d .n{font-weight:700}.mo .d .v{font-size:12px;font-weight:800;margin-top:2px}
.mo .d .bar{display:flex;height:5px;margin-top:4px;border-radius:2px;overflow:hidden;background:#f0f0f0}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;margin:10px 0}
.sum b{font-size:14px}
/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.gal .colh{font-size:13px;font-weight:700;padding:4px 0 8px;border-bottom:2px solid #222;margin-bottom:8px;display:flex;justify-content:space-between}
.gal .colh small{font-weight:400;color:#888}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fafafa;cursor:pointer}
.card.empty{background:#f4f4f4;border-style:dashed;cursor:default}
.card .th{height:96px;display:flex;align-items:center;justify-content:center;padding:6px;background:#f6f6f6}
.card.red .th{background:var(--pink)}.card.sky .th{background:var(--sky)}
.card.empty .th{background:transparent;font-size:10px;color:#bbb}
.card .lb{font-size:10.5px;padding:5px 8px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.thumb{width:100%;height:84px;display:grid;grid-template-columns:14px 1fr 30px;gap:3px;position:relative;font-size:7px}
.thumb .rb{writing-mode:vertical-rl;background:var(--m8);color:#fff;text-align:center;font-weight:700;font-size:7px;letter-spacing:.1em}
.thumb .rows{display:grid;grid-template-rows:repeat(22,1fr);gap:1px;background:#fff;padding:2px}
.thumb .rows i{display:block;position:relative;background:#fafafa}
.thumb .rows i b{position:absolute;left:0;top:0;bottom:0;display:block}
.thumb .cols{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#fff;padding:2px;grid-column:2/4}
.thumb .cols i{position:relative;display:block;background:#fafafa}
.thumb .cols i b{position:absolute;left:0;right:0;display:block}
.thumb .side2{background:#fff;padding:2px;line-height:1.3;overflow:hidden;color:#555}
.thumb .tot{position:absolute;right:3px;bottom:1px;font-weight:800;font-size:11px}
/* settings */
.set{max-width:560px;font-size:12px}
.set .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.set label{width:90px;color:#666}
.set input,.set select{border:1px solid #ddd;border-radius:3px;padding:5px 7px;flex:1;min-width:120px}
.set .sub{border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0}
.set .sub .row{margin:4px 0}
.set .sub input[type=color]{flex:0 0 36px;padding:0;height:26px}
.set .warn{background:#fff8e6;border:1px solid #f0d090;border-radius:4px;padding:8px;font-size:11px;line-height:1.5}
.set h4{margin:14px 0 4px;font-size:12px}
.log{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#666;background:#f7f7f7;padding:6px;border-radius:4px;white-space:pre-wrap;max-height:160px;overflow:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:8px;padding:16px;width:100%;max-width:380px;font-size:12px}
.modal .box h4{margin-bottom:10px}
.modal .row{display:flex;gap:6px;align-items:center;margin:6px 0}
.modal label{width:44px;color:#666}
.modal input,.modal select{border:1px solid #ddd;border-radius:3px;padding:5px;flex:1;min-width:0}
.modal .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
/* phone */
.pnav{display:none}
.topsel{display:none}
@media (max-width:760px){
 #app{grid-template-columns:1fr}
 .side{display:none}
 .main{padding:10px 10px 70px}
 .dpc{grid-template-columns:1fr}
 .dpc>div:first-child{display:flex;flex-direction:column-reverse}
 .mbar{margin:0 0 8px}
 .three{grid-template-columns:1fr;gap:6px}
 .col{min-height:0}
 .gal{grid-template-columns:1fr}
 .grid3{grid-template-columns:repeat(3,1fr)}
 .ribbon{margin:0 20px 8px}
 .paper{grid-template-columns:1fr}
 .pnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 .pnav div{text-align:center;padding:11px 0 9px;font-size:11px;color:#777}
 .pnav div.on{color:#111;font-weight:700}
 .topsel{display:inline-block;border:1px solid #ccc;border-radius:4px;padding:3px 6px;background:#fff}
 .ttl b{font-size:16px}
 .wk .h small{display:none}
}
.moretabs{display:none}
@media (max-width:760px){.moretabs{display:flex}}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;z-index:70;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
/* plan v2 */
.plan-ph{display:none}
.pbnav{display:flex;gap:8px;align-items:center;font-size:11px;margin-bottom:8px;flex-wrap:wrap}
.pb{display:grid;gap:1px;background:#eee;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:10px}
.pb>div{background:#fff;min-height:18px}
.pbh{background:#f7f7f7!important;text-align:center;font-weight:700;padding:4px 2px}
.pbh small{display:block;font-weight:400;color:#888;font-size:8px}
.pbh.cur{background:var(--now)!important;color:var(--blue)}
.pbs{font-weight:700;padding:4px 6px;background:#fafafa!important}
.pbsc{background:#fafafa!important;text-align:center;padding:2px 0}
.pbsc.cur,.pbc.cur{background:#f4f8ff!important}
.pbm{color:#c33;cursor:pointer;font-size:11px}
.pbl{padding:3px 6px;color:#555;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbl small{color:#999;margin-left:3px}
.pbl.sh{min-height:0;padding:0 6px}
.pband{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid;border-radius:4px;margin:1px}
.pband .pbw{padding:3px 2px 2px;text-align:center;border-left:1px dotted rgba(0,0,0,.08);cursor:pointer;background:transparent;min-height:0}
.pband .pbw:first-child{border-left:0}
.pband .pbw.cur{background:rgba(47,111,224,.07)}
.pband .pbw.ext{background:rgba(47,111,224,.13)}
.pband .pbw small{display:block;color:var(--blue);font-size:8px}
.pband .pbw .lt{display:block;color:#c33;font-size:8.5px}
.grip{position:absolute;right:-2px;top:0;bottom:0;width:14px;cursor:ew-resize;touch-action:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18));border-radius:0 4px 4px 0;font-size:8px;color:#222;display:flex;align-items:center;justify-content:center;user-select:none}
.pbsh{background:repeating-linear-gradient(45deg,#f5f5f5 0 4px,#e6e6e6 4px 8px)!important;color:#888;font-size:8.5px;padding:1px 6px;border-radius:3px;margin:0 1px 1px;white-space:nowrap;overflow:hidden}
.pbc{min-height:0}
.pltab{border-collapse:collapse;font-size:11px;width:100%}
.pltab th,.pltab td{border:1px solid #eee;padding:4px 6px;text-align:left;white-space:nowrap}
.pltab th{background:#f7f7f7;font-size:10px;color:#666}
.pltab tr:hover td{background:#fcf8f2}
.phb{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;font-size:11px}
.phb h6{font-size:12px;margin-bottom:2px;display:flex;gap:6px;align-items:center}
.phb .bl{padding:6px 0;border-bottom:1px solid #f2f2f2}
.phb .bl:last-child{border-bottom:0}
.phb .bar{height:5px;background:#f0f0f0;border-radius:2px;overflow:hidden;margin-top:4px}
.phb .bar i{display:block;height:100%}
.plandot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;flex:none}
@media (max-width:760px){.plan-pc{display:none}.plan-ph{display:block}}
/* 계획관리 (pm) */
.pm{max-width:560px}
.pm .tgl{display:flex;gap:14px;font-size:11px;color:#555;margin-bottom:10px;flex-wrap:wrap}
.pm .sb{border-left:4px solid;padding:2px 0 2px 8px;margin-bottom:12px}
.pm .sbh{font-size:12px;font-weight:700;margin-bottom:2px}
.pm .pln{display:flex;gap:6px;align-items:baseline;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:12px}
.pm .pln b{font-size:12.5px}
.pm .pln small{color:#888;font-weight:400}
.pm .itm{display:flex;gap:6px;padding:4px 6px 4px 16px;border-bottom:1px solid #f4f4f4;font-size:11.5px;align-items:center;border-radius:4px}
.pm .itm .ob{cursor:pointer;flex:none;width:15px;text-align:center}
.pm .itm .tx{flex:1;cursor:pointer}
.pm .itm.done .tx{color:#aaa;text-decoration:line-through}
.pm .dt{color:#888;font-size:10px;margin-left:auto;white-space:nowrap;cursor:pointer}
.pm .on2{background:var(--now)}
.pm .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:sticky;bottom:0;background:#fff;padding:8px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">
 <div class="side" id="side"></div>
 <div class="main" id="main"></div>
</div>
<div class="pnav" id="pnav"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   타임테이블 v1 — 타이머·세션·일간/주간/월간·데일리 모음·오프라인 큐·GitHub 동기화
   데이터 원본: GitHub 비공개 저장소 (사람별 파일). 로컬은 localStorage 큐.
   ============================================================ */
const REPO='zzikkaplan/studyplandata', BRANCH='main';
const DEF_SETTINGS={schemaVersion:1,people:['햄찌','꼬까'],
 subjects:[{n:'민법',c:'#F9A8D4'},{n:'물리',c:'#00B300'},{n:'특허',c:'#0066FF'},{n:'상표',c:'#FF8A65'},{n:'디보',c:'#8D6E63'},{n:'조문',c:'#3a7d8c'},{n:'생물',c:'#FFE600'},{n:'지학',c:'#4DB6AC'},{n:'암기',c:'#D9A6FF'},{n:'기타',c:'#666666'}],
 exams:[{id:'ex1',name:'제64회 변리사 1차',date:'2027-02-20',u:0,del:false}],
 monthColors:['#D32F2F','#F57C00','#FBC02D','#388E3C','#1976D2','#7B1FA2','#D32F2F','#F57C00','#FBC02D','#388E3C','#1976D2','#7B1FA2'], // 1월부터 빨주노초파보 ×2 (8월 = 기존 주황)
 redHours:10,skyHours:6,dayStart:5};
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};
const DAYS=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const ym=s=>s.slice(0,7);

const hmDisp=m=>hm(m>=1440?m-1440:m);                          // 표시용은 24 접기

function migrateSettings(raw){
 raw=raw||{};
 if(!Array.isArray(raw.exams)&&raw.exam&&raw.exam.date)settings.exams=[{id:'ex1',name:raw.exam.name||'시험',date:raw.exam.date,u:0,del:false}];

 delete settings.exam;settings.schemaVersion=2;
}

function logicalNow(){const d=new Date();const mins=d.getHours()*60+d.getMinutes();let ds=iso(d);let m=mins;if(mins<dayStart()*60){ds=addDays(ds,-1);m=mins+1440;}return{d:ds,m};}

/* ---------- 파일 캐시 (localStorage) ----------
   key: tt.f.<path>  → {data, sha, dirty}
   sessions/<사람>/YYYY-MM.json  {v:1,sessions:[{id,d,s,p,i,a,b,k,u,del}]}
   todos/<사람>.json             {v:1,items:[{id,d,t,kind,done,carry,u,del}]}
   settings.json                 DEF_SETTINGS 구조 */
const fkey=p=>'tt.f.'+p;
function loadF(p,def){return LS.get(fkey(p),{data:def,sha:null,dirty:false})}
function saveF(p,f){LS.set(fkey(p),f)}

const todoPath=who=>`todos/${who}.json`;
const planPath=who=>`plan/${who}.json`;
const EMPTY_PLAN=()=>({v:1,weekStart:'2026-08-03',bands:[],milestones:[],units:{},daily:[1,1,1,1,1,1,1],goals:{},baselines:[],yield:[],pu:0});
function planFile(who){const f=loadF(planPath(who),EMPTY_PLAN());const p=f.data||{};['bands','milestones','baselines','yield'].forEach(k=>{if(!Array.isArray(p[k]))p[k]=[]});if(!p.units||typeof p.units!=='object')p.units={};if(!Array.isArray(p.daily)||p.daily.length!==7)p.daily=[1,1,1,1,1,1,1];if(!p.goals)p.goals={};if(!p.weekStart)p.weekStart='2026-08-03';f.data=p;return f}
function myPlan(){return planFile(cfg.person).data}
function planMut(fn,wholesale){const f=planFile(cfg.person);fn(f.data);if(wholesale)f.data.pu=Date.now();f.dirty=true;saveF(planPath(cfg.person),f);scheduleSync();}
function sessFile(who,m){return loadF(sessPath(who,m),{v:1,sessions:[]})}
function todoFile(who){const f=loadF(todoPath(who),{v:2,plans:[],items:[]});if(!Array.isArray(f.data.plans))f.data.plans=[];return f}
function listDirty(){return Object.keys(localStorage).filter(k=>k.startsWith('tt.f.')).map(k=>k.slice(5)).filter(p=>{const f=LS.get(fkey(p));return f&&f.dirty})}

/* 세션 CRUD (자기 것만) */
function sessionsOf(who,d){const f=sessFile(who,ym(d));return f.data.sessions.filter(s=>s.d===d&&!s.del).sort((a,b)=>a.a-b.a)}
function sessionsMonth(who,m){return sessFile(who,m).data.sessions.filter(s=>!s.del)}
function upsertSession(s){const p=sessPath(cfg.person,ym(s.d));const f=loadF(p,{v:1,sessions:[]});s.u=Date.now();const i=f.data.sessions.findIndex(x=>x.id===s.id);if(i>=0)f.data.sessions[i]=s;else f.data.sessions.push(s);f.dirty=true;saveF(p,f);scheduleSync();}
function deleteSession(s){upsertSession(Object.assign({},s,{del:true}))}

function todosOf(who,d){return todoFile(who).data.items.filter(t=>t.d===d&&!t.del)}
function upsertTodo(t){const p=todoPath(cfg.person);const f=todoFile(cfg.person);t.u=Date.now();const i=f.data.items.findIndex(x=>x.id===t.id);if(i>=0)f.data.items[i]=t;else f.data.items.push(t);f.data.v=2;f.dirty=true;saveF(p,f);scheduleSync();}
/* 계획관리의 「계획」 (todos 파일 plans 배열) */
function plansOf(who){return todoFile(who).data.plans.filter(p=>!p.del)}

function upsertPlan(p){const path=todoPath(cfg.person);const f=todoFile(cfg.person);p.u=Date.now();const i=f.data.plans.findIndex(x=>x.id===p.id);if(i>=0)f.data.plans[i]=p;else f.data.plans.push(p);f.data.v=2;f.dirty=true;saveF(path,f);scheduleSync();}

/* ---------- GitHub Contents API ---------- */
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function logS(t){syncLog.unshift(`${new Date().toTimeString().slice(0,8)} ${t}`);syncLog=syncLog.slice(0,40)}
async function ghGet(path){
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}&t=${Date.now()}`,{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},cache:'no-store'});
 if(r.status===404)return null;
 if(!r.ok)throw new Error(`GET ${path} ${r.status}`);
 const j=await r.json();return{sha:j.sha,data:JSON.parse(b64d(j.content))};
}
async function ghPut(path,data,sha){
 const body={message:`${cfg.person} · ${path}`,content:b64e(JSON.stringify(data,null,1)),branch:BRANCH};if(sha)body.sha=sha;
 const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error(`PUT ${path} ${r.status}`);
 const j=await r.json();return j.content.sha;
}
/* 병합: id 기준, u(수정시각) 큰 쪽이 이김. 삭제는 del 표식으로 남음 */
function mergeList(a,b){const m=new Map();[...a,...b].forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});return[...m.values()]}
function mergeFile(path,local,remote){
 if(path.startsWith('sessions/'))return{v:1,sessions:mergeList(local.sessions||[],remote.sessions||[])};
 if(path.startsWith('todos/'))return{v:2,plans:mergeList(local.plans||[],remote.plans||[]),items:mergeList(local.items||[],remote.items||[])};
 if(path.startsWith('plan/')){ // bands·milestones·units[과목]=id/u/del 병합, 나머지는 pu 큰 쪽 통째
  const A=local||{},B=remote||{};const w=(A.pu||0)>=(B.pu||0)?A:B;
  const out={v:1,weekStart:w.weekStart||'2026-08-03',daily:Array.isArray(w.daily)&&w.daily.length===7?w.daily:[1,1,1,1,1,1,1],goals:w.goals||{},baselines:w.baselines||[],yield:w.yield||[],pu:w.pu||0};
  out.bands=mergeList(A.bands||[],B.bands||[]);
  out.milestones=mergeList(A.milestones||[],B.milestones||[]);
  out.units={};new Set([...Object.keys(A.units||{}),...Object.keys(B.units||{})]).forEach(s=>{out.units[s]=mergeList((A.units||{})[s]||[],(B.units||{})[s]||[])});
  return out;
 }
 return local; // settings: 로컬(더러운 쪽)이 이김
}
function sameJSON(a,b){return JSON.stringify(a)===JSON.stringify(b)}
/* 한 파일 동기화. own=true 면 push 까지, 아니면 pull 만 */
async function syncFile(path,own,def){
 const f=loadF(path,def);
 const remote=await ghGet(path);
 if(!own){ if(remote){f.data=remote.data;f.sha=remote.sha;f.dirty=false;saveF(path,f);} return; }
 let merged=f.data,sha=remote?remote.sha:null;
 if(remote){ merged=f.dirty?mergeFile(path,f.data,remote.data):remote.data; }
 const needPush=f.dirty||(!remote&&path==='settings.json');
 if(needPush&&(!remote||!sameJSON(merged,remote.data))){
  try{sha=await ghPut(path,merged,sha);logS(`↑ ${path}`);}
  catch(e){ if(/409|422/.test(e.message)){const r2=await ghGet(path);merged=mergeFile(path,merged,r2.data);sha=await ghPut(path,merged,r2.sha);logS(`↑ ${path} (재시도)`);} else throw e; }
 }
 f.data=merged;f.sha=sha;f.dirty=false;saveF(path,f);
 if(path==='settings.json'){settings=Object.assign({},DEF_SETTINGS,merged);migrateSettings(merged);LS.set('tt.settings',settings);}
}
async function syncAll(silent){
 if(syncing)return; if(!cfg.token){if(!silent)toast('설정에서 토큰을 넣어줘');return;}
 if(!navigator.onLine){if(!silent)toast('오프라인 — 큐에 보관');return;}
 syncing=true;renderSide();
 try{
  const me=cfg.person,peer=other();const months=new Set([ym(today()),ym(curDate()),ym(addDays(today(),-7))]);if(ui.galMonth)months.add(ui.galMonth);
  listDirty().forEach(p=>{const m=p.match(/^sessions\/[^/]+\/(\d{4}-\d{2})/);if(m)months.add(m[1]);});
  await syncFile('settings.json',true,settings);
  await syncFile(planPath(me),true,EMPTY_PLAN());if(peer)await syncFile(planPath(peer),false,EMPTY_PLAN());
  for(const m of months){await syncFile(sessPath(me,m),true,{v:1,sessions:[]});if(peer)await syncFile(sessPath(peer,m),false,{v:1,sessions:[]});}
  await syncFile(todoPath(me),true,{v:1,items:[]});if(peer)await syncFile(todoPath(peer),false,{v:1,items:[]});
  cfg.lastSync=Date.now();LS.set('tt.cfg',cfg);logS('완료');if(!silent)toast('동기화됨');
 }catch(e){logS('✗ '+e.message);if(!silent)toast('동기화 실패: '+e.message);}
 syncing=false;render();
}
let syncT=null;function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(()=>syncAll(true),4000);renderSide();}
window.addEventListener('online',()=>syncAll(true));
setInterval(()=>{if(listDirty().length)syncAll(true)},90000);
/* 앱 열 때·다시 볼 때 */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncAll(true)});

/* ---------- 타이머 ---------- */
function startTimer(){
 if(!form.s){toast('과목을 골라줘');return;}
 const n=logicalNow();run={s:form.s,p:form.p,i:form.i,k:form.k,d:n.d,a:n.m,at:Date.now()};LS.set('tt.run',run);render();
}
function stopTimer(){
 if(!run)return;const n=logicalNow();let b=n.m;let d=run.d;
 if(n.d!==run.d){ b=n.m+1440*Math.round((parse(n.d)-parse(run.d))/864e5); } // 날짜 넘어가면 이어붙임
 if(b<=run.a)b=run.a+1;
 const s={id:uid(),d,s:run.s,p:run.p,i:run.i,a:run.a,b,k:form.k||run.k||''};
 upsertSession(s);run=null;LS.del('tt.run');toast(`저장 ${dur(s.b-s.a)}`);render();
}
function elapsed(){return run?Math.max(0,Math.floor((Date.now()-run.at)/1000)):0}
setInterval(()=>{if(run){const e=document.getElementById('runT');if(e)e.textContent=fmtSec(elapsed());if(pipWin&&!pipWin.closed){const p=pipWin.document.getElementById('runT');if(p)p.textContent=fmtSec(elapsed())}}},1000);
const fmtSec=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;
function manualSave(doc){doc=doc||document;
 const a=doc.getElementById('mA').value,b=doc.getElementById('mB').value;if(!form.s||!a||!b){toast('과목·시작·끝을 채워줘');return;}
 const tm=t=>{const[h,m]=t.split(':').map(Number);let v=h*60+m;if(v<dayStart()*60)v+=1440;return v};
 let A=tm(a),B=tm(b);if(B<=A)B+=1440;
 upsertSession({id:uid(),d:curDate(),s:form.s,p:form.p,i:form.i,a:A,b:B,k:form.k});toast('저장됨');render();
}

/* ----- 일간 ----- */
function ttRows(sess,{rows=22,thin=false}={}){
 const s0=dayStart()*60;let h='';
 const now=logicalNow();const isToday=curDate()===now.d;
 for(let r=0;r<rows;r++){
  const a=s0+r*60,b=a+60;let bars='';
  sess.forEach(x=>{const L=Math.max(x.a,a),R=Math.min(x.b,b);if(R>L)bars+=`<b style="left:${(L-a)/60*100}%;width:${(R-L)/60*100}%;background:${subjColor(x.s)}" title="${esc(x.s)} ${hmDisp(x.a)}-${hmDisp(x.b)}" onclick="editSession('${x.id}',document)"></b>`});
  if(run&&run.d===curDate()){const L=Math.max(run.a,a),R=Math.min(now.m+(now.d!==run.d?1440:0),b);if(R>L)bars+=`<b style="left:${(L-a)/60*100}%;width:${(R-L)/60*100}%;background:${subjColor(run.s)};opacity:.5"></b>`}
  if(isToday&&now.m>=a&&now.m<b)bars+=`<i class="now" style="left:${(now.m-a)/60*100}%"></i>`;
  h+=`<span>${(a/60)%24}</span><div class="r">${bars}</div>`;
 }return h;
}
function groupSess(sess){const g={};sess.forEach(x=>{const k=x.s+'|'+x.p+'|'+x.i;(g[k]=g[k]||{s:x.s,p:x.p,i:x.i,min:0,ids:[],k:''}).min+=x.b-x.a;g[k].ids.push(x.id);if(x.k)g[k].k=x.k});return Object.values(g)}
function sheetHTML(who,d,sess,{withRun=true}={}){
 const dt=parse(d);const tot=sess.reduce((a,x)=>a+x.b-x.a,0);
 const g=groupSess(sess);
 return`<div class="sheet"><div class="ribbon">${d.replace(/-/g,'.')} ${['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getDay()]}</div><div class="paper">
 <div><div class="hd">Time Table</div><div class="tt"><span></span><div class="tth">${[1,2,3,4,5].map(n=>`<i style="left:${(n*100/6).toFixed(2)}%">${n*10}</i>`).join('')}</div>${ttRows(sess)}</div></div>
 <div><div class="hd">Study Time</div><div class="st">${g.map(x=>`<div class="it" onclick="editSession('${x.ids[0]}',document)"><i class="sw" style="background:${subjColor(x.s)}"></i><span class="nm">${esc(x.s)}</span><span class="pl">${esc([x.p,x.i].filter(Boolean).join(' '))}</span><span class="mk">${esc(x.k)}</span><span>${dur(x.min)}</span></div>`).join('')||'<div style="color:#bbb;font-size:11px">기록 없음</div>'}</div>
 <div class="foot"><div>Start <b>${sess.length?hmDisp(sess[0].a):'--:--'}</b> &nbsp; Stop <b>${sess.length?hmDisp(Math.max(...sess.map(x=>x.b))):'--:--'}</b></div><div>Total <span class="big">${dur(tot)}</span></div></div></div></div></div>`;

/* ----- 계획 엔진 ----- */
function planWeekStart(plan){return(plan&&plan.weekStart)||'2026-08-03'}
function pWeekNo(plan,d){return Math.floor((parse(d)-parse(planWeekStart(plan)))/864e5/7)+1}
function pWeekDate(plan,w,i){return addDays(planWeekStart(plan),(w-1)*7+(i||0))}
function dayIdx(d){return(parse(d).getDay()+6)%7}
function unitMap(plan,s){const m=new Map();((plan.units||{})[s]||[]).forEach(u=>{if(!u.del)m.set(u.id,u)});return m}
function weekQuotas(plan,band){const w=Array.isArray(plan.daily)&&plan.daily.length===7?plan.daily:[1,1,1,1,1,1,1];const W=w.reduce((a,b)=>a+(+b||0),0);const per=+band.per||0;if(!W||!per)return[0,0,0,0,0,0,0];let prev=0,acc=0;const out=[];for(let i=0;i<7;i++){acc+=(+w[i]||0);const c=Math.round(per*acc/W);out.push(c-prev);prev=c}return out}
function bandQuota(plan,band,d){const w=pWeekNo(plan,d);if(w<band.w1||w>band.w2)return 0;return weekQuotas(plan,band)[dayIdx(d)]}
function bandUnits(plan,band){const m=unitMap(plan,band.s);return(band.units||[]).map(id=>m.get(id)).filter(Boolean)}
function bandDone(plan,band){return bandUnits(plan,band).filter(u=>u.done&&u.done[band.id]).length}
function bandCursor(plan,band){const us=bandUnits(plan,band);for(let i=0;i<us.length;i++)if(!(us[i].done&&us[i].done[band.id]))return i;return us.length}
function plannedThrough(plan,band,d){const s=pWeekDate(plan,band.w1);if(d<s)return 0;const e=pWeekDate(plan,band.w2,6);const end=d<e?d:e;const q=weekQuotas(plan,band);let tot=0;for(let x=s;x<=end;x=addDays(x,1))tot+=q[dayIdx(x)];return tot}
function late(plan,band,d){const us=bandUnits(plan,band);if(!us.length)return 0;return Math.max(0,Math.min(plannedThrough(plan,band,d),us.length)-bandDone(plan,band))}
/* d 날짜 몫 = 그 날 quota + 그 전날까지의 밀림. 완료는 순서 무관(건너뛴 것도 done 이면 done) */
function bandListFor(plan,band,d){
 const us=bandUnits(plan,band);if(!us.length)return[];
 const w=pWeekNo(plan,d);if(w<band.w1||w>band.w2)return[];
 const notDone=us.filter(u=>{const x=u.done&&u.done[band.id];return!x||x>=d});
 const doneBefore=us.length-notDone.length;
 const backlog=Math.max(0,Math.min(plannedThrough(plan,band,addDays(d,-1)),us.length)-doneBefore);
 return notDone.slice(0,Math.min(notDone.length,bandQuota(plan,band,d)+backlog));
}
/* 내일 열: 오늘(t) 다 끝났다고 치고 내일(tmr) quota 만 */
function bandListTomorrow(plan,band,t,tmr){
 const us=bandUnits(plan,band);if(!us.length)return[];
 const w=pWeekNo(plan,tmr);if(w<band.w1||w>band.w2)return[];
 const notDone=us.filter(u=>{const x=u.done&&u.done[band.id];return!x||x>=t});
 const wt=pWeekNo(plan,t);const skip=(wt>=band.w1&&wt<=band.w2)?bandListFor(plan,band,t).length:0;
 return notDone.slice(skip,skip+bandQuota(plan,band,tmr));
}
function weekDoneCount(plan,band,w){const a=pWeekDate(plan,w),b=pWeekDate(plan,w,6);return bandUnits(plan,band).filter(u=>{const d=u.done&&u.done[band.id];return d&&d>=a&&d<=b}).length}
function endDate(plan,band){const us=bandUnits(plan,band);if(!us.length)return null;const t=today();const c14=us.filter(u=>{const d=u.done&&u.done[band.id];return d&&d>addDays(t,-14)&&d<=t}).length;const rate=c14>0?c14/14:(+band.per||0)/7;const remain=us.length-bandDone(plan,band);if(remain<=0)return t;if(!rate)return null;return addDays(t,Math.ceil(remain/rate))}
function examWeek(plan){const x=nextExam();return x?pWeekNo(plan,x.date):9999} // 오늘 이후 가장 가까운 시험 기준
function subjOrderAll(plan){const names=settings.subjects.map(x=>x.n);const extra=[...new Set(plan.bands.filter(b=>!b.del).map(b=>b.s))].filter(s=>!names.includes(s));return[...names,...extra]}
function yieldOrder(plan){const base=(plan.yield&&plan.yield.length?plan.yield:settings.subjects.map(x=>x.n));const extra=[...new Set(plan.bands.filter(b=>!b.del).map(b=>b.s))].filter(s=>!base.includes(s));return[...base,...extra]}
function extendBand(plan,band){const old2=band.w2;band.w2+=1;band.u=Date.now();plan.bands.forEach(b=>{if(b!==band&&!b.del&&b.s===band.s&&b.w1>old2){b.w1+=1;b.w2+=1;b.u=Date.now()}})}
function extendBandById(id,n){let warn=false,nm='';planMut(p=>{const b=p.bands.find(x=>x.id===id&&!x.del);if(!b)return;nm=b.name;for(let i=0;i<Math.max(1,n||1);i++)extendBand(p,b);const ew=examWeek(p);warn=p.bands.some(x=>!x.del&&x.s===b.s&&x.w2>ew)});render();toast(warn?`${nm} 늘림 — ⚠ 시험 주를 넘는 띠가 있어`:`${nm} +${Math.max(1,n||1)}주`)}
function fixBaseline(dateStr){planMut(p=>{
 const rem={};p.bands.filter(b=>!b.del).forEach(b=>{const us=bandUnits(p,b);if(us.length)rem[b.s]=(rem[b.s]||0)+us.length-bandDone(p,b)});
 p.baselines.push({at:dateStr,bands:p.bands.filter(b=>!b.del).map(b=>({id:b.id,w1:b.w1,w2:b.w2})),remaining:rem});
 p.bands.forEach(b=>{if(!b.del){b.orig={w1:b.w1,w2:b.w2};b.u=Date.now()}});
},true)}
function maybeAutoBaseline(){const d=today();if(d.slice(8)!=='01')return;const p=myPlan();if(!(p.bands||[]).some(b=>!b.del))return;if((p.baselines||[]).some(b=>ym(b.at)===ym(d)))return;fixBaseline(d);toast('이 달 기준선 고정됨')}
function rebalancePreview(){
 const plan=JSON.parse(JSON.stringify(myPlan()));const y=addDays(today(),-1);const rows=[];
 yieldOrder(plan).forEach(s=>{plan.bands.filter(b=>!b.del&&b.s===s).sort((a,b)=>a.w1-b.w1).forEach(b=>{
  const L=late(plan,b,y);if(!L||!(+b.per))return;
  const ext=Math.ceil(L/(+b.per));const o1=b.w1,o2=b.w2;
  for(let i=0;i<ext;i++)extendBand(plan,b);
  rows.push({s,name:b.name,late:L,from:`W${pad(o1)}–W${pad(o2)}`,to:`W${pad(b.w1)}–W${pad(b.w2)}`,over:b.w2>examWeek(plan)});
 })});
 modal(`<h4>밀린 것 재배치 — 미리보기</h4>
 ${rows.length?rows.map(r=>`<div class="row" style="font-size:11px"><i class="sw" style="background:${subjColor(r.s)};width:8px;height:8px;flex:none"></i><span style="flex:1">${esc(r.s)} ${esc(r.name)} · 밀림 ${r.late}</span><span>${r.from} → ${r.to}${r.over?' <b style="color:#c33">시험 주 초과</b>':''}</span></div>`).join(''):'<p style="color:#888;font-size:11px">밀린 띠가 없어.</p>'}
 <p style="font-size:10px;color:#888;margin-top:8px">양보 순서: ${yieldOrder(plan).map(esc).join(' → ')} · 규칙: 밀림÷주당 만큼 주 수 늘림(뒤 띠는 밀려남)<br><b>적용은 B단계에서 들어와 — 지금은 미리보기만. 저장을 눌러도 바뀌지 않아.</b></p>`,()=>{});
}

 <p style="font-size:10px;color:#888">과목을 바꾸려면 저장 후 다시 열어 단원을 다시 골라줘.</p>`,
 q=>{const s=q('bS').value;planMut(p=>{
   let x=b.id?p.bands.find(z=>z.id===b.id):null;
   if(!x){x={id:uid(),units:[],u:0,del:false};p.bands.push(x)}
   x.s=s;x.name=q('bN').value.trim();x.tag=q('bT').value.trim();x.w1=+q('bW1').value||1;x.w2=Math.max(+q('bW2').value||1,+q('bW1').value||1);x.per=Math.max(0,+q('bP').value||0);x.note=q('bM').value;
   const e1=q('bU1'),e2=q('bU2');
   if(e1&&e2){ if(e1.value&&e2.value){const ids=((p.units||{})[s]||[]).filter(u=>!u.del).map(u=>u.id);let i1=ids.indexOf(e1.value),i2=ids.indexOf(e2.value);if(i1>=0&&i2>=0){if(i1>i2){const t2=i1;i1=i2;i2=t2}x.units=ids.slice(i1,i2+1)}} else if(!e1.value&&!e2.value)x.units=[]; }
   x.u=Date.now()});render()},
 b.id?()=>{if(confirm('이 띠를 지울까? '+b.name)){planMut(p=>{const x=p.bands.find(z=>z.id===b.id);if(x){x.del=true;x.u=Date.now()}});render()}}:null);

 q=>{planMut(p=>{let x=m.id?p.milestones.find(z=>z.id===m.id):null;if(!x){x={id:uid(),del:false};p.milestones.push(x)}x.s=q('mS').value;x.name=q('mN').value.trim();x.w=+q('mW').value||1;x.u=Date.now()});render()},
 m.id?()=>{if(confirm('이 이정표를 지울까? '+m.name)){planMut(p=>{const x=p.milestones.find(z=>z.id===m.id);if(x){x.del=true;x.u=Date.now()}});render()}}:null);

/* 손잡이 끌기: 열 폭 단위 스냅, 놓으면 extendBand. 안 움직이고 놓으면 +1주 */
let gripSt=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest?e.target.closest('.grip'):null;if(!g)return;e.preventDefault();e.stopPropagation();const el=g.parentElement;const cell=el.querySelector('.pbw');gripSt={id:g.dataset.band,x:e.clientX,cw:cell?Math.max(24,cell.getBoundingClientRect().width):56,add:0,moved:0,g,el};try{g.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!gripSt)return;const dx=e.clientX-gripSt.x;gripSt.moved=Math.max(gripSt.moved,Math.abs(dx));const d=Math.max(0,Math.round(dx/gripSt.cw));if(d!==gripSt.add){gripSt.add=d;gripSt.g.textContent=d?('+'+d):'';gripSt.el.style.outline=d?'2px dashed var(--blue)':''}});
document.addEventListener('pointerup',e=>{if(!gripSt)return;const st=gripSt;gripSt=null;st.g.textContent='';st.el.style.outline='';if(st.add>0)extendBandById(st.id,st.add);else if(st.moved<8)extendBandById(st.id,1)});
document.addEventListener('pointercancel',()=>{if(gripSt){gripSt.g.textContent='';gripSt.el.style.outline='';gripSt=null}});
/* ----- 계획관리 (MiMi식 · 데이터 = todos 파일 plans+items · 주차계획 띠와 별개) ----- */
let pmSel=null;
function pmSelect(type,id){pmSel=(pmSel&&pmSel.type===type&&pmSel.id===id)?null:{type,id};render()}
function pmHTML(){
 const t=today();const plans=plansOf(cfg.person);
 const all=todoFile(cfg.person).data.items.filter(x=>!x.del&&x.kind==='study');
 const showEnd=!!ui.pmEnded,showFut=!!ui.pmFuture;
 const vis=plans.filter(p=>(showEnd||!(p.d2&&p.d2<t))&&(showFut||!(p.d1&&p.d1>t)));
 const planIds=new Set(plans.map(p=>p.id));
 const orphan=all.filter(x=>!x.plan||!planIds.has(x.plan)).sort((a,b)=>a.d<b.d?-1:1);
 const names=settings.subjects.map(x=>x.n);const extra=[...new Set(vis.map(p=>p.s))].filter(s=>!names.includes(s));
 const itemLi=x=>`<div class="itm ${x.done?'done':''} ${pmSel&&pmSel.type==='item'&&pmSel.id===x.id?'on2':''}"><span class="ob" onclick="toggleTodo('${x.id}')">${x.done?'●':'○'}</span><span class="tx" onclick="pmSelect('item','${x.id}')">${esc(x.t)}</span><span class="dt" onclick="pmDateEdit(event,'${x.id}')">${(x.d||'').slice(5).replace('-','/')}</span></div>`;
 const subjBlock=s=>{
  const ps=vis.filter(p=>p.s===s).sort((a,b)=>(a.d1||'')<(b.d1||'')?-1:1);
  if(!ps.length)return'';
  return`<div class="sb" style="border-color:${subjColor(s)}"><div class="sbh">${esc(s)}</div>${ps.map(p=>{
   const its=all.filter(x=>x.plan===p.id).sort((a,b)=>a.d<b.d?-1:1);
   const done=its.filter(x=>x.done).length;
   return`<div class="pln ${pmSel&&pmSel.type==='plan'&&pmSel.id===p.id?'on2':''}" onclick="pmSelect('plan','${p.id}')"><b>${esc(p.name)}</b><small>시작: ${p.d1||'—'} / 종료: ${p.d2||'—'}${its.length?` · ${done}/${its.length}`:''}</small></div>${its.map(itemLi).join('')}`}).join('')}</div>`};
 return`${moreTabs('pm')}<div class="ttl"><b>계획관리 <span>› ${esc(cfg.person)}</span></b></div><div class="pm">
 <div class="tgl"><label><input type="checkbox" ${showEnd?'checked':''} onchange="ui.pmEnded=this.checked;LS.set('tt.ui',ui);render()"> 종료된 계획 보이기</label><label><input type="checkbox" ${showFut?'checked':''} onchange="ui.pmFuture=this.checked;LS.set('tt.ui',ui);render()"> 미시작 계획 보이기</label></div>
 ${[...names,...extra].map(subjBlock).join('')||'<p style="color:#888">계획이 없어. 「+ 계획」이나 오늘 칸의 「띠에서 가져오기」로 시작.</p>'}
 ${orphan.length?`<div class="sb" style="border-color:#bbb"><div class="sbh">계획 없음</div>${orphan.map(itemLi).join('')}</div>`:''}
 <div class="btns"><button class="btn" onclick="setView('set')">분류 관리</button><button class="btn" onclick="pmPlanModal()">+ 계획</button><button class="btn" onclick="pmEditPlan()">계획 수정</button><button class="btn d" onclick="pmDelPlan()">계획 삭제</button><button class="btn" onclick="pmAddItem()">+ 항목</button><button class="btn" onclick="pmEditItem()">항목 수정</button><button class="btn d" onclick="pmDelItem()">항목 삭제</button></div></div>`;
}
function pmDateEdit(ev,id){ev.stopPropagation();const el=ev.target;const t=todoFile(cfg.person).data.items.find(x=>x.id===id);if(!t)return;el.outerHTML=`<input type="date" value="${t.d}" style="font-size:10px" onchange="pmSetDate('${id}',this.value)" onclick="event.stopPropagation()">`;}
function pmSetDate(id,d){const t=todoFile(cfg.person).data.items.find(x=>x.id===id);if(t&&d){t.d=d;upsertTodo(t);}render();}
function pmSelPlan(){return pmSel&&pmSel.type==='plan'?plansOf(cfg.person).find(p=>p.id===pmSel.id):null}
function pmSelItem(){return pmSel&&pmSel.type==='item'?todoFile(cfg.person).data.items.find(x=>x.id===pmSel.id&&!x.del):null}
function pmPlanModal(p){
 p=p||{id:'',s:(settings.subjects[0]||{}).n||'',name:'',d1:today(),d2:today()};
 const subjOpts=settings.subjects.map(x=>`<option ${p.s==x.n?'selected':''}>${esc(x.n)}</option>`).join('');
 modal(`<h4>${p.id?'계획 수정':'+ 계획'}</h4><div class="row"><label>과목</label><select id="pS">${subjOpts}</select></div><div class="row"><label>이름</label><input id="pN" value="${esc(p.name)}" placeholder="객1회독"></div><div class="row"><label>시작</label><input id="pD1" type="date" value="${p.d1||''}"></div><div class="row"><label>종료</label><input id="pD2" type="date" value="${p.d2||''}"></div>`,
 q=>{const o=p.id?p:{id:uid(),del:false};o.s=q('pS').value;o.name=q('pN').value.trim();o.d1=q('pD1').value;o.d2=q('pD2').value;upsertPlan(o);render()});

function pmDelPlan(){const p=pmSelPlan();if(!p){toast('계획 줄을 먼저 골라줘');return;}if(confirm('이 계획을 지울까? '+p.name+' (항목은 「계획 없음」으로 남아)')){p.del=true;upsertPlan(p);pmSel=null;render()}}

function pmDelItem(){const x=pmSelItem();if(!x){toast('항목 줄을 먼저 골라줘');return;}if(confirm('지울까? '+x.t)){x.del=true;upsertTodo(x);pmSel=null;render()}}

/* ----- 설정 ----- */
function setHTML(){
 return`${moreTabs('set')}<div class="ttl"><b>설정</b></div><div class="set">
 <div class="row"><label>나는</label><select onchange="cfg.person=this.value;LS.set('tt.cfg',cfg);render()">${settings.people.map(p=>`<option ${cfg.person==p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
 <div class="row"><label>GitHub 토큰</label><input type="password" id="tok" value="${esc(cfg.token)}" placeholder="github_pat_…" autocomplete="off"><button class="btn" onclick="cfg.token=$('tok').value.trim();LS.set('tt.cfg',cfg);toast('저장');syncAll()">저장 후 동기화</button></div>
 <div class="row"><label>저장소</label><span>${REPO} · ${BRANCH} · 이 기기 브라우저에만 저장됨</span></div>
 <div class="row"><label>상태</label><span>${cfg.lastSync?'마지막 동기화 '+new Date(cfg.lastSync).toLocaleString('ko'):'아직 없음'} · 대기 ${listDirty().length}건 <button class="btn" onclick="syncAll()">지금 동기화</button></span></div>
 <div class="log">${syncLog.map(esc).join('\n')||'(로그 없음)'}</div>
 <h4>시험 <small style="font-weight:400;color:#888">D-day·시험 주 경고는 다음 시험 기준 · 지난 시험은 옅게</small></h4><div class="sub" id="examList">${settings.exams.filter(x=>!x.del).sort((a,b)=>(a.date||'')<(b.date||'')?-1:1).map(x=>`<div class="row" style="${x.date&&x.date<today()?'opacity:.5':''}"><input value="${esc(x.name)}" data-xi="${x.id}" data-xk="name"><input type="date" value="${x.date||''}" data-xi="${x.id}" data-xk="date" style="flex:0 0 140px;min-width:0"><button class="btn" onclick="delExam('${x.id}')">×</button></div>`).join('')}<button class="btn" onclick="addExam()">+ 시험</button></div>
 <h4>데일리 색</h4><div class="row"><span style="white-space:nowrap">분홍(시간≥) <input id="rH" type="number" value="${settings.redHours}" style="max-width:70px;min-width:0;flex:none"></span><span style="white-space:nowrap">하늘(시간≥) <input id="sH" type="number" value="${settings.skyHours}" style="max-width:70px;min-width:0;flex:none"></span></div>
 <h4>달별 색 <small style="font-weight:400;color:#888">시트·격자·썸네일이 「보는 달」의 색을 씀</small></h4><div class="sub"><div class="row" style="flex-wrap:wrap">${[...Array(12)].map((_,i)=>`<span style="white-space:nowrap;font-size:10px">${i+1}월 <input type="color" id="mc${i}" value="${monthColor(i+1)}" style="flex:none;min-width:0;width:30px;padding:0;height:22px"></span>`).join('')}</div></div>
 <h4>시간</h4><div class="row"><label>하루 시작</label><span style="white-space:nowrap"><input id="dS" type="number" value="${dayStart()}" style="max-width:70px;min-width:0;flex:none"> 시</span></div>
 <h4>과목·색 <small style="font-weight:400;color:#888">둘이 공용 (settings.json)</small></h4><div class="sub" id="subjList">${settings.subjects.map((x,i)=>`<div class="row"><input value="${esc(x.n)}" data-i="${i}" data-k="n"><input type="color" value="${x.c}" data-i="${i}" data-k="c"><button class="btn" onclick="settings.subjects.splice(${i},1);render()">×</button></div>`).join('')}<button class="btn" onclick="settings.subjects.push({n:'새 과목',c:'#999999'});render()">+ 과목</button></div>
 <div class="row"><button class="btn p" onclick="applySettings()">설정 저장 (둘 다 반영)</button></div>
 <h4>계획 <small style="font-weight:400;color:#888">사람별 (plan/${esc(cfg.person)}.json)</small></h4>
 <div class="row"><label>요일별 처리량</label>${['월','화','수','목','금','토','일'].map((n,i)=>`<span style="font-size:10px">${n} <input id="pd${i}" type="number" min="0" value="${(myPlan().daily||[1,1,1,1,1,1,1])[i]}" style="width:44px;min-width:0;flex:none;padding:3px"></span>`).join('')}<span style="font-size:10px;color:#888">0 = 쉬는 날 · 주당 처리량을 이 비율로 나눔</span></div>
 <div class="row"><label>밀림 양보 순서</label><div style="flex:1">${yieldChips()}</div></div>
 <div class="row"><label>주차 기준일</label><input id="pWS" type="date" value="${esc(myPlan().weekStart||'2026-08-03')}" style="flex:0 0 140px"><span style="font-size:10px;color:#888">W1 의 월요일 (기본 2026-08-03)</span></div>
 <div class="row"><button class="btn p" onclick="applyPlanSettings()">계획 설정 저장 (${esc(cfg.person)})</button></div>
 <h4>기기</h4><div class="row"><button class="btn" onclick="exportLocal()">이 기기 데이터 내보내기(JSON)</button><button class="btn d" onclick="if(confirm('이 기기의 로컬 데이터를 지울까? 동기화 안 된 건 사라져.')){Object.keys(localStorage).filter(k=>k.startsWith('tt.')).forEach(k=>localStorage.removeItem(k));location.reload()}">로컬 초기화</button></div>
 <div class="warn">토큰은 각자 본인 것. 브라우저 저장소에만 두고 저장소에는 절대 올리지 않는다. 사람별 파일이라 충돌은 없고, 같은 사람이 두 기기에서 쓰면 세션 id 기준으로 합쳐진다.</div></div>`;
}
function applySettings(){
 document.querySelectorAll('#examList input[data-xi]').forEach(e=>{const x=settings.exams.find(z=>z.id===e.dataset.xi);if(x&&x[e.dataset.xk]!==e.value){x[e.dataset.xk]=e.value;x.u=Date.now()}});
 settings.redHours=+$('rH').value||10;settings.skyHours=+$('sH').value||6;settings.dayStart=+$('dS').value||5;
 settings.monthColors=[...Array(12)].map((_,i)=>($('mc'+i)&&$('mc'+i).value)||DEF_SETTINGS.monthColors[i]);
 document.querySelectorAll('#subjList input[data-i]').forEach(e=>{settings.subjects[+e.dataset.i][e.dataset.k]=e.value.trim()||e.value});
 saveSettings();toast('저장');render();
}
function addExam(){settings.exams.push({id:uid(),name:'새 시험',date:today(),u:Date.now(),del:false});render()}
function delExam(id){const x=settings.exams.find(z=>z.id===id);if(x&&confirm('시험을 지울까? '+x.name)){x.del=true;x.u=Date.now();render()}}
function yieldChips(){const ys=yieldOrder(myPlan());return ys.map((s,i)=>`<span style="display:inline-flex;align-items:center;gap:2px;border:1px solid #ddd;border-radius:10px;padding:1px 4px 1px 8px;margin:1px;font-size:10.5px"><i class="plandot" style="background:${subjColor(s)};width:7px;height:7px"></i>${esc(s)}<button class="btn" style="padding:0 4px;border:0" onclick="yieldMove(${i},-1)">↑</button><button class="btn" style="padding:0 4px;border:0" onclick="yieldMove(${i},1)">↓</button></span>`).join('')}
function yieldMove(i,n){planMut(p=>{const ys=yieldOrder(p);const j=i+n;if(j<0||j>=ys.length)return;const t=ys[i];ys[i]=ys[j];ys[j]=t;p.yield=ys},true);render()}
function applyPlanSettings(){planMut(p=>{p.daily=[0,1,2,3,4,5,6].map(i=>Math.max(0,+$('pd'+i).value||0));if($('pWS').value)p.weekStart=$('pWS').value},true);toast('계획 설정 저장 ('+cfg.person+')');render()}
function exportLocal(){const o={};Object.keys(localStorage).filter(k=>k.startsWith('tt.f.')).forEach(k=>o[k.slice(5)]=LS.get(k).data);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download=`timetable_${cfg.person}_${today()}.json`;a.click()}
/* ----- 작은 창 ----- */
let pipWin=null;
function pipPaint(){
 if(!pipWin||pipWin.closed){pipWin=null;return;}
 applyMonthColor(pipWin.document);
 const d=curDate();pipWin.document.body.innerHTML=`<div class="pipwrap">${sheetHTML(cfg.person,d,sessionsOf(cfg.person,d))}${mbarHTML()}</div>`;
}
async function pip(){
 if(!('documentPictureInPicture' in window)){toast('이 브라우저는 작은 창을 지원하지 않아 (크롬·엣지 PC 전용)');return;}
 if(pipWin&&!pipWin.closed){pipWin.focus();return;}
 try{const w=await documentPictureInPicture.requestWindow({width:520,height:520});pipWin=w;
  [...document.styleSheets].forEach(s=>{try{const st=w.document.createElement('style');st.textContent=[...s.cssRules].map(r=>r.cssText).join('\n');w.document.head.appendChild(st)}catch(e){}});
  const st=w.document.createElement('style');st.textContent='body{background:#fff;padding:6px;overflow:auto}.pipwrap{min-width:420px}.mbar .man span{display:none}.pipwrap .paper{grid-template-columns:5fr 6fr!important}.pipwrap .st{max-height:62vh;overflow:auto}';w.document.head.appendChild(st);
  ['startTimer','stopTimer','setForm','setMark','manualSave','editSession','render','curDate','setDate','addDays','today','toast'].forEach(n=>w[n]=window[n]);
  w.addEventListener('pagehide',()=>{pipWin=null});
  pipPaint();
 }catch(e){toast('작은 창 실패: '+e.message)}
}
setInterval(()=>{if(run&&pipWin&&!pipWin.closed)pipPaint()},60000);
/* ---------- 시작 ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
maybeAutoBaseline(); // 매달 1일 첫 실행 때 기준선 자동 고정
render();
if(cfg.token)syncAll(true);
</script>
