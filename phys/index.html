<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>물리 535 서재</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --paper:#F6F5F1; --card:#FFFFFF; --ink:#16181B; --muted:#6E7278; --line:#E3E2DC;
  --blue:#1F3A5F; --teal:#2E7D6F; --red:#B03A2E; --amber:#C8891B; --violet:#5B4B8A;
  --hi:#F2C230;
  --r:10px; --pad:14px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.45;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hide{display:none!important}

/* ---------- shell ---------- */
#lib{max-width:1100px;margin:0 auto;padding:0 var(--pad) 90px}
.top{position:sticky;top:0;z-index:20;background:var(--paper);padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:baseline;gap:10px;padding:16px 0 8px}
.brand h1{font-size:19px;margin:0;letter-spacing:-.02em}
.brand .sub{font-size:12px;color:var(--muted)}
.brand .spacer{flex:1}
.iconbtn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--card)}

/* progress spectrum — 535 cells */
.spectrum{display:grid;grid-template-columns:repeat(auto-fill,minmax(0,1fr));
  grid-auto-rows:10px;gap:1px;margin:6px 0 10px;
  grid-template-columns:repeat(107,1fr)}
.spectrum i{background:#DEDDD6;border-radius:1px;display:block}
.spectrum i.O.r1{background:#9CCCBE} .spectrum i.O.r2{background:#5FA695} .spectrum i.O.r3{background:#2E7D6F}
.spectrum i.X.r1{background:#E4A29A} .spectrum i.X.r2{background:#CD6A5B} .spectrum i.X.r3{background:#8E2A1F}
.spectrum i.Q.r1{background:#EBCF95} .spectrum i.Q.r2{background:#D8A945} .spectrum i.Q.r3{background:#A8710D}
#dl{font-size:12px;color:var(--blue);background:#F2F6FB;border:1px solid #C6D2E0;
  border-radius:8px;padding:7px 11px;margin:2px 0 8px}
#dl.err{color:var(--red);background:#FDF3F1;border-color:#EBC9C4}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.legend b{font-weight:600;color:var(--ink)}
.dotL{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:-1px;margin-right:4px}

/* filters */
.filters{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.6;margin-left:4px;font-size:11px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);font:inherit;font-size:14px}
.count{font-size:12px;color:var(--muted);padding:10px 2px 6px;display:flex;gap:10px;align-items:center}
.count .spacer{flex:1}

/* list */
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.item:active{background:#FAFAF7}
.num{font:600 12px/1.5 var(--mono);color:var(--muted);min-width:30px;text-align:right;padding-top:2px}
.body{flex:1;min-width:0}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.tag{font-size:10.5px;padding:1.5px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.Ec{color:var(--blue);border-color:#C6D2E0;background:#F2F6FB}
.tag.Hw{color:var(--violet);border-color:#D3CCE6;background:#F5F3FB}
.tag.Self{color:var(--muted)}
.tag.lv상{color:var(--red);border-color:#EBC9C4;background:#FDF3F1}
.tag.lv중{color:var(--amber);border-color:#EBDBBF;background:#FCF7EC}
.tag.past{color:var(--teal);border-color:#C3DDD6;background:#F0F7F5}
.tag.code{font-family:var(--mono);font-size:10px;letter-spacing:.02em}
.star{color:var(--hi);font-size:12px}
.sub{font-size:12px;color:var(--muted)}
.prev{font-size:13px;color:#3A3D42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mk{display:flex;flex-direction:column;gap:2px;align-items:flex-end;flex:none;margin-top:1px;min-width:24px}
.mk .h{display:flex;gap:2px;align-items:center}
.mk .h b{font:600 9px/1 var(--mono);color:#A9ACB1;width:7px;text-align:right}
.mk .h i{width:15px;height:15px;border-radius:4px;font:600 9.5px/15px -apple-system,sans-serif;
  text-align:center;font-style:normal;color:#fff}
.mk .h i.O{background:var(--teal)} .mk .h i.X{background:var(--red)} .mk .h i.Q{background:var(--amber)}
.mk .add{width:22px;height:22px;border-radius:6px;border:1px dashed var(--line);color:#B9BCC1;
  font-size:13px;line-height:20px;text-align:center}
.mk .tm{font:500 9.5px/1 var(--mono);color:#A9ACB1}
.grouphd{font-size:12px;font-weight:700;color:var(--muted);padding:16px 2px 7px;letter-spacing:.02em}
.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

/* ---------- viewer ---------- */
#view{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column}
.vtop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;
  border-bottom:1px solid var(--line);background:var(--paper);flex:none}
.vtop .title{flex:1;min-width:0}
.vtop .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .t2{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tm{font:600 14px/1 var(--mono);padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);min-width:56px;text-align:center}
#tm.off{color:#B9BCC1;border-style:dashed}
.histrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.histrow .rn{font:600 12px/1 var(--mono);color:var(--muted);width:38px}
.histrow .sel{display:flex;gap:5px;flex:1}
.histrow .sel button{flex:1;padding:6px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--card)}
.histrow .sel button.on{color:#fff;border-color:transparent}
.histrow .sel button.on[data-m=O]{background:var(--teal)}
.histrow .sel button.on[data-m=X]{background:var(--red)}
.histrow .sel button.on[data-m=Q]{background:var(--amber)}
.histrow .rm{color:#B9BCC1;font-size:16px;padding:0 4px}
.histrow .sec{font:500 11px/1 var(--mono);color:var(--muted);width:44px;text-align:right}
.stage{flex:1;overflow:auto;background:#8E8E88;display:flex;justify-content:center;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.stage.lock{overflow:hidden}
.wrap{position:relative;margin:10px auto;box-shadow:0 2px 14px rgba(0,0,0,.25);background:#fff;height:max-content}
.wrap canvas{display:block;position:absolute;top:0;left:0}
#inkc{touch-action:none}
#inkc.pen{touch-action:auto}
#pdfc{position:relative!important}
#mask{position:absolute;background:#EDECE6;border:1px solid #C4C2B9;border-radius:3px;
  display:grid;place-items:center;font-size:11px;color:#8A8880;cursor:move;z-index:5;
  touch-action:none;user-select:none}
#mask.drag{background:#E2E6EC;border-color:var(--blue);opacity:.9}
#mask .grip{position:absolute;right:-1px;bottom:-1px;width:22px;height:22px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 48%,#9A988F 48%,#9A988F 60%,transparent 60%,transparent 70%,#9A988F 70%,#9A988F 82%,transparent 82%)}
#mask .lbl{pointer-events:none;font-size:10.5px}
.vbot{flex:none;background:var(--paper);border-top:1px solid var(--line);
  padding:7px 8px calc(env(safe-area-inset-bottom) + 7px)}
.tools{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tl{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;flex:none;font-size:13px}
.tl.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sw{width:20px;height:20px;border-radius:50%}
.tl.hl .sw{border-radius:3px;height:11px}
.sep{width:1px;height:22px;background:var(--line);flex:none;margin:0 3px}
.tl.wide{width:auto;padding:0 10px;font-size:12px;gap:5px}
select.tl{width:auto;padding:0 6px;font-size:12px;-webkit-appearance:none;text-align:center}

/* sheets */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(20,20,20,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:86vh;overflow:auto}
.panel h2{font-size:16px;margin:0 0 4px}
.panel p{font-size:13px;color:var(--muted);margin:0 0 14px}
.panel .fld{margin-bottom:14px}
.panel label{font-size:12px;font-weight:600;display:block;margin-bottom:5px}
.btn{display:block;width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);font-size:14px;margin-bottom:7px;text-align:center}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.filelist{font-size:12.5px;color:var(--muted);font-family:var(--mono);line-height:1.8}
.filelist b{color:var(--teal)} .filelist s{color:var(--red);text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);
  background:rgba(22,24,27,.93);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:99}
.thsheet .panel{max-height:92vh;border-radius:16px 16px 0 0}
.thtabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}
.thtabs::-webkit-scrollbar{display:none}
.thtabs button{white-space:nowrap;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  font-size:12.5px;color:var(--muted);background:var(--card)}
.thtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.thsec h3{font-size:13px;color:var(--blue);margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.thl{font-size:13.5px;line-height:1.7;padding:1px 0;word-break:break-word}
.thl.i1{padding-left:14px} .thl.i2{padding-left:28px} .thl.i3{padding-left:42px} .thl.i4{padding-left:56px}
.thl.star{background:#FDF8E8;border-left:2px solid var(--hi);padding-left:8px;margin-left:-2px;border-radius:0 4px 4px 0}
.thl.star.i1{padding-left:22px} .thl.star.i2{padding-left:36px} .thl.star.i3{padding-left:50px}
.thbr{height:9px}
.thimg,.thref{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--muted);margin:0 3px;vertical-align:1px}
.thref{color:var(--blue);border-color:#C6D2E0;background:#F2F6FB;cursor:pointer}
.thfoot{position:sticky;bottom:0;background:var(--card);padding-top:10px;margin-top:6px;
  border-top:1px solid var(--line)}
.katex{font-size:1.02em}
.ansbox{font-size:14px;padding:10px 12px;background:#F0F7F5;border:1px solid #C3DDD6;border-radius:9px;
  margin:8px 0 0;word-break:break-all}
.ansbox b{color:var(--teal)}
@media (min-width:760px){
  .item{padding:13px 15px}
  .stage{padding:0 20px}
}
</style>
</head>
<body>

<!-- ===================== 서재 ===================== -->
<div id="lib">
  <div class="top">
    <div class="brand">
      <h1>물리 535 서재</h1>
      <span class="sub">알기 쉬운 변리사 물리 · 기본교재</span>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnSet">설정</button>
    </div>
    <div id="dl" class="hide"></div>
    <div class="spectrum" id="spec"></div>
    <div class="legend">
      <span><i class="dotL" style="background:#DEDDD6"></i>안 품 <b id="c0">0</b></span>
      <span><i class="dotL" style="background:var(--teal)"></i>맞음 <b id="cO">0</b></span>
      <span><i class="dotL" style="background:var(--amber)"></i>헷갈림 <b id="cQ">0</b></span>
      <span><i class="dotL" style="background:var(--red)"></i>틀림 <b id="cX">0</b></span>
    </div>
    <div class="filters">
      <input class="search" id="q" placeholder="검색어 코드(PEM0301), 소단원, 문제 본문으로 검색">
      <div class="row" id="fBig"></div>
      <div class="row" id="fEtc"></div>
    </div>
  </div>
  <div class="count"><span id="cnt"></span><span class="spacer"></span>
    <button class="chip" id="btnFormula">공식 보기</button>
    <button class="chip" id="btnRand">랜덤으로 풀기</button>
    <button class="chip" id="btnFirst">처음부터 풀기</button>
  </div>
  <div id="list"></div>
</div>

<!-- ===================== 뷰어 ===================== -->
<div id="view" class="hide">
  <div class="vtop">
    <button class="iconbtn" id="vBack">서재</button>
    <div class="title"><div class="t1" id="vT1"></div><div class="t2" id="vT2"></div></div>
    <button id="tm">0:00</button>
    <button class="iconbtn" id="vPrev">◀</button>
    <button class="iconbtn" id="vNext">▶</button>
  </div>
  <div class="stage" id="stage">
    <div class="wrap" id="wrap">
      <canvas id="pdfc"></canvas>
      <canvas id="inkc"></canvas>
      <div id="mask" class="hide"><span class="lbl">답 가림 · 탭하면 보임 · 끌면 이동</span><span class="grip"></span></div>
    </div>
  </div>
  <div class="vbot">
    <div class="tools">
      <button class="tl" data-pen="#16181B"><span class="sw" style="background:#16181B"></span></button>
      <button class="tl" data-pen="#B03A2E"><span class="sw" style="background:#B03A2E"></span></button>
      <button class="tl" data-pen="#1F3A5F"><span class="sw" style="background:#1F3A5F"></span></button>
      <button class="tl hl" data-hl="#F2C230"><span class="sw" style="background:#F2C230"></span></button>
      <button class="tl hl" data-hl="#7FD1AE"><span class="sw" style="background:#7FD1AE"></span></button>
      <button class="tl" id="tErase">지우개</button>
      <button class="tl" id="tUndo">↺</button>
      <select class="tl" id="tW"><option value="1">가늘게</option><option value="2" selected>보통</option><option value="3.4">굵게</option></select>
      <span class="sep"></span>
      <select class="tl" id="tLayer"></select>
      <button class="tl" id="tLayerAdd">+회독</button>
      <button class="tl" id="tLayerEye">👁</button>
      <span class="sep"></span>
      <button class="tl wide" id="tTheory">공식</button>
      <button class="tl wide" id="tAns">답 보기</button>
      <button class="tl" id="tLock">🔒</button>
      <button class="tl" id="tRot">⟳</button>
      <button class="tl" id="tZoom">＋</button>
      <span class="sep"></span>
      <button class="tl" id="mO" style="color:var(--teal)">O</button>
      <button class="tl" id="mQ" style="color:var(--amber)">△</button>
      <button class="tl" id="mX" style="color:var(--red)">X</button>
      <button class="tl wide" id="tHist">기록</button>
      <button class="tl wide" id="tCode">검색어</button>
    </div>
  </div>
</div>

/* ---------------- IndexedDB ---------------- */
let db;
function open(){return new Promise((ok,no)=>{
  const r=indexedDB.open('phys535',1);
  r.onupgradeneeded=e=>{const d=e.target.result;
    d.createObjectStore('pdf');d.createObjectStore('ink');d.createObjectStore('kv');};
  r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>no(r.error);});}
function tx(s,m){return db.transaction(s,m).objectStore(s)}
function get(s,k){return new Promise(ok=>{const r=tx(s,'readonly').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}
function put(s,k,v){return new Promise(ok=>{const r=tx(s,'readwrite').put(v,k);r.onsuccess=()=>ok(1);r.onerror=()=>ok(0)})}
function del(s,k){return new Promise(ok=>{const r=tx(s,'readwrite').delete(k);r.onsuccess=()=>ok(1);r.onerror=()=>ok(0)})}
function keys(s){return new Promise(ok=>{const r=tx(s,'readonly').getAllKeys();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])})}
function all(s){return new Promise(ok=>{const r=tx(s,'readonly').getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])})}

function migrate(){
  let ch=0;

    if(v&&!v.h){const n=Math.max(1,v.r||1),h=[];
      for(let i=0;i<n;i++)h.push({m:i===n-1?v.m:'O',t:v.t||Date.now()});
      ST[k]={h};ch=1}}
  return ch;
}
const hist=no=>((ST[no]||{}).h)||[];

/* 저장소에 함께 올려 둔 PDF를 받아 온다 — 기기마다 다시 넣지 않아도 되게 */
async function tryRemote(url,key){
  try{
    const r=await fetch('pdf/'+url+'.pdf',{cache:'no-cache'});
    if(!r.ok)return 0;
    const buf=await r.arrayBuffer();
    const head=String.fromCharCode.apply(null,new Uint8Array(buf.slice(0,5)));
    if(head.indexOf('%PDF')<0)return 0;          // 404 페이지가 온 경우
    await put('pdf',key,buf);return 1;
  }catch(e){return 0}
}
async function ensureFiles(force){
  if(MERGED&&!force)return;
  const need=FILES.filter(f=>force||!HAVE[f]);
  const bar=$('#dl');
  if(!need.length)return;
  bar.classList.remove('hide','err');
  let got=0;
  for(let i=0;i<need.length;i++){
    bar.textContent=`시험지 받는 중 — ${i+1}/${need.length}`;
    if(await tryRemote(need[i],need[i]))got++;
  }
  if(!got&&!HAVE['ALL']&&await tryRemote('all','ALL'))got++;
  await loadHave();draw();renderSettings();
  if(got){bar.textContent=`시험지 ${got}개를 받았습니다`;setTimeout(()=>bar.classList.add('hide'),2500)}
  else if(force){bar.classList.add('err');bar.textContent='저장소에서 PDF를 찾지 못했습니다 — pdf 폴더에 111.pdf~666.pdf가 있는지 확인하세요'}
  else bar.classList.add('hide');
}

async function addFiles(fileList){

    let n=0;

    let id=null;

let VNO=null, VDOC=null, VDOCID=null, VPAGE=null, VLIST=[];
let TOOL={mode:'pen',color:'#16181B',w:2};
let LAYER=0, LAYERS=1, HIDEOLD=false;
let INK={};   // layerIndex -> [ {c,w,hl,p:[u,v,...]} ]
let RENDER={W:0,H:0,rot:0,scale:1};

async function renderPage(loc){
  const c=$('#pdfc');
  if(!HAVE[loc.id]){
    const ctx=c.getContext('2d');const W=760,H=1080;
    c.width=W;c.height=H;c.style.width=W/2+'px';c.style.height=H/2+'px';
    $('#wrap').style.width=W/2+'px';$('#wrap').style.height=H/2+'px';
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#6E7278';ctx.font='600 26px -apple-system,sans-serif';ctx.textAlign='center';
    ctx.fillText('PDF가 아직 등록되지 않았습니다',W/2,H/2-30);
    ctx.font='20px -apple-system,sans-serif';
    ctx.fillText('설정 → PDF 등록에서 '+(MERGED?'통합본':loc.id+'번 파일')+'을 넣어주세요',W/2,H/2+10);
    const ink=$('#inkc');ink.width=W;ink.height=H;ink.style.width=c.style.width;ink.style.height=c.style.height;
    RENDER={W,H,rot:0,scale:1};return;
  }
  if(VDOCID!==loc.id){
    const buf=await get('pdf',loc.id);
    VDOC=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;VDOCID=loc.id;
  }
  const page=await VDOC.getPage(Math.min(loc.page,VDOC.numPages));VPAGE=page;
  const rot=(SET.rot[loc.id]||0);
  const stage=$('#stage');
  const avail=Math.min(stage.clientWidth-24, 900)*SET.zoom;
  const base=page.getViewport({scale:1,rotation:rot});
  const scale=avail/base.width;
  const dpr=Math.max(2,Math.min(3,window.devicePixelRatio||1));
  const vp=page.getViewport({scale:scale*dpr,rotation:rot});
  const W=Math.round(vp.width),H=Math.round(vp.height);
  const cssW=Math.round(W/dpr),cssH=Math.round(H/dpr);
  c.width=W;c.height=H;c.style.width=cssW+'px';c.style.height=cssH+'px';
  const ink=$('#inkc');ink.width=W;ink.height=H;ink.style.width=cssW+'px';ink.style.height=cssH+'px';
  $('#wrap').style.width=cssW+'px';$('#wrap').style.height=cssH+'px';
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  RENDER={W,H,rot,scale:scale*dpr};
}

/* 좌표: 저장은 항상 회전 전 페이지 기준 정규화(u,v) → 회전해도 필기가 어긋나지 않음 */
function toNorm(x,y){const{W,H,rot}=RENDER;
  if(rot===90)return[y/H,1-x/W];
  if(rot===180)return[1-x/W,1-y/H];
  if(rot===270)return[1-y/H,x/W];
  return[x/W,y/H];}
function toPix(u,v){const{W,H,rot}=RENDER;
  if(rot===90)return[(1-v)*W,u*H];
  if(rot===180)return[(1-u)*W,(1-v)*H];
  if(rot===270)return[v*W,(1-u)*H];
  return[u*W,v*H];}

function paintInk(){
  const c=$('#inkc'),g=c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  Object.keys(INK).map(Number).sort((a,b)=>a-b).forEach(L=>{
    if(HIDEOLD&&L!==LAYER)return;
    const old=L<LAYER;
    (INK[L]||[]).forEach(s=>{
      g.save();
      g.globalAlpha=s.hl?0.32:(old?0.30:1);
      g.strokeStyle=s.c;g.lineWidth=(s.hl?9:s.w)*RENDER.scale/2;
      g.lineCap=s.hl?'butt':'round';g.lineJoin='round';
      g.beginPath();
      for(let i=0;i<s.p.length;i+=2){const[x,y]=toPix(s.p[i],s.p[i+1]);i?g.lineTo(x,y):g.moveTo(x,y)}
      g.stroke();g.restore();
    });
  });
}

/* 그리는 중에는 새로 생긴 구간만 덧그린다 — 매번 전체를 다시 그리면 끊긴다 */
function drawSeg(s,from){
  const g=$('#inkc').getContext('2d');
  g.save();
  g.globalAlpha=1;g.strokeStyle=s.c;g.lineWidth=s.w*RENDER.scale/2;
  g.lineCap='round';g.lineJoin='round';
  g.beginPath();
  for(let i=Math.max(0,from-2);i<s.p.length;i+=2){
    const[x,y]=toPix(s.p[i],s.p[i+1]);
    i===Math.max(0,from-2)?g.moveTo(x,y):g.lineTo(x,y);
  }
  g.stroke();g.restore();
}

/* ---------------- 필기 입력 ---------------- */
let drawing=null;
const inkc=()=>$('#inkc');
function local(e){const b=inkc().getBoundingClientRect();
  return[(e.clientX-b.left)/b.width*RENDER.W,(e.clientY-b.top)/b.height*RENDER.H]}

$('#inkc').addEventListener('pointerdown',e=>{
  if(SET.pencil&&e.pointerType!=='pen')return;
  if(e.pointerType==='touch'&&!SET.pencil&&e.isPrimary===false)return;
  if(!HAVE[locate(rec(VNO)).id])return;
  inkc().setPointerCapture(e.pointerId);
  const[x,y]=local(e);
  if(TOOL.mode==='erase'){eraseAt(x,y);drawing={erase:1};return}
  const s={c:TOOL.color,w:TOOL.w,hl:TOOL.mode==='hl'?1:0,p:[]};
  const n=toNorm(x,y);s.p.push(n[0],n[1]);
  (INK[LAYER]=INK[LAYER]||[]).push(s);drawing=s;
  e.preventDefault();
},{passive:false});

$('#inkc').addEventListener('pointermove',e=>{
  if(!drawing)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  if(drawing.erase){evs.forEach(ev=>{const[x,y]=local(ev);eraseAt(x,y)});return}
  const from=drawing.p.length;
  evs.forEach(ev=>{const[x,y]=local(ev);const n=toNorm(x,y);drawing.p.push(n[0],n[1])});
  if(drawing.hl)paintInk();else drawSeg(drawing,from);
  e.preventDefault();
},{passive:false});

function endDraw(){if(!drawing)return;drawing=null;paintInk();saveInk()}

/* 아이패드: 펜슬이 닿은 동안에는 스크롤을 막고, 손가락일 때만 스크롤을 넘긴다 */
function stylusGuard(e){
  const t=e.touches&&e.touches[0];
  if(!t)return;
  if(!SET.pencil){e.preventDefault();return}      // 손가락으로 필기하는 모드
  if(t.touchType==='stylus')e.preventDefault();   // 펜슬 모드: 펜슬만 막고 손가락은 스크롤
}
['touchstart','touchmove'].forEach(k=>
  $('#inkc').addEventListener(k,stylusGuard,{passive:false}));
$('#inkc').addEventListener('pointerup',endDraw);
$('#inkc').addEventListener('pointercancel',endDraw);

function eraseAt(x,y){
  const R=14*RENDER.scale/2, arr=INK[LAYER]||[];
  for(let i=arr.length-1;i>=0;i--){
    const s=arr[i];
    for(let k=0;k<s.p.length;k+=2){const[px,py]=toPix(s.p[k],s.p[k+1]);
      if(Math.hypot(px-x,py-y)<R){arr.splice(i,1);break}}
  }
  paintInk();
}
let saveT;function saveInk(){clearTimeout(saveT);saveT=setTimeout(()=>put('ink',String(VNO),INK),300)}

/* ---------------- 레이어 ---------------- */
function fillLayerSel(){

}
$('#tLayer').onchange=e=>{LAYER=+e.target.value;paintInk()};
$('#tLayerAdd').onclick=()=>{const n=Math.max(...Object.keys(INK).map(Number))+1;INK[n]=[];LAYER=n;LAYERS=n+1;
  fillLayerSel();paintInk();saveInk();toast((n+1)+'회독 레이어를 추가했습니다')};

  toast(HIDEOLD?'현재 회독만 보기':'모든 회독 겹쳐 보기')};

/* ---------------- 답 가리개 ----------------
   위치는 회전 전 페이지 기준 정규화 좌표로 다룬다.
   기본값은 PDF 글자층에서 '답'을 찾아 자동으로 맞추고, 끌어서 옮기면 그 문제에 저장된다. */
let MASK=null;

function cssDpr(){return RENDER.W/Math.max(1,$('#wrap').clientWidth)}
function normToCss(u,v){const d=cssDpr(),[x,y]=toPix(u,v);return[x/d,y/d]}
function cssToNorm(x,y){const d=cssDpr();return toNorm(x*d,y*d)}

async function detectAnswer(page){
  try{
    const vp=page.getViewport({scale:1,rotation:0});
    const tc=await page.getTextContent();
    let best=null;
    for(const it of tc.items){
      if(!it.str||it.str.indexOf('답')<0)continue;
      const tr=pdfjsLib.Util.transform(vp.transform,it.transform);
      const h=Math.abs(tr[3])||it.height||10;
      const x=tr[4],y=tr[5]-h;
      if(y/vp.height>0.5)continue;
      if(!best||y<best.y)best={x,y,h};
    }
    if(!best)return null;
    const u=Math.max(0,best.x/vp.width-0.012), v=Math.max(0,best.y/vp.height-0.010);
    return {u,v,w:1.002-u,h:(best.h/vp.height)*2.6};
  }catch(e){return null}
}

async function setupMask(page){
  MASK = MPOS[VNO] || (page?await detectAnswer(page):null) || {u:0.27,v:0.10,w:0.71,h:0.030};
  updateMask();
}
function updateMask(){
  const m=$('#mask');
  if(!SET.mask||!MASK||!VNO||!HAVE[locate(rec(VNO)).id]){m.classList.add('hide');return}
  m.classList.remove('hide');
  layoutMask();
}
function layoutMask(){
  const m=$('#mask'),f=MPOS[VNO]?1:SET.maskH;
  const [ax,ay]=normToCss(MASK.u,MASK.v);
  const [bx,by]=normToCss(MASK.u+MASK.w,MASK.v+MASK.h*f);
  m.style.left=Math.round(Math.min(ax,bx))+'px';
  m.style.top=Math.round(Math.min(ay,by))+'px';
  m.style.width=Math.round(Math.abs(bx-ax))+'px';
  m.style.height=Math.round(Math.max(20,Math.abs(by-ay)))+'px';
}

/* 탭하면 열림 · 끌면 이동 · 오른쪽 아래 모서리로 크기 조절 */
(function maskDrag(){
  const m=$('#mask');let st=null;
  m.addEventListener('pointerdown',e=>{
    try{m.setPointerCapture(e.pointerId)}catch(_){}
    st={x:e.clientX,y:e.clientY,l:m.offsetLeft,t:m.offsetTop,
        w:m.offsetWidth,h:m.offsetHeight,
        resize:e.target.classList.contains('grip'),moved:false};
    e.preventDefault();e.stopPropagation();
  });
  m.addEventListener('pointermove',e=>{
    if(!st)return;
    const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.moved&&Math.hypot(dx,dy)<5)return;
    st.moved=true;m.classList.add('drag');
    if(st.resize){m.style.width=Math.max(30,st.w+dx)+'px';m.style.height=Math.max(16,st.h+dy)+'px'}
    else{m.style.left=(st.l+dx)+'px';m.style.top=(st.t+dy)+'px'}
    e.preventDefault();
  });
  const end=async()=>{
    if(!st)return;
    const wasMove=st.moved;st=null;m.classList.remove('drag');
    if(!wasMove){m.classList.add('hide');return}     // 그냥 탭 → 답 보이기
    const l=m.offsetLeft,t=m.offsetTop,w=m.offsetWidth,h=m.offsetHeight;
    const a=cssToNorm(l,t), b=cssToNorm(l+w,t+h);
    MASK={u:Math.min(a[0],b[0]),v:Math.min(a[1],b[1]),
          w:Math.abs(b[0]-a[0]),h:Math.abs(b[1]-a[1])};
    MPOS[VNO]=MASK;await put('kv','maskpos',MPOS);
    toast('이 문제의 가리개 위치를 저장했습니다');
  };
  m.addEventListener('pointerup',end);m.addEventListener('pointercancel',end);

function kx(el){

function secHTML(sec){

    if(n.t==='br')return '<div class="thbr"></div>';

    const ref=(n.r||[]).map(x=>`<span class="thref" data-ref="${esc(x)}">↗ ${esc(x)}</span>`).join('');
    return `<div class="thl i${n.i}${n.s?' star':''}">${esc(n.x)}${img}${ref}</div>`;

function secByRef(ref){
  const id=(ref.match(/^[\d.]+/)||[''])[0].replace(/\.$/,'');
  return secById(id)||THEORY.sec.find(x=>ref.includes(x.t));
}
function theorySheet(secs,title,code){

async function exportData(withPdf){
  toast('만드는 중…');

      let s='',u=new Uint8Array(buf);
      for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
      out.pdf[k]=btoa(s);
    }
  }
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`물리535_${withPdf?'전체':'필기'}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('내보냈습니다');
}
async function importData(f){
  if(!f)return;toast('불러오는 중…');

    const j=JSON.parse(await f.text());
    if(j.status){ST=j.status;await put('kv','status',ST)}
    if(j.set){SET=Object.assign(SET,j.set);await put('kv','set',SET)}
    if(j.maskpos){MPOS=j.maskpos;await put('kv','maskpos',MPOS)}
    if(migrate())await saveST();
    if(j.ink)for(const k in j.ink)await put('ink',k,j.ink[k]);
    if(j.pdf)for(const k in j.pdf){
      const bin=atob(j.pdf[k]),u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      await put('pdf',k,u.buffer);

    await loadHave();renderSettings();draw();toast('복원했습니다');

}

<script>
/* ===== 학습로그 요약 (2026-08-11 추가) =====================================
   오늘 푸었던 문제 기록(status.h 의 t 값)을 모아 요약 텍스트로 만든다.
   하루의 시작은 새벽 4시. 기존 데이터는 읽기만 한다. ==================== */
(function () {
  const DAY_START_HOUR = 4;
  function dayRange() {
    const now = new Date();
    const s = new Date(now); s.setHours(DAY_START_HOUR, 0, 0, 0);
    if (now.getTime() < s.getTime()) s.setDate(s.getDate() - 1);
    const e = new Date(s); e.setDate(e.getDate() + 1);
    return { start: s.getTime(), end: e.getTime(), label: s };
  }
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }

  function collect() {
    const R = dayRange();
    const st = (typeof ST === 'object' && ST) ? ST : {};
    const byMark = {};
    let n = 0, sec = 0;
    const nos = [];
    Object.keys(st).forEach(function (no) {
      const h = (st[no] && st[no].h) || [];
      h.forEach(function (rec) {
        if (!rec || !rec.t) return;
        if (rec.t < R.start || rec.t >= R.end) return;
        n++; nos.push(no);
        sec += (rec.s || 0);
        const m = rec.m || '?';
        byMark[m] = (byMark[m] || 0) + 1;
      });
    });
    return { date: ymd(R.label), n: n, sec: sec, byMark: byMark, nos: nos };
  }

  function buildText(d, memo) {
    if (!d.n) return d.date + ' — 오늘 풀이 기록이 없습니다.';
    const mk = Object.keys(d.byMark).map(function (k) { return k + ' ' + d.byMark[k]; }).join(' · ');
    const lines = ['[물리535 학습로그] ' + d.date];
    lines.push('- 풀이: ' + d.n + '문항 (' + mk + ')');
    if (d.sec) lines.push('- 소요: ' + Math.round(d.sec / 60) + '분');
    if (d.nos.length <= 30) lines.push('- 문항번호: ' + d.nos.join(', '));
    if (memo && memo.trim()) lines.push('메모: ' + memo.trim());
    return lines.join('\n');
  }

  function openPanel() {
    const data = collect();
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(17,24,39,.7);display:flex;align-items:center;justify-content:center;padding:16px';
    wrap.innerHTML =
      '<div style="background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,.25)">' +
        '<div style="font-weight:800;font-size:16px;margin-bottom:10px">📝 오늘 학습로그</div>' +
        '<textarea id="plg-text" style="width:100%;height:160px;font-size:12.5px;line-height:1.6;border:1px solid #e5e7eb;border-radius:10px;padding:10px;font-family:inherit"></textarea>' +
        '<input id="plg-memo" placeholder="한줄 메모 (깨달은 것·헷갈린 지점)" style="width:100%;margin-top:8px;border:1px solid #e5e7eb;border-radius:10px;padding:9px;font-size:13px">' +
        '<div style="display:flex;gap:8px;margin-top:12px">' +
          '<button id="plg-copy" style="flex:1;background:#111827;color:#fff;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer">복사하기</button>' +
          '<button id="plg-close" style="flex:0 0 90px;background:#f3f4f6;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer">닫기</button>' +
        '</div>' +
        '<div id="plg-msg" style="font-size:12px;color:#6b7280;margin-top:8px">복사해서 노션 · 클로드에 붙여넣으세요.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    const ta = wrap.querySelector('#plg-text'), memo = wrap.querySelector('#plg-memo');
    const render = function () { ta.value = buildText(data, memo.value); };
    render();
    memo.addEventListener('input', render);
    wrap.querySelector('#plg-close').onclick = function () { wrap.remove(); };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) wrap.remove(); });
    wrap.querySelector('#plg-copy').onclick = function () {
      ta.select();
      const done = function () { wrap.querySelector('#plg-msg').textContent = '복사됐습니다.'; };
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done).catch(function () { document.execCommand('copy'); done(); });
      else { document.execCommand('copy'); done(); }
    };
  }

  const btn = document.createElement('button');
  btn.textContent = '📝 학습로그';
  btn.style.cssText = 'position:fixed;right:14px;bottom:70px;z-index:99998;background:#111827;color:#fff;border:0;border-radius:999px;padding:11px 16px;font-weight:700;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer';
  btn.onclick = openPanel;
  if (document.body) document.body.appendChild(btn);
  else window.addEventListener('DOMContentLoaded', function () { document.body.appendChild(btn); });
})();
</script>
</body>
</html>
