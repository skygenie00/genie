/* ══════ 학습기록 자동 동기화 (2026-09-01) ══════
   비공개 `zzikkaplan/studyplandata` 의 `phys/기록.json` 한 파일에 열 개 키를 담는다.
   실측 7KB — 쪼개지 않는다. 1MB 를 넘으면 그때 나눈다.

   ⚠ `ink`(필기)와 `set`(설정)은 여기 없다. 필기는 그린 문항이 48개뿐인데도 19.65MB 라
     git 이력이 되돌릴 수 없게 커지고, 설정은 화면 크기·마스크 취향이라 기기마다 달라야 한다.

   ★ 기존 열 개 키의 **값 모양을 한 글자도 바꾸지 않는다.** 시각·묘비는 **옆에 따로** 쌓는다.
     phys_sync_u      "키|문항" → 마지막으로 만진 시각
     phys_sync_gone   "키|문항" → 지운 시각 (묘비)
     phys_sync_shadow 직전 도장 때의 값 사본 (대조용)
     phys_sync_meta   { lastSync, remoteSha }
   이 넷은 **기기별로 산다** — SYNC_KEYS 에 넣지 않는다.
   ⚠ 넷을 IndexedDB 가 아니라 localStorage 에 둔 이유 — 도장은 탭이 숨는 순간에도
     찍혀야 하는데 IndexedDB 쓰기는 그때 끝나지 못한다. localStorage 는 동기적이다. */
const REC_REPO='zzikkaplan/studyplandata', REC_BRANCH='main';
const REC_PATH=CUR.REC_PATH, REC_SET_PATH='settings.json';
const SYNC_KEYS=CARD_LAYER?CUR.SYNC_KEYS:SUBJ.phys.SYNC_KEYS;   /* 과목별 표 — 물리 11 · 카드 층(지학·생물) 14(+bogi·unit·bpit) · SUBJ 블록 참조 */
/* 키 → 이 앱의 전역. 열 개 다 「문항번호 → 값」 dict 다(실측 확인).
   ⚠ `ansfix` 만 늦게 읽힌다(loadAfix) — null 이면 건너뛴다. */
let MC={};            // no -> {w,h,s:[{c,w,hl,p:[u,v,… 1/1000 정수]}]}  손필기 암기카드 · kv/mcard · 카드 20KB 상한
let BG={},UN={},BP={};   // 지학: bogi = uid→{ㄱ:'O'|'Q'|'X'} · unit = uid→'n.n.n' · bpit = 교재 포스트잇 (물리 SYNC_KEYS 엔 없다)
const SYNC_REF={
  status :{g:()=>ST,   s:v=>{ST=v}},
  note   :{g:()=>CMT,  s:v=>{CMT=v}},
  qtype  :{g:()=>QT,   s:v=>{QT=v}},
  conc   :{g:()=>CX,   s:v=>{CX=v}},
  gpt    :{g:()=>GP,   s:v=>{GP=v}},
  twin   :{g:()=>TW,   s:v=>{TW=v}},
  ansfix :{g:()=>AFIX, s:v=>{AFIX=v}},
  frm    :{g:()=>FR,   s:v=>{FR=v}},
  maskpos:{g:()=>MPOS, s:v=>{MPOS=v}},
  omrpos :{g:()=>OPOS, s:v=>{OPOS=v}},
  mcard  :{g:()=>MC,   s:v=>{MC=v}},
  bogi   :{g:()=>BG,   s:v=>{BG=v}},
  unit   :{g:()=>UN,   s:v=>{UN=v}},
  bpit   :{g:()=>BP,   s:v=>{BP=v}}
};
const U_KEY=CUR.SYNC_PREFIX+'u', GONE_KEY=CUR.SYNC_PREFIX+'gone',
      SHADOW_KEY=CUR.SYNC_PREFIX+'shadow', SMETA_KEY=CUR.SYNC_PREFIX+'meta';
const lsObj=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}};
const lsPut=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ckey=(k,c)=>k+'|'+c;
const csplit=s=>{const i=s.indexOf('|');return[s.slice(0,i),s.slice(i+1)]};

/* 토큰은 tt·민법OX 와 **같은 칸**을 쓴다 — 셋 다 skygenie00.github.io 라 오리진이 같다.
   ⚠ 없을 수 있다. 홈화면 웹앱 통은 백지로 시작한다(2026-08-29 실측) — 설정에 입력 칸이 있다. */
function ttCfg(){try{return JSON.parse(localStorage.getItem('tt.cfg')||'{}')||{}}catch(e){return{}}}
const recToken=()=>String(ttCfg().token||'').trim();
const recWho=()=>ttCfg().person||'알수없음';
function recSaveToken(t){
  const c=ttCfg();c.token=String(t||'').trim();
  if(!c.person)c.person='꼬까';
  if(c.lastSync==null)c.lastSync=0;
  try{localStorage.setItem('tt.cfg',JSON.stringify(c))}catch(e){}
}

/* ---------- 도장 찍기 ----------
   저장하는 자리를 하나도 고치지 않는다. 그림자와 대조해 여기 한 곳에서 찍는다.
   ⚠ 알려진 한계 — 도장은 「바꾼 순간」이 아니라 최대 10초 뒤다.
   ⚠ 회독은 예외 — status[문항].h[].t 가 진짜 시각이다. 새로 만들지 않는다. */
const stTime=v=>{const h=(v||{}).h;return(h&&h.length)?(h[h.length-1].t||0):0};
function stampAll(){
  const now=Date.now();
  const u=lsObj(U_KEY),gone=lsObj(GONE_KEY),shadow=lsObj(SHADOW_KEY);
  let n=0;
  for(const k of SYNC_KEYS){
    const cur=SYNC_REF[k].g();
    if(!cur)continue;                       /* ansfix — 아직 안 읽혔다 */
    const old=shadow[k]||{};
    for(const c in cur){
      if(JSON.stringify(cur[c])!==JSON.stringify(old[c])){
        u[ckey(k,c)]=(k==='status'?stTime(cur[c]):0)||now;
        delete gone[ckey(k,c)];n++;
      }
    }
    for(const c in old){
      if(!(c in cur)){gone[ckey(k,c)]=now;delete u[ckey(k,c)];n++}
    }
    shadow[k]=cur;
  }
  lsPut(U_KEY,u);lsPut(GONE_KEY,gone);lsPut(SHADOW_KEY,shadow);
  return n;
}

/* ---------- 병합 — 칸 단위 최신 승 · 무승부는 원격 ---------- */
async function recMerge(remote){
  const u=lsObj(U_KEY),gone=lsObj(GONE_KEY);
  const rU=remote.u||{},rG=remote.gone||{},rD=remote.data||{};
  const byKey={};
  const add=s=>{const p=csplit(s);if(!byKey[p[0]])byKey[p[0]]=new Set();byKey[p[0]].add(p[1])};
  Object.keys(rU).forEach(add);Object.keys(rG).forEach(add);
  let took=0,kept=0,del=0;const dirty={};
  for(const k of SYNC_KEYS){
    const cur=SYNC_REF[k].g();
    if(!cur)continue;
    const cells=byKey[k]||new Set();
    Object.keys(rD[k]||{}).forEach(c=>cells.add(c));
    for(const c of cells){
      const ck=ckey(k,c);
      const mine=Math.max(u[ck]||0,gone[ck]||0);
      const theirs=Math.max(rU[ck]||0,rG[ck]||0);
      if(theirs===0||theirs<mine){kept++;continue}          /* 내 쪽이 이긴다 */
      if((rG[ck]||0)>=(rU[ck]||0)&&(rG[ck]||0)>0){
        /* 원격이 지웠다 — ★ 지운 것이 되살아나면 안 된다 */
        if(c in cur){delete cur[c];del++;dirty[k]=1}
        gone[ck]=rG[ck];delete u[ck];
      }else if(rD[k]&&Object.prototype.hasOwnProperty.call(rD[k],c)){
        cur[c]=rD[k][c];u[ck]=rU[ck];delete gone[ck];took++;dirty[k]=1;
      }
    }
  }
  lsPut(U_KEY,u);lsPut(GONE_KEY,gone);
  for(const k in dirty)await put('kv',k,SYNC_REF[k].g());
  /* ★ 그림자도 같이 갱신한다 — 안 하면 다음 stampAll 이
     「원격에서 받은 것」을 「내가 바꾼 것」으로 오인해 도장을 새로 찍는다. */
  const shadow=lsObj(SHADOW_KEY);
  SYNC_KEYS.forEach(k=>{const v=SYNC_REF[k].g();if(v)shadow[k]=v});
  lsPut(SHADOW_KEY,shadow);
  return{took,kept,del,dirty:Object.keys(dirty)};
}

function recPayload(){
  /* ★ data 는 SYNC_KEYS 만 돌며 만든다 — `ink` 가 들어갈 길이 없다(P5). */
  const data={};SYNC_KEYS.forEach(k=>{data[k]=SYNC_REF[k].g()||{}});
  return{v:1,savedAt:new Date().toISOString(),by:recWho(),
         data:data,u:lsObj(U_KEY),gone:lsObj(GONE_KEY)};
}
function recPending(){
  const last=(lsObj(SMETA_KEY)).lastSync||0;
  const u=lsObj(U_KEY),g=lsObj(GONE_KEY);
  let n=0;
  for(const x in u)if(u[x]>last)n++;
  for(const x in g)if(g[x]>last)n++;
  return n;
}

/* ---------- GitHub Contents API — tt·민법OX 와 같은 저장소·같은 토큰 ---------- */
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
function ghUrl(path){
  return 'https://api.github.com/repos/'+REC_REPO+'/contents/'+encodeURI(path)+'?ref='+REC_BRANCH+'&t='+Date.now();
}
async function ghRaw(path){
  const r=await fetch(ghUrl(path),{headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github.raw'},cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('GET '+path+' '+r.status);
  return await r.text();
}
async function ghSha(path){
  const r=await fetch(ghUrl(path),{headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('SHA '+path+' '+r.status);
  return (await r.json()).sha;
}
async function ghPutJson(path,text,sha){
  const body={message:recWho()+' · '+path,content:b64enc(text),branch:REC_BRANCH};
  if(sha)body.sha=sha;
  const r=await fetch('https://api.github.com/repos/'+REC_REPO+'/contents/'+encodeURI(path),
    {method:'PUT',headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return 'conflict';
  if(!r.ok)throw new Error('PUT '+path+' '+r.status);
  return (await r.json()).content.sha;
}

/* ---------- 동기화 ---------- */
let recBusy=false, recErr='';
function recAfterMerge(res){
  if(!res||!res.dirty.length)return;
  if(CARD_LAYER&&typeof refreshUnits==='function'&&DATA.length)refreshUnits();
  if(res.dirty.indexOf('conc')>=0)buildCQ();
  try{draw();renderSettings()}catch(e){}
}
async function syncRecords(force){
  if(recBusy)return;
  if(!recToken()){recPaint();return}
  if(navigator.onLine===false){recPaint();return}
  recBusy=true;recErr='';recPaint();
  try{
    await loadAfix();                 /* ⚠ AFIX 가 null 이면 빈 ansfix 를 올려 원격을 깎는다 */
    stampAll();
    let sha=await ghSha(REC_PATH);
    if(sha){
      const txt=await ghRaw(REC_PATH);
      if(txt){try{recAfterMerge(await recMerge(JSON.parse(txt)))}catch(e){console.warn('원격 기록 파싱 실패',e)}}
    }
    stampAll();
    let res=await ghPutJson(REC_PATH,JSON.stringify(recPayload()),sha);
    if(res==='conflict'){                                  /* 한 번만 재시도 */
      sha=await ghSha(REC_PATH);
      const txt2=await ghRaw(REC_PATH);
      if(txt2){try{recAfterMerge(await recMerge(JSON.parse(txt2)))}catch(e){}}
      stampAll();
      res=await ghPutJson(REC_PATH,JSON.stringify(recPayload()),sha);
      if(res==='conflict')throw new Error('두 번 다 충돌');
    }
    lsPut(SMETA_KEY,{lastSync:Date.now(),remoteSha:res});
  }catch(e){
    /* ⚠ 조용히 넘어가되 **칩에는 남긴다.**
       8/29 에 조용한 실패 때문에 원인을 세 번 잘못 짚었다. */
    recErr=e.message||'실패';
    console.warn('기록 동기화 건너뜀:',recErr);
  }
  recBusy=false;recPaint();
}

/* ---------- 시험 D-day — 날짜를 앱에 박지 않는다 ----------
   zzikkaTT 의 settings.json 에서 `exams` 와 **논리일 `dayStart` 를 같이** 읽는다.
   ⚠ 안 그러면 새벽에 두 앱의 D- 가 하루 어긋난다. 못 읽으면 칩을 아예 안 그린다. */
let RECSET=null;
async function loadExamSettings(){
  if(!recToken())return null;
  try{const t=await ghRaw(REC_SET_PATH);RECSET=t?JSON.parse(t):null}
  catch(e){RECSET=null}
  recPaint();return RECSET;
}
function recLogicalYmd(){
  const ds=(RECSET&&typeof RECSET.dayStart==='number')?RECSET.dayStart:5;
  const d=new Date();
  if(d.getHours()<ds)d.setDate(d.getDate()-1);
  d.setHours(0,0,0,0);
  return d;
}
function recNextExam(){
  if(!RECSET||!Array.isArray(RECSET.exams))return null;
  const ex=RECSET.exams.filter(e=>e&&!e.del&&e.date).sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
  if(!ex.length)return null;
  const t=recLogicalYmd();
  const p=n=>(n<10?'0':'')+n;
  const ymd=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());
  return ex.find(e=>e.date>=ymd)||ex[ex.length-1];
}
function recExamText(){
  const e=recNextExam();if(!e)return'';
  const t=recLogicalYmd();
  const d=new Date(e.date+'T00:00:00');
  const n=Math.ceil((d-t)/864e5);
  return (e.name||'시험')+' '+(n>=0?'D-'+n:'D+'+(-n));
}

/* ---------- 헤더 칩 ---------- */
function recPaint(){
  const el=$('#recChip');
  if(el){
    let t,bad=false;
    if(recBusy)t='⟳ 동기화 중';
    else if(!recToken()){t='○ 토큰 없음';bad=true}

async function peekInk(no,cv,R){
  const ink=await get('ink',String(no)); if(!ink)return 0;
  const layers=Object.keys(ink).map(Number).sort((a,b)=>a-b); if(!layers.length)return 0;
  const cur=layers[layers.length-1], g=cv.getContext('2d'); let n=0;
  const px=(u,v)=>{const{W,H,rot}=R; if(rot===90)return[(1-v)*W,u*H]; if(rot===180)return[(1-u)*W,(1-v)*H]; if(rot===270)return[v*W,(1-u)*H]; return[u*W,v*H]};
  layers.forEach(L=>{ if(HIDEOLD&&L!==cur)return; const old=L<cur;
    (ink[L]||[]).forEach(s=>{ if(!s.p||s.p.length<2)return; n++;
      g.save(); g.globalAlpha=s.hl?0.32:(old?0.30:1); g.strokeStyle=s.c; g.lineWidth=(s.hl?9:s.w)*R.scale/2; g.lineCap=s.hl?'butt':'round'; g.lineJoin='round'; g.beginPath();
      for(let i=0;i<s.p.length;i+=2){const[x,y]=px(s.p[i],s.p[i+1]);i?g.lineTo(x,y):g.moveTo(x,y)} g.stroke(); g.restore(); }); });
  return n;
}

    st.l=Math.max(0,Math.min(window.innerWidth-st.w,st.l));st.t=Math.max(0,Math.min(window.innerHeight-st.h,st.t));return st};

    c.절.forEach(s=>{TOC.sec[s.절]={name:s.이름,ch:c.장,units:s.항목.map(u=>u.코드),p:(s.항목[0]||{}).쪽||''};
      s.항목.forEach(u=>{TOC.unit[u.코드]={name:u.이름,p:u.쪽,sec:s.절,ch:c.장}})})});

function buildData(items,toc,pieces){
  buildToc(toc);PIECES=pieces;

  items.forEach((it,i)=>{

    const row=[i+1,+it.문제쪽||0,it.그림?'IMG':'TXT',0,'','',+it.문번||it.문번,0,'',it.uid,G?(+it.연도||''):'',G?'변리사':'확인','',String(it.정답||''),
      it.문항||'','',(it.단원==='미분류'?'':it.단원)||(G?'':it.uid[1]),+it.교재쪽||0,it.선택지||[],it.보기||[],it.해설||'',+it.해설쪽||0,+it.회차||'',it.단원후보||'',it.비고||'',it.원형회차||''];

/* 단원(사용자 매칭 우선)에서 장·절 라벨을 다시 매긴다 — 필터·그룹 머리가 이걸 본다 */
function refreshUnits(){
  DATA.forEach(r=>{
    const u=UN[r[F.CODE]]!==undefined?UN[r[F.CODE]]:r[F.UNIT];
    const ch=u?chOf(u):(isC(r)?r[F.CODE][1]:'');
    r[F.BIG]=ch?ch+'. '+((TOC.ch[ch]||{}).name||''):'미분류';
    const sec=u&&u.split('.').length>=2?secOf(u):'';
    r[F.SUB]=sec?sec+' '+((TOC.sec[sec]||{}).name||''):(isC(r)?'(미매칭)':'(미분류)');
  });
}
titleOf=r=>(isC(r)?r[F.CODE][1]+'장 확인문제 '+r[F.LNO]+'번':r[F.ROUND]+'회 '+r[F.LNO]+'번');

/* ───────────── 필터 ───────────── */
function pass(r){
  if(FL.past==='p'?!isC(r):isC(r))return 0;                       /* 기본 = 기출만 · 확인문제는 토글 */
  if(FL.bigs.length&&!FL.bigs.includes(r[F.BIG]))return 0;
  if(FL.subs.length&&!FL.subs.includes(r[F.SUB]))return 0;
  if(FL.unit){const u=unitOf(r[F.NO]);if(!(u===FL.unit||u.startsWith(FL.unit+'.')))return 0}
  if(FL.round&&String(r[F.ROUND])!==FL.round)return 0;
  const no=r[F.NO], m=lastM(no);
  if(FL.mark==='new'&&m)return 0;
  if(FL.mark==='again'&&hist(no).filter(x=>x.m==='X').length<2)return 0;
  if(FL.mark==='weak'&&weakState(no)!=='weak')return 0;
  if(FL.mark==='less'&&weakState(no)!=='less')return 0;
  if(FL.mark==='note'&&!noteOf(no))return 0;
  if(FL.mark&&!['new','again','weak','less','note'].includes(FL.mark)&&m!==FL.mark)return 0;
  if(FL.q){const s=FL.q.toLowerCase();
    const hay=[r[F.CODE],r[F.BODY],(r[F.CH]||[]).join(' '),(r[F.BOGI]||[]).map(b=>b.내용).join(' '),noteOf(no),unitOf(no)].join(' ').toLowerCase();
    if(!hay.includes(s))return 0}
  return 1;
}

  BIGS.forEach(b=>{

      const live=T.filter(r=>FL.bigs.includes(r[F.BIG])).map(r=>r[F.SUB]);FL.subs=FL.subs.filter(x=>live.includes(x));draw()},T.filter(r=>r[F.BIG]===b).length));
    if(FL.bigs.includes(b)){

  const e=$('#fEtc');e.innerHTML='';

  if(FL.past!=='p'){

    sel.onchange=()=>{FL.round=sel.value;draw()};e.appendChild(sel);
  }
  e.appendChild(chip('안 푼 것',FL.mark==='new',()=>{FL.mark=FL.mark==='new'?'':'new';draw()}));
  e.appendChild(chip('틀린 것',FL.mark==='X',()=>{FL.mark=FL.mark==='X'?'':'X';draw()}));
  e.appendChild(chip('헷갈림',FL.mark==='Q',()=>{FL.mark=FL.mark==='Q'?'':'Q';draw()}));
  e.appendChild(chip('두 번 이상 틀림',FL.mark==='again',()=>{FL.mark=FL.mark==='again'?'':'again';draw()}));
  const nWk=T.filter(r=>weakState(r[F.NO])==='weak').length,nLs=T.filter(r=>weakState(r[F.NO])==='less').length,
        nP=T.filter(r=>lastM(r[F.NO])==='P').length,nNt=T.filter(r=>noteOf(r[F.NO])).length;
  const mchip=(lab,k,n)=>e.appendChild(chip(lab,FL.mark===k,()=>{FL.mark=FL.mark===k?'':k;draw()},n));
  mchip('⚠ 약점','weak',nWk);mchip('🌤 덜약점','less',nLs);mchip('P','P',nP);mchip('메모 있음','note',nNt);
  kx(e);
}

var VSEEN=0;
pickChoice=async function(k){

  ST[VNO]={h};await saveST();tmStop();syncMarkBtns();
  $('#card').querySelectorAll('.choices button').forEach(b=>b.classList.toggle('pick',b.dataset.c===String(k)));

}
/* 물리 mark() 위에: 사용자가 직접 찍은 마크는 같은 열람 중의 자동 마크를 갈아 끼운다(우선) */
mark=async function(m){
  const h=hist(VNO).slice();
  if(h.length&&h[h.length-1].auto&&h[h.length-1].t>=VSEEN)h.pop();
  h.push({m,t:Date.now(),s:TM.sec||0});
  ST[VNO]={h};await saveST();tmStop();syncMarkBtns();
  toast(`${h.length}회독 · ${MLABEL[m]||m}${TM.sec?' · '+secFmt(TM.sec):''}`);
  if(SET.autoNext)setTimeout(()=>go(1),380);
}

function unitStats(code,T){
  const qs=T.filter(r=>{const u=unitOf(r[F.NO]);return u===code||u.startsWith(code+'.')});
  let last=null;qs.forEach(r=>{const h=hist(r[F.NO]);if(h.length&&(!last||h[h.length-1].t>last.t))last=h[h.length-1]});
  return {n:qs.length,m:last?last.m:''};
}
function dotClass(m){return m==='O'?'g':m==='Q'?'y':m==='X'?'r':m==='P'?'k':''}

function buildTree(){
  const box=$('#trlist');if(!box)return;
  const T=DATA.filter(r=>FL.past==='p'?isC(r):!isC(r));
  const cur=VNO?unitOf(VNO):FL.unit;
  let h='';
  TOC.list.forEach(c=>{
    const cs=unitStats(c.장,T);
    h+=`<div class="trch" data-u="${c.장}"><i class="dot ${dotClass(cs.m)}"></i>${c.장}. ${esc(c.이름)}<span class="n">${cs.n}</span></div>`;
    if(FL.past==='p'){const un=T.filter(r=>unitOf(r[F.NO])===c.장).length;
      h+=`<div class="trit unm${cur===c.장?' hit':''}" data-u="${c.장}"><i class="dot"></i>미매칭<span class="n">${un}</span></div>`}
    c.절.forEach(s=>{const ss=unitStats(s.절,T);
      h+=`<div class="trsec" data-u="${s.절}"><i class="dot ${dotClass(ss.m)}"></i>${s.절} ${esc(s.이름)}<span class="n">${ss.n}</span></div>`;
      s.항목.forEach(u=>{const us=unitStats(u.코드,T);
        h+=`<div class="trit${cur===u.코드?' hit':''}" data-u="${u.코드}"><i class="dot ${dotClass(us.m)}"></i>${u.코드} ${esc(u.이름)}<span class="n">${u.쪽} · ${us.n}</span></div>`})});
  });
  box.innerHTML=h;
  box.querySelectorAll('[data-u]').forEach(el=>el.onclick=()=>treePick(el.dataset.u));
  $('#trTog').textContent=FL.past==='p'?'확인문제 보는 중 · 기출로':'기출 보는 중 · 확인문제로';

var BOOK={page:null,file:null,follow:true,docs:{}};

function pieceFor(page){for(const k in PIECES){const v=PIECES[k];if(v.인쇄시작<=page&&page<=v.인쇄끝)return v}return null}
pieceDoc=async function(file){
  if(BOOK.docs[file])return BOOK.docs[file];
  let buf=await get('pdf',file);
  if(!buf){
    if(!recToken())throw new Error('토큰 없음');
    const bar=$('#bpMsg');bar.textContent=file+' 받는 중…';
    const r=await fetch(ghUrl(CUR.PDF_DIR+file),{headers:{Authorization:'Bearer '+recToken(),Accept:'application/vnd.github.raw'},cache:'no-store'});
    if(!r.ok)throw new Error('GET '+file+' '+r.status);
    buf=await r.arrayBuffer();
    if(String.fromCharCode.apply(null,new Uint8Array(buf.slice(0,5))).indexOf('%PDF')<0)throw new Error('PDF 아님');
    await put('pdf',file,buf);
  }
  const d=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
  return BOOK.docs[file]=d;
}
bookOpen=async function(page,show){
  if(show){$('#bookpane').classList.add('open');bookTab('book')}
  page=+page;if(!page)return;
  const pc=pieceFor(page);
  BOOK.page=page;$('#bpPg').value=page;
  const info=$('#bpInfo');
  if(!pc){info.textContent='이 쪽은 조각에 없다';$('#bpMsg').textContent='';bookList(page);return}
  BOOK.file=pc.file;const k=page-pc.pdf_offset;
  info.textContent=`${pc.file} ${k}/${pc.인쇄끝-pc.인쇄시작+1}쪽 · PDF ${page+11}`;
  bookList(page);
  const cv=$('#bpc'),msg=$('#bpMsg');
  try{
    const d=await pieceDoc(pc.file);
    if(BOOK.page!==page)return;
    const pg=await d.getPage(Math.min(k,d.numPages));
    const box=$('#bpview');const avail=Math.max(200,box.clientWidth-8);
    const base=pg.getViewport({scale:1});const dpr=Math.max(1.5,Math.min(3,window.devicePixelRatio||1));
    const vp=pg.getViewport({scale:avail/base.width*dpr});
    cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);cv.style.width=avail+'px';
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    msg.textContent='';
  }catch(e){msg.textContent='쪽을 그리지 못했습니다 — '+(e.message||e)}
}

/* ───────────── 확대·타일·잉크 엔진 (판 2 · 서브노트 SUB 와 교재 모드 BK 가 같은 함수를 쓴다 — 상태 객체 Z 로 가른다) ─────────────
   Z = {vp,world,tiles,S,X,Y,MIN,MAX,gen,tile,rt,ready,pen,tool,color,w,hlw,ink,pages(),pdfPage(p),svgOf(p),inkKey(p),wheelCtrl,textSel,ignore,clamp(),onApply()}
   쪽 p = {i,key,w,h,x,y} — 월드 좌표(쪽 단위 pt) · 잉크는 쪽마다 0~1 정규화 4자리(서브노트 SPW/SPH 나누기와 같은 사상) */
/* ── add1(2026-09-04 · 스크롤 버벅임): 타일 캐시(쪽 좌표 격자 512pt · 배율 버킷 1.25^k · LRU) · 끄는 동안 렌더 금지(transform 만) · 관성 · pointermove rAF 합치기 ──
   타일 키 = 쪽|col|row|버킷 · 캐시 상한 64장 또는 4천만 픽셀 · 버킷 층(.ztl) 은 world 와 같은 이동 + scale(S/버킷) · 새 버킷이 다 그려지면 옛 버킷 층을 뗀다 */
var Z_TILE=512, Z_BUCKET=1.25, Z_TILE_MAX=64, Z_PX_BUDGET=40e6, Z_FRICTION=0.95, Z_IDLE=120, Z_VMIN=0.05;
var zBucket=S=>Math.pow(Z_BUCKET,Math.round(Math.log(S)/Math.log(Z_BUCKET)));
var zDpr=()=>Math.min(2,window.devicePixelRatio||1);
var zTileSize=(b,dpr)=>Math.min(Z_TILE,2048/(b*dpr));   /* 타일 캔버스 한 변 ≤ 2048px(아이패드 4096 한도의 절반) */
function zInit(Z){if(Z.cache)return;Z.cache=new Map();Z.px=0;Z.layers=[];Z.stats={rendered:0,hits:0,renders:0,applies:0};Z.pending=0;Z.vel=null;Z.samples=[];Z.moving=false}
function zTransform(Z){const tf=`translate(${Z.X}px,${Z.Y}px) scale(${Z.S})`;$(Z.world).style.transform=tf;if(Z.over&&$(Z.over))$(Z.over).style.transform=tf;
  (Z.layers||[]).forEach(L=>{L.el.style.transform=`translate(${Z.X}px,${Z.Y}px) scale(${Z.S/L.b})`})}
function zApply(Z){
  zInit(Z);Z.stats.applies++;zTransform(Z);
  if(Z.pct&&$(Z.pct))$(Z.pct).textContent=Math.round(Z.S*100)+'%';
  if(Z.onApply)Z.onApply();
  clearTimeout(Z.rt);if(!Z.moving&&!Z.vel)Z.rt=setTimeout(()=>zRender(Z),Z_IDLE);   /* 끄는 동안·관성 중엔 렌더 안 함 — 멈춘 뒤 120ms */
}
function zSetZoom(Z,s,cx,cy){const vp=$(Z.vp);cx=cx??vp.clientWidth/2;cy=cy??vp.clientHeight/2;s=Math.max(Z.MIN,Math.min(Z.MAX,s));
  Z.X=cx-(cx-Z.X)*(s/Z.S);Z.Y=cy-(cy-Z.Y)*(s/Z.S);Z.S=s;if(Z.clamp)Z.clamp();zApply(Z)}
function zCachePut(Z,key,cv){Z.cache.set(key,cv);Z.px+=cv.width*cv.height;
  while((Z.cache.size>Z_TILE_MAX||Z.px>Z_PX_BUDGET)&&Z.cache.size>1){const k0=Z.cache.keys().next().value;const c0=Z.cache.get(k0);Z.cache.delete(k0);Z.px-=c0.width*c0.height;
    if(c0.parentNode)c0.parentNode.removeChild(c0);Z.layers.forEach(l=>l.keys.delete(k0))}}
zTileRender=async function(Z,n,b,ts,dpr){const p=n.p;const pg=await Z.pdfPage(p);const base=pg.getViewport({scale:1});
  const x0=n.c*ts,y0=n.r*ts,w=Math.min(ts,p.w-x0),h=Math.min(ts,p.h-y0);const cw=Math.min(4096,Math.ceil(w*b*dpr)),ch=Math.min(4096,Math.ceil(h*b*dpr));if(cw<2||ch<2)return null;
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.className='ztile';cv.dataset.key=n.key;cv.style.cssText=`position:absolute;left:${(p.x+x0)*b}px;top:${(p.y+y0)*b}px;width:${w*b}px;height:${h*b}px`;
  const k=b*dpr*(p.w/base.width);const vpv=pg.getViewport({scale:k,offsetX:-x0*b*dpr,offsetY:-y0*b*dpr});
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vpv}).promise;return cv}
/* 보이는 타일만 — 캐시에 있으면 붙이고 없는 것만 그린다 · 화면 밖 타일은 DOM 에서 떼되 캐시에 둔다 · 통째 교체 없음 */
zRender=async function(Z){
  zInit(Z);if(!Z.ready)return;const my=++Z.gen;Z.stats.renders++;Z.busy=my;   /* busy = 진행 중인 렌더 번호(검산·디버그용) */
  try{await zRenderBody(Z,my)}finally{if(Z.busy===my)Z.busy=0}}
zRenderBody=async function(Z,my){
  if(Z.onSettle)Z.onSettle();
  const vp=$(Z.vp),W=vp.clientWidth,H=vp.clientHeight,dpr=zDpr();const S=Z.S,X=Z.X,Y=Z.Y;const b=zBucket(S),ts=zTileSize(b,dpr);
  let L=Z.layers.find(l=>l.b===b);
  if(!L){L={b,el:document.createElement('div'),keys:new Set()};L.el.className='ztl';L.el.dataset.b=b;$(Z.tiles).appendChild(L.el);Z.layers.push(L)}
  Z.layers.forEach(l=>{l.el.style.zIndex=l===L?2:1});zTransform(Z);
  const vx0=(-X)/S,vy0=(-Y)/S,vx1=(W-X)/S,vy1=(H-Y)/S;   /* 뷰포트의 월드 좌표 */
  const need=[];
  for(const p of Z.pages()){if(p.x>vx1||p.x+p.w<vx0||p.y>vy1||p.y+p.h<vy0)continue;
    if(Z.ink[p.key]===undefined){await zInkLoad(Z,p);if(my!==Z.gen)return}
    const c0=Math.max(0,Math.floor((vx0-p.x)/ts)),c1=Math.min(Math.ceil(p.w/ts)-1,Math.floor((vx1-p.x)/ts)),r0=Math.max(0,Math.floor((vy0-p.y)/ts)),r1=Math.min(Math.ceil(p.h/ts)-1,Math.floor((vy1-p.y)/ts));

ghPutBin=async function(repo,path,bytes){

  box.querySelectorAll('span[data-pit]').forEach(sp=>{sp.textContent=sp.dataset.t;delete sp.dataset.pit});
  const mine=Object.keys(BP).filter(k=>k.split('|')[0]===String(p.pr));if(!mine.length)return;
  const byJ={};mine.forEach(k=>{const j=k.split('|')[1];(byJ[j]=byJ[j]||[]).push(k)});
  Object.keys(byJ).forEach(j=>{const sp=box.querySelector('span[data-j="'+j+'"]');const text=sp?sp.dataset.t:'';const parts=text.split(/(\s+)/);const idx=[];parts.forEach((pt,n)=>{if(pt&&!/^\s+$/.test(pt))idx.push(n)});
    const hit={};
    byJ[j].forEach(key=>{const [,,wi,word]=key.split('|');let n=idx[+wi];if(!(n!==undefined&&parts[n]===word))n=idx.find(x=>parts[x]===word);   /* 좌표 밀림 — 같은 span 안 같은 단어 */
      if(n!==undefined&&!hit[n])hit[n]=key;else{const c=document.createElement('i');c.className='pitchip orph';c.dataset.key=key;c.title='고아 — 「'+word+'」 '+String(BP[key].t).slice(0,40);orph.appendChild(c)}});
    if(sp&&Object.keys(hit).length){sp.innerHTML=parts.map((x,n)=>hit[n]?`<b class="pitw" data-key="${esc(hit[n])}" title="${esc(String(BP[hit[n]].t).slice(0,60))}">${esc(x)}<i class="pitchip"></i></b>`:esc(x)).join('');sp.dataset.pit='1'}});
}

  vp.addEventListener('pointerup',cancel,true);vp.addEventListener('pointercancel',cancel,true);

$('#btnFirst').onclick=()=>{const L=filtered().map(r=>r[F.NO]);if(L.length)openView(L[0],L)};

<script>
/* ===== 학습로그 요약 (2026-08-11 추가) =====================================
   오늘 푸었던 문제 기록(status.h 의 t 값)을 모아 요약 텍스트로 만든다.
   하루의 시작은 새벽 4시. 기존 데이터는 읽기만 한다. ==================== */
(function () {
  var DAY_START_HOUR = 4;
  /* offset: 0 = 오늘, -1 = 어제, -2 = 그저께 … */
  function dayRange(offset) {
    var now = new Date();
    var s = new Date(now); s.setHours(DAY_START_HOUR, 0, 0, 0);
    if (now.getTime() < s.getTime()) s.setDate(s.getDate() - 1);
    s.setDate(s.getDate() + (offset || 0));
    var e = new Date(s); e.setDate(e.getDate() + 1);
    return { start: s.getTime(), end: e.getTime(), label: s };
  }
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }

  /* 문제번호 → 교재 행 (단원명을 알아내기 위해) */
  var ROW = null;
  function rowOf(no) {
    if (!ROW) {
      ROW = {};
      try { DATA.forEach(function (r) { ROW[String(r[F.NO])] = r; }); } catch (e) {}
    }
    return ROW[String(no)] || null;
  }
  function secFmt2(x) {
    x = Math.max(0, Math.round(x || 0));
    return Math.floor(x / 60) + "'" + String(x % 60).padStart(2, '0') + '"';
  }

  function collect(offset) {
    var R = dayRange(offset);
    var st = (typeof ST === 'object' && ST) ? ST : {};
    var items = [];
    Object.keys(st).forEach(function (no) {
      var h = (st[no] && st[no].h) || [];
      h.forEach(function (rec) {
        if (!rec || !rec.t) return;
        if (rec.t < R.start || rec.t >= R.end) return;
        var r = rowOf(no);
        items.push({
          no: no,
          m: rec.m || '?',
          sec: rec.s || 0,
          t: rec.t,
          sub: r ? (r[F.SUB] || '') : '',
          big: r ? (r[F.BIG] || '') : ''
        });
      });
    });
    items.sort(function (a, b) { return a.t - b.t; });
    return { date: ymd(R.label), offset: offset || 0, items: items };
  }

  function buildText(data, memo) {
    var items = data.items;
    if (!items.length) return data.date + ' — 오늘 풀이 기록이 없습니다.';

    /* 소단원별로 묶는다 (오늘 푸어본 순서 유지) */
    var order = [], group = {};
    items.forEach(function (it) {
      var key = it.sub || it.big || '미분류';
      if (!group[key]) { group[key] = []; order.push(key); }
      group[key].push(it);
    });

    var lines = ['[' + CUR.LOG + ' 학습로그] ' + data.date];
    var TO = 0, TQ = 0, TX = 0, TP = 0, TSEC = 0;

    order.forEach(function (key) {
      var g = group[key];
      var o = 0, q = 0, x = 0, p = 0, sec = 0;
      g.forEach(function (it) {
        if (it.m === 'O') o++; else if (it.m === 'Q') q++; else if (it.m === 'X') x++; else if (it.m === 'P') p++;
        sec += it.sec;
      });
      TO += o; TQ += q; TX += x; TP += p; TSEC += sec;
      var den = g.length - p;   /* P(패스) 는 정답률 분모에서 뺀다 */
      var rate = den ? Math.round(o * 100 / den) : 0;
      lines.push('- ' + key + ' : ' + g.length + '문항 (정답률 ' + rate + '% · 헷갈림 ' + q + (p ? ' · P ' + p : '') + ')');
      lines.push('  ' + g.map(function (it) {
        return it.no + ' ' + it.m + (it.sec ? ' ' + secFmt2(it.sec) : '');
      }).join(' | '));
    });

    var total = items.length;
    lines.push('합계: ' + total + '문항 · O ' + TO + ' · 헷갈림 ' + TQ + ' · X ' + TX + ' · P ' + TP +
               (TSEC ? ' · ' + Math.round(TSEC / 60) + '분' : ''));

    /* 오래 걸린 문항 — 평균의 1.5배 이상이면서 3분 넘는 것 */
    var timed = items.filter(function (it) { return it.sec > 0; });
    if (timed.length >= 3) {
      var avg = timed.reduce(function (s, it) { return s + it.sec; }, 0) / timed.length;
      var slow = timed.filter(function (it) { return it.sec >= Math.max(180, avg * 1.5); })
                      .sort(function (a, b) { return b.sec - a.sec; });
      if (slow.length) {
        lines.push('오래 걸림(평균 ' + secFmt2(avg) + '): ' +
                   slow.map(function (it) { return it.no + ' ' + secFmt2(it.sec); }).join(', '));
      }
    }

    if (memo && memo.trim()) lines.push('메모: ' + memo.trim());
    return lines.join(String.fromCharCode(10));
  }

  function openPanel() {
    var offset = 0;
    var data = collect(offset);
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(17,24,39,.7);display:flex;align-items:center;justify-content:center;padding:16px';
    wrap.innerHTML =
      '<div style="background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,.25)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
          '<div style="font-weight:800;font-size:16px">📝 학습로그</div>' +
          '<div style="display:flex;align-items:center;gap:6px">' +
            '<button id="plg-prev" style="background:#f3f4f6;border:0;border-radius:8px;width:30px;height:30px;font-weight:800;cursor:pointer">◀</button>' +
            '<span id="plg-date" style="font-size:13px;font-weight:700;min-width:104px;text-align:center"></span>' +
            '<button id="plg-next" style="background:#f3f4f6;border:0;border-radius:8px;width:30px;height:30px;font-weight:800;cursor:pointer">▶</button>' +
          '</div>' +
        '</div>' +
        '<textarea id="plg-text" style="width:100%;height:220px;font-size:12.5px;line-height:1.6;border:1px solid #e5e7eb;border-radius:10px;padding:10px;font-family:inherit"></textarea>' +
        '<input id="plg-memo" placeholder="한줄 메모 (깨달은 것·헷갈린 지점)" style="width:100%;margin-top:8px;border:1px solid #e5e7eb;border-radius:10px;padding:9px;font-size:13px">' +
        '<div style="display:flex;gap:8px;margin-top:12px">' +
          '<button id="plg-copy" style="flex:1;background:#111827;color:#fff;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer">복사하기</button>' +
          '<button id="plg-close" style="flex:0 0 90px;background:#f3f4f6;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer">닫기</button>' +
        '</div>' +
        '<div id="plg-msg" style="font-size:12px;color:#6b7280;margin-top:8px">화살표로 지난 날짜도 볼 수 있어요. 복사해서 노션 · 클로드에 붙여넣으세요.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var ta = wrap.querySelector('#plg-text'), memo = wrap.querySelector('#plg-memo');
    var dateEl = wrap.querySelector('#plg-date'), nextBtn = wrap.querySelector('#plg-next');
    var render = function () {
      ta.value = buildText(data, memo.value);
      dateEl.textContent = data.date + (offset === 0 ? ' (오늘)' : offset === -1 ? ' (어제)' : '');
      nextBtn.disabled = (offset >= 0);
      nextBtn.style.opacity = (offset >= 0) ? '.35' : '1';
    };
    var move = function (d) {
      if (offset + d > 0) return;
      offset += d;
      data = collect(offset);
      render();
    };
    render();
    memo.addEventListener('input', render);
    wrap.querySelector('#plg-prev').onclick = function () { move(-1); };
    nextBtn.onclick = function () { move(1); };
    wrap.querySelector('#plg-close').onclick = function () { wrap.remove(); };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) wrap.remove(); });
    wrap.querySelector('#plg-copy').onclick = function () {
      ta.select();
      var done = function () { wrap.querySelector('#plg-msg').textContent = '복사됐습니다.'; };
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done).catch(function () { document.execCommand('copy'); done(); });
      else { document.execCommand('copy'); done(); }
    };
  }

  const btn = document.createElement('button');
  btn.textContent = '📝 학습로그';
  btn.style.cssText = 'position:fixed;right:14px;bottom:70px;z-index:99998;background:#111827;color:#fff;border:0;border-radius:999px;padding:11px 16px;font-weight:700;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer';
  btn.onclick = openPanel;
  if (document.body) document.body.appendChild(btn);
  else window.addEventListener('DOMContentLoaded', function () { document.body.appendChild(btn); });
})();
</script>
